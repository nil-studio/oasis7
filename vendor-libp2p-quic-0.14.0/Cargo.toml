[package]
name = "libp2p-quic"
version = "0.14.0"
authors = ["Parity Technologies <admin@parity.io>"]
edition = "2024"
rust-version = "1.88.0"
description = "TLS based QUIC transport implementation for libp2p"
repository = "https://github.com/libp2p/rust-libp2p"
license = "MIT"

[dependencies]
futures = { version = "0.3" }
futures-timer = { version = "3.0" }
if-watch = { version = "3.2" }
libp2p-core = { git = "https://github.com/libp2p/rust-libp2p", rev = "2d8497b2615086bd88018ef3a1fb32bc613a07ca" }
libp2p-tls = { git = "https://github.com/libp2p/rust-libp2p", rev = "2d8497b2615086bd88018ef3a1fb32bc613a07ca" }
libp2p-identity = { version = "0.3.0" }
quinn = { version = "0.11", default-features = false, features = ["rustls-aws-lc-rs", "futures-io"] }
quinn-proto = { version = "0.11", default-features = false, features = ["bloom", "log", "ring"] }
rand = { version = "0.10" }
thiserror = { version = "2" }
tokio = { version = "1.53", default-features = false, features = ["net", "rt", "time"], optional = true }
tracing = { version = "0.1" }
socket2 = "0.6"
ring = { version = "0.17" }

[features]
tokio = ["dep:tokio", "if-watch/tokio", "quinn/runtime-tokio"]

# Passing arguments to the docsrs builder in order to properly document cfg's.
# More information: https://docs.rs/about/builds#cross-compiling
[package.metadata.docs.rs]
all-features = true

[dev-dependencies]
libp2p-identity = { version = "0.3.0", features = ["rand"] }
libp2p-muxer-test-harness = { git = "https://github.com/libp2p/rust-libp2p", rev = "2d8497b2615086bd88018ef3a1fb32bc613a07ca" }
libp2p-noise = { git = "https://github.com/libp2p/rust-libp2p", rev = "2d8497b2615086bd88018ef3a1fb32bc613a07ca" }
libp2p-tcp = { git = "https://github.com/libp2p/rust-libp2p", rev = "2d8497b2615086bd88018ef3a1fb32bc613a07ca", features = ["tokio"] }
libp2p-yamux = { git = "https://github.com/libp2p/rust-libp2p", rev = "2d8497b2615086bd88018ef3a1fb32bc613a07ca" }
quickcheck = "1"
tokio = { version = "1.53", default-features = false, features = ["macros", "rt-multi-thread", "time"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[[test]]
name = "stream_compliance"
required-features = ["tokio"]


[workspace]

[package.metadata.oasis7-compat]
upstream-revision = "2d8497b2615086bd88018ef3a1fb32bc613a07ca"
