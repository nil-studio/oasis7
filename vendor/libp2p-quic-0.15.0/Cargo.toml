[package]
name = "libp2p-quic"
version = "0.15.0"
authors = ["Parity Technologies <admin@parity.io>"]
edition = "2024"
rust-version = "1.89.0"
description = "TLS based QUIC transport implementation for libp2p"
repository = "https://github.com/libp2p/rust-libp2p"
license = "MIT"

[dependencies]
futures = { version = "0.3" }
futures-timer = { version = "3.0.4" }
if-watch = { version = "3.2" }
libp2p-core = { git = "https://github.com/libp2p/rust-libp2p", rev = "2cb3c04346fdcb0ecf6717728664602378edac13" }
libp2p-tls = { git = "https://github.com/libp2p/rust-libp2p", rev = "2cb3c04346fdcb0ecf6717728664602378edac13" }
libp2p-identity = { version = "0.3.1" }
quinn = { version = "0.11", default-features = false, features = ["rustls-aws-lc-rs", "futures-io"] }
quinn-proto = { version = "0.11", default-features = false, features = ["bloom", "log", "ring"] }
rand = { version = "0.10" }
thiserror = { version = "2" }
tokio = { version = "1.53", default-features = false, features = ["net", "rt", "time"], optional = true }
tracing = { version = "0.1" }
socket2 = "0.6"
ring = { version = "0.17" }

[features]
tokio = ["dep:tokio", "if-watch/tokio", "quinn/runtime-tokio"]

# Passing arguments to the docsrs builder in order to properly document cfg's.
# More information: https://docs.rs/about/builds#cross-compiling
[package.metadata.docs.rs]
all-features = true

[package.metadata.oasis7-compat]
upstream-revision = "2cb3c04346fdcb0ecf6717728664602378edac13"

# Standalone workspace lock for CodeQL build-mode=none locked Cargo metadata extraction.
[workspace]

[patch.crates-io]
if-watch = { path = "../if-watch-3.2.2" }
