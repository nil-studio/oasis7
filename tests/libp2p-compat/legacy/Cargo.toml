[package]
name = "oasis7-libp2p-compat-legacy"
version = "0.1.0"
edition = "2024"
[workspace]
[[bin]]
name = "peer"
path = "src/main.rs"
[dependencies]
libp2p = { version = "=0.56.0", default-features = false, features = ["cbor", "gossipsub", "macros", "noise", "request-response", "tcp", "quic", "tokio", "yamux"] }
futures = "0.3"
oasis7-libp2p-compat-protocol = { path = "../common" }
