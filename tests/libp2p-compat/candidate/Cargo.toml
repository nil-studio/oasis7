[package]
name = "oasis7-libp2p-compat-candidate"
version = "0.1.0"
edition = "2024"
[workspace]
[[bin]]
name = "peer"
path = "src/main.rs"
[dependencies]
libp2p = { git = "https://github.com/libp2p/rust-libp2p", rev = "2d8497b2615086bd88018ef3a1fb32bc613a07ca", default-features = false, features = ["cbor", "gossipsub", "macros", "noise", "request-response", "tcp", "quic", "tokio", "yamux"] }
futures = "0.3"
oasis7-libp2p-compat-protocol = { path = "../common" }
[patch."https://github.com/libp2p/rust-libp2p"]
libp2p-swarm = { path = "../../../vendor-libp2p-swarm-0.48.0" }
