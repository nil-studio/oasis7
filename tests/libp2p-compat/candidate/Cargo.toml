[package]
name = "oasis7-libp2p-compat-candidate"
version = "0.1.0"
edition = "2024"
[workspace]
[[bin]]
name = "peer"
path = "src/main.rs"
[dependencies]
libp2p = { git = "https://github.com/libp2p/rust-libp2p", rev = "2cb3c04346fdcb0ecf6717728664602378edac13", default-features = false, features = ["cbor", "gossipsub", "macros", "noise", "request-response", "tcp", "quic", "tokio", "yamux"] }
futures = "0.3"
oasis7-libp2p-compat-protocol = { path = "../common" }

[patch.crates-io]
if-watch = { path = "../../../vendor/if-watch-3.2.2" }
