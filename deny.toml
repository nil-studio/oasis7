[graph]
all-features = false
no-default-features = false
targets = []

[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
# Single approved maintenance-risk exception, not a vulnerability fix.
# cargo-deny 0.19.9 applies this ID globally to direct AND transitive chrono use;
# it cannot restrict this exception to Aliyun/worker paths and has no expiry field.
# Re-review when chrono's maintenance/advisory status changes, a supported upstream
# replacement is available, or our dependency usage changes. No automatic expiry.
# Other IDs (including future vulnerabilities), yanked checks and bans remain active.
# Changes to this exception require independent security review.
ignore = [
  { id = "RUSTSEC-2026-0543", reason = "Accept chrono's unmaintained status across current direct and transitive uses pending compatible upstream migration; this is maintenance-risk acceptance, not a vulnerability fix. Re-review on advisory/maintenance changes, upstream replacement, or dependency-usage changes." },
]

[licenses]
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CDLA-Permissive-2.0",
  "CC0-1.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]
exceptions = [
  { allow = ["Apache-2.0", "MIT", "OFL-1.1", "Ubuntu-font-1.0"], crate = "epaint_default_fonts@0.34.3" },
]
confidence-threshold = 0.8
unused-allowed-license = "allow"

[bans]
# Check actual package identities, including renamed and transitive dependencies.
deny = [
  { name = "serde_cbor" },
  { name = "paste" },
  { name = "ttf-parser" },
]
multiple-versions = "warn"
wildcards = "warn"
highlight = "all"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
