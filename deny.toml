[graph]
all-features = false
no-default-features = false
targets = []

[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
# No RustSec exceptions remain. Changes require independent security review.
ignore = []

[licenses]
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CDLA-Permissive-2.0",
  "CC0-1.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]
exceptions = [
  { allow = ["Apache-2.0", "MIT", "OFL-1.1", "Ubuntu-font-1.0"], crate = "epaint_default_fonts@0.34.3" },
]
confidence-threshold = 0.8
unused-allowed-license = "allow"

[bans]
# Check actual package identities, including renamed and transitive dependencies.
deny = [
  { name = "serde_cbor" },
  { name = "paste" },
  { name = "ttf-parser" },
]
multiple-versions = "warn"
wildcards = "warn"
highlight = "all"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
