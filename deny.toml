[graph]
all-features = false
no-default-features = false
targets = []

[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = [
  # Baseline remaining unmaintained dependency advisories; required CI continues
  # to block net-new advisories. Each retained exception has a finite review date.
  # Each ignore must keep a `rustsec-ignore` metadata line immediately above it.
  # `scripts/check-rustsec-ignore-baseline.sh` fails on missing metadata, expired
  # metadata, or unreviewed changes to the approved ignore set.
  # rustsec-ignore: owner=repository_health_engineer; crate=serde_cbor; scope=workspace serde_cbor serialization debt; reason=RUSTSEC-2021-0127 reports no patched release and locked serde_cbor 0.11.2 remains across protocol runtime consensus and WASM consumers, so retain for one review window to plan a separately tested serialization migration and revalidate by 2026-10-31; expiry=2026-10-31; validation=cargo tree --locked --all-features --target all -i serde_cbor; local_crates=oasis7_runtime,oasis7_world_service,oasis7_simulator,scenario_test_runner,oasis7,oasis7_agent_harness,oasis7_cas,oasis7_chain_runtime,oasis7_client_cli,oasis7_client_storage,oasis7_consensus,oasis7_distfs,oasis7_formal_protocol,oasis7_game_client,oasis7_launcher_backend,oasis7_model_provider,oasis7_net,oasis7_node,oasis7_ops_tools,oasis7_proto,oasis7_provider_local_bridge,oasis7_provider_tools,oasis7_viewer_runtime,oasis7_wasm_executor,oasis7_wasm_materializer,oasis7_wasm_sdk,wasm_module_observe
  "RUSTSEC-2021-0127", # serde_cbor unmaintained
  # rustsec-ignore: owner=repository_health_engineer; crate=paste; scope=transitive network-interface dependency via if-watch and netlink; reason=RUSTSEC-2024-0436 reports paste 1.0.15 unmaintained with no patched release and the locked if-watch/netlink closure reaches oasis7_net, oasis7_node, and oasis7, so retain for one review window and revalidate upstream replacement by 2026-10-31, while the independent Game Client Harness and Provider no longer reach this closure after removing backend dev dependencies; expiry=2026-10-31; validation=cargo tree --locked --all-features --target all -i paste; local_crates=oasis7,oasis7_chain_runtime,oasis7_client_cli,oasis7_launcher_backend,oasis7_net,oasis7_node,oasis7_ops_tools,oasis7_provider_local_bridge,oasis7_provider_tools,oasis7_viewer_runtime
  "RUSTSEC-2024-0436", # paste unmaintained
  # rustsec-ignore: owner=repository_health_engineer; crate=ttf-parser; scope=transitive UI font parsing via ab_glyph/epaint/winit/bevy; reason=RUSTSEC-2026-0192 reports no patched release and locked ttf-parser 0.25.1 reaches oasis7_client_launcher through eframe and pixel_world_bridge through bevy, so retain for one review window to assess a maintained parser migration and revalidate by 2026-10-31; expiry=2026-10-31; validation=cargo tree --locked --all-features --target all -i ttf-parser; local_crates=oasis7_client_launcher,pixel_world_bridge
  "RUSTSEC-2026-0192", # ttf-parser unmaintained
]

[licenses]
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CDLA-Permissive-2.0",
  "CC0-1.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]
exceptions = [
  { allow = ["Apache-2.0", "MIT", "OFL-1.1", "Ubuntu-font-1.0"], crate = "epaint_default_fonts@0.33.3" },
]
confidence-threshold = 0.8
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "warn"
highlight = "all"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
