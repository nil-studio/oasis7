[workspace]
members = ["crates/oasis7_model_provider",
"crates/oasis7_game_client",
    "crates/oasis7_client_api",
    "crates/oasis7_agent_api",
    "crates/oasis7_agent_harness",
    "crates/oasis7_model_provider",
    "crates/oasis7",
    "crates/oasis7_simulator",
    "crates/oasis7_runtime",
    "crates/oasis7_world_service",
    "crates/oasis7_chain_runtime",
    "crates/oasis7_observability",
    "crates/oasis7_launcher_config",
    "crates/oasis7_wasm_materializer",
    "crates/oasis7_letai_credit_adapter",
    "crates/oasis7_newapi_bridge_service",
    "crates/oasis7_provider_local_bridge",
    "crates/oasis7_provider_tools",
    "crates/oasis7_launcher_backend",
    "crates/oasis7_hosted_access",
    "crates/oasis7_client_cli",
    "crates/oasis7_ops_tools",
    "crates/oasis7_viewer_runtime",
    "crates/oasis7_client_launcher",
    "crates/oasis7_launcher_ui",
    "crates/oasis7_consensus",
    "crates/oasis7_local_signer",
    "crates/oasis7_signer_protocol",
    "crates/oasis7_client_storage",
    "crates/oasis7_context",
    "crates/oasis7_secure_envelope",
    "crates/oasis7_distfs",
    "crates/oasis7_cas",
    "crates/oasis7_formal_protocol",
    "crates/oasis7_net",
    "crates/oasis7_node",
    "crates/pixel_world_bridge",
    "crates/oasis7_proto",
    "crates/oasis7_wasm_build",
    "crates/oasis7_wasm_abi",
    "crates/oasis7_wasm_executor",
    "crates/oasis7_wasm_sdk",
    "crates/oasis7_wasm_router",
    "crates/oasis7_wasm_store",
    "tools/scenario_test_runner",
    "tools/wasm_build_suite",
    "tools/wasm_module_observe",
]
exclude = ["tools/oasis7-command-center"]
resolver = "2"

[workspace.dependencies]
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_cbor = "0.11"
serde_json = "1"
sha2 = "0.11"
wasm-encoder = "0.261"
wasmparser = "0.256"

[profile.packaging]
# Keep native distribution artifacts small without applying native-oriented
# linker/codegen tuning to wasm32 builds. Trunk intentionally continues to use
# Cargo's standard `release` profile so its wasm-opt feature validation sees
# the toolchain's supported WebAssembly feature set.
inherits = "release"
strip = "symbols"
lto = "thin"
codegen-units = 1

[profile.dev.package.epaint]
# On wasm32-unknown-unknown, `std::time::Instant` is unavailable.
# epaint's debug deadlock checks call `parking_lot::try_*_for`, which panics there.
debug-assertions = false

[patch.crates-io]
egui-winit = { path = "vendor-egui-winit-0.33.3" }

[patch."https://github.com/libp2p/rust-libp2p"]
libp2p-swarm = { path = "vendor-libp2p-swarm-0.48.0" }

# Lifecycle image qualification repeatedly hashes complete executable files.
# Keep the shipping hash checks affordable in local debug/test builds.
[profile.dev.package."sha2@0.11.0"]
opt-level = 3

# Formal CAS reads authenticate every request and protected response. Preserve
# those checks while avoiding unoptimized curve arithmetic in debug fixtures.
[profile.dev.package."curve25519-dalek@5.0.0"]
opt-level = 3
