[package]
name = "oasis7-command-center-core"
version = "0.1.0"
edition = "2024"

[dependencies]
getrandom = "0.4"
zeroize = "1"
oasis7_context = { path = "../../../crates/oasis7_context" }
oasis7_local_signer = { path = "../../../crates/oasis7_local_signer" }
oasis7_signer_protocol = { path = "../../../crates/oasis7_signer_protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
thiserror = "2"
ts-rs = { version = "11", features = ["serde-compat"] }
sha2 = "0.10"
pulldown-cmark = "0.13"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
