[package]
name = "oasis7_net"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
path = "src/lib.rs"

[features]
default = ["self_tests", "libp2p"]
libp2p = ["dep:libp2p", "dep:futures", "dep:pin-project", "dep:tokio"]
# Reserved for backward-compatible feature flags; runtime bridge logic no longer
# lives in this crate to avoid package-level dependency cycles.
runtime_bridge = []
self_tests = []

[dependencies]
blake3 = "1"
oasis7_distfs = { version = "0.1.0", path = "../oasis7_distfs", optional = true }
oasis7_proto = { version = "0.1.0", path = "../oasis7_proto" }
oasis7_wasm_abi = { version = "0.1.0", path = "../oasis7_wasm_abi" }
serde = { version = "1", features = ["derive"] }
serde_cbor = "0.11"
serde_json = "1"
hex = "0.4"
tracing = "0.1"
pin-project = { version = "1", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
futures = { version = "0.3", optional = true }
libp2p = { git = "https://github.com/libp2p/rust-libp2p", rev = "2d8497b2615086bd88018ef3a1fb32bc613a07ca", optional = true, default-features = false, features = ["autonat", "cbor", "dcutr", "gossipsub", "kad", "macros", "noise", "quic", "relay", "rendezvous", "request-response", "tcp", "tokio", "yamux"] }
tokio = { version = "1", optional = true, features = ["rt", "time"] }
