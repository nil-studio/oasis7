[package]
name = "oasis7_client_launcher"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
oasis7_launcher_config = { version = "0.1.0", path = "../oasis7_launcher_config" }
oasis7_client_api = { version = "0.1.0", path = "../oasis7_client_api" }
oasis7_launcher_ui = { version = "0.1.0", path = "../oasis7_launcher_ui" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
eframe = { version = "0.34", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
reqwest = { version = "0.13.4", features = ["blocking", "json", "rustls"], default-features = false }
toml = "0.9.12"

[target.'cfg(target_arch = "wasm32")'.dependencies]
eframe = { version = "0.34", default-features = false, features = ["default_fonts", "glow"] }
gloo-net = "0.7"
js-sys = "0.3"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Storage"] }
web-time = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
ed25519-dalek = "3"
hex = "0.4"
