[package]
name = "oasis7_protocol_tools"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
oasis7_client_api = { path = "../oasis7_client_api" }
oasis7_proto = { path = "../oasis7_proto" }
ed25519-dalek = { version = "3", features = ["rand_core"] }
hex = "0.4"
reqwest = { version = "0.13.4", features = ["blocking", "json", "rustls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = []
test_tier_required = []
test_tier_full = ["test_tier_required"]

[dev-dependencies]
oasis7 = { path = "../oasis7", default-features = false, features = ["test_tier_required"] }
