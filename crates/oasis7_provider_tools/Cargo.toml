[package]
name = "oasis7_provider_tools"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
oasis7_runtime_host = { path = "../oasis7_runtime_host" }
oasis7_runtime = { path = "../oasis7_runtime", default-features = false }
oasis7_simulator = { path = "../oasis7_simulator" }
oasis7_agent_api = { path = "../oasis7_agent_api" }
oasis7_wasm_abi = { path = "../oasis7_wasm_abi" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["wasmtime"]
wasmtime = ["oasis7_runtime/wasmtime"]
test_tier_required = ["oasis7_simulator/test_tier_required", "oasis7_runtime/test_tier_required", "oasis7_runtime_host/test_tier_required"]
test_tier_full = ["test_tier_required", "oasis7_simulator/test_tier_full", "oasis7_runtime/test_tier_full", "oasis7_runtime_host/test_tier_full"]
