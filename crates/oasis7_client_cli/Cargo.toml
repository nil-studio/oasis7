[package]
name = "oasis7_client_cli"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
oasis7_simulator = { path = "../oasis7_simulator" }
oasis7_proto = { version = "0.1.0", path = "../oasis7_proto" }
oasis7 = { version = "0.1.0", path = "../oasis7", default-features = false }
oasis7_client_api = { version = "0.1.0", path = "../oasis7_client_api" }
ed25519-dalek = { version = "3", features = ["rand_core"] }
getrandom = "0.4"
hex = "0.4"
reqwest = { version = "0.13.4", features = ["blocking", "json", "rustls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = []
node-libp2p = ["oasis7/node-libp2p"]
wasmtime = ["oasis7/wasmtime"]
viewer_live_integration = ["oasis7/viewer_live_integration"]
test_tier_required = ["oasis7/test_tier_required"]
test_tier_full = ["test_tier_required", "oasis7/test_tier_full"]

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
oasis7 = { version = "0.1.0", path = "../oasis7", default-features = false, features = ["test_tier_required", "wasmtime", "node-libp2p"] }
