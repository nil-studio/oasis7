[package]
name = "oasis7_client_cli"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
oasis7_runtime = { path = "../oasis7_runtime", default-features = false }
oasis7_runtime_host = { path = "../oasis7_runtime_host" }
oasis7_simulator = { path = "../oasis7_simulator" }
oasis7_proto = { version = "0.1.0", path = "../oasis7_proto" }
oasis7_client_api = { version = "0.1.0", path = "../oasis7_client_api" }
ed25519-dalek = { version = "3", features = ["rand_core"] }
getrandom = "0.4"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = []
wasmtime = ["oasis7_runtime/wasmtime"]
viewer_live_integration = ["oasis7_viewer_runtime/viewer_live_integration"]
test_tier_required = ["oasis7_runtime_host/test_tier_required", "oasis7_simulator/test_tier_required", "oasis7_runtime/test_tier_required"]
test_tier_full = ["test_tier_required", "oasis7_runtime_host/test_tier_full", "oasis7_simulator/test_tier_full", "oasis7_runtime/test_tier_full"]

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
oasis7_runtime = { path = "../oasis7_runtime", default-features = false, features = ["test_tier_required", "wasmtime"] }
oasis7_world_service = { path = "../oasis7_world_service", default-features = false, features = ["test_tier_required", "wasmtime"] }
oasis7_viewer_runtime = { path = "../oasis7_viewer_runtime", default-features = false, features = ["test_tier_required"] }
