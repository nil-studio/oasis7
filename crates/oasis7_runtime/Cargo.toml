[package]
name = "oasis7_runtime"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
oasis7_agent_api = { path = "../oasis7_agent_api" }
serde = { version = "1", features = ["derive"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
oasis7_client_api = { path = "../oasis7_client_api" }
oasis7_proto = { path = "../oasis7_proto" }
oasis7_wasm_abi = { path = "../oasis7_wasm_abi" }
oasis7_distfs = { path = "../oasis7_distfs" }
oasis7_formal_protocol = { path = "../oasis7_formal_protocol" }
oasis7_wasm_materializer = { path = "../oasis7_wasm_materializer" }
oasis7_wasm_executor = { path = "../oasis7_wasm_executor", default-features = false }
oasis7_wasm_router = { path = "../oasis7_wasm_router" }
oasis7_wasm_store = { path = "../oasis7_wasm_store" }
hex = "0.4"
sha2 = "0.11"
serde_json = "1"
serde_cbor = "0.11"
blake3 = "1"
unicode-normalization = "0.1"
ed25519-dalek = { version = "3", features = ["rand_core"] }
hmac = "0.13"
cap-std = "4"
cap-fs-ext = "4"
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem"] }

[features]
default = ["wasmtime"]
wasmtime = ["oasis7_wasm_executor/wasmtime"]
test_tier_required = []
test_tier_full = ["test_tier_required"]

# Nondefault test-artifact capability for private cross-crate persistence fault seams.
# Cargo feature unification and --all-features enable it; do not ship those test artifacts.
test-support = []
