[package]
name = "oasis7_provider_local_bridge"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
oasis7_simulator = { path = "../oasis7_simulator" }
oasis7 = { path = "../oasis7", default-features = false }
oasis7_observability = { path = "../oasis7_observability" }
oasis7_letai_credit_adapter = { path = "../oasis7_letai_credit_adapter" }
oasis7_wasm_abi = { path = "../oasis7_wasm_abi" }
reqwest = { version = "0.13.4", features = ["blocking", "json", "rustls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
hex = "0.4"
tracing = "0.1"

[features]
default = ["wasmtime", "node-libp2p"]
wasmtime = ["oasis7/wasmtime"]
node-libp2p = ["oasis7/node-libp2p"]
test_tier_required = ["oasis7/test_tier_required"]
test_tier_full = ["test_tier_required", "oasis7/test_tier_full"]
viewer_live_integration = ["oasis7/viewer_live_integration"]
