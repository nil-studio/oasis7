[package]
name = "oasis7_runtime_host"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
oasis7_formal_protocol = { path = "../oasis7_formal_protocol" }
oasis7_agent_api = { path = "../oasis7_agent_api" }
oasis7_agent_harness = { path = "../oasis7_agent_harness" }
oasis7_client_api = { path = "../oasis7_client_api" }
oasis7_proto = { path = "../oasis7_proto" }
oasis7_simulator = { path = "../oasis7_simulator" }
oasis7_wasm_abi = { path = "../oasis7_wasm_abi" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
oasis7_model_provider = { path = "../oasis7_model_provider" }
oasis7_runtime = { path = "../oasis7_runtime", default-features = false }
oasis7_world_service = { path = "../oasis7_world_service", default-features = false }
blake3 = "1"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json", "rustls"] }
toml = "0.9.12"

[dev-dependencies]
oasis7_hosted_access = { path = "../oasis7_hosted_access", features = ["test-support"] }
serde_cbor = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
async-openai = { version = "0.43.0", default-features = false, features = ["responses", "rustls"] }

[features]
default = []
test_tier_required = []
test_tier_full = ["test_tier_required"]
