[package]
name = "oasis7_wasm_executor"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
oasis7_wasm_abi = { version = "0.1.0", path = "../oasis7_wasm_abi" }
serde = { version = "1", features = ["derive"] }
serde_cbor = "0.11"
sha2 = "0.11"

# Keep the synchronous Core WASM contract and diagnostics; see
# doc/world-runtime/wasm/wasm-executor.design.md for feature boundaries.
wasmtime = { version = "49.0.3", optional = true, default-features = false, features = [
    "std",
    "runtime",
    "cranelift",
    "gc",
    "gc-copying",
    "gc-drc",
    "gc-null",
    "threads",
    "parallel-compilation",
    "wat",
    "anyhow",
    "backtrace",
    "demangle",
    "addr2line",
] }

[features]
default = []
wasmtime = ["dep:wasmtime"]

[dev-dependencies]
wat = "1"
