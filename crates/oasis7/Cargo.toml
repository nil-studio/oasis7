[package]
name = "oasis7"
autobins = false
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
path = "src/lib.rs"

[dependencies]
oasis7_runtime = { path = "../oasis7_runtime", default-features = false }
oasis7_simulator = { path = "../oasis7_simulator" }
oasis7_agent_harness = { version = "0.1.0", path = "../oasis7_agent_harness" }
oasis7_client_api = { version = "0.1.0", path = "../oasis7_client_api" }
oasis7_agent_api = { version = "0.1.0", path = "../oasis7_agent_api" }
oasis7_proto = { version = "0.1.0", path = "../oasis7_proto" }
oasis7_wasm_abi = { version = "0.1.0", path = "../oasis7_wasm_abi" }
hex = "0.4"
sha2 = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_ignored = "0.1"
serde_cbor = "0.11"
blake3 = "1"
unicode-normalization = "0.1"
ed25519-dalek = { version = "3", features = ["rand_core"] }
rand_core = "0.10"
getrandom = "0.4"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
oasis7_world_service = { path = "../oasis7_world_service", default-features = false }
oasis7_wasm_materializer = { path = "../oasis7_wasm_materializer" }
oasis7_observability = { path = "../oasis7_observability" }
oasis7_hosted_access = { path = "../oasis7_hosted_access" }
oasis7_game_client = { path = "../oasis7_game_client" }
oasis7_client_storage = { path = "../oasis7_client_storage" }
oasis7_model_provider = { path = "../oasis7_model_provider" }
chacha20poly1305 = { version = "0.11", features = ["zeroize"] }
zeroize = "1"
cap-std = "4"
cap-fs-ext = "4"
libc = "0.2"
oasis7_distfs = { version = "0.1.0", path = "../oasis7_distfs" }
oasis7_node = { version = "0.1.0", path = "../oasis7_node", default-features = false }
oasis7_wasm_executor = { version = "0.1.0", path = "../oasis7_wasm_executor", default-features = false }
oasis7_wasm_router = { version = "0.1.0", path = "../oasis7_wasm_router" }
oasis7_wasm_store = { version = "0.1.0", path = "../oasis7_wasm_store" }
hmac = "0.13"
reqwest = { version = "0.13.4", features = ["blocking", "json", "rustls"], default-features = false }
toml = "0.9.12"
tracing = "0.1"

# Only the formal harness producer enables these aliases. They preserve the
# shared dependency features unified by the complete required-test roots.
ci_formal_hyper_rustls = { package = "hyper-rustls", version = "0.27", default-features = false, features = ["ring", "webpki-tokio"], optional = true }
ci_formal_idna = { package = "idna", version = "1", optional = true }
ci_formal_rand_chacha = { package = "rand_chacha", version = "0.9", optional = true }
ci_formal_rustls = { package = "rustls", version = "0.23", default-features = false, features = ["logging"], optional = true }
ci_formal_sha2 = { package = "sha2", version = "0.10", optional = true }
ci_formal_tokio = { package = "tokio", version = "1", default-features = false, features = ["full"], optional = true }
ci_formal_tokio_rustls = { package = "tokio-rustls", version = "0.26", default-features = false, features = ["ring"], optional = true }
ci_formal_url = { package = "url", version = "2", features = ["serde"], optional = true }
ci_formal_uuid = { package = "uuid", version = "1", features = ["serde", "v4"], optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.build-dependencies]
# Resolver 2 keeps proc-macro host features separate from native target features.
ci_formal_host_bitflags = { package = "bitflags", version = "2", features = ["std"], optional = true }
ci_formal_host_indexmap = { package = "indexmap", version = "2", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }

[features]
default = ["wasmtime", "node-libp2p"]
node-libp2p = ["oasis7_node/libp2p"]
wasmtime = ["oasis7_wasm_executor/wasmtime", "oasis7_runtime/wasmtime", "oasis7_world_service/wasmtime"]
viewer_live_integration = []
test_tier_required = ["oasis7_simulator/test_tier_required", "oasis7_runtime/test_tier_required", "oasis7_world_service/test_tier_required"]
test_tier_full = ["test_tier_required", "oasis7_simulator/test_tier_full", "oasis7_runtime/test_tier_full", "oasis7_world_service/test_tier_full"]
ci_formal_required_features = [
    "dep:ci_formal_host_bitflags",
    "dep:ci_formal_host_indexmap",
    "dep:ci_formal_hyper_rustls",
    "dep:ci_formal_idna",
    "dep:ci_formal_rand_chacha",
    "dep:ci_formal_rustls",
    "dep:ci_formal_sha2",
    "dep:ci_formal_tokio",
    "dep:ci_formal_tokio_rustls",
    "dep:ci_formal_url",
    "dep:ci_formal_uuid",
]

[dev-dependencies]
oasis7_node = { version = "0.1.0", path = "../oasis7_node", default-features = false, features = ["test-hooks"] }
oasis7_hosted_access = { path = "../oasis7_hosted_access", features = ["test-support"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
oasis7_runtime = { path = "../oasis7_runtime", default-features = false, features = ["test-support"] }
async-openai = { version = "0.42.1", default-features = false, features = ["responses", "rustls"] }
