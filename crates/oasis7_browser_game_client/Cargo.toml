[package]
name = "oasis7_browser_game_client"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Browser protocol bridge for the canonical Oasis7 Game Client contracts"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
oasis7_client_api = { path = "../oasis7_client_api" }
oasis7_agent_api = { path = "../oasis7_agent_api" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "=0.2.127"

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"
