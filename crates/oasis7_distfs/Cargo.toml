[package]
name = "oasis7_distfs"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
path = "src/lib.rs"

[dependencies]
oasis7_formal_protocol = { path = "../oasis7_formal_protocol" }
oasis7_cas = { path = "../oasis7_cas" }
oasis7_proto = { version = "0.1.0", path = "../oasis7_proto" }
oasis7_wasm_build = { version = "0.1.0", path = "../oasis7_wasm_build", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_cbor = "0.11"
blake3 = "1"
sha2 = "0.11"
hex = "0.4"
zstd = { version = "0.13", default-features = false }
ed25519-dalek = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
oasis7_formal_protocol = { path = "../oasis7_formal_protocol", features = ["test-support"] }

[features]
sync-builtin-wasm-identity = ["dep:oasis7_wasm_build"]

[[bin]]
name = "sync_builtin_wasm_identity"
path = "src/bin/sync_builtin_wasm_identity.rs"
required-features = ["sync-builtin-wasm-identity"]
