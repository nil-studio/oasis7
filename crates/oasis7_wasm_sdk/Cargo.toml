[package]
name = "oasis7_wasm_sdk"
version = "0.1.0"
edition = "2024"
license = "MIT"

[features]
default = []
std = []
wire = ["std", "dep:serde", "dep:serde_cbor", "dep:serde_json"]

[lib]
crate-type = ["rlib"]

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }
serde_cbor = { package = "serde_cbor_2", version = "0.13", optional = true }
serde_json = { version = "1", optional = true }

[lints.clippy]
correctness = "deny"
suspicious = "warn"
