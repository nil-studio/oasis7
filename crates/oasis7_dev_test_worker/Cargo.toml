[package]
name = "oasis7_dev_test_worker"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Cloudflare Workers adapter for the shared bounded dev-test account service"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
oasis7_custody_core = { path = "../oasis7_custody_core" }
oasis7_client_api = { path = "../oasis7_client_api" }
oasis7_agent_api = { path = "../oasis7_agent_api" }
serde.workspace = true
serde_json.workspace = true
blake3 = "1"
hex.workspace = true
subtle = "2"
zeroize = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
worker = "=0.7.5"
wasm-bindgen = "=0.2.127"
js-sys = "=0.3.104"
wasm-bindgen-futures = "=0.4.77"
web-sys = { version = "=0.3.104", features = ["Request"] }

[lints]
workspace = true
