[package]
name = "oasis7_local_signer"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[lib]
path = "src/lib.rs"

[[bin]]
name = "oasis7_local_signer_worker"
path = "src/bin/oasis7_local_signer_worker.rs"

[[bin]]
name = "oasis7_local_signer_runtime_gate"
path = "src/bin/oasis7_local_signer_runtime_gate.rs"

[dependencies]
oasis7_signer_protocol = { path = "../oasis7_signer_protocol" }
oasis7_context = { path = "../oasis7_context" }
oasis7_secure_envelope = { path = "../oasis7_secure_envelope" }
argon2 = { version = "0.5", features = ["zeroize"] }
chacha20poly1305 = { version = "0.11", features = ["zeroize"] }
base64 = "0.23"
ed25519-dalek = "3"
getrandom = "0.4"
hex = "0.4"
libc = "0.2"
nix = { version = "0.31", features = ["fs", "poll", "user"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
zeroize = "1"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all = "warn"
