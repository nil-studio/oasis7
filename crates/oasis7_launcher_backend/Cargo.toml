[package]
name = "oasis7_launcher_backend"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
oasis7_runtime = { path = "../oasis7_runtime", default-features = false }
oasis7_simulator = { path = "../oasis7_simulator" }
oasis7_launcher_config = { version = "0.1.0", path = "../oasis7_launcher_config" }
oasis7 = { path = "../oasis7", default-features = false }
oasis7_hosted_access = { path = "../oasis7_hosted_access" }
oasis7_agent_harness = { version = "0.1.0", path = "../oasis7_agent_harness" }
oasis7_client_api = { version = "0.1.0", path = "../oasis7_client_api" }
oasis7_agent_api = { version = "0.1.0", path = "../oasis7_agent_api" }
oasis7_proto = { version = "0.1.0", path = "../oasis7_proto" }
hex = "0.4"
sha2 = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
ed25519-dalek = { version = "3", features = ["rand_core"] }
getrandom = "0.4"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rusqlite = { version = "0.40.2", features = ["bundled", "backup"] }
prost = "0.13"
hmac_legacy = { package = "hmac", version = "0.12" }
sha1 = "0.10"
md5 = "0.7"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
webauthn-rs-core = "=0.5.5"
url = "2"
uuid = { version = "1", features = ["serde", "v4"] }
base64 = "0.22"
oasis7_game_client = { path = "../oasis7_game_client" }
oasis7_model_provider = { path = "../oasis7_model_provider" }
chacha20poly1305 = { version = "0.11", features = ["zeroize"] }
zeroize = "1"
libc = "0.2"
aliyun-tablestore-rs = { version = "0.1.2", default-features = false, features = ["rust-tls"] }
oasis7_launcher_ui = { version = "0.1.0", path = "../oasis7_launcher_ui" }
ctrlc = { version = "3.4", features = ["termination"] }
reqwest = { version = "0.13.4", features = ["blocking", "json", "rustls"], default-features = false }
tokio = { version = "1", features = ["rt", "time"] }
toml = "0.9.12"
tracing = "0.1"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "rustls-tls"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }

[features]
default = ["wasmtime", "node-libp2p"]
node-libp2p = ["oasis7/node-libp2p"]
wasmtime = ["oasis7/wasmtime"]
viewer_live_integration = ["oasis7/viewer_live_integration"]
test_tier_required = ["oasis7/test_tier_required"]
test_tier_full = ["test_tier_required", "oasis7/test_tier_full"]

[dev-dependencies]
oasis7 = { path = "../oasis7", default-features = false, features = ["test_tier_required"] }
oasis7_hosted_access = { path = "../oasis7_hosted_access", features = ["test-support"] }
