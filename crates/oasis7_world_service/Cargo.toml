[package]
name = "oasis7_world_service"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
oasis7_runtime = { path = "../oasis7_runtime", default-features = false }
oasis7_agent_api = { path = "../oasis7_agent_api" }
oasis7_client_api = { path = "../oasis7_client_api" }
oasis7_client_storage = { path = "../oasis7_client_storage" }
oasis7_wasm_abi = { path = "../oasis7_wasm_abi" }
oasis7_proto = { path = "../oasis7_proto" }
oasis7_game_client = { path = "../oasis7_game_client" }
oasis7_distfs = { path = "../oasis7_distfs" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_cbor = "0.11"
serde_ignored = "0.1"
hex = "0.4"
blake3 = "1"
sha2 = "0.11"
ed25519-dalek = "3"
getrandom = "0.4"
reqwest = { version = "0.13.4", features = ["blocking", "json", "rustls"], default-features = false }
chacha20poly1305 = { version = "0.11", features = ["zeroize"] }
zeroize = "1"
cap-std = "4"
cap-fs-ext = "4"
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
oasis7_runtime = { path = "../oasis7_runtime", default-features = false, features = ["test_tier_required"] }

[features]
default = ["wasmtime"]
wasmtime = ["oasis7_runtime/wasmtime"]
test_tier_required = ["oasis7_runtime/test_tier_required"]
test_tier_full = ["test_tier_required", "oasis7_runtime/test_tier_full"]
