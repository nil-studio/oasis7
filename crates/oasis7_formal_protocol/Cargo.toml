[package]
name = "oasis7_formal_protocol"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_cbor = { package = "serde_cbor_2", version = "0.13" }
ed25519-dalek = "3"
blake3 = "1"
hex = "0.4"
oasis7_proto = { version = "0.1.0", path = "../oasis7_proto" }

[dev-dependencies]
oasis7_cas = { version = "0.1.0", path = "../oasis7_cas" }
serde_json = "1"

[features]
test-support = []
