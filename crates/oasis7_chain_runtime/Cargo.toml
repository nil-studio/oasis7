[package]
name = "oasis7_chain_runtime"
version = "0.1.0"
edition = "2024"
license = "MIT"

[[bin]]
name = "oasis7_chain_runtime"
path = "src/bin/oasis7_chain_runtime.rs"
required-features = ["node-libp2p"]

[dependencies]
oasis7_world_state = { path = "../oasis7_world_state" }
oasis7_world_projection = { path = "../oasis7_world_projection" }
oasis7_world_service = { path = "../oasis7_world_service", default-features = false }
oasis7_formal_protocol = { path = "../oasis7_formal_protocol" }
oasis7_hosted_access = { path = "../oasis7_hosted_access" }
oasis7_runtime = { path = "../oasis7_runtime", default-features = false }
oasis7_consensus = { path = "../oasis7_consensus" }
oasis7_simulator = { path = "../oasis7_simulator" }
oasis7 = { path = "../oasis7", default-features = false }
oasis7_client_api = { version = "0.1.0", path = "../oasis7_client_api" }
oasis7_agent_api = { version = "0.1.0", path = "../oasis7_agent_api" }
oasis7_proto = { version = "0.1.0", path = "../oasis7_proto" }
oasis7_wasm_abi = { version = "0.1.0", path = "../oasis7_wasm_abi" }
hex = "0.4"
sha2 = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_ignored = "0.1"
serde_cbor = { package = "serde_cbor_2", version = "0.13" }
blake3 = "1"
ed25519-dalek = { version = "3", features = ["rand_core"] }
getrandom = "0.4"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
oasis7_runtime_host = { path = "../oasis7_runtime_host" }
oasis7_executable_image = { path = "../oasis7_executable_image", optional = true }
oasis7_game_client = { path = "../oasis7_game_client" }
zeroize = "1"
libc = "0.2"
oasis7_distfs = { version = "0.1.0", path = "../oasis7_distfs" }
oasis7_node = { version = "0.1.0", path = "../oasis7_node", default-features = false }
oasis7_observability = { path = "../oasis7_observability" }
oasis7_net = { version = "0.1.0", path = "../oasis7_net", default-features = false, optional = true }
oasis7_wasm_executor = { version = "0.1.0", path = "../oasis7_wasm_executor", default-features = false }
oasis7_wasm_router = { version = "0.1.0", path = "../oasis7_wasm_router" }
ctrlc = { version = "3.4", features = ["termination"] }
reqwest = { version = "0.13.4", features = ["blocking", "json", "rustls"], default-features = false }
toml = "0.9.12"
tracing = "0.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }

[features]
default = ["wasmtime", "node-libp2p"]
node-libp2p = ["dep:oasis7_executable_image", "oasis7_node/libp2p", "dep:oasis7_net", "oasis7_net/libp2p"]
# Preserve the historical umbrella's effective feature closure through its
# native owners. Keep the normal/dev umbrella edges until the actual H1/H2
# Chain consumers and their recovery tests have been cut over separately.
wasmtime = ["oasis7_wasm_executor/wasmtime", "oasis7_runtime/wasmtime", "oasis7_world_service/wasmtime"]
# Also turn on the native L4 Host's original required/full test tiers.
# Unlike the old umbrella, these are explicit and must not be lost on cutover.
test_tier_required = ["oasis7_runtime_host/test_tier_required", "oasis7_simulator/test_tier_required", "oasis7_runtime/test_tier_required", "oasis7_world_service/test_tier_required"]
test_tier_full = ["test_tier_required", "oasis7_runtime_host/test_tier_full", "oasis7_simulator/test_tier_full", "oasis7_runtime/test_tier_full", "oasis7_world_service/test_tier_full"]
# Compile the existing capacity smoke for the standalone Storage producer.
ci_storage_acceptance = []

[dev-dependencies]
# Signed History fixtures use the existing test authority; no production feature changes.
oasis7_formal_protocol = { path = "../oasis7_formal_protocol", features = ["test-support"] }
oasis7_viewer_runtime = { path = "../oasis7_viewer_runtime", default-features = false, features = ["test_tier_required"] }
# Keep fixture helpers available to the moved harness without enabling them in production builds.
oasis7 = { path = "../oasis7", default-features = false, features = ["test_tier_required"] }
oasis7_agent_harness = { version = "0.1.0", path = "../oasis7_agent_harness" }
oasis7_node = { version = "0.1.0", path = "../oasis7_node", default-features = false, features = ["test-hooks"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "tracing-log"] }

[target.'cfg(unix)'.dependencies]
hickory-resolver = { version = "0.26.3", default-features = false, features = ["tokio", "system-config"] }
tokio = { version = "1", features = ["rt", "net", "time"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
webpki-roots = "1.0.10"
[target.'cfg(unix)'.dev-dependencies]
rcgen = "0.13.2"
