[package]
name = "oasis7_chain_runtime"
version = "0.1.0"
edition = "2024"
license = "MIT"

[[bin]]
name = "oasis7_chain_runtime"
path = "src/bin/oasis7_chain_runtime.rs"
required-features = ["node-libp2p"]

[dependencies]
oasis7_formal_protocol = { path = "../oasis7_formal_protocol" }
oasis7_runtime = { path = "../oasis7_runtime", default-features = false }
oasis7_simulator = { path = "../oasis7_simulator" }
oasis7 = { path = "../oasis7", default-features = false }
oasis7_agent_harness = { version = "0.1.0", path = "../oasis7_agent_harness" }
oasis7_client_api = { version = "0.1.0", path = "../oasis7_client_api" }
oasis7_agent_api = { version = "0.1.0", path = "../oasis7_agent_api" }
oasis7_proto = { version = "0.1.0", path = "../oasis7_proto" }
oasis7_wasm_abi = { version = "0.1.0", path = "../oasis7_wasm_abi" }
hex = "0.4"
sha2 = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_ignored = "0.1"
serde_cbor = "0.11"
blake3 = "1"
ed25519-dalek = { version = "3", features = ["rand_core"] }
getrandom = "0.4"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
oasis7_game_client = { path = "../oasis7_game_client" }
zeroize = "1"
libc = "0.2"
oasis7_distfs = { version = "0.1.0", path = "../oasis7_distfs" }
oasis7_node = { version = "0.1.0", path = "../oasis7_node", default-features = false }
oasis7_wasm_executor = { version = "0.1.0", path = "../oasis7_wasm_executor", default-features = false }
oasis7_wasm_router = { version = "0.1.0", path = "../oasis7_wasm_router" }
ctrlc = { version = "3.4", features = ["termination"] }
reqwest = { version = "0.13.4", features = ["blocking", "json", "rustls"], default-features = false }
toml = "0.9.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "tracing-log"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }

[features]
default = ["wasmtime", "node-libp2p"]
node-libp2p = ["oasis7_node/libp2p", "oasis7/node-libp2p"]
wasmtime = ["oasis7_wasm_executor/wasmtime", "oasis7/wasmtime"]
test_tier_required = ["oasis7/test_tier_required"]
test_tier_full = ["test_tier_required", "oasis7/test_tier_full"]

[dev-dependencies]
# Keep fixture helpers available to the moved harness without enabling them in production builds.
oasis7 = { path = "../oasis7", default-features = false, features = ["test_tier_required"] }
oasis7_node = { version = "0.1.0", path = "../oasis7_node", default-features = false, features = ["test-hooks"] }
