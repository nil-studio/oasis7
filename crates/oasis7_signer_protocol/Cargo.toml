[package]
name = "oasis7_signer_protocol"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Pure local signer IPC and canonical payload validation"

[dependencies]
base64 = "0.23"
ed25519-dalek = "3"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
