[workspace]

[package]
name = "oasis7_builtin_wasm_m4_recipe_smelter_alloy_plate"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
oasis7_wasm_sdk = { version = "0.1.0", path = "../../oasis7_wasm_sdk", features = ["wire"] }
serde = { version = "1", features = ["derive"] }
serde_cbor = { package = "serde_cbor_2", version = "0.13" }
serde_json = "1"

[package.metadata.oasis7_source_inputs]
rule_version = 2
includes = [
    { from = "crates/oasis7_builtin_wasm_modules/m4_recipe_smelter_alloy_plate/src/lib.rs", to = "crates/oasis7_builtin_wasm_modules/_templates/m4_recipe_module_template.rs" },
]
build_inputs = {}
