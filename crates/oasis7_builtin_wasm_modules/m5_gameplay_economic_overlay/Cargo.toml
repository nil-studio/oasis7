[workspace]

[package]
name = "oasis7_builtin_wasm_m5_gameplay_economic_overlay"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
oasis7_wasm_sdk = { version = "0.1.0", path = "../../oasis7_wasm_sdk", features = ["wire"] }
serde = { version = "1", features = ["derive"] }
serde_cbor = { package = "serde_cbor_2", version = "0.13" }
serde_json = "1"
