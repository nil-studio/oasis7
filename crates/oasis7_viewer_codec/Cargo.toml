[package]
name = "oasis7_viewer_codec"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[dependencies]
oasis7 = { version = "0.1.0", path = "../oasis7", default-features = false }
oasis7_proto = { version = "0.1.0", path = "../oasis7_proto" }
oasis7_client_api = { version = "0.1.0", path = "../oasis7_client_api" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = []
test_tier_required = []

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"
