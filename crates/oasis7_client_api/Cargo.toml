[package]
name = "oasis7_client_api"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
path = "src/lib.rs"

[dependencies]
ed25519-dalek = "3"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
oasis7_wasm_abi = { version = "0.1.0", path = "../oasis7_wasm_abi" }

oasis7_agent_api = { path = "../oasis7_agent_api" }
zeroize = "1"
oasis7_proto = { path = "../oasis7_proto" }

[dev-dependencies]
serde_cbor = "0.11"
unicode-normalization = "0.1"
