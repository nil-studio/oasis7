[package]
name = "pixel_world_bridge"
version = "0.1.0"
edition = "2024"
license = "MIT"

[features]
default = ["webgl2_runtime"]
webgl2_runtime = ["bevy/webgl2"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bevy = { version = "0.19.1", default-features = false, features = ["std", "async_executor", "bevy_asset", "bevy_log", "bevy_winit", "bevy_render", "bevy_core_pipeline", "bevy_sprite", "bevy_sprite_render", "bevy_text", "bevy_color", "bevy_window", "default_font", "web", "x11"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["CanvasRenderingContext2d", "Document", "DomRect", "Element", "HtmlCanvasElement", "Window"] }

[dev-dependencies]
image = { version = "0.25.10", default-features = false, features = ["png"] }
wasm-bindgen-test = "0.3.71"
