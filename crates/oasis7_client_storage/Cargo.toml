[package]
name = "oasis7_client_storage"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Private client persistence, bounded key loading and durable local budgets"

[dependencies]
oasis7_client_api = { path = "../oasis7_client_api" }
oasis7_agent_api = { path = "../oasis7_agent_api" }
oasis7_wasm_abi = { path = "../oasis7_wasm_abi" }
serde = { workspace = true }
serde_json = { workspace = true }
serde_cbor = { workspace = true }
blake3 = "1"
zeroize = "1"
getrandom = "0.4"
hex = { workspace = true }

[target.'cfg(unix)'.dependencies]
oasis7_secure_envelope = { path = "../oasis7_secure_envelope" }
cap-std = "4"
cap-fs-ext = "4"
libc = "0.2"
chacha20poly1305 = { version = "0.11", features = ["zeroize"] }

[lints]
workspace = true
