[package]
name = "oasis7_hosted_access"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
hex = "0.4"

[features]
test-support = []

[dev-dependencies]
hex = "0.4"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
serde_json = "1"
sha2 = "0.11"
libc = "0.2"
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem"] }
