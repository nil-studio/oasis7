[package]
name = "oasis7_runtime_iws_tests"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

# Keep this non-shipping library's Cargo identity until the next producer rebuild.
# The executable Rule cases now belong to oasis7_runtime's integration target.
[lib]
test = false
doctest = false

[features]
default = []
test-support = ["dep:oasis7_runtime", "oasis7_runtime/test-support"]
wasmtime = ["dep:oasis7_runtime", "oasis7_runtime/wasmtime"]

[target.'cfg(target_os = "linux")'.dependencies]
oasis7_runtime = { path = "../oasis7_runtime", optional = true }
