[package]
name = "oasis7_runtime_iws_tests"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[features]
default = []
test-support = ["dep:oasis7_runtime", "oasis7_runtime/test-support"]
wasmtime = ["dep:oasis7_runtime", "oasis7_runtime/wasmtime"]

[target.'cfg(target_os = "linux")'.dependencies]
oasis7_runtime = { path = "../oasis7_runtime", optional = true }

[[test]]
name = "iws_rule_core"
path = "tests/iws_rule_core.rs"
required-features = ["test-support", "wasmtime"]
