<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>oasis7 Viewer</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="stylesheet" href="./viewer_base.css" />
    <style>
      @media (max-width: 1240px) {
        body {
          padding: 14px;
          --viewer-side-max-height: none; --mobile-action-card-clearance: 84px;
        }
        #viewer-refine-quote-panel { scroll-margin-top: var(--mobile-action-card-clearance, 0); }
        .shell {
          grid-template-columns: 1fr;
          grid-template-areas:
            "rail"
            "stage"
            "targets"
            "details";
          gap: 12px;
        }
        .panel--targets,
        .panel--details {
          position: static;
          max-height: none;
        }
        .list, .event-list { max-height: none; }
        .action-grid { grid-template-columns: 1fr; }
        .summary-grid { grid-template-columns: 1fr; }
        .micro-depot-facilities__metrics { grid-template-columns: 1fr !important; } .micro-depot-facilities__technical-grid { grid-template-columns: 1fr; }
        .metric--claim-total { grid-column: auto; }
        .metric--target-gap-outcome { grid-column: auto; }
        .diagnostic-surface__summary { align-items: flex-start; flex-direction: column; }
        .stage-hero__topline { flex-direction: column; }
        .stage-hero__title { max-width: none; }
        .inline-help-tip {
          width: 100%;
        }
        .inline-help-tip__panel {
          width: min(100%, 420px);
        }
        .hero-focus-grid { grid-template-columns: 1fr; }
        .stage-hero {
          gap: 10px;
          padding: 14px;
        }
        .stage-hero__topline {
          gap: 10px;
        }
        .entry-menu__panel {
          left: 0;
          right: auto;
          width: min(320px, calc(100vw - 70px));
        }
        .stage-hero__title {
          font-size: 26px;
          line-height: 1.08;
        }
        .stage-hero__lede {
          display: -webkit-box;
          max-width: none;
          -webkit-line-clamp: 2;
          -webkit-box-orient: vertical;
          overflow: hidden;
          line-height: 1.45;
        }
        .stage-hero__mobile-shortcuts {
          display: grid;
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 8px;
        }
        .stage-hero__mobile-shortcuts .mobile-rail__link {
          min-height: 44px;
          border-radius: 8px;
        }
        .hero-focus-grid {
          gap: 8px;
        }
        .hero-focus-card {
          min-height: 0;
          gap: 6px;
          padding: 10px;
          border-radius: 8px;
        }
        .hero-focus-card--next-step {
          width: 100%;
          padding-left: 15px;
        }
        .hero-focus-card--next-step::before {
          left: 6px;
        }
        .hero-focus-card__value--body {
          font-size: 14px;
          line-height: 1.35;
        }
        .hero-focus-card--next-step .hero-focus-card__value--body {
          font-size: 15px;
        }
        .hero-focus-card__detail {
          line-height: 1.35;
        }
        .pixel-world-command-strip { grid-template-columns: 1fr; }
        .pixel-world-command-cell {
          min-height: 0;
        }
        .pixel-world-command-cell__action {
          min-height: 28px;
        }
        .pixel-world-canvas {
          min-height: clamp(340px, 50vh, 560px);
        }
        .pixel-world-focus-cinematic {
          display: none;
        }
        .pixel-world-focus-hud {
          grid-template-columns: minmax(0, 1fr) auto;
          right: 10px;
          left: 10px;
          top: 10px;
          gap: 6px;
          max-height: none;
          overflow: visible;
        }
        .pixel-world-focus-hud__identity {
          grid-column: 1;
          grid-row: 1;
          min-height: 30px;
          padding: 5px 8px;
        }
        .pixel-world-focus-hud__cell {
          min-height: 42px;
          padding: 7px 8px;
        }
        .pixel-world-focus-hud__cell--prompt {
          grid-column: 1 / -1;
          grid-row: 2;
        }
        .pixel-world-focus-hud__cell--mission {
          display: none;
        }
        .pixel-world-focus-hud__cell--tick,
        .pixel-world-focus-hud__cell--blocker,
        .pixel-world-focus-hud__cell--receipt {
          grid-column: 1 / -1;
          min-height: 30px;
          flex-direction: row;
          justify-content: flex-start;
          align-items: center;
          gap: 8px;
        }
        .pixel-world-focus-hud__cell--tick {
          grid-row: 3;
          padding: 5px 8px;
        }
        .pixel-world-focus-hud__cell--blocker,
        .pixel-world-focus-hud__cell--receipt {
          padding: 5px 8px 5px 16px;
        }
        .pixel-world-focus-hud__cell--blocker {
          grid-row: 4;
        }
        .pixel-world-focus-hud__cell--receipt {
          grid-row: 5;
        }
        .pixel-world-focus-hud__cell--blocker strong,
        .pixel-world-focus-hud__cell--receipt strong,
        .pixel-world-focus-hud__cell--tick strong,
        .pixel-world-focus-hud__cell--prompt strong,
        .pixel-world-focus-hud__cell em {
          font-size: 11px;
          line-height: 1.2;
        }
        .pixel-world-focus-controls { grid-column: 1 / -1; grid-row: 6; display: grid; grid-template-columns: minmax(0, 1fr); align-self: stretch; gap: 6px; padding: 6px; width: auto; }
        .pixel-world-focus-controls > button, .pixel-world-focus-more-controls summary, .pixel-world-focus-more-controls > button { box-sizing: border-box; width: 100%; min-height: 44px; padding: 8px 10px; font-size: 12px; }
        .pixel-world-focus-more-controls { display: block; width: 100%; }
        .pixel-world-focus-more-controls summary { display: flex; align-items: center; justify-content: space-between; cursor: pointer; list-style: none; border: 1px solid rgba(148, 163, 184, 0.22); border-radius: 6px; background: rgba(148, 163, 184, 0.08); color: var(--muted); font-weight: 700; }
        .pixel-world-focus-more-controls summary::after { content: "+"; color: var(--text); font-size: 16px; line-height: 1; }
        .pixel-world-focus-more-controls[open] summary::after { content: "−"; }
        .pixel-world-focus-more-controls summary::-webkit-details-marker { display: none; }
        .pixel-world-focus-more-controls > button { display: none; margin-top: 6px; justify-content: center; align-items: center; }
        .pixel-world-focus-more-controls[open] > button { display: inline-flex; }
        .pixel-world-focus-rail {
          top: auto;
          bottom: 96px;
          left: 10px;
          width: min(210px, calc(100vw - 20px));
          max-height: 90px;
          overflow: hidden;
        }
        .pixel-world-focus-minimap {
          inset: 366px 10px 98px 10px;
          border-radius: 6px;
        }
        .pixel-world-focus-minimap__label {
          top: 12px;
          left: 10px;
          padding: 5px 7px;
        }
        .pixel-world-focus-minimap__node {
          min-width: 92px;
          max-width: 42vw;
          padding: 7px 8px;
        }
        .pixel-world-focus-minimap__node strong {
          font-size: 11px;
        }
        .pixel-world-focus-minimap__node--target {
          left: 7%;
          top: 12%;
        }
        .pixel-world-focus-minimap__node--agent {
          right: 7%;
          top: 42%;
        }
        .pixel-world-focus-minimap__node--selected {
          right: 8px;
          bottom: 48px;
        }
        .pixel-world-focus-minimap__meta {
          left: 8px;
          right: 8px;
          bottom: 8px;
          gap: 4px;
        }
        .pixel-world-focus-minimap__meta span {
          padding: 4px 6px;
          font-size: 10px;
          max-width: min(190px, 68vw);
        }
        .pixel-world-focus-receipt {
          left: 10px;
          right: 10px;
          bottom: 8px;
          justify-content: stretch;
        }
        .pixel-world-focus-receipt .pixel-world-action-receipt {
          width: 100%;
        }
        .pixel-world-action-receipt--focus-compact {
          grid-template-columns: minmax(0, 1fr) auto;
          gap: 5px 8px;
          padding: 7px 9px;
          min-height: 46px;
        }
        .pixel-world-action-receipt--focus-compact .pixel-world-action-receipt__label {
          display: none;
        }
        .pixel-world-action-receipt--focus-compact .pixel-world-action-receipt__title,
        .pixel-world-action-receipt--focus-compact .pixel-world-action-receipt__summary,
        .pixel-world-action-receipt--focus-compact .pixel-world-action-receipt__meta {
          font-size: 11px;
          line-height: 1.2;
        }
        .pixel-world-action-receipt--focus-compact .pixel-world-action-receipt__summary {
          max-height: 2.4em;
          white-space: normal;
          overflow: hidden;
        }
        .pixel-world-focus-drawer {
          top: auto;
          right: 10px;
          left: 10px;
          bottom: 10px;
          width: auto;
          max-height: min(42vh, 340px);
          border-color: rgba(141, 199, 170, 0.28);
        }
        .pixel-world-focus-drawer summary {
          padding: 8px 10px;
          font-size: 12px;
        }
        .pixel-world-focus-drawer__body {
          padding: 0 10px 10px;
        }
        .pixel-world-focus-command-surface {
          gap: 7px;
        }
        .pixel-world-focus-command-surface > .badge-row {
          gap: 5px;
        }
        .pixel-world-focus-command-surface > .badge-row .badge {
          padding: 5px 7px;
          font-size: 10px;
        }
        .pixel-world-focus-command-surface .empty {
          padding: 8px 9px;
          font-size: 11px;
          line-height: 1.25;
        }
        .pixel-world-focus-command-tray {
          gap: 6px;
        }
        .pixel-world-focus-command-chip {
          min-height: 36px;
          padding: 6px 8px;
        }
        .pixel-world-focus-command-chip strong {
          font-size: 11px;
        }
        .pixel-world-focus-command-surface .panel--nested .panel__header {
          padding: 8px 10px;
        }
        .pixel-world-focus-command-surface .panel--nested .panel__body {
          padding: 8px 10px 10px;
          gap: 7px;
        }
        .pixel-world-focus-command-surface .panel__meta-copy {
          display: none;
        }
        .pixel-world-focus-command-surface textarea {
          min-height: 54px;
          max-height: 68px;
          font-size: 12px;
        }
        .pixel-world-focus-command-surface .toolbar button {
          min-height: 34px;
        }
        .pixel-world-focus-command-surface .event-list {
          max-height: 112px;
          overflow: auto;
        }
        .pixel-world-route {
          height: 5px;
        }
        .pixel-world-route-waypoint {
          width: 16px;
          height: 16px;
        }
        .pixel-world-route-waypoint--target {
          width: 20px;
          height: 20px;
        }
        .pixel-world-hotspot__glyph {
          font-size: 11px;
          box-shadow: 0 0 24px rgba(208, 168, 91, 0.54), 0 0 0 5px rgba(208, 168, 91, 0.08);
        }
        .pixel-world-entity[data-selected="true"] {
          min-width: 46px;
          min-height: 46px;
          font-size: 12px;
        }
        .pixel-world-host--focus > .callout {
          left: 10px;
          right: 10px;
          top: 120px;
          bottom: auto;
          width: auto;
          min-width: 0;
          max-height: 44px;
        }
        .pixel-world-action-receipt {
          grid-template-columns: 1fr;
          align-items: start;
        }
        .pixel-world-action-receipt__meta {
          flex-direction: row;
          flex-wrap: wrap;
          align-items: flex-start;
        }
        .mobile-rail {
          position: sticky;
          top: 10px;
          z-index: 5;
          display: flex;
          gap: 8px;
          margin-bottom: 12px;
          padding: 8px;
          border-radius: 999px;
          background: rgba(9, 13, 11, 0.88);
          border: 1px solid rgba(152, 177, 150, 0.18);
          backdrop-filter: blur(10px);
          flex-wrap: wrap; overflow: visible;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .entity-list-pending__spinner,
        button.is-loading::before,
        .entity-list-pending__skeleton span { animation: none; }
        button,
        .pixel-world-command-cell--next,
        .inline-help-tip__panel { transition: none; }
        .pixel-world-entity[data-selected="true"] { transition: none; }
        button:not(:disabled):hover,
        .pixel-world-command-cell--next:active { transform: none; }
      }
    </style>
    <link rel="stylesheet" href="./viewer_terminal_shell.css" />
  </head>
  <body>
    <div id="app" class="viewer-shell" data-viewer-shell="player-fullscreen" aria-live="polite"></div>
    <script type="module" src="./viewer.js"></script>
  </body>
</html>
