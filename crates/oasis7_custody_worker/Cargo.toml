[package]
name = "oasis7_custody_worker"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version = "1.85"
description = "Isolated Cloudflare role adapters for bounded test-account custody"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
identity = []
owner = []
executor = []
recovery-fence = []
# Component verification only. Never enabled by any deployment role/configuration.
approval-harness = []
# Identity manifest fixtures only; never enabled by deployment role builds.
native-runtime-harness = []

[dependencies]
oasis7_custody_core = { path = "../oasis7_custody_core" }
oasis7_wasm_abi = { path = "../oasis7_wasm_abi" }
serde.workspace = true
serde_json.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
oasis7_agent_api = { path = "../oasis7_agent_api" }
worker = "=0.7.5"
wasm-bindgen = "=0.2.127"
wasm-bindgen-futures = "=0.4.77"
js-sys = "=0.3.104"
web-sys = { version = "=0.3.104", features = ["Crypto", "CryptoKey", "SubtleCrypto", "AesGcmParams"] }
base64 = "0.22"
hex.workspace = true
ed25519-dalek = "3"
zeroize = "1"

[lints]
workspace = true
