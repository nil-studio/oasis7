# Isolated staging artifact. Use a separate scoped publisher for this role.
name = "oasis7-custody-owner-staging"
main = "../../artifacts/owner/entry.mjs"
compatibility_date = "2026-10-25"

workers_dev = false
preview_urls = false

[build]
cwd = "."
command = "bash scripts/build-role.sh owner"

[[durable_objects.bindings]]
name = "ACCOUNTS"
class_name = "AccountAuthority"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AccountAuthority"]

[[durable_objects.bindings]]
name = "MANAGER_ASSOCIATIONS"
class_name = "ManagerAssociations"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["ManagerAssociations"]

# Narrow read/verify methods only; these bindings do not activate provisioning.
[[services]]
binding = "IDENTITY_NATIVE_APPROVAL"
service = "oasis7-custody-identity-staging"
entrypoint = "IdentityNativeApproval"

[[services]]
binding = "RECOVERY_FENCE"
service = "oasis7-custody-recovery-fence-staging"
entrypoint = "RecoveryFenceReader"

# Role-local immutable key storage; activation and KEK are intentionally absent.
[[durable_objects.bindings]]
name = "ROLE_KEYS"
class_name = "RoleKeyVault"

[[migrations]]
tag = "v3"
new_sqlite_classes = ["RoleKeyVault"]

[[services]]
binding = "ACCOUNT_KEY_PERMITS"
service = "oasis7-custody-owner-staging"
entrypoint = "OwnerKeyPermits"

[[services]]
binding = "IDENTITY_PROVISION_KEYS"
service = "oasis7-custody-identity-staging"
entrypoint = "RoleKeyProvision"

[[services]]
binding = "OWNER_PROVISION_KEYS"
service = "oasis7-custody-owner-staging"
entrypoint = "RoleKeyProvision"

[[services]]
binding = "EXECUTOR_PROVISION_KEYS"
service = "oasis7-custody-executor-staging"
entrypoint = "RoleKeyProvision"

[[services]]
binding = "IDENTITY_NATIVE_PROVISION"
service = "oasis7-custody-identity-staging"
entrypoint = "IdentityNativeProvision"

[[services]]
binding = "IDENTITY_NATIVE_HISTORY"
service = "oasis7-custody-identity-staging"
entrypoint = "NativeProvisionHistory"

[[services]]
binding = "IDENTITY_NATIVE_STATUS_RECOVERY"
service = "oasis7-custody-identity-staging"
entrypoint = "NativeProvisionRecovery"

# Separate fixed metadata and TestSession capabilities. Feature flags and trusted
# host profiles remain absent, so these bindings do not activate the workflow.
[[durable_objects.bindings]]
name = "CLIENT_ENROLLMENTS"
class_name = "ClientEnrollmentAuthority"
script_name = "oasis7-custody-identity-staging"

[[services]]
binding = "IDENTITY_TEST_SESSIONS"
service = "oasis7-custody-identity-staging"
entrypoint = "IdentityTestSessions"

[[services]]
binding = "TEST_SESSION_PRIVATE_HISTORY"
service = "oasis7-custody-identity-staging"
entrypoint = "TestSessionPrivateHistory"
