# Isolated staging artifact. Use a separate scoped publisher for this role.
name = "oasis7-custody-identity-staging"
main = "../../artifacts/identity/entry.mjs"
compatibility_date = "2026-10-25"
workers_dev = false
preview_urls = false

[build]
cwd = "."
command = "bash scripts/build-role.sh identity"

[[durable_objects.bindings]]
name = "NATIVE_SESSIONS"
class_name = "NativeSession"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["NativeSession"]

# Fixed named entrypoint; default Owner fetch and Account DO are not exposed.
[[services]]
binding = "OWNER_MANAGEMENT"
service = "oasis7-custody-owner-staging"
entrypoint = "OwnerManagement"

# Native stage authority has a separate fixed capability; no default RPC export.
[[services]]
binding = "OWNER_NATIVE_PERMITS"
service = "oasis7-custody-owner-staging"
entrypoint = "OwnerNativePermits"

# The independent native-source channel has no browser or Executor binding.
[[services]]
binding = "OWNER_REVOCATIONS"
service = "oasis7-custody-owner-staging"
entrypoint = "OwnerRevocations"

[triggers]
crons = ["* * * * *"]

# Role-local immutable key storage; activation and KEK are intentionally absent.
[[durable_objects.bindings]]
name = "ROLE_KEYS"
class_name = "RoleKeyVault"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["RoleKeyVault"]

[[services]]
binding = "ACCOUNT_KEY_PERMITS"
service = "oasis7-custody-owner-staging"
entrypoint = "IdentityKeyPermits"

[[services]]
binding = "RECOVERY_FENCE"
service = "oasis7-custody-recovery-fence-staging"
entrypoint = "RecoveryFenceReader"

# Public metadata has its own actor namespace; no key material or purpose grant.
[[durable_objects.bindings]]
name = "CLIENT_ENROLLMENTS"
class_name = "ClientEnrollmentAuthority"

[[migrations]]
tag = "v3"
new_sqlite_classes = ["ClientEnrollmentAuthority"]
