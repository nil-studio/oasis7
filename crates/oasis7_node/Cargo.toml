[package]
name = "oasis7_node"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
path = "src/lib.rs"

[features]
default = ["libp2p"]
libp2p = ["dep:futures", "dep:libp2p", "oasis7_net/libp2p"]
test-hooks = []

[dependencies]
oasis7_net = { version = "0.1.0", path = "../oasis7_net", default-features = false }
oasis7_consensus = { version = "0.1.0", path = "../oasis7_consensus" }
oasis7_distfs = { version = "0.1.0", path = "../oasis7_distfs" }
oasis7_client_api = { version = "0.1.0", path = "../oasis7_client_api" }
oasis7_proto = { version = "0.1.0", path = "../oasis7_proto" }
blake3 = "1"
ed25519-dalek = "3"
futures = { version = "0.3", optional = true }
hex = "0.4"
getrandom = "0.4"
libp2p = { git = "https://github.com/libp2p/rust-libp2p", rev = "2d8497b2615086bd88018ef3a1fb32bc613a07ca", optional = true, default-features = false, features = ["cbor", "gossipsub", "macros", "noise", "request-response", "tcp", "tokio", "yamux"] }
serde = { version = "1", features = ["derive"] }
serde_cbor = { package = "serde_cbor_2", version = "0.13" }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem"] }
