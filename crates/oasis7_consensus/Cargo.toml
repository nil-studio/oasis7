[package]
name = "oasis7_consensus"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
path = "src/lib.rs"

[dependencies]
oasis7_proto = { version = "0.1.0", path = "../oasis7_proto" }
oasis7_cas = { version = "0.1.0", path = "../oasis7_cas" }
oasis7_formal_protocol = { version = "0.1.0", path = "../oasis7_formal_protocol" }
blake3 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_cbor = { package = "serde_cbor_2", version = "0.13" }
hmac = "0.13"
sha2 = "0.11"
hex = "0.4"
ed25519-dalek = "3"
