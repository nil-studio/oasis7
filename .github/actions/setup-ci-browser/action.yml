name: Prepare pinned CI browser
description: Verify cached downloads, install complete bounded system dependencies, and probe the pinned browser
inputs:
  browser:
    description: agent for Viewer Chrome, playwright for the existing Deck headless shell
    required: true
  prebuilt:
    description: Verify and activate Playwright already provided by the job image
    default: "false"
    required: false
runs:
  using: composite
  steps:
    - name: Identify exact browser download caches
      if: inputs.prebuilt != 'true'
      id: downloads
      shell: bash
      env:
        BROWSER_KIND: ${{ inputs.browser }}
      run: python3 scripts/ci-browser-deps.py metadata --browser "$BROWSER_KIND" --github-output "$GITHUB_OUTPUT"
    - name: Restore fixed CJK font archive
      if: inputs.browser == 'agent'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.downloads.outputs.fonts_noto_cjk_root }}
        key: ${{ steps.downloads.outputs.fonts_noto_cjk_key }}
    - name: Restore fixed Freefont archive
      if: inputs.prebuilt != 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.downloads.outputs.fonts_freefont_ttf_root }}
        key: ${{ steps.downloads.outputs.fonts_freefont_ttf_key }}
    - name: Restore fixed Viewer Chrome archive
      if: inputs.browser == 'agent'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.downloads.outputs.chrome_root }}
        key: ${{ steps.downloads.outputs.chrome_key }}
    - name: Install locked browser tools without lifecycle scripts
      shell: bash
      env:
        PREBUILT_BROWSER: ${{ inputs.prebuilt }}
      run: |
        if [[ "${PREBUILT_BROWSER:-false}" == true ]]; then exit 0; fi
        python3 scripts/ci-browser-deps.py tools
    - name: Verify browser downloads and inspect complete dependencies
      shell: bash
      env:
        PREBUILT_BROWSER: ${{ inputs.prebuilt }}
        BROWSER_KIND: ${{ inputs.browser }}
      run: |
        if [[ "${PREBUILT_BROWSER:-false}" == true ]]; then exit 0; fi
        python3 scripts/ci-browser-deps.py prepare --browser "$BROWSER_KIND" --work-dir "$RUNNER_TEMP/oasis7-ci-browser-$BROWSER_KIND"
    - name: Install missing browser system dependencies
      shell: bash
      env:
        PREBUILT_BROWSER: ${{ inputs.prebuilt }}
        BROWSER_KIND: ${{ inputs.browser }}
      run: |
        if [[ "${PREBUILT_BROWSER:-false}" == true ]]; then exit 0; fi
        mapfile -t browser_packages < "$RUNNER_TEMP/oasis7-ci-browser-$BROWSER_KIND/apt-arguments.txt"
        if (( ${#browser_packages[@]} )); then
          sudo -n /usr/bin/python3 scripts/ci-apt-install.py --budget-seconds 300 --no-remove "${browser_packages[@]}"
        fi
    - name: Verify and launch the actual pinned browser
      shell: bash
      env:
        PREBUILT_BROWSER: ${{ inputs.prebuilt }}
        BROWSER_KIND: ${{ inputs.browser }}
      run: |
        if [[ "${PREBUILT_BROWSER:-false}" == true ]]; then exit 0; fi
        python3 scripts/ci-browser-deps.py activate --browser "$BROWSER_KIND" --work-dir "$RUNNER_TEMP/oasis7-ci-browser-$BROWSER_KIND" --github-env "$GITHUB_ENV"
    - name: Capture browser installation failure
      if: failure() && inputs.browser == 'agent'
      shell: bash
      run: python3 scripts/security/viewer-browser-install-diagnostic.py output/viewer-browser-install/diagnostic.json || echo 'Browser install diagnostic unavailable'
    - name: Verify and launch the prebuilt Playwright browser
      if: inputs.prebuilt == 'true'
      shell: bash
      env:
        BROWSER_KIND: ${{ inputs.browser }}
      run: python3 scripts/ci-browser-deps.py activate --prebuilt --browser "$BROWSER_KIND" --work-dir "$RUNNER_TEMP/oasis7-ci-browser-$BROWSER_KIND" --github-env "$GITHUB_ENV"
