# Twice-weekly version updates use ordinary PR review and CI; no automatic merging.
# Compatibility fixtures, vendored/third_party sources, minimal templates, and
# docker/ci-base (workflow-supplied UBUNTU_BASE ARG) are intentionally excluded.
# Cargo workspace members are covered by their workspace root manifest.
version: 2
updates:
  - package-ecosystem: cargo
    directories:
      - "/"
      - "/crates/oasis7_builtin_wasm_modules/m*"
      - "/crates/oasis7_builtin_wasm_modules/local_test_provider"
      - "/docker/wasm-builder"
      - "/tools/oasis7-command-center"
    schedule:
      interval: cron
      cronjob: "0 9 * * 1,3"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 3
    groups:
      cargo-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directories:
      - "/crates/oasis7_viewer"
      - "/crates/oasis7_agent_api/protocol_conformance"
      - "/crates/oasis7_custody_worker"
      - "/crates/oasis7_dev_test_worker"
      - "/scripts/ci-browser-tools"
      - "/tools/oasis7-command-center/ui"
    schedule:
      interval: cron
      cronjob: "0 9 * * 1,3"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 3
    groups:
      npm-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: cron
      cronjob: "0 9 * * 1,3"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 3
    groups:
      actions-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories:
      - "/docker/wasm-builder"
      - "/docker/ci-base/ecs-oss"
    schedule:
      interval: cron
      cronjob: "0 9 * * 1,3"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 3
    groups:
      docker-images:
        patterns: ["*"]
