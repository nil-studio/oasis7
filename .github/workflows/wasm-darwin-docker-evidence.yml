name: Wasm Darwin Docker Evidence

on:
  workflow_dispatch:
    inputs:
      runs_on_json:
        description: JSON array of labels for a Docker-capable darwin arm64 self-hosted runner.
        required: true
        default: '["self-hosted","macOS","ARM64","docker"]'
        type: string
      verify_with_linux:
        description: Import the darwin bundle into an Ubuntu-hosted linux-x86_64 verification report.
        required: true
        default: true
        type: boolean

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_TOOLCHAIN: 1.96.0
  OASIS7_WASM_TOOLCHAIN: nightly-2025-12-11
  OASIS7_WASM_TARGET: wasm32-unknown-unknown
  OASIS7_WASM_BUILD_STD: "1"
  OASIS7_WASM_BUILD_STD_COMPONENTS: std,panic_abort
  EVIDENCE_ROOT: output/ci/wasm-darwin-docker-evidence
  MODULE_SETS: m1,m4,m5
  RUNNER_LABEL: darwin-arm64
  BUNDLE_ARTIFACT_NAME: darwin-arm64-wasm-summary-bundle
  REPORT_ARTIFACT_NAME: darwin-arm64-wasm-release-evidence-report

permissions:
  contents: read

jobs:
  collect-darwin-docker-summaries:
    name: Collect darwin-arm64 Docker summaries
    runs-on: ${{ fromJSON(inputs.runs_on_json) }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Rust toolchains
        run: |
          rustup toolchain install "${RUST_TOOLCHAIN}" --profile default
          rustup target add wasm32-unknown-unknown --toolchain "${RUST_TOOLCHAIN}"
          rustup default "${RUST_TOOLCHAIN}"
          rustup toolchain install "${OASIS7_WASM_TOOLCHAIN}" --profile minimal --component rust-src
          rustup target add "${OASIS7_WASM_TARGET}" --toolchain "${OASIS7_WASM_TOOLCHAIN}"

      - name: Preflight Docker and host identity
        run: |
          mkdir -p "${EVIDENCE_ROOT}/preflight"
          test "$(uname -s)" = "Darwin"
          arch="$(uname -m)"
          case "$arch" in
            arm64|aarch64) ;;
            *)
              echo "error: expected darwin arm64 host, got arch=$arch" >&2
              exit 2
              ;;
          esac
          command -v jq
          command -v docker
          docker version
          {
            printf 'runner_label=%s\n' "$RUNNER_LABEL"
            printf 'host_uname_s=%s\n' "$(uname -s)"
            printf 'host_uname_m=%s\n' "$(uname -m)"
            printf 'docker_path=%s\n' "$(command -v docker)"
            docker version
          } > "${EVIDENCE_ROOT}/preflight/docker-host.txt"
          docker run --rm --platform linux/amd64 alpine:3.20 uname -m | tee "${EVIDENCE_ROOT}/preflight/docker-platform.txt"
          grep -Eq '^(x86_64|amd64)$' "${EVIDENCE_ROOT}/preflight/docker-platform.txt"
          printf 'runner_label=%s\n' "$RUNNER_LABEL"

      - name: Record candidate producer recipe
        run: |
          mkdir -p "${EVIDENCE_ROOT}/preflight"
          env -u RUSTC_WRAPPER cargo run --quiet --locked -p wasm_build_suite -- \
            producer-recipe "$PWD" "${EVIDENCE_ROOT}/preflight/producer-recipe.json"
          # Each canonical wrapper build captures its own iidfile and reports
          # actual execution identity in receipt4, independently of this recipe.

      - name: Package darwin-arm64 summary bundle
        run: |
          mkdir -p "${EVIDENCE_ROOT}"
          ./scripts/package-wasm-summary-bundle.sh --baseline-kind candidate-build \
            --out-dir "${EVIDENCE_ROOT}/bundle" \
            --archive "${EVIDENCE_ROOT}/darwin-arm64-wasm-summary-bundle.tar.gz" \
            --module-sets "${MODULE_SETS}" \
            --runner-label "${RUNNER_LABEL}"
          jq -e \
            --arg runner "$RUNNER_LABEL" \
            '.purpose == "candidate-build" and (.baseline_sha256 | test("^[0-9a-f]{64}$")) and .runner_label == $runner and .host_platform == "darwin-arm64" and .canonical_platforms == ["linux-x86_64"]' \
            "${EVIDENCE_ROOT}/bundle/bundle_manifest.json"

      - name: Upload darwin-arm64 summary bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.BUNDLE_ARTIFACT_NAME }}
          path: |
            ${{ env.EVIDENCE_ROOT }}/preflight
            ${{ env.EVIDENCE_ROOT }}/bundle
            ${{ env.EVIDENCE_ROOT }}/darwin-arm64-wasm-summary-bundle.tar.gz
          if-no-files-found: error
          retention-days: 14

  verify-with-linux-summaries:
    name: Verify linux-x86_64 plus darwin-arm64 evidence
    if: ${{ inputs.verify_with_linux }}
    needs: collect-darwin-docker-summaries
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Rust toolchains
        run: |
          rustup toolchain install "${RUST_TOOLCHAIN}" --profile default
          rustup target add wasm32-unknown-unknown --toolchain "${RUST_TOOLCHAIN}"
          rustup default "${RUST_TOOLCHAIN}"
          rustup toolchain install "${OASIS7_WASM_TOOLCHAIN}" --profile minimal --component rust-src
          rustup target add "${OASIS7_WASM_TARGET}" --toolchain "${OASIS7_WASM_TOOLCHAIN}"

      - name: Download darwin-arm64 summary bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ env.BUNDLE_ARTIFACT_NAME }}
          path: ${{ env.EVIDENCE_ROOT }}/external

      - name: Collect linux-x86_64 summaries
        run: |
          IFS=',' read -r -a module_sets <<< "$MODULE_SETS"
          for module_set in "${module_sets[@]}"; do
            module_set="$(echo "$module_set" | xargs)"
            [[ -n "$module_set" ]] || continue
            ./scripts/ci-m1-wasm-summary.sh --baseline-kind candidate-build \
              --module-set "$module_set" \
              --runner-label linux-x86_64 \
              --out "${EVIDENCE_ROOT}/linux/${module_set}/linux-x86_64.json"
          done

      - name: Stage darwin-arm64 imports
        env:
          BUNDLE_ARCHIVE: ${{ env.EVIDENCE_ROOT }}/external/darwin-arm64-wasm-summary-bundle.tar.gz
        run: |
          test -f "$BUNDLE_ARCHIVE"
          IFS=',' read -r -a module_sets <<< "$MODULE_SETS"
          for module_set in "${module_sets[@]}"; do
            module_set="$(echo "$module_set" | xargs)"
            [[ -n "$module_set" ]] || continue
            ./scripts/stage-wasm-summary-imports.sh \
              --module-set "$module_set" \
              --local-summary-dir "${EVIDENCE_ROOT}/linux/${module_set}" \
              --out-dir "${EVIDENCE_ROOT}/staged/${module_set}" \
              --external-summary-bundle "$BUNDLE_ARCHIVE" \
              --expected-external-runner "$RUNNER_LABEL" \
              --expected-external-host darwin-arm64 \
              --expected-canonical-platform linux-x86_64
          done

      - name: Write cross-host evidence report
        run: |
          ./scripts/wasm-release-evidence-report.sh \
            --module-sets "$MODULE_SETS" \
            --skip-collect \
            --summary-import-dir "${EVIDENCE_ROOT}/staged" \
            --out-dir "${EVIDENCE_ROOT}/report" \
            --runner-label linux-x86_64 \
            --required-runners linux-x86_64 \
            --expected-runners "linux-x86_64,${RUNNER_LABEL}"

          summary_json="$(find "${EVIDENCE_ROOT}/report" -name summary.json | sort | tail -n 1)"
          test -n "$summary_json"
          jq -e \
            --arg runner "$RUNNER_LABEL" \
            '.purpose == "candidate-build"
              and (.baseline_sha256 | test("^[0-9a-f]{64}$"))
              and .gate_result == "cross-host-closed"
              and .cross_host_evidence_pending == false
              and (.received_runners | index("linux-x86_64"))
              and (.received_runners | index($runner))
              and (.module_sets | map(.module_set) | sort) == ["m1","m4","m5"]
              and all(.module_sets[]; .canonical_hash_consistent == true)
              and all(.module_sets[]; .receipt_evidence_consistent == true)' \
            "$summary_json"

      - name: Upload cross-host evidence report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.REPORT_ARTIFACT_NAME }}
          path: ${{ env.EVIDENCE_ROOT }}/report
          if-no-files-found: error
          retention-days: 14
