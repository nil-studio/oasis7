name: Storage Acceptance
run-name: Storage acceptance / ${{ github.ref_name }} / namespace ${{ inputs.capacity_scale }} / full-node ${{ inputs.full_node_scale }}

on:
  workflow_dispatch:
    inputs:
      capacity_scale:
        description: 'Additional actual World capacity run (10 is always verified)'
        type: choice
        required: true
        default: '10'
        options: ['10', '1000', '10000']
      full_node_scale:
        description: 'Additional real full-node maintenance run (10 is always verified; resource exhaustion fails)'
        type: choice
        required: true
        default: '10'
        options: ['10', '1000', '10000']
      inventory_entry_limit:
        description: 'Full-node paths per inventory (1..10000000; default retained, exhaustion fails)'
        type: string
        required: true
        default: '5000000'
      attempt_release_host_reference:
        description: 'Also verify attempt-release on host using this same source and complete bundle'
        type: boolean
        required: true
        default: false
      repeat_faults:
        description: 'Repetitions of each case under each network fault profile'
        type: choice
        required: true
        default: '1'
        options: ['1', '2', '3']

permissions:
  contents: read

cache-mode: read

concurrency:
  group: storage-acceptance-${{ github.run_id }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  RUST_TOOLCHAIN: 1.96.0
  OASIS7_WASM_TOOLCHAIN: nightly-2025-12-11
  OASIS7_WASM_TARGET: wasm32-unknown-unknown
  OASIS7_WASM_BUILD_STD: '1'
  OASIS7_WASM_BUILD_STD_COMPONENTS: std,panic_abort
  SOURCE_SHA: ${{ github.sha }}
  STORAGE_BUILD_IMAGE: &storage-build-image ghcr.io/nil-studio/oasis7/ci-rust-build@sha256:bc886637f7bf153dfb60df5c8f56e82949a8f4d9ec2ffd571750eae2fe1a795f
  STORAGE_ARTIFACT_CHECKOUT: /__w/oasis7/oasis7
  ImageOS: ubuntu24
  OASIS7_STORAGE_MAX_LOGICAL_BYTES: '4294967296'
  OASIS7_STORAGE_STEP_BYTES: '67108864'
  OASIS7_STORAGE_PROGRESS_INTERVAL: '100'

jobs:
  build-components:
    strategy:
      fail-fast: false
      matrix:
        component: [storage-required, storage-executables, storage-tests]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    container:
      image: *storage-build-image
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    defaults:
      run:
        shell: bash
    # Cold optimized artifacts can exhaust the previous 90-minute build budget.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate inventory budget before building artifacts
        env:
          INVENTORY_ENTRY_LIMIT: ${{ inputs.inventory_entry_limit }}
        run: |
          python3 - "$INVENTORY_ENTRY_LIMIT" <<'PY_INVENTORY'
          import sys
          value = sys.argv[1]
          if not value.isascii() or not value.isdecimal() or not 1 <= int(value) <= 10_000_000:
              raise SystemExit('inventory entry limit must be an integer in 1..10000000')
          PY_INVENTORY
      - name: Trust the checked-out workspace path in the job container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Configure mold for Linux host linking
        uses: ./.github/actions/setup-linux-mold
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Verify the preinstalled build tools
        run: |
          set -euo pipefail
          rustc +"$RUST_TOOLCHAIN" -vV
          rustc +"$OASIS7_WASM_TOOLCHAIN" -vV
          rustup component list --installed --toolchain "$OASIS7_WASM_TOOLCHAIN" | grep -Fx rust-src
          rustup target list --installed --toolchain "$OASIS7_WASM_TOOLCHAIN" | grep -Fx "$OASIS7_WASM_TARGET"
          pkg-config --exists wayland-client x11 alsa libudev
      - name: Stabilize Rust cache toolchains
        run: python3 scripts/ci-rust-cache-toolchains.py "$RUST_TOOLCHAIN" "$OASIS7_WASM_TOOLCHAIN"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: false
          shared-key: ci-rust-build-bc886637f7bf153dfb60df5c8f56e82949a8f4d9ec2ffd571750eae2fe1a795f
          add-rust-environment-hash-key: true
          env-vars: CARGO CC CFLAGS CXX CMAKE RUST OASIS7_WASM
          cache-on-failure: false
      - name: Build and inventory exact native acceptance executables
        env:
          COMPONENT: ${{ matrix.component }}
        run: |
          test "$(pwd -P)" = "$STORAGE_ARTIFACT_CHECKOUT"
          python3 scripts/ci-storage-acceptance.py build --component "$COMPONENT" --bundle "$RUNNER_TEMP/component"
          python3 scripts/ci-storage-acceptance.py pack --component "$COMPONENT" --bundle "$RUNNER_TEMP/component" --output "$RUNNER_TEMP/$COMPONENT.tar.gz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: component-${{ matrix.component }}
          path: ${{ runner.temp }}/${{ matrix.component }}.tar.gz
          compression-level: 0
          retention-days: 2
          if-no-files-found: error
          overwrite: true

  build:
    needs: build-components
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    container:
      image: *storage-build-image
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    defaults:
      run:
        shell: bash
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Trust the checked-out workspace path in the job container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Configure mold for Linux host linking
        uses: ./.github/actions/setup-linux-mold
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: component-storage-*
          path: ${{ runner.temp }}/components
      - name: Validate and merge the complete Storage bundle
        run: |
          test "$(pwd -P)" = "$STORAGE_ARTIFACT_CHECKOUT"
          python3 scripts/ci-storage-acceptance.py merge --component-directory "$RUNNER_TEMP/components" --bundle "$RUNNER_TEMP/storage-tests"
          python3 scripts/ci-storage-acceptance.py pack --bundle "$RUNNER_TEMP/storage-tests" --output "$RUNNER_TEMP/storage-tests.tar.gz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: storage-tests-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/storage-tests.tar.gz
          compression-level: 0
          retention-days: 2
          if-no-files-found: error

  verify:
    name: Verify / ${{ matrix.label }}
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - {label: attempt-release, group: attempt-release, network: none, scale: '10'}
          - {label: full-node-10, group: full-node, network: none, scale: '10'}
          - {label: units, group: units, network: none, scale: '10'}
          - {label: runtime-protocol, group: runtime-protocol, network: none, scale: '10'}
          - {label: world-history, group: world-history, network: none, scale: '10'}
          - {label: healthy-set, group: healthy-set, network: none, scale: '10'}
          - {label: storage-recovery, group: storage-recovery, network: none, scale: '10'}
          - {label: lifecycle-cli, group: lifecycle-cli, network: none, scale: '10'}
          - {label: capacity-10, group: capacity, network: none, scale: '10'}
          - {label: disk-full, group: disk, network: none, scale: '10'}
          - {label: network-delay, group: network, network: delay, scale: '10'}
          - {label: network-loss, group: network, network: loss, scale: '10'}
    steps: &acceptance-consumer
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Install consumer libraries
        if: ${{ matrix.label == 'attempt-release-host' || !contains(fromJSON('["units","runtime-protocol","world-history","healthy-set","storage-recovery","lifecycle-cli","attempt-release"]'), matrix.group) }}
        run: |
          sudo apt-get update
          sudo apt-get install -y iproute2 libwayland-client0 libxkbcommon0 libxi6 libxcursor1 libxrandr2 libxinerama1 libasound2t64 libudev1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: storage-tests-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}
      - name: Unpack executables preserving modes
        run: |
          mkdir "$RUNNER_TEMP/storage-tests"
          tar -C "$RUNNER_TEMP/storage-tests" -xzf "$RUNNER_TEMP/storage-tests.tar.gz"
      - name: Install owned loopback fault model
        if: matrix.network != 'none'
        env:
          PROFILE: ${{ matrix.network }}
        run: python3 scripts/ci-storage-network.py setup --profile "$PROFILE" --report output/network/network-setup.json
      - name: Mount isolated small filesystem for actual ENOSPC
        if: matrix.group == 'disk'
        run: |
          mkdir "$RUNNER_TEMP/storage-enospc"
          mkdir -p output/disk
          sudo mount -t tmpfs -o "size=64m,mode=0700,uid=$(id -u),gid=$(id -g)" oasis7-storage-acceptance "$RUNNER_TEMP/storage-enospc"
          findmnt --json --target "$RUNNER_TEMP/storage-enospc" > output/disk/mount.json
      - name: Run acceptance with exact inventory and process cleanup
        env:
          USE_PREBUILT: ${{ matrix.label != 'attempt-release-host' && contains(fromJSON('["units","runtime-protocol","world-history","healthy-set","storage-recovery","lifecycle-cli","attempt-release"]'), matrix.group) }}
          GHCR_TOKEN: ${{ matrix.label != 'attempt-release-host' && contains(fromJSON('["units","runtime-protocol","world-history","healthy-set","storage-recovery","lifecycle-cli","attempt-release"]'), matrix.group) && github.token || '' }}
          STORAGE_VERIFY_IMAGE: ghcr.io/nil-studio/oasis7/ci-build@sha256:027eb11ad5c315b7ba3aaf834d3ceff5bd84cf6d4d7dfb196bbe4989fc9aa57c
          GROUP: ${{ matrix.group }}
          LABEL: ${{ matrix.label }}
          NETWORK: ${{ matrix.network }}
          FAULT_REPEATS: ${{ inputs.repeat_faults }}
          SCALE: ${{ matrix.scale }}
          INVENTORY_ENTRY_LIMIT: ${{ inputs.inventory_entry_limit }}
          OASIS7_STORAGE_ENOSPC_ROOT: ${{ runner.temp }}/storage-enospc
          OASIS7_FORMAL_EXECUTION_TIMING: ${{ matrix.group == 'full-node' && '1' || '' }}
        run: |
          repeats=1
          if [[ "$NETWORK" != none ]]; then repeats="$FAULT_REPEATS"; fi
          command=(python3 scripts/ci-storage-acceptance.py run --bundle "$RUNNER_TEMP/storage-tests" --group "$GROUP" --label "$LABEL" --results-dir output/storage --capacity-scale "$SCALE" --repeat-faults "$repeats" --inventory-entry-limit "$INVENTORY_ENTRY_LIMIT")
          if [[ "$USE_PREBUILT" != true ]]; then
            # Cargo embeds absolute executable paths. A bind mount preserves
            # this path for host-only tests and for Python's resolved checkout.
            sudo mkdir -p "$(dirname "$STORAGE_ARTIFACT_CHECKOUT")"
            sudo mkdir "$STORAGE_ARTIFACT_CHECKOUT"
            trap 'sudo rmdir "$STORAGE_ARTIFACT_CHECKOUT"' EXIT
            sudo mount --bind "$GITHUB_WORKSPACE" "$STORAGE_ARTIFACT_CHECKOUT"
            trap 'cd / && sudo umount "$STORAGE_ARTIFACT_CHECKOUT" && sudo rmdir "$STORAGE_ARTIFACT_CHECKOUT"' EXIT
            cd "$STORAGE_ARTIFACT_CHECKOUT"
            GITHUB_WORKSPACE="$STORAGE_ARTIFACT_CHECKOUT" "${command[@]}"
            exit
          fi
          export DOCKER_CONFIG
          DOCKER_CONFIG=$(mktemp -d)
          trap 'rm -rf "$DOCKER_CONFIG"' EXIT
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          unset GHCR_TOKEN
          time docker pull "$STORAGE_VERIFY_IMAGE"
          if [[ "$GROUP" == attempt-release ]]; then
            fixture_host="$GITHUB_WORKSPACE/output/attempt-release-image"
            fixture="$STORAGE_ARTIFACT_CHECKOUT/output/attempt-release-image"
            mkdir -p "$GITHUB_WORKSPACE/output"
            mkdir -m 0700 "$fixture_host"
            mkdir -m 0700 "$fixture_host/tmp"
            fixture_device=$(stat -c %d "$fixture_host")
            fixture_inode=$(stat -c %i "$fixture_host")
            command=(python3 scripts/ci-storage-acceptance.py run --bundle "$RUNNER_TEMP/storage-tests" --group "$GROUP" --label "$LABEL" --results-dir output/attempt-release-image/results --capacity-scale "$SCALE" --repeat-faults "$repeats" --inventory-entry-limit "$INVENTORY_ENTRY_LIMIT")
            # All measured files and sampled results share this single real
            # runner filesystem bind. No host PID or extra capabilities.
            docker run --rm --init --pull never --user "$(id -u):$(id -g)" \
              --mount "type=bind,source=$GITHUB_WORKSPACE,target=$STORAGE_ARTIFACT_CHECKOUT" \
              --mount "type=bind,source=$RUNNER_TEMP/storage-tests,target=$RUNNER_TEMP/storage-tests,readonly" \
              --mount "type=bind,source=$fixture_host,target=$fixture" \
              --workdir "$STORAGE_ARTIFACT_CHECKOUT" --env GITHUB_WORKSPACE="$STORAGE_ARTIFACT_CHECKOUT" \
              --env HOME="$fixture/tmp" --env TMPDIR="$fixture/tmp" \
              --env OASIS7_STORAGE_IMAGE_FIXTURE="$fixture" \
              --env OASIS7_STORAGE_FIXTURE_DEVICE="$fixture_device" --env OASIS7_STORAGE_FIXTURE_INODE="$fixture_inode" \
              --env SOURCE_SHA --env GITHUB_RUN_ID --env GITHUB_RUN_ATTEMPT --env RUST_TOOLCHAIN --env ImageOS --env ImageVersion \
              "$STORAGE_VERIFY_IMAGE" "${command[@]}"
            exit
          fi
          # Reap orphaned process fixtures inside the container PID namespace.
          docker run --rm --init --pull never --user "$(id -u):$(id -g)" \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=$STORAGE_ARTIFACT_CHECKOUT" \
            --mount "type=bind,source=$RUNNER_TEMP/storage-tests,target=$RUNNER_TEMP/storage-tests,readonly" \
            --workdir "$STORAGE_ARTIFACT_CHECKOUT" --env GITHUB_WORKSPACE="$STORAGE_ARTIFACT_CHECKOUT" --env HOME=/tmp --env SOURCE_SHA --env GITHUB_RUN_ID --env GITHUB_RUN_ATTEMPT \
            --env RUST_TOOLCHAIN --env ImageOS --env ImageVersion \
            "$STORAGE_VERIFY_IMAGE" "${command[@]}"
      - name: Check actual fault traffic
        if: always() && matrix.network != 'none'
        env:
          PROFILE: ${{ matrix.network }}
        run: python3 scripts/ci-storage-network.py check --profile "$PROFILE" --report output/network/network-observed.json
      - name: Remove only the owned fault discipline
        if: always() && matrix.network != 'none'
        env:
          PROFILE: ${{ matrix.network }}
        run: python3 scripts/ci-storage-network.py cleanup --profile "$PROFILE" --report output/network/network-cleanup.json
      - name: Unmount isolated ENOSPC filesystem
        if: always() && matrix.group == 'disk'
        run: |
          if mountpoint -q "$RUNNER_TEMP/storage-enospc"; then
            test "$(findmnt -n -o SOURCE --target "$RUNNER_TEMP/storage-enospc")" = oasis7-storage-acceptance
            sudo umount "$RUNNER_TEMP/storage-enospc"
          fi
          ! mountpoint -q "$RUNNER_TEMP/storage-enospc"
      - name: Preserve results including failures and partial runs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: storage-result-${{ matrix.label }}-${{ github.run_attempt }}
          path: |
            output
            !output/attempt-release-image/tmp/**
          retention-days: 14
          if-no-files-found: error

  attempt-release-reference:
    name: Attempt release / host reference
    if: inputs.attempt_release_host_reference
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      matrix:
        include:
          - {label: attempt-release-host, group: attempt-release, network: none, scale: '10'}
    steps: *acceptance-consumer

  capacity-long:
    name: Capacity / ${{ inputs.capacity_scale }} heights
    if: inputs.capacity_scale != '10'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      OASIS7_STORAGE_MAX_LOGICAL_BYTES: '17179869184'
    strategy:
      matrix:
        include:
          - label: capacity-${{ inputs.capacity_scale }}
            group: capacity
            network: none
            scale: ${{ inputs.capacity_scale }}
    steps: *acceptance-consumer

  full-node-long:
    name: Full node maintenance / ${{ inputs.full_node_scale }} commits
    if: inputs.full_node_scale != '10'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      matrix:
        include:
          - label: full-node-${{ inputs.full_node_scale }}
            group: full-node
            network: none
            scale: ${{ inputs.full_node_scale }}
    steps: *acceptance-consumer

  summary:
    if: always()
    needs: [build, verify, capacity-long, full-node-long, attempt-release-reference]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: storage-result-*-${{ github.run_attempt }}
          path: output/collected
      - name: Require every planned job and exact result inventory
        if: always()
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          SCALE: ${{ inputs.capacity_scale }}
          FULL_NODE_SCALE: ${{ inputs.full_node_scale }}
          HOST_REFERENCE: ${{ inputs.attempt_release_host_reference }}
        run: |
          mkdir -p output
          printf '%s\n' "$NEEDS_JSON" > output/needs.json
          args=()
          for label in units runtime-protocol world-history healthy-set storage-recovery lifecycle-cli capacity-10 full-node-10 attempt-release disk-full network-delay network-loss; do
            args+=(--expected "$label")
          done
          if [[ "$HOST_REFERENCE" == true ]]; then args+=(--expected attempt-release-host); fi
          if [[ "$SCALE" != 10 ]]; then args+=(--expected "capacity-$SCALE"); fi
          if [[ "$FULL_NODE_SCALE" != 10 ]]; then args+=(--expected "full-node-$FULL_NODE_SCALE"); fi
          python3 scripts/ci-storage-acceptance.py summarize --results-dir output/collected "${args[@]}" --needs-json output/needs.json --output output/summary.json
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: storage-acceptance-summary-${{ github.run_attempt }}
          path: output
          retention-days: 14
          if-no-files-found: error
