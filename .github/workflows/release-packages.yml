name: Release Packages

on:
  push:
    tags:
      - "v*"
      - "20*-*-*_v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v0.1.0 or 2026-06-03_v1"
        required: true
        type: string

permissions:
  contents: read

cache-mode: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  RUST_TOOLCHAIN: 1.96.0
  TRUNK_VERSION: 0.21.14
  BUILTIN_WASM_TOOLCHAIN: nightly-2025-12-11
  BUILTIN_WASM_TARGET: wasm32-unknown-unknown

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      checkoutSha: ${{ steps.source.outputs.checkoutSha }}
      version: ${{ steps.source.outputs.version }}
      resolvedRef: ${{ steps.source.outputs.resolvedRef }}
      sourcePlan: ${{ steps.source.outputs.sourcePlan }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve immutable package source
        id: source
        env:
          REQUESTED_REF: ${{ inputs.tag || github.ref }}
        run: python3 scripts/package-source-plan.py --release

  release_gate_runtime_core:
    cache-mode: read
    name: release-gate-runtime-core
    needs: plan
    runs-on: ubuntu-24.04
    env:
      OASIS7_WASM_TOOLCHAIN: nightly-2025-12-11
      OASIS7_WASM_TARGET: wasm32-unknown-unknown
      OASIS7_WASM_BUILD_STD: "1"
      OASIS7_WASM_BUILD_STD_COMPONENTS: std,panic_abort
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.checkoutSha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify planned source HEAD
        shell: bash
        env:
          EXPECTED_SHA: ${{ needs.plan.outputs.checkoutSha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Resolve planned-source product-document range
        shell: bash
        run: |
          set -euo pipefail
          base_oid="$(git rev-parse --verify 'HEAD^1')"
          head_oid="$(git rev-parse --verify 'HEAD^{commit}')"
          printf 'OASIS7_PRODUCT_DOC_BASE=%s\n' "$base_oid" >>"$GITHUB_ENV"
          printf 'OASIS7_PRODUCT_DOC_HEAD=%s\n' "$head_oid" >>"$GITHUB_ENV"
      - name: Install product-document Markdown parser
        run: python3 -m pip install --disable-pip-version-check --requirement scripts/doc-governance-requirements.txt
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install "${RUST_TOOLCHAIN}" --profile default
          rustup default "${RUST_TOOLCHAIN}"
          rustup toolchain install "${OASIS7_WASM_TOOLCHAIN}" --profile minimal --component rust-src
          rustup target add "${OASIS7_WASM_TARGET}" --toolchain "${OASIS7_WASM_TOOLCHAIN}"
          rustup target add wasm32-unknown-unknown --toolchain "${RUST_TOOLCHAIN}"
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y             jq             netcat-openbsd             pkg-config             libwayland-dev             wayland-protocols             libxkbcommon-dev             libx11-dev             libxi-dev             libxcursor-dev             libxrandr-dev             libxinerama-dev             libasound2-dev             libudev-dev
      - name: Normalize Rust cache toolchains
        if: hashFiles('scripts/ci-rust-cache-toolchains.py') != ''
        shell: bash
        run: python3 scripts/ci-rust-cache-toolchains.py "$RUST_TOOLCHAIN" "$OASIS7_WASM_TOOLCHAIN"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        if: hashFiles('scripts/ci-rust-cache-toolchains.py') != ''
        with:
          shared-key: ci-shared-native-trusted-v3
          save-if: false
          cache-on-failure: false
          add-rust-environment-hash-key: true
          env-vars: CARGO CC CFLAGS CXX CMAKE RUST OASIS7_WASM
      - name: Run runtime core release gate
        shell: bash
        run: |
          mkdir -p .tmp/release_gate_runtime_core
          ./scripts/ci-tests.sh full-core | tee .tmp/release_gate_runtime_core/ci-tests-full-core.log
      - name: Upload runtime core gate summary
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-gate-runtime-core-summary
          path: .tmp/release_gate_runtime_core
          if-no-files-found: warn

  release_gate_runtime_support:
    cache-mode: read
    name: release-gate-runtime-support
    needs: plan
    runs-on: ubuntu-24.04
    env:
      OASIS7_WASM_TOOLCHAIN: nightly-2025-12-11
      OASIS7_WASM_TARGET: wasm32-unknown-unknown
      OASIS7_WASM_BUILD_STD: "1"
      OASIS7_WASM_BUILD_STD_COMPONENTS: std,panic_abort
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.checkoutSha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify planned source HEAD
        shell: bash
        env:
          EXPECTED_SHA: ${{ needs.plan.outputs.checkoutSha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Resolve planned-source product-document range
        shell: bash
        run: |
          set -euo pipefail
          base_oid="$(git rev-parse --verify 'HEAD^1')"
          head_oid="$(git rev-parse --verify 'HEAD^{commit}')"
          printf 'OASIS7_PRODUCT_DOC_BASE=%s\n' "$base_oid" >>"$GITHUB_ENV"
          printf 'OASIS7_PRODUCT_DOC_HEAD=%s\n' "$head_oid" >>"$GITHUB_ENV"
      - name: Install product-document Markdown parser
        run: python3 -m pip install --disable-pip-version-check --requirement scripts/doc-governance-requirements.txt
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install "${RUST_TOOLCHAIN}" --profile default
          rustup default "${RUST_TOOLCHAIN}"
          rustup toolchain install "${OASIS7_WASM_TOOLCHAIN}" --profile minimal --component rust-src
          rustup target add "${OASIS7_WASM_TARGET}" --toolchain "${OASIS7_WASM_TOOLCHAIN}"
          rustup target add wasm32-unknown-unknown --toolchain "${RUST_TOOLCHAIN}"
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y             pkg-config             libwayland-dev             wayland-protocols             libxkbcommon-dev             libx11-dev             libxi-dev             libxcursor-dev             libxrandr-dev             libxinerama-dev             libasound2-dev             libudev-dev
      - name: Normalize Rust cache toolchains
        if: hashFiles('scripts/ci-rust-cache-toolchains.py') != ''
        shell: bash
        run: python3 scripts/ci-rust-cache-toolchains.py "$RUST_TOOLCHAIN" "$OASIS7_WASM_TOOLCHAIN"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        if: hashFiles('scripts/ci-rust-cache-toolchains.py') != ''
        with:
          shared-key: ci-shared-native-trusted-v3
          save-if: false
          cache-on-failure: false
          add-rust-environment-hash-key: true
          env-vars: CARGO CC CFLAGS CXX CMAKE RUST OASIS7_WASM
      - name: Run runtime support release gate
        shell: bash
        run: |
          mkdir -p .tmp/release_gate_runtime_support
          ./scripts/ci-tests.sh full-support | tee .tmp/release_gate_runtime_support/ci-tests-full-support.log
      - name: Upload runtime support gate summary
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-gate-runtime-support-summary
          path: .tmp/release_gate_runtime_support
          if-no-files-found: warn

  release_gate_runtime_sync:
    cache-mode: read
    name: release-gate-runtime-sync
    needs: plan
    runs-on: ubuntu-24.04
    env:
      OASIS7_WASM_TOOLCHAIN: nightly-2025-12-11
      OASIS7_WASM_TARGET: wasm32-unknown-unknown
      OASIS7_WASM_BUILD_STD: "1"
      OASIS7_WASM_BUILD_STD_COMPONENTS: std,panic_abort
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.checkoutSha }}
          persist-credentials: false
      - name: Verify planned source HEAD
        shell: bash
        env:
          EXPECTED_SHA: ${{ needs.plan.outputs.checkoutSha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install "${RUST_TOOLCHAIN}" --profile default
          rustup default "${RUST_TOOLCHAIN}"
          rustup toolchain install "${OASIS7_WASM_TOOLCHAIN}" --profile minimal --component rust-src
          rustup target add "${OASIS7_WASM_TARGET}" --toolchain "${OASIS7_WASM_TOOLCHAIN}"
          rustup target add wasm32-unknown-unknown --toolchain "${RUST_TOOLCHAIN}"
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y             jq             pkg-config             libwayland-dev             wayland-protocols             libxkbcommon-dev             libx11-dev             libxi-dev             libxcursor-dev             libxrandr-dev             libxinerama-dev             libasound2-dev             libudev-dev
      - name: Normalize Rust cache toolchains
        if: hashFiles('scripts/ci-rust-cache-toolchains.py') != ''
        shell: bash
        run: python3 scripts/ci-rust-cache-toolchains.py "$RUST_TOOLCHAIN" "$OASIS7_WASM_TOOLCHAIN"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        if: hashFiles('scripts/ci-rust-cache-toolchains.py') != ''
        with:
          shared-key: ci-shared-native-trusted-v3
          save-if: false
          cache-on-failure: false
          add-rust-environment-hash-key: true
          env-vars: CARGO CC CFLAGS CXX CMAKE RUST OASIS7_WASM
      - name: Run runtime sync release gate
        shell: bash
        run: |
          mkdir -p .tmp/release_gate_runtime_sync
          {
            echo "+ ./scripts/sync-m1-builtin-wasm-artifacts.sh --check"
            ./scripts/sync-m1-builtin-wasm-artifacts.sh --check
            echo "+ ./scripts/sync-m4-builtin-wasm-artifacts.sh --check"
            ./scripts/sync-m4-builtin-wasm-artifacts.sh --check
            echo "+ ./scripts/sync-m5-builtin-wasm-artifacts.sh --check"
            ./scripts/sync-m5-builtin-wasm-artifacts.sh --check
          } | tee .tmp/release_gate_runtime_sync/runtime-sync-checks.log
      - name: Upload runtime sync gate summary
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-gate-runtime-sync-summary
          path: .tmp/release_gate_runtime_sync
          if-no-files-found: warn

  release_gate_web:
    cache-mode: read
    name: release-gate-web
    needs: plan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.checkoutSha }}
          persist-credentials: false
      - name: Verify planned source HEAD
        shell: bash
        env:
          EXPECTED_SHA: ${{ needs.plan.outputs.checkoutSha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Install viewer web dependencies
        run: npm ci --prefix crates/oasis7_viewer
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install "${RUST_TOOLCHAIN}" --profile default
          rustup target add wasm32-unknown-unknown --toolchain "${RUST_TOOLCHAIN}"
          rustup default "${RUST_TOOLCHAIN}"
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            netcat-openbsd \
            pkg-config \
            xvfb \
            xauth \
            libwayland-dev \
            wayland-protocols \
            libxkbcommon-dev \
            libx11-dev \
            libxi-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxinerama-dev \
            libasound2-dev \
            libudev-dev
      - name: Normalize Rust cache toolchains
        if: hashFiles('scripts/ci-rust-cache-toolchains.py') != ''
        shell: bash
        run: python3 scripts/ci-rust-cache-toolchains.py "$RUST_TOOLCHAIN"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        if: hashFiles('scripts/ci-rust-cache-toolchains.py') != ''
        with:
          shared-key: release-packages-web-wasm-trusted-v3
          save-if: false
          cache-on-failure: false
      - name: Run web strict release gate
        run: |
          xvfb-run -a ./scripts/release-gate.sh \
            --out-dir .tmp/release_gate_web \
            --skip-ci-full \
            --skip-ci-full-reason release-workflow-runtime-shard-runs-ci-full \
            --skip-sync \
            --skip-sync-reason release-workflow-sync-shards-run-wasm-sync \
            --skip-s9 \
            --skip-s9-reason release-workflow-soak-shard-runs-s9 \
            --skip-s10 \
            --skip-s10-reason release-workflow-soak-shard-runs-s10 \
            --web-headed
      - name: Upload web gate summary
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-gate-web-summary
          path: .tmp/release_gate_web
          if-no-files-found: warn

  release_gate_soak:
    cache-mode: read
    name: release-gate-soak
    needs: plan
    runs-on: ubuntu-24.04
    env:
      OASIS7_WASM_TOOLCHAIN: nightly-2025-12-11
      OASIS7_WASM_TARGET: wasm32-unknown-unknown
      OASIS7_WASM_BUILD_STD: "1"
      OASIS7_WASM_BUILD_STD_COMPONENTS: std,panic_abort
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.checkoutSha }}
          persist-credentials: false
      - name: Verify planned source HEAD
        shell: bash
        env:
          EXPECTED_SHA: ${{ needs.plan.outputs.checkoutSha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install "${RUST_TOOLCHAIN}" --profile default
          rustup default "${RUST_TOOLCHAIN}"
          rustup toolchain install "${OASIS7_WASM_TOOLCHAIN}" --profile minimal --component rust-src
          rustup target add "${OASIS7_WASM_TARGET}" --toolchain "${OASIS7_WASM_TOOLCHAIN}"
          rustup target add wasm32-unknown-unknown --toolchain "${RUST_TOOLCHAIN}"
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            jq \
            pkg-config \
            libwayland-dev \
            wayland-protocols \
            libxkbcommon-dev \
            libx11-dev \
            libxi-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxinerama-dev \
            libasound2-dev \
            libudev-dev
      - name: Normalize Rust cache toolchains
        if: hashFiles('scripts/ci-rust-cache-toolchains.py') != ''
        shell: bash
        run: python3 scripts/ci-rust-cache-toolchains.py "$RUST_TOOLCHAIN" "$OASIS7_WASM_TOOLCHAIN"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        if: hashFiles('scripts/ci-rust-cache-toolchains.py') != ''
        with:
          shared-key: ci-shared-native-trusted-v3
          save-if: false
          cache-on-failure: false
          add-rust-environment-hash-key: true
          env-vars: CARGO CC CFLAGS CXX CMAKE RUST OASIS7_WASM
      - name: Prewarm soak runtime binary
        run: env -u RUSTC_WRAPPER cargo build -p oasis7_chain_runtime --bin oasis7_chain_runtime
      - name: Run soak release gate
        run: |
          ./scripts/release-gate.sh \
            --out-dir .tmp/release_gate_soak \
            --skip-ci-full \
            --skip-ci-full-reason release-workflow-runtime-shard-runs-ci-full \
            --skip-sync \
            --skip-sync-reason release-workflow-sync-shards-run-wasm-sync \
            --skip-web-strict \
            --skip-web-strict-reason release-workflow-web-shard-runs-web-strict
      - name: Upload soak gate summary
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-gate-soak-summary
          path: |
            .tmp/release_gate_soak
            .tmp/release_gate_p2p
            .tmp/release_gate_s10
          if-no-files-found: warn

  release_gate:
    name: release-gate
    if: always()
    needs:
      - release_gate_runtime_core
      - release_gate_runtime_support
      - release_gate_runtime_sync
      - release_gate_web
      - release_gate_soak
    runs-on: ubuntu-24.04
    steps:
      - name: Assert all release gates passed
        env:
          RUNTIME_CORE_RESULT: ${{ needs.release_gate_runtime_core.result }}
          RUNTIME_SUPPORT_RESULT: ${{ needs.release_gate_runtime_support.result }}
          RUNTIME_SYNC_RESULT: ${{ needs.release_gate_runtime_sync.result }}
          WEB_RESULT: ${{ needs.release_gate_web.result }}
          SOAK_RESULT: ${{ needs.release_gate_soak.result }}
        run: |
          failed=0
          for gate in runtime_core runtime_support runtime_sync web soak; do
            upper_name=$(printf '%s' "$gate" | tr '[:lower:]' '[:upper:]')
            result_var="${upper_name}_RESULT"
            result=${!result_var}
            echo "${gate}: ${result}"
            if [[ "$result" != "success" ]]; then
              failed=1
            fi
          done
          if [[ "$failed" -ne 0 ]]; then
            echo "error: one or more release sub-gates failed" >&2
            exit 1
          fi

  build-web-dist:
    needs: [plan, release_gate]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.checkoutSha }}
          persist-credentials: false
      - name: Verify planned source HEAD
        shell: bash
        env:
          EXPECTED_SHA: ${{ needs.plan.outputs.checkoutSha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Verify release Trunk installer
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f scripts/install-ci-trunk.sh || ! -s scripts/install-ci-trunk.sh || -L scripts/install-ci-trunk.sh ]]; then
            echo "error: planned release source must include a nonempty regular scripts/install-ci-trunk.sh; select a source tag with verified Trunk installer support" >&2
            exit 1
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Install viewer web dependencies
        run: npm ci --prefix crates/oasis7_viewer
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install "${RUST_TOOLCHAIN}" --profile default
          rustup target add wasm32-unknown-unknown --toolchain "${RUST_TOOLCHAIN}"
          rustup default "${RUST_TOOLCHAIN}"
      - name: Normalize Rust cache toolchains
        if: hashFiles('scripts/ci-rust-cache-toolchains.py') != ''
        shell: bash
        run: python3 scripts/ci-rust-cache-toolchains.py "$RUST_TOOLCHAIN"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        if: hashFiles('scripts/ci-rust-cache-toolchains.py') != ''
        with:
          shared-key: release-packages-web-wasm-trusted-v3
          save-if: ${{ github.ref == 'refs/heads/main' && needs.plan.outputs.checkoutSha == github.sha && github.workflow_sha == github.sha }}
          cache-on-failure: false
      - name: Restore pinned Trunk release archive
        id: trunk-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ci-tools/trunk-x86_64-unknown-linux-gnu.tar.gz
          key: trunk-archive-${{ runner.os }}-${{ runner.arch }}-${{ env.TRUNK_VERSION }}-${{ hashFiles('scripts/install-ci-trunk.sh') }}
      - name: Install verified pinned Trunk
        shell: bash
        run: bash scripts/install-ci-trunk.sh "$RUNNER_TEMP/ci-tools/trunk-x86_64-unknown-linux-gnu.tar.gz" "$RUNNER_TEMP/ci-tools/bin"
      - name: Verify pinned trunk
        shell: bash
        run: |
          set -euo pipefail
          trunk --version | grep -Fqx "trunk ${TRUNK_VERSION}"
      - name: Build web dists
        run: |
          mkdir -p output/release/web-dist output/release/web-launcher-dist output/release/viewer-optional-payload
          (
            ./scripts/build-viewer-software-safe.sh --optional-payload-dir output/release/viewer-optional-payload
            ./scripts/copy-viewer-web-dist.sh \
              --dist-dir output/release/web-dist \
              --optional-payload-dir output/release/viewer-optional-payload
            ./scripts/package-viewer-web-delivery.sh \
              --web-dist output/release/web-dist \
              --optional-payload-dir output/release/viewer-optional-payload \
              --out-file output/release/oasis7-viewer-web-delivery.tar.gz
          )
          (
            cd crates/oasis7_client_launcher
            env -u NO_COLOR trunk build --release --dist ../../output/release/web-launcher-dist
          )
      - name: Upload web dist artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-web-dists
          path: |
            output/release/web-dist
            output/release/web-launcher-dist
          if-no-files-found: error
      - name: Upload viewer web delivery
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-viewer-web-delivery
          path: output/release/oasis7-viewer-web-delivery.tar.gz
          if-no-files-found: error

  package-native:
    needs: [plan, build-web-dist]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x64
            asset_name: oasis7-linux-x64.deb
            target_triple: native
          - os: macos-14
            platform: macos-x64
            asset_name: oasis7-macos-x64.dmg
            target_triple: x86_64-apple-darwin
          - os: windows-2022
            platform: windows-x64
            asset_name: oasis7-windows-x64.exe
            target_triple: native
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.checkoutSha }}
          persist-credentials: false
      - name: Verify planned source HEAD
        shell: bash
        env:
          EXPECTED_SHA: ${{ needs.plan.outputs.checkoutSha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Compute Linux package cache save eligibility
        id: linux-package-cache-write
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          cache_write=false
          live_head="$(git rev-parse HEAD)"
          if [[ "${GITHUB_REF}" == "refs/heads/main" && "${live_head}" == "${GITHUB_SHA}" ]]; then
            cache_write=true
          fi
          echo "save=${cache_write}" >> "${GITHUB_OUTPUT}"
      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          rustup toolchain install "${RUST_TOOLCHAIN}" --profile default
          rustup default "${RUST_TOOLCHAIN}"
          if [[ "${{ matrix.target_triple }}" != "native" ]]; then
            rustup target add "${{ matrix.target_triple }}" --toolchain "${RUST_TOOLCHAIN}"
          fi
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libwayland-dev \
            wayland-protocols \
            libxkbcommon-dev \
            libx11-dev \
            libxi-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxinerama-dev \
            libasound2-dev \
            libudev-dev
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        if: runner.os == 'Linux'
        with:
          shared-key: oasis7-package-native-${{ runner.os }}-${{ matrix.target_triple }}-packaging-trusted-v2
          cache-on-failure: false
          save-if: ${{ steps.linux-package-cache-write.outputs.save == 'true' }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        if: runner.os != 'Linux'
        with:
          shared-key: release-packages-package-native-${{ runner.os }}-${{ matrix.target_triple }}-trusted-v2
          cache-on-failure: true
      - name: Download web dist artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-web-dists
          path: output/release
      - name: Ensure Windows packaging dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $missing = @()
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            $missing += "nsis"
          }
          if ($missing.Count -eq 0) {
            exit 0
          }
          choco install $missing -y --no-progress
      - name: Resolve release version
        id: release_version
        shell: bash
        env:
          PACKAGE_VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          : "${PACKAGE_VERSION:?release package version is required}"
          printf 'value=%s\n' "$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"
      - name: Build launcher bundle
        shell: bash
        env:
          # Bound concurrent Thin LTO builds on hosted native runners.
          CARGO_BUILD_JOBS: "2"
        run: |
          if [[ "${RUNNER_OS}" == "Linux" ]]; then
            python3 -u - <<'PY' &
          import datetime
          import os
          from pathlib import Path
          import subprocess
          import time

          while True:
              print("native build resources", datetime.datetime.now(datetime.timezone.utc).isoformat())
              subprocess.run(["free", "-m"], check=False)
              subprocess.run(["df", "-h", os.environ["GITHUB_WORKSPACE"]], check=False)
              for metric in ("memory.current", "memory.max", "memory.events"):
                  path = Path("/sys/fs/cgroup") / metric
                  if path.is_file():
                      print(metric, path.read_text().strip())
              time.sleep(60)
          PY
            resource_monitor=$!
            trap 'kill "${resource_monitor}" 2>/dev/null || true; wait "${resource_monitor}" 2>/dev/null || true' EXIT
          fi
          ./scripts/release-prepare-bundle.sh \
            --platform "${{ matrix.platform }}" \
            --target-triple "${{ matrix.target_triple }}" \
            --web-dist output/release/web-dist \
            --web-launcher-dist output/release/web-launcher-dist \
            --out-dir output/release/assets \
            --profile packaging
      - name: Write BUILDINFO into Linux bundle
        shell: bash
        env:
          SOURCE_PLAN: ${{ needs.plan.outputs.sourcePlan }}
        run: |
          set -euo pipefail
          assets="output/release/assets"
          bundle="${assets}/oasis7-${{ matrix.platform }}"
          buildinfo="${assets}/${{ matrix.platform }}-BUILDINFO"
          printf '%s\n' "$SOURCE_PLAN" > "${assets}/${{ matrix.platform }}-SOURCEPLAN.json"
          {
            echo "workflow=Release Packages"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "repository=${GITHUB_REPOSITORY}"
            echo "release_tag=${{ needs.plan.outputs.resolvedRef }}"
            echo "commit=$(git rev-parse HEAD)"
            echo "build_profile=packaging"
            echo "platform=${{ matrix.platform }}"
            echo "target_triple=${{ matrix.target_triple }}"
            echo "runner_os=${RUNNER_OS}"
            echo "package_version=${{ steps.release_version.outputs.value }}"
            echo "published=false"
          } > "${buildinfo}"

          if [[ "${{ matrix.platform }}" == "linux-x64" ]]; then
            cp "${buildinfo}" "${bundle}/BUILDINFO"
            cd "${bundle}"
            mapfile -t files < <(find . -type f ! -name SHA256SUMS -print | sed 's#^./##' | sort)
            ((${#files[@]} > 0)) || { echo "error: Linux bundle has no files to checksum" >&2; exit 1; }
            sha256sum "${files[@]}" > SHA256SUMS
            sha256sum -c SHA256SUMS >/dev/null
          fi
      - name: Package native installer
        shell: bash
        run: |
          chmod +x ./scripts/package-native-installer.sh
          ./scripts/package-native-installer.sh \
            --platform "${{ matrix.platform }}" \
            --bundle-dir "output/release/assets/oasis7-${{ matrix.platform }}" \
            --out-dir output/release/assets \
            --asset-name "${{ matrix.asset_name }}" \
            --version "${{ steps.release_version.outputs.value }}"
      - name: Upload platform asset
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-asset-${{ matrix.platform }}
          path: |
            output/release/assets/${{ matrix.asset_name }}
            output/release/assets/${{ matrix.platform }}-BUILDINFO
            output/release/assets/${{ matrix.platform }}-SOURCEPLAN.json
          if-no-files-found: error
      - name: Upload ops-tools asset
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-asset-${{ matrix.platform }}-ops-tools
          path: output/release/assets/oasis7-${{ matrix.platform }}-ops-tools.tar.gz
          if-no-files-found: error

  publish-release:
    needs: [plan, package-native]
    cache-mode: none
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download packaged assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-asset-*
          path: output/release/assets
          merge-multiple: true
      - name: Download viewer web delivery
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-viewer-web-delivery
          path: output/release/assets
      - name: Generate checksums
        run: |
          cd output/release/assets
          ls -l
          for file in \
            oasis7-linux-x64.deb \
            oasis7-macos-x64.dmg \
            oasis7-windows-x64.exe \
            oasis7-viewer-web-delivery.tar.gz
          do
            [[ -f "${file}" ]] || { echo "error: missing release asset ${file}" >&2; exit 1; }
          done
          sha256sum \
            oasis7-linux-x64.deb \
            oasis7-macos-x64.dmg \
            oasis7-windows-x64.exe \
            oasis7-linux-x64-ops-tools.tar.gz \
            oasis7-macos-x64-ops-tools.tar.gz \
            oasis7-windows-x64-ops-tools.tar.gz \
            oasis7-viewer-web-delivery.tar.gz \
            > oasis7-checksums.txt
      - name: Verify release tag still matches plan
        id: tag
        env:
          PLANNED_REF: ${{ needs.plan.outputs.resolvedRef }}
          PLANNED_SHA: ${{ needs.plan.outputs.checkoutSha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${PLANNED_REF#refs/tags/}"
          record="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag")"
          object="$(jq -r '.object.sha' <<< "$record")"
          kind="$(jq -r '.object.type' <<< "$record")"
          while [[ "$kind" == tag ]]; do
            record="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$object")"
            object="$(jq -r '.object.sha' <<< "$record")"
            kind="$(jq -r '.object.type' <<< "$record")"
          done
          test "$kind" = commit
          test "$object" = "$PLANNED_SHA"
          for platform in linux-x64 macos-x64 windows-x64; do
            jq -e --arg sha "$PLANNED_SHA" '.checkoutSha == $sha' "output/release/assets/$platform-SOURCEPLAN.json" >/dev/null
            grep -Fqx "commit=$PLANNED_SHA" "output/release/assets/$platform-BUILDINFO"
          done
          printf 'value=%s\n' "$tag" >> "$GITHUB_OUTPUT"
      - name: Publish GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ steps.tag.outputs.value }}
          name: oasis7 ${{ steps.tag.outputs.value }}
          generate_release_notes: true
          files: |
            output/release/assets/*-SOURCEPLAN.json
            output/release/assets/*-BUILDINFO
            output/release/assets/oasis7-linux-x64.deb
            output/release/assets/oasis7-macos-x64.dmg
            output/release/assets/oasis7-windows-x64.exe
            output/release/assets/oasis7-linux-x64-ops-tools.tar.gz
            output/release/assets/oasis7-macos-x64-ops-tools.tar.gz
            output/release/assets/oasis7-windows-x64-ops-tools.tar.gz
            output/release/assets/oasis7-viewer-web-delivery.tar.gz
            output/release/assets/oasis7-checksums.txt
