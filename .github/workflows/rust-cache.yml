name: Rust dependency cache

on:
  schedule:
    - cron: "47 */4 * * *"
  workflow_dispatch:
    inputs:
      run_mode:
        description: "Populate complete native and Web dependency caches (no test validation)"
        required: true
        default: full
        type: choice
        options: [full, image-native, image-support]

concurrency:
  group: ci-shared-native-cache-main
  cancel-in-progress: false

permissions:
  contents: read

cache-mode: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  PYTHONDONTWRITEBYTECODE: "1"
  # Configured repository cache budget: 20 GB (decimal bytes).
  # GitHub cache limits and billing budgets must also allow this capacity.
  CI_CACHE_REPOSITORY_BUDGET_BYTES: "20000000000"
  CARGO_NET_RETRY: 10
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  RUST_TOOLCHAIN: 1.96.0
  TRUNK_VERSION: 0.21.14
  OASIS7_WASM_TOOLCHAIN: nightly-2025-12-11
  OASIS7_WASM_TARGET: wasm32-unknown-unknown
  OASIS7_WASM_BUILD_STD: "1"
  OASIS7_WASM_BUILD_STD_COMPONENTS: std,panic_abort

jobs:
  browser-archive-cache:
    cache-mode: write
    permissions:
      contents: read
      actions: read
    if: >-
      github.ref == 'refs/heads/main' && github.workflow_sha == github.sha &&
      (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.run_mode == 'full'))
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify current main cache source
        shell: bash
        run: |
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_WORKFLOW_SHA" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Identify exact browser archives
        id: browser-meta
        run: python3 scripts/ci-browser-deps.py metadata --browser agent --github-output "$GITHUB_OUTPUT"
      - name: Restore exact CJK font archive
        id: browser-archive-noto
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.browser-meta.outputs.fonts_noto_cjk_root }}
          key: ${{ steps.browser-meta.outputs.fonts_noto_cjk_key }}
      - name: Fetch or verify pinned CJK font archive
        id: prepare-browser-noto
        run: python3 scripts/ci-browser-deps.py fetch --component fonts-noto-cjk
      - name: Admit bounded CJK font archive cache
        id: browser-admission-noto
        if: steps.browser-archive-noto.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BROWSER_CACHE_KEY: ${{ steps.browser-meta.outputs.fonts_noto_cjk_key }}
        run: python3 scripts/ci-browser-deps.py admit-save --component fonts-noto-cjk --key "$BROWSER_CACHE_KEY" --github-output "$GITHUB_OUTPUT"
      - name: Save verified CJK font archive
        if: >-
          success() && steps.prepare-browser-noto.outcome == 'success' &&
          steps.browser-archive-noto.outputs.cache-hit != 'true' &&
          steps.browser-admission-noto.outcome == 'success' && steps.browser-admission-noto.outputs.save == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.browser-meta.outputs.fonts_noto_cjk_root }}
          key: ${{ steps.browser-meta.outputs.fonts_noto_cjk_key }}
      - name: Restore exact Freefont archive
        id: browser-archive-freefont
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.browser-meta.outputs.fonts_freefont_ttf_root }}
          key: ${{ steps.browser-meta.outputs.fonts_freefont_ttf_key }}
      - name: Fetch or verify pinned Freefont archive
        id: prepare-browser-freefont
        run: python3 scripts/ci-browser-deps.py fetch --component fonts-freefont-ttf
      - name: Admit bounded Freefont archive cache
        id: browser-admission-freefont
        if: steps.browser-archive-freefont.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BROWSER_CACHE_KEY: ${{ steps.browser-meta.outputs.fonts_freefont_ttf_key }}
        run: python3 scripts/ci-browser-deps.py admit-save --component fonts-freefont-ttf --key "$BROWSER_CACHE_KEY" --github-output "$GITHUB_OUTPUT"
      - name: Save verified Freefont archive
        if: >-
          success() && steps.prepare-browser-freefont.outcome == 'success' &&
          steps.browser-archive-freefont.outputs.cache-hit != 'true' &&
          steps.browser-admission-freefont.outcome == 'success' && steps.browser-admission-freefont.outputs.save == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.browser-meta.outputs.fonts_freefont_ttf_root }}
          key: ${{ steps.browser-meta.outputs.fonts_freefont_ttf_key }}
      - name: Restore exact Chrome archive
        id: browser-archive-chrome
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.browser-meta.outputs.chrome_root }}
          key: ${{ steps.browser-meta.outputs.chrome_key }}
      - name: Fetch or verify pinned Chrome archive
        id: prepare-browser-chrome
        run: python3 scripts/ci-browser-deps.py fetch --component chrome
      - name: Admit bounded Chrome archive cache
        id: browser-admission-chrome
        if: steps.browser-archive-chrome.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BROWSER_CACHE_KEY: ${{ steps.browser-meta.outputs.chrome_key }}
        run: python3 scripts/ci-browser-deps.py admit-save --component chrome --key "$BROWSER_CACHE_KEY" --github-output "$GITHUB_OUTPUT"
      - name: Save verified Chrome archive
        if: >-
          success() && steps.prepare-browser-chrome.outcome == 'success' &&
          steps.browser-archive-chrome.outputs.cache-hit != 'true' &&
          steps.browser-admission-chrome.outcome == 'success' && steps.browser-admission-chrome.outputs.save == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.browser-meta.outputs.chrome_root }}
          key: ${{ steps.browser-meta.outputs.chrome_key }}

  worker-build-cache:
    cache-mode: write
    permissions:
      contents: read
      actions: read
    if: >-
      github.ref == 'refs/heads/main' && github.workflow_sha == github.sha &&
      (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.run_mode == 'full'))
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Configure mold for Linux host linking
        uses: ./.github/actions/setup-linux-mold
      - name: Verify current main cache source
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_WORKFLOW_SHA" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      - name: Identify pinned Worker build tool
        id: worker-meta
        run: python3 scripts/ci-worker-build.py metadata --github-output "$GITHUB_OUTPUT"
      - name: Restore exact Worker build tool
        id: worker-tool-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.worker-meta.outputs.root }}
          key: worker-build-cli-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.RUST_TOOLCHAIN }}-0.7.5-${{ steps.worker-meta.outputs.definition_sha }}
      - name: Prepare verified Worker build tool
        id: prepare-worker
        shell: bash
        timeout-minutes: 11
        env:
          TOOL_CACHE_HIT: ${{ steps.worker-tool-cache.outputs.cache-hit }}
        run: |
          if [[ "$TOOL_CACHE_HIT" == true ]]; then
            python3 scripts/ci-worker-build.py check
          else
            python3 scripts/ci-worker-build.py ensure
          fi
      - name: Admit bounded Worker tool cache
        id: worker-tool-admission
        if: steps.worker-tool-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TOOL_CACHE_KEY: worker-build-cli-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.RUST_TOOLCHAIN }}-0.7.5-${{ steps.worker-meta.outputs.definition_sha }}
        run: python3 scripts/ci-worker-build.py admit-save --key "$TOOL_CACHE_KEY" --github-output "$GITHUB_OUTPUT"
      - name: Save verified Worker build tool
        if: >-
          success() && steps.prepare-worker.outcome == 'success' &&
          steps.worker-tool-cache.outputs.cache-hit != 'true' &&
          steps.worker-tool-admission.outcome == 'success' && steps.worker-tool-admission.outputs.save == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.worker-meta.outputs.root }}
          key: worker-build-cli-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.RUST_TOOLCHAIN }}-0.7.5-${{ steps.worker-meta.outputs.definition_sha }}

  shared-native-cache:
    cache-mode: write
    permissions:
      contents: read
      actions: read
    if: >-
      github.ref == 'refs/heads/main' && github.workflow_sha == github.sha &&
      (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.run_mode == 'full'))
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Configure mold for Linux host linking
        uses: ./.github/actions/setup-linux-mold
      - name: Verify current main cache source
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_WORKFLOW_SHA" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Install viewer web dependencies
        run: npm ci --prefix crates/oasis7_viewer
      - name: Install pinned Rust toolchains
        run: |
          rustup toolchain install "${RUST_TOOLCHAIN}" --profile minimal --component rustfmt --component clippy
          rustup default "${RUST_TOOLCHAIN}"
          rustup toolchain install "${OASIS7_WASM_TOOLCHAIN}" --profile minimal --component rust-src
          rustup target add "${OASIS7_WASM_TARGET}" --toolchain "${OASIS7_WASM_TOOLCHAIN}"
          rustup target add wasm32-unknown-unknown
      - name: Install system deps
        shell: bash
        timeout-minutes: 11
        run: |
          sudo -n /usr/bin/python3 scripts/ci-apt-install.py --budget-seconds 600 -- \
            clang \
            llvm \
            pkg-config \
            libwayland-dev \
            wayland-protocols \
            libxkbcommon-dev \
            libx11-dev \
            libxi-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxinerama-dev \
            libasound2-dev \
            libudev-dev
          clang --print-targets | grep -w wasm32
          llvm-ar --version
      - name: Stabilize Rust cache toolchains
        shell: bash
        run: python3 scripts/ci-rust-cache-toolchains.py "$RUST_TOOLCHAIN" "$OASIS7_WASM_TOOLCHAIN"
      - name: Install dependency cache admission
        id: dependency-cache-tools
        continue-on-error: true
        run: python3 scripts/ci-rust-cache-admission.py install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        id: native-cache
        if: steps.dependency-cache-tools.outcome == 'success'
        env:
          PATH: ${{ steps.dependency-cache-tools.outputs.path }}
          OASIS7_DEPENDENCY_CACHE_FAMILY: shared-native
          OASIS7_DEPENDENCY_CACHE_BUDGET_BYTES: ${{ env.CI_CACHE_REPOSITORY_BUDGET_BYTES }}
          GH_TOKEN: ${{ github.token }}
        with:
          shared-key: ci-shared-native-trusted-v4
          add-rust-environment-hash-key: true
          env-vars: CARGO CC CFLAGS CXX CMAKE RUST OASIS7_WASM
          save-if: ${{ job.status == 'success' && github.ref == 'refs/heads/main' && github.workflow_sha == github.sha }}
          cache-on-failure: false
      - name: Complete shared native cache
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: CI_VERBOSE=1 ./scripts/ci-tests.sh cache-native

  rust-image-native-cache:
    cache-mode: write
    permissions:
      contents: read
      actions: read
      packages: read
    if: >-
      github.ref == 'refs/heads/main' && github.workflow_sha == github.sha &&
      github.event_name == 'workflow_dispatch' && inputs.run_mode == 'image-native'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: ghcr.io/nil-studio/oasis7/ci-rust-build@sha256:0b13d0b5ba9051617eb6ab77a5af324f066af79bb2753d664b780535c2fe13a3
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Trust the checked-out workspace path in the job container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Verify current main cache source
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_WORKFLOW_SHA" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Configure mold for Linux host linking
        uses: ./.github/actions/setup-linux-mold
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Stabilize Rust cache toolchains
        run: python3 scripts/ci-rust-cache-toolchains.py "$RUST_TOOLCHAIN" "$OASIS7_WASM_TOOLCHAIN"
      - name: Install dependency cache admission
        id: dependency-cache-tools
        run: python3 scripts/ci-rust-cache-admission.py install-release
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        id: native-cache
        env:
          NODE_OPTIONS: ${{ steps.dependency-cache-tools.outputs.node_options }}
          OASIS7_DEPENDENCY_CACHE_PYTHON: ${{ steps.dependency-cache-tools.outputs.python }}
          OASIS7_DEPENDENCY_CACHE_FAMILY: rust-image-native
          OASIS7_DEPENDENCY_CACHE_BUDGET_BYTES: ${{ env.CI_CACHE_REPOSITORY_BUDGET_BYTES }}
          GH_TOKEN: ${{ github.token }}
        with:
          shared-key: ci-rust-build-0b13d0b5ba9051617eb6ab77a5af324f066af79bb2753d664b780535c2fe13a3
          add-rust-environment-hash-key: true
          env-vars: CARGO CC CFLAGS CXX CMAKE RUST OASIS7_WASM
          cache-provider: github
          save-if: ${{ job.status == 'success' && steps.dependency-cache-tools.outputs.guard_ready == 'true' && github.ref == 'refs/heads/main' && github.workflow_sha == github.sha && inputs.run_mode == 'image-native' }}
          cache-on-failure: false
      - name: Warm the exact pixel-world bridge and rust-baseline dependency contexts
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: |
          env -u RUSTC_WRAPPER cargo test --locked -p pixel_world_bridge --lib --no-run
          env -u RUSTC_WRAPPER cargo check --locked -p pixel_world_bridge --target wasm32-unknown-unknown
          env -u RUSTC_WRAPPER cargo check --locked -p oasis7_game_client --lib
          env -u RUSTC_WRAPPER cargo check --locked -p oasis7_world_state --lib
          env -u RUSTC_WRAPPER cargo check --locked -p oasis7_world_state --features test_tier_required --tests
          env -u RUSTC_WRAPPER cargo check --locked -p oasis7_world_state --features test_tier_full --tests
          env -u RUSTC_WRAPPER cargo check --locked -p oasis7_world_state --features test-support --tests
          env -u RUSTC_WRAPPER cargo check --locked -p oasis7_world_projection --lib
          env -u RUSTC_WRAPPER cargo check --locked -p oasis7_runtime --lib
          env -u RUSTC_WRAPPER cargo check --locked -p oasis7_runtime --features test_tier_required --tests
          env -u RUSTC_WRAPPER cargo check --locked -p oasis7_runtime --features wasmtime --lib
          env -u RUSTC_WRAPPER cargo check --locked -p oasis7_launcher_backend --bins
          env -u RUSTC_WRAPPER cargo check --locked -p oasis7_client_launcher --tests
          env -u RUSTC_WRAPPER cargo check --locked -p oasis7_protocol_tools --bins
          env -u RUSTC_WRAPPER cargo check --locked -p oasis7_protocol_tools --features test_tier_required --tests
          env -u RUSTC_WRAPPER cargo check --locked -p oasis7_custody_core --lib
          env -u RUSTC_WRAPPER cargo check --locked -p oasis7_custody_core --tests
          env -u RUSTC_WRAPPER cargo check --locked -p oasis7_custody_core --target wasm32-unknown-unknown --lib
          env -u RUSTC_WRAPPER cargo test --locked -p oasis7_newapi_bridge_service --bin oasis7_newapi_bridge_service --no-run

  rust-image-component-cache:
    cache-mode: write
    permissions:
      contents: read
      actions: read
      packages: read
    if: >-
      github.ref == 'refs/heads/main' && github.workflow_sha == github.sha &&
      (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' &&
       (inputs.run_mode == 'full' || inputs.run_mode == 'image-native' ||
        (inputs.run_mode == 'image-support' && github.repository == 'nil-studio/oasis7'))))
    strategy:
      fail-fast: false
      # Observe the repository budget after each image archive, without adding
      # simultaneous matrix uploads. Other writers retain their own admission.
      max-parallel: 1
      matrix:
        include: >-
          ${{
            inputs.run_mode == 'image-support' &&
            fromJSON('[
              {"profile":"support","family":"rust-image-support","image":"ghcr.io/nil-studio/oasis7/ci-rust-build@sha256:822b05e151a77828e600b742ac3ec80449fbc41be107fcd724b20ce01a5afbf2","namespace":"ci-rust-build-822b05e151a77828e600b742ac3ec80449fbc41be107fcd724b20ce01a5afbf2","options":"","mold-dir":""}
            ]') ||
            fromJSON('[
              {"profile":"native","family":"rust-image-components","image":"ghcr.io/nil-studio/oasis7/ci-rust-build@sha256:bc886637f7bf153dfb60df5c8f56e82949a8f4d9ec2ffd571750eae2fe1a795f","namespace":"ci-rust-build-bc886637f7bf153dfb60df5c8f56e82949a8f4d9ec2ffd571750eae2fe1a795f","options":"","mold-dir":""},
              {"profile":"node","family":"rust-image-components","image":"ghcr.io/nil-studio/oasis7/ci-rust-build@sha256:bc886637f7bf153dfb60df5c8f56e82949a8f4d9ec2ffd571750eae2fe1a795f","namespace":"ci-rust-build-bc886637f7bf153dfb60df5c8f56e82949a8f4d9ec2ffd571750eae2fe1a795f","options":"--user 1001:1001","mold-dir":"oasis7-node-mold"},
              {"profile":"net","family":"rust-image-net","image":"ghcr.io/nil-studio/oasis7/ci-rust-wasm-build@sha256:57c5784d5c038fbd43037bdf2b6c1bdaed3a5e4433354b21a5eee39797da3aa6","namespace":"ci-rust-wasm-build-57c5784d5c038fbd43037bdf2b6c1bdaed3a5e4433354b21a5eee39797da3aa6","options":"--user 1001:1001","mold-dir":"oasis7-net-mold"},
              {"profile":"launcher","family":"rust-image-launcher","image":"ghcr.io/nil-studio/oasis7/ci-rust-build@sha256:cdc889675ddb97eb24bb13bf1f49722efb4750d2a01094b8676996c4f95f46c6","namespace":"ci-rust-build-cdc889675ddb97eb24bb13bf1f49722efb4750d2a01094b8676996c4f95f46c6","options":"","mold-dir":""},
              {"profile":"tooling","family":"rust-image-tooling","image":"ghcr.io/nil-studio/oasis7/ci-rust-build@sha256:d35b866df7219a041165b3da463865465f8c3ab481a315c2b9a5afe23c92cecc","namespace":"ci-rust-build-d35b866df7219a041165b3da463865465f8c3ab481a315c2b9a5afe23c92cecc","options":"","mold-dir":""},
              {"profile":"support","family":"rust-image-support","image":"ghcr.io/nil-studio/oasis7/ci-rust-build@sha256:822b05e151a77828e600b742ac3ec80449fbc41be107fcd724b20ce01a5afbf2","namespace":"ci-rust-build-822b05e151a77828e600b742ac3ec80449fbc41be107fcd724b20ce01a5afbf2","options":"","mold-dir":""}
            ]')
          }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    container:
      image: ${{ matrix.image }}
      options: ${{ matrix.options }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Trust the checked-out workspace path in the job container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Verify current main cache source
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_WORKFLOW_SHA" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Configure mold for Linux host linking
        uses: ./.github/actions/setup-linux-mold
        with:
          install-dir: ${{ matrix.mold-dir != '' && format('{0}/{1}', runner.temp, matrix.mold-dir) || '' }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Verify the preinstalled Rust toolchains
        run: |
          set -euo pipefail
          rustc +"$RUST_TOOLCHAIN" -vV
          rustc +"$OASIS7_WASM_TOOLCHAIN" -vV
          cargo +"$RUST_TOOLCHAIN" clippy --version
          rustup target list --installed --toolchain "$OASIS7_WASM_TOOLCHAIN" | grep -Fx "$OASIS7_WASM_TARGET"
      - name: Stabilize Rust cache toolchains
        run: python3 scripts/ci-rust-cache-toolchains.py "$RUST_TOOLCHAIN" "$OASIS7_WASM_TOOLCHAIN"
      - name: Install dependency cache admission
        id: dependency-cache-tools
        run: python3 scripts/ci-rust-cache-admission.py install-release
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        id: image-cache
        env:
          NODE_OPTIONS: ${{ steps.dependency-cache-tools.outputs.node_options }}
          OASIS7_DEPENDENCY_CACHE_PYTHON: ${{ steps.dependency-cache-tools.outputs.python }}
          OASIS7_DEPENDENCY_CACHE_FAMILY: ${{ matrix.family }}
          OASIS7_DEPENDENCY_CACHE_PROFILE: ${{ matrix.profile }}
          OASIS7_DEPENDENCY_CACHE_BUDGET_BYTES: ${{ env.CI_CACHE_REPOSITORY_BUDGET_BYTES }}
          GH_TOKEN: ${{ github.token }}
        with:
          shared-key: ${{ matrix.namespace }}
          add-rust-environment-hash-key: true
          env-vars: CARGO CC CFLAGS CXX CMAKE RUST OASIS7_WASM
          cache-provider: github
          save-if: ${{ job.status == 'success' && steps.dependency-cache-tools.outputs.guard_ready == 'true' && github.ref == 'refs/heads/main' && github.workflow_sha == github.sha }}
          cache-on-failure: false
      - name: Warm the exact component dependency contexts
        if: steps.image-cache.outputs.cache-hit != 'true'
        env:
          IMAGE_CACHE_PROFILE: ${{ matrix.profile }}
        run: python3 scripts/ci-image-cache.py --profile "$IMAGE_CACHE_PROFILE"

  web-wasm-cache:
    cache-mode: write
    permissions:
      contents: read
      actions: read
    if: >-
      github.ref == 'refs/heads/main' && github.workflow_sha == github.sha &&
      (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.run_mode == 'full'))
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Configure mold for Linux host linking
        uses: ./.github/actions/setup-linux-mold
      - name: Verify current main cache source
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_WORKFLOW_SHA" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Install viewer web dependencies
        run: npm ci --prefix crates/oasis7_viewer
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install "${RUST_TOOLCHAIN}" --profile default
          rustup target add wasm32-unknown-unknown --toolchain "${RUST_TOOLCHAIN}"
          rustup default "${RUST_TOOLCHAIN}"
      - name: Normalize Rust cache toolchains
        shell: bash
        run: python3 scripts/ci-rust-cache-toolchains.py "$RUST_TOOLCHAIN"
      - name: Install Web cache admission
        id: dependency-cache-tools
        continue-on-error: true
        run: python3 scripts/ci-rust-cache-admission.py install-release
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        id: web-cache
        continue-on-error: true
        env:
          NODE_OPTIONS: ${{ steps.dependency-cache-tools.outputs.node_options }}
          OASIS7_DEPENDENCY_CACHE_PYTHON: ${{ steps.dependency-cache-tools.outputs.python }}
          OASIS7_DEPENDENCY_CACHE_FAMILY: release-web
          OASIS7_DEPENDENCY_CACHE_SOURCE_SHA: ${{ github.sha }}
          OASIS7_DEPENDENCY_CACHE_BUDGET_BYTES: ${{ env.CI_CACHE_REPOSITORY_BUDGET_BYTES }}
          GH_TOKEN: ${{ github.token }}
        with:
          shared-key: release-packages-web-wasm-trusted-v3
          save-if: ${{ job.status == 'success' && steps.dependency-cache-tools.outputs.guard_ready == 'true' && github.ref == 'refs/heads/main' && github.workflow_sha == github.sha && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.run_mode == 'full')) }}
          cache-provider: github
          cache-on-failure: false
      - name: Restore pinned Trunk release archive
        id: trunk-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ci-tools/trunk-x86_64-unknown-linux-gnu.tar.gz
          key: trunk-archive-${{ runner.os }}-${{ runner.arch }}-${{ env.TRUNK_VERSION }}-${{ hashFiles('scripts/install-ci-trunk.sh') }}
      - name: Install verified pinned Trunk
        shell: bash
        run: bash scripts/install-ci-trunk.sh "$RUNNER_TEMP/ci-tools/trunk-x86_64-unknown-linux-gnu.tar.gz" "$RUNNER_TEMP/ci-tools/bin"
      - name: Verify pinned trunk
        shell: bash
        run: |
          set -euo pipefail
          trunk --version | grep -Fqx "trunk ${TRUNK_VERSION}"
      - name: Complete Web WASM cache
        if: steps.web-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output/release/viewer-optional-payload output/release/web-launcher-dist
          OASIS7_FORCE_VIEWER_SOFTWARE_SAFE_BUILD=1 ./scripts/build-viewer-software-safe.sh --optional-payload-dir output/release/viewer-optional-payload
          (
            cd crates/oasis7_client_launcher
            env -u NO_COLOR trunk build --release --dist ../../output/release/web-launcher-dist
          )
