name: Workspace support aggregate runtime replay

on:
  pull_request:
    branches: [codex/engineering-workspace-support-summary-replay-base]
    paths: [.github/workflows/workspace-support-summary-replay.yml]
    types: [opened]

permissions:
  contents: read
  actions: read
cache-mode: none

defaults:
  run:
    shell: bash

env:
  HISTORICAL_RUN_ID: "45034140660"
  HISTORICAL_RUN_ATTEMPT: "1"
  HISTORICAL_TESTED: 289019bd56315e37fef716482b97d86dae55ffa7
  HISTORICAL_SOURCE: 30fd978b2a887f154386d261124636572d958125
  HISTORICAL_POLICY: f97cd7e72f7add76095538f9ab55be97dcdfb35e
  HISTORICAL_CONTENT_SHA: a5f238a4333e42d5f373112489e106f631370e4b77d58b99befa4822ab39558b
  SUPPORT_NEEDS: '{"custody-native":{"result":"success"},"custody-native-contracts":{"result":"success"},"custody-node":{"result":"success"},"custody-wasm-production":{"result":"success"},"select":{"result":"success"},"workspace-support-legacy":{"result":"skipped"},"workspace-support-other":{"result":"success"}}'

jobs:
  host:
    if: &eligible >-
      github.repository == 'nil-studio/oasis7' &&
      github.head_ref == 'codex/engineering-workspace-support-summary-replay' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs: &outputs
      receipt: ${{ steps.proof.outputs.receipt }}
    steps:
      - &source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.HISTORICAL_TESTED }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - &preflight
        name: Verify runtime Python and trust the checked-out path
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python3 -I -c 'import sys; assert sys.version_info[:2] == (3, 12)'
          test "$(git rev-parse HEAD)" = "$HISTORICAL_TESTED"
          parents="$(git cat-file -p HEAD | sed -n 's/^parent //p')"
          test "$parents" = "$(printf '%s\n%s' "$HISTORICAL_POLICY" "$HISTORICAL_SOURCE")"
          git diff --exit-code HEAD --
      - &selection
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.HISTORICAL_RUN_ID }}
          artifact-ids: '14759345289'
          path: ${{ runner.temp }}
      - &results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.HISTORICAL_RUN_ID }}
          artifact-ids: '14759481592,14759951663,14759253310,14759413011'
          path: ${{ runner.temp }}/custody-results
          merge-multiple: false
      - &proof
        name: Verify historical evidence and replay the original aggregate
        id: proof
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path(os.environ['RUNNER_TEMP'])
          plan = root / 'selection.json'
          paths = [plan, *(root / 'custody-results').rglob('*')]
          content = {
              path.relative_to(root).as_posix(): hashlib.sha256(path.read_bytes()).hexdigest()
              for path in paths if path.is_file()
          }
          assert len(content) == 47
          digest = hashlib.sha256(json.dumps(content, sort_keys=True, separators=(',', ':')).encode()).hexdigest()
          assert digest == os.environ['HISTORICAL_CONTENT_SHA']
          selection = json.loads(plan.read_bytes())
          for field in ('source', 'tested', 'policy'):
              assert selection[field + '_sha'] == os.environ['HISTORICAL_' + field.upper()]
          assert selection['scope'] == 'full'
          assert selection['custody_execution_version'] == selection['custody_compile_proof_version'] == 1
          assert selection.get('workspace_support_direct_gate_version', 0) != 1
          assert sorted((root / 'custody-results').glob('*/result.json')) == [
              root / 'custody-results' / f"custody-node-{os.environ['HISTORICAL_RUN_ID']}-{index}" / 'result.json'
              for index in range(4)
          ]
          PYTHON
          replay="$(mktemp "$RUNNER_TEMP/support-aggregate-replay.XXXXXX")"
          cat > "$replay" <<'ORIGINAL_SUMMARY'
          support_needs="$(python3 - <<'PY'
          import json, os
          from pathlib import Path
          plan = json.loads((Path(os.environ['RUNNER_TEMP']) / 'selection.json').read_bytes())
          needs = json.loads(os.environ['SUPPORT_NEEDS'])
          if (isinstance(plan, dict) and plan.get('custody_compile_proof_version') == 1
                  and 'custody-wasm-contracts' not in needs and 'custody-native-contracts' in needs):
              needs['custody-wasm-contracts'] = needs['custody-native-contracts']
          if 'custody-wasm-approval' not in needs and 'custody-wasm-production' in needs:
              needs['custody-wasm-approval'] = needs['custody-wasm-production']
          print(json.dumps(needs, separators=(',', ':')))
          PY
          )"
          python3 scripts/ci-custody-platform.py validate --plan "$RUNNER_TEMP/selection.json" --needs "$support_needs" --results "$RUNNER_TEMP/custody-results" --capture-workerd-faults
          ORIGINAL_SUMMARY
          run_original() {
            GITHUB_RUN_ID="$HISTORICAL_RUN_ID" GITHUB_RUN_ATTEMPT="$HISTORICAL_RUN_ATTEMPT" \
              SUPPORT_NEEDS="$1" bash --noprofile --norc -e -o pipefail "$replay"
          }
          run_original "$SUPPORT_NEEDS"
          for stage in select custody-node custody-native-contracts; do
            rejected="$(python3 -c 'import json, os, sys; needs=json.loads(os.environ["SUPPORT_NEEDS"]); needs[sys.argv[1]]["result"]="failure"; print(json.dumps(needs))' "$stage")"
            if run_original "$rejected" > "$RUNNER_TEMP/rejected.log" 2>&1; then
              echo "error: failed historical stage was accepted ($stage)" >&2
              exit 1
            fi
            grep -E 'support selection failed|missing, failed or unexpected support result' "$RUNNER_TEMP/rejected.log"
          done
          result="$RUNNER_TEMP/custody-results/custody-node-$HISTORICAL_RUN_ID-3/result.json"
          mv "$result" "$result.omitted"
          if run_original "$SUPPORT_NEEDS" > "$RUNNER_TEMP/rejected.log" 2>&1; then
            echo 'error: missing historical shard was accepted' >&2
            exit 1
          fi
          grep -F 'missing custody shard results' "$RUNNER_TEMP/rejected.log"
          mv "$result.omitted" "$result"
          printf '%s\n' "$HISTORICAL_CONTENT_SHA" "$HISTORICAL_TESTED" 'original-success;three-stage-failures;missing-shard' | sha256sum | {
            read -r digest _
            printf 'receipt=%s\n' "$digest" >> "$GITHUB_OUTPUT"
          }

  image:
    if: *eligible
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      packages: read
    outputs: *outputs
    container:
      image: ghcr.io/nil-studio/oasis7/ci-runtime@sha256:3984caa42d82963f93af752bf79e3a07838f2c94279cfbb2deeb08f715cd62c9
      options: --user 1001:1001
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    steps: [*source, *preflight, *selection, *results, *proof]

  compare:
    needs: [host, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Require both executions to accept and reject the original inputs identically
        env:
          HOST: ${{ needs.host.outputs.receipt }}
          IMAGE: ${{ needs.image.outputs.receipt }}
        run: |
          [[ "$HOST" =~ ^[0-9a-f]{64}$ ]]
          test "$HOST" = "$IMAGE"
          printf 'Equivalent aggregate receipt %s\n' "$IMAGE"
