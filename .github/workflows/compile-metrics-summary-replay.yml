name: Compile metrics summary replay

on:
  pull_request:
    types: [opened]
    branches: [codex/engineering-compile-metrics-summary-replay-base]
    paths: [.github/workflows/compile-metrics-summary-replay.yml]

permissions:
  contents: read
  actions: read
  packages: read

jobs:
  host:
    if: &isolated github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'codex/engineering-compile-metrics-summary-replay'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fb21a358e15d1db97abe939e9afe897be63920d2
          persist-credentials: false
      - &download
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: 14585768682,14584517275,14584064614,14583999757
          run-id: 44634499219
          github-token: ${{ github.token }}
          path: output/compile-metrics
      - &expected
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: 14584479744
          run-id: 44634499219
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/historical-summary
      - &replay
        name: Run exact summary using the original downloaded artifacts
        shell: bash
        run: |
          test "$(id -u)" -ne 0
          test "$(git rev-parse HEAD)" = fb21a358e15d1db97abe939e9afe897be63920d2
          sha256sum -c - <<'SHA'
          8f3155d96e4c65b0b4d3bbf04b0ede1114ef26b239a0585e7c2e5d825f69996e  output/compile-metrics/compile-metrics-macos-arm64/summary.md
          565d349b4042adb360d13a61cb32370883cd1ba1410434567870b8fcd954ce5c  output/compile-metrics/compile-metrics-linux-x64/summary.md
          d18eb3fed5631261fcc85fdff749945e7ce9c32d112e0dd07d2a8f85b7dc769d  output/compile-metrics/compile-metrics-windows-x64/summary.md
          7581f887b435331fd8e53e5a8aabd1b4a0d103b5df4beb6f04dd70f2e1125806  output/compile-metrics/compile-metrics-summary/combined-summary.md
          SHA
          expected="$RUNNER_TEMP/historical-summary/combined-summary.md"
          printf '%s  %s\n' 09efe44fe2a3c58215b23dc2e75c4e4af876b67adc0d0fe5e3529c7403f9e89b "$expected" | sha256sum -c -
          workflow=.github/workflows/compile-metrics.yml
          awk '/name: Verify preinstalled summary tools/{getline;getline;sub(/^        run: /,"");print;exit}' "$workflow" > "$RUNNER_TEMP/preflight.sh"
          awk '/name: Write combined summary/{capture=1;next}
               capture && /^      - /{exit}
               capture && /^          /{print substr($0,11)}' "$workflow" > "$RUNNER_TEMP/summarize.sh"
          test -s "$RUNNER_TEMP/preflight.sh"
          test -s "$RUNNER_TEMP/summarize.sh"
          bash --noprofile --norc -euo pipefail "$RUNNER_TEMP/preflight.sh"
          bash --noprofile --norc -euo pipefail "$RUNNER_TEMP/summarize.sh"
          cmp "$expected" output/compile-metrics/combined-summary.md
          cmp "$expected" "$GITHUB_STEP_SUMMARY"
          printf 'Three historical platform summaries combined byte-for-byte, %s bytes.\n' "$(wc -c < "$expected")"

  image:
    if: *isolated
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    container:
      image: ghcr.io/nil-studio/oasis7/ci-runtime@sha256:3984caa42d82963f93af752bf79e3a07838f2c94279cfbb2deeb08f715cd62c9
      options: --user 1001:1001
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    steps:
      - *checkout
      - name: Trust checkout for replay identity
        shell: bash
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - *download
      - *expected
      - *replay
