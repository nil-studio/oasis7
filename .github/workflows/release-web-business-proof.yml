name: Release Web image bounded business proof
on:
  pull_request:
    types: [opened]
permissions:
  contents: read
  packages: read
cache-mode: none
jobs:
  web-business:
    if: >-
      github.repository == 'nil-studio/oasis7' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'task/engineering-release-web-business-probe' &&
      github.base_ref == 'codex/engineering-web-cache-image-batch' &&
      github.event.pull_request.draft == true &&
      github.event.pull_request.title == 'Release Web image business proof 0875-once'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    cache-mode: read
    container:
      image: ghcr.io/nil-studio/oasis7/ci-rust-release-web@sha256:f47cf4a0ce572de9b871475aed4e38c35fc7e6e128dda93a7d96e50480e03c59
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
      options: --user 1001:1001 --init
    defaults:
      run:
        shell: bash
    env:
      CODE_SHA: 0875de136f811c79cd4c82d7f72caf3b037cc1c9
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: '0'
      CARGO_NET_RETRY: '10'
      CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      PYTHONDONTWRITEBYTECODE: '1'
      RUST_TOOLCHAIN: 1.96.0
      TRUNK_VERSION: 0.21.14
      OASIS7_WASM_TOOLCHAIN: nightly-2025-12-11
      OASIS7_WASM_TARGET: wasm32-unknown-unknown
      OASIS7_WASM_BUILD_STD: '1'
      OASIS7_WASM_BUILD_STD_COMPONENTS: std,panic_abort
      RUST_RELEASE_WEB_IMAGE: ghcr.io/nil-studio/oasis7/ci-rust-release-web@sha256:f47cf4a0ce572de9b871475aed4e38c35fc7e6e128dda93a7d96e50480e03c59
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.CODE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify immutable source and controller-only delta
        env:
          CONTROLLER_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git -c safe.directory="$PWD" rev-parse HEAD)" = "$CODE_SHA"
          git -c safe.directory="$PWD" fetch origin "$CONTROLLER_SHA" --depth=1
          test "$(git -c safe.directory="$PWD" diff --name-only "$CODE_SHA" "$CONTROLLER_SHA")" = .github/workflows/release-web-business-proof.yml
      - name: Run actual production image preflight
        run: python3 scripts/ci-release-web-image.py --preflight --image-source d5319297d754a9c7d4de347a2ce8e1a20ba43591 --source "$CODE_SHA"
      - name: Configure original fixed mold without auxiliary cache write
        run: python3 .github/actions/setup-linux-mold/setup.py --install-dir "$RUNNER_TEMP/release-web-mold"
      - name: Verify business runtime and source compatibility
        run: |
          set -euo pipefail
          node --version | grep -E '^v22[.]'
          /usr/local/bin/node --version
          agent-browser --version
          python3 scripts/ci-release-web-image.py --image-source d5319297d754a9c7d4de347a2ce8e1a20ba43591 --source "$CODE_SHA" | grep -Fx release_web_image_compatible=true
      - name: Restore only the new image family without save
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          shared-key: ci-rust-release-web-f47cf4a0ce572de9b871475aed4e38c35fc7e6e128dda93a7d96e50480e03c59
          add-rust-environment-hash-key: true
          env-vars: CARGO CC CFLAGS CXX CMAKE RUST
          save-if: false
          cache-on-failure: false
      - name: Prepare original npm and verified Trunk
        run: |
          set -euo pipefail
          npm ci --prefix crates/oasis7_viewer
          bash scripts/install-ci-trunk.sh "$RUNNER_TEMP/ci-tools/trunk-x86_64-unknown-linux-gnu.tar.gz" "$RUNNER_TEMP/ci-tools/bin"
          trunk --version | grep -Fqx "trunk ${TRUNK_VERSION}"
      - name: Compile original signed fixture once and verify exact inventory
        run: |
          set -euo pipefail
          mkdir -p web-image-proof
          repo_root="$PWD"
          source scripts/cargo-dev-lib.sh
          source scripts/release-web-fixture-lib.sh
          release_web_fixture_build web-image-proof/fixture-build.json
          "$release_web_fixture_bin" --list > web-image-proof/fixture-inventory.txt
          test "$(grep -c 'qa_conformance::release_web_fixture::serve_release_web_fixture: test$' web-image-proof/fixture-inventory.txt)" = 1
          sha256sum "$release_web_fixture_bin" > web-image-proof/fixture-elf.sha256
      - name: Run original Web writer build recipe
        run: |
          set -euo pipefail
          set -euo pipefail
          mkdir -p output/release/viewer-optional-payload output/release/web-launcher-dist
          OASIS7_FORCE_VIEWER_SOFTWARE_SAFE_BUILD=1 ./scripts/build-viewer-software-safe.sh --optional-payload-dir output/release/viewer-optional-payload
          (
            cd crates/oasis7_client_launcher
            env -u NO_COLOR trunk build --release --dist ../../output/release/web-launcher-dist
          )
      - name: Run original Release headed business gate
        run: |
          set -euo pipefail
          xvfb-run -a ./scripts/release-gate.sh \
            --out-dir .tmp/release_gate_web \
            --skip-ci-full \
            --skip-ci-full-reason release-workflow-runtime-shard-runs-ci-full \
            --skip-sync \
            --skip-sync-reason release-workflow-sync-shards-run-wasm-sync \
            --skip-s9 \
            --skip-s9-reason release-workflow-soak-shard-runs-s9 \
            --skip-s10 \
            --skip-s10-reason release-workflow-soak-shard-runs-s10 \
            --web-headed
          mv .tmp/release_gate_web web-image-proof/release
      - name: Run original Mainnet headed business gate
        run: |
          set -euo pipefail
          xvfb-run -a ./scripts/release-gate.sh \
            --out-dir .tmp/release_gate_web \
            --skip-ci-full \
            --skip-ci-full-reason mainnet-workflow-runtime-shard-runs-ci-full \
            --skip-sync \
            --skip-sync-reason mainnet-workflow-sync-shards-run-wasm-sync \
            --skip-s9 \
            --skip-s9-reason mainnet-workflow-soak-shard-runs-s9 \
            --skip-s10 \
            --skip-s10-reason mainnet-workflow-soak-shard-runs-s10 \
            --web-headed
          mv .tmp/release_gate_web web-image-proof/mainnet
      - name: Record exact proof scope and output hashes
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          mkdir -p web-image-proof
          python3 - <<'PYPROOF'
          import hashlib,json,os,pathlib
          root=pathlib.Path('web-image-proof')
          files={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*') if p.is_file() and not p.is_symlink()}
          receipt={'source':os.environ['CODE_SHA'],'image':os.environ['RUST_RELEASE_WEB_IMAGE'],'uid':os.getuid(),'gid':os.getgid(),'probe_only':True,'main_write_authorized':False,'release_qualified':False,'job_status_before_receipt':os.environ['JOB_STATUS'],'files':files}
          (root/'receipt.json').write_text(json.dumps(receipt,indent=2)+'\n')
          PYPROOF
      - name: Upload bounded original reports and source receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-web-image-business-0875
          path: web-image-proof
          retention-days: 2
          if-no-files-found: error
