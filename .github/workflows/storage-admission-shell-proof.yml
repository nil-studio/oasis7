name: Storage admission shell environment proof
on:
  pull_request:
    types: [opened]
permissions:
  contents: read
  packages: read
cache-mode: none
jobs:
  shell-proof:
    if: >-
      github.repository == 'nil-studio/oasis7' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'task/engineering-storage-admission-shell-probe' &&
      github.base_ref == 'task/engineering-storage-probe-admission-image' &&
      github.event.pull_request.draft == true &&
      github.event.pull_request.title == 'Storage admission shell proof 5c841-once'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    container:
      image: ghcr.io/nil-studio/oasis7/ci-runtime@sha256:3984caa42d82963f93af752bf79e3a07838f2c94279cfbb2deeb08f715cd62c9
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
      options: --user 1001:1001 --init
    env:
      CODE_SHA: 5c841ed56d0e67c5af203b2b65af6128fe56b8e1
      PYTHONDONTWRITEBYTECODE: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Verify the frozen consumer and controller-only difference
        env:
          CONTROLLER_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD)" = "$CONTROLLER_SHA"
          test "$(git diff --name-only "$CODE_SHA" HEAD)" = .github/workflows/storage-admission-shell-proof.yml
      - name: Execute the actual admission preflight and real event denial
        run: |
          set -euo pipefail
          python3 - <<'PYEXTRACT'
          import os,pathlib,textwrap
          source=pathlib.Path('.github/workflows/storage-acceptance.yml').read_text()
          job=source.split('  diagnostics-probe-admission:\n',1)[1].split('  diagnostics-probe:\n',1)[0]
          for name,label in [('Verify the preinstalled admission shell','preflight'),('Reject any source outside the trusted main dispatch','guard')]:
              step=job.split('      - name: '+name+'\n',1)[1].split('      - ',1)[0]
              script=textwrap.dedent(step.split('        run: |\n',1)[1])
              pathlib.Path(os.environ['RUNNER_TEMP'],label+'.sh').write_text(script)
          PYEXTRACT
          bash -euo pipefail "$RUNNER_TEMP/preflight.sh"
          printf 'actual_uid=%s bash=%s\n' "$EUID" "$BASH_VERSION"
          if bash -euo pipefail "$RUNNER_TEMP/guard.sh"; then
            echo 'error: real nonmain PR must be denied' >&2
            exit 1
          fi
          echo 'actual_nonmain_dispatch_denied=true'
      - name: Run controlled exact main allow and four identity denies
        run: |
          python3 scripts/ci-storage-acceptance.test.py Contracts.test_diagnostic_admission_preserves_exact_main_shell_and_readonly_image
          printf 'source=%s probe_only=true main_dispatch_admitted=false storage_acceptance_passed=false\n' "$CODE_SHA"
