name: CodeQL planner environment replay

on:
  pull_request:
    types: [opened]
    branches: [codex/engineering-codeql-plan-replay-base]
    paths: [.github/workflows/codeql-plan-replay.yml]

permissions:
  contents: read
  packages: read

jobs:
  host:
    if: &isolated github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'codex/engineering-codeql-plan-replay'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - &source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 9c4e272303bd2c3515cad40275e5717abea211a0
          fetch-depth: 0
          fetch-tags: false
          persist-credentials: false
      - &replay
        name: Run the candidate planner on frozen PR inputs
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python3 -I - <<'PY'
          import hashlib, json, os, subprocess, sys, tempfile, textwrap
          from pathlib import Path

          assert os.getuid() != 0 and sys.version_info[:2] == (3, 12)
          checkout = '9c4e272303bd2c3515cad40275e5717abea211a0'
          base = '0c9f7393867ff22acd682195cfb9c49fbcee445d'
          source = '2b622595f9aaf4a484e7d0a256188dcd5517f899'
          candidate = 'edc356bca7d8409b4d8a395bac1b273191185cfa'
          assert subprocess.check_output(['git', 'show', '--no-patch', '--format=%H %P', 'HEAD'],
                                         text=True).strip().split() == [checkout, base, source]
          workflow = subprocess.check_output(['git', 'show', f'{candidate}:.github/workflows/codeql.yml'], text=True)

          def shell_body(step):
              block = workflow.split('name: ' + step + '\n', 1)[1].split('        run: |\n', 1)[1]
              return textwrap.dedent(block.split('\n      - ', 1)[0].split('\n  analyze:', 1)[0])

          event = {'action': 'synchronize', 'repository': {'default_branch': 'main'},
                   'pull_request': {'number': 6689, 'draft': False, 'base': {'sha': base}, 'head': {'sha': source}}}
          batches = {'actions-repo/default': 'observe', 'actions-repo/extended': 'baseline',
                     'python-repo/default': 'observe', 'python-repo/extended': 'baseline',
                     'javascript-repo/default': 'observe', 'javascript-repo/extended': 'baseline',
                     'rust-repo/default': 'baseline'}
          with tempfile.TemporaryDirectory(dir=os.environ['RUNNER_TEMP']) as work:
              work = Path(work)
              event_path, output, summary = (work / name for name in ('event.json', 'outputs', 'summary'))
              event_path.write_text(json.dumps(event))
              env = dict(os.environ, GITHUB_EVENT_PATH=str(event_path), GITHUB_EVENT_NAME='pull_request',
                         GITHUB_SHA=checkout, GITHUB_REF='refs/pull/6689/merge', GITHUB_OUTPUT=str(output),
                         GITHUB_STEP_SUMMARY=str(summary), RUNNER_TEMP=str(work), CODEQL_MODE='observe', CODEQL_SLOTS='2',
                         CODEQL_PROFILE='default', CODEQL_BATCH_MODES=json.dumps(batches))
              for step in ('Verify preinstalled planner tools', 'Plan from trusted base in isolated Python'):
                  subprocess.run(['bash', '--noprofile', '--norc', '-euo', 'pipefail', '-c', shell_body(step)],
                                 env=env, check=True)
              results = dict(line.split('=', 1) for line in output.read_text().splitlines())
              assert set(results) == {'matrix', 'has_units', 'profile', 'status', 'checkout'}
              assert (results['has_units'], results['profile'], results['status'], results['checkout']) == (
                  'true', 'default', 'selected', checkout)
              rows = json.loads(results['matrix'])['include']
              assert len(rows) == 1 and rows[0]['unit'] == 'actions-repo'
              assert rows[0]['queries'] == '' and rows[0]['build_mode'] == 'none'
              text = summary.read_text()
              heading, content = text.split('```json\n', 1)
              assert content.endswith('\n```\n')
              plan = json.loads(content.removesuffix('\n```\n'))
              policy = plan['policy']
              policy_path = Path(policy['path']).relative_to(work)
              assert len(policy_path.parts) == 2 and policy_path.name == 'codeql-policy.json'
              raw_policy = subprocess.check_output(['git', 'show', base + ':scripts/security/codeql-policy.json'])
              assert hashlib.sha256(raw_policy).hexdigest() == policy['sha256']
              policy['path'] = '<temporary planner directory>/codeql-policy.json'
              canonical_summary = (heading + json.dumps(plan, sort_keys=True)).encode()
              expected = {
                  'summary': ('428fd69426d58621c68993978ab463a38d619ea15c3e5f2c3499643f735e742a', canonical_summary),
                  'outputs': ('92ec85dd645262e7f064c918cc725dc6da7e5e8af37c685535e2e44bc8bc764c', output.read_bytes()),
              }
              for name, (digest, data) in expected.items():
                  assert hashlib.sha256(data).hexdigest() == digest, name
                  print(name, digest)
          PY

  image:
    if: *isolated
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    container:
      image: ghcr.io/nil-studio/oasis7/ci-runtime@sha256:3984caa42d82963f93af752bf79e3a07838f2c94279cfbb2deeb08f715cd62c9
      options: --user 1001:1001
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    steps:
      - *source
      - *replay
