name: Document corpus platform regressions

on:
  pull_request:
    paths:
      - .gitattributes
      - .gitignore
      - .github/workflows/document-corpus-platform.yml
      - scripts/ci-required-scope.json
      - scripts/document-corpus-inventory*
      - scripts/document_corpus.py
      - scripts/document_evidence_policy.py
      - scripts/doc-evidence-inventory-check*
      - scripts/fixtures/document-corpus-v3/**
  push:
    branches:
      - main
    paths:
      - .gitattributes
      - .gitignore
      - .github/workflows/document-corpus-platform.yml
      - scripts/ci-required-scope.json
      - scripts/document-corpus-inventory*
      - scripts/document_corpus.py
      - scripts/document_evidence_policy.py
      - scripts/doc-evidence-inventory-check*
      - scripts/fixtures/document-corpus-v3/**

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

cache-mode: read

jobs:
  document-corpus-platform:
    name: Document corpus and evidence (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12.3"
      - name: Run corpus and evidence regressions, including platform lock/path cases
        run: |
          python scripts/document-corpus-inventory-check.test.py
          python scripts/doc-evidence-inventory-check.test.py
