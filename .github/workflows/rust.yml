    needs: select
    if: >-
      always() && !cancelled() && needs.select.result == 'success' &&
      (needs.select.outputs.run_workflow_governance == 'true' ||
       fromJSON(needs.select.outputs.plan).scope == 'full')
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.select.outputs.tested_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Download trusted control authority
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.select.outputs.authority_artifact }}
          path: ${{ runner.temp }}/ci-authority
      - name: Download trusted control selection
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.select.outputs.selection_artifact }}
          path: ${{ runner.temp }}/ci-control-selection
      - name: Inspect trusted governance capability
        id: control-mode
        if: fromJSON(needs.select.outputs.plan).python_control_contract_version == 1
        shell: bash
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/ci-authority/ci-python-control-contracts.py"
          help=$(python3 -I "$RUNNER_TEMP/ci-authority/ci-python-control-contracts.py" --help)
          if grep -Fq -- '--governance' <<< "$help"; then
            echo 'complete_governance=true' >> "$GITHUB_OUTPUT"
          else
            echo 'complete_governance=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Install document contract parser
        run: python3 -m pip install --disable-pip-version-check --requirement scripts/doc-governance-requirements.txt
      - name: Install pinned tools for offline control fixtures
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt --component clippy
          rustup default "$RUST_TOOLCHAIN"
          cargo --version
          rustc --version
          command -v zstd
          command -v zstdmt
      - name: Execute trusted baseline Python control contracts
        if: fromJSON(needs.select.outputs.plan).python_control_contract_version == 1
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.select.outputs.source_sha }}
          POLICY_SHA: ${{ needs.select.outputs.policy_sha }}
          COMPLETE_GOVERNANCE: ${{ steps.control-mode.outputs.complete_governance }}
          RUSTUP_TOOLCHAIN: ${{ env.RUST_TOOLCHAIN }}
          CI_VERBOSE: "1"
          OASIS7_PRODUCT_DOC_BASE: ${{ needs.select.outputs.range_base }}
          OASIS7_PRODUCT_DOC_HEAD: ${{ needs.select.outputs.tested_sha }}
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/ci-authority/ci-python-control-contracts.py"
          complete=()
          if [[ "$COMPLETE_GOVERNANCE" == true ]]; then
            complete=(--governance)
          fi
          python3 "$RUNNER_TEMP/ci-authority/ci-python-control-contracts.py" run \
            --repo-root "$GITHUB_WORKSPACE" --policy-sha "$POLICY_SHA" \
            --plan "$RUNNER_TEMP/ci-control-selection/selection.json" "${complete[@]}"
      - name: Verify scoped candidate cache permission
        uses: ./.github/actions/cache-permission-probe
      - name: Restore trusted cache sentinel
        id: trusted-cache-sentinel
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/cache-permission-sentinel
          key: oasis7-cache-permission-sentinel-trusted-v2
      - name: Verify trusted cache sentinel when available
        env:
          CACHE_HIT: ${{ steps.trusted-cache-sentinel.outputs.cache-hit }}
        run: |
          if [[ "$CACHE_HIT" == true ]]; then
            grep -Fqx 'trusted-v2' "$RUNNER_TEMP/cache-permission-sentinel/sentinel"
            echo 'cache_permission_probe=trusted_restore_verified'
          else
            echo 'cache_permission_probe=trusted_writer_not_yet_seeded'
          fi
      - name: Execute selected group
        if: steps.control-mode.outputs.complete_governance != 'true'
        shell: bash
        env:
          CI_VERBOSE: "1"
          OASIS7_PRODUCT_DOC_BASE: ${{ needs.select.outputs.range_base }}
          OASIS7_PRODUCT_DOC_HEAD: ${{ needs.select.outputs.tested_sha }}
        run: bash ./scripts/ci-tests.sh required --group "workflow_governance" --repo-root "$GITHUB_WORKSPACE"
      - name: Verify new source archive and cache permission contracts
        if: steps.control-mode.outputs.complete_governance != 'true'
        run: |
          python3 scripts/package-source-plan.test.py
          python3 scripts/safe-git-archive.test.py
          node scripts/cache-permission-probe.test.cjs

