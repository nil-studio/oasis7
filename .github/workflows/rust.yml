        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: crates/oasis7_viewer/package-lock.json
      - name: Install viewer dependencies
        run: npm ci --prefix crates/oasis7_viewer
      - name: Install pinned security smoke browser
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/viewer-security-browser" --no-save --package-lock=false agent-browser@0.37.1
          browser_bin="$RUNNER_TEMP/viewer-security-browser/node_modules/.bin/agent-browser"
          "$browser_bin" install --with-deps
          printf 'AGENT_BROWSER_BIN=%s\n' "$browser_bin" >> "$GITHUB_ENV"
      - name: Install pinned Rust toolchains
        shell: bash
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt --component clippy
          rustup default "$RUST_TOOLCHAIN"
          rustup toolchain install "$OASIS7_WASM_TOOLCHAIN" --profile minimal --component rust-src
          rustup target add "$OASIS7_WASM_TARGET" --toolchain "$OASIS7_WASM_TOOLCHAIN"
          rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: false
          shared-key: ci-full-regression-trusted-v2
          add-rust-environment-hash-key: true
          env-vars: CARGO CC CFLAGS CXX CMAKE RUST OASIS7_WASM
          cache-on-failure: true
      - name: Resolve wasm-bindgen tool cache metadata
        id: bindgen-meta
        shell: bash
        run: |
          source scripts/wasm-bindgen-cli-common.sh
          printf 'version=%s\nroot=%s\n' "$WASM_BINDGEN_LOCK_VERSION" "$WASM_BINDGEN_CACHE_ROOT" >> "$GITHUB_OUTPUT"
      - name: Restore exact wasm-bindgen tool cache
        id: bindgen-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.bindgen-meta.outputs.root }}
          key: wasm-bindgen-cli-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.RUST_TOOLCHAIN }}-${{ steps.bindgen-meta.outputs.version }}-${{ hashFiles('scripts/ensure-wasm-bindgen-cli.sh', 'scripts/wasm-bindgen-cli-common.sh') }}
      - name: Prepare exact wasm-bindgen tool directory
        id: prepare-bindgen
        shell: bash
        env:
          BINDGEN_CACHE_HIT: ${{ steps.bindgen-cache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          source scripts/wasm-bindgen-cli-common.sh
          if [[ "$BINDGEN_CACHE_HIT" == true ]]; then
            bindgen_bin="$WASM_BINDGEN_CACHE_ROOT/bin/wasm-bindgen"
            test -x "$bindgen_bin"
            test "$("$bindgen_bin" --version)" = "wasm-bindgen $WASM_BINDGEN_LOCK_VERSION"
          else
            bindgen_bin="$(bash scripts/ensure-wasm-bindgen-cli.sh --ensure-cache --print-bin)"
          fi
          test -x "$bindgen_bin"
          test "$("$bindgen_bin" --version)" = "wasm-bindgen $WASM_BINDGEN_LOCK_VERSION"
          printf 'WASM_BINDGEN_BIN=%s\n' "$bindgen_bin" >> "$GITHUB_ENV"
      - name: Install native libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libwayland-dev wayland-protocols libxkbcommon-dev libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxinerama-dev libasound2-dev libudev-dev
      - name: Execute selected group
        shell: bash
        env:
          CI_VERBOSE: "1"
          OASIS7_PRODUCT_DOC_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          OASIS7_PRODUCT_DOC_HEAD: ${{ github.sha }}
