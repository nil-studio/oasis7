          RUSTUP_TOOLCHAIN: ${{ env.RUST_TOOLCHAIN }}
        run: bash crates/oasis7_custody_worker/scripts/verify.sh --stage native-contracts

  custody-native:
    needs: select
    if: >-
      always() && !cancelled() && needs.select.result == 'success' &&
      fromJSON(needs.select.outputs.plan).custody_execution_version == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      artifact: ${{ steps.bundle.outputs.artifact }}
      attempt: ${{ steps.bundle.outputs.attempt }}
    env:
      CUSTODY_COMPONENT: native
      OASIS7_SUPPORT_CAPACITY: "1"
      OASIS7_SUPPORT_SOURCE_SHA: ${{ needs.select.outputs.source_sha }}
      OASIS7_SUPPORT_TESTED_SHA: ${{ needs.select.outputs.tested_sha }}
      OASIS7_SUPPORT_POLICY_SHA: ${{ needs.select.outputs.policy_sha }}
      OASIS7_SUPPORT_RANGE_BASE: ${{ needs.select.outputs.range_base }}
    steps: &custody-build-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.select.outputs.tested_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Install pinned Rust toolchains
        shell: bash
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt --component clippy
          rustup default "$RUST_TOOLCHAIN"
          rustup toolchain install "$OASIS7_WASM_TOOLCHAIN" --profile minimal --component rust-src
          rustup target add "$OASIS7_WASM_TARGET" --toolchain "$OASIS7_WASM_TOOLCHAIN"
          rustup target add wasm32-unknown-unknown
      - name: Stabilize Rust cache toolchains
        shell: bash
        run: python3 scripts/ci-rust-cache-toolchains.py "$RUST_TOOLCHAIN" "$OASIS7_WASM_TOOLCHAIN"
      - name: Observe support capacity before cache
        shell: bash
        run: |
          source scripts/ci-tests.sh
          support_capacity_snapshot before-cache
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: false
          shared-key: ci-shared-native-trusted-v4
          add-rust-environment-hash-key: true
          env-vars: CARGO CC CFLAGS CXX CMAKE RUST OASIS7_WASM
          cache-on-failure: false
      - name: Observe support capacity after cache
        shell: bash
        run: |
          source scripts/ci-tests.sh
          support_capacity_snapshot after-cache
      - name: Identify pinned Worker build tool
        id: worker-meta
        if: env.CUSTODY_COMPONENT != 'native'
        run: python3 scripts/ci-worker-build.py metadata --github-output "$GITHUB_OUTPUT"
      - name: Restore exact Worker build tool
        id: worker-tool-cache
        if: env.CUSTODY_COMPONENT != 'native'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.worker-meta.outputs.root }}
          key: worker-build-cli-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.RUST_TOOLCHAIN }}-0.7.5-${{ steps.worker-meta.outputs.definition_sha }}
      - name: Prepare verified Worker build tool
        if: env.CUSTODY_COMPONENT != 'native'
        shell: bash
        timeout-minutes: 11
        env:
          TOOL_CACHE_HIT: ${{ steps.worker-tool-cache.outputs.cache-hit }}
        run: |
          if [[ "$TOOL_CACHE_HIT" == true ]]; then
            python3 scripts/ci-worker-build.py check
          else
            python3 scripts/ci-worker-build.py ensure
          fi
      - name: Install native libraries
        shell: bash
        timeout-minutes: 11
        run: |
          sudo -n /usr/bin/python3 scripts/ci-apt-install.py --budget-seconds 600 -- pkg-config libwayland-dev wayland-protocols libxkbcommon-dev libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxinerama-dev libasound2-dev libudev-dev
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.select.outputs.selection_artifact }}
          path: ${{ runner.temp }}
      - name: Build and verify the complete custody component
        shell: bash
        run: |
          stage="$CUSTODY_COMPONENT"
          if [[ "$stage" == native ]]; then
            stage=native-fixtures
          fi
          bash crates/oasis7_custody_worker/scripts/verify.sh --stage "$stage"
          if [[ "$CUSTODY_COMPONENT" == wasm-approval ]]; then
            driver_dir="$GITHUB_WORKSPACE/scripts"
            ci_python="$(bash "$driver_dir/find-python-with-module.sh" tomllib)"
            source scripts/ci-tests.sh
            run_worker_wasm_compile_profiles
          fi
      - name: Bind complete component outputs
        id: bundle
        shell: bash
        run: |
          python3 scripts/ci-custody-platform.py pack --plan "$RUNNER_TEMP/selection.json" --component "$CUSTODY_COMPONENT" --bundle "$RUNNER_TEMP/custody-bundle"
          echo "artifact=custody-${CUSTODY_COMPONENT}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
          echo "attempt=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.bundle.outputs.artifact }}
          path: ${{ runner.temp }}/custody-bundle
          # The verified manifest includes generated dotfiles such as .gitignore.
          include-hidden-files: true
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

