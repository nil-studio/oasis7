name: Rust

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "17,37,57 * * * *"
  workflow_dispatch:
    inputs:
      run_mode:
        description: "Manual product verification or package build"
        required: true
        default: full
        type: choice
        options: [full, newapi_bridge_package, codeql_rust_model_diagnostic]
      source_ref:
        description: "Optional candidate commit or branch for a full run from main"
        type: string
        default: ""
      model_probe:
        description: "Candidate public-model diagnostic partition"
        type: choice
        default: node-only
        options: [node-only, endpoints, peer-df, driver-non-target, driver-target, calls, full, trait-scope-plan]
      model_bundle_version:
        description: "Complete official CodeQL bundle"
        type: choice
        default: "2.27.2"
        options: ["2.27.2", "2.27.3"]
      newapi_bridge_build_profile:
        description: "Cargo package profile"
        required: true
        default: release
        type: choice
        options: [release, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.event_name == 'schedule' && format('periodic-observe-{0}', github.run_id) || (github.event_name == 'workflow_dispatch' && inputs.run_mode == 'full') && format('candidate-full-{0}-{1}', github.ref, inputs.source_ref || github.sha) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  PYTHONDONTWRITEBYTECODE: "1"
  # Configured repository cache budget: 20 GB (decimal bytes).
  # GitHub cache limits and billing budgets must also allow this capacity.
  CI_CACHE_REPOSITORY_BUDGET_BYTES: "20000000000"
  CARGO_NET_RETRY: 10
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  RUST_TOOLCHAIN: 1.96.0
  TRUNK_VERSION: 0.21.14
  OASIS7_WASM_TOOLCHAIN: nightly-2025-12-11
  OASIS7_WASM_TARGET: wasm32-unknown-unknown
  OASIS7_WASM_BUILD_STD: "1"
  OASIS7_WASM_BUILD_STD_COMPONENTS: std,panic_abort

cache-mode: read

jobs:
  codeql-rust-model-diagnostic:
    if: github.event_name == 'workflow_dispatch' && inputs.run_mode == 'codeql_rust_model_diagnostic'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Freeze diagnostic deadline before preparation
        run: echo "MODEL_DEADLINE=$(( $(date +%s) + 1080 ))" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 49b25e1ab631ffb433bce88709fa5601720cfc17
          path: model-source
          persist-credentials: false
      - name: Set up selected immutable Rust CodeQL bundle
        env:
          BUNDLE_VERSION: ${{ inputs.model_bundle_version }}
          MODEL_PROBE: ${{ inputs.model_probe }}
        run: |
          case "$BUNDLE_VERSION" in
            2.27.2) bundle_sha=acf2050189aeede5b9aa566f8fb382b02ac1ace72f534778f68b06fce5371cea ;;
            2.27.3) bundle_sha=218a19c49a4e44dee236d2cc55e20cda03ac4f37ddc581b1b0e5fff2e7912237 ;;
            *) exit 1 ;;
          esac
          if [ "$MODEL_PROBE" = trait-scope-plan ]; then test "$BUNDLE_VERSION" = 2.27.3; fi
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir "$RUNNER_TEMP/rust-model-tools"
          curl --fail --location --max-time 120 \
            "https://github.com/github/codeql-action/releases/download/codeql-bundle-v${BUNDLE_VERSION}/codeql-bundle-rust-linux64.tar.zst" \
            --output "$RUNNER_TEMP/rust-model-tools/bundle.tar.zst"
          echo "$bundle_sha  $RUNNER_TEMP/rust-model-tools/bundle.tar.zst" | sha256sum --check
          timeout 120 tar --zstd -xf "$RUNNER_TEMP/rust-model-tools/bundle.tar.zst" -C "$RUNNER_TEMP/rust-model-tools"
          if [ "$MODEL_PROBE" != trait-scope-plan ]; then
            timeout 180 rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt --component clippy
            timeout 180 rustup toolchain install 1.98.1 --profile minimal
          fi
      - name: Diagnose selected public-model partition
        env:
          BUNDLE_VERSION: ${{ inputs.model_bundle_version }}
          MODEL_PROBE: ${{ inputs.model_probe }}
        run: |
          python3 scripts/security/codeql-rust-model-diagnostic.py \
            --bundle-version "$BUNDLE_VERSION" --probe "$MODEL_PROBE" \
            --business-source "$GITHUB_WORKSPACE/model-source" \
            --codeql "$RUNNER_TEMP/rust-model-tools/codeql/codeql" \
            --output "$RUNNER_TEMP/rust-model-evidence" \
            --work "$RUNNER_TEMP/rust-model-data" --deadline "$MODEL_DEADLINE"
      - name: Check combined diagnostic evidence budget
        id: diagnostic-budget
        if: always()
        run: |
          python3 - <<'PY'
          import os, pathlib
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'rust-model-evidence'
          if not root.is_dir() or any(p.is_symlink() or not (p.is_dir() or p.is_file()) for p in root.rglob('*')):
              raise SystemExit('missing or unsafe diagnostic evidence')
          if sum(p.stat().st_size for p in root.rglob('*') if p.is_file()) > 64 * 1024**2:
              raise SystemExit('combined evidence cap exceeded')
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.diagnostic-budget.outcome == 'success'
        with:
          name: rust-model-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: ${{ runner.temp }}/rust-model-evidence
          retention-days: 14
          if-no-files-found: error
  periodic-admission:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
      actions: read
    concurrency:
      group: rust-periodic-admission-main
      cancel-in-progress: false
    outputs:
      run_full: ${{ steps.admit.outputs.run_full }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Admit one due full run from actual history
        id: admit
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: python3 scripts/ci-full-result.py admit-periodic --output "$RUNNER_TEMP/admission.json" --github-output "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-periodic-admission-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/admission.json
          if-no-files-found: error
          retention-days: 30

  select:
    needs: periodic-admission
    if: >-
      always() && !cancelled() &&
      (github.event_name != 'workflow_dispatch' || inputs.run_mode == 'full') &&
      (github.event_name != 'schedule' ||
       (needs.periodic-admission.result == 'success' && needs.periodic-admission.outputs.run_full == 'true'))
    runs-on: ubuntu-24.04
    outputs:
      plan: ${{ steps.select.outputs.plan }}
      selection_artifact: ${{ steps.selection-artifacts.outputs.selection_artifact }}
      authority_artifact: ${{ steps.selection-artifacts.outputs.authority_artifact }}
      source_sha: ${{ steps.select.outputs.source_sha }}
      tested_sha: ${{ steps.select.outputs.tested_sha }}
      policy_sha: ${{ steps.select.outputs.policy_sha }}
      range_base: ${{ steps.select.outputs.range_base }}
      trusted_source: ${{ steps.select.outputs.trusted_source }}
      formal_shards: ${{ steps.select.outputs.formal_shards || '["runtime-protocol","world-history","healthy-set","storage-recovery","lifecycle-cli"]' }}
      ordinary_partitions: ${{ steps.select.outputs.ordinary_partitions || '["all"]' }}
      workspace_support_partitions: ${{ steps.select.outputs.workspace_support_partitions || '["all"]' }}
      command_center_package: ${{ steps.select.outputs.command_center_package || 'true' }}
      run_baseline: ${{ steps.select.outputs.run_baseline }}
      run_command_center: ${{ steps.select.outputs.run_command_center }}
      run_rust_baseline: ${{ steps.select.outputs.run_rust_baseline }}
      run_formal_process: ${{ steps.formal-select.outputs.run_formal_process }}
      run_oasis7_required: ${{ steps.select.outputs.run_oasis7_required }}
      run_consensus: ${{ steps.select.outputs.run_consensus }}
      run_distfs: ${{ steps.select.outputs.run_distfs }}
      run_node: ${{ steps.select.outputs.run_node }}
      run_net: ${{ steps.select.outputs.run_net }}
      run_viewer_js_required: ${{ steps.select.outputs.run_viewer_js_required }}
      run_viewer_performance_report: ${{ steps.select.outputs.run_viewer_performance_report }}
      run_pixel_world_bridge: ${{ steps.select.outputs.run_pixel_world_bridge }}
      run_launcher_web: ${{ steps.select.outputs.run_launcher_web }}
      run_workspace_support: ${{ steps.select.outputs.run_workspace_support }}
      run_scenario_regression: ${{ steps.select.outputs.run_scenario_regression }}
      run_operational_contracts: ${{ steps.select.outputs.run_operational_contracts }}
      run_packaging_contracts: ${{ steps.select.outputs.run_packaging_contracts }}
      run_workflow_governance: ${{ steps.select.outputs.run_workflow_governance }}
      run_codex_agent_config_validation: ${{ steps.select.outputs.run_codex_agent_config_validation }}
      run_compile_metrics: ${{ steps.select.outputs.run_compile_metrics }}
      run_site_quality: ${{ steps.select.outputs.run_site_quality }}
      run_doc_checker_contracts: ${{ steps.select.outputs.run_doc_checker_contracts }}
      run_cargo_tooling_contracts: ${{ steps.select.outputs.run_cargo_tooling_contracts }}
      run_windows_rollout: ${{ steps.select.outputs.run_windows_rollout }}
      run_macos_package_contract: ${{ steps.select.outputs.run_macos_package_contract }}
      run_fleet_health: ${{ steps.select.outputs.run_fleet_health }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - id: select
        name: Select using trusted baseline Git data
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          SOURCE_REF: ${{ inputs.source_ref }}
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "${SOURCE_SHA}^{commit}"
          source_sha="$(git rev-parse --verify "${SOURCE_SHA}^{commit}")"
          tested_sha="$(git rev-parse HEAD)"
          if [[ "$EVENT_NAME" == schedule || "$EVENT_NAME" == workflow_dispatch ]]; then
            if [[ "$GITHUB_REF" == refs/heads/main ]]; then
              policy_sha="$(git rev-parse --verify "${WORKFLOW_SHA}^{commit}")"
            else
              git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
              policy_sha="$(git rev-parse --verify 'refs/remotes/origin/main^{commit}')"
            fi
            if [[ -n "$SOURCE_REF" ]]; then
              [[ "$EVENT_NAME:$GITHUB_REF" == workflow_dispatch:refs/heads/main ]] || {
                echo '::error::source_ref requires a full dispatch from main'; exit 1;
              }
              source_sha="$(git rev-parse --verify --end-of-options "${SOURCE_REF}^{commit}" 2>/dev/null ||
                git rev-parse --verify --end-of-options "refs/remotes/origin/${SOURCE_REF}^{commit}")"
            fi
            tested_sha="$source_sha"
            range_base="$(git rev-parse --verify "${source_sha}^1" 2>/dev/null || printf '%s' "$source_sha")"
            profile=candidate-full
            [[ "$EVENT_NAME" != schedule ]] || profile=periodic-full
          else
            git cat-file -e "${BASE_SHA}^{commit}"
            policy_sha="$BASE_SHA"
            range_base="$BASE_SHA"
            profile=main-fast
            [[ "$EVENT_NAME" != pull_request ]] || profile=pr-fast
          fi
          authority="$RUNNER_TEMP/ci-authority"
          mkdir -p "$authority"
          for file in plan-rust-required-scope.py ci-required-scope.json ci-required-result.py ci-formal-plan.py ci-formal-process-suites.json; do
            git show "${policy_sha}:scripts/${file}" >"${authority}/${file}"
          done
          if git cat-file -e "${policy_sha}:scripts/ci-python-control-contracts.py" 2>/dev/null; then
            git show "${policy_sha}:scripts/ci-python-control-contracts.py" >"${authority}/ci-python-control-contracts.py"
          fi
          args=(--head-ref "$source_sha" --test-ref "$tested_sha" --github-output "$GITHUB_OUTPUT" --output "$RUNNER_TEMP/selection.json")
          bootstrap_full=false
          if python3 "$authority/plan-rust-required-scope.py" --help | grep -q -- '--profile'; then
            args+=(--profile "$profile" --policy-ref "$policy_sha" --formal-config "$authority/ci-formal-process-suites.json")
          elif [[ "$profile" == periodic-full || "$profile" == candidate-full ]]; then
            [[ "$EVENT_NAME" == workflow_dispatch && "$GITHUB_REF" != refs/heads/main ]] || {
              echo '::error::trusted main does not yet support the complete full inventory'; exit 1;
            }
            # A candidate may prove the new full wiring with the complete old
            # inventory. This read-only result never qualifies a release.
            bootstrap_full=true
            cp scripts/ci-required-result.py scripts/ci-full-result.py "$authority/"
          fi
          if [[ "$profile" == pr-fast || "$profile" == main-fast ]]; then
            args+=(--base-ref "$BASE_SHA")
          elif [[ "$bootstrap_full" == false ]]; then
            git show "${policy_sha}:scripts/ci-full-result.py" >"${authority}/ci-full-result.py"
          fi
          if [[ "$bootstrap_full" == true ]]; then
            python3 - "$authority/ci-required-scope.json" "$source_sha" "$policy_sha" "$RUNNER_TEMP/selection.json" "$GITHUB_OUTPUT" <<'PY'
          import json, pathlib, sys
          config, source, policy, output, github_output = sys.argv[1:]
          groups = json.loads(pathlib.Path(config).read_text())['groups']
          plan = {'scope': 'explicit-full', 'groups': groups, 'execution_profile': 'candidate-full',
                  'check_inventory_version': 1, 'source_sha': source, 'tested_sha': source,
                  'policy_sha': policy, 'bootstrap_full': True}
          pathlib.Path(output).write_text(json.dumps(plan, sort_keys=True) + '\n')
          with pathlib.Path(github_output).open('a') as stream:
              stream.write('plan=' + json.dumps(plan, separators=(',', ':')) + '\n')
              stream.writelines('run_' + group + '=true\n' for group in groups)
          PY
          else
            python3 "$authority/plan-rust-required-scope.py" "${args[@]}"
          fi
          trusted_source=false
          if [[ "$GITHUB_REF" == refs/heads/main && "$WORKFLOW_SHA" == "$GITHUB_SHA" && "$source_sha" == "$GITHUB_SHA" ]]; then
            trusted_source=true
          fi
          printf 'source_sha=%s\ntested_sha=%s\npolicy_sha=%s\nrange_base=%s\ntrusted_source=%s\n' "$source_sha" "$tested_sha" "$policy_sha" "$range_base" "$trusted_source" >>"$GITHUB_OUTPUT"
          printf 'Policy: %s\nSource HEAD: %s\nTested commit: %s\n' "$policy_sha" "$source_sha" "$tested_sha" >>"$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/selection.json" >>"$GITHUB_STEP_SUMMARY"
      - id: formal-select
        name: Resolve formal selection with conservative old-baseline fallback
        run: |
          python3 "$RUNNER_TEMP/ci-authority/ci-formal-plan.py" --plan "$RUNNER_TEMP/selection.json" --config "$RUNNER_TEMP/ci-authority/ci-required-scope.json" --github-output "$GITHUB_OUTPUT"
      - id: selection-artifacts
        name: Preserve selection attempt for downstream reruns
        run: |
          printf 'selection_artifact=ci-selection-%s-%s\nauthority_artifact=ci-authority-%s-%s\n' \
            "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.selection-artifacts.outputs.authority_artifact }}
          path: ${{ runner.temp }}/ci-authority
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.selection-artifacts.outputs.selection_artifact }}
          path: ${{ runner.temp }}/selection.json
          if-no-files-found: error
          retention-days: 30
      - &engineering-job-observation
        name: Record engineering job observation
        if: always() && !cancelled()
        continue-on-error: true
        timeout-minutes: 1
        shell: bash
        env:
          TELEMETRY_WORKFLOW_SHA: ${{ github.workflow_sha }}
          TELEMETRY_SOURCE_SHA: ${{ needs.select.outputs.source_sha || steps.select.outputs.source_sha }}
          TELEMETRY_TESTED_SHA: ${{ needs.select.outputs.tested_sha || steps.select.outputs.tested_sha }}
          TELEMETRY_POLICY_SHA: ${{ needs.select.outputs.policy_sha || steps.select.outputs.policy_sha }}
          TELEMETRY_NEEDS: ${{ toJSON(needs) }}
          TELEMETRY_MATRIX: ${{ toJSON(matrix) }}
        run: |
          python3 - <<'PY_OBSERVATION' # oasis7-engineering-job-observation/v1
          import gzip, hashlib, json, os, pathlib, re, subprocess
          E = os.environ
          limit = 1024 * 1024
          missing = []
          def digest(raw):
              return hashlib.sha256(raw).hexdigest()
          def bounded(path):
              path = pathlib.Path(path)
              if any(p.is_symlink() for p in (path, *path.parents)):
                  raise ValueError('symlink')
              with path.open('rb') as stream:
                  raw = stream.read(limit + 1)
              if len(raw) > limit:
                  raise ValueError('size')
              return raw
          def sha(value):
              return value if isinstance(value, str) and re.fullmatch('[0-9a-f]{40}', value) else None
          def token(value):
              return isinstance(value, str) and re.fullmatch('[A-Za-z0-9][A-Za-z0-9_.:-]{0,127}', value) and not re.search(r'(?i)(password|secret|authorization|bearer|access.token|gh[pousr]_|github_pat_)', value)
          def safe_json(name, fallback, max_bytes=65536):
              raw = E.get(name, '')
              if len(raw) > max_bytes or len(raw.encode('utf-8')) > max_bytes:
                  raise ValueError('context_size')
              return json.loads(raw) if raw else fallback
          # needs includes upstream outputs such as the selection plan; only results survive.
          needs = safe_json('TELEMETRY_NEEDS', {}, max_bytes=1024 * 1024)
          matrix = safe_json('TELEMETRY_MATRIX', {}) or {}
          if not isinstance(needs, dict) or not isinstance(matrix, dict):
              raise ValueError('context_type')
          if len(needs) > 100 or len(matrix) > 32 or any(not token(k) or not isinstance(v, dict) or v.get('result') not in ('success', 'failure', 'cancelled', 'skipped') for k, v in needs.items()):
              raise ValueError('needs_values')
          if any(not token(k) or not (type(v) is bool or (type(v) is int and abs(v) <= 2**31) or token(v)) for k, v in matrix.items()):
              raise ValueError('matrix_values')
          needs = {key: value.get('result') for key, value in needs.items()}
          workspace = pathlib.Path(E['GITHUB_WORKSPACE'])
          checkout = None
          if (workspace / '.git').exists():
              try:
                  checkout = sha(subprocess.check_output(['git', 'rev-parse', 'HEAD'], cwd=workspace,
                                   timeout=5, stderr=subprocess.DEVNULL, text=True).strip())
              except (OSError, subprocess.SubprocessError):
                  missing.append('checkout_unavailable')
          temp = pathlib.Path(E['RUNNER_TEMP'])
          configs = {}
          for label, path in [('checkout-test-config', workspace / 'scripts/ci-formal-process-suites.json'),
                              ('checkout-scope-config', workspace / 'scripts/ci-required-scope.json'),
                              ('formal-authority', temp / 'ci-authority/ci-formal-process-suites.json')]:
              if path.exists():
                  try:
                      configs[label] = digest(bounded(path))
                  except (OSError, ValueError):
                      missing.append('configuration_unavailable')
          job = E['GITHUB_JOB']
          locations = []
          if job in ('formal-debug-build', 'formal-debug-build-trusted'):
              locations = [('produced', 'debug', temp / 'formal-debug-tests/manifest.json', False)]
          elif job in ('formal-endpoint-build', 'formal-endpoint-build-trusted'):
              locations = [('produced', 'endpoint', temp / 'formal-endpoint-tests/manifest.json', False)]
          elif job in ('formal-test-build', 'formal-test-build-trusted'):
              locations = [('observed-input', 'debug', temp / 'formal-debug-tests/manifest.json', False),
                           ('observed-input', 'endpoint', temp / 'formal-endpoint-tests/manifest.json', False)]
              for shard in ('runtime-protocol', 'world-history', 'healthy-set', 'storage-recovery', 'lifecycle-cli'):
                  locations.append(('produced', shard, temp / 'formal-archives' / (shard + '.tar.gz'), True))
          elif job == 'formal-process-tests':
              locations = [('observed-input', matrix.get('shard'), temp / 'native-tests/manifest.json', False)]
          manifests = []
          for direction, label, path, archived in locations:
              if not path.exists():
                  continue
              try:
                  if archived:
                      if any(p.is_symlink() for p in (path, *path.parents)):
                          raise ValueError('symlink')
                      with gzip.open(path, 'rb') as stream:
                          header = stream.read(512)
                          if (len(header) != 512 or header[:100].split(b'\0', 1)[0] != b'manifest.json'
                                  or header[156:157] not in (b'0', b'\0')
                                  or int(header[148:156].strip(b'\0 '), 8) != sum(header[:148]) + 256 + sum(header[156:])):
                              raise ValueError('manifest_header')
                          size = int(header[124:136].strip(b'\0 '), 8)
                          if not 0 <= size <= limit:
                              raise ValueError('manifest_size')
                          raw = stream.read(size)
                          if len(raw) != size:
                              raise ValueError('manifest_truncated')
                  else:
                      raw = bounded(path)
                  manifest = json.loads(raw)
                  if type(manifest.get('schema_version')) is not int or manifest['schema_version'] != 2:
                      raise ValueError('manifest_schema')
                  if any(not isinstance(manifest.get(k), str) or not re.fullmatch('[1-9][0-9]{0,18}', manifest[k]) or int(manifest[k]) > 2**63-1 for k in ('producer_run_id', 'producer_attempt')):
                      raise ValueError('manifest_producer')
                  if not isinstance(manifest.get('config_sha256'), str) or not re.fullmatch('[0-9a-f]{64}', manifest['config_sha256']) or not token(label):
                      raise ValueError('manifest_config')
                  manifests.append(dict(direction=direction, label=label, manifest_sha256=digest(raw),
                      source_sha=sha(manifest.get('source_sha')), tested_sha=sha(manifest.get('tested_sha')),
                      producer_run_id=manifest.get('producer_run_id'), producer_attempt=manifest.get('producer_attempt'),
                      config_digest=manifest.get('config_sha256')))
              except (OSError, ValueError, EOFError, KeyError, TypeError):
                  missing.append('manifest_observation_unavailable')
          row = dict(schema_version='oasis7-engineering-job/v1', repository=E['GITHUB_REPOSITORY'],
              run_id=int(E['GITHUB_RUN_ID']), run_attempt=int(E['GITHUB_RUN_ATTEMPT']), job_key=job,
              workflow_sha=sha(E.get('TELEMETRY_WORKFLOW_SHA')), matrix=matrix, needs=needs,
              target_source_sha=sha(E.get('TELEMETRY_SOURCE_SHA')), target_tested_sha=sha(E.get('TELEMETRY_TESTED_SHA')),
              target_policy_sha=sha(E.get('TELEMETRY_POLICY_SHA')), checkout_sha=checkout,
              configuration_digests=configs, manifests=manifests, missing_reasons=sorted(set(missing)))
          print('OASIS7_' + 'ENGINEERING_JOB_V1=' + json.dumps(row, sort_keys=True, separators=(',', ':')))
          PY_OBSERVATION

  pr-governance-preview:
    needs: [select, pr-fast-preview-plan]
    if: >-
      always() && !cancelled() &&
      github.event_name == 'pull_request' && needs.select.result == 'success' &&
      needs.pr-fast-preview-plan.result == 'success' &&
      needs.pr-fast-preview-plan.outputs.enabled == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.select.outputs.tested_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Prepare governance comparison tools
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --requirement scripts/doc-governance-requirements.txt
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt --component clippy
          rustup default "$RUST_TOOLCHAIN"
          command -v zstd
          command -v zstdmt
      - name: Compare complete governance execution without gate authority
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          ACTUAL_SOURCE_SHA: ${{ needs.select.outputs.source_sha }}
          TESTED_SHA: ${{ needs.select.outputs.tested_sha }}
          RUSTUP_TOOLCHAIN: ${{ env.RUST_TOOLCHAIN }}
        run: |
          python3 scripts/ci-governance-preview.py --repo-root "$GITHUB_WORKSPACE" \
            --base-sha "$BASE_SHA" --source-sha "$ACTUAL_SOURCE_SHA" --tested-sha "$TESTED_SHA" \
            --output-dir "$RUNNER_TEMP/governance-preview"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: governance-preview-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/governance-preview/
          if-no-files-found: warn
          retention-days: 14

  pr-fast-preview-plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      enabled: ${{ steps.preview.outputs.enabled }}
      matrix: ${{ steps.preview.outputs.matrix }}
      source_sha: ${{ steps.preview.outputs.source_sha }}
      tested_sha: ${{ steps.preview.outputs.tested_sha }}
      artifact: pr-fast-preview-plan-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Plan diagnostic ordinary source benchmark
        id: preview
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
          TESTED_SHA: ${{ github.sha }}
        run: |
          python3 scripts/ci-fast-preview.py plan-matrix --base-ref "$BASE_SHA" --head-ref "$TESTED_SHA" \
            --source-ref "$SOURCE_SHA" \
            --output-dir "$RUNNER_TEMP/previews" --github-output "$GITHUB_OUTPUT"
      - name: Record diagnostic-only plan
        if: steps.preview.outputs.enabled == 'true'
        run: |
          printf '%s\n' '## Candidate fast-profile preview' \
            'Diagnostic only: candidate policy and a synthetic Rust-only diff; the trusted-BASE required gate remains independent.' \
            'Every selected real group runs in parallel without restoring caches. These diagnostics do not establish a ten-minute P95.' \
            'Each sample is measured from workflow creation to its last selected group completion; per-group artifacts report runner time only.' >> "$GITHUB_STEP_SUMMARY"
          for metadata in "$RUNNER_TEMP"/previews/*/selection.json.metadata.json; do
            cat "$metadata" >> "$GITHUB_STEP_SUMMARY"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.preview.outputs.enabled == 'true'
        with:
          name: pr-fast-preview-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/previews/
          retention-days: 14
          if-no-files-found: error

  pr-fast-preview:
    name: pr-fast-preview (${{ matrix.sample }}, ${{ matrix.group }}, ${{ matrix.partition }})
    needs: pr-fast-preview-plan
    if: needs.pr-fast-preview-plan.result == 'success' && needs.pr-fast-preview-plan.outputs.enabled == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.pr-fast-preview-plan.outputs.matrix) }}
    env:
      PREVIEW_SAMPLE: ${{ matrix.sample }}
      PREVIEW_GROUP: ${{ matrix.group }}
      PREVIEW_PARTITION: ${{ matrix.partition }}
    steps:
      - name: Start cold runner measurement
        run: echo "PREVIEW_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.pr-fast-preview-plan.outputs.tested_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.pr-fast-preview-plan.outputs.artifact }}
          path: ${{ runner.temp }}/previews
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Restore diagnostic synthetic baseline
        run: |
          python3 scripts/ci-fast-preview.py restore --sample "$PREVIEW_SAMPLE" \
            --metadata "$RUNNER_TEMP/previews/$PREVIEW_SAMPLE/selection.json.metadata.json" \
            --plan "$RUNNER_TEMP/previews/$PREVIEW_SAMPLE/selection.json" \
            --group "$PREVIEW_GROUP" --partition "$PREVIEW_PARTITION"
      - name: Install Markdown runtime
        if: matrix.group == 'baseline'
        run: python3 -m pip install --disable-pip-version-check --requirement scripts/doc-governance-requirements.txt
      - name: Install pinned Rust toolchains
        if: matrix.group != 'baseline'
        shell: bash
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt --component clippy
          rustup default "$RUST_TOOLCHAIN"
          rustup toolchain install "$OASIS7_WASM_TOOLCHAIN" --profile minimal --component rust-src
          rustup target add "$OASIS7_WASM_TARGET" --toolchain "$OASIS7_WASM_TOOLCHAIN"
          rustup target add wasm32-unknown-unknown
      - name: Stabilize Rust toolchains for ordinary execution
        if: matrix.group != 'baseline'
        run: python3 scripts/ci-rust-cache-toolchains.py "$RUST_TOOLCHAIN" "$OASIS7_WASM_TOOLCHAIN"
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        if: matrix.group == 'rust_baseline'
        with:
          tool: cargo-deny@0.19.9
      - name: Install native libraries
        if: matrix.group != 'baseline'
        shell: bash
        timeout-minutes: 11
        run: |
          sudo -n /usr/bin/python3 scripts/ci-apt-install.py --budget-seconds 600 -- pkg-config libwayland-dev wayland-protocols libxkbcommon-dev libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxinerama-dev libasound2-dev libudev-dev
      - name: Install WASM C compiler
        if: matrix.group == 'net'
        shell: bash
        timeout-minutes: 11
        run: |
          sudo -n /usr/bin/python3 scripts/ci-apt-install.py --budget-seconds 600 -- clang llvm
          clang --print-targets | grep -w wasm32
          llvm-ar --version
      - name: Execute actual preview group
        id: execute
        shell: bash
        env:
          PREVIEW_GROUP: ${{ matrix.group }}
          SOURCE_SHA: ${{ needs.pr-fast-preview-plan.outputs.source_sha }}
          OASIS7_PRODUCT_DOC_BASE: ${{ matrix.synthetic_base_sha }}
          OASIS7_PRODUCT_DOC_HEAD: ${{ needs.pr-fast-preview-plan.outputs.tested_sha }}
          OASIS7_CI_PROFILE: pr-fast
          CI_VERBOSE: "1"
        run: |
          set -euo pipefail
          selection="$RUNNER_TEMP/previews/$PREVIEW_SAMPLE/selection.json"
          export OASIS7_CI_ARCHITECTURE_PLAN="$(cat "$selection")"
          plan_args=()
          if [[ "$PREVIEW_GROUP" == rust_baseline || "$PREVIEW_GROUP" == oasis7_required || "$PREVIEW_GROUP" == distfs ]]; then
            plan_args=(--plan "$selection")
          fi
          if [[ "$PREVIEW_GROUP" == oasis7_required ]]; then
            plan_args+=(--ordinary-partition "$PREVIEW_PARTITION")
          fi
          bash scripts/ci-tests.sh required --group "$PREVIEW_GROUP" "${plan_args[@]}" \
            --repo-root "$GITHUB_WORKSPACE" 2>&1 | tee "$RUNNER_TEMP/pr-fast-preview.log"
      - name: Record preview group timing and outcome
        if: always()
        env:
          PREVIEW_GROUP: ${{ matrix.group }}
          PREVIEW_OUTCOME: ${{ steps.execute.outcome }}
          PREVIEW_TESTED_SHA: ${{ needs.pr-fast-preview-plan.outputs.tested_sha }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, time
          ended = int(time.time())
          report = {'diagnostic_only': True, 'cache_restored': False,
                    'sample': os.environ['PREVIEW_SAMPLE'],
                    'partition': os.environ['PREVIEW_PARTITION'],
                    'group': os.environ['PREVIEW_GROUP'], 'outcome': os.environ['PREVIEW_OUTCOME'],
                    'tested_sha': os.environ['PREVIEW_TESTED_SHA'],
                    'runner_started_at': int(os.environ['PREVIEW_STARTED_AT']), 'ended_at': ended}
          report['runner_seconds'] = ended - report['runner_started_at']
          pathlib.Path(os.environ['RUNNER_TEMP'], 'pr-fast-preview-timing.json').write_text(json.dumps(report, indent=2) + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as stream:
              stream.write('Diagnostic cold group: ' + json.dumps(report) + '\n')
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: pr-fast-preview-${{ matrix.sample }}-${{ matrix.group }}-${{ matrix.partition }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/pr-fast-preview.log
            ${{ runner.temp }}/pr-fast-preview-timing.json
          retention-days: 14
          if-no-files-found: error

  command-center:
    needs: select
    if: >-
      always() && !cancelled() && needs.select.result == 'success' &&
      (needs.select.outputs.run_command_center == 'true' ||
       fromJSON(needs.select.outputs.plan).scope == 'full')
    uses: ./.github/workflows/command-center.yml
    with:
      source_sha: ${{ needs.select.outputs.tested_sha }}
      package_app: ${{ needs.select.outputs.command_center_package == 'true' }}

  baseline:
    needs: select
    if: >-
      always() && !cancelled() && needs.select.result == 'success' &&
      (needs.select.outputs.run_baseline == 'true' ||
       fromJSON(needs.select.outputs.plan).scope == 'full')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.select.outputs.tested_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Install Markdown runtime
        run: python3 -m pip install --disable-pip-version-check --requirement scripts/doc-governance-requirements.txt
      - name: Resolve tested product-document range
        shell: bash
        env:
          CI_PROFILE: ${{ fromJSON(needs.select.outputs.plan).execution_profile }}
          TESTED_SHA: ${{ needs.select.outputs.tested_sha }}
        run: |
          if [[ "$CI_PROFILE" == periodic-full || "$CI_PROFILE" == candidate-full ]]; then
            printf 'OASIS7_PRODUCT_DOC_BASE=%s\nOASIS7_PRODUCT_DOC_HEAD=%s\n' \
              "$(git rev-parse 'HEAD^1')" "$TESTED_SHA" >>"$GITHUB_ENV"
          else
            test "$TESTED_SHA" = "$GITHUB_SHA"
            python3 scripts/resolve-product-doc-ci-range.py \
              --repo-root "$GITHUB_WORKSPACE" \
              --event-name "$GITHUB_EVENT_NAME" \
              --event-path "$GITHUB_EVENT_PATH" \
              --tested-oid "$GITHUB_SHA" >>"$GITHUB_ENV"
          fi
      - name: Execute selected group
        shell: bash
        env:
          CI_VERBOSE: "1"
          OASIS7_CI_PROFILE: ${{ fromJSON(needs.select.outputs.plan).execution_profile }}
        run: bash ./scripts/ci-tests.sh required --group "baseline" --repo-root "$GITHUB_WORKSPACE"

  rust-baseline:
    needs: select
    if: >-
      always() && !cancelled() && needs.select.result == 'success' &&
      (needs.select.outputs.run_rust_baseline == 'true' ||
       fromJSON(needs.select.outputs.plan).scope == 'full')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.select.outputs.tested_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.select.outputs.selection_artifact }}
          path: ${{ runner.temp }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Install pinned Rust toolchains
        shell: bash
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt --component clippy
          rustup default "$RUST_TOOLCHAIN"
          rustup toolchain install "$OASIS7_WASM_TOOLCHAIN" --profile minimal --component rust-src
          rustup target add "$OASIS7_WASM_TARGET" --toolchain "$OASIS7_WASM_TOOLCHAIN"
          rustup target add wasm32-unknown-unknown
      - name: Stabilize Rust cache toolchains
        shell: bash
        run: python3 scripts/ci-rust-cache-toolchains.py "$RUST_TOOLCHAIN" "$OASIS7_WASM_TOOLCHAIN"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: false
          shared-key: ci-shared-native-trusted-v4
          add-rust-environment-hash-key: true
          env-vars: CARGO CC CFLAGS CXX CMAKE RUST OASIS7_WASM
          cache-on-failure: false
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        with:
          tool: cargo-deny@0.19.9
      - name: Install native libraries
        shell: bash
        timeout-minutes: 11
        run: |
          sudo -n /usr/bin/python3 scripts/ci-apt-install.py --budget-seconds 600 -- pkg-config libwayland-dev wayland-protocols libxkbcommon-dev libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxinerama-dev libasound2-dev libudev-dev
      - name: Execute selected group
        shell: bash
        env:
          CI_VERBOSE: "1"
          OASIS7_CI_ARCHITECTURE_PLAN: ${{ needs.select.outputs.plan }}
          SOURCE_SHA: ${{ needs.select.outputs.source_sha }}
          OASIS7_PRODUCT_DOC_BASE: ${{ needs.select.outputs.range_base }}
          OASIS7_PRODUCT_DOC_HEAD: ${{ needs.select.outputs.tested_sha }}
        run: bash ./scripts/ci-tests.sh required --group "rust_baseline" --plan "$RUNNER_TEMP/selection.json" --repo-root "$GITHUB_WORKSPACE"

  cache-bootstrap-maintenance:
    cache-mode: none
    permissions:
      contents: read
      actions: write
    needs: select
    if: >-
      always() && !cancelled() && needs.select.result == 'success' &&
      (needs.select.outputs.run_oasis7_required == 'true' ||
       needs.select.outputs.run_formal_process == 'true' ||
       fromJSON(needs.select.outputs.plan).scope == 'explicit-full' ||
       fromJSON(needs.select.outputs.plan).scope == 'full') &&
      github.ref == 'refs/heads/main' && github.workflow_sha == github.sha &&
      needs.select.outputs.trusted_source == 'true' &&
      (fromJSON(needs.select.outputs.plan).execution_profile == 'periodic-full' ||
       fromJSON(needs.select.outputs.plan).execution_profile == 'candidate-full' ||
       !fromJSON(needs.select.outputs.plan).fast_plan_version) &&
      (github.event_name == 'push' || github.event_name == 'schedule' ||
       (github.event_name == 'workflow_dispatch' && inputs.run_mode == 'full'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: ci-cache-maintenance-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.select.outputs.tested_sha }}
          persist-credentials: false
      - name: Recover workspace and dependency cache rotation headroom
        env:
          CACHE_MAINTENANCE_TOKEN: ${{ github.token }}
        run: python3 scripts/ci-cache-maintenance.py --recover --apply
      - *engineering-job-observation

  oasis7-test-build-candidate:
    cache-mode: read
    permissions:
      contents: read
      actions: read
    needs: select
    if: >-
      always() && !cancelled() && needs.select.result == 'success' &&
      !(fromJSON(needs.select.outputs.plan).fast_execution_version == 1 &&
        fromJSON(needs.select.outputs.plan).ordinary_execution == 'inline') &&
      (needs.select.outputs.run_oasis7_required == 'true' ||
       fromJSON(needs.select.outputs.plan).scope == 'explicit-full' ||
       fromJSON(needs.select.outputs.plan).scope == 'full') &&
      !(github.ref == 'refs/heads/main' && github.workflow_sha == github.sha &&
      needs.select.outputs.trusted_source == 'true' &&
      (fromJSON(needs.select.outputs.plan).execution_profile == 'periodic-full' ||
       fromJSON(needs.select.outputs.plan).execution_profile == 'candidate-full' ||
       !fromJSON(needs.select.outputs.plan).fast_plan_version) &&
        (github.event_name == 'push' || github.event_name == 'schedule' ||
         (github.event_name == 'workflow_dispatch' && inputs.run_mode == 'full')))
    runs-on: ubuntu-24.04
    steps: &ordinary-build-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.select.outputs.tested_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.select.outputs.selection_artifact }}
          path: ${{ runner.temp }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Report ordinary workspace cache capacity
        env:
          CACHE_INVENTORY_TOKEN: ${{ github.token }}
        run: python3 scripts/ci-workspace-cache.py preflight --scope ordinary --report "$RUNNER_TEMP/ordinary-cache-preflight.json"
      - name: Install pinned Rust toolchains
        shell: bash
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt --component clippy
          rustup default "$RUST_TOOLCHAIN"
          rustup toolchain install "$OASIS7_WASM_TOOLCHAIN" --profile minimal --component rust-src
          rustup target add "$OASIS7_WASM_TARGET" --toolchain "$OASIS7_WASM_TOOLCHAIN"
          rustup target add wasm32-unknown-unknown
      - name: Stabilize Rust cache toolchains
        shell: bash
        run: python3 scripts/ci-rust-cache-toolchains.py "$RUST_TOOLCHAIN" "$OASIS7_WASM_TOOLCHAIN"
      - name: Reclaim unused candidate SDK capacity
        if: github.job == 'oasis7-test-build-candidate'
        env:
          OASIS7_CAPACITY_PURPOSE: ordinary-native-candidate-v1
        run: |
          sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT,RUNNER_OS,GITHUB_JOB,GITHUB_WORKFLOW_REF,GITHUB_WORKSPACE,RUNNER_TEMP,OASIS7_CAPACITY_PURPOSE python3 scripts/ci-candidate-capacity.py --apply --min-free-bytes 1073741824 --min-free-inodes 10000
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: false
          shared-key: ci-shared-native-trusted-v4
          add-rust-environment-hash-key: true
          env-vars: CARGO CC CFLAGS CXX CMAKE RUST OASIS7_WASM
          cache-on-failure: false
      - name: Identify ordinary workspace cache
        id: ordinary-cache-identity
        run: python3 scripts/ci-workspace-cache.py identity --scope ordinary
      - name: Restore compatible ordinary workspace cache
        id: ordinary-workspace-cache
        if: steps.ordinary-cache-identity.outputs.key != ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ordinary-workspace-cache/workspace-units.tar.zst
          key: ${{ steps.ordinary-cache-identity.outputs.key }}
          restore-keys: ${{ steps.ordinary-cache-identity.outputs.prefix }}
      - name: Validate and restore ordinary workspace units
        env:
          REQUESTED_KEY: ${{ steps.ordinary-cache-identity.outputs.key }}
          MATCHED_KEY: ${{ steps.ordinary-workspace-cache.outputs.cache-matched-key }}
          CACHE_HIT: ${{ steps.ordinary-workspace-cache.outputs.cache-hit }}
        run: |
          python3 scripts/ci-workspace-cache.py restore --scope ordinary --cache "$RUNNER_TEMP/ordinary-workspace-cache" \
            --requested-key "$REQUESTED_KEY" --matched-key "$MATCHED_KEY" --cache-hit "$CACHE_HIT" \
            --report "$RUNNER_TEMP/ordinary-cache-restore.json"
      - name: Install native libraries
        shell: bash
        timeout-minutes: 11
        run: |
          sudo -n /usr/bin/python3 scripts/ci-apt-install.py --budget-seconds 600 -- pkg-config libwayland-dev wayland-protocols libxkbcommon-dev libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxinerama-dev libasound2-dev libudev-dev
      - name: Build ordinary test artifacts
        env:
          SOURCE_SHA: ${{ needs.select.outputs.source_sha }}
        run: |
          python3 scripts/ci-test-artifacts.py build --scope ordinary --plan "$RUNNER_TEMP/selection.json" --bundle "$RUNNER_TEMP/native-tests" --cache-state "$RUNNER_TEMP/ordinary-cache-state.json"
          python3 scripts/ci-test-artifacts.py pack --plan "$RUNNER_TEMP/selection.json" --bundle "$RUNNER_TEMP/native-tests" --suite ordinary --output "$RUNNER_TEMP/native-tests.tar.gz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-tests-${{ github.sha }}
          path: ${{ runner.temp }}/native-tests.tar.gz
          compression-level: 0
          overwrite: true
          if-no-files-found: error
          retention-days: 2
      - name: Measure ordinary workspace cache footprint
        run: |
          python3 scripts/ci-workspace-cache.py measure --scope ordinary --cache "$RUNNER_TEMP/ordinary-workspace-cache" \
