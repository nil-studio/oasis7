          if not isinstance(plan, dict):
              raise ValueError('invalid required selection')
          fields = {'distfs_clippy_contract_version', 'distfs_clippy_group'}
          print('true' if fields.intersection(plan) else 'false')
          PY
          )
          if [[ "$handoff" == true ]]; then
            plan_args=(--plan "$selection")
