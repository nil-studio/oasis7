  custody-node:
    name: custody-node (${{ matrix.shard }})
    needs: [select, custody-native, custody-wasm-production, custody-wasm-approval]
    if: >-
      always() && !cancelled() && needs.select.result == 'success' &&
      needs.custody-native.result == 'success' &&
      needs.custody-wasm-production.result == 'success' &&
      needs.custody-wasm-approval.result == 'success' &&
      fromJSON(needs.select.outputs.plan).custody_execution_version == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: ${{ fromJSON(needs.select.outputs.plan).custody_node_shards || fromJSON('[0,1,2,3]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.select.outputs.tested_sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Install native libraries
        shell: bash
        timeout-minutes: 11
        run: |
          sudo -n /usr/bin/python3 scripts/ci-apt-install.py --budget-seconds 600 -- pkg-config libwayland-dev wayland-protocols libxkbcommon-dev libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxinerama-dev libasound2-dev libudev-dev
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.select.outputs.selection_artifact }}
          path: ${{ runner.temp }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.custody-native.outputs.artifact }}
          path: ${{ runner.temp }}/custody-inputs/native
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.custody-wasm-production.outputs.artifact }}
          path: ${{ runner.temp }}/custody-inputs/wasm-production
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.custody-wasm-approval.outputs.artifact }}
          path: ${{ runner.temp }}/custody-inputs/wasm-approval
      - name: Verify and restore the exact successful producer outputs
        env:
          PRODUCER_ATTEMPTS: '{"native":${{ needs.custody-native.outputs.attempt }},"wasm-production":${{ needs.custody-wasm-production.outputs.attempt }},"wasm-approval":${{ needs.custody-wasm-approval.outputs.attempt }}}'
        run: python3 scripts/ci-custody-platform.py restore --plan "$RUNNER_TEMP/selection.json" --bundles "$RUNNER_TEMP/custody-inputs" --producer-attempts "$PRODUCER_ATTEMPTS"
      - name: Install platform test dependencies
        run: npm ci --prefix crates/oasis7_custody_worker --ignore-scripts
      - name: Verify the TypeScript consumer once
        if: matrix.shard == 0
        run: npm run test:types --prefix crates/oasis7_custody_worker
      - name: Execute complete Node files without local contention
        env:
          CUSTODY_SHARD: ${{ matrix.shard }}
        run: python3 scripts/ci-custody-platform.py run --plan "$RUNNER_TEMP/selection.json" --shard "$CUSTODY_SHARD" --results "output/custody-$CUSTODY_SHARD"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: custody-node-${{ github.run_id }}-${{ matrix.shard }}
