        env:
          CACHE_INVENTORY_TOKEN: ${{ github.token }}
          CACHE_KEY: ${{ steps.ordinary-cache-identity.outputs.key }}
        run: python3 scripts/ci-workspace-cache.py observe-save --scope ordinary --key "$CACHE_KEY" --report "$RUNNER_TEMP/ordinary-cache-save.json"
