  explicit-full-gate:
    name: explicit-full-gate
    if: >-
      always() && needs.select.result != 'skipped' &&
      (github.event_name == 'schedule' ||
       (github.event_name == 'workflow_dispatch' && inputs.run_mode == 'full'))
    runs-on: ubuntu-24.04
    needs: [select, command-center, baseline, rust-baseline, oasis7-required, formal-process, consensus, distfs, node, net, viewer-js-required, viewer-performance-report, pixel-world-bridge, launcher-web, workspace-support, scenario-regression, operational-contracts, packaging-contracts, workflow-governance, codex-agent-config-validation, compile-metrics, site-quality, doc-checker-contracts, cargo-tooling-contracts, windows-rollout, macos-package-contract, fleet-health, oasis7-test-build, full-regression, candidate-full-regression]
    steps:
      - name: Require successful full planning
        env:
          SELECT_RESULT: ${{ needs.select.result }}
        run: test "$SELECT_RESULT" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.select.outputs.policy_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.select.outputs.authority_artifact }}
          path: ${{ runner.temp }}/ci-authority
      - name: Require complete full inventory and exact source
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          SOURCE_SHA: ${{ needs.select.outputs.source_sha }}
          RUN_MODE: ${{ inputs.run_mode }}
          PLAN: ${{ needs.select.outputs.plan }}
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 "$RUNNER_TEMP/ci-authority/ci-required-result.py" --full \
            --plan "$PLAN" --needs "$NEEDS" --event-name "$EVENT_NAME" --ref "$REF" \
            --workflow-sha "$WORKFLOW_SHA" --source-sha "$SOURCE_SHA" --run-mode "$RUN_MODE"
          python3 "$RUNNER_TEMP/ci-authority/ci-full-result.py" produce \
            --plan "$PLAN" --needs "$NEEDS" --output "$RUNNER_TEMP/full-result.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-full-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/full-result.json
          if-no-files-found: error
          retention-days: 30

