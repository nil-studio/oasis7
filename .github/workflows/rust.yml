name: Rust

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      run_mode:
        description: "Manual product verification or package build"
        required: true
        default: full
        type: choice
        options: [full, newapi_bridge_package]
      newapi_bridge_build_profile:
        description: "Cargo package profile"
        required: true
        default: release
        type: choice
        options: [release, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  RUST_TOOLCHAIN: 1.96.0
  TRUNK_VERSION: 0.21.14
  OASIS7_WASM_TOOLCHAIN: nightly-2025-12-11
  OASIS7_WASM_TARGET: wasm32-unknown-unknown
  OASIS7_WASM_BUILD_STD: "1"
  OASIS7_WASM_BUILD_STD_COMPONENTS: std,panic_abort

cache-mode: read

jobs:
  select:
    if: github.event_name != 'workflow_dispatch' || inputs.run_mode == 'full'
    runs-on: ubuntu-24.04
    outputs:
      plan: ${{ steps.select.outputs.plan }}
      run_baseline: ${{ steps.select.outputs.run_baseline }}
      run_command_center: ${{ steps.select.outputs.run_command_center }}
      run_rust_baseline: ${{ steps.select.outputs.run_rust_baseline }}
      run_formal_process: ${{ steps.formal-select.outputs.run_formal_process }}
      run_oasis7_required: ${{ steps.select.outputs.run_oasis7_required }}
      run_consensus: ${{ steps.select.outputs.run_consensus }}
      run_distfs: ${{ steps.select.outputs.run_distfs }}
      run_node: ${{ steps.select.outputs.run_node }}
      run_net: ${{ steps.select.outputs.run_net }}
      run_viewer_js_required: ${{ steps.select.outputs.run_viewer_js_required }}
      run_viewer_performance_report: ${{ steps.select.outputs.run_viewer_performance_report }}
      run_pixel_world_bridge: ${{ steps.select.outputs.run_pixel_world_bridge }}
      run_launcher_web: ${{ steps.select.outputs.run_launcher_web }}
      run_workspace_support: ${{ steps.select.outputs.run_workspace_support }}
      run_scenario_regression: ${{ steps.select.outputs.run_scenario_regression }}
      run_operational_contracts: ${{ steps.select.outputs.run_operational_contracts }}
      run_packaging_contracts: ${{ steps.select.outputs.run_packaging_contracts }}
      run_workflow_governance: ${{ steps.select.outputs.run_workflow_governance }}
      run_codex_agent_config_validation: ${{ steps.select.outputs.run_codex_agent_config_validation }}
      run_compile_metrics: ${{ steps.select.outputs.run_compile_metrics }}
      run_site_quality: ${{ steps.select.outputs.run_site_quality }}
      run_doc_checker_contracts: ${{ steps.select.outputs.run_doc_checker_contracts }}
      run_cargo_tooling_contracts: ${{ steps.select.outputs.run_cargo_tooling_contracts }}
      run_windows_rollout: ${{ steps.select.outputs.run_windows_rollout }}
      run_macos_package_contract: ${{ steps.select.outputs.run_macos_package_contract }}
      run_fleet_health: ${{ steps.select.outputs.run_fleet_health }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - id: select
        name: Select using trusted baseline Git data
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == schedule || "$EVENT_NAME" == workflow_dispatch ]]; then
            printf 'plan={"scope":"explicit-full","groups":[]}\n' >>"$GITHUB_OUTPUT"
            exit 0
          fi
          git cat-file -e "${BASE_SHA}^{commit}"
          git cat-file -e "${SOURCE_SHA}^{commit}"
          tested_sha="$(git rev-parse HEAD)"
          authority="$RUNNER_TEMP/ci-authority"
          mkdir -p "$authority"
          for file in plan-rust-required-scope.py ci-required-scope.json ci-required-result.py; do
            git show "${BASE_SHA}:scripts/${file}" >"${authority}/${file}"
          done
          python3 "$authority/plan-rust-required-scope.py" --base-ref "$BASE_SHA" --head-ref "$SOURCE_SHA" --test-ref "$tested_sha" --github-output "$GITHUB_OUTPUT" --output "$RUNNER_TEMP/selection.json"
          printf 'Base: %s\nSource HEAD: %s\nTested merge: %s\n' "$BASE_SHA" "$SOURCE_SHA" "$tested_sha" >>"$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/selection.json" >>"$GITHUB_STEP_SUMMARY"
      - id: formal-select
        name: Resolve formal selection with conservative old-baseline fallback
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == schedule || "$EVENT_NAME" == workflow_dispatch ]]; then
            echo 'run_formal_process=true' >>"$GITHUB_OUTPUT"
          else
            python3 scripts/ci-formal-plan.py --plan "$RUNNER_TEMP/selection.json" --config "$RUNNER_TEMP/ci-authority/ci-required-scope.json" --github-output "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        with:
          name: ci-authority
          path: ${{ runner.temp }}/ci-authority
          if-no-files-found: error
          retention-days: 1

  command-center:
    needs: select
    if: >-
      needs.select.result == 'success' &&
      (needs.select.outputs.run_command_center == 'true' ||
       fromJSON(needs.select.outputs.plan).scope == 'full')
    uses: ./.github/workflows/command-center.yml

  baseline:
    needs: select
    if: >-
      needs.select.result == 'success' &&
      (needs.select.outputs.run_baseline == 'true' ||
       fromJSON(needs.select.outputs.plan).scope == 'full')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Install Markdown runtime
        run: python3 -m pip install --disable-pip-version-check --requirement scripts/doc-governance-requirements.txt
      - name: Resolve tested product-document range
        shell: bash
        run: |
          python3 scripts/resolve-product-doc-ci-range.py \
            --repo-root "$GITHUB_WORKSPACE" \
            --event-name "$GITHUB_EVENT_NAME" \
            --event-path "$GITHUB_EVENT_PATH" \
            --tested-oid "$GITHUB_SHA" >>"$GITHUB_ENV"
      - name: Execute selected group
        shell: bash
        env:
          CI_VERBOSE: "1"
        run: bash ./scripts/ci-tests.sh required --group "baseline" --repo-root "$GITHUB_WORKSPACE"

  rust-baseline:
    needs: select
    if: >-
      needs.select.result == 'success' &&
      (needs.select.outputs.run_rust_baseline == 'true' ||
       fromJSON(needs.select.outputs.plan).scope == 'full')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Install pinned Rust toolchains
        shell: bash
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt --component clippy
          rustup default "$RUST_TOOLCHAIN"
          rustup toolchain install "$OASIS7_WASM_TOOLCHAIN" --profile minimal --component rust-src
          rustup target add "$OASIS7_WASM_TARGET" --toolchain "$OASIS7_WASM_TOOLCHAIN"
          rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: false
          shared-key: ci-full-regression-trusted-v2
          add-rust-environment-hash-key: true
          env-vars: CARGO CC CFLAGS CXX CMAKE RUST OASIS7_WASM
          cache-on-failure: true
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2
        with:
          tool: cargo-deny@0.19.9
      - name: Install native libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libwayland-dev wayland-protocols libxkbcommon-dev libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxinerama-dev libasound2-dev libudev-dev
      - name: Execute selected group
        shell: bash
        env:
          CI_VERBOSE: "1"
          OASIS7_PRODUCT_DOC_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          OASIS7_PRODUCT_DOC_HEAD: ${{ github.sha }}
        run: bash ./scripts/ci-tests.sh required --group "rust_baseline" --repo-root "$GITHUB_WORKSPACE"

  oasis7-test-build:
    needs: select
    if: >-
      needs.select.result == 'success' &&
      (needs.select.outputs.run_oasis7_required == 'true' ||
       fromJSON(needs.select.outputs.plan).scope == 'explicit-full' ||
       fromJSON(needs.select.outputs.plan).scope == 'full')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Install pinned Rust toolchains
        shell: bash
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt --component clippy
          rustup default "$RUST_TOOLCHAIN"
          rustup toolchain install "$OASIS7_WASM_TOOLCHAIN" --profile minimal --component rust-src
          rustup target add "$OASIS7_WASM_TARGET" --toolchain "$OASIS7_WASM_TOOLCHAIN"
          rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: false
          shared-key: ci-full-regression-trusted-v2
          add-rust-environment-hash-key: true
          env-vars: CARGO CC CFLAGS CXX CMAKE RUST OASIS7_WASM
          cache-on-failure: true
      - name: Install native libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libwayland-dev wayland-protocols libxkbcommon-dev libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxinerama-dev libasound2-dev libudev-dev
      - name: Build ordinary test artifacts
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 scripts/ci-test-artifacts.py build --scope ordinary --bundle "$RUNNER_TEMP/native-tests"
          python3 scripts/ci-test-artifacts.py pack --bundle "$RUNNER_TEMP/native-tests" --suite ordinary --output "$RUNNER_TEMP/native-tests.tar.gz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-tests-${{ github.sha }}
          path: ${{ runner.temp }}/native-tests.tar.gz
          compression-level: 0
          overwrite: true
          if-no-files-found: error
          retention-days: 2

  formal-test-build:
    cache-mode: read
    needs: select
    if: >-
      needs.select.result == 'success' && needs.select.outputs.run_formal_process == 'true' &&
      !(github.ref == 'refs/heads/main' &&
        (github.event_name == 'push' || github.event_name == 'schedule' ||
         (github.event_name == 'workflow_dispatch' && inputs.run_mode == 'full')))
    runs-on: ubuntu-24.04
    steps: &formal-build-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Install pinned Rust toolchains
        shell: bash
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt --component clippy
          rustup default "$RUST_TOOLCHAIN"
          rustup toolchain install "$OASIS7_WASM_TOOLCHAIN" --profile minimal --component rust-src
          rustup target add "$OASIS7_WASM_TARGET" --toolchain "$OASIS7_WASM_TOOLCHAIN"
          rustup target add wasm32-unknown-unknown
      - name: Restore compatible formal workspace cache
        id: formal-workspace-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: formal-workspace-v1-ubuntu24-${{ runner.arch }}-${{ env.RUST_TOOLCHAIN }}-${{ env.OASIS7_WASM_TOOLCHAIN }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml', 'rust-toolchain.toml', '.cargo/config.toml', '.github/workflows/rust.yml', 'scripts/ci-test-artifacts.py', 'scripts/ci-formal-process-suites.json') }}-${{ github.sha }}
          restore-keys: |
            formal-workspace-v1-ubuntu24-${{ runner.arch }}-${{ env.RUST_TOOLCHAIN }}-${{ env.OASIS7_WASM_TOOLCHAIN }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml', 'rust-toolchain.toml', '.cargo/config.toml', '.github/workflows/rust.yml', 'scripts/ci-test-artifacts.py', 'scripts/ci-formal-process-suites.json') }}-
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        if: steps.formal-workspace-cache.outputs.cache-matched-key == ''
        with:
          save-if: false
          shared-key: ci-full-regression-trusted-v2
          add-rust-environment-hash-key: true
          env-vars: CARGO CC CFLAGS CXX CMAKE RUST OASIS7_WASM
          cache-on-failure: true
      - name: Install native libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libwayland-dev wayland-protocols libxkbcommon-dev libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxinerama-dev libasound2-dev libudev-dev
      - name: Build only formal process dependencies
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 scripts/ci-test-artifacts.py build --scope formal --bundle "$RUNNER_TEMP/formal-tests"
          python3 scripts/ci-test-artifacts.py pack --bundle "$RUNNER_TEMP/formal-tests" --split-formal --output "$RUNNER_TEMP/formal-archives"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: formal-tests-runtime-protocol-${{ github.sha }}
          path: ${{ runner.temp }}/formal-archives/runtime-protocol.tar.gz
          compression-level: 0
          overwrite: true
          if-no-files-found: error
          retention-days: 2
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: formal-tests-world-history-${{ github.sha }}
          path: ${{ runner.temp }}/formal-archives/world-history.tar.gz
          compression-level: 0
          overwrite: true
          if-no-files-found: error
          retention-days: 2
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: formal-tests-healthy-set-${{ github.sha }}
          path: ${{ runner.temp }}/formal-archives/healthy-set.tar.gz
          compression-level: 0
          overwrite: true
          if-no-files-found: error
          retention-days: 2
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: formal-tests-storage-recovery-${{ github.sha }}
          path: ${{ runner.temp }}/formal-archives/storage-recovery.tar.gz
          compression-level: 0
          overwrite: true
          if-no-files-found: error
          retention-days: 2
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: formal-tests-lifecycle-cli-${{ github.sha }}
          path: ${{ runner.temp }}/formal-archives/lifecycle-cli.tar.gz
          compression-level: 0
          overwrite: true
          if-no-files-found: error
          retention-days: 2
      - name: Check disposable workspace cache budget
        id: cache-budget
        run: python3 scripts/ci-test-artifacts.py cache-budget --max-bytes 8589934592 --github-output "$GITHUB_OUTPUT"
      - name: Save bounded trusted formal workspace cache
        if: >-
          success() && github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'schedule' ||
           (github.event_name == 'workflow_dispatch' && inputs.run_mode == 'full')) &&
          steps.cache-budget.outputs.save == 'true' &&
          steps.formal-workspace-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: ${{ steps.formal-workspace-cache.outputs.cache-primary-key }}

  formal-test-build-trusted:
    cache-mode: write
    needs: select
    if: >-
      needs.select.result == 'success' && needs.select.outputs.run_formal_process == 'true' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'schedule' ||
       (github.event_name == 'workflow_dispatch' && inputs.run_mode == 'full'))
    runs-on: ubuntu-24.04
    steps: *formal-build-steps

  oasis7-required:
    needs: [select, oasis7-test-build]
    if: >-
      needs.select.result == 'success' &&
      (needs.select.outputs.run_oasis7_required == 'true' ||
       fromJSON(needs.select.outputs.plan).scope == 'full')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Install pinned Rust toolchains
        shell: bash
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt --component clippy
          rustup default "$RUST_TOOLCHAIN"
          rustup toolchain install "$OASIS7_WASM_TOOLCHAIN" --profile minimal --component rust-src
          rustup target add "$OASIS7_WASM_TARGET" --toolchain "$OASIS7_WASM_TOOLCHAIN"
          rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: false
          shared-key: ci-full-regression-trusted-v2
          add-rust-environment-hash-key: true
          env-vars: CARGO CC CFLAGS CXX CMAKE RUST OASIS7_WASM
          cache-on-failure: true
      - name: Install native libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libwayland-dev wayland-protocols libxkbcommon-dev libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxinerama-dev libasound2-dev libudev-dev
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-tests-${{ github.sha }}
          path: ${{ runner.temp }}
      - name: Unpack native executables preserving modes
        run: |
          mkdir -p "$RUNNER_TEMP/native-tests"
          tar -C "$RUNNER_TEMP/native-tests" -xzf "$RUNNER_TEMP/native-tests.tar.gz"
      - name: Execute selected group
        shell: bash
        env:
          OASIS7_CI_TEST_BUNDLE: ${{ runner.temp }}/native-tests
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CI_VERBOSE: "1"
          OASIS7_PRODUCT_DOC_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          OASIS7_PRODUCT_DOC_HEAD: ${{ github.sha }}
        run: bash ./scripts/ci-tests.sh required --group "oasis7_required" --repo-root "$GITHUB_WORKSPACE"

  formal-process-tests:
    needs: [select, formal-test-build, formal-test-build-trusted]
    if: >-
      always() && needs.select.result == 'success' && needs.select.outputs.run_formal_process == 'true' &&
      ((needs.formal-test-build.result == 'success' && needs.formal-test-build-trusted.result == 'skipped') ||
       (needs.formal-test-build.result == 'skipped' && needs.formal-test-build-trusted.result == 'success'))
    timeout-minutes: ${{ matrix.shard == 'world-history' && 45 || 90 }}
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        shard: [runtime-protocol, world-history, healthy-set, storage-recovery, lifecycle-cli]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Install native libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libwayland-dev wayland-protocols libxkbcommon-dev libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxinerama-dev libasound2-dev libudev-dev
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: formal-tests-${{ matrix.shard }}-${{ github.sha }}
          path: ${{ runner.temp }}
      - name: Unpack native executables preserving modes
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          mkdir -p "$RUNNER_TEMP/native-tests"
          tar -C "$RUNNER_TEMP/native-tests" -xzf "$RUNNER_TEMP/$SHARD.tar.gz"
      - name: Run exact formal process suite without Cargo
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          SHARD: ${{ matrix.shard }}
        run: python3 scripts/ci-test-artifacts.py run --bundle "$RUNNER_TEMP/native-tests" --shard "$SHARD" --results output/formal-process/results.jsonl
      - name: Upload safe process diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: formal-process-${{ matrix.shard }}-${{ github.run_attempt }}
          path: output/formal-process/results.jsonl
          if-no-files-found: warn
          retention-days: 7

  formal-process:
    needs: [select, formal-test-build, formal-test-build-trusted, formal-process-tests]
    if: always() && (github.event_name != 'workflow_dispatch' || inputs.run_mode == 'full')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate all formal process results
        env:
