      - name: Require exactly one successful ordinary producer
        env:
          CANDIDATE_RESULT: ${{ needs.oasis7-test-build-candidate.result }}
          TRUSTED_RESULT: ${{ needs.oasis7-test-build-trusted.result }}
        run: |
          case "$CANDIDATE_RESULT:$TRUSTED_RESULT" in
            success:skipped|skipped:success) ;;
            *) echo "::error::ordinary producer results: $CANDIDATE_RESULT / $TRUSTED_RESULT"; exit 1 ;;
