        run: |
          sudo -n /usr/bin/python3 scripts/ci-apt-install.py --budget-seconds 600 -- pkg-config libwayland-dev wayland-protocols libxkbcommon-dev libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxinerama-dev libasound2-dev libudev-dev
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: formal-tests-${{ matrix.shard }}-${{ github.sha }}
          path: ${{ runner.temp }}
      - name: Unpack native executables preserving modes
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          mkdir -p "$RUNNER_TEMP/native-tests"
          tar -C "$RUNNER_TEMP/native-tests" -xzf "$RUNNER_TEMP/$SHARD.tar.gz"
      - name: Run exact formal process suite without Cargo
        env:
          SOURCE_SHA: ${{ needs.select.outputs.source_sha }}
          SHARD: ${{ matrix.shard }}
        run: python3 scripts/ci-test-artifacts.py run --plan "$RUNNER_TEMP/selection.json" --formal-config "$RUNNER_TEMP/ci-authority/ci-formal-process-suites.json" --bundle "$RUNNER_TEMP/native-tests" --shard "$SHARD" --results output/formal-process/results.jsonl
