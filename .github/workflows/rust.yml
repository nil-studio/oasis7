            --state "$RUNNER_TEMP/ordinary-cache-state.json" --report "$RUNNER_TEMP/ordinary-cache-stage.json"
      - name: Save bounded trusted ordinary workspace cache
        id: ordinary-cache-save
        if: github.job == 'oasis7-test-build-trusted' && steps.ordinary-cache-stage.outputs.save == 'true'
