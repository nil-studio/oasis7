        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt --component clippy
          rustup default "$RUST_TOOLCHAIN"

      - name: Verify private context filesystem and caller on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          env -u RUSTC_WRAPPER cargo test --locked -p oasis7_context -p oasis7_secure_envelope --all-targets
          env -u RUSTC_WRAPPER cargo test --locked -p oasis7_local_signer --test context_cli

      - name: Ensure Linux process inspection dependency
        if: runner.os == 'Linux'
        shell: bash
        run: command -v lsof || (sudo apt-get update && sudo apt-get install -y lsof)
      - name: Verify cleanup on native host
        if: runner.os != 'Windows'
        shell: bash
        run: python3 ./scripts/resource-cleanup-executor.test.py --host-smoke

  required-gate:
    name: required-gate
    if: always() && (github.event_name == 'pull_request' || github.event_name == 'push')
    runs-on: ubuntu-24.04
    needs: [select, command-center, baseline, rust-baseline, oasis7-required, formal-process, consensus, distfs, node, net, viewer-js-required, viewer-performance-report, pixel-world-bridge, launcher-web, workspace-support, scenario-regression, operational-contracts, packaging-contracts, workflow-governance, codex-agent-config-validation, compile-metrics, site-quality, doc-checker-contracts, cargo-tooling-contracts, windows-rollout, macos-package-contract, fleet-health]
    steps:
      - name: Require successful scope planning
        env:
          SELECT_RESULT: ${{ needs.select.result }}
        shell: bash
        run: |
          if [[ "$SELECT_RESULT" != success ]]; then
            echo "::error::CI scope planning did not succeed ($SELECT_RESULT); see select diagnostics for unregistered paths or input errors."
            exit 1
          fi
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ci-authority
          path: ${{ runner.temp }}/ci-authority
      - name: Validate all expected results
        env:
          PLAN: ${{ needs.select.outputs.plan }}
          NEEDS: ${{ toJSON(needs) }}
        run: python3 "$RUNNER_TEMP/ci-authority/ci-required-result.py" --plan "$PLAN" --needs "$NEEDS"

  full-regression:
    cache-mode: write
    needs: oasis7-test-build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.run_mode == 'full'))
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve product-document gate range
        shell: bash
        run: |
          set -euo pipefail
          base_oid="$(git rev-parse --verify 'HEAD^1')"
          head_oid="$(git rev-parse --verify 'HEAD^{commit}')"
          printf 'OASIS7_PRODUCT_DOC_BASE=%s\n' "$base_oid" >>"$GITHUB_ENV"
          printf 'OASIS7_PRODUCT_DOC_HEAD=%s\n' "$head_oid" >>"$GITHUB_ENV"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: crates/oasis7_viewer/package-lock.json
      - name: Install viewer web dependencies
        run: npm ci --prefix crates/oasis7_viewer
      - name: Install pinned Rust toolchains
        run: |
          rustup toolchain install "${RUST_TOOLCHAIN}" --profile minimal --component rustfmt --component clippy
          rustup default "${RUST_TOOLCHAIN}"
          rustup toolchain install "${OASIS7_WASM_TOOLCHAIN}" --profile minimal --component rust-src
          rustup target add "${OASIS7_WASM_TARGET}" --toolchain "${OASIS7_WASM_TOOLCHAIN}"
          rustup target add wasm32-unknown-unknown
      - name: Install cargo-deny
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2
        with:
          tool: cargo-deny@0.19.9
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            llvm \
            pkg-config \
            libwayland-dev \
            wayland-protocols \
            libxkbcommon-dev \
            libx11-dev \
            libxi-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxinerama-dev \
            libasound2-dev \
            libudev-dev
          clang --print-targets | grep -w wasm32
          llvm-ar --version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: ci-full-regression-trusted-v2
          add-rust-environment-hash-key: true
          env-vars: CARGO CC CFLAGS CXX CMAKE RUST OASIS7_WASM
          cache-on-failure: true
      - name: Resolve wasm-bindgen tool cache metadata
        id: bindgen-meta
        shell: bash
        run: |
          source scripts/wasm-bindgen-cli-common.sh
          printf 'version=%s\nroot=%s\n' "$WASM_BINDGEN_LOCK_VERSION" "$WASM_BINDGEN_CACHE_ROOT" >> "$GITHUB_OUTPUT"
      - name: Restore exact wasm-bindgen tool cache
        id: bindgen-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.bindgen-meta.outputs.root }}
          key: wasm-bindgen-cli-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.RUST_TOOLCHAIN }}-${{ steps.bindgen-meta.outputs.version }}-${{ hashFiles('scripts/ensure-wasm-bindgen-cli.sh', 'scripts/wasm-bindgen-cli-common.sh') }}
      - name: Prepare exact wasm-bindgen tool directory
        id: prepare-bindgen
        shell: bash
        env:
          BINDGEN_CACHE_HIT: ${{ steps.bindgen-cache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          source scripts/wasm-bindgen-cli-common.sh
          if [[ "$BINDGEN_CACHE_HIT" == true ]]; then
            bindgen_bin="$WASM_BINDGEN_CACHE_ROOT/bin/wasm-bindgen"
            test -x "$bindgen_bin"
            test "$("$bindgen_bin" --version)" = "wasm-bindgen $WASM_BINDGEN_LOCK_VERSION"
          else
            bindgen_bin="$(bash scripts/ensure-wasm-bindgen-cli.sh --ensure-cache --print-bin)"
          fi
          test -x "$bindgen_bin"
          test "$("$bindgen_bin" --version)" = "wasm-bindgen $WASM_BINDGEN_LOCK_VERSION"
          printf 'WASM_BINDGEN_BIN=%s\n' "$bindgen_bin" >> "$GITHUB_ENV"
      - name: Save prepared wasm-bindgen tool cache
        if: >-
          ${{
            success() &&
            github.ref == 'refs/heads/main' &&
            steps.bindgen-cache.outputs.cache-hit != 'true' &&
            steps.prepare-bindgen.outcome == 'success'
          }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.bindgen-meta.outputs.root }}
          key: wasm-bindgen-cli-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.RUST_TOOLCHAIN }}-${{ steps.bindgen-meta.outputs.version }}-${{ hashFiles('scripts/ensure-wasm-bindgen-cli.sh', 'scripts/wasm-bindgen-cli-common.sh') }}
      - name: Cache pinned Trunk release archive
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ci-tools/trunk-x86_64-unknown-linux-gnu.tar.gz
          key: trunk-archive-${{ runner.os }}-${{ runner.arch }}-${{ env.TRUNK_VERSION }}-${{ hashFiles('scripts/install-ci-trunk.sh') }}
      - name: Install verified pinned Trunk
        shell: bash
        run: bash scripts/install-ci-trunk.sh "$RUNNER_TEMP/ci-tools/trunk-x86_64-unknown-linux-gnu.tar.gz" "$RUNNER_TEMP/ci-tools/bin"
      - name: Install product-document Markdown parser
        run: python3 -m pip install --disable-pip-version-check --requirement scripts/doc-governance-requirements.txt
      - name: Prepare trusted cache sentinel
        if: github.ref == 'refs/heads/main'
        run: |
          test "$GITHUB_REF" = refs/heads/main
          mkdir -p "$RUNNER_TEMP/cache-permission-sentinel"
          printf 'trusted-v2\n' > "$RUNNER_TEMP/cache-permission-sentinel/sentinel"
      - name: Save trusted cache sentinel
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/cache-permission-sentinel
          key: oasis7-cache-permission-sentinel-trusted-v2
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-tests-${{ github.sha }}
          path: ${{ runner.temp }}
      - name: Unpack native executables preserving modes
        run: |
          mkdir -p "$RUNNER_TEMP/native-tests"
          tar -C "$RUNNER_TEMP/native-tests" -xzf "$RUNNER_TEMP/native-tests.tar.gz"
      - name: Run full test tier
        env:
          OASIS7_CI_TEST_BUNDLE: ${{ runner.temp }}/native-tests
          SOURCE_SHA: ${{ github.sha }}
        run: CI_VERBOSE=1 ./scripts/ci-tests.sh full-standard

      - name: Run Rust governance report
        if: always()
        run: ./scripts/ci-rust-governance-report.sh --out-dir output/rust-governance

      - name: Append Rust governance summary
        if: always()
        run: cat output/rust-governance/summary.md >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload Rust governance report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-governance-report
          path: output/rust-governance
          if-no-files-found: error

  candidate-full-regression:
    cache-mode: read
    needs: oasis7-test-build
    if: github.ref != 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.run_mode == 'full'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Record exact candidate identity
        shell: bash
        run: |
          set -euo pipefail
          tested_oid="$(git rev-parse --verify 'HEAD^{commit}')"
          test "$tested_oid" = "$GITHUB_SHA"
          printf 'Event: %s\nRef: %s\nSource HEAD / tested commit: %s\nTested tree: %s\n' "$GITHUB_EVENT_NAME" "$GITHUB_REF" "$tested_oid" "$(git rev-parse 'HEAD^{tree}')" >>"$GITHUB_STEP_SUMMARY"
      - name: Resolve product-document gate range
        shell: bash
        run: |
          set -euo pipefail
          base_oid="$(git rev-parse --verify 'HEAD^1')"
          head_oid="$(git rev-parse --verify 'HEAD^{commit}')"
          printf 'OASIS7_PRODUCT_DOC_BASE=%s\n' "$base_oid" >>"$GITHUB_ENV"
          printf 'OASIS7_PRODUCT_DOC_HEAD=%s\n' "$head_oid" >>"$GITHUB_ENV"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: crates/oasis7_viewer/package-lock.json
      - name: Install viewer web dependencies
        run: npm ci --prefix crates/oasis7_viewer
      - name: Install pinned Rust toolchains
        run: |
          rustup toolchain install "${RUST_TOOLCHAIN}" --profile minimal --component rustfmt --component clippy
          rustup default "${RUST_TOOLCHAIN}"
          rustup toolchain install "${OASIS7_WASM_TOOLCHAIN}" --profile minimal --component rust-src
          rustup target add "${OASIS7_WASM_TARGET}" --toolchain "${OASIS7_WASM_TOOLCHAIN}"
          rustup target add wasm32-unknown-unknown
      - name: Install cargo-deny
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2
        with:
          tool: cargo-deny@0.19.9
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            llvm \
            pkg-config \
            libwayland-dev \
            wayland-protocols \
            libxkbcommon-dev \
            libx11-dev \
            libxi-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxinerama-dev \
            libasound2-dev \
            libudev-dev
          clang --print-targets | grep -w wasm32
          llvm-ar --version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: false
          shared-key: ci-full-regression-trusted-v2
          add-rust-environment-hash-key: true
          env-vars: CARGO CC CFLAGS CXX CMAKE RUST OASIS7_WASM
          cache-on-failure: true
      - name: Resolve wasm-bindgen tool cache metadata
        id: bindgen-meta
        shell: bash
        run: |
          source scripts/wasm-bindgen-cli-common.sh
          printf 'version=%s\nroot=%s\n' "$WASM_BINDGEN_LOCK_VERSION" "$WASM_BINDGEN_CACHE_ROOT" >> "$GITHUB_OUTPUT"
      - name: Restore exact wasm-bindgen tool cache
        id: bindgen-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.bindgen-meta.outputs.root }}
          key: wasm-bindgen-cli-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.RUST_TOOLCHAIN }}-${{ steps.bindgen-meta.outputs.version }}-${{ hashFiles('scripts/ensure-wasm-bindgen-cli.sh', 'scripts/wasm-bindgen-cli-common.sh') }}
      - name: Prepare exact wasm-bindgen tool directory
        id: prepare-bindgen
        shell: bash
        env:
          BINDGEN_CACHE_HIT: ${{ steps.bindgen-cache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          source scripts/wasm-bindgen-cli-common.sh
          if [[ "$BINDGEN_CACHE_HIT" == true ]]; then
            bindgen_bin="$WASM_BINDGEN_CACHE_ROOT/bin/wasm-bindgen"
            test -x "$bindgen_bin"
            test "$("$bindgen_bin" --version)" = "wasm-bindgen $WASM_BINDGEN_LOCK_VERSION"
          else
            bindgen_bin="$(bash scripts/ensure-wasm-bindgen-cli.sh --ensure-cache --print-bin)"
          fi
          test -x "$bindgen_bin"
          test "$("$bindgen_bin" --version)" = "wasm-bindgen $WASM_BINDGEN_LOCK_VERSION"
          printf 'WASM_BINDGEN_BIN=%s\n' "$bindgen_bin" >> "$GITHUB_ENV"
      - name: Cache pinned Trunk release archive
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ci-tools/trunk-x86_64-unknown-linux-gnu.tar.gz
          key: trunk-archive-${{ runner.os }}-${{ runner.arch }}-${{ env.TRUNK_VERSION }}-${{ hashFiles('scripts/install-ci-trunk.sh') }}
      - name: Install verified pinned Trunk
        shell: bash
        run: bash scripts/install-ci-trunk.sh "$RUNNER_TEMP/ci-tools/trunk-x86_64-unknown-linux-gnu.tar.gz" "$RUNNER_TEMP/ci-tools/bin"
      - name: Install product-document Markdown parser
        run: python3 -m pip install --disable-pip-version-check --requirement scripts/doc-governance-requirements.txt
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-tests-${{ github.sha }}
          path: ${{ runner.temp }}
      - name: Unpack native executables preserving modes
        run: |
          mkdir -p "$RUNNER_TEMP/native-tests"
          tar -C "$RUNNER_TEMP/native-tests" -xzf "$RUNNER_TEMP/native-tests.tar.gz"
      - name: Run full test tier
        env:
          OASIS7_CI_TEST_BUNDLE: ${{ runner.temp }}/native-tests
          SOURCE_SHA: ${{ github.sha }}
        run: CI_VERBOSE=1 ./scripts/ci-tests.sh full-standard

      - name: Run Rust governance report
        if: always()
        run: ./scripts/ci-rust-governance-report.sh --out-dir output/rust-governance

      - name: Append Rust governance summary
        if: always()
        run: cat output/rust-governance/summary.md >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload Rust governance report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-governance-report
          path: output/rust-governance
          if-no-files-found: error

  explicit-full-gate:
    name: explicit-full-gate
    if: >-
      always() &&
      (github.event_name == 'schedule' ||
       (github.event_name == 'workflow_dispatch' && inputs.run_mode == 'full'))
    runs-on: ubuntu-24.04
    needs: [select, oasis7-test-build, formal-process, full-regression, candidate-full-regression]
    steps:
      - name: Require complete explicit full run
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          RUN_MODE: ${{ inputs.run_mode }}
          PLAN: ${{ needs.select.outputs.plan }}
          SELECT_RESULT: ${{ needs.select.result }}
          TEST_BUILD_RESULT: ${{ needs.oasis7-test-build.result }}
          FORMAL_RESULT: ${{ needs.formal-process.result }}
          FULL_RESULT: ${{ needs.full-regression.result }}
          CANDIDATE_RESULT: ${{ needs.candidate-full-regression.result }}
        shell: bash
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          [[ "$PLAN" == '{"scope":"explicit-full","groups":[]}' ]] || fail 'selection did not produce the explicit-full plan'
          [[ "$SELECT_RESULT" == success ]] || fail 'scope selection did not succeed'
          [[ "$TEST_BUILD_RESULT" == success ]] || fail 'ordinary test artifact build did not succeed'
          [[ "$FORMAL_RESULT" == success ]] || fail 'formal process suite did not succeed'
          case "$EVENT_NAME:$RUN_MODE:$REF" in
            schedule::refs/heads/main|workflow_dispatch:full:refs/heads/main)
              [[ "$FULL_RESULT" == success ]] || fail 'main full regression did not succeed'
              [[ "$CANDIDATE_RESULT" == skipped ]] || fail 'candidate full regression should be skipped on main'
              ;;
            workflow_dispatch:full:*)
              [[ "$CANDIDATE_RESULT" == success ]] || fail 'candidate full regression did not succeed'
              [[ "$FULL_RESULT" == skipped ]] || fail 'main full regression should be skipped off main'
              ;;
            *) fail 'explicit-full gate ran for an unsupported event or ref' ;;
          esac

  newapi-bridge-package:
    if: github.event_name == 'workflow_dispatch' && inputs.run_mode == 'newapi_bridge_package'
    name: newapi-bridge-linux-x86-64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install "${RUST_TOOLCHAIN}" --profile minimal
          rustup default "${RUST_TOOLCHAIN}"

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libwayland-dev \
            wayland-protocols \
            libxkbcommon-dev \
            libx11-dev \
            libxi-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxinerama-dev \
            libasound2-dev \
            libudev-dev

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: newapi-bridge-service-linux-x86-64-trusted-v2
          cache-on-failure: true

      - name: Build and stage deployable artifact
        run: |
          ./scripts/newapi-bridge-service/package-newapi-bridge-service.sh \
            --profile "${{ inputs.newapi_bridge_build_profile }}" \
            --archive output/newapi-bridge-service-linux-x86_64.tar.gz

      - name: Upload NewAPI bridge service artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: newapi-bridge-service-linux-x86_64-${{ github.sha }}
          path: output/newapi-bridge-service-linux-x86_64.tar.gz
          if-no-files-found: error
