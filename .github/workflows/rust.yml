          path: ${{ runner.temp }}/ordinary-cache-*.json
          if-no-files-found: ignore
          retention-days: 2
      - name: Report candidate build capacity on failure
        if: failure() && github.job == 'oasis7-test-build-candidate'
        shell: bash
        run: |
          df -B1 "$GITHUB_WORKSPACE" "$RUNNER_TEMP" || true
          df -i "$GITHUB_WORKSPACE" "$RUNNER_TEMP" || true
          for path in "$GITHUB_WORKSPACE/target" "$RUNNER_TEMP/native-tests" "$RUNNER_TEMP/ordinary-workspace-cache"; do
