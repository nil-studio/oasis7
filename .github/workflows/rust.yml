          REQUESTED_KEY: ${{ steps.formal-endpoint-cache-identity.outputs.key }}
          MATCHED_KEY: ${{ steps.formal-endpoint-workspace-cache.outputs.cache-matched-key }}
          CACHE_HIT: ${{ steps.formal-endpoint-workspace-cache.outputs.cache-hit }}
        run: |
          python3 scripts/ci-workspace-cache.py restore --scope formal-endpoint --cache "$RUNNER_TEMP/formal-endpoint-workspace-cache" \
            --requested-key "$REQUESTED_KEY" --matched-key "$MATCHED_KEY" --cache-hit "$CACHE_HIT" \
            --report "$RUNNER_TEMP/formal-endpoint-cache-restore.json"
      - name: Install native libraries
        shell: bash
        timeout-minutes: 11
        run: |
          sudo -n /usr/bin/python3 scripts/ci-apt-install.py --budget-seconds 600 -- pkg-config libwayland-dev wayland-protocols libxkbcommon-dev libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxinerama-dev libasound2-dev libudev-dev
      - id: component-artifact
        shell: bash
        run: |
          printf 'artifact=formal-endpoint-%s-%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - name: Build and archive formal-endpoint component
        env:
          SOURCE_SHA: ${{ needs.select.outputs.source_sha }}
        shell: bash
        run: |
          python3 scripts/ci-test-artifacts.py build --scope formal-endpoint --plan "$RUNNER_TEMP/selection.json" --formal-config "$RUNNER_TEMP/ci-authority/ci-formal-process-suites.json" --bundle "$RUNNER_TEMP/formal-endpoint-tests" --cache-state "$RUNNER_TEMP/formal-endpoint-cache-state.json" --build-diagnostics "$RUNNER_TEMP/formal-endpoint-build-diagnostics"
          tar -C "$RUNNER_TEMP/formal-endpoint-tests" -I 'gzip -1' -cf "$RUNNER_TEMP/formal-endpoint-tests.tar.gz" .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.component-artifact.outputs.artifact }}
          path: ${{ runner.temp }}/formal-endpoint-tests.tar.gz
          compression-level: 0
          overwrite: true
          if-no-files-found: error
          retention-days: 2
      - name: Upload formal-endpoint build diagnostics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: formal-endpoint-build-diagnostics-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/formal-endpoint-build-diagnostics
          if-no-files-found: warn
          retention-days: 2
      - name: Measure formal-endpoint workspace cache footprint
        run: |
          python3 scripts/ci-workspace-cache.py measure --scope formal-endpoint --cache "$RUNNER_TEMP/formal-endpoint-workspace-cache" \
            --state "$RUNNER_TEMP/formal-endpoint-cache-state.json" --report "$RUNNER_TEMP/formal-endpoint-cache-measure.json"
      - name: Stage bounded formal-endpoint workspace units
        id: formal-endpoint-cache-stage
        if: >-
          github.job == 'formal-endpoint-build-trusted' && steps.formal-endpoint-cache-identity.outputs.key != '' &&
          steps.formal-endpoint-workspace-cache.outputs.cache-hit != 'true'
        env:
          CACHE_INVENTORY_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/ci-workspace-cache.py stage --scope formal-endpoint --cache "$RUNNER_TEMP/formal-endpoint-workspace-cache" \
            --state "$RUNNER_TEMP/formal-endpoint-cache-state.json" --report "$RUNNER_TEMP/formal-endpoint-cache-stage.json"
      - name: Save bounded trusted formal-endpoint workspace cache
        id: formal-endpoint-cache-save
        if: github.job == 'formal-endpoint-build-trusted' && steps.formal-endpoint-cache-stage.outputs.save == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/formal-endpoint-workspace-cache/workspace-units.tar.zst
          key: ${{ steps.formal-endpoint-cache-identity.outputs.key }}
      - name: Confirm formal-endpoint workspace cache
        id: formal-endpoint-cache-observe
        if: >-
          github.job == 'formal-endpoint-build-trusted' &&
          ((steps.formal-endpoint-cache-stage.outputs.save == 'true' && steps.formal-endpoint-cache-save.outcome == 'success') ||
           steps.formal-endpoint-workspace-cache.outputs.cache-hit == 'true')
        env:
          CACHE_INVENTORY_TOKEN: ${{ github.token }}
          CACHE_KEY: ${{ steps.formal-endpoint-cache-identity.outputs.key }}
        run: python3 scripts/ci-workspace-cache.py observe-save --scope formal-endpoint --key "$CACHE_KEY" --report "$RUNNER_TEMP/formal-endpoint-cache-save.json"
      - name: Upload formal-endpoint workspace cache diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: formal-endpoint-workspace-cache-report-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/formal-endpoint-cache-*.json
          if-no-files-found: ignore
          retention-days: 2
      - *engineering-job-observation

  formal-endpoint-build-trusted:
    cache-mode: write
    permissions:
      contents: read
      actions: read
    env:
      CARGO_PROFILE_DEV_OPT_LEVEL: "0"
      CARGO_PROFILE_DEV_DEBUG_ASSERTIONS: "true"
      CARGO_PROFILE_DEV_OVERFLOW_CHECKS: "true"
      CARGO_PROFILE_TEST_OPT_LEVEL: "0"
      CARGO_PROFILE_TEST_DEBUG_ASSERTIONS: "true"
      CARGO_PROFILE_TEST_OVERFLOW_CHECKS: "true"
    needs: [select, cache-bootstrap-maintenance]
    outputs:
      artifact: ${{ steps.component-artifact.outputs.artifact }}
      cache_key: ${{ steps.formal-endpoint-cache-identity.outputs.key }}
      cache_confirmed: ${{ steps.formal-endpoint-cache-observe.outputs.saved_confirmed }}
    if: >-
      always() && !cancelled() && needs.select.result == 'success' && needs.select.outputs.run_formal_process == 'true' &&
      github.ref == 'refs/heads/main' && github.workflow_sha == github.sha &&
      needs.select.outputs.trusted_source == 'true' &&
      (fromJSON(needs.select.outputs.plan).execution_profile == 'periodic-full' ||
       fromJSON(needs.select.outputs.plan).execution_profile == 'candidate-full' ||
       !fromJSON(needs.select.outputs.plan).fast_plan_version) &&
        (github.event_name == 'push' || github.event_name == 'schedule' ||
         (github.event_name == 'workflow_dispatch' && inputs.run_mode == 'full'))
    runs-on: ubuntu-24.04
    steps: *formal-endpoint-build-steps

  formal-test-build:
    cache-mode: read
    permissions:
      contents: read
      actions: read
    needs: [select, formal-debug-build, formal-debug-build-trusted, formal-endpoint-build, formal-endpoint-build-trusted]
    if: >-
      always() && !cancelled() &&
      needs.formal-debug-build.result == 'success' &&
      needs.formal-debug-build-trusted.result == 'skipped' &&
      needs.formal-endpoint-build.result == 'success' &&
      needs.formal-endpoint-build-trusted.result == 'skipped' &&
      needs.select.result == 'success' && needs.select.outputs.run_formal_process == 'true' &&
      !(github.ref == 'refs/heads/main' && github.workflow_sha == github.sha &&
      needs.select.outputs.trusted_source == 'true' &&
      (fromJSON(needs.select.outputs.plan).execution_profile == 'periodic-full' ||
       fromJSON(needs.select.outputs.plan).execution_profile == 'candidate-full' ||
       !fromJSON(needs.select.outputs.plan).fast_plan_version) &&
        (github.event_name == 'push' || github.event_name == 'schedule' ||
         (github.event_name == 'workflow_dispatch' && inputs.run_mode == 'full')))
    runs-on: ubuntu-24.04
    steps: &formal-merge-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.select.outputs.tested_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.select.outputs.selection_artifact }}
          path: ${{ runner.temp }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.select.outputs.authority_artifact }}
          path: ${{ runner.temp }}/ci-authority
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Install pinned Rust toolchain for artifact verification
        shell: bash
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      - name: Stabilize verification Rust toolchain
        shell: bash
        run: python3 scripts/ci-rust-cache-toolchains.py "$RUST_TOOLCHAIN"
      - name: Install native libraries
        shell: bash
        timeout-minutes: 11
        run: |
          sudo -n /usr/bin/python3 scripts/ci-apt-install.py --budget-seconds 600 -- pkg-config libwayland-dev wayland-protocols libxkbcommon-dev libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxinerama-dev libasound2-dev libudev-dev
      - name: Require exact successful Formal component artifacts
        env:
          DEBUG_ARTIFACT: ${{ needs.formal-debug-build.outputs.artifact || needs.formal-debug-build-trusted.outputs.artifact }}
          ENDPOINT_ARTIFACT: ${{ needs.formal-endpoint-build.outputs.artifact || needs.formal-endpoint-build-trusted.outputs.artifact }}
        shell: bash
        run: |
          [[ "$DEBUG_ARTIFACT" =~ ^formal-debug-${GITHUB_RUN_ID}-[1-9][0-9]*$ ]]
          [[ "$ENDPOINT_ARTIFACT" =~ ^formal-endpoint-${GITHUB_RUN_ID}-[1-9][0-9]*$ ]]
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.formal-debug-build.outputs.artifact || needs.formal-debug-build-trusted.outputs.artifact }}
          path: ${{ runner.temp }}/formal-components/debug
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.formal-endpoint-build.outputs.artifact || needs.formal-endpoint-build-trusted.outputs.artifact }}
          path: ${{ runner.temp }}/formal-components/endpoint
      - name: Unpack Formal components preserving executable modes
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/formal-debug-tests" "$RUNNER_TEMP/formal-endpoint-tests"
          tar -C "$RUNNER_TEMP/formal-debug-tests" -xzf "$RUNNER_TEMP/formal-components/debug/formal-debug-tests.tar.gz"
          tar -C "$RUNNER_TEMP/formal-endpoint-tests" -xzf "$RUNNER_TEMP/formal-components/endpoint/formal-endpoint-tests.tar.gz"
      - name: Merge and pack formal process dependencies
        env:
          SOURCE_SHA: ${{ needs.select.outputs.source_sha }}
        shell: bash
        run: |
          python3 scripts/ci-test-artifacts.py merge-formal --debug-bundle "$RUNNER_TEMP/formal-debug-tests" --endpoint-bundle "$RUNNER_TEMP/formal-endpoint-tests" --bundle "$RUNNER_TEMP/formal-tests" --plan "$RUNNER_TEMP/selection.json" --formal-config "$RUNNER_TEMP/ci-authority/ci-formal-process-suites.json"
          python3 scripts/ci-test-artifacts.py pack --plan "$RUNNER_TEMP/selection.json" --formal-config "$RUNNER_TEMP/ci-authority/ci-formal-process-suites.json" --bundle "$RUNNER_TEMP/formal-tests" --split-formal --output "$RUNNER_TEMP/formal-archives"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: contains(fromJSON(needs.select.outputs.formal_shards), 'runtime-protocol')
        with:
          name: formal-tests-runtime-protocol-${{ github.sha }}
          path: ${{ runner.temp }}/formal-archives/runtime-protocol.tar.gz
          compression-level: 0
          overwrite: true
          if-no-files-found: error
          retention-days: 2
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: contains(fromJSON(needs.select.outputs.formal_shards), 'world-history')
        with:
          name: formal-tests-world-history-${{ github.sha }}
          path: ${{ runner.temp }}/formal-archives/world-history.tar.gz
          compression-level: 0
          overwrite: true
          if-no-files-found: error
          retention-days: 2
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: contains(fromJSON(needs.select.outputs.formal_shards), 'healthy-set')
        with:
          name: formal-tests-healthy-set-${{ github.sha }}
          path: ${{ runner.temp }}/formal-archives/healthy-set.tar.gz
          compression-level: 0
          overwrite: true
          if-no-files-found: error
          retention-days: 2
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: contains(fromJSON(needs.select.outputs.formal_shards), 'storage-recovery')
        with:
          name: formal-tests-storage-recovery-${{ github.sha }}
          path: ${{ runner.temp }}/formal-archives/storage-recovery.tar.gz
          compression-level: 0
          overwrite: true
          if-no-files-found: error
          retention-days: 2
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: contains(fromJSON(needs.select.outputs.formal_shards), 'lifecycle-cli')
        with:
          name: formal-tests-lifecycle-cli-${{ github.sha }}
          path: ${{ runner.temp }}/formal-archives/lifecycle-cli.tar.gz
          compression-level: 0
          overwrite: true
          if-no-files-found: error
          retention-days: 2
      - *engineering-job-observation

  formal-test-build-trusted:
    cache-mode: read
    permissions:
      contents: read
      actions: read
    needs: [select, formal-debug-build, formal-debug-build-trusted, formal-endpoint-build, formal-endpoint-build-trusted]
    if: >-
      always() && !cancelled() &&
      needs.formal-debug-build.result == 'skipped' &&
      needs.formal-debug-build-trusted.result == 'success' &&
      needs.formal-endpoint-build.result == 'skipped' &&
      needs.formal-endpoint-build-trusted.result == 'success' &&
      needs.select.result == 'success' && needs.select.outputs.run_formal_process == 'true' &&
      github.ref == 'refs/heads/main' && github.workflow_sha == github.sha &&
      needs.select.outputs.trusted_source == 'true' &&
      (fromJSON(needs.select.outputs.plan).execution_profile == 'periodic-full' ||
       fromJSON(needs.select.outputs.plan).execution_profile == 'candidate-full' ||
       !fromJSON(needs.select.outputs.plan).fast_plan_version) &&
        (github.event_name == 'push' || github.event_name == 'schedule' ||
         (github.event_name == 'workflow_dispatch' && inputs.run_mode == 'full'))
    runs-on: ubuntu-24.04
    steps: *formal-merge-steps

  cache-maintenance:
    needs: [select, oasis7-test-build-trusted, formal-debug-build-trusted, formal-endpoint-build-trusted]
    if: >-
      always() && !cancelled() &&
      (needs.oasis7-test-build-trusted.result == 'success' ||
       needs.formal-debug-build-trusted.result == 'success' ||
       needs.formal-endpoint-build-trusted.result == 'success') &&
      github.ref == 'refs/heads/main' && github.workflow_sha == github.sha &&
      needs.select.outputs.trusted_source == 'true' &&
      (fromJSON(needs.select.outputs.plan).execution_profile == 'periodic-full' ||
       fromJSON(needs.select.outputs.plan).execution_profile == 'candidate-full' ||
       !fromJSON(needs.select.outputs.plan).fast_plan_version) &&
        (github.event_name == 'push' || github.event_name == 'schedule' ||
         (github.event_name == 'workflow_dispatch' && inputs.run_mode == 'full'))
    cache-mode: none
    permissions:
      contents: read
      actions: write
    concurrency:
      group: ci-cache-maintenance-main
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.select.outputs.tested_sha }}
          persist-credentials: false
      - name: Recover rotation headroom and retain confirmed workspace generations
        env:
          CACHE_MAINTENANCE_TOKEN: ${{ github.token }}
          ORDINARY_RESULT: ${{ needs.oasis7-test-build-trusted.result }}
          ORDINARY_CONFIRMED: ${{ needs.oasis7-test-build-trusted.outputs.cache_confirmed }}
          ORDINARY_KEY: ${{ needs.oasis7-test-build-trusted.outputs.cache_key }}
          FORMAL_DEBUG_RESULT: ${{ needs.formal-debug-build-trusted.result }}
          FORMAL_DEBUG_CONFIRMED: ${{ needs.formal-debug-build-trusted.outputs.cache_confirmed }}
          FORMAL_DEBUG_KEY: ${{ needs.formal-debug-build-trusted.outputs.cache_key }}
          FORMAL_ENDPOINT_RESULT: ${{ needs.formal-endpoint-build-trusted.result }}
          FORMAL_ENDPOINT_CONFIRMED: ${{ needs.formal-endpoint-build-trusted.outputs.cache_confirmed }}
          FORMAL_ENDPOINT_KEY: ${{ needs.formal-endpoint-build-trusted.outputs.cache_key }}
        shell: bash
        run: |
          args=()
          if [[ "$ORDINARY_RESULT" == success && "$ORDINARY_CONFIRMED" == true ]]; then
            args+=(--current-key "$ORDINARY_KEY")
          fi
          if [[ "$FORMAL_DEBUG_RESULT" == success && "$FORMAL_DEBUG_CONFIRMED" == true ]]; then
            args+=(--current-key "$FORMAL_DEBUG_KEY")
          fi
          if [[ "$FORMAL_ENDPOINT_RESULT" == success && "$FORMAL_ENDPOINT_CONFIRMED" == true ]]; then
            args+=(--current-key "$FORMAL_ENDPOINT_KEY")
          fi
          python3 scripts/ci-cache-maintenance.py --recover --apply "${args[@]}"

  oasis7-required:
    name: oasis7-required (${{ matrix.partition }})
    needs: [select, oasis7-test-build]
    if: >-
      always() && !cancelled() && needs.select.result == 'success' &&
      (((fromJSON(needs.select.outputs.plan).fast_execution_version == 1 &&
         fromJSON(needs.select.outputs.plan).ordinary_execution == 'inline') &&
        needs.oasis7-test-build.result == 'skipped') ||
       (!(fromJSON(needs.select.outputs.plan).fast_execution_version == 1 &&
          fromJSON(needs.select.outputs.plan).ordinary_execution == 'inline') &&
        needs.oasis7-test-build.result == 'success')) &&
      (needs.select.outputs.run_oasis7_required == 'true' ||
       fromJSON(needs.select.outputs.plan).scope == 'full')
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        partition: ${{ fromJSON(needs.select.outputs.ordinary_partitions) }}
      max-parallel: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.select.outputs.tested_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.select.outputs.selection_artifact }}
          path: ${{ runner.temp }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Install pinned Rust toolchains
        if: >-
          !(fromJSON(needs.select.outputs.plan).ordinary_artifact_partition_version == 2 &&
            (matrix.partition == 'native-0' || matrix.partition == 'native-1' ||
             matrix.partition == 'native-2' || matrix.partition == 'native-3') &&
            join(fromJSON(needs.select.outputs.plan).oasis7_required_packages, ',') == 'oasis7_chain_runtime')
        shell: bash
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt --component clippy
          rustup default "$RUST_TOOLCHAIN"
          rustup toolchain install "$OASIS7_WASM_TOOLCHAIN" --profile minimal --component rust-src
          rustup target add "$OASIS7_WASM_TARGET" --toolchain "$OASIS7_WASM_TOOLCHAIN"
          rustup target add wasm32-unknown-unknown
      - name: Stabilize Rust cache toolchains
        if: >-
          !(fromJSON(needs.select.outputs.plan).ordinary_artifact_partition_version == 2 &&
            (matrix.partition == 'native-0' || matrix.partition == 'native-1' ||
             matrix.partition == 'native-2' || matrix.partition == 'native-3') &&
            join(fromJSON(needs.select.outputs.plan).oasis7_required_packages, ',') == 'oasis7_chain_runtime')
        shell: bash
        run: python3 scripts/ci-rust-cache-toolchains.py "$RUST_TOOLCHAIN" "$OASIS7_WASM_TOOLCHAIN"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        if: >-
          !(fromJSON(needs.select.outputs.plan).ordinary_artifact_partition_version == 2 &&
            (matrix.partition == 'native-0' || matrix.partition == 'native-1' ||
             matrix.partition == 'native-2' || matrix.partition == 'native-3') &&
            join(fromJSON(needs.select.outputs.plan).oasis7_required_packages, ',') == 'oasis7_chain_runtime')
        with:
          save-if: false
          shared-key: ci-shared-native-trusted-v4
          add-rust-environment-hash-key: true
          env-vars: CARGO CC CFLAGS CXX CMAKE RUST OASIS7_WASM
          cache-on-failure: false
      - name: Identify inline ordinary workspace cache
        id: ordinary-cache-identity
        if: fromJSON(needs.select.outputs.plan).fast_execution_version == 1 && fromJSON(needs.select.outputs.plan).ordinary_execution == 'inline'
        run: python3 scripts/ci-workspace-cache.py identity --scope ordinary
      - name: Restore compatible inline ordinary workspace cache
        id: ordinary-workspace-cache
        if: steps.ordinary-cache-identity.outputs.key != ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ordinary-workspace-cache/workspace-units.tar.zst
          key: ${{ steps.ordinary-cache-identity.outputs.key }}
          restore-keys: ${{ steps.ordinary-cache-identity.outputs.prefix }}
      - name: Validate and restore inline ordinary workspace units
        if: fromJSON(needs.select.outputs.plan).fast_execution_version == 1 && fromJSON(needs.select.outputs.plan).ordinary_execution == 'inline'
        env:
          REQUESTED_KEY: ${{ steps.ordinary-cache-identity.outputs.key }}
          MATCHED_KEY: ${{ steps.ordinary-workspace-cache.outputs.cache-matched-key }}
          CACHE_HIT: ${{ steps.ordinary-workspace-cache.outputs.cache-hit }}
        run: |
          python3 scripts/ci-workspace-cache.py restore --scope ordinary --cache "$RUNNER_TEMP/ordinary-workspace-cache" \
            --requested-key "$REQUESTED_KEY" --matched-key "$MATCHED_KEY" --cache-hit "$CACHE_HIT" \
            --report "$RUNNER_TEMP/ordinary-cache-restore.json"
      - name: Install native libraries
        shell: bash
        timeout-minutes: 11
        run: |
          sudo -n /usr/bin/python3 scripts/ci-apt-install.py --budget-seconds 600 -- pkg-config libwayland-dev wayland-protocols libxkbcommon-dev libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxinerama-dev libasound2-dev libudev-dev
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: fromJSON(needs.select.outputs.plan).fast_execution_version != 1 || fromJSON(needs.select.outputs.plan).ordinary_execution != 'inline'
        with:
          name: native-tests-${{ github.sha }}
          path: ${{ runner.temp }}
      - name: Unpack native executables preserving modes
        if: fromJSON(needs.select.outputs.plan).fast_execution_version != 1 || fromJSON(needs.select.outputs.plan).ordinary_execution != 'inline'
        run: |
          mkdir -p "$RUNNER_TEMP/native-tests"
          tar -C "$RUNNER_TEMP/native-tests" -xzf "$RUNNER_TEMP/native-tests.tar.gz"
      - name: Execute selected group
        shell: bash
        env:
          OASIS7_CI_TEST_BUNDLE: ${{ !(fromJSON(needs.select.outputs.plan).fast_execution_version == 1 && fromJSON(needs.select.outputs.plan).ordinary_execution == 'inline') && format('{0}/native-tests', runner.temp) || '' }}
          SOURCE_SHA: ${{ needs.select.outputs.source_sha }}
          CI_VERBOSE: "1"
          ORDINARY_PARTITION: ${{ matrix.partition }}
          OASIS7_PRODUCT_DOC_BASE: ${{ needs.select.outputs.range_base }}
          OASIS7_PRODUCT_DOC_HEAD: ${{ needs.select.outputs.tested_sha }}
        run: bash ./scripts/ci-tests.sh required --group "oasis7_required" --plan "$RUNNER_TEMP/selection.json" --ordinary-partition "$ORDINARY_PARTITION" --repo-root "$GITHUB_WORKSPACE"

  formal-process-tests:
