name: NewAPI Bridge Service Package

on:
  workflow_dispatch:
    inputs:
      build_profile:
        description: "Cargo profile for the NewAPI bridge service binary"
        required: true
        default: release
        type: choice
        options:
          - release
          - dev

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  RUST_TOOLCHAIN: 1.96.0

jobs:
  package-linux-x86-64:
    name: newapi-bridge-linux-x86-64
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/nil-studio/oasis7/ci-rust-build@sha256:0b13d0b5ba9051617eb6ab77a5af324f066af79bb2753d664b780535c2fe13a3
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure mold for Linux host linking
        uses: ./.github/actions/setup-linux-mold
      - name: Trust the checked-out workspace path in the job container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Verify the preinstalled packaging dependencies
        run: |
          rustc +"${RUST_TOOLCHAIN}" -vV
          pkg-config --exists wayland-client x11 alsa libudev openssl

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: newapi-bridge-service-linux-x86-64-ci-rust-build-0b13d0b5ba9051617eb6ab77a5af324f066af79bb2753d664b780535c2fe13a3
          save-if: ${{ github.ref == 'refs/heads/main' && github.workflow_sha == github.sha }}
          cache-on-failure: false

      - name: Build and stage deployable artifact
        run: |
          ./scripts/newapi-bridge-service/package-newapi-bridge-service.sh \
            --profile "${{ github.event.inputs.build_profile || 'release' }}" \
            --archive output/newapi-bridge-service-linux-x86_64.tar.gz

      - name: Upload NewAPI bridge service artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: newapi-bridge-service-linux-x86_64-${{ github.sha }}
          path: output/newapi-bridge-service-linux-x86_64.tar.gz
          if-no-files-found: error
