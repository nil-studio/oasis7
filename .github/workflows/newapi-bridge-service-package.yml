name: NewAPI Bridge Service Package

on:
  workflow_dispatch:
    inputs:
      build_profile:
        description: "Cargo profile for the NewAPI bridge service binary"
        required: true
        default: release
        type: choice
        options:
          - release
          - dev

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  RUST_TOOLCHAIN: 1.96.0

jobs:
  package-linux-x86-64:
    name: newapi-bridge-linux-x86-64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install "${RUST_TOOLCHAIN}" --profile default
          rustup default "${RUST_TOOLCHAIN}"

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libwayland-dev \
            wayland-protocols \
            libxkbcommon-dev \
            libx11-dev \
            libxi-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxinerama-dev \
            libasound2-dev \
            libudev-dev

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: newapi-bridge-service-linux-x86-64-trusted-v2
          cache-on-failure: true

      - name: Build and stage deployable artifact
        run: |
          ./scripts/newapi-bridge-service/package-newapi-bridge-service.sh \
            --profile "${{ github.event.inputs.build_profile || 'release' }}" \
            --archive output/newapi-bridge-service-linux-x86_64.tar.gz

      - name: Upload NewAPI bridge service artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: newapi-bridge-service-linux-x86_64-${{ github.sha }}
          path: output/newapi-bridge-service-linux-x86_64.tar.gz
          if-no-files-found: error
