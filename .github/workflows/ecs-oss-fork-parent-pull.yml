name: ECS OSS fork parent pull
on:
  pull_request:
    types: [opened]
permissions:
  contents: read
  packages: read
cache-mode: none
jobs:
  pull-parent:
    if: >-
      github.repository == 'nil-studio/oasis7' &&
      github.event.pull_request.head.repo.full_name == 'eng-cc/oasis7-ci-validation' &&
      github.head_ref == 'task/engineering-ecs-oss-fork-parent-pull' &&
      github.base_ref == 'codex/ecs-oss-fork-pull-base-20261128' &&
      github.event.pull_request.base.sha == '1780874d9bf95c669d006be4e34066038a2a26bf' &&
      github.event.pull_request.draft &&
      github.event.pull_request.title == 'ECS OSS readonly fork parent pull 20261128-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Pull the exact API parent with only the actual fork token
        env:
          GHCR_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = pull_request
          test -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}"
          image=ghcr.io/nil-studio/oasis7/ci-api-runtime@sha256:ba7c763f7b634b672c6dccef1384bce4daf7abd44a65d613696a748891e3c0ed
          export DOCKER_CONFIG
          DOCKER_CONFIG=$(mktemp -d)
          trap 'rm -rf -- "$DOCKER_CONFIG"' EXIT
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          unset GHCR_TOKEN
          docker pull "$image"
          docker image inspect --format '{{json .RepoDigests}}' "$image" | python3 -c 'import json,sys; assert "ghcr.io/nil-studio/oasis7/ci-api-runtime@sha256:ba7c763f7b634b672c6dccef1384bce4daf7abd44a65d613696a748891e3c0ed" in json.load(sys.stdin)'
          docker run --rm --pull never --network none --user 1001:1001 --env HOME=/tmp "$image" bash -euo pipefail -c '
            test "$(id -u):$(id -g)" = 1001:1001
            /usr/local/bin/node -e '''require("node:assert/strict").equal(process.versions.node.split(".")[0], "24")'''
            python3 -c '''import sys; assert sys.version_info[:2] == (3, 12)'''
            gh --version | grep -E "^gh version 2[.]105[.]0( |$)"
          '
          printf 'actual_fork_token_parent_pull=passed digest=ba7c763f7b634b672c6dccef1384bce4daf7abd44a65d613696a748891e3c0ed network_none_tools=passed no_build=true no_publish=true\n'
