name: CodeQL Platform Observation

on:
  workflow_dispatch:
    inputs:
      producer_run_id:
        description: Completed main CodeQL production run ID
        required: true
        type: string
      producer_run_attempt:
        description: Exact latest completed attempt of that run
        required: true
        type: string
      producer_sha:
        description: Full lowercase source SHA of that run
        required: true
        type: string

permissions:
  contents: read

jobs:
  observe:
    name: CodeQL / platform observation
    if: >-
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' &&
      github.repository == 'nil-studio/oasis7'
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    permissions:
      contents: read
      actions: read
      checks: read
      security-events: read
      packages: read
    container:
      image: ghcr.io/nil-studio/oasis7/ci-api-runtime@sha256:ba7c763f7b634b672c6dccef1384bce4daf7abd44a65d613696a748891e3c0ed
      options: --user 1001:1001
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify the API runtime prerequisites
        shell: bash
        run: |
          test "$(id -u)" = 1001
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(command -v gh)" = /usr/local/bin/gh
          version=$(gh --version)
          grep -Eq '^gh version 2[.]105[.]0( |$)' <<< "$version"
          printf '%s\n' "$version"
          python3 -I -c 'import sys; assert sys.version_info[:2] == (3, 12)'
      - name: Read exact production upload and findings
        env:
          GH_TOKEN: ${{ github.token }}
          GH_PROMPT_DISABLED: '1'
          PRODUCER_RUN_ID: ${{ inputs.producer_run_id }}
          PRODUCER_RUN_ATTEMPT: ${{ inputs.producer_run_attempt }}
          PRODUCER_SHA: ${{ inputs.producer_sha }}
        shell: bash
        run: |
          python3 -I scripts/security/codeql-platform-observation.py \
            --producer-run-id "$PRODUCER_RUN_ID" \
            --producer-run-attempt "$PRODUCER_RUN_ATTEMPT" \
            --producer-sha "$PRODUCER_SHA" \
            --output "$RUNNER_TEMP/codeql-platform-observation/platform-observation.json"
      - name: Preserve platform observation including failures
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: oasis7-codeql-platform-observation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/codeql-platform-observation/platform-observation.json
          if-no-files-found: error
          retention-days: 30
