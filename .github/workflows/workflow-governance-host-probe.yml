name: Workflow governance host comparison

on:
  pull_request:
    branches: [codex/engineering-workflow-governance-host-recheck-base]
    paths: [.github/workflows/workflow-governance-host-probe.yml]
    types: [opened]

permissions:
  contents: read
cache-mode: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  PYTHONDONTWRITEBYTECODE: "1"
  # Configured repository cache budget: 20 GB (decimal bytes).
  # GitHub cache limits and billing budgets must also allow this capacity.
  CI_CACHE_REPOSITORY_BUDGET_BYTES: "20000000000"
  CARGO_NET_RETRY: 10
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  RUST_TOOLCHAIN: 1.96.0
  TRUNK_VERSION: 0.21.14
  OASIS7_WASM_TOOLCHAIN: nightly-2025-12-11
  OASIS7_WASM_TARGET: wasm32-unknown-unknown
  OASIS7_WASM_BUILD_STD: "1"
  OASIS7_WASM_BUILD_STD_COMPONENTS: std,panic_abort


jobs:
  host:
    if: github.head_ref == 'codex/engineering-workflow-governance-host-recheck' && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the same tested source as the image job
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 505afd34b62ddfc05446ff950afca9ad55d68b27
          fetch-depth: 0
          persist-credentials: false
      - name: Configure mold for Linux host linking
        uses: ./.github/actions/setup-linux-mold
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Download trusted control authority
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ci-authority-45004653928-1
          run-id: 45004653928
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/ci-authority
      - name: Download trusted control selection
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ci-selection-45004653928-1
          run-id: 45004653928
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/ci-control-selection
      - name: Verify the frozen checkout and trusted control inputs
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 505afd34b62ddfc05446ff950afca9ad55d68b27
          test "$(git rev-parse HEAD^1)" = 952c944b7a143e25e039c0c4e6f17590e0ae1a84
          test "$(git rev-parse HEAD^2)" = 8ee7937515ec01c78e6d1d4d16a39ebf9e5e7607
          echo "bb330bce91cf8b2ebe39ebbfce47ec49ae6370e36035b8aeb370a5baeb49b291  $RUNNER_TEMP/ci-control-selection/selection.json" | sha256sum --check
          echo "d07a4547f235c56a89ae27ad44c9140742fb54b3f4dc229aa653b5a8b2c2edae  $RUNNER_TEMP/ci-authority/ci-python-control-contracts.py" | sha256sum --check
          jq -e '.python_control_contract_version == 1' "$RUNNER_TEMP/ci-control-selection/selection.json"
      - name: Inspect trusted governance capability
        id: control-mode
        shell: bash
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/ci-authority/ci-python-control-contracts.py"
          help=$(python3 -I "$RUNNER_TEMP/ci-authority/ci-python-control-contracts.py" --help)
          if grep -Fq -- '--governance' <<< "$help"; then
            echo 'complete_governance=true' >> "$GITHUB_OUTPUT"
          else
            echo 'complete_governance=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Install document contract parser
        run: python3 -m pip install --disable-pip-version-check --requirement scripts/doc-governance-requirements.txt
      - name: Install pinned tools for offline control fixtures
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt --component clippy
          rustup default "$RUST_TOOLCHAIN"
          cargo --version
          rustc --version
          node --version
          command -v zstd
          command -v zstdmt
      - name: Execute trusted baseline Python control contracts
        shell: bash
        env:
          SOURCE_SHA: 8ee7937515ec01c78e6d1d4d16a39ebf9e5e7607
          POLICY_SHA: 952c944b7a143e25e039c0c4e6f17590e0ae1a84
          COMPLETE_GOVERNANCE: ${{ steps.control-mode.outputs.complete_governance }}
          RUSTUP_TOOLCHAIN: ${{ env.RUST_TOOLCHAIN }}
          CI_VERBOSE: "1"
          OASIS7_PRODUCT_DOC_BASE: 952c944b7a143e25e039c0c4e6f17590e0ae1a84
          OASIS7_PRODUCT_DOC_HEAD: 505afd34b62ddfc05446ff950afca9ad55d68b27
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/ci-authority/ci-python-control-contracts.py"
          complete=()
          if [[ "$COMPLETE_GOVERNANCE" == true ]]; then
            complete=(--governance)
          fi
          python3 "$RUNNER_TEMP/ci-authority/ci-python-control-contracts.py" run \
            --repo-root "$GITHUB_WORKSPACE" --policy-sha "$POLICY_SHA" \
            --plan "$RUNNER_TEMP/ci-control-selection/selection.json" "${complete[@]}"
      - name: Verify scoped candidate cache permission
        uses: ./.github/actions/cache-permission-probe
      - name: Restore trusted cache sentinel
        id: trusted-cache-sentinel
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/cache-permission-sentinel
          key: oasis7-cache-permission-sentinel-trusted-v2
      - name: Verify trusted cache sentinel when available
        env:
          CACHE_HIT: ${{ steps.trusted-cache-sentinel.outputs.cache-hit }}
        run: |
          if [[ "$CACHE_HIT" == true ]]; then
            grep -Fqx 'trusted-v2' "$RUNNER_TEMP/cache-permission-sentinel/sentinel"
            echo 'cache_permission_probe=trusted_restore_verified'
          else
            echo 'cache_permission_probe=trusted_writer_not_yet_seeded'
          fi
      - name: Execute selected group
        if: steps.control-mode.outputs.complete_governance != 'true'
        shell: bash
        env:
          CI_VERBOSE: "1"
          OASIS7_PRODUCT_DOC_BASE: 952c944b7a143e25e039c0c4e6f17590e0ae1a84
          OASIS7_PRODUCT_DOC_HEAD: 505afd34b62ddfc05446ff950afca9ad55d68b27
        run: bash ./scripts/ci-tests.sh required --group "workflow_governance" --repo-root "$GITHUB_WORKSPACE"
      - name: Verify new source archive and cache permission contracts
        if: steps.control-mode.outputs.complete_governance != 'true'
        run: |
          python3 scripts/package-source-plan.test.py
          python3 scripts/safe-git-archive.test.py
          node scripts/cache-permission-probe.test.cjs
