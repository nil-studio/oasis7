name: Mainnet Packages

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Mainnet release tag, e.g. v0.1.0 or 2026-06-03_v1"
        required: true
        type: string

permissions:
  contents: read

cache-mode: read

concurrency:
  group: mainnet-packages-${{ github.event.inputs.tag }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  RUST_TOOLCHAIN: 1.96.0

jobs:
  plan:
    name: plan-mainnet-package
    cache-mode: none
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      packages: read
    container:
      image: ghcr.io/nil-studio/oasis7/ci-runtime@sha256:3984caa42d82963f93af752bf79e3a07838f2c94279cfbb2deeb08f715cd62c9
      options: --user 1001:1001
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    defaults:
      run:
        shell: bash
    outputs:
      checkoutSha: ${{ steps.source.outputs.checkoutSha }}
      webImageCompatible: ${{ steps.source.outputs.webImageCompatible }}
      resolvedRef: ${{ steps.source.outputs.resolvedRef }}
      sourcePlan: ${{ steps.source.outputs.sourcePlan }}
      ref: ${{ steps.source.outputs.resolvedRef }}
      version: ${{ steps.source.outputs.version }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Trust the checked-out workspace path in the job container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Verify preinstalled Python
        run: python3 -c 'import sys; assert sys.version_info[:2] == (3, 12)'
      - name: Resolve immutable package source
        id: source
        env:
          REQUESTED_REF: ${{ inputs.tag || github.ref }}
        run: python3 scripts/package-source-plan.py --release --release-web-image-source d5319297d754a9c7d4de347a2ce8e1a20ba43591
      - id: plan
        shell: bash
        run: |
          set -euo pipefail
          matrix='{"include":[{"os":"ubuntu-24.04","platform":"linux-x64","asset_name":"oasis7-linux-x64.deb","target_triple":"native"},{"os":"macos-14","platform":"macos-x64","asset_name":"oasis7-macos-x64.dmg","target_triple":"x86_64-apple-darwin"},{"os":"windows-2022","platform":"windows-x64","asset_name":"oasis7-windows-x64.exe","target_triple":"native"}]}'

          {
            echo "matrix=${matrix}"
          } >> "${GITHUB_OUTPUT}"
      - name: Require complete CI for the exact package source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source.outputs.checkoutSha }}
          GITHUB_WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: python3 scripts/ci-full-result.py verify --source "$SOURCE_SHA"

  release_gate_runtime_core:
    name: release-gate-runtime-core
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      OASIS7_WASM_TOOLCHAIN: nightly-2025-12-11
      OASIS7_WASM_TARGET: wasm32-unknown-unknown
      OASIS7_WASM_BUILD_STD: "1"
      OASIS7_WASM_BUILD_STD_COMPONENTS: std,panic_abort
    steps:
      # Use the executing workflow tools before restoring the complete source checkout.
      - name: Check out workflow linker setup
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: .github/actions/setup-linux-mold
      - name: Configure mold for Linux host linking
        uses: ./.github/actions/setup-linux-mold
      # Omitting sparse-checkout disables it and restores the full business source.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.checkoutSha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify planned source HEAD
        shell: bash
        env:
          EXPECTED_SHA: ${{ needs.plan.outputs.checkoutSha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Resolve planned-source product-document range
        shell: bash
        run: |
          set -euo pipefail
          base_oid="$(git rev-parse --verify 'HEAD^1')"
          head_oid="$(git rev-parse --verify 'HEAD^{commit}')"
          printf 'OASIS7_PRODUCT_DOC_BASE=%s\n' "$base_oid" >>"$GITHUB_ENV"
          printf 'OASIS7_PRODUCT_DOC_HEAD=%s\n' "$head_oid" >>"$GITHUB_ENV"
      - name: Install product-document Markdown parser
        run: python3 -m pip install --disable-pip-version-check --requirement scripts/doc-governance-requirements.txt
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install "${RUST_TOOLCHAIN}" --profile default
          rustup default "${RUST_TOOLCHAIN}"
          rustup toolchain install "${OASIS7_WASM_TOOLCHAIN}" --profile minimal --component rust-src
          rustup target add "${OASIS7_WASM_TARGET}" --toolchain "${OASIS7_WASM_TOOLCHAIN}"
          rustup target add wasm32-unknown-unknown --toolchain "${RUST_TOOLCHAIN}"
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            jq \
            netcat-openbsd \
            pkg-config \
            libwayland-dev \
            wayland-protocols \
            libxkbcommon-dev \
            libx11-dev \
            libxi-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxinerama-dev \
            libasound2-dev \
            libudev-dev
      - name: Normalize Rust cache toolchains
        if: hashFiles('scripts/ci-rust-cache-toolchains.py') != ''
        shell: bash
        run: python3 scripts/ci-rust-cache-toolchains.py "$RUST_TOOLCHAIN" "$OASIS7_WASM_TOOLCHAIN"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        if: hashFiles('scripts/ci-rust-cache-toolchains.py') != ''
        with:
          shared-key: ci-shared-native-trusted-v4
          save-if: false
          cache-on-failure: false
          add-rust-environment-hash-key: true
          env-vars: CARGO CC CFLAGS CXX CMAKE RUST OASIS7_WASM
      - name: Run runtime core release gate
        shell: bash
        run: |
          mkdir -p .tmp/release_gate_runtime_core
          ./scripts/ci-tests.sh full-core | tee .tmp/release_gate_runtime_core/ci-tests-full-core.log
      - name: Upload runtime core gate summary
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mainnet-release-gate-runtime-core-summary
          path: .tmp/release_gate_runtime_core
          if-no-files-found: warn

  release_gate_runtime_support:
    name: release-gate-runtime-support
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      OASIS7_WASM_TOOLCHAIN: nightly-2025-12-11
      OASIS7_WASM_TARGET: wasm32-unknown-unknown
