name: Mainnet Packages

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Mainnet release tag, e.g. v0.1.0 or 2026-06-03_v1"
        required: true
        type: string

permissions:
  contents: read

cache-mode: read

concurrency:
  group: mainnet-packages-${{ github.event.inputs.tag }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  RUST_TOOLCHAIN: 1.96.0
  BUILTIN_WASM_TOOLCHAIN: nightly-2025-12-11
  BUILTIN_WASM_TARGET: wasm32-unknown-unknown

jobs:
  plan:
    name: plan-mainnet-package
    runs-on: ubuntu-24.04
    outputs:
      checkoutSha: ${{ steps.source.outputs.checkoutSha }}
      resolvedRef: ${{ steps.source.outputs.resolvedRef }}
      sourcePlan: ${{ steps.source.outputs.sourcePlan }}
      ref: ${{ steps.source.outputs.resolvedRef }}
      version: ${{ steps.source.outputs.version }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve immutable package source
        id: source
        env:
          REQUESTED_REF: ${{ inputs.tag || github.ref }}
        run: python3 scripts/package-source-plan.py --release
      - id: plan
        shell: bash
        run: |
          set -euo pipefail
          matrix='{"include":[{"os":"ubuntu-24.04","platform":"linux-x64","asset_name":"oasis7-linux-x64.deb","target_triple":"native"},{"os":"macos-14","platform":"macos-x64","asset_name":"oasis7-macos-x64.dmg","target_triple":"x86_64-apple-darwin"},{"os":"windows-2022","platform":"windows-x64","asset_name":"oasis7-windows-x64.exe","target_triple":"native"}]}'

          {
            echo "matrix=${matrix}"
          } >> "${GITHUB_OUTPUT}"

  release_gate_runtime_core:
    name: release-gate-runtime-core
    needs: plan
    runs-on: ubuntu-24.04
    env:
      OASIS7_WASM_TOOLCHAIN: nightly-2025-12-11
      OASIS7_WASM_TARGET: wasm32-unknown-unknown
      OASIS7_WASM_BUILD_STD: "1"
      OASIS7_WASM_BUILD_STD_COMPONENTS: std,panic_abort
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.checkoutSha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify planned source HEAD
        shell: bash
        env:
          EXPECTED_SHA: ${{ needs.plan.outputs.checkoutSha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Resolve planned-source product-document range
        shell: bash
        run: |
          set -euo pipefail
          base_oid="$(git rev-parse --verify 'HEAD^1')"
          head_oid="$(git rev-parse --verify 'HEAD^{commit}')"
          printf 'OASIS7_PRODUCT_DOC_BASE=%s\n' "$base_oid" >>"$GITHUB_ENV"
          printf 'OASIS7_PRODUCT_DOC_HEAD=%s\n' "$head_oid" >>"$GITHUB_ENV"
      - name: Install product-document Markdown parser
        run: python3 -m pip install --disable-pip-version-check --requirement scripts/doc-governance-requirements.txt
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install "${RUST_TOOLCHAIN}" --profile default
          rustup default "${RUST_TOOLCHAIN}"
          rustup toolchain install "${OASIS7_WASM_TOOLCHAIN}" --profile minimal --component rust-src
          rustup target add "${OASIS7_WASM_TARGET}" --toolchain "${OASIS7_WASM_TOOLCHAIN}"
          rustup target add wasm32-unknown-unknown --toolchain "${RUST_TOOLCHAIN}"
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            jq \
            netcat-openbsd \
            pkg-config \
            libwayland-dev \
            wayland-protocols \
            libxkbcommon-dev \
            libx11-dev \
            libxi-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxinerama-dev \
            libasound2-dev \
            libudev-dev
      - name: Normalize Rust cache toolchains
        if: hashFiles('scripts/ci-rust-cache-toolchains.py') != ''
        shell: bash
        run: python3 scripts/ci-rust-cache-toolchains.py "$RUST_TOOLCHAIN" "$OASIS7_WASM_TOOLCHAIN"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        if: hashFiles('scripts/ci-rust-cache-toolchains.py') != ''
        with:
          shared-key: ci-shared-native-trusted-v3
          save-if: false
          cache-on-failure: false
          add-rust-environment-hash-key: true
          env-vars: CARGO CC CFLAGS CXX CMAKE RUST OASIS7_WASM
      - name: Run runtime core release gate
        shell: bash
        run: |
          mkdir -p .tmp/release_gate_runtime_core
          ./scripts/ci-tests.sh full-core | tee .tmp/release_gate_runtime_core/ci-tests-full-core.log
      - name: Upload runtime core gate summary
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mainnet-release-gate-runtime-core-summary
          path: .tmp/release_gate_runtime_core
          if-no-files-found: warn

  release_gate_runtime_support:
    name: release-gate-runtime-support
    needs: plan
    runs-on: ubuntu-24.04
    env:
      OASIS7_WASM_TOOLCHAIN: nightly-2025-12-11
      OASIS7_WASM_TARGET: wasm32-unknown-unknown
      OASIS7_WASM_BUILD_STD: "1"
      OASIS7_WASM_BUILD_STD_COMPONENTS: std,panic_abort
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.checkoutSha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify planned source HEAD
        shell: bash
        env:
          EXPECTED_SHA: ${{ needs.plan.outputs.checkoutSha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Resolve planned-source product-document range
        shell: bash
        run: |
          set -euo pipefail
          base_oid="$(git rev-parse --verify 'HEAD^1')"
          head_oid="$(git rev-parse --verify 'HEAD^{commit}')"
          printf 'OASIS7_PRODUCT_DOC_BASE=%s\n' "$base_oid" >>"$GITHUB_ENV"
          printf 'OASIS7_PRODUCT_DOC_HEAD=%s\n' "$head_oid" >>"$GITHUB_ENV"
      - name: Install product-document Markdown parser
        run: python3 -m pip install --disable-pip-version-check --requirement scripts/doc-governance-requirements.txt
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install "${RUST_TOOLCHAIN}" --profile default
          rustup default "${RUST_TOOLCHAIN}"
          rustup toolchain install "${OASIS7_WASM_TOOLCHAIN}" --profile minimal --component rust-src
          rustup target add "${OASIS7_WASM_TARGET}" --toolchain "${OASIS7_WASM_TOOLCHAIN}"
          rustup target add wasm32-unknown-unknown --toolchain "${RUST_TOOLCHAIN}"
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libwayland-dev \
            wayland-protocols \
            libxkbcommon-dev \
            libx11-dev \
            libxi-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxinerama-dev \
            libasound2-dev \
            libudev-dev
      - name: Normalize Rust cache toolchains
        if: hashFiles('scripts/ci-rust-cache-toolchains.py') != ''
        shell: bash
        run: python3 scripts/ci-rust-cache-toolchains.py "$RUST_TOOLCHAIN" "$OASIS7_WASM_TOOLCHAIN"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        if: hashFiles('scripts/ci-rust-cache-toolchains.py') != ''
        with:
          shared-key: ci-shared-native-trusted-v3
          save-if: false
          cache-on-failure: false
          add-rust-environment-hash-key: true
          env-vars: CARGO CC CFLAGS CXX CMAKE RUST OASIS7_WASM
      - name: Run runtime support release gate
        shell: bash
        run: |
          mkdir -p .tmp/release_gate_runtime_support
          ./scripts/ci-tests.sh full-support | tee .tmp/release_gate_runtime_support/ci-tests-full-support.log
      - name: Upload runtime support gate summary
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mainnet-release-gate-runtime-support-summary
          path: .tmp/release_gate_runtime_support
          if-no-files-found: warn

  release_gate_runtime_sync:
    name: release-gate-runtime-sync
    needs: plan
    runs-on: ubuntu-24.04
    env:
      OASIS7_WASM_TOOLCHAIN: nightly-2025-12-11
      OASIS7_WASM_TARGET: wasm32-unknown-unknown
      OASIS7_WASM_BUILD_STD: "1"
      OASIS7_WASM_BUILD_STD_COMPONENTS: std,panic_abort
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.checkoutSha }}
          persist-credentials: false
      - name: Verify planned source HEAD
        shell: bash
        env:
          EXPECTED_SHA: ${{ needs.plan.outputs.checkoutSha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install "${RUST_TOOLCHAIN}" --profile default
          rustup default "${RUST_TOOLCHAIN}"
          rustup toolchain install "${OASIS7_WASM_TOOLCHAIN}" --profile minimal --component rust-src
          rustup target add "${OASIS7_WASM_TARGET}" --toolchain "${OASIS7_WASM_TOOLCHAIN}"
          rustup target add wasm32-unknown-unknown --toolchain "${RUST_TOOLCHAIN}"
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            jq \
            pkg-config \
            libwayland-dev \
            wayland-protocols \
            libxkbcommon-dev \
            libx11-dev \
            libxi-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxinerama-dev \
            libasound2-dev \
            libudev-dev
      - name: Normalize Rust cache toolchains
        if: hashFiles('scripts/ci-rust-cache-toolchains.py') != ''
        shell: bash
        run: python3 scripts/ci-rust-cache-toolchains.py "$RUST_TOOLCHAIN" "$OASIS7_WASM_TOOLCHAIN"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        if: hashFiles('scripts/ci-rust-cache-toolchains.py') != ''
        with:
          shared-key: ci-shared-native-trusted-v3
          save-if: false
          cache-on-failure: false
          add-rust-environment-hash-key: true
          env-vars: CARGO CC CFLAGS CXX CMAKE RUST OASIS7_WASM
      - name: Run runtime sync release gate
        shell: bash
        run: |
          mkdir -p .tmp/release_gate_runtime_sync
          {
            echo "+ ./scripts/sync-m1-builtin-wasm-artifacts.sh --check"
            ./scripts/sync-m1-builtin-wasm-artifacts.sh --check
            echo "+ ./scripts/sync-m4-builtin-wasm-artifacts.sh --check"
            ./scripts/sync-m4-builtin-wasm-artifacts.sh --check
            echo "+ ./scripts/sync-m5-builtin-wasm-artifacts.sh --check"
            ./scripts/sync-m5-builtin-wasm-artifacts.sh --check
          } | tee .tmp/release_gate_runtime_sync/runtime-sync-checks.log
      - name: Upload runtime sync gate summary
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mainnet-release-gate-runtime-sync-summary
          path: .tmp/release_gate_runtime_sync
          if-no-files-found: warn

  release_gate_web:
    name: release-gate-web
    needs: plan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.checkoutSha }}
          persist-credentials: false
      - name: Verify planned source HEAD
        shell: bash
        env:
          EXPECTED_SHA: ${{ needs.plan.outputs.checkoutSha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Install viewer web dependencies
        run: npm ci --prefix crates/oasis7_viewer
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install "${RUST_TOOLCHAIN}" --profile default
          rustup target add wasm32-unknown-unknown --toolchain "${RUST_TOOLCHAIN}"
          rustup default "${RUST_TOOLCHAIN}"
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            netcat-openbsd \
            pkg-config \
            xvfb \
            xauth \
            libwayland-dev \
            wayland-protocols \
            libxkbcommon-dev \
            libx11-dev \
            libxi-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxinerama-dev \
            libasound2-dev \
            libudev-dev
      - name: Normalize Rust cache toolchains
        if: hashFiles('scripts/ci-rust-cache-toolchains.py') != ''
        shell: bash
        run: python3 scripts/ci-rust-cache-toolchains.py "$RUST_TOOLCHAIN"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        if: hashFiles('scripts/ci-rust-cache-toolchains.py') != ''
        with:
          shared-key: release-packages-web-wasm-trusted-v3
          save-if: false
          cache-on-failure: false
      - name: Run web strict release gate
        run: |
          xvfb-run -a ./scripts/release-gate.sh \
            --out-dir .tmp/release_gate_web \
            --skip-ci-full \
            --skip-ci-full-reason mainnet-workflow-runtime-shard-runs-ci-full \
            --skip-sync \
            --skip-sync-reason mainnet-workflow-sync-shards-run-wasm-sync \
            --skip-s9 \
            --skip-s9-reason mainnet-workflow-soak-shard-runs-s9 \
            --skip-s10 \
            --skip-s10-reason mainnet-workflow-soak-shard-runs-s10 \
            --web-headed
      - name: Upload web gate summary
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mainnet-release-gate-web-summary
          path: .tmp/release_gate_web
          if-no-files-found: warn

  release_gate_soak:
    name: release-gate-soak
    needs: plan
    runs-on: ubuntu-24.04
    env:
      OASIS7_WASM_TOOLCHAIN: nightly-2025-12-11
      OASIS7_WASM_TARGET: wasm32-unknown-unknown
      OASIS7_WASM_BUILD_STD: "1"
      OASIS7_WASM_BUILD_STD_COMPONENTS: std,panic_abort
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.checkoutSha }}
          persist-credentials: false
      - name: Verify planned source HEAD
        shell: bash
        env:
          EXPECTED_SHA: ${{ needs.plan.outputs.checkoutSha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install "${RUST_TOOLCHAIN}" --profile default
          rustup default "${RUST_TOOLCHAIN}"
          rustup toolchain install "${OASIS7_WASM_TOOLCHAIN}" --profile minimal --component rust-src
          rustup target add "${OASIS7_WASM_TARGET}" --toolchain "${OASIS7_WASM_TOOLCHAIN}"
          rustup target add wasm32-unknown-unknown --toolchain "${RUST_TOOLCHAIN}"
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            jq \
            pkg-config \
            libwayland-dev \
            wayland-protocols \
            libxkbcommon-dev \
            libx11-dev \
            libxi-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxinerama-dev \
            libasound2-dev \
            libudev-dev
      - name: Normalize Rust cache toolchains
        if: hashFiles('scripts/ci-rust-cache-toolchains.py') != ''
        shell: bash
        run: python3 scripts/ci-rust-cache-toolchains.py "$RUST_TOOLCHAIN" "$OASIS7_WASM_TOOLCHAIN"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        if: hashFiles('scripts/ci-rust-cache-toolchains.py') != ''
        with:
          shared-key: ci-shared-native-trusted-v3
          save-if: false
          cache-on-failure: false
          add-rust-environment-hash-key: true
          env-vars: CARGO CC CFLAGS CXX CMAKE RUST OASIS7_WASM
      - name: Prewarm soak runtime binary
        run: env -u RUSTC_WRAPPER cargo build -p oasis7_chain_runtime --bin oasis7_chain_runtime
      - name: Run soak release gate
        run: |
          ./scripts/release-gate.sh \
            --out-dir .tmp/release_gate_soak \
            --skip-ci-full \
            --skip-ci-full-reason mainnet-workflow-runtime-shard-runs-ci-full \
            --skip-sync \
            --skip-sync-reason mainnet-workflow-sync-shards-run-wasm-sync \
            --skip-web-strict \
            --skip-web-strict-reason mainnet-workflow-web-shard-runs-web-strict
      - name: Upload soak gate summary
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mainnet-release-gate-soak-summary
          path: |
            .tmp/release_gate_soak
            .tmp/release_gate_p2p
            .tmp/release_gate_s10
          if-no-files-found: warn

  release_gate:
    name: release-gate
    if: always()
    needs:
      - release_gate_runtime_core
      - release_gate_runtime_support
      - release_gate_runtime_sync
      - release_gate_web
      - release_gate_soak
    runs-on: ubuntu-24.04
    steps:
      - name: Assert all release gates passed
        env:
          RUNTIME_CORE_RESULT: ${{ needs.release_gate_runtime_core.result }}
          RUNTIME_SUPPORT_RESULT: ${{ needs.release_gate_runtime_support.result }}
          RUNTIME_SYNC_RESULT: ${{ needs.release_gate_runtime_sync.result }}
          WEB_RESULT: ${{ needs.release_gate_web.result }}
          SOAK_RESULT: ${{ needs.release_gate_soak.result }}
        run: |
          failed=0
          for gate in runtime_core runtime_support runtime_sync web soak; do
            upper_name=$(printf '%s' "$gate" | tr '[:lower:]' '[:upper:]')
            result_var="${upper_name}_RESULT"
            result=${!result_var}
            echo "${gate}: ${result}"
            if [[ "$result" != "success" ]]; then
              failed=1
            fi
          done
          if [[ "$failed" -ne 0 ]]; then
            echo "error: one or more release sub-gates failed" >&2
            exit 1
          fi

  build-web-dist:
    name: build-web-dist
    needs:
      - plan
      - release_gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.checkoutSha }}
          persist-credentials: false
      - name: Verify planned source HEAD
        shell: bash
        env:
          EXPECTED_SHA: ${{ needs.plan.outputs.checkoutSha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Install viewer web dependencies
        run: npm ci --prefix crates/oasis7_viewer
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install "${RUST_TOOLCHAIN}" --profile default
          rustup target add wasm32-unknown-unknown --toolchain "${RUST_TOOLCHAIN}"
          rustup default "${RUST_TOOLCHAIN}"
      - name: Normalize Rust cache toolchains
        if: hashFiles('scripts/ci-rust-cache-toolchains.py') != ''
        shell: bash
        run: python3 scripts/ci-rust-cache-toolchains.py "$RUST_TOOLCHAIN"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        if: hashFiles('scripts/ci-rust-cache-toolchains.py') != ''
        with:
          shared-key: release-packages-web-wasm-trusted-v3
          save-if: false
          cache-on-failure: false
      - name: Install trunk
        run: cargo install trunk --locked
      - name: Build web dists
        run: |
          mkdir -p output/mainnet-packages/web-dist output/mainnet-packages/web-launcher-dist output/mainnet-packages/viewer-optional-payload
          (
            ./scripts/build-viewer-software-safe.sh --optional-payload-dir output/mainnet-packages/viewer-optional-payload
            ./scripts/copy-viewer-web-dist.sh \
              --dist-dir output/mainnet-packages/web-dist \
              --optional-payload-dir output/mainnet-packages/viewer-optional-payload
            ./scripts/package-viewer-web-delivery.sh \
              --web-dist output/mainnet-packages/web-dist \
              --optional-payload-dir output/mainnet-packages/viewer-optional-payload \
              --out-file output/mainnet-packages/oasis7-viewer-web-delivery.tar.gz
          )
          (
            cd crates/oasis7_client_launcher
            env -u NO_COLOR trunk build --release --dist ../../output/mainnet-packages/web-launcher-dist
          )
      - name: Upload web dist artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mainnet-web-dists
          path: |
            output/mainnet-packages/web-dist
            output/mainnet-packages/web-launcher-dist
          if-no-files-found: error
      - name: Upload viewer web delivery
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mainnet-viewer-web-delivery
          path: output/mainnet-packages/oasis7-viewer-web-delivery.tar.gz
          if-no-files-found: error

  package-native:
    name: package-${{ matrix.platform }}
    needs:
      - plan
      - build-web-dist
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.checkoutSha }}
          persist-credentials: false
      - name: Verify planned source HEAD
        shell: bash
        env:
          EXPECTED_SHA: ${{ needs.plan.outputs.checkoutSha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Compute Linux package cache save eligibility
        id: linux-package-cache-write
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          cache_write=false
          live_head="$(git rev-parse HEAD)"
          if [[ "${GITHUB_REF}" == "refs/heads/main" && "${live_head}" == "${GITHUB_SHA}" ]]; then
            cache_write=true
          fi
          echo "save=${cache_write}" >> "${GITHUB_OUTPUT}"
      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          rustup toolchain install "${RUST_TOOLCHAIN}" --profile default
          rustup default "${RUST_TOOLCHAIN}"
          if [[ "${{ matrix.target_triple }}" != "native" ]]; then
            rustup target add "${{ matrix.target_triple }}" --toolchain "${RUST_TOOLCHAIN}"
          fi
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libwayland-dev \
            wayland-protocols \
            libxkbcommon-dev \
            libx11-dev \
            libxi-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxinerama-dev \
            libasound2-dev \
            libudev-dev
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        if: runner.os == 'Linux'
        with:
          save-if: false
          shared-key: oasis7-package-native-${{ runner.os }}-${{ matrix.target_triple }}-packaging-trusted-v2
          cache-on-failure: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        if: runner.os != 'Linux'
        with:
          save-if: false
          shared-key: release-packages-package-native-${{ runner.os }}-${{ matrix.target_triple }}-trusted-v2
          cache-on-failure: true
      - name: Download web dist artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mainnet-web-dists
          path: output/mainnet-packages
      - name: Ensure Windows packaging dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $missing = @()
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            $missing += "nsis"
          }
          if ($missing.Count -eq 0) {
            exit 0
          }
          choco install $missing -y --no-progress
      - name: Build launcher bundle
        shell: bash
        run: |
          ./scripts/release-prepare-bundle.sh \
            --platform "${{ matrix.platform }}" \
            --target-triple "${{ matrix.target_triple }}" \
            --web-dist output/mainnet-packages/web-dist \
            --web-launcher-dist output/mainnet-packages/web-launcher-dist \
            --out-dir output/mainnet-packages/assets \
            --profile packaging
      - name: Validate bundle entrypoints
        shell: bash
        run: |
          ./scripts/validate-release-platform-entrypoints.sh \
            --platform "${{ matrix.platform }}" \
            --bundle-dir "output/mainnet-packages/assets/oasis7-${{ matrix.platform }}" \
            | tee "output/mainnet-packages/assets/${{ matrix.platform }}-entrypoint-validation.log"
      - name: Stage bundle manifest
        shell: bash
        run: |
          cp \
            "output/mainnet-packages/assets/oasis7-${{ matrix.platform }}/.oasis7-bundle-manifest.json" \
            "output/mainnet-packages/assets/${{ matrix.platform }}-bundle-manifest.json"
      - name: Write BUILDINFO
        shell: bash
        env:
          SOURCE_PLAN: ${{ needs.plan.outputs.sourcePlan }}
          RELEASE_REF: ${{ needs.plan.outputs.resolvedRef }}
        run: |
          set -euo pipefail
          assets="output/mainnet-packages/assets"
          bundle="${assets}/oasis7-${{ matrix.platform }}"
          buildinfo="${assets}/${{ matrix.platform }}-BUILDINFO"
          printf '%s\n' "$SOURCE_PLAN" > "${assets}/${{ matrix.platform }}-SOURCEPLAN.json"
          {
            echo "workflow=Mainnet Packages"
            echo "network_tier=mainnet"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_number=${GITHUB_RUN_NUMBER}"
            echo "repository=${GITHUB_REPOSITORY}"
            printf 'release_tag=%s\n' "${RELEASE_REF#refs/tags/}"
            echo "commit=$(git rev-parse HEAD)"
            echo "build_profile=packaging"
            echo "package_scope=all_existing"
            echo "platform=${{ matrix.platform }}"
            echo "target_triple=${{ matrix.target_triple }}"
            echo "runner_os=${RUNNER_OS}"
            echo "package_version=${{ needs.plan.outputs.version }}"
            echo "published=false"
          } > "${buildinfo}"

          if [[ "${{ matrix.platform }}" == "linux-x64" ]]; then
            cp "${buildinfo}" "${bundle}/BUILDINFO"
            cd "${bundle}"
            mapfile -t files < <(find . -type f ! -name SHA256SUMS -print | sed 's#^./##' | sort)
            ((${#files[@]} > 0)) || { echo "error: Linux bundle has no files to checksum" >&2; exit 1; }
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "${files[@]}" > SHA256SUMS
            else
              shasum -a 256 "${files[@]}" > SHA256SUMS
            fi
            shasum -a 256 -c SHA256SUMS >/dev/null
          fi
      - name: Package native installer
        shell: bash
        run: |
          ./scripts/package-native-installer.sh \
            --platform "${{ matrix.platform }}" \
            --bundle-dir "output/mainnet-packages/assets/oasis7-${{ matrix.platform }}" \
            --out-dir output/mainnet-packages/assets \
            --asset-name "${{ matrix.asset_name }}" \
            --version "${{ needs.plan.outputs.version }}"
      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd output/mainnet-packages/assets

          checksum() {
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$@"
            else
              shasum -a 256 "$@"
            fi
          }

          files=(
            "${{ matrix.asset_name }}"
            "${{ matrix.platform }}-BUILDINFO"
            "${{ matrix.platform }}-bundle-manifest.json"
            "${{ matrix.platform }}-entrypoint-validation.log"
          )
          files+=("oasis7-${{ matrix.platform }}-ops-tools.tar.gz")

          for file in "${files[@]}"; do
            [[ -f "${file}" ]] || { echo "error: missing mainnet package artifact ${file}" >&2; exit 1; }
          done
          checksum "${files[@]}" > "${{ matrix.platform }}-SHA256SUMS"
      - name: Generate ops package checksum
        shell: bash
        run: |
          set -euo pipefail
          cd output/mainnet-packages/assets
          archive="oasis7-${{ matrix.platform }}-ops-tools.tar.gz"
          [[ -f "${archive}" ]] || { echo "error: missing ops-tools archive ${archive}" >&2; exit 1; }
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${archive}" > "${{ matrix.platform }}-ops-tools-SHA256SUMS"
          else
            shasum -a 256 "${archive}" > "${{ matrix.platform }}-ops-tools-SHA256SUMS"
          fi
      - name: Stage upload directory
        shell: bash
        run: |
          set -euo pipefail
          upload_dir="output/mainnet-packages/upload/${{ matrix.platform }}"
          mkdir -p "${upload_dir}"
          cp "output/mainnet-packages/assets/${{ matrix.asset_name }}" "${upload_dir}/"
          cp "output/mainnet-packages/assets/${{ matrix.platform }}-BUILDINFO" "${upload_dir}/"
          cp "output/mainnet-packages/assets/${{ matrix.platform }}-SOURCEPLAN.json" "${upload_dir}/"
          cp "output/mainnet-packages/assets/${{ matrix.platform }}-SHA256SUMS" "${upload_dir}/"
          cp "output/mainnet-packages/assets/${{ matrix.platform }}-bundle-manifest.json" "${upload_dir}/"
          cp "output/mainnet-packages/assets/${{ matrix.platform }}-entrypoint-validation.log" "${upload_dir}/"
          cp "output/mainnet-packages/assets/oasis7-${{ matrix.platform }}-ops-tools.tar.gz" "${upload_dir}/"
          cp "output/mainnet-packages/assets/${{ matrix.platform }}-ops-tools-SHA256SUMS" "${upload_dir}/"
      - name: Upload mainnet package artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mainnet-package-${{ matrix.platform }}-${{ needs.plan.outputs.version }}
          path: output/mainnet-packages/upload/${{ matrix.platform }}
          if-no-files-found: error

  package-index:
    cache-mode: none
    name: package-index
    needs:
      - plan
      - package-native
      - build-web-dist
    runs-on: ubuntu-24.04
    steps:
      - name: Download mainnet package artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mainnet-package-*
          path: output/mainnet-packages/index
          merge-multiple: true
      - name: Download viewer web delivery
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mainnet-viewer-web-delivery
          path: output/mainnet-packages/index
      - name: Generate aggregate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd output/mainnet-packages/index

          for file in \
            oasis7-linux-x64.deb \
            oasis7-macos-x64.dmg \
            oasis7-windows-x64.exe \
            oasis7-linux-x64-ops-tools.tar.gz \
            oasis7-macos-x64-ops-tools.tar.gz \
            oasis7-windows-x64-ops-tools.tar.gz \
            oasis7-viewer-web-delivery.tar.gz
          do
            [[ -f "${file}" ]] || { echo "error: missing mainnet package artifact ${file}" >&2; exit 1; }
          done

          sha256sum \
            oasis7-linux-x64.deb \
            oasis7-macos-x64.dmg \
            oasis7-windows-x64.exe \
            oasis7-linux-x64-ops-tools.tar.gz \
            oasis7-macos-x64-ops-tools.tar.gz \
            oasis7-windows-x64-ops-tools.tar.gz \
            oasis7-viewer-web-delivery.tar.gz \
            > oasis7-mainnet-checksums.txt
      - name: Upload aggregate mainnet package index
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mainnet-package-index-${{ needs.plan.outputs.version }}
          path: |
            output/mainnet-packages/index/oasis7-mainnet-checksums.txt
            output/mainnet-packages/index/oasis7-viewer-web-delivery.tar.gz
            output/mainnet-packages/index/*-SOURCEPLAN.json
            output/mainnet-packages/index/*-BUILDINFO
            output/mainnet-packages/index/*-SHA256SUMS
            output/mainnet-packages/index/*-bundle-manifest.json
            output/mainnet-packages/index/*-entrypoint-validation.log
          if-no-files-found: error
