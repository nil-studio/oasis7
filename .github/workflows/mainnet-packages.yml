      - name: Upload soak gate summary
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mainnet-release-gate-soak-summary
          path: |
            .tmp/release_gate_soak
            .tmp/release_gate_p2p
            .tmp/release_gate_s10
          if-no-files-found: warn

  release_gate:
    name: release-gate
    if: always()
    needs:
      - release_gate_runtime_core
      - release_gate_runtime_support
      - release_gate_runtime_sync
      - release_gate_web
      - release_gate_soak
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    cache-mode: none
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/nil-studio/oasis7/ci-runtime@sha256:3984caa42d82963f93af752bf79e3a07838f2c94279cfbb2deeb08f715cd62c9
      options: --user 1001:1001
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Assert all release gates passed
        env:
          RUNTIME_CORE_RESULT: ${{ needs.release_gate_runtime_core.result }}
          RUNTIME_SUPPORT_RESULT: ${{ needs.release_gate_runtime_support.result }}
          RUNTIME_SYNC_RESULT: ${{ needs.release_gate_runtime_sync.result }}
          WEB_RESULT: ${{ needs.release_gate_web.result }}
          SOAK_RESULT: ${{ needs.release_gate_soak.result }}
        run: |
          failed=0
          for gate in runtime_core runtime_support runtime_sync web soak; do
            upper_name=$(printf '%s' "$gate" | tr '[:lower:]' '[:upper:]')
            result_var="${upper_name}_RESULT"
            result=${!result_var}
            echo "${gate}: ${result}"
            if [[ "$result" != "success" ]]; then
              failed=1
            fi
          done
          if [[ "$failed" -ne 0 ]]; then
            echo "error: one or more release sub-gates failed" >&2
            exit 1
          fi

  build-web-dist:
    name: build-web-dist
    needs:
      - plan
      - release_gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/nil-studio/oasis7/ci-rust-build@sha256:068f6982d684c23a39e4b52e56f35f307da388c5893c7837c10b5882ec7dd9fb
      options: --user 1001:1001
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    defaults:
      run:
        shell: bash
    env:
      TRUNK_VERSION: 0.21.14
      OASIS7_WASM_TOOLCHAIN: nightly-2025-12-11
    steps:
      # Use the executing workflow tools before restoring the complete source checkout.
      - name: Check out workflow linker setup
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: .github/actions/setup-linux-mold
      - name: Configure mold for Linux host linking
        uses: ./.github/actions/setup-linux-mold
        with:
          install-dir: ${{ runner.temp }}/oasis7-mainnet-web-mold
      - name: Stage the executing workflow's pinned Trunk installer
        env:
          WORKFLOW_TOOLS_SHA: ${{ github.workflow_sha }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD)" = "$WORKFLOW_TOOLS_SHA"
          installer="$RUNNER_TEMP/oasis7-mainnet-install-trunk.sh"
          git show HEAD:scripts/install-ci-trunk.sh > "$installer"
          test -s "$installer"
          chmod 700 "$installer"
      # Omitting sparse-checkout disables it and restores the full business source.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.checkoutSha }}
          persist-credentials: false
      - name: Trust the checked-out workspace path in the job container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Verify planned source HEAD
        shell: bash
        env:
          EXPECTED_SHA: ${{ needs.plan.outputs.checkoutSha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Verify complete planned Web checkout
        run: |
          test -z "$(git ls-files -t | sed -n '/^S /p')"
          git diff --exit-code HEAD --
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Install viewer web dependencies
        run: npm ci --prefix crates/oasis7_viewer
      - name: Verify the preinstalled Rust and WASM target
        run: |
          set -euo pipefail
          test "$(id -u)" = 1001
          # Check the image outside the source tree, which may pin a historical compiler.
          cd "$RUNNER_TEMP"
          export RUSTUP_AUTO_INSTALL=0
          cargo +"$RUST_TOOLCHAIN" --version
          test "$(rustc --version)" = "$(rustc +"$RUST_TOOLCHAIN" --version)"
          rustup target list --installed --toolchain "$RUST_TOOLCHAIN" | grep -Fx wasm32-unknown-unknown
      - name: Keep the planned source's Rust toolchain
        id: source-toolchain
        run: |
          set -euo pipefail
          if RUSTUP_AUTO_INSTALL=0 rustup show active-toolchain; then
            echo "image_toolchain=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Older sources can request a compiler absent from the read-only image.
          image_rustup_home="$RUSTUP_HOME"
          RUSTUP_HOME="$(mktemp -d "$RUNNER_TEMP/oasis7-web-rustup.XXXXXX")"
          export RUSTUP_HOME
          mkdir "$RUSTUP_HOME/toolchains"
          cp "$image_rustup_home/settings.toml" "$RUSTUP_HOME/settings.toml"
          for toolchain in "$image_rustup_home"/toolchains/*; do
            ln -s "$toolchain" "$RUSTUP_HOME/toolchains/"
          done
          rustup toolchain install --no-self-update --no-update --profile default --target wasm32-unknown-unknown
          rustup show active-toolchain
          printf 'RUSTUP_HOME=%s\n' "$RUSTUP_HOME" >> "$GITHUB_ENV"
      - name: Normalize Rust cache toolchains
        if: hashFiles('scripts/ci-rust-cache-toolchains.py') != '' && steps.source-toolchain.outputs.image_toolchain == 'true'
        shell: bash
        run: python3 scripts/ci-rust-cache-toolchains.py "$RUST_TOOLCHAIN" "$OASIS7_WASM_TOOLCHAIN"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        if: hashFiles('scripts/ci-rust-cache-toolchains.py') != '' && steps.source-toolchain.outputs.image_toolchain == 'true'
        with:
          shared-key: mainnet-web-ci-rust-build-068f6982d684c23a39e4b52e56f35f307da388c5893c7837c10b5882ec7dd9fb
          add-rust-environment-hash-key: true
          save-if: false
          cache-on-failure: false
      - name: Install verified pinned Trunk
        shell: bash
        run: bash "$RUNNER_TEMP/oasis7-mainnet-install-trunk.sh" "$RUNNER_TEMP/ci-tools/trunk-x86_64-unknown-linux-gnu.tar.gz" "$RUNNER_TEMP/ci-tools/bin"
      - name: Verify pinned trunk
        shell: bash
        run: |
          set -euo pipefail
          trunk --version | grep -Fqx "trunk ${TRUNK_VERSION}"
      - name: Build web dists
        run: |
          mkdir -p output/mainnet-packages/web-dist output/mainnet-packages/web-launcher-dist output/mainnet-packages/viewer-optional-payload
          (
            ./scripts/build-viewer-software-safe.sh --optional-payload-dir output/mainnet-packages/viewer-optional-payload
            ./scripts/copy-viewer-web-dist.sh \
              --dist-dir output/mainnet-packages/web-dist \
              --optional-payload-dir output/mainnet-packages/viewer-optional-payload
            ./scripts/package-viewer-web-delivery.sh \
              --web-dist output/mainnet-packages/web-dist \
              --optional-payload-dir output/mainnet-packages/viewer-optional-payload \
              --out-file output/mainnet-packages/oasis7-viewer-web-delivery.tar.gz
          )
          (
            cd crates/oasis7_client_launcher
            # Trunk 0.21.14 locks Cargo builds but its separate metadata command needs an adapter.
            real_cargo="$(command -v cargo)"
            cargo_adapter="$(mktemp "$RUNNER_TEMP/oasis7-trunk-cargo.XXXXXX")"
            trap 'rm -f "$cargo_adapter"' EXIT
            cat > "$cargo_adapter" <<'CARGO_ADAPTER'
          #!/usr/bin/env bash
          set -euo pipefail
          if [[ "${1:-}" == metadata ]]; then
            set -- "$@" --locked
          fi
          unset CARGO
          exec "$OASIS7_TRUNK_CARGO" "$@"
          CARGO_ADAPTER
            chmod 700 "$cargo_adapter"
            CARGO="$cargo_adapter" OASIS7_TRUNK_CARGO="$real_cargo" \
              env -u NO_COLOR trunk build --release --locked --dist ../../output/mainnet-packages/web-launcher-dist
          )
      - name: Upload web dist artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mainnet-web-dists
          path: |
            output/mainnet-packages/web-dist
            output/mainnet-packages/web-launcher-dist
          if-no-files-found: error
      - name: Upload viewer web delivery
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mainnet-viewer-web-delivery
          path: output/mainnet-packages/oasis7-viewer-web-delivery.tar.gz
          if-no-files-found: error

  package-native:
    name: package-${{ matrix.platform }}
    needs:
      - plan
      - build-web-dist
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    container:
      image: ${{ matrix.os == 'ubuntu-24.04' && 'ghcr.io/nil-studio/oasis7/ci-rust-build@sha256:68c879968b0a578cbb76874d236998ef1c0b3369e456995ecad7f79ce1f4ba42' || '' }}
      options: --user 1001:1001 --init
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    steps:
      # Use the executing workflow tools before restoring the complete source checkout.
      - name: Check out workflow linker setup
        if: runner.os == 'Linux'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: .github/actions/setup-linux-mold
      - name: Configure mold for Linux host linking
        if: runner.os == 'Linux'
        uses: ./.github/actions/setup-linux-mold
        with:
          install-dir: ${{ runner.temp }}/oasis7-mainnet-native-mold
      # Omitting sparse-checkout disables it and restores the full business source.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.checkoutSha }}
          persist-credentials: false
      - name: Trust the checked-out Linux workspace path
        if: runner.os == 'Linux'
        shell: bash
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Verify planned source HEAD
        shell: bash
        env:
          EXPECTED_SHA: ${{ needs.plan.outputs.checkoutSha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Compute Linux package cache save eligibility
        id: linux-package-cache-write
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          cache_write=false
          live_head="$(git rev-parse HEAD)"
          if [[ "${GITHUB_REF}" == "refs/heads/main" && "${live_head}" == "${GITHUB_SHA}" ]]; then
            cache_write=true
          fi
          echo "save=${cache_write}" >> "${GITHUB_OUTPUT}"
      - name: Install pinned Rust toolchain
        if: runner.os != 'Linux'
        shell: bash
        run: |
          rustup toolchain install "${RUST_TOOLCHAIN}" --profile default
          rustup default "${RUST_TOOLCHAIN}"
          if [[ "${{ matrix.target_triple }}" != "native" ]]; then
            rustup target add "${{ matrix.target_triple }}" --toolchain "${RUST_TOOLCHAIN}"
          fi
      - name: Verify the fixed Linux package toolchain
        id: source-toolchain
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -u):$(id -g)" = 1001:1001
          test -x "${CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER:?verified mold wrapper is required}"
          RUSTUP_AUTO_INSTALL=0 cargo +"$RUST_TOOLCHAIN" --version
          pkg-config --exists wayland-client wayland-protocols xkbcommon x11 xi xcursor xrandr xinerama alsa libudev
          dpkg-deb --version
          if RUSTUP_AUTO_INSTALL=0 rustup show active-toolchain; then
            echo "image_toolchain=true" >> "$GITHUB_OUTPUT"
          else
            # A historical source pin may be absent from the image.
            image_rustup_home="$RUSTUP_HOME"
            RUSTUP_HOME="$(mktemp -d "$RUNNER_TEMP/oasis7-native-rustup.XXXXXX")"
            export RUSTUP_HOME
            mkdir "$RUSTUP_HOME/toolchains"
            cp "$image_rustup_home/settings.toml" "$RUSTUP_HOME/settings.toml"
            for toolchain in "$image_rustup_home"/toolchains/*; do
              ln -s "$toolchain" "$RUSTUP_HOME/toolchains/"
            done
            rustup toolchain install --no-self-update --no-update --profile default
            rustup show active-toolchain
            printf 'RUSTUP_HOME=%s\n' "$RUSTUP_HOME" >> "$GITHUB_ENV"
          fi
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        if: runner.os == 'Linux' && steps.source-toolchain.outputs.image_toolchain == 'true'
        env:
          RUST_PACKAGE_NATIVE_IMAGE: ghcr.io/nil-studio/oasis7/ci-rust-build@sha256:68c879968b0a578cbb76874d236998ef1c0b3369e456995ecad7f79ce1f4ba42
        with:
          save-if: false
          shared-key: oasis7-package-native-linux-x64-packaging-image-68c879968b0a578cbb76874d236998ef1c0b3369e456995ecad7f79ce1f4ba42
          cache-provider: github
          cache-on-failure: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        if: runner.os != 'Linux'
        with:
          save-if: false
          shared-key: release-packages-package-native-${{ runner.os }}-${{ matrix.target_triple }}-trusted-v2
          cache-on-failure: true
      - name: Download web dist artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mainnet-web-dists
          path: output/mainnet-packages
      - name: Ensure Windows packaging dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $missing = @()
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            $missing += "nsis"
          }
          if ($missing.Count -eq 0) {
            exit 0
          }
          choco install $missing -y --no-progress
      - name: Build launcher bundle
        shell: bash
        run: |
          ./scripts/release-prepare-bundle.sh \
            --platform "${{ matrix.platform }}" \
            --target-triple "${{ matrix.target_triple }}" \
            --web-dist output/mainnet-packages/web-dist \
            --web-launcher-dist output/mainnet-packages/web-launcher-dist \
            --out-dir output/mainnet-packages/assets \
            --profile packaging
      - name: Validate bundle entrypoints
        shell: bash
        run: |
          ./scripts/validate-release-platform-entrypoints.sh \
            --platform "${{ matrix.platform }}" \
            --bundle-dir "output/mainnet-packages/assets/oasis7-${{ matrix.platform }}" \
            | tee "output/mainnet-packages/assets/${{ matrix.platform }}-entrypoint-validation.log"
      - name: Stage bundle manifest
        shell: bash
        run: |
          cp \
            "output/mainnet-packages/assets/oasis7-${{ matrix.platform }}/.oasis7-bundle-manifest.json" \
            "output/mainnet-packages/assets/${{ matrix.platform }}-bundle-manifest.json"
      - name: Write BUILDINFO
        shell: bash
        env:
          SOURCE_PLAN: ${{ needs.plan.outputs.sourcePlan }}
          RELEASE_REF: ${{ needs.plan.outputs.resolvedRef }}
        run: |
          set -euo pipefail
          assets="output/mainnet-packages/assets"
          bundle="${assets}/oasis7-${{ matrix.platform }}"
          buildinfo="${assets}/${{ matrix.platform }}-BUILDINFO"
          printf '%s\n' "$SOURCE_PLAN" > "${assets}/${{ matrix.platform }}-SOURCEPLAN.json"
          {
            echo "workflow=Mainnet Packages"
            echo "network_tier=mainnet"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_number=${GITHUB_RUN_NUMBER}"
            echo "repository=${GITHUB_REPOSITORY}"
            printf 'release_tag=%s\n' "${RELEASE_REF#refs/tags/}"
            echo "commit=$(git rev-parse HEAD)"
            echo "build_profile=packaging"
            echo "package_scope=all_existing"
            echo "platform=${{ matrix.platform }}"
            echo "target_triple=${{ matrix.target_triple }}"
            echo "runner_os=${RUNNER_OS}"
            echo "package_version=${{ needs.plan.outputs.version }}"
            echo "published=false"
          } > "${buildinfo}"

          if [[ "${{ matrix.platform }}" == "linux-x64" ]]; then
            cp "${buildinfo}" "${bundle}/BUILDINFO"
            cd "${bundle}"
            mapfile -t files < <(find . -type f ! -name SHA256SUMS -print | sed 's#^./##' | sort)
            ((${#files[@]} > 0)) || { echo "error: Linux bundle has no files to checksum" >&2; exit 1; }
            sha256sum "${files[@]}" > SHA256SUMS
            sha256sum -c SHA256SUMS >/dev/null
          fi
      - name: Package native installer
        shell: bash
        run: |
          ./scripts/package-native-installer.sh \
            --platform "${{ matrix.platform }}" \
            --bundle-dir "output/mainnet-packages/assets/oasis7-${{ matrix.platform }}" \
            --out-dir output/mainnet-packages/assets \
            --asset-name "${{ matrix.asset_name }}" \
            --version "${{ needs.plan.outputs.version }}"
      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd output/mainnet-packages/assets

          checksum() {
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$@"
            else
              shasum -a 256 "$@"
            fi
          }

          files=(
            "${{ matrix.asset_name }}"
            "${{ matrix.platform }}-BUILDINFO"
            "${{ matrix.platform }}-bundle-manifest.json"
            "${{ matrix.platform }}-entrypoint-validation.log"
          )
          files+=("oasis7-${{ matrix.platform }}-ops-tools.tar.gz")

          for file in "${files[@]}"; do
            [[ -f "${file}" ]] || { echo "error: missing mainnet package artifact ${file}" >&2; exit 1; }
          done
          checksum "${files[@]}" > "${{ matrix.platform }}-SHA256SUMS"
      - name: Generate ops package checksum
        shell: bash
        run: |
          set -euo pipefail
          cd output/mainnet-packages/assets
          archive="oasis7-${{ matrix.platform }}-ops-tools.tar.gz"
          [[ -f "${archive}" ]] || { echo "error: missing ops-tools archive ${archive}" >&2; exit 1; }
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${archive}" > "${{ matrix.platform }}-ops-tools-SHA256SUMS"
          else
            shasum -a 256 "${archive}" > "${{ matrix.platform }}-ops-tools-SHA256SUMS"
          fi
      - name: Stage upload directory
        shell: bash
        run: |
          set -euo pipefail
          upload_dir="output/mainnet-packages/upload/${{ matrix.platform }}"
          mkdir -p "${upload_dir}"
          cp "output/mainnet-packages/assets/${{ matrix.asset_name }}" "${upload_dir}/"
          cp "output/mainnet-packages/assets/${{ matrix.platform }}-BUILDINFO" "${upload_dir}/"
          cp "output/mainnet-packages/assets/${{ matrix.platform }}-SOURCEPLAN.json" "${upload_dir}/"
          cp "output/mainnet-packages/assets/${{ matrix.platform }}-SHA256SUMS" "${upload_dir}/"
          cp "output/mainnet-packages/assets/${{ matrix.platform }}-bundle-manifest.json" "${upload_dir}/"
          cp "output/mainnet-packages/assets/${{ matrix.platform }}-entrypoint-validation.log" "${upload_dir}/"
          cp "output/mainnet-packages/assets/oasis7-${{ matrix.platform }}-ops-tools.tar.gz" "${upload_dir}/"
          cp "output/mainnet-packages/assets/${{ matrix.platform }}-ops-tools-SHA256SUMS" "${upload_dir}/"
      - name: Upload mainnet package artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mainnet-package-${{ matrix.platform }}-${{ needs.plan.outputs.version }}
          path: output/mainnet-packages/upload/${{ matrix.platform }}
          if-no-files-found: error

  package-index:
    cache-mode: none
    name: package-index
    needs:
      - plan
      - package-native
      - build-web-dist
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/nil-studio/oasis7/ci-runtime@sha256:3984caa42d82963f93af752bf79e3a07838f2c94279cfbb2deeb08f715cd62c9
      options: --user 1001:1001
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    steps:
      - name: Download mainnet package artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mainnet-package-*
          path: output/mainnet-packages/index
          merge-multiple: true
      - name: Download viewer web delivery
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mainnet-viewer-web-delivery
          path: output/mainnet-packages/index
      - name: Generate aggregate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd output/mainnet-packages/index

          for file in \
            oasis7-linux-x64.deb \
            oasis7-macos-x64.dmg \
            oasis7-windows-x64.exe \
            oasis7-linux-x64-ops-tools.tar.gz \
            oasis7-macos-x64-ops-tools.tar.gz \
            oasis7-windows-x64-ops-tools.tar.gz \
            oasis7-viewer-web-delivery.tar.gz
          do
            [[ -f "${file}" ]] || { echo "error: missing mainnet package artifact ${file}" >&2; exit 1; }
          done

          sha256sum \
            oasis7-linux-x64.deb \
            oasis7-macos-x64.dmg \
            oasis7-windows-x64.exe \
            oasis7-linux-x64-ops-tools.tar.gz \
            oasis7-macos-x64-ops-tools.tar.gz \
            oasis7-windows-x64-ops-tools.tar.gz \
            oasis7-viewer-web-delivery.tar.gz \
            > oasis7-mainnet-checksums.txt
      - name: Upload aggregate mainnet package index
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mainnet-package-index-${{ needs.plan.outputs.version }}
          path: |
            output/mainnet-packages/index/oasis7-mainnet-checksums.txt
            output/mainnet-packages/index/oasis7-viewer-web-delivery.tar.gz
            output/mainnet-packages/index/*-SOURCEPLAN.json
            output/mainnet-packages/index/*-BUILDINFO
            output/mainnet-packages/index/*-SHA256SUMS
            output/mainnet-packages/index/*-bundle-manifest.json
            output/mainnet-packages/index/*-entrypoint-validation.log
          if-no-files-found: error
