name: Runtime support cross-UID image probe

on:
  pull_request:
    types: [opened]
    branches: [codex/engineering-release-runtime-support-probe-base]
    paths: [.github/workflows/release-runtime-support-image-probe.yml]

permissions:
  contents: read
  packages: read
cache-mode: read

jobs:
  cross-uid:
    if: >-
      github.repository == 'nil-studio/oasis7' &&
      github.event.pull_request.base.repo.full_name == github.repository &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.base_ref == 'codex/engineering-release-runtime-support-probe-base' &&
      github.head_ref == 'codex/engineering-release-runtime-support-probe' &&
      github.event.pull_request.draft == true
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      TOOL_SHA: 6549a6314ccb4c32ff4a9ef8894b1a5d444bfe32
      PROTECTED_SHA: 4324e50f95a9dd6a2497d772ca7d00138f67b751
      BUSINESS_SHA: 04f2a3048b192ce06681b474a3d90346183d59f5
      TAG_SHA: a6f9bb785befc9ceb56dd0ee2ce11cfc0e696f32
      RUST_TOOLCHAIN: 1.96.0
      OASIS7_WASM_TOOLCHAIN: nightly-2025-12-11
      OASIS7_WASM_TARGET: wasm32-unknown-unknown
      OASIS7_WASM_BUILD_STD: "1"
      OASIS7_WASM_BUILD_STD_COMPONENTS: std,panic_abort
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      CARGO_NET_RETRY: 10
      CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 6549a6314ccb4c32ff4a9ef8894b1a5d444bfe32
          persist-credentials: false
          sparse-checkout: .github/actions/setup-linux-mold
      - name: Set up the original pinned Linux mold
        uses: ./.github/actions/setup-linux-mold
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 04f2a3048b192ce06681b474a3d90346183d59f5
          fetch-depth: 0
          persist-credentials: false
      - name: Verify immutable business source and original event denial
        run: |
          test "$(git rev-parse HEAD)" = "$BUSINESS_SHA"
          test "$(git rev-parse refs/tags/2026-11-26_v1)" = "$TAG_SHA"
          test "$(git cat-file -t "$TAG_SHA")" = tag
          git show "${TOOL_SHA}:scripts/package-source-plan.py" > "$RUNNER_TEMP/support-source-plan.py"
          TRUSTED_DEFAULT_REF="$PROTECTED_SHA" REQUESTED_REF=refs/tags/2026-11-26_v1 \
            GITHUB_OUTPUT="$RUNNER_TEMP/support-source-plan" \
            /usr/bin/python3 "$RUNNER_TEMP/support-source-plan.py" --release
          grep -Fx "checkoutSha=$BUSINESS_SHA" "$RUNNER_TEMP/support-source-plan"
          launcher="$RUNNER_TEMP/runtime-support-image.py"
          git show "${TOOL_SHA}:scripts/package-release-runtime-support-image.py" > "$launcher"
          GITHUB_OUTPUT="$RUNNER_TEMP/support-image-choice" /usr/bin/python3 "$launcher" select "$BUSINESS_SHA"
          grep -Fx enabled=false "$RUNNER_TEMP/support-image-choice"
      - name: Build and hand off the original Linux game-client ELF
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          /usr/bin/python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          import subprocess
          import tempfile
          import time
          import types

          env = os.environ
          source = env['BUSINESS_SHA']
          path = Path(env['RUNNER_TEMP']) / 'runtime-support-image.py'
          original = path.read_text()
          execution = 'exec ./scripts/ci-tests.sh full-support --full-support-phase "$1"'
          assert original.count(execution) == 1
          # Exercise the unmodified launch and handoff with only the fixed CLI build
          # and a readback. The production selector correctly denied this event.
          narrow = """if [[ "$1" == before-cross-uid ]]; then
            env -u RUSTC_WRAPPER cargo build -p oasis7_game_client --bin oasis7_game_client --locked
          else
            sha256sum target/debug/oasis7_game_client > "$HOME/after.sha256"
          fi"""
          support = types.ModuleType('support')
          exec(compile(original.replace(execution, narrow), str(path), 'exec'), support.__dict__)
          assert not support.protected_context(env, source)
          parent = support.exact_source(support.ROOT, source)
          with tempfile.TemporaryDirectory(dir=env['RUNNER_TEMP'], prefix='runtime-support-probe-') as directory:
              owned = Path(directory)
              scratch = owned / 'image-home'
              scratch.mkdir(mode=0o700)
              try:
                  support.run_host_fixture('0' * 40, owned, env)
              except ValueError as error:
                  assert 'differs from the authorized source' in str(error)
              else:
                  raise ValueError('wrong source accepted by the host fixture')
              config = owned / 'docker'
              config.mkdir(mode=0o700)
              docker_env = {'PATH': env['PATH'], 'DOCKER_CONFIG': str(config)}
              subprocess.run(['docker', 'login', 'ghcr.io', '--username', env['GITHUB_ACTOR'], '--password-stdin'],
                             env=docker_env, input=env.pop('GHCR_TOKEN'), text=True, check=True)
              started = time.monotonic()
              subprocess.run(['docker', 'pull', support.IMAGE], env=docker_env, check=True)
              print(f'Cold image pull seconds={time.monotonic() - started:.3f}', flush=True)
              started = time.monotonic()
              support.image_phase('before-cross-uid', source, parent, scratch, docker_env)
              print(f'Original locked CLI build phase seconds={time.monotonic() - started:.3f}', flush=True)
              support.run_host_fixture(source, owned, env)
              support.image_phase('after-cross-uid', source, parent, scratch, docker_env)
              staged = owned / 'oasis7_game_client'
              with staged.open('rb') as file:
                  digest = hashlib.file_digest(file, 'sha256').hexdigest()
              assert (scratch / 'after.sha256').read_text().split()[0] == digest
              print(f'After-phase image saw the same ELF sha256={digest}', flush=True)
          PY
          git diff --exit-code
          git diff --cached --exit-code
