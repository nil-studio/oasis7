name: Release and Mainnet web image diagnostic

on:
  pull_request:
    branches: [codex/engineering-release-mainnet-web-image-probe-base]
    paths: [.github/workflows/release-mainnet-web-image-probe.yml]
    types: [synchronize]

permissions:
  contents: read
cache-mode: read

env:
  RUST_TOOLCHAIN: 1.96.0
  TRUNK_VERSION: 0.21.14
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  PACKAGING_WORKFLOW_SOURCE: ca0409f1c3c6d052073ef1bb28ad959bc0f0a668
  PLANNED_PACKAGE_SOURCE: 382604b3e57d7ba141ee80d5ec4156295a4ba505

jobs:
  plan:
    if: github.head_ref == 'codex/engineering-release-mainnet-web-image-probe' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      checkoutSha: ${{ steps.source.outputs.checkoutSha }}
      sourcePlan: ${{ steps.source.outputs.sourcePlan }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.PACKAGING_WORKFLOW_SOURCE }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify packaging workflow tooling SHA
        run: test "$(git rev-parse HEAD)" = "$PACKAGING_WORKFLOW_SOURCE"
      - name: Resolve immutable package source
        id: source
        env:
          REQUESTED_REF: ${{ env.PLANNED_PACKAGE_SOURCE }}
        run: python3 scripts/package-source-plan.py

  build-web-dist:
    name: build-web-dist
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/nil-studio/oasis7/ci-rust-build@sha256:068f6982d684c23a39e4b52e56f35f307da388c5893c7837c10b5882ec7dd9fb
      options: --user 1001:1001
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    defaults:
      run:
        shell: bash
    env:
      TRUNK_VERSION: 0.21.14
      OASIS7_WASM_TOOLCHAIN: nightly-2025-12-11
    steps:
      # Use the executing workflow tools before restoring the complete source checkout.
      - name: Check out workflow linker setup
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.PACKAGING_WORKFLOW_SOURCE }}
          persist-credentials: false
          sparse-checkout: .github/actions/setup-linux-mold
      - name: Configure mold for Linux host linking
        uses: ./.github/actions/setup-linux-mold
        with:
          install-dir: ${{ runner.temp }}/oasis7-mainnet-web-mold
      - name: Stage the executing workflow's pinned Trunk installer
        env:
          WORKFLOW_TOOLS_SHA: ${{ env.PACKAGING_WORKFLOW_SOURCE }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD)" = "$WORKFLOW_TOOLS_SHA"
          installer="$RUNNER_TEMP/oasis7-mainnet-install-trunk.sh"
          git show HEAD:scripts/install-ci-trunk.sh > "$installer"
          test -s "$installer"
          chmod 700 "$installer"
      # Omitting sparse-checkout disables it and restores the full business source.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.checkoutSha }}
          persist-credentials: false
      - name: Trust the checked-out workspace path in the job container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Verify planned source HEAD
        shell: bash
        env:
          EXPECTED_SHA: ${{ needs.plan.outputs.checkoutSha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Verify complete planned Web checkout
        run: |
          test -z "$(git ls-files -t | sed -n '/^S /p')"
          git diff --exit-code HEAD --
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Install viewer web dependencies
        run: npm ci --prefix crates/oasis7_viewer
      - name: Verify the preinstalled Rust and WASM target
        run: |
          set -euo pipefail
          test "$(id -u)" = 1001
          # Check the image outside the source tree, which may pin a historical compiler.
          cd "$RUNNER_TEMP"
          export RUSTUP_AUTO_INSTALL=0
          cargo +"$RUST_TOOLCHAIN" --version
          test "$(rustc --version)" = "$(rustc +"$RUST_TOOLCHAIN" --version)"
          rustup target list --installed --toolchain "$RUST_TOOLCHAIN" | grep -Fx wasm32-unknown-unknown
      - name: Keep the planned source's Rust toolchain
        id: source-toolchain
        run: |
          set -euo pipefail
          if RUSTUP_AUTO_INSTALL=0 rustup show active-toolchain; then
            echo "image_toolchain=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Older sources can request a compiler absent from the read-only image.
          image_rustup_home="$RUSTUP_HOME"
          RUSTUP_HOME="$(mktemp -d "$RUNNER_TEMP/oasis7-web-rustup.XXXXXX")"
          export RUSTUP_HOME
          mkdir "$RUSTUP_HOME/toolchains"
          cp "$image_rustup_home/settings.toml" "$RUSTUP_HOME/settings.toml"
          for toolchain in "$image_rustup_home"/toolchains/*; do
            ln -s "$toolchain" "$RUSTUP_HOME/toolchains/"
          done
          rustup toolchain install --no-self-update --no-update --profile default --target wasm32-unknown-unknown
          rustup show active-toolchain
          printf 'RUSTUP_HOME=%s\n' "$RUSTUP_HOME" >> "$GITHUB_ENV"
      - name: Normalize Rust cache toolchains
        if: hashFiles('scripts/ci-rust-cache-toolchains.py') != '' && steps.source-toolchain.outputs.image_toolchain == 'true'
        shell: bash
        run: python3 scripts/ci-rust-cache-toolchains.py "$RUST_TOOLCHAIN" "$OASIS7_WASM_TOOLCHAIN"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        if: hashFiles('scripts/ci-rust-cache-toolchains.py') != '' && steps.source-toolchain.outputs.image_toolchain == 'true'
        with:
          shared-key: mainnet-web-ci-rust-build-068f6982d684c23a39e4b52e56f35f307da388c5893c7837c10b5882ec7dd9fb
          add-rust-environment-hash-key: true
          save-if: false
          cache-on-failure: false
      - name: Install verified pinned Trunk
        shell: bash
        run: bash "$RUNNER_TEMP/oasis7-mainnet-install-trunk.sh" "$RUNNER_TEMP/ci-tools/trunk-x86_64-unknown-linux-gnu.tar.gz" "$RUNNER_TEMP/ci-tools/bin"
      - name: Verify pinned trunk
        shell: bash
        run: |
          set -euo pipefail
          trunk --version | grep -Fqx "trunk ${TRUNK_VERSION}"
      - name: Build web dists
        run: |
          mkdir -p output/mainnet-packages/web-dist output/mainnet-packages/web-launcher-dist output/mainnet-packages/viewer-optional-payload
          (
            ./scripts/build-viewer-software-safe.sh --optional-payload-dir output/mainnet-packages/viewer-optional-payload
            ./scripts/copy-viewer-web-dist.sh \
              --dist-dir output/mainnet-packages/web-dist \
              --optional-payload-dir output/mainnet-packages/viewer-optional-payload
            ./scripts/package-viewer-web-delivery.sh \
              --web-dist output/mainnet-packages/web-dist \
              --optional-payload-dir output/mainnet-packages/viewer-optional-payload \
              --out-file output/mainnet-packages/oasis7-viewer-web-delivery.tar.gz
          )
          (
            cd crates/oasis7_client_launcher
            # Trunk 0.21.14 locks Cargo builds but its separate metadata command needs an adapter.
            real_cargo="$(command -v cargo)"
            cargo_adapter="$(mktemp "$RUNNER_TEMP/oasis7-trunk-cargo.XXXXXX")"
            trap 'rm -f "$cargo_adapter"' EXIT
            cat > "$cargo_adapter" <<'CARGO_ADAPTER'
          #!/usr/bin/env bash
          set -euo pipefail
          if [[ "${1:-}" == metadata ]]; then
            set -- "$@" --locked
          fi
          unset CARGO
          exec "$OASIS7_TRUNK_CARGO" "$@"
          CARGO_ADAPTER
            chmod 700 "$cargo_adapter"
            CARGO="$cargo_adapter" OASIS7_TRUNK_CARGO="$real_cargo" \
              env -u NO_COLOR trunk build --release --locked --dist ../../output/mainnet-packages/web-launcher-dist
          )
      - name: Upload web dist artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mainnet-web-dists
          path: |
            output/mainnet-packages/web-dist
            output/mainnet-packages/web-launcher-dist
          if-no-files-found: error
      - name: Upload viewer web delivery
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mainnet-viewer-web-delivery
          path: output/mainnet-packages/oasis7-viewer-web-delivery.tar.gz
          if-no-files-found: error
      - name: Verify diagnostic source and web artifact integrity
        env:
          SOURCE_PLAN: ${{ needs.plan.outputs.sourcePlan }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PLANNED_PACKAGE_SOURCE"
          git diff --exit-code HEAD --
          python3 - <<'PYTHON'
          import gzip
          import hashlib
          import json
          import os
          import tarfile
          from pathlib import Path

          root = Path("output/mainnet-packages")
          viewer = root / "web-dist"
          launcher = root / "web-launcher-dist"
          archive = root / "oasis7-viewer-web-delivery.tar.gz"
          payload_name = "pixel_world_bridge_bindgen_bg.wasm"

          def digest(path):
              with path.open("rb") as stream:
                  return hashlib.file_digest(stream, "sha256").hexdigest()

          plan = json.loads(os.environ["SOURCE_PLAN"])
          assert plan["checkoutSha"] == plan["requestedRef"] == os.environ["PLANNED_PACKAGE_SOURCE"]
          assert plan["eventSha"] == os.environ["GITHUB_SHA"]
          assert plan["workflowSha"] == os.environ["GITHUB_WORKFLOW_SHA"]
          assert plan["requestedKind"] == "commit"
          for dist in (viewer, launcher):
              assert (dist / "index.html").stat().st_size > 0, dist
              assert any(path.stat().st_size > 0 for path in dist.rglob("*.wasm")), dist
          assert not list(viewer.rglob(payload_name))
          with tarfile.open(archive, "r:gz") as delivery:
              manifest = json.load(delivery.extractfile("optional-payloads.json"))[payload_name]
              assert manifest["available"] is True
              assert manifest["delivery"] == "separate_artifact"
              assert manifest["path"] == f"viewer-optional-payload/{manifest['sha256']}.wasm"
              payload = delivery.extractfile(manifest["path"]).read()
              assert manifest["size_bytes"] == len(payload)
              assert manifest["sha256"] == hashlib.sha256(payload).hexdigest()
              encoding = manifest["encodings"]["gzip"]
              assert encoding["path"] == manifest["path"] + ".gz"
              compressed = delivery.extractfile(encoding["path"]).read()
              assert encoding["size_bytes"] == len(compressed)
              assert gzip.decompress(compressed) == payload
              assert delivery.getmember("index.html").size > 0
          files = {
              str(path.relative_to(root)): digest(path)
              for directory in (viewer, launcher)
              for path in sorted(directory.rglob("*")) if path.is_file()
          }
          files[archive.name] = digest(archive)
          result = {
              "diagnostic_only": True,
              "controller_sha": os.environ["GITHUB_WORKFLOW_SHA"],
              "packaging_workflow_source": os.environ["PACKAGING_WORKFLOW_SOURCE"],
              "plan": plan,
              "cargo_lock_sha256": digest(Path("Cargo.lock")),
              "files": files,
          }
          destination = Path(os.environ["RUNNER_TEMP"]) / "release-mainnet-web-probe.json"
          destination.write_text(json.dumps(result, sort_keys=True, indent=2) + "\n", encoding="utf-8")
          print(f"Verified {len(files)} deliverable SHA-256s on {plan['checkoutSha']}")
          PYTHON
      - name: Upload diagnostic source and checksums
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-mainnet-web-image-probe
          path: ${{ runner.temp }}/release-mainnet-web-probe.json
          if-no-files-found: error
          retention-days: 7

  legacy-toolchain:
    needs: plan
    name: Verify historical source compiler separately
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/nil-studio/oasis7/ci-rust-build@sha256:068f6982d684c23a39e4b52e56f35f307da388c5893c7837c10b5882ec7dd9fb
      options: --user 1001:1001
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    defaults:
      run:
        shell: bash
    env:
      TRUNK_VERSION: 0.21.14
      OASIS7_WASM_TOOLCHAIN: nightly-2025-12-11
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 4eb0fe9099aa91af408e5bb41eddd52d3af3ee0f
          persist-credentials: false
          sparse-checkout: /rust-toolchain.toml
          sparse-checkout-cone-mode: false
      - name: Verify exact historical source and immutable Rust image
        run: |
          test "$(id -u)" = 1001
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD)" = '4eb0fe9099aa91af408e5bb41eddd52d3af3ee0f'
          grep -Fx 'channel = "1.92.0"' rust-toolchain.toml
          test ! -w "$RUSTUP_HOME"
          (cd "$RUNNER_TEMP"; RUSTUP_AUTO_INSTALL=0 rustup toolchain list | sort) > "$RUNNER_TEMP/oasis7-image-toolchains"
          test -s "$RUNNER_TEMP/oasis7-image-toolchains"
          ! grep -q '^1.92.0-' "$RUNNER_TEMP/oasis7-image-toolchains"
      - name: Keep the planned source's Rust toolchain
        id: source-toolchain
        run: |
          set -euo pipefail
          if RUSTUP_AUTO_INSTALL=0 rustup show active-toolchain; then
            echo "image_toolchain=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Older sources can request a compiler absent from the read-only image.
          image_rustup_home="$RUSTUP_HOME"
          RUSTUP_HOME="$(mktemp -d "$RUNNER_TEMP/oasis7-web-rustup.XXXXXX")"
          export RUSTUP_HOME
          mkdir "$RUSTUP_HOME/toolchains"
          cp "$image_rustup_home/settings.toml" "$RUSTUP_HOME/settings.toml"
          for toolchain in "$image_rustup_home"/toolchains/*; do
            ln -s "$toolchain" "$RUSTUP_HOME/toolchains/"
          done
          rustup toolchain install --no-self-update --no-update --profile default --target wasm32-unknown-unknown
          rustup show active-toolchain
          printf 'RUSTUP_HOME=%s\n' "$RUSTUP_HOME" >> "$GITHUB_ENV"
      - name: Verify exact source compiler and original image home
        env:
          IMAGE_TOOLCHAIN: ${{ steps.source-toolchain.outputs.image_toolchain }}
        run: |
          test -z "$IMAGE_TOOLCHAIN"
          [[ "$RUSTUP_HOME" == "$RUNNER_TEMP"/oasis7-web-rustup.* ]]
          rustc --version | grep -E '^rustc 1\.92\.0 '
          rustup target list --installed | grep -Fx wasm32-unknown-unknown
          (cd "$RUNNER_TEMP"; RUSTUP_AUTO_INSTALL=0 RUSTUP_HOME=/opt/oasis7-rust/rustup rustup toolchain list | sort) | diff - "$RUNNER_TEMP/oasis7-image-toolchains"
