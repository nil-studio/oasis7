name: Two exact Node seed timing cases
on:
  pull_request:
    types: [edited]
permissions:
  contents: read
  packages: read
cache-mode: read
concurrency:
  group: node-seed-exact-${{ github.event.pull_request.number }}
  cancel-in-progress: false
env:
  CODE_SHA: 9d572001f2bcd92ff8d03a619d268e920137d812
  CONTROLLER_SHA: ${{ github.event.pull_request.head.sha }}
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  PYTHONDONTWRITEBYTECODE: '1'
  CI_CACHE_REPOSITORY_BUDGET_BYTES: '20000000000'
  CARGO_NET_RETRY: '10'
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  RUST_TOOLCHAIN: 1.96.0
  TRUNK_VERSION: 0.21.14
  OASIS7_WASM_TOOLCHAIN: nightly-2025-12-11
  OASIS7_WASM_TARGET: wasm32-unknown-unknown
  OASIS7_WASM_BUILD_STD: '1'
  OASIS7_WASM_BUILD_STD_COMPONENTS: std,panic_abort
jobs:
  node-seed-exact:
    if: >-
      github.repository == 'nil-studio/oasis7' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == true &&
      github.head_ref == 'codex/engineering-node-seed-two-case-diagnostic-corrected' &&
      github.base_ref == 'codex/engineering-portable-cache-container-cutover' &&
      github.event.changes.title.from == 'Lock corrected two exact Node seed diagnostic cases' &&
      github.event.pull_request.title == 'Observe corrected two exact Node seed cases with original assertions'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container:
      image: ghcr.io/nil-studio/oasis7/ci-rust-build@sha256:bc886637f7bf153dfb60df5c8f56e82949a8f4d9ec2ffd571750eae2fe1a795f
      options: --user 1001:1001
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 9d572001f2bcd92ff8d03a619d268e920137d812
          fetch-depth: 0
          persist-credentials: false
      - name: Trust the original workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Stage only the frozen controller
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CODE_SHA"
          git fetch --no-tags origin "$CONTROLLER_SHA"
          test "$(git diff --name-only "$CODE_SHA" "$CONTROLLER_SHA")" = "$(printf '%s\n' .github/actions/node-seed-exact-diagnostic/run.py .github/workflows/node-seed-exact-diagnostic.yml)"
          git show "$CONTROLLER_SHA:.github/actions/node-seed-exact-diagnostic/run.py" > "$RUNNER_TEMP/node-seed-exact.py"
      - name: Configure the original pinned mold
        uses: ./.github/actions/setup-linux-mold
        with:
          install-dir: ${{ runner.temp }}/oasis7-node-mold
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Verify original preinstalled toolchains
        run: |
          set -euo pipefail
          test "$(id -u):$(id -g)" = 1001:1001
          rustc +"$RUST_TOOLCHAIN" -vV
          rustc +"$OASIS7_WASM_TOOLCHAIN" -vV
          cargo +"$RUST_TOOLCHAIN" clippy --version
          rustup target list --installed --toolchain "$OASIS7_WASM_TOOLCHAIN" | grep -Fx "$OASIS7_WASM_TARGET"
      - name: Stabilize original Rust cache toolchains
        run: python3 scripts/ci-rust-cache-toolchains.py "$RUST_TOOLCHAIN" "$OASIS7_WASM_TOOLCHAIN"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          save-if: false
          shared-key: ci-rust-build-bc886637f7bf153dfb60df5c8f56e82949a8f4d9ec2ffd571750eae2fe1a795f
          add-rust-environment-hash-key: true
          env-vars: CARGO CC CFLAGS CXX CMAKE RUST OASIS7_WASM
          cache-on-failure: false
      - name: Compile once and execute only two original exact cases
        run: python3 "$RUNNER_TEMP/node-seed-exact.py"
      - name: Preserve bounded case observations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: node-seed-exact-${{ github.run_id }}-${{ github.run_attempt }}
          path: node-seed-diagnostic-output
          if-no-files-found: error
          retention-days: 2
