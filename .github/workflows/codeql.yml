name: CodeQL Advisory

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft, closed]
  schedule:
    - cron: '17 */6 * * *'
    - cron: '29 3 * * *'
    - cron: '43 18 * * *'
  workflow_dispatch:
    inputs:
      profile:
        type: choice
        options: [default, extended]
        default: default

permissions:
  contents: read

# Only this PR is superseded. Maintenance runs do not share a pending bucket.
concurrency:
  group: oasis7-codeql-run-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

cache-mode: read

jobs:
  plan:
    name: CodeQL / plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has_units: ${{ steps.plan.outputs.has_units }}
      profile: ${{ steps.plan.outputs.profile }}
      status: ${{ steps.plan.outputs.status }}
      checkout: ${{ steps.plan.outputs.checkout }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4, official tag resolved 2026-10-01
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: plan
        name: Plan from trusted base in isolated Python
        env:
          CODEQL_MODE: ${{ vars.OASIS7_CODEQL_MODE || 'off' }}
          CODEQL_SLOTS: ${{ vars.OASIS7_CODEQL_MAX_SLOTS || '2' }}
          CODEQL_PROFILE: ${{ inputs.profile || 'default' }}
          CODEQL_BATCH_MODES: ${{ vars.OASIS7_CODEQL_BATCH_MODES || '{}' }}
        shell: bash
        run: |
          python3 -I - <<'PY'
          import json, os, pathlib, subprocess, tempfile
          event = json.loads(pathlib.Path(os.environ['GITHUB_EVENT_PATH']).read_text())
          kind = os.environ['GITHUB_EVENT_NAME']
          mode, slots = os.environ['CODEQL_MODE'], os.environ['CODEQL_SLOTS']
          if mode not in ('off', 'baseline', 'observe') or slots not in ('1', '2'):
              raise SystemExit('invalid CodeQL operational mode/slot configuration')
          allowed = {'actions-repo': 'actions', 'python-repo': 'python',
                     'javascript-repo': 'javascript-typescript', 'rust-repo': 'rust'}
          def unique(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise SystemExit('duplicate CodeQL batch key')
                  result[key] = value
              return result
          batches = json.loads(os.environ['CODEQL_BATCH_MODES'] or '{}', object_pairs_hook=unique)
          keys = {u + '/' + p for u in allowed for p in ('default', 'extended')}
          if not isinstance(batches, dict) or any(k not in keys or v not in ('baseline', 'observe')
                  or (k.endswith('/extended') and v == 'observe') for k, v in batches.items()):
              raise SystemExit('invalid CodeQL batch modes')
          default = event['repository']['default_branch']
          pr = event.get('pull_request', {})
          profile, scope = os.environ['CODEQL_PROFILE'], 'all'
          if kind == 'schedule':
              schedules = {'17 */6 * * *': ('default', 'non-rust'),
                           '29 3 * * *': ('default', 'rust'), '43 18 * * *': ('extended', 'all')}
              if event.get('schedule') not in schedules:
                  raise SystemExit('unknown CodeQL maintenance schedule')
              profile, scope = schedules[event['schedule']]
          if kind == 'pull_request':
              profile = 'default'
          if profile not in ('default', 'extended'):
              raise SystemExit('invalid CodeQL profile')
          def in_scope(unit):
              return scope == 'all' or (unit == 'rust-repo') == (scope == 'rust')
          def timeout_minutes(language):
              if language == 'rust' and profile == 'default' and kind != 'pull_request':
                  return 90
              return 45 if language == 'rust' or profile == 'extended' else 20
          checkout = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          if checkout != os.environ['GITHUB_SHA']:
              raise SystemExit('actual checkout differs from event analysis identity')
          base = pr.get('base', {}).get('sha', checkout)
          head = pr.get('head', {}).get('sha', checkout)
          inactive = (mode == 'off' or (kind == 'pull_request' and
                      (mode != 'observe' or pr.get('draft') or event.get('action') in ('closed', 'converted_to_draft'))))
          if kind != 'pull_request' and os.environ['GITHUB_REF'] != 'refs/heads/' + default:
              raise SystemExit('maintenance scan requires trusted default branch')
          plan = {'schema': 'oasis7-codeql-plan/v1', 'profile': profile, 'maintenance_scope': scope,
                  'status': 'disabled', 'identity': {'event_base': base, 'source_head': head, 'checkout': checkout},
                  'matrix': {'include': []}, 'selected_units': [], 'batch_modes': batches,
                  'candidate_units': [], 'not_selected_reasons': {u: 'global_or_event_disabled' for u in allowed}}
          if not inactive:
              for identity in (base, head):
                  subprocess.run(['git', 'cat-file', '-e', identity + '^{commit}'], check=True)
              # No candidate planner/policy is imported or executed, including on first introduction.
              with tempfile.TemporaryDirectory(dir=os.environ['RUNNER_TEMP']) as folder:
                  trusted = pathlib.Path(folder)
                  available = True
                  for name in ('codeql-plan.py', 'codeql-policy.json'):
                      result = subprocess.run(['git', 'show', base + ':scripts/security/' + name], capture_output=True)
                      if result.returncode:
                          available = False
                          break
                      (trusted / name).write_bytes(result.stdout)
                  if available:
                      out = trusted / 'plan.json'
                      command = ['python3', '-I', str(trusted / 'codeql-plan.py'), '--repo-root', os.getcwd(),
                                 '--base', base, '--head', head, '--checkout', checkout, '--profile', profile,
                                 '--policy', str(trusted / 'codeql-policy.json'), '--output', str(out),
                                 '--mode', mode, '--event', kind, '--default-branch', default,
                                 '--pr-number', str(pr.get('number', 0)), '--max-slots', slots,
                                 '--batch-modes', json.dumps(batches)]
                      if kind != 'pull_request':
                          # A PR may still run the previous trusted-base CLI.
                          command.extend(['--full', '--maintenance-scope', scope])
                      subprocess.run(command, check=True, cwd=trusted)
                      plan = json.loads(out.read_text())
                  else:
                      # Fixed full-context candidates; operational batches still constrain bootstrap.
                      units = list(allowed.items())
                      selected = [u for u in allowed if batches.get(u + '/' + profile) and in_scope(u) and
                                  (kind != 'pull_request' or batches[u + '/' + profile] == 'observe')]
                      plan.update(status='selected' if selected else 'disabled', selected_units=selected,
                                  candidate_units=list(allowed), not_selected_reasons={u: 'batch_disabled'
                                      if u + '/' + profile not in batches else
                                      ('maintenance_scope' if not in_scope(u) else 'pr_baseline_only')
                                      for u in allowed if u not in selected},
                                  fallback_reasons=['trusted-base planner unavailable: four-language candidates'])
                      plan['matrix']['include'] = [dict(unit=u, language=lang, slot=i % int(slots),
                          category='oasis7/' + u + '/' + profile, build_mode='none',
                          queries='security-extended' if profile == 'extended' else '',
                          timeout_minutes=timeout_minutes(lang))
                          for i, (u, lang) in enumerate(units) if u in selected]
          if plan['identity']['checkout'] != checkout or plan.get('profile') != profile:
              raise SystemExit('planner identity/profile mismatch')
          rows = plan['matrix']['include']
          if plan.get('batch_modes') != batches:
              raise SystemExit('planner batch configuration mismatch')
          if plan['status'] not in ('selected', 'disabled', 'not_applicable') or bool(rows) != (plan['status'] == 'selected'):
              raise SystemExit('invalid planner status/matrix')
          for row in rows:
              batch_mode = batches.get(row['unit'] + '/' + profile)
              if (inactive or batch_mode is None or not in_scope(row['unit']) or
                  (kind == 'pull_request' and batch_mode != 'observe') or
                  allowed.get(row['unit']) != row['language'] or row['slot'] not in range(int(slots)) or
                  row['category'] != 'oasis7/' + row['unit'] + '/' + profile or row['build_mode'] != 'none' or
                  row['queries'] != ('security-extended' if profile == 'extended' else '') or
                  row.get('timeout_minutes') != timeout_minutes(row['language'])):
                  raise SystemExit('planner matrix contract mismatch')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              for key, value in {'matrix': json.dumps(plan['matrix'], separators=(',', ':')),
                                 'has_units': str(bool(rows)).lower(), 'profile': profile,
                                 'status': plan['status'], 'checkout': checkout}.items():
                  output.write(key + '=' + value + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('CodeQL plan (diagnostic; no merge authority)\n```json\n' + json.dumps(plan, indent=2) + '\n```\n')
          PY

  analyze:
    name: CodeQL / ${{ matrix.unit }} / ${{ needs.plan.outputs.profile }}
    needs: plan
    if: needs.plan.outputs.has_units == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.timeout_minutes }}
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    concurrency:
      group: oasis7-codeql-scan-slot-${{ matrix.slot }}
      queue: max
      cancel-in-progress: false
    env:
      RUSTC_WRAPPER: ''
      RUSTUP_TOOLCHAIN: '1.96.0'
      CODEQL_EXTRACTOR_RUST_OPTION_CARGO_ALL_TARGETS: ${{ matrix.language == 'rust' && 'true' || 'false' }}
      CODEQL_EXTRACTOR_RUST_OPTION_EXTRA_INCLUDES: ${{ matrix.language == 'rust' && format('["{0}/crates/oasis7_builtin_wasm_modules/_templates"]', github.workspace) || '[]' }}
      CODEQL_EXTRACTOR_JAVASCRIPT_ALLOW_MINIFIED_FILES: ${{ matrix.language == 'javascript-typescript' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.checkout }}
          persist-credentials: false
      - name: Confirm actual analysis checkout
        env:
          EXPECTED_CHECKOUT: ${{ needs.plan.outputs.checkout }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_CHECKOUT"
      - name: Minimal stable Rust extraction toolchain
        if: matrix.language == 'rust'
        run: rustup toolchain install 1.96.0 --profile minimal
      - id: rust_native
        name: Prepare Rust native extraction prerequisites
        if: matrix.language == 'rust'
        timeout-minutes: 5
        run: |
          python3 -I - <<'PY'
          import importlib.util, json, os, pathlib, sys, time
          source = pathlib.Path(os.environ['GITHUB_WORKSPACE'])
          helpers = source / 'scripts/security'
          sys.path.insert(0, str(helpers))
          spec = importlib.util.spec_from_file_location('native_prerequisites', helpers / 'codeql-rust-cargo-check.py')
          native = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(native)
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'codeql-rust-native'
          out.mkdir(exist_ok=False)
          native.runtime.CAP, native.runtime.WRITE_CAP = 16 * 1024**2, 15 * 1024**2
          env = {key: value for key, value in os.environ.items()
                 if key not in ('GH_TOKEN', 'GITHUB_TOKEN', 'RUSTC_WRAPPER')}
          started = time.monotonic()
          terminal = {'status': 'FAILED', 'preparation_budget_seconds': 180}
          try:
              native.prepare_native(source, out, started + 270, env)
              terminal['status'] = 'PASS'
          except Exception as error:
              terminal.update(error_type=type(error).__name__, error=str(error))
              raise
          finally:
              terminal['elapsed_seconds'] = time.monotonic() - started
              (out / 'native-terminal.json').write_text(json.dumps(terminal, sort_keys=True) + '\n')
          PY
      - id: rust_tools
        name: Verify the pinned Rust default production bundle
        if: matrix.language == 'rust' && needs.plan.outputs.profile == 'default' && github.event_name != 'pull_request'
        timeout-minutes: 5
        run: |
          mkdir "$RUNNER_TEMP/codeql-rust-production-tools"
          curl --fail --location --connect-timeout 20 --max-time 240 \
            https://github.com/github/codeql-action/releases/download/codeql-bundle-v2.27.4/codeql-bundle-rust-linux64.tar.zst \
            --output "$RUNNER_TEMP/codeql-rust-production-tools/bundle.tar.zst"
          echo "1c2f867094b80e43c9a0e511090e57e0ea3bf107600b4b3763c52b9020b4ec4b  $RUNNER_TEMP/codeql-rust-production-tools/bundle.tar.zst" | sha256sum --check
          echo "tools_path=$RUNNER_TEMP/codeql-rust-production-tools/bundle.tar.zst" >> "$GITHUB_OUTPUT"
      - id: init
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4, official tag resolved 2026-10-01
        env:
          CODEQL_OVERLAY_DATABASE_MODE: ${{ steps.rust_tools.outcome == 'success' && 'none' || '' }}
        with:
          tools: ${{ steps.rust_tools.outputs.tools_path }}
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build_mode }}
          db-location: ${{ runner.temp }}/codeql_databases
          queries: ${{ matrix.language == 'actions' && format('./scripts/security/codeql-actions/{0}.qls', needs.plan.outputs.profile) || matrix.queries }}
          dependency-caching: false
          trap-caching: ${{ steps.rust_tools.outcome == 'success' && 'false' || '' }}
          config: |
            disable-default-queries: ${{ matrix.language == 'actions' }}
            paths-ignore:
              - third_party/**
              - target/**
              - node_modules/**
              - dist/**
              - .pm/**
              - tools/oasis7-command-center/src-tauri/src/generated_context.rs
              - crates/oasis7_runtime/src/tests/agent_cognition_live_persistence_projection_fixture.rs
      - name: Verify Actions query compatibility and cache-mode boundaries
        if: matrix.language == 'actions'
        timeout-minutes: 5
        env:
          CODEQL_BIN: ${{ steps.init.outputs.codeql-path }}
          CODEQL_PROFILE: ${{ needs.plan.outputs.profile }}
        run: |
          python3 scripts/security/codeql-actions/model.test.py --codeql "$CODEQL_BIN" \
            --initialized-suite "$RUNNER_TEMP/codeql_databases/actions/temp/config-queries.qls" \
            --profile "$CODEQL_PROFILE"
      - id: rust_budget
        name: Reserve Rust upload time within the actual job budget
        if: matrix.language == 'rust' && needs.plan.outputs.profile == 'default' && github.event_name != 'pull_request'
        timeout-minutes: 1
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_CHECKOUT: ${{ needs.plan.outputs.checkout }}
        run: |
          python3 -I - <<'PY'
          import datetime, email.utils, json, os, pathlib, time, urllib.request
          url = ('https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY'] +
                 '/actions/runs/' + os.environ['GITHUB_RUN_ID'] + '/attempts/' +
                 os.environ['GITHUB_RUN_ATTEMPT'] + '/jobs?per_page=100')
          request = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
              'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'})
          requested = time.monotonic()
          with urllib.request.urlopen(request, timeout=20) as response:
              server_date = response.headers['Date']
              value = json.load(response)
          request_seconds = time.monotonic() - requested
          server_time = email.utils.parsedate_to_datetime(server_date)
          jobs = [job for job in value['jobs'] if job['name'] == 'CodeQL / rust-repo / default'
                  and job['status'] == 'in_progress']
          if value['total_count'] > 100 or len(jobs) != 1 or not jobs[0].get('started_at'):
              raise SystemExit('unknown actual Rust job start')
          started = datetime.datetime.fromisoformat(jobs[0]['started_at'].replace('Z', '+00:00'))
          if server_time.tzinfo is None or started.tzinfo is None:
              raise SystemExit('invalid GitHub job clock')
          age = server_time.timestamp() - started.timestamp() + request_seconds + 1
          if not 0 <= age < 5400:
              raise SystemExit('invalid or exhausted Rust job clock')
          minutes = min(75, int((5400 - age - 600) // 60))
          if minutes < 1:
              raise SystemExit('no Rust analysis budget after upload reserve')
          allocated = time.time()
          deadline = allocated + minutes * 60
          receipt = dict(job_id=jobs[0]['id'], started_at=jobs[0]['started_at'], github_date=server_date,
                         job_age_upper_seconds=age, job_budget_seconds=5400,
                         analysis_allocated_minutes=minutes, analysis_deadline=deadline,
                         analysis_allocated_at=allocated, fixed_job_deadline=allocated + 5400 - age,
                         mode='rust-default-production', source_sha=os.environ['EXPECTED_CHECKOUT'],
                         post_analysis_reserve_seconds=600, helper_terminal_and_upload_reserve_seconds=90)
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'codeql-rust-production-budget.json'
          with path.open('x') as output:
              json.dump(receipt, output, sort_keys=True)
              output.write('\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
              output.write('Rust analysis budget\n```json\n' + json.dumps(receipt, indent=2) + '\n```\n')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('analysis_minutes=' + str(minutes) + '\n')
              output.write('analysis_deadline=' + str(deadline) + '\n')
          PY
      - id: rust_prepare
        name: Prepare the fixed Rust libraries and current source inventory
        if: steps.rust_budget.outcome == 'success'
        timeout-minutes: ${{ steps.rust_budget.outputs.analysis_minutes && fromJSON(steps.rust_budget.outputs.analysis_minutes) || 1 }}
        env:
          CODEQL_BIN: ${{ steps.init.outputs.codeql-path }}
          EXPECTED_CHECKOUT: ${{ needs.plan.outputs.checkout }}
          RUST_ANALYSIS_DEADLINE: ${{ steps.rust_budget.outputs.analysis_deadline }}
        run: |
          python3 scripts/security/codeql-rust-production.py prepare \
            --codeql "$CODEQL_BIN" --source "$GITHUB_WORKSPACE" --source-sha "$EXPECTED_CHECKOUT" \
            --database "$RUNNER_TEMP/codeql_databases/rust" \
            --work "$RUNNER_TEMP/codeql-rust-production-work" \
            --output "$RUNNER_TEMP/codeql-rust-production-evidence" \
            --sarif "$RUNNER_TEMP/codeql-results/rust.sarif" \
            --analysis-deadline "$RUST_ANALYSIS_DEADLINE"
      - id: analyze
        name: CodeQL extraction and queries
        timeout-minutes: ${{ steps.rust_prepare.outputs.analysis_minutes && fromJSON(steps.rust_prepare.outputs.analysis_minutes) || matrix.timeout_minutes }}
        env:
          RUST_LOG: ${{ steps.rust_tools.outcome == 'success' && 'single_arch_extractor=info,codeql_extractor=info,ra_ap_load_cargo=debug' || '' }}
          NODE_OPTIONS: ${{ steps.rust_prepare.outputs.node_options }}
          OASIS7_CODEQL_PRODUCTION_MODE: ${{ steps.rust_tools.outcome == 'success' && 'rust-default-production' || '' }}
          OASIS7_CODEQL_PRODUCTION_SOURCE: ${{ needs.plan.outputs.checkout }}
          RUST_ANALYSIS_DEADLINE: ${{ steps.rust_budget.outputs.analysis_deadline }}
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          category: ${{ matrix.category }}
          output: ${{ runner.temp }}/codeql-results
          upload: never
          skip-queries: ${{ steps.rust_tools.outcome == 'success' }}
          upload-database: ${{ steps.rust_tools.outcome == 'success' && 'false' || 'true' }}
      - id: rust_production
        name: Run and verify all default Rust queries with the fixed libraries
        if: always() && steps.rust_prepare.outcome == 'success'
        env:
          CODEQL_BIN: ${{ steps.init.outputs.codeql-path }}
          EXPECTED_CHECKOUT: ${{ needs.plan.outputs.checkout }}
          RUST_ANALYSIS_DEADLINE: ${{ steps.rust_budget.outputs.analysis_deadline }}
          EXTRACTION_OUTCOME: ${{ steps.analyze.outcome }}
        run: |
          python3 scripts/security/codeql-rust-production.py run \
            --codeql "$CODEQL_BIN" --source "$GITHUB_WORKSPACE" --source-sha "$EXPECTED_CHECKOUT" \
            --database "$RUNNER_TEMP/codeql_databases/rust" \
            --work "$RUNNER_TEMP/codeql-rust-production-work" \
            --output "$RUNNER_TEMP/codeql-rust-production-evidence" \
            --sarif "$RUNNER_TEMP/codeql-results/rust.sarif" \
            --analysis-deadline "$RUST_ANALYSIS_DEADLINE" --extraction-outcome "$EXTRACTION_OUTCOME"
      - id: execution
        name: Combine extraction and query execution outcomes
        if: always()
        env:
          RUST_PREPARATION: ${{ steps.rust_prepare.outcome }}
          EXTRACTION: ${{ steps.analyze.outcome }}
          RUST_QUERIES: ${{ steps.rust_production.outcome }}
          PATCHED_RUST: ${{ matrix.language == 'rust' && needs.plan.outputs.profile == 'default' && github.event_name != 'pull_request' && 'true' || 'false' }}
        run: |
          python3 -I - <<'PY'
          import os
          status = os.environ['EXTRACTION']
          if os.environ['PATCHED_RUST'] == 'true':
              preparation = os.environ['RUST_PREPARATION']
              if preparation in ('failure', 'cancelled'):
                  status = preparation
              elif status == 'success':
                  status = os.environ['RUST_QUERIES'] if preparation == 'success' else preparation
          if status not in ('success', 'failure', 'cancelled', 'skipped'):
              raise SystemExit('unknown CodeQL execution outcome')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('status=' + status + '\n')
          PY
      - id: upload
        name: CodeQL SARIF upload
        if: success() && steps.execution.outputs.status == 'success'
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          sarif_file: ${{ runner.temp }}/codeql-results
          category: ${{ matrix.category }}
          ref: ${{ github.ref }}
          sha: ${{ needs.plan.outputs.checkout }}
          wait-for-processing: true
      - name: Record execution separately from upload and findings
        if: always()
        env:
          UNIT: ${{ matrix.unit }}
          CATEGORY: ${{ matrix.category }}
          CHECKOUT: ${{ needs.plan.outputs.checkout }}
          EXECUTION: ${{ steps.execution.outputs.status }}
          UPLOAD: ${{ steps.upload.outcome }}
          VERSION: ${{ steps.init.outputs.codeql-version }}
        run: |
          python3 -I - <<'PY'
          import json, os
          value = {key.lower(): os.environ[key] for key in ('UNIT', 'CATEGORY', 'CHECKOUT', 'EXECUTION', 'UPLOAD', 'VERSION')}
          value['finding_status'] = 'unknown: read native Security results; job success does not mean zero findings'
          value['coverage_status'] = 'pending hosted manifest/extraction/control-sample verification'
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write('```json\n' + json.dumps(value, indent=2) + '\n```\n')
          PY

      - name: Record upload association evidence
        if: always()
        env:
          UNIT: ${{ matrix.unit }}
          PROFILE: ${{ needs.plan.outputs.profile }}
          CATEGORY: ${{ matrix.category }}
          CHECKOUT: ${{ needs.plan.outputs.checkout }}
          EXECUTION: ${{ steps.execution.outputs.status }}
          UPLOAD: ${{ steps.upload.outcome }}
          SARIF_ID: ${{ steps.upload.outputs.sarif-id }}
        run: |
          python3 -I - <<'PY'
          import json, os, pathlib
          env = os.environ
          value = {
              'schema': 'oasis7-codeql-upload-evidence/v1',
              'repository': env['GITHUB_REPOSITORY'],
              'workflow_path': '.github/workflows/codeql.yml',
              'workflow_ref': env['GITHUB_WORKFLOW_REF'],
              'workflow_sha': env['GITHUB_WORKFLOW_SHA'],
              'run_id': int(env['GITHUB_RUN_ID']),
              'run_attempt': int(env['GITHUB_RUN_ATTEMPT']),
              'job_key': env['GITHUB_JOB'],
              'job_name': 'CodeQL / ' + env['UNIT'] + ' / ' + env['PROFILE'],
              'checkout_sha': env['CHECKOUT'],
              'ref': env['GITHUB_REF'],
              'unit': env['UNIT'], 'profile': env['PROFILE'], 'category': env['CATEGORY'],
              'execution_status': env['EXECUTION'], 'upload_status': env['UPLOAD'],
              'upload_sarif_id': env['SARIF_ID'] if env['UPLOAD'] == 'success' else '',
          }
          folder = pathlib.Path(env['RUNNER_TEMP']) / 'codeql-upload-evidence'
          folder.mkdir(exist_ok=True)
          (folder / 'evidence.json').write_text(json.dumps(value, sort_keys=True, separators=(',', ':')) + '\n')
          PY
      - name: Persist upload association evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: oasis7-codeql-upload-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.unit }}-${{ needs.plan.outputs.profile }}
          path: ${{ runner.temp }}/codeql-upload-evidence/evidence.json
          if-no-files-found: error
          overwrite: false
          retention-days: 7
      - name: Persist Rust production evidence
        if: always() && matrix.language == 'rust' && needs.plan.outputs.profile == 'default' && github.event_name != 'pull_request' && steps.rust_prepare.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: oasis7-codeql-rust-production-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/codeql-rust-production-evidence
          include-hidden-files: true
          if-no-files-found: error
          overwrite: false
          retention-days: 7
      - name: Persist Rust native preparation evidence
        if: always() && matrix.language == 'rust' && steps.rust_native.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: oasis7-codeql-native-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.unit }}-${{ needs.plan.outputs.profile }}
          path: ${{ runner.temp }}/codeql-rust-native
          if-no-files-found: error
          overwrite: false
          retention-days: 7

  summary:
    name: CodeQL / summary
    needs: [plan, analyze]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Preserve actual plan and scan conclusions
        env:
          PLAN: ${{ needs.plan.result }}
          STATUS: ${{ needs.plan.outputs.status }}
          ANALYZE: ${{ needs.analyze.result }}
        run: |
          printf 'CodeQL plan: %s (%s)\nScan jobs: %s\nFinding status: unknown; see native Security.\n' "$PLAN" "$STATUS" "$ANALYZE" >> "$GITHUB_STEP_SUMMARY"
