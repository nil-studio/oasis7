name: CI Base Images

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - docker/ci-base/**
      - scripts/ci-browser-tools/package.json
      - scripts/ci-browser-tools/package-lock.json
      - .github/workflows/ci-base-images.yml
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    if: (github.event_name == 'pull_request' && !github.event.pull_request.draft) || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    strategy:
      matrix:
        target: [runtime, build, browser, rust-build, rust-wasm-build]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Build and smoke test
        env:
          TARGET: ${{ matrix.target }}
        run: ./docker/ci-base/build.sh "$TARGET"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        if: github.event_name == 'pull_request' && matrix.target == 'build'
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Probe custody GDB contracts in candidate image
        if: github.event_name == 'pull_request' && matrix.target == 'build'
        timeout-minutes: 8
        run: |
          set -euo pipefail
          node_home=$(dirname "$(dirname "$(command -v node)")")
          docker run --rm --network none \
            --user "$(id -u):$(id -g)" \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/workspace,readonly" \
            --mount "type=bind,source=$node_home,target=/opt/node,readonly" \
            --workdir /workspace \
            --env OASIS7_GDB_CONTRACT_RESULTS=/tmp/oasis7-gdb-contracts \
            --env OASIS7_REQUIRE_GDB_TESTS=1 \
            --env PYTHONDONTWRITEBYTECODE=1 \
            oasis7-ci-build:candidate \
            bash -ec 'export PATH="/opt/node/bin:$PATH"; exec python3 scripts/ci-custody-workerd-gdb-contracts.py --failfast GdbContracts'
      - name: Run existing doc-checker-contracts CI group in runtime image
        if: github.event_name == 'pull_request' && matrix.target == 'runtime'
        timeout-minutes: 12
        env:
          OASIS7_PRODUCT_DOC_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          wheels=$(mktemp -d)
          trap 'rm -rf "$wheels"' EXIT
          python3 -m pip download --only-binary=:all: --dest "$wheels" \
            --requirement scripts/doc-governance-requirements.txt
          git cat-file -e "${OASIS7_PRODUCT_DOC_BASE}^{commit}"
          OASIS7_PRODUCT_DOC_HEAD=$(git rev-parse HEAD)
          export OASIS7_PRODUCT_DOC_HEAD
          docker run --rm --network none \
            --user "$(id -u):$(id -g)" \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/workspace" \
            --mount "type=bind,source=$wheels,target=/wheels,readonly" \
            --workdir /workspace \
            --env HOME=/tmp --env CI=true --env CI_VERBOSE=1 \
            --env OASIS7_PRODUCT_DOC_BASE --env OASIS7_PRODUCT_DOC_HEAD \
            oasis7-ci-runtime:candidate bash -ec '
              python3 -m venv /tmp/doc-checker-venv
              export PATH="/tmp/doc-checker-venv/bin:$PATH"
              python3 -m pip install --no-index --find-links=/wheels \
                --requirement scripts/doc-governance-requirements.txt
              exec bash ./scripts/ci-tests.sh required --group doc_checker_contracts --repo-root /workspace
            '
      - name: Run the site-quality group in the browser image
        if: github.event_name == 'pull_request' && matrix.target == 'browser'
        run: |
          set -euo pipefail
          docker run --rm --network none --user "$(id -u):$(id -g)" \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/workspace" \
            --workdir /workspace --env HOME=/tmp --env CI_VERBOSE=1 \
            oasis7-ci-browser:candidate \
            bash ./scripts/ci-tests.sh required --group site_quality --repo-root /workspace
      - name: Run the existing node group in rust-build
        if: github.event_name == 'pull_request' && matrix.target == 'rust-build'
        timeout-minutes: 35
        run: |
          docker run --rm --user "$(id -u):$(id -g)" --env HOME=/tmp --env CI_VERBOSE=1 \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/workspace" --workdir /workspace \
            oasis7-ci-rust-build:candidate \
            bash ./scripts/ci-tests.sh required --group node --repo-root /workspace
      - name: Run the existing net group in rust-wasm-build
        if: github.event_name == 'pull_request' && matrix.target == 'rust-wasm-build'
        timeout-minutes: 35
        run: |
          docker run --rm --user "$(id -u):$(id -g)" --env HOME=/tmp --env CI_VERBOSE=1 \
            --env GITHUB_ACTIONS --env RUNNER_OS \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/workspace" --workdir /workspace \
            oasis7-ci-rust-wasm-build:candidate \
            bash ./scripts/ci-tests.sh required --group net --repo-root /workspace
      - name: Scan OS vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: oasis7-ci-${{ matrix.target }}:candidate
          scanners: vuln
          vuln-type: os
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          cache: false
      - name: Save verified image
        if: github.event_name != 'pull_request'
        env:
          TARGET: ${{ matrix.target }}
        run: docker save "oasis7-ci-${TARGET}:candidate" -o "ci-${TARGET}.tar"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: github.event_name != 'pull_request'
        with:
          name: ci-image-${{ matrix.target }}
          path: ci-${{ matrix.target }}.tar
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      packages: write
    steps:
      - name: Log in to GHCR and prepare image publisher
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf "%s" "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          cat > "$RUNNER_TEMP/publish-ci-image.sh" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          target="$1"
          docker load -i "ci-${target}.tar"
          rm -f "ci-${target}.tar"
          image="ghcr.io/${GITHUB_REPOSITORY,,}/ci-${target}"
          ref="${image}:${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker tag "oasis7-ci-${target}:candidate" "$ref"
          docker push "$ref"
          digest=$(docker buildx imagetools inspect "$ref" --format "{{json .Manifest}}" | jq -er .digest)
          printf "%s@%s\n" "$image" "$digest" >> "$GITHUB_STEP_SUMMARY"
          docker rmi "$ref" "oasis7-ci-${target}:candidate"
          EOF
          chmod 0700 "$RUNNER_TEMP/publish-ci-image.sh"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ci-image-runtime
      - name: Publish verified runtime image
        run: bash "$RUNNER_TEMP/publish-ci-image.sh" runtime
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ci-image-build
      - name: Publish verified build image
        run: bash "$RUNNER_TEMP/publish-ci-image.sh" build
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ci-image-browser
      - name: Publish verified browser image
        run: bash "$RUNNER_TEMP/publish-ci-image.sh" browser
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ci-image-rust-build
      - name: Publish verified rust-build image
        run: bash "$RUNNER_TEMP/publish-ci-image.sh" rust-build
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ci-image-rust-wasm-build
      - name: Publish verified rust-wasm-build image
        run: bash "$RUNNER_TEMP/publish-ci-image.sh" rust-wasm-build
      - name: Log out of GHCR
        if: always()
        run: docker logout ghcr.io
