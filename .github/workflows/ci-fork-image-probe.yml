name: CI fork image pull probe

on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/ci-fork-image-probe.yml']

permissions:
  contents: read
  packages: read

jobs:
  pull:
    if: github.event.pull_request.head.repo.full_name != github.repository
    name: Pull ${{ matrix.target }} from a fork PR
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: rust-wasm-build
            image: ghcr.io/nil-studio/oasis7/ci-rust-wasm-build@sha256:57c5784d5c038fbd43037bdf2b6c1bdaed3a5e4433354b21a5eee39797da3aa6
    container:
      image: ${{ matrix.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    steps:
      - name: Confirm the container started
        env:
          PROBE_IMAGE: ${{ matrix.image }}
        run: printf 'Started %s with the fork pull_request token\n' "$PROBE_IMAGE"
