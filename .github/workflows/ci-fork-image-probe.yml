name: CI fork image pull probe

on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/ci-fork-image-probe.yml']

permissions:
  contents: read
  packages: read

jobs:
  pull:
    if: github.event.pull_request.head.repo.full_name != github.repository
    name: Pull ${{ matrix.target }} from a fork PR
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: rust-build-git
            image: ghcr.io/nil-studio/oasis7/ci-rust-build@sha256:d35b866df7219a041165b3da463865465f8c3ab481a315c2b9a5afe23c92cecc
          - target: rust-build-ruby
            image: ghcr.io/nil-studio/oasis7/ci-rust-build@sha256:3395596ee4a090242b77a42ec9f67a5b1b1758b707bed70907107bdfbdc932bf
          - target: formal-build
            image: ghcr.io/nil-studio/oasis7/ci-build@sha256:027eb11ad5c315b7ba3aaf834d3ceff5bd84cf6d4d7dfb196bbe4989fc9aa57c
    container:
      image: ${{ matrix.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    steps:
      - name: Confirm the container started
        env:
          PROBE_IMAGE: ${{ matrix.image }}
        run: printf 'Started %s with the fork pull_request token\n' "$PROBE_IMAGE"
