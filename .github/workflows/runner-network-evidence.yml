name: Temporary runner network evidence
on:
  push:
    branches: [codex/engineering-ci-runner-network-diagnostic]
    paths:
      - .github/workflows/runner-network-evidence.yml
      - scripts/ci-runner-network-diagnostic.py
      - scripts/ci-apt-install.py
      - scripts/ci_apt_dns.py
      - scripts/ci-apt-dns.test.py
      - scripts/ci-apt-dns-mechanism.py
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Collect evidence only (not a network health gate)
        run: python3 scripts/ci-runner-network-diagnostic.py
  apt-conditional-dns-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Resolver contract tests (no network mutation)
        run: python3 scripts/ci-apt-dns.test.py
      - name: Resolver shape only (never disclose private suffix values)
        run: python3 scripts/ci_apt_dns.py --shape
      - name: Bounded real apt with opt-in private namespace recovery
        shell: bash
        run: |
          set -euo pipefail
          before=$(sha256sum /etc/resolv.conf)
          link_before=$(readlink /etc/resolv.conf)
          stat_before=$(stat -c '%i:%f:%u:%g:%s' /etc/resolv.conf)
          verify_host() {
            test "$before" = "$(sha256sum /etc/resolv.conf)"
            test "$link_before" = "$(readlink /etc/resolv.conf)"
            test "$stat_before" = "$(stat -c '%i:%f:%u:%g:%s' /etc/resolv.conf)"
            echo 'host_resolver_bytes_symlink_metadata_unchanged=true'
          }
          trap verify_host EXIT
          sudo -n --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT,RUNNER_OS,ImageOS,HTTP_PROXY,HTTPS_PROXY,ALL_PROXY,http_proxy,https_proxy,all_proxy,NO_PROXY,no_proxy,APT_CONFIG,RES_OPTIONS,LOCALDOMAIN,HOSTALIASES /usr/bin/python3 scripts/ci-apt-install.py --budget-seconds 180 --hosted-dns-recovery -- pkg-config
          pkg-config --version
  apt-dns-namespace-mechanism-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Safe resolver shape and explicit namespace mechanism (not automatic failover)
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci_apt_dns.py --shape
          before=$(sha256sum /etc/resolv.conf)
          link_before=$(readlink /etc/resolv.conf)
          stat_before=$(stat -c '%i:%f:%u:%g:%s' /etc/resolv.conf)
          verify_host() {
            test "$before" = "$(sha256sum /etc/resolv.conf)"
            test "$link_before" = "$(readlink /etc/resolv.conf)"
            test "$stat_before" = "$(stat -c '%i:%f:%u:%g:%s' /etc/resolv.conf)"
            echo 'mechanism_host_resolver_bytes_symlink_metadata_unchanged=true'
          }
          trap verify_host EXIT
          sudo -n --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT,RUNNER_OS,ImageOS,HTTP_PROXY,HTTPS_PROXY,ALL_PROXY,http_proxy,https_proxy,all_proxy,NO_PROXY,no_proxy,APT_CONFIG,RES_OPTIONS,LOCALDOMAIN,HOSTALIASES /usr/bin/python3 scripts/ci-apt-dns-mechanism.py --budget-seconds 180
          pkg-config --version
