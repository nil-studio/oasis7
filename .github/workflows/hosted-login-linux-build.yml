name: Hosted Login Linux Build

on:
  workflow_dispatch:
    inputs:
      run_mode:
        description: "Build the package or warm only the native release dependencies"
        required: true
        default: package
        type: choice
        options: [package, release-deps]
      build_profile:
        description: "Cargo profile for the hosted login launcher binary"
        required: true
        default: release
        type: choice
        options:
          - release
          - dev

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
  RUST_TOOLCHAIN: 1.96.0
  CI_CACHE_REPOSITORY_BUDGET_BYTES: "20000000000"

permissions:
  contents: read

cache-mode: read

jobs:
  build-linux-x86-64:
    name: Build Hosted Login native binaries
    if: inputs.run_mode != 'release-deps'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      artifact-id: ${{ steps.stage.outputs.artifact-id }}
    permissions:
      contents: read
      packages: read
    container: &hosted-login-container
      image: ghcr.io/nil-studio/oasis7/ci-rust-build@sha256:068f6982d684c23a39e4b52e56f35f307da388c5893c7837c10b5882ec7dd9fb
      options: --user 1001:1001
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    defaults:
      run:
        shell: bash
    steps:
      - &hosted-checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - &hosted-safe-directory
        name: Trust the checked-out workspace path in the job container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - &hosted-verify-source
        name: Verify exact package source
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - &hosted-mold
        name: Configure mold for Linux host linking
        uses: ./.github/actions/setup-linux-mold
        with:
          install-dir: ${{ runner.temp }}/oasis7-hosted-login-mold
      - &hosted-toolchain
        name: Verify preinstalled Rust and Linux build dependencies
        run: |
          cargo +"${RUST_TOOLCHAIN}" --version
          rustup target list --installed --toolchain "${RUST_TOOLCHAIN}" | grep -Fx wasm32-unknown-unknown
          pkg-config --exists wayland-client wayland-protocols xkbcommon x11 xi xcursor xrandr xinerama alsa libudev

      - &hosted-node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: &hosted-login-cache-key hosted-login-linux-x86-64-ci-rust-build-068f6982d684c23a39e4b52e56f35f307da388c5893c7837c10b5882ec7dd9fb
          add-rust-environment-hash-key: true
          save-if: false
          cache-on-failure: false

      - name: Resolve build profile
        id: profile
        shell: bash
        run: |
          profile="${{ github.event.inputs.build_profile || 'release' }}"
          case "${profile}" in
            release)
              echo "cargo_args=--release" >> "${GITHUB_OUTPUT}"
              echo "binary_dir=release" >> "${GITHUB_OUTPUT}"
              ;;
            dev)
              echo "cargo_args=" >> "${GITHUB_OUTPUT}"
              echo "binary_dir=debug" >> "${GITHUB_OUTPUT}"
              ;;
            *)
              echo "error: unsupported build_profile=${profile}" >&2
              exit 1
              ;;
          esac

      - name: Build hosted login launcher
        run: |
          env -u RUSTC_WRAPPER cargo build \
            ${{ steps.profile.outputs.cargo_args }} \
            -p oasis7_launcher_backend -p oasis7_viewer_runtime \
            --bin oasis7_game_launcher \
            --bin oasis7_viewer_live

      - name: Stage native binaries and identity
        run: |
          mkdir -p output/hosted-login/bin
          cp "target/${{ steps.profile.outputs.binary_dir }}/oasis7_game_launcher" \
            output/hosted-login/bin/oasis7_game_launcher_v3
          cp "target/${{ steps.profile.outputs.binary_dir }}/oasis7_viewer_live" \
            output/hosted-login/bin/oasis7_viewer_live
          chmod +x output/hosted-login/bin/oasis7_game_launcher_v3
          chmod +x output/hosted-login/bin/oasis7_viewer_live
          {
            echo "git_sha=${GITHUB_SHA}"
            echo "profile=${{ github.event.inputs.build_profile || 'release' }}"
            echo "target=x86_64-unknown-linux-gnu"
            echo "binary=bin/oasis7_game_launcher_v3"
            echo "viewer_live=bin/oasis7_viewer_live"
            echo "web=web/"
          } > output/hosted-login/BUILDINFO
          (
            cd output/hosted-login
            sha256sum bin/oasis7_game_launcher_v3 bin/oasis7_viewer_live > SHA256SUMS
          )
          tar -czf "$RUNNER_TEMP/stage.tar.gz" -C output/hosted-login .
          python3 scripts/ci-hosted-login-package.py seal "$RUNNER_TEMP" native "$GITHUB_SHA"

      - name: Upload native stage
        id: stage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hosted-login-native-stage-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/stage.tar.gz
            ${{ runner.temp }}/stage.json
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  build-viewer:
    name: Build Hosted Login Viewer web dist
    if: inputs.run_mode != 'release-deps'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      artifact-id: ${{ steps.stage.outputs.artifact-id }}
    permissions:
      contents: read
      packages: read
    container: *hosted-login-container
    defaults:
      run:
        shell: bash
    steps:
      - *hosted-checkout
      - *hosted-safe-directory
      - *hosted-verify-source
      - *hosted-mold
      - *hosted-toolchain
      - *hosted-node
      - name: Stage viewer web dist
        run: |
          ./scripts/build-viewer-software-safe.sh
          ./scripts/copy-viewer-web-dist.sh --dist-dir output/hosted-login/web
          tar -czf "$RUNNER_TEMP/stage.tar.gz" -C output/hosted-login web
          python3 scripts/ci-hosted-login-package.py seal "$RUNNER_TEMP" viewer "$GITHUB_SHA"
      - name: Upload Viewer stage
        id: stage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hosted-login-viewer-stage-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/stage.tar.gz
            ${{ runner.temp }}/stage.json
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  assemble:
    name: hosted-login-linux-x86-64
    if: inputs.run_mode != 'release-deps'
    needs: [build-linux-x86-64, build-viewer]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - *hosted-checkout
      - *hosted-verify-source
      - name: Verify exact producer artifact IDs
        shell: bash
        env:
          NATIVE_ARTIFACT_ID: ${{ needs.build-linux-x86-64.outputs.artifact-id }}
          VIEWER_ARTIFACT_ID: ${{ needs.build-viewer.outputs.artifact-id }}
        run: |
          [[ "$NATIVE_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$VIEWER_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          test "$NATIVE_ARTIFACT_ID" != "$VIEWER_ARTIFACT_ID"
      - name: Download native stage from this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build-linux-x86-64.outputs.artifact-id }}
          path: ${{ runner.temp }}/hosted-native
      - name: Download Viewer stage from this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build-viewer.outputs.artifact-id }}
          path: ${{ runner.temp }}/hosted-viewer
      - name: Verify and stage deployable artifact
        env:
          BUILD_PROFILE: ${{ inputs.build_profile }}
        run: |
          python3 scripts/ci-hosted-login-package.py assemble "$RUNNER_TEMP" "$GITHUB_SHA" "$BUILD_PROFILE"
          mkdir -p output
          tar -czf output/hosted-login-linux-x86_64.tar.gz -C "$RUNNER_TEMP/hosted-login" .

      - name: Upload hosted login Linux artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hosted-login-linux-x86_64-${{ github.sha }}
          path: output/hosted-login-linux-x86_64.tar.gz
          if-no-files-found: error

  warm-linux-release-deps:
    name: Warm Hosted Login native release dependencies
    if: >-
      github.repository == 'nil-studio/oasis7' && github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' && github.workflow_sha == github.sha &&
      inputs.run_mode == 'release-deps' && inputs.build_profile == 'release'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    concurrency:
      group: hosted-login-linux-release-deps-main
      cancel-in-progress: false
    cache-mode: write
    permissions:
      contents: read
      packages: read
      actions: read
    container: *hosted-login-container
    defaults:
      run:
        shell: bash
    steps:
      - *hosted-checkout
      - *hosted-safe-directory
      - name: Verify exact main writer source
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - *hosted-mold
      - *hosted-toolchain
      - *hosted-node
      - name: Install dependency cache admission
        id: dependency-cache-tools
        run: /usr/bin/python3 scripts/ci-rust-cache-admission.py install-release
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        id: release-cache
        env:
          NODE_OPTIONS: ${{ steps.dependency-cache-tools.outputs.node_options }}
          OASIS7_DEPENDENCY_CACHE_PYTHON: ${{ steps.dependency-cache-tools.outputs.python }}
          OASIS7_DEPENDENCY_CACHE_FAMILY: hosted-login-release
          OASIS7_DEPENDENCY_CACHE_SOURCE_SHA: ${{ github.sha }}
          OASIS7_DEPENDENCY_CACHE_BUDGET_BYTES: ${{ env.CI_CACHE_REPOSITORY_BUDGET_BYTES }}
          GH_TOKEN: ${{ github.token }}
        with:
          shared-key: *hosted-login-cache-key
          add-rust-environment-hash-key: true
          cache-provider: github
          save-if: ${{ job.status == 'success' && steps.dependency-cache-tools.outputs.guard_ready == 'true' && github.ref == 'refs/heads/main' && github.workflow_sha == github.sha && inputs.run_mode == 'release-deps' && inputs.build_profile == 'release' }}
          cache-on-failure: false
      - name: Warm the native release build
        if: steps.release-cache.outputs.cache-hit != 'true'
        run: |
          env -u RUSTC_WRAPPER cargo build --locked --release \
            -p oasis7_launcher_backend -p oasis7_viewer_runtime \
            --bin oasis7_game_launcher \
            --bin oasis7_viewer_live
