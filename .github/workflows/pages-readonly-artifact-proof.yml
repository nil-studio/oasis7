name: Pages readonly host image artifact proof
on:
  pull_request:
    types: [opened]
permissions:
  contents: read
  pages: read
  packages: read
cache-mode: none
env:
  CODE_SHA: e7fefcfe80170c92f57f261c8c550492514a3151
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  host:
    if: &owned-proof >-
      github.repository == 'nil-studio/oasis7' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'task/engineering-pages-readonly-artifact-probe' &&
      github.base_ref == 'task/engineering-pages-job-image' &&
      github.event.pull_request.draft == true &&
      github.event.pull_request.title == 'Pages readonly artifact proof e7fef-once'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      LANE: host
    defaults:
      run:
        shell: bash
    outputs: &proof-outputs
      pages: ${{ steps.pages.outputs.artifact_id }}
      metadata: ${{ steps.metadata.outputs.artifact-id }}
    steps: &proof-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Verify the frozen source and no OIDC request capability
        env:
          CONTROLLER_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}"
          test -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}"
          test "$(git -c safe.directory="$PWD" rev-parse HEAD)" = "$CONTROLLER_SHA"
          test "$(git -c safe.directory="$PWD" diff --name-only "$CODE_SHA" HEAD)" = .github/workflows/pages-readonly-artifact-proof.yml
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          printf 'lane=%s source=%s uid=%s bash=%s\n' "$LANE" "$CODE_SHA" "$EUID" "$BASH_VERSION"
          node --version
          python3 --version
          tar --version
      - name: Execute the actual image preflight only on the image lane
        if: env.LANE == 'image'
        run: |
          python3 - <<'PYEXTRACT'
          import os,pathlib,textwrap
          text=pathlib.Path('.github/workflows/pages.yml').read_text()
          step=text.split('      - name: Verify the preinstalled Pages tools\n',1)[1].split('      - name:',1)[0]
          pathlib.Path(os.environ['RUNNER_TEMP'],'pages-preflight.sh').write_text(textwrap.dedent(step.split('        run: |\n',1)[1]))
          PYEXTRACT
          bash -euo pipefail "$RUNNER_TEMP/pages-preflight.sh"
      - name: Run the exact original site quality commands
        run: |
          ./scripts/site-link-check.sh
          ./scripts/site-homepage-claim-check.sh
          ./scripts/site-manual-sync-check.sh
          ./scripts/site-download-check.sh
      - name: Read existing Pages configuration without enablement
        id: configuration
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
        with:
          enablement: false
      - name: Record the complete original payload inventory
        env:
          BASE_URL: ${{ steps.configuration.outputs.base_url }}
        run: |
          test -z "$(git status --porcelain --untracked-files=no)"
          mkdir -p pages-proof-meta
          python3 - <<'PYMANIFEST'
          import hashlib,json,os,pathlib,stat
          root=pathlib.Path('site'); rows={'.':{'type':'dir','mode':stat.S_IMODE(root.stat().st_mode)}}
          for item in sorted(root.rglob('*')):
              rel=item.relative_to(root)
              if any(part.startswith('.') for part in rel.parts): continue
              assert not item.is_symlink(), rel
              mode=stat.S_IMODE(item.stat().st_mode)
              if item.is_dir(): rows[rel.as_posix()]={'type':'dir','mode':mode}
              else:
                  assert item.is_file(), rel
                  rows[rel.as_posix()]={'type':'file','mode':mode,'size':item.stat().st_size,'sha256':hashlib.sha256(item.read_bytes()).hexdigest()}
          receipt={'lane':os.environ['LANE'],'source':os.environ['CODE_SHA'],'uid':os.getuid(),'gid':os.getgid(),'base_url':os.environ['BASE_URL'],'probe_only':True,'deployment_requested':False,'oidc_requested':False,'rows':rows}
          pathlib.Path('pages-proof-meta/receipt.json').write_text(json.dumps(receipt,sort_keys=True,indent=2)+'\n')
          PYMANIFEST
      - name: Package and upload through the original Pages action
        id: pages
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          name: pages-runtime-ab-${{ env.LANE }}-${{ github.run_id }}
          path: site
      - name: Upload isolated payload identity
        id: metadata
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: pages-runtime-meta-${{ env.LANE }}-${{ github.run_id }}
          path: pages-proof-meta/receipt.json
          retention-days: 1
          if-no-files-found: error
  image:
    if: *owned-proof
    runs-on: ubuntu-latest
    timeout-minutes: 5
    container:
      image: ghcr.io/nil-studio/oasis7/ci-runtime@sha256:49a7d25c4ffaae310799afb86bcbe793af02f9b1420ea204ef826bf843f1fafa
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
      options: --user 1001:1001 --init
    env:
      LANE: image
    defaults:
      run:
        shell: bash
    outputs: *proof-outputs
    steps: *proof-steps
  verify:
    if: *owned-proof
    needs: [host, image]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.host.outputs.pages }}
          path: proof/host-pages
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.image.outputs.pages }}
          path: proof/image-pages
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.host.outputs.metadata }}
          path: proof/host-meta
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.image.outputs.metadata }}
          path: proof/image-meta
      - name: Verify official transport content paths and modes
        env:
          HOST_PAGES: ${{ needs.host.outputs.pages }}
          IMAGE_PAGES: ${{ needs.image.outputs.pages }}
          HOST_META: ${{ needs.host.outputs.metadata }}
          IMAGE_META: ${{ needs.image.outputs.metadata }}
        run: |
          python3 - <<'PYVERIFY'
          import hashlib,json,os,pathlib,tarfile
          ids=[os.environ[key] for key in ('HOST_PAGES','IMAGE_PAGES','HOST_META','IMAGE_META')]
          assert all(value.isdecimal() for value in ids) and len(set(ids))==4
          inventories=[]
          for lane in ('host','image'):
              receipt=json.loads(pathlib.Path('proof',lane+'-meta','receipt.json').read_text())
              assert receipt['source']==os.environ['CODE_SHA'] and receipt['lane']==lane and receipt['probe_only']
              assert not receipt['deployment_requested'] and not receipt['oidc_requested']
              assert receipt['base_url']=='https://oasis7.tech'
              if lane=='image': assert receipt['uid']==1001 and receipt['gid']==1001
              archive=pathlib.Path('proof',lane+'-pages','artifact.tar')
              assert archive.stat().st_size < 100*1024*1024
              rows={}
              with tarfile.open(archive,'r:') as payload:
                  for member in payload:
                      rel=pathlib.PurePosixPath(member.name)
                      assert not rel.is_absolute() and '..' not in rel.parts
                      name=rel.as_posix(); assert name not in rows
                      if member.isdir(): rows[name]={'type':'dir','mode':member.mode}
                      else:
                          assert member.isfile() and member.size<=100*1024*1024
                          rows[name]={'type':'file','mode':member.mode,'size':member.size,'sha256':hashlib.sha256(payload.extractfile(member).read()).hexdigest()}
              assert rows==receipt['rows'], lane
              inventories.append(rows)
          assert inventories[0]==inventories[1], 'host/image content, paths or modes differ'
          print(json.dumps({'source':os.environ['CODE_SHA'],'artifacts':ids,'paths_modes_content_equal':True,'member_count':len(inventories[0]),'probe_only':True,'deployment_requested':False,'oidc_requested':False},sort_keys=True))
          PYVERIFY
