# Replay of 956de698f7d31f97e7c98493659a9d89c8603d42 signer steps.
name: Signer protocol support non-root image replay
on:
  pull_request:
    types: [opened]
    branches: [codex/6832-protocol-image-probe-base]
cache-mode: read
permissions: {}
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  PYTHONDONTWRITEBYTECODE: "1"
  # Configured repository cache budget: 20 GB (decimal bytes).
  # GitHub cache limits and billing budgets must also allow this capacity.
  CI_CACHE_REPOSITORY_BUDGET_BYTES: "20000000000"
  CARGO_NET_RETRY: 10
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  RUST_TOOLCHAIN: 1.96.0
  TRUNK_VERSION: 0.21.14
  OASIS7_WASM_TOOLCHAIN: nightly-2025-12-11
  OASIS7_WASM_TARGET: wasm32-unknown-unknown
  OASIS7_WASM_BUILD_STD: "1"
  OASIS7_WASM_BUILD_STD_COMPONENTS: std,panic_abort
jobs:
  signer-protocol-image:
    if: github.repository == 'nil-studio/oasis7' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'codex/6832-protocol-image-probe-head'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    cache-mode: read
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/nil-studio/oasis7/ci-rust-build@sha256:f121df903f97527a7097134d39f25822c46a3775152768a9cbd591fe65ee987c
      options: --user 1001:1001
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out workflow linker setup
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 15aa05639fb5331f49992be4875704fcceafbb9b
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: .github/actions/setup-linux-mold
      - name: Configure mold for Linux host linking
        uses: ./.github/actions/setup-linux-mold
        with:
          install-dir: ${{ runner.temp }}/oasis7-signer-protocol-mold
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 15aa05639fb5331f49992be4875704fcceafbb9b
          fetch-depth: 0
          persist-credentials: false
      - name: Trust the checked-out workspace path in the job container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Verify frozen tested source and recreate the signer and context plan projection
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "15aa05639fb5331f49992be4875704fcceafbb9b"
          printf '%s\n' '{"scope":"targeted","groups":["baseline","command_center","fleet_health","macos_package_contract","packaging_contracts","rust_baseline","workspace_support"],"execution_profile":"pr-fast","fast_plan_version":1,"workspace_support_profile_version":1,"workspace_support_profiles":["oasis7_context","oasis7_local_signer","oasis7_signer_protocol"],"workspace_support_partition_version":1,"workspace_support_partitions":["other"],"workspace_support_direct_gate_version":2,"test_policy_changed":false}' > "$RUNNER_TEMP/selection.json"
          echo 'This isolated replay uses the protected-main test source and the measured signer, context and protocol selection fields. It produces no required-gate result.'
      - name: Verify the non-root signer execution plan
        env:
          SELECTION_SHA256: ad8884d865e08e8e88091084d3a2cde1501a0b7a5c53772750648e199e3a672e
          SIGNER_EXECUTION: signer-protocol-image
        run: |
          set -euo pipefail
          test "$(id -u):$(id -g)" = 1001:1001
          python3 - "$RUNNER_TEMP/selection.json" "$SELECTION_SHA256" "$SIGNER_EXECUTION" <<'PYTHON'
          import hashlib, json, sys
          from pathlib import Path
          raw = Path(sys.argv[1]).read_bytes()
          if hashlib.sha256(raw).hexdigest() != sys.argv[2]:
              raise SystemExit('non-root signer lane received a different selection artifact')
          plan = json.loads(raw)
          profile_sets = {
              'signer-image': [['oasis7_local_signer']],
              'signer-context-image': [['oasis7_context', 'oasis7_local_signer']],
              'signer-protocol-image': [
                  ['oasis7_local_signer', 'oasis7_signer_protocol'],
                  ['oasis7_context', 'oasis7_local_signer', 'oasis7_signer_protocol'],
              ],
          }
          profiles = profile_sets.get(sys.argv[3], ())
          if plan.get('scope') != 'targeted' or plan.get('workspace_support_profiles') not in profiles:
              raise SystemExit('non-root signer lane requires the exact targeted signer selection')
          PYTHON
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Verify the preinstalled Rust toolchains
        env:
          SUPPORT_EXECUTION: signer-protocol-image
        run: |
          set -euo pipefail
          if [[ "$SUPPORT_EXECUTION" == image ]]; then
            zstd --version
            ps -o pid= -p "$$"
          fi
          rustc +"$RUST_TOOLCHAIN" -vV
          rustc +"$OASIS7_WASM_TOOLCHAIN" -vV
          cargo +"$RUST_TOOLCHAIN" clippy --version
          cargo +"$RUST_TOOLCHAIN" fmt --version
          rustup target list --installed --toolchain "$RUST_TOOLCHAIN" | grep -Fx wasm32-unknown-unknown
          rustup target list --installed --toolchain "$OASIS7_WASM_TOOLCHAIN" | grep -Fx "$OASIS7_WASM_TARGET"
      - name: Stabilize Rust cache toolchains
        shell: bash
        run: python3 scripts/ci-rust-cache-toolchains.py "$RUST_TOOLCHAIN" "$OASIS7_WASM_TOOLCHAIN"
      - name: Confirm ordinary UID cannot read a mode 000 file
        run: |
          set -euo pipefail
          file="$(mktemp "$RUNNER_TEMP/signer-permission.XXXXXX")"
          trap 'rm -f "$file"' EXIT
          chmod 000 "$file"
          python3 -I - "$file" <<'PYTHON'
          import sys
          try:
              open(sys.argv[1], 'rb').close()
          except PermissionError:
              print('kernel denied read at mode 000')
          else:
              raise SystemExit('non-root execution unexpectedly bypassed file mode')
          PYTHON
      - name: Verify the context Git supports offline inspection
        run: /usr/local/bin/git --no-lazy-fetch --no-replace-objects --no-pager --no-optional-locks --version
      - name: Confirm the image system Python can create a PTY
        run: |
          /usr/bin/python3 -I - <<'PYTHON'
          import os, pty, sys
          print(sys.version.split()[0])
          master, slave = pty.openpty()
          try:
              assert os.isatty(slave)
          finally:
              os.close(master)
              os.close(slave)
          PYTHON
      - name: Execute selected group
        shell: bash
        env:
          CI_VERBOSE: "1"
          SUPPORT_PARTITION: other
          SUPPORT_EXECUTION: signer-protocol-image
        run: |
          source scripts/ci-tests.sh
          if [[ "$SUPPORT_EXECUTION" == image ]]; then
            export PATH="$PATH:${CARGO_HOME:-$HOME/.cargo}/bin"
            if [[ -n "${WORKER_TOOL_ROOT:-}" ]]; then
              export PATH="$WORKER_TOOL_ROOT/bin:$PATH"
            fi
          fi
          case "$SUPPORT_EXECUTION" in
            signer-context-image|signer-protocol-image) SUPPORT_EXECUTION=all ;;
            signer-image) SUPPORT_EXECUTION=host ;;
          esac
          support_capacity_snapshot after-native-libraries
          bash ./scripts/ci-tests.sh required --group "workspace_support" --repo-root "$GITHUB_WORKSPACE" --support-plan-file "$RUNNER_TEMP/selection.json" --support-partition "$SUPPORT_PARTITION" --support-execution "$SUPPORT_EXECUTION"
      - name: Check the original PTY and CLI left no owned child processes
        if: always()
        run: |
          /usr/bin/python3 -I - <<'PYTHON'
          from pathlib import Path
          import os

          # Never print command lines. Match only the known test process markers.
          remaining = []
          for entry in Path('/proc').iterdir():
              if not entry.name.isdecimal():
                  continue
              try:
                  if entry.stat().st_uid != os.getuid():
                      continue
                  name = (entry / 'comm').read_text().strip()
                  argv = (entry / 'cmdline').read_bytes()
              except (FileNotFoundError, ProcessLookupError, PermissionError):
                  continue
              if (name.startswith(('oasis7_context', 'oasis7_local_si'))
                      or (name.startswith('python') and b'Terminal restoration checked.' in argv)):
                  remaining.append((entry.name, name))
          if remaining:
              raise SystemExit(f'unreaped signer/context child processes: {remaining}')
          print('No signer/context CLI or PTY supervisor children remain')
          PYTHON
