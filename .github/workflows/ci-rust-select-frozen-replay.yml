name: Rust selector frozen comparison
on:
  pull_request:
    branches: [codex/engineering-rust-select-frozen-base]
    types: [opened]
permissions:
  contents: read
  packages: read
cache-mode: read
jobs:
  host:
    if: ${{ github.repository == 'nil-studio/oasis7' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'codex/engineering-rust-select-frozen-replay' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      witness: ${{ steps.replay.outputs.witness }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: &checkout
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - id: replay
        shell: bash
        run: &replay |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          python3 -I scripts/ci-rust-select-frozen-replay.py
        env: &replay-env
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PYTHONDONTWRITEBYTECODE: '1'
  image:
    if: ${{ github.repository == 'nil-studio/oasis7' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'codex/engineering-rust-select-frozen-replay' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    container:
      image: ghcr.io/nil-studio/oasis7/ci-runtime@sha256:3984caa42d82963f93af752bf79e3a07838f2c94279cfbb2deeb08f715cd62c9
      options: --user 1001:1001
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    outputs:
      witness: ${{ steps.replay.outputs.witness }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: *checkout
      - name: Verify preinstalled selector tools
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -u):$(id -g)" = 1001:1001
          python3 -I -c 'import sys; assert sys.version_info[:2] == (3, 12)'
          git --version
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - id: replay
        shell: bash
        run: *replay
        env: *replay-env
  compare:
    needs: [host, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Require matching complete selector evidence
        shell: bash
        env:
          HOST_WITNESS: ${{ needs.host.outputs.witness }}
          IMAGE_WITNESS: ${{ needs.image.outputs.witness }}
        run: |
          set -euo pipefail
          [[ "$HOST_WITNESS" =~ ^[0-9a-f]{64}$ ]]
          test "$HOST_WITNESS" = "$IMAGE_WITNESS"
          printf 'Matching selector witness %s\n' "$HOST_WITNESS"
