name: Custody WASM image fork proof

on:
  pull_request:
    branches: [codex/engineering-custody-wasm-fork-base]
    types: [opened]

permissions:
  contents: read
  packages: read

cache-mode: none

jobs:
  pull:
    if: >-
      github.repository == 'nil-studio/oasis7' &&
      github.event.pull_request.head.repo.full_name == 'eng-cc/oasis7-ci-validation' &&
      github.event.pull_request.head.ref == 'task/engineering-custody-wasm-fork-proof'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    container:
      image: ghcr.io/nil-studio/oasis7/ci-rust-custody-wasm@sha256:f59fa5ba3564c5a309e1783cf52de4d67d6336a5e771c168b16939a5493e7b13
      options: --user 1001:1001 --init
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Verify the published image from a true fork
        run: |
          test "$(id -u):$(id -g)" = 1001:1001
          export PATH=/opt/oasis7-node22/bin:$PATH
          test "$(command -v node)" = /opt/oasis7-node22/bin/node
          node --version
          node -e 'if (!process.version.startsWith("v22.")) process.exit(1)'
          npm --version
          npx --version
          rustc +1.96.0 --version
          rustup target list --installed --toolchain 1.96.0 | grep -Fx wasm32-unknown-unknown
          rustup target list --installed --toolchain nightly-2025-12-11 | grep -Fx wasm32-unknown-unknown
          test -w /.cache/oasis7
