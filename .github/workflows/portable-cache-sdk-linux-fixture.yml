name: Portable cache SDK Linux fixture diagnostic
on:
  pull_request:
    types: [opened]
permissions:
  contents: read
concurrency:
  group: portable-sdk-linux-fixture-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  sdk-fixture-only:
    if: >-
      github.event.pull_request.draft == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.repository == 'nil-studio/oasis7' &&
      github.head_ref == 'codex/engineering-portable-cache-sdk-linux-fixture' &&
      github.base_ref == 'codex/engineering-portable-cache-sdk'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    cache-mode: none
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/nil-studio/oasis7/ci-rust-build@sha256:068f6982d684c23a39e4b52e56f35f307da388c5893c7837c10b5882ec7dd9fb
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
      options: --user 1001:1001 --init
    defaults:
      run:
        shell: bash
    env:
      CODE_SHA: 1e08dfbea1d4ea169ad955db09e7152b4423864d
      CONTROLLER_SHA: ${{ github.event.pull_request.head.sha }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 1e08dfbea1d4ea169ad955db09e7152b4423864d
          fetch-depth: 0
          persist-credentials: false
      - name: Verify fixed diagnostic source and original Linux tool context
        run: |
          set -euo pipefail
          test "$(id -u):$(id -g)" = 1001:1001
          [[ "$CONTROLLER_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$CODE_SHA"
          test "$(git diff --name-only "$CODE_SHA" "$CONTROLLER_SHA")" = .github/workflows/portable-cache-sdk-linux-fixture.yml
          git diff --check b65bacd40ffea365804a2a06d7119a94c760add3 "$CODE_SHA"
          python3 -c 'import sys; assert sys.version_info[:2] == (3, 12)'
          node --version
          tar --version | head -1
          zstd --version
      - name: Execute only original SDK offline contract with unchanged 120 second child budget
        run: |
          set -euo pipefail
          python3 scripts/ci-cache-sdk.test.py
      - name: Verify exact dependency and vendor inventory contracts
        run: |
          set -euo pipefail
          python3 scripts/ci-workflow-guards-and-timeouts.test.py DependabotCoverageGuardTests
          python3 scripts/libp2p-security-source.test.py
      - name: Record diagnostic scope
        run: |
          python3 - <<'PY'
          import json, os
          print(json.dumps(dict(probe_only=True, native_compilation=False,
              production_cache_api=False, source=os.environ['CODE_SHA'],
              controller=os.environ['CONTROLLER_SHA'], shared_cache_write=False)))
          PY
