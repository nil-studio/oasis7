name: Release summary runtime diagnostic

on:
  pull_request:
    branches: [codex/engineering-release-package-summary-image-probe-base]
    paths: [.github/workflows/release-package-summary-image-probe.yml]
    types: [opened]

permissions: {}
cache-mode: none

defaults:
  run:
    shell: bash

jobs:
  fixture:
    if: >-
      github.head_ref == 'codex/engineering-release-package-summary-image-probe' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      version: ${{ steps.seed.outputs.version }}
    steps:
      - name: Create synthetic package inputs
        id: seed
        run: |
          set -euo pipefail
          printf 'version=fixture-6736\n' >> "$GITHUB_OUTPUT"
          mkdir linux macos windows viewer
          for platform in linux macos windows; do
            printf 'fixture %s ops\n' "$platform" > "$platform/oasis7-$platform-x64-ops-tools.tar.gz"
            for suffix in SOURCEPLAN.json BUILDINFO SHA256SUMS bundle-manifest.json entrypoint-validation.log; do
              printf 'fixture %s %s\n' "$platform" "$suffix" > "$platform/$platform-$suffix"
            done
          done
          printf 'fixture Linux package\n' > linux/oasis7-linux-x64.deb
          printf 'fixture macOS package\n' > macos/oasis7-macos-x64.dmg
          printf 'fixture Windows package\n' > windows/oasis7-windows-x64.exe
          printf 'fixture Viewer delivery\n' > viewer/oasis7-viewer-web-delivery.tar.gz
      - name: Upload fixture linux
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mainnet-package-linux-x64
          path: linux/
          if-no-files-found: error
          retention-days: 1
      - name: Upload fixture macos
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mainnet-package-macos-x64
          path: macos/
          if-no-files-found: error
          retention-days: 1
      - name: Upload fixture windows
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mainnet-package-windows-x64
          path: windows/
          if-no-files-found: error
          retention-days: 1
      - name: Upload fixture viewer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mainnet-viewer-web-delivery
          path: viewer/
          if-no-files-found: error
          retention-days: 1

  replay-host:
    needs: fixture
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      REPLAY_LANE: host
    steps: &replay-steps
      - name: Replay the unchanged release-gate shell
        run: |
          set -euo pipefail
          release_gate() (
            failed=0
            for gate in runtime_core runtime_support runtime_sync web soak; do
              upper_name=$(printf '%s' "$gate" | tr '[:lower:]' '[:upper:]')
              result_var="${upper_name}_RESULT"
              result=${!result_var}
              echo "${gate}: ${result}"
              if [[ "$result" != "success" ]]; then
                failed=1
              fi
            done
            if [[ "$failed" -ne 0 ]]; then
              echo "error: one or more release sub-gates failed" >&2
              exit 1
            fi
          )
          # Mainnet run 27060976993: all five source gates succeeded.
          gates=(RUNTIME_CORE_RESULT RUNTIME_SUPPORT_RESULT RUNTIME_SYNC_RESULT WEB_RESULT SOAK_RESULT)
          for gate in "${gates[@]}"; do export "$gate=success"; done
          release_gate
          for gate in "${gates[@]}"; do
            for state in failure skipped cancelled ''; do
              export "$gate=$state"
              if release_gate; then echo "error: gate accepted $gate=$state" >&2; exit 1; fi
            done
            export "$gate=success"
          done
          # Release run 45099472428: all five source gates were skipped and aggregate failed.
          for gate in "${gates[@]}"; do export "$gate=skipped"; done
          if release_gate; then echo 'error: all-skipped gate was accepted' >&2; exit 1; fi
      - name: Download mainnet package artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mainnet-package-*
          path: output/mainnet-packages/index
          merge-multiple: true
      - name: Download viewer web delivery
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mainnet-viewer-web-delivery
          path: output/mainnet-packages/index
      - name: Generate aggregate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd output/mainnet-packages/index

          for file in \
            oasis7-linux-x64.deb \
            oasis7-macos-x64.dmg \
            oasis7-windows-x64.exe \
            oasis7-linux-x64-ops-tools.tar.gz \
            oasis7-macos-x64-ops-tools.tar.gz \
            oasis7-windows-x64-ops-tools.tar.gz \
            oasis7-viewer-web-delivery.tar.gz
          do
            [[ -f "${file}" ]] || { echo "error: missing mainnet package artifact ${file}" >&2; exit 1; }
          done

          sha256sum \
            oasis7-linux-x64.deb \
            oasis7-macos-x64.dmg \
            oasis7-windows-x64.exe \
            oasis7-linux-x64-ops-tools.tar.gz \
            oasis7-macos-x64-ops-tools.tar.gz \
            oasis7-windows-x64-ops-tools.tar.gz \
            oasis7-viewer-web-delivery.tar.gz \
            > oasis7-mainnet-checksums.txt
      - name: Upload aggregate mainnet package index
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diagnostic-index-${{ env.REPLAY_LANE }}-${{ needs.fixture.outputs.version }}
          path: |
            output/mainnet-packages/index/oasis7-mainnet-checksums.txt
            output/mainnet-packages/index/oasis7-viewer-web-delivery.tar.gz
            output/mainnet-packages/index/*-SOURCEPLAN.json
            output/mainnet-packages/index/*-BUILDINFO
            output/mainnet-packages/index/*-SHA256SUMS
            output/mainnet-packages/index/*-bundle-manifest.json
            output/mainnet-packages/index/*-entrypoint-validation.log
          if-no-files-found: error

  replay-image:
    needs: fixture
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      REPLAY_LANE: image
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/nil-studio/oasis7/ci-runtime@sha256:3984caa42d82963f93af752bf79e3a07838f2c94279cfbb2deeb08f715cd62c9
      options: --user 1001:1001
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    steps: *replay-steps

  compare:
    needs: [replay-host, replay-image]
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Download original host index
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: diagnostic-index-host-fixture-6736
          path: host
      - name: Download runtime image index
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: diagnostic-index-image-fixture-6736
          path: image
      - name: Verify byte equality and independent expected checksums
        run: |
          set -euo pipefail
          diff -r host image
          python3 - <<'PYTHON'
          import hashlib
          from pathlib import Path

          expected = [
              ("oasis7-linux-x64.deb", "fixture Linux package"),
              ("oasis7-macos-x64.dmg", "fixture macOS package"),
              ("oasis7-windows-x64.exe", "fixture Windows package"),
              ("oasis7-linux-x64-ops-tools.tar.gz", "fixture linux ops"),
              ("oasis7-macos-x64-ops-tools.tar.gz", "fixture macos ops"),
              ("oasis7-windows-x64-ops-tools.tar.gz", "fixture windows ops"),
              ("oasis7-viewer-web-delivery.tar.gz", "fixture Viewer delivery"),
          ]
          root = Path("image")
          aggregate = root / "oasis7-mainnet-checksums.txt"
          contents = "".join(
              f"{hashlib.sha256((data + chr(10)).encode()).hexdigest()}  {name}\n"
              for name, data in expected
          )
          assert aggregate.read_text() == contents
          assert (root / expected[-1][0]).read_text() == expected[-1][1] + "\n"
          metadata = {
              f"{platform}-{suffix}": f"fixture {platform} {suffix}\n"
              for platform in ("linux", "macos", "windows")
              for suffix in ("SOURCEPLAN.json", "BUILDINFO", "SHA256SUMS", "bundle-manifest.json",
                             "entrypoint-validation.log")
          }
          for name, content in metadata.items():
              assert (root / name).read_text() == content
          assert {path.name for path in root.iterdir()} == {
              *metadata, aggregate.name, expected[-1][0],
          }
          print("Verified seven checksums and exact 17-file hosted artifact index on both lanes")
          PYTHON
