name: CodeQL JavaScript image diagnostic

on:
  pull_request:
    branches: [codex/engineering-codeql-py-js-image-probe-base]
    paths: [.github/workflows/codeql-py-js-image-probe.yml]
    types: [synchronize]

permissions:
  contents: read
  actions: read
  packages: read

cache-mode: none

defaults:
  run:
    shell: bash

env:
  SOURCE: 5ff0cc288f1ebbc14cce0ff1106aac55e37fb772
  CODEQL_ACTION_DEBUG_COMBINED_SARIF: 'false'
  CODEQL_OVERLAY_DATABASE_MODE: none

jobs:
  javascript-host:
    if: &isolated github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'codex/engineering-codeql-py-js-image-probe'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs: &outputs
      result: ${{ steps.proof.outputs.result }}
    env: &javascript
      LANGUAGE: javascript-typescript
      SARIF_BASENAME: javascript.sarif
      CATEGORY: oasis7/javascript-repo/default
      SELECTION: >-
        {"unit":"javascript-repo","language":"javascript-typescript","category":"oasis7/javascript-repo/default","slot":1,"build_mode":"none","queries":"","timeout_minutes":20}
      CODEQL_EXTRACTOR_JAVASCRIPT_ALLOW_MINIFIED_FILES: 'true'
    steps:
      - &source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.SOURCE }}
          persist-credentials: false
      - &preflight
        name: Check the frozen checkout and tool ABI
        run: |
          test "$(id -u)" -ne 0
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD)" = "$SOURCE"
          git diff --exit-code HEAD --
          test "$(uname -m)" = x86_64
          ldd --version
          git --version
          tar --version
          zstd --version
          python3 -I -c 'import sys; assert sys.version_info[:2] == (3, 12)'
          test -w "$RUNNER_TEMP"
          test -w "$HOME"
          if [[ "$LANGUAGE" == javascript-typescript ]]; then
            command -v node
            node --version
          fi
      - &bundle
        name: Verify the observed default CodeQL bundle
        id: tools
        timeout-minutes: 5
        run: |
          mkdir -p "$RUNNER_TEMP/codeql-tools"
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 240 \
            https://github.com/github/codeql-action/releases/download/codeql-bundle-v2.27.5/codeql-bundle-linux64.tar.zst \
            --output "$RUNNER_TEMP/codeql-tools/bundle.tar.zst"
          echo "141e6eb4e99c8498a1258e282e6f7b59c747b4b1a7eabc7cbf7d1aa92792edf0  $RUNNER_TEMP/codeql-tools/bundle.tar.zst" | sha256sum --check
          echo "tools_path=$RUNNER_TEMP/codeql-tools/bundle.tar.zst" >> "$GITHUB_OUTPUT"
      - &initialize
        name: Initialize the original default language profile
        id: init
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066
        with:
          tools: ${{ steps.tools.outputs.tools_path }}
          languages: ${{ env.LANGUAGE }}
          build-mode: none
          db-location: ${{ runner.temp }}/codeql_databases
          dependency-caching: false
          trap-caching: false
          debug: false
          matrix: ${{ env.SELECTION }}
          config: |
            disable-default-queries: false
            paths-ignore:
              - third_party/**
              - target/**
              - node_modules/**
              - dist/**
              - .pm/**
              - tools/oasis7-command-center/src-tauri/src/generated_context.rs
              - crates/oasis7_runtime/src/tests/agent_cognition_live_persistence_projection_fixture.rs
      - &analyze
        name: Extract and analyze the frozen source locally
        id: analyze
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066
        with:
          category: ${{ env.CATEGORY }}
          output: ${{ runner.temp }}/codeql-results
          upload: never
          upload-database: false
          matrix: ${{ env.SELECTION }}
      - &proof
        name: Check local SARIF and emit only a comparison digest
        id: proof
        env:
          SARIF_ID: ${{ steps.analyze.outputs.sarif-id }}
          SARIF_OUTPUT: ${{ steps.analyze.outputs.sarif-output }}
          CODEQL_BIN: ${{ steps.init.outputs.codeql-path }}
        run: |
          test -z "$SARIF_ID"
          test "$(git rev-parse HEAD)" = "$SOURCE"
          git diff --exit-code HEAD --
          python3 -I - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          output = Path(os.environ['SARIF_OUTPUT']).resolve()
          assert output == Path(os.environ['RUNNER_TEMP'], 'codeql-results').resolve()
          report = output / os.environ['SARIF_BASENAME']
          assert report.is_file() and not report.is_symlink() and 0 < report.stat().st_size < 32 * 1024 * 1024
          data = json.loads(report.read_bytes())
          assert data['version'] == '2.1.0' and data['runs']
          workspace = Path(os.environ['GITHUB_WORKSPACE']).resolve()
          runner_temp = Path(os.environ['RUNNER_TEMP']).resolve()
          bundle = Path(os.environ['CODEQL_BIN']).resolve().parent
          assert bundle.is_relative_to(runner_temp) and bundle.name == 'codeql'
          paths = ((workspace, 'workspace'), (bundle, 'codeql-bundle'), (runner_temp, 'runner-temp'))

          def digest(value):
              return hashlib.sha256(json.dumps(value, sort_keys=True).encode()).hexdigest()

          def normalize(item):
              if isinstance(item, dict):
                  return {key: normalize(value) for key, value in item.items()}
              if isinstance(item, list):
                  return [normalize(value) for value in item]
              if isinstance(item, str):
                  for path, label in paths:
                      item = item.replace(path.as_uri() + '/', f'file:///{label}/').replace(
                          str(path) + '/', f'/{label}/')
                  return item
              return item

          def sort_rule_tables(tool, results):
              driver = tool['driver']
              extensions = tool.get('extensions', [])
              components = [driver, *extensions]
              rule_tables = [component.get('rules', []) for component in components]
              ordered_tables = []
              for rules in rule_tables:
                  assert len({rule['id'] for rule in rules}) == len(rules), 'ambiguous rule ID within component'
                  ordered_tables.append(sorted(rules, key=lambda rule: rule['id']))

              for result in results:
                  reference = result.get('rule', {})
                  owner = reference.get('toolComponent')
                  component_index = 0
                  if owner is not None:
                      index = owner.get('index')
                      assert type(index) is int and 0 <= index < len(extensions), 'invalid rule extension index'
                      component_index = index + 1
                      component = components[component_index]
                      for key in ('name', 'guid'):
                          assert key not in owner or owner[key] == component.get(key), 'inconsistent rule extension identity'
                  rules = rule_tables[component_index]
                  index = reference.get('index', result.get('ruleIndex'))
                  rule_id = result.get('ruleId') or reference.get('id')
                  if index is None:
                      matches = [rule for rule in rules if rule['id'] == rule_id]
                      assert len(matches) == 1, 'unknown rule within component'
                      descriptor, = matches
                  else:
                      assert type(index) is int and 0 <= index < len(rules), 'invalid rule index'
                      assert result.get('ruleIndex', index) == index, 'inconsistent legacy rule index'
                      descriptor = rules[index]
                  assert descriptor['id'] == rule_id, 'rule index does not reference the stated ID'
                  assert 'guid' not in reference or reference['guid'] == descriptor.get('guid'), 'inconsistent rule GUID'
                  canonical_index = ordered_tables[component_index].index(descriptor)
                  if 'index' in reference:
                      reference['index'] = canonical_index
                  if 'ruleIndex' in result:
                      result['ruleIndex'] = canonical_index

              for component, rules in zip(components, ordered_tables, strict=True):
                  if 'rules' in component:
                      component['rules'] = rules

          comparison = []
          original_comparison = []
          evidence = {'source': os.environ['SOURCE'], 'selection': json.loads(os.environ['SELECTION']),
                      'language': os.environ['LANGUAGE'],
                      'minified': os.environ['CODEQL_EXTRACTOR_JAVASCRIPT_ALLOW_MINIFIED_FILES']}
          for run in data['runs']:
              tool = run['tool']
              driver = tool['driver']
              assert driver['name'] == 'CodeQL'
              assert '2.27.5' in (driver.get('version'), driver.get('semanticVersion'))
              extensions = tool.get('extensions', [])
              results = run['results']
              assert isinstance(extensions, list) and isinstance(results, list), 'invalid SARIF extension/result arrays'
              rule_ids = set()
              rule_count = 0
              for component in [driver, *extensions]:
                  rules = component.get('rules', [])
                  assert isinstance(rules, list), 'invalid SARIF rule array'
                  assert all(isinstance(rule.get('id'), str) and rule['id'] for rule in rules)
                  rule_count += len(rules)
                  rule_ids.update(rule['id'] for rule in rules)
              for result in results:
                  reference = result.get('rule', {})
                  rule_id = result.get('ruleId') or reference.get('id')
                  assert isinstance(rule_id, str) and rule_id in rule_ids, 'unknown SARIF result rule'
                  assert reference.get('id', rule_id) == rule_id, 'inconsistent SARIF result rule'
              print(f'SARIF rules={rule_count} results={len(results)}')
              normalized_tool = normalize(tool)
              normalized_results = sorted(normalize(results), key=lambda row: json.dumps(row, sort_keys=True))
              print('Original normalized SARIF run digest:', digest({'tool': normalized_tool, 'results': normalized_results}), flush=True)
              original_comparison.append({'tool': normalized_tool, 'results': normalized_results})
              normalized_tool = normalize(tool)
              normalized_results = normalize(results)
              sort_rule_tables(normalized_tool, normalized_results)
              normalized_results.sort(key=lambda row: json.dumps(row, sort_keys=True))
              tool_fields = sorted({key for component in [driver, *extensions] for key in component})
              result_fields = sorted({key for result in results for key in result})
              normalized_components = [normalized_tool['driver'], *normalized_tool.get('extensions', [])]
              for key in tool_fields:
                  print('SARIF tool field', key, digest([component.get(key) for component in normalized_components]))
              for key in result_fields:
                  values = sorted((result.get(key) for result in normalized_results),
                                  key=lambda value: json.dumps(value, sort_keys=True))
                  print('SARIF result field', key, digest(values))
              comparison.append({'tool': normalized_tool, 'results': normalized_results})
          print('Original normalized SARIF comparison digest:', digest({**evidence, 'sarif': original_comparison}))
          result_digest = digest({**evidence, 'sarif': comparison})
          with open(os.environ['GITHUB_OUTPUT'], 'a') as outputs:
              outputs.write('result=' + result_digest + '\n')
          print('Local SARIF comparison digest:', result_digest)
          PY

  javascript-image:
    if: *isolated
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs: *outputs
    env: *javascript
    container:
      image: ghcr.io/nil-studio/oasis7/ci-runtime@sha256:49a7d25c4ffaae310799afb86bcbe793af02f9b1420ea204ef826bf843f1fafa
      options: --user 1001:1001
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    steps: [*source, *preflight, *bundle, *initialize, *analyze, *proof]

  compare:
    needs: [javascript-host, javascript-image]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Require equivalent source, query selection and SARIF results
        env:
          JAVASCRIPT_HOST: ${{ needs.javascript-host.outputs.result }}
          JAVASCRIPT_IMAGE: ${{ needs.javascript-image.outputs.result }}
        run: |
          [[ "$JAVASCRIPT_HOST" =~ ^[0-9a-f]{64}$ && "$JAVASCRIPT_HOST" == "$JAVASCRIPT_IMAGE" ]]
