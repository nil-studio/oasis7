name: CodeQL Rust Cargo Check

on:
  workflow_dispatch:
    inputs:
      execute:
        description: Run the single fixed Cargo check diagnostic
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  check:
    name: Cargo check diagnostic
    if: github.event_name == 'workflow_dispatch' && inputs.execute == true
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: ghcr.io/nil-studio/oasis7/ci-codeql-rust@sha256:1c4282cf9627eb59399d739d38f00e14b3a9f4145f40bd8ef03362226adee565
      options: --user 1001:1001 --init --read-only --tmpfs /tmp:rw,nosuid,nodev,mode=1777
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    permissions:
      contents: read
      actions: read
      packages: read
    defaults:
      run:
        shell: bash
    concurrency:
      group: oasis7-codeql-scan-slot-1
      queue: max
      cancel-in-progress: false
    env:
      RUSTUP_TOOLCHAIN: '1.99.0'
      RUSTUP_AUTO_INSTALL: '0'
      CARGO_CHECK_NATIVE_IMAGE: ghcr.io/nil-studio/oasis7/ci-codeql-rust@sha256:1c4282cf9627eb59399d739d38f00e14b3a9f4145f40bd8ef03362226adee565
      RUSTC_WRAPPER: ''
    steps:
      - name: Bind the deadline to the actual job start
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import datetime,email.utils,json,os,time,urllib.request
          url=f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}/attempts/{os.environ['GITHUB_RUN_ATTEMPT']}/jobs?per_page=100"
          req=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          requested_at=time.monotonic()
          with urllib.request.urlopen(req,timeout=20) as response:
              value=json.load(response)
              server_date=response.headers.get('Date')
          request_seconds=time.monotonic()-requested_at
          if not server_date:raise SystemExit('missing GitHub clock')
          server_time=email.utils.parsedate_to_datetime(server_date)
          if server_time.tzinfo is None:raise SystemExit('ambiguous GitHub clock')
          jobs=[j for j in value['jobs'] if j['name']=='Cargo check diagnostic' and j['status']=='in_progress']
          if len(jobs)!=1 or not jobs[0].get('started_at'):raise SystemExit('unknown actual diagnostic job start')
          start=datetime.datetime.fromisoformat(jobs[0]['started_at'].replace('Z','+00:00')).timestamp()
          # Compare timestamps from GitHub, then translate the remaining budget
          # to the runner clock. Charge request time and HTTP Date rounding.
          age=server_time.timestamp()-start+request_seconds+1
          if not 0<=age<120:raise SystemExit('invalid or stale GitHub job clock')
          local_now=time.time()
          print(json.dumps({'job_id':jobs[0]['id'],'started_at':jobs[0]['started_at'],
              'github_date':server_date,'job_age_upper_seconds':age,
              'runner_clock_offset_seconds':local_now-server_time.timestamp()}))
          with open(os.environ['GITHUB_ENV'],'a') as out:out.write(f"CHECK_DEADLINE={local_now+900-age}\n")
          PY
      - name: Verify the immutable Rust toolchain proxies
        run: |
          set -euo pipefail
          test "$(id -u):$(id -g)" = 1001:1001
          test "$(command -v rustup)" = /opt/oasis7-rust/bin/rustup
          test "$(command -v cargo)" = /opt/oasis7-rust/bin/cargo
          cmp -s /opt/oasis7-rust/bin/rustup /opt/oasis7-rust/bin/cargo
          test ! -w /opt/oasis7-rust/bin/rustup
          test ! -w /opt/oasis7-rust/bin/cargo
          test ! -w /opt/oasis7-rust/rustup
          python3 -I -c 'import sys; assert sys.version_info[:2] == (3, 12)'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Configure mold for Linux host linking
        uses: ./.github/actions/setup-linux-mold
        with:
          install-dir: ${{ runner.temp }}/oasis7-codeql-cargo-check-mold
      - name: Freeze the existing helper closure outside the business checkout
        run: |
          python3 scripts/security/codeql_rust_capacity_layout.py stage \
            --source "$GITHUB_WORKSPACE" --tools "$RUNNER_TEMP/rust-capacity-helper" \
            --output "$RUNNER_TEMP/rust-cargo-check-evidence" \
            --tool-sha "$GITHUB_SHA" --deadline "$CHECK_DEADLINE"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: d2bf383d8c377b36de83aae4a06d9ec17612e205
          clean: true
          persist-credentials: false
      - name: Verify the source and helper identities
        run: |
          python3 "$RUNNER_TEMP/rust-capacity-helper/codeql_rust_capacity_layout.py" check \
            --source "$GITHUB_WORKSPACE" --tools "$RUNNER_TEMP/rust-capacity-helper" \
            --output "$RUNNER_TEMP/rust-cargo-check-evidence" \
            --source-sha d2bf383d8c377b36de83aae4a06d9ec17612e205 --deadline "$CHECK_DEADLINE"
      - name: Install the recorded analysis toolchain
        timeout-minutes: 3
        run: |
          set -euo pipefail
          umask 077
          toolchain="$(mktemp -d "$RUNNER_TEMP/rust-cargo-check-toolchain.XXXXXXXX")"
          export RUSTUP_HOME="$toolchain/rustup" CARGO_HOME="$toolchain/cargo" TMPDIR="$RUNNER_TEMP"
          mkdir -- "$RUSTUP_HOME" "$CARGO_HOME"
          timeout 120 rustup toolchain install 1.99.0 --profile minimal --no-self-update
          installed="$RUSTUP_HOME/toolchains/1.99.0-x86_64-unknown-linux-gnu"
          test "$(rustup which --toolchain 1.99.0 cargo)" = "$installed/bin/cargo"
          test "$(rustup which --toolchain 1.99.0 rustc)" = "$installed/bin/rustc"
          printf 'RUSTUP_HOME=%s\nCARGO_HOME=%s\nTMPDIR=%s\n' "$RUSTUP_HOME" "$CARGO_HOME" "$TMPDIR" >>"$GITHUB_ENV"
      - name: Execute one locked compile-time dependency check
        run: |
          python3 "$RUNNER_TEMP/rust-capacity-helper/codeql-rust-cargo-check.py" \
            --source "$GITHUB_WORKSPACE" --work "$RUNNER_TEMP/rust-cargo-check-work" \
            --output "$RUNNER_TEMP/rust-cargo-check-evidence" --deadline "$CHECK_DEADLINE" \
            --preinstalled-native-image "$CARGO_CHECK_NATIVE_IMAGE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        timeout-minutes: 2
        with:
          name: cargo-check-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: ${{ runner.temp }}/rust-cargo-check-evidence
          include-hidden-files: true
          retention-days: 14
