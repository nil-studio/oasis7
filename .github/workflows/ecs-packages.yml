name: ECS Server Package
run-name: ECS Server Package (jobs=${{ inputs.native_build_jobs || '2' }}, ${{ github.ref_name }})

on:
  workflow_dispatch:
    inputs:
      publish_preview:
        description: Publish a qualified main bundle to the Preview channel
        type: boolean
        default: false
      retained_release:
        description: Existing OSS release ID to select without rebuilding (requires publish_preview)
        type: string
        default: ''
      rollback_preview:
        description: Explicit new rollback intent for retained_release
        type: boolean
        default: false
      native_build_jobs:
        description: Native Cargo jobs (1 for comparison)
        type: choice
        required: true
        default: '2'
        options: ['1', '2']
      measure_builds:
        description: Compare full native builds and a Viewer source change (manual, read-only)
        type: boolean
        default: false
      measurement_baseline:
        description: Immutable baseline SHA or ref, required when measure_builds is enabled
        type: string
        default: ''

permissions:
  contents: read
  actions: read
cache-mode: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUST_TOOLCHAIN: 1.96.0
  # Verified at /nil-studio/oasis7/actions/caches on 2026-10-21: 10 GB.
  # An explicit conservative budget, never a fabricated live API response.
  ECS_CACHE_REPOSITORY_BUDGET_BYTES: '10000000000'

jobs:
  web:
    if: inputs.retained_release == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: npm ci --prefix crates/oasis7_viewer
      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup target add wasm32-unknown-unknown --toolchain "$RUST_TOOLCHAIN"
          rustup default "$RUST_TOOLCHAIN"
      - name: Normalize Rust cache toolchains
        if: hashFiles('scripts/ci-rust-cache-toolchains.py') != ''
        shell: bash
        run: python3 scripts/ci-rust-cache-toolchains.py "$RUST_TOOLCHAIN"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        if: hashFiles('scripts/ci-rust-cache-toolchains.py') != ''
        with:
          shared-key: release-packages-web-wasm-trusted-v3
          save-if: false
          cache-on-failure: false
      - name: Build Viewer Web only
        run: |
          ./scripts/build-viewer-software-safe.sh --optional-payload-dir output/optional-payload
          ./scripts/copy-viewer-web-dist.sh --dist-dir output/web-dist --optional-payload-dir output/optional-payload
          ./scripts/package-viewer-web-delivery.sh --web-dist output/web-dist --optional-payload-dir output/optional-payload --out-file output/web.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ecs-web-stage
          path: output/web.tar.gz
          if-no-files-found: error

  native:
    if: inputs.retained_release == '' && (github.ref != 'refs/heads/main' || github.workflow_sha != github.sha)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps: &native-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Preflight ECS workspace cache capacity
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci-ecs-cache.py preflight --report "$RUNNER_TEMP/ecs-cache-preflight.json"
      - name: Install Rust and system libraries
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
          sudo apt-get update
          sudo apt-get install -y pkg-config libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxinerama-dev libasound2-dev libudev-dev
      - name: Normalize Rust cache toolchains
        if: hashFiles('scripts/ci-rust-cache-toolchains.py') != ''
        shell: bash
        run: python3 scripts/ci-rust-cache-toolchains.py "$RUST_TOOLCHAIN"
      - name: Install dependency cache admission
        id: dependency-cache-tools
        if: hashFiles('scripts/ci-rust-cache-admission.py') != ''
        continue-on-error: true
        run: python3 scripts/ci-rust-cache-admission.py install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        if: hashFiles('scripts/ci-rust-cache-toolchains.py') != '' && steps.dependency-cache-tools.outcome == 'success'
        env:
          PATH: ${{ steps.dependency-cache-tools.outputs.path }}
          OASIS7_DEPENDENCY_CACHE_FAMILY: ecs
          OASIS7_DEPENDENCY_CACHE_BUDGET_BYTES: ${{ env.ECS_CACHE_REPOSITORY_BUDGET_BYTES }}
          GH_TOKEN: ${{ github.token }}
        with:
          shared-key: oasis7-ecs-native-linux-ecs-v2
          save-if: ${{ job.status == 'success' && github.job == 'native-trusted' && github.ref == 'refs/heads/main' && github.workflow_sha == github.sha }}
          cache-on-failure: false
      - name: Identify ECS workspace cache
        id: ecs-cache-identity
        continue-on-error: true
        run: python3 scripts/ci-ecs-cache.py identity
      - uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        id: ecs-workspace-cache
        if: steps.ecs-cache-identity.outputs.key != ''
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/ecs-workspace-cache/workspace-units.tar.gz
          key: ${{ steps.ecs-cache-identity.outputs.key }}
          restore-keys: ${{ steps.ecs-cache-identity.outputs.prefix }}
      - name: Validate ECS workspace cache
        continue-on-error: true
        env:
          ECS_REQUESTED_KEY: ${{ steps.ecs-cache-identity.outputs.key }}
          ECS_MATCHED_KEY: ${{ steps.ecs-workspace-cache.outputs.cache-matched-key }}
          ECS_CACHE_HIT: ${{ steps.ecs-workspace-cache.outputs.cache-hit }}
        run: |
          python3 scripts/ci-ecs-cache.py restore --cache "$RUNNER_TEMP/ecs-workspace-cache" \
            --report "$RUNNER_TEMP/ecs-cache-restore.json" --requested-key "$ECS_REQUESTED_KEY" \
            --matched-key "$ECS_MATCHED_KEY" --cache-hit "$ECS_CACHE_HIT"
      - name: Compile ECS service and game client binaries
        shell: bash
        env:
          # Keep this step-local so jobs=1/2 restore the same Rust cache.
          CARGO_BUILD_JOBS: ${{ inputs.native_build_jobs || '2' }}
        run: |
          resource_dir="$RUNNER_TEMP/ecs-reports"
          mkdir -p "$resource_dir"
          printf 'ECS native build: jobs=%s\n' "$CARGO_BUILD_JOBS"
          python3 scripts/package-ecs-resource-monitor.py --out "$resource_dir/ecs-resources.json" &
          resource_monitor=$!
          finish_resources() {
            build_status=$?
            trap - EXIT
            kill -TERM "$resource_monitor" 2>/dev/null || true
            wait "$resource_monitor" || printf '::warning::ECS resource monitor did not exit successfully\n'
            cat "$resource_dir/ecs-time.txt" 2>/dev/null || true
            cat "$resource_dir/ecs-resources.json" 2>/dev/null || true
            exit "$build_status"
          }
          trap finish_resources EXIT
          /usr/bin/time -v -o "$resource_dir/ecs-time.txt" \
            python3 scripts/package-ecs.py native --out "$RUNNER_TEMP/ecs-native" --cache-state "$RUNNER_TEMP/ecs-cache-state.json"
      - name: Compile actual cold entry integration probe
        env:
          CARGO_BUILD_JOBS: ${{ inputs.native_build_jobs || '2' }}
        run: |
          env -u RUSTC_WRAPPER cargo build --locked --profile ecs -p oasis7_game_client --example cold_entry_probe
          mkdir -p "$RUNNER_TEMP/ecs-cold-entry-probe"
          cp target/ecs/examples/cold_entry_probe "$RUNNER_TEMP/ecs-cold-entry-probe/cold_entry_probe"
      - name: Stage separate cold entry probe
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ecs-cold-entry-probe-stage
          path: ${{ runner.temp }}/ecs-cold-entry-probe/cold_entry_probe
          if-no-files-found: error
      - name: Stage ECS workspace cache
        id: ecs-cache-stage
        if: github.job != 'native-trusted' || steps.ecs-workspace-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ECS_CACHE_PREVIEW: ${{ github.job != 'native-trusted' }}
        shell: bash
        run: |
          args=()
          if [[ "$ECS_CACHE_PREVIEW" == 'true' ]]; then
            args+=(--preview)
          fi
          python3 scripts/ci-ecs-cache.py stage "${args[@]}" \
            --cache "$RUNNER_TEMP/ecs-workspace-cache" --state "$RUNNER_TEMP/ecs-cache-state.json" \
            --report "$RUNNER_TEMP/ecs-cache-stage.json"
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4
        id: ecs-cache-save
        if: github.job == 'native-trusted' && steps.ecs-cache-stage.outputs.save == 'true'
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/ecs-workspace-cache/workspace-units.tar.gz
          key: ${{ steps.ecs-cache-identity.outputs.key }}
      - name: Confirm ECS workspace cache save
        id: ecs-cache-observe
        if: >-
          github.job == 'native-trusted' &&
          ((steps.ecs-cache-stage.outputs.save == 'true' && steps.ecs-cache-save.outcome == 'success') ||
           steps.ecs-workspace-cache.outputs.cache-hit == 'true')
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ECS_CACHE_KEY: ${{ steps.ecs-cache-identity.outputs.key }}
        run: python3 scripts/ci-ecs-cache.py observe-save --key "$ECS_CACHE_KEY" --report "$RUNNER_TEMP/ecs-cache-save.json"
      - run: |
          mkdir -p output
          tar -C "$RUNNER_TEMP/ecs-native" -czf output/native.tar.gz .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ecs-native-stage
          path: output/native.tar.gz
          if-no-files-found: error
      - name: Upload native Cargo timings
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ecs-native-timings
          path: |
            target/cargo-timings/
            ${{ runner.temp }}/ecs-reports/
            ${{ runner.temp }}/ecs-cache-*.json
            ${{ runner.temp }}/ecs-units.json
          if-no-files-found: ignore

  native-trusted:
    outputs:
      cache_key: ${{ steps.ecs-cache-identity.outputs.key }}
      cache_confirmed: ${{ steps.ecs-cache-observe.outputs.saved_confirmed }}
    concurrency:
      group: ecs-workspace-cache-main-writer
      cancel-in-progress: false
    if: inputs.retained_release == '' && github.ref == 'refs/heads/main' && github.workflow_sha == github.sha
    cache-mode: write
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps: *native-steps

  cache-maintenance:
    needs: native-trusted
    if: >-
      always() && !cancelled() && needs.native-trusted.result == 'success' &&
      github.ref == 'refs/heads/main' && github.workflow_sha == github.sha && github.event_name == 'workflow_dispatch'
    cache-mode: none
    permissions:
      contents: read
      actions: write
    concurrency:
      group: ci-cache-maintenance-main
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Recover rotation headroom and retain confirmed ECS generations
        env:
          CACHE_MAINTENANCE_TOKEN: ${{ github.token }}
          CI_CACHE_REPOSITORY_BUDGET_BYTES: ${{ env.ECS_CACHE_REPOSITORY_BUDGET_BYTES }}
          NATIVE_RESULT: ${{ needs.native-trusted.result }}
          CURRENT_CACHE_CONFIRMED: ${{ needs.native-trusted.outputs.cache_confirmed }}
          CURRENT_CACHE_KEY: ${{ needs.native-trusted.outputs.cache_key }}
        shell: bash
        run: |
          args=()
          if [[ "$NATIVE_RESULT" == success && "$CURRENT_CACHE_CONFIRMED" == true ]]; then
            args+=(--current-key "$CURRENT_CACHE_KEY")
          fi
          python3 scripts/ci-cache-maintenance.py --recover --apply "${args[@]}"

  build-metrics:
    if: inputs.measure_builds
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    cache-mode: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Resolve explicit measurement baseline
        id: baseline
        shell: bash
        env:
          BASELINE_REF: ${{ inputs.measurement_baseline }}
        run: |
          set -euo pipefail
          if [[ -z "$BASELINE_REF" || "$BASELINE_REF" == -* ]]; then
            echo '::error::measure_builds requires an explicit measurement_baseline'
            exit 2
          fi
          git fetch --no-tags --depth=1 origin -- "$BASELINE_REF"
          printf 'sha=%s\n' "$(git rev-parse --verify 'FETCH_HEAD^{commit}')" >> "$GITHUB_OUTPUT"
      - name: Install measurement toolchain and system libraries
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
          sudo apt-get update
          sudo apt-get install -y pkg-config libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxinerama-dev libasound2-dev libudev-dev
      - name: Measure full native build and Viewer source change
        shell: bash
        env:
          BASELINE_SHA: ${{ steps.baseline.outputs.sha }}
          CARGO_BUILD_JOBS: ${{ inputs.native_build_jobs || '2' }}
          CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
        run: |
          python3 scripts/ci-ecs-build-metrics.py \
            --baseline-ref "$BASELINE_SHA" --current-ref "$GITHUB_SHA" \
            --jobs "$CARGO_BUILD_JOBS" --work-dir "$RUNNER_TEMP" \
            --out-dir "$RUNNER_TEMP/ecs-build-metrics"
      - name: Upload controlled build measurements
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ecs-build-metrics
          path: ${{ runner.temp }}/ecs-build-metrics/
          if-no-files-found: warn

  package:
    needs: [web, native, native-trusted]
    if: >-
      !cancelled() && needs.web.result == 'success' &&
      ((needs.native.result == 'success' && needs.native-trusted.result == 'skipped') ||
       (needs.native.result == 'skipped' && needs.native-trusted.result == 'success'))
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ecs-native-stage
          path: output
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ecs-web-stage
          path: output
      - name: Assemble versioned ECS bundle
        env:
          SOURCE_SHA: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          mkdir -p output/native output/web
          tar -xzf output/native.tar.gz -C output/native
          tar -xzf output/web.tar.gz -C output/web
          python3 scripts/package-ecs.py assemble --native output/native --web output/web --out output/ecs
          asset="oasis7-ecs-linux-x64-${RUN_NUMBER}-${SOURCE_SHA:0:12}.tar.gz"
          tar -C output/ecs -czf "output/$asset" .
          (cd output && sha256sum "$asset" > "$asset.sha256")
      - name: Download same-source cold entry probe
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ecs-cold-entry-probe-stage
          path: output/cold-entry-probe
      - name: Verify assembled bundle through actual cold entry services
        id: cold_entry_smoke
        timeout-minutes: 15
        run: |
          sudo apt-get update
          sudo apt-get install -y openssl libx11-6 libxi6 libxcursor1 libxrandr2 libxinerama1 libasound2t64 libudev1
          chmod 700 output/cold-entry-probe/cold_entry_probe
          python3 scripts/package-ecs-cold-entry-smoke.py \
            --bundle "$GITHUB_WORKSPACE/output/ecs" \
            --probe-binary "$GITHUB_WORKSPACE/output/cold-entry-probe/cold_entry_probe" \
            --evidence-directory "$RUNNER_TEMP/ecs-cold-entry-live" --timeout-seconds 600
      - name: Upload public cold entry verification receipt
        if: always() && steps.cold_entry_smoke.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ecs-cold-entry-verification
          path: ${{ runner.temp }}/ecs-cold-entry-live/receipt.json
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: oasis7-ecs-linux-x64
          path: |
            output/oasis7-ecs-linux-x64-*.tar.gz
            output/oasis7-ecs-linux-x64-*.tar.gz.sha256
          if-no-files-found: error

  publish-preview:
    needs: [package, native-trusted]
    if: >-
      always() && !cancelled() && inputs.publish_preview && !inputs.measure_builds &&
      github.repository == 'nil-studio/oasis7' && github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' && github.workflow_sha == github.sha &&
      ((inputs.retained_release == '' && needs.package.result == 'success' && needs.native-trusted.result == 'success') ||
       (inputs.retained_release != '' && needs.package.result == 'skipped' && needs.native-trusted.result == 'skipped'))
    permissions:
      contents: read
      actions: read
      id-token: write
    concurrency:
      group: ecs-preview-channel-publisher
      cancel-in-progress: false
    environment: ecs-preview-publisher
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: inputs.retained_release == ''
        with:
          name: oasis7-ecs-linux-x64
          path: output/qualified
      - name: Install pinned OSS transport
        run: python3 -m pip install 'oss2==2.19.1'
      - name: Obtain short-lived OSS publisher credentials
        uses: aliyun/configure-aliyun-credentials-action@1e5248c8d5d93a8781ac344a68e19a43341e79e6
        with:
          oidc-provider-arn: ${{ vars.ECS_PREVIEW_OIDC_PROVIDER_ARN }}
          role-to-assume: ${{ vars.ECS_PREVIEW_PUBLISH_ROLE_ARN }}
          audience: sts.aliyuncs.com
          role-session-expiration: 1800
      - name: Publish immutable objects and advance channel last
        env:
          OSS_ENDPOINT: ${{ vars.ECS_PREVIEW_OSS_ENDPOINT }}
          OSS_BUCKET: ${{ vars.ECS_PREVIEW_OSS_BUCKET }}
          OSS_PREFIX: ${{ vars.ECS_PREVIEW_OSS_PREFIX }}
          PROGRAM_CONTRACT: ${{ vars.ECS_PREVIEW_PROGRAM_CONTRACT }}
          PERSISTENCE_CONTRACT: ${{ vars.ECS_PREVIEW_PERSISTENCE_CONTRACT }}
          IDENTITY_CONTRACT: ${{ vars.ECS_PREVIEW_IDENTITY_CONTRACT }}
          COMPONENTS: ${{ vars.ECS_PREVIEW_COMPONENTS }}
          RETAINED_RELEASE: ${{ inputs.retained_release }}
          ROLLBACK: ${{ inputs.rollback_preview }}
          GITHUB_WORKFLOW_SHA: ${{ github.workflow_sha }}
        shell: bash
        run: |
          set -euo pipefail
          args=(--endpoint "$OSS_ENDPOINT" --bucket "$OSS_BUCKET" --prefix "$OSS_PREFIX")
          if [[ -n "$RETAINED_RELEASE" ]]; then
            args+=(--retained-release "$RETAINED_RELEASE")
          else
            archives=(output/qualified/*.tar.gz)
            [[ ${#archives[@]} == 1 && -f "${archives[0]}" ]]
            args+=(--archive "${archives[0]}" --program-contract "$PROGRAM_CONTRACT"
                   --persistence-contract "$PERSISTENCE_CONTRACT" --identity-contract "$IDENTITY_CONTRACT"
                   --components "${COMPONENTS:-player}")
          fi
          if [[ "$ROLLBACK" == true ]]; then args+=(--rollback); fi
          python3 scripts/ecs-preview-release.py "${args[@]}"
