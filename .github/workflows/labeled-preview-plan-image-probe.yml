name: Labeled preview planner image diagnostic

on:
  pull_request:
    branches: [codex/engineering-labeled-preview-plan-probe-base]
    paths: [.github/workflows/labeled-preview-plan-image-probe.yml]
    types: [synchronize]

permissions:
  contents: read
cache-mode: read

env:
  PYTHONDONTWRITEBYTECODE: '1'
  BASE_SHA: bf6ce0facc8dc9ebf481eb4b108e4a41ffd87825
  SOURCE_SHA: 6335e5b76c6978dd28bb8834782eba9774758cb1
  TESTED_SHA: 6335e5b76c6978dd28bb8834782eba9774758cb1

jobs:
  preview-plan:
    if: github.head_ref == 'codex/engineering-labeled-preview-plan-probe' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/nil-studio/oasis7/ci-runtime@sha256:3984caa42d82963f93af752bf79e3a07838f2c94279cfbb2deeb08f715cd62c9
      options: --user 1001:1001
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TESTED_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Trust the checked-out workspace path in the job container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Verify preinstalled Python
        run: python3 -c 'import sys; assert sys.version_info[:2] == (3, 12)'
      - name: Verify immutable inputs
        run: |
          set -euo pipefail
          test "$(id -u)" = 1001
          test "$(git rev-parse HEAD)" = "$TESTED_SHA"
          test "$SOURCE_SHA" = "$TESTED_SHA"
          test "$(git merge-base "$BASE_SHA" "$TESTED_SHA")" = "$BASE_SHA"
          test "$(git rev-parse HEAD:scripts/ci-fast-preview.py)" = 9c31b7940f4ca20aa64a2746e65eac400a6c2b95
      - name: Plan diagnostic ordinary source benchmark
        id: preview
        run: |
          python3 scripts/ci-fast-preview.py plan-matrix --base-ref "$BASE_SHA" --head-ref "$TESTED_SHA" \
            --source-ref "$SOURCE_SHA" --output-dir "$RUNNER_TEMP/previews" --github-output "$GITHUB_OUTPUT"
      - name: Verify the empty range stays disabled
        id: disabled
        run: |
          python3 scripts/ci-fast-preview.py plan-matrix --base-ref "$TESTED_SHA" --head-ref "$TESTED_SHA" \
            --source-ref "$TESTED_SHA" --output-dir "$RUNNER_TEMP/disabled" --github-output "$GITHUB_OUTPUT"
      - name: Verify planner identity and complete selected matrix
        env:
          ENABLED: ${{ steps.preview.outputs.enabled }}
          PREVIEW_MATRIX: ${{ steps.preview.outputs.matrix }}
          PREVIEW_SOURCE: ${{ steps.preview.outputs.source_sha }}
          PREVIEW_TESTED: ${{ steps.preview.outputs.tested_sha }}
          DISABLED: ${{ steps.disabled.outputs.enabled }}
          DISABLED_MATRIX: ${{ steps.disabled.outputs.matrix }}
        run: |
          test "$ENABLED" = true
          test "$DISABLED" = false
          test -z "$DISABLED_MATRIX"
          test "$PREVIEW_SOURCE" = "$TESTED_SHA"
          test "$PREVIEW_TESTED" = "$TESTED_SHA"
          test ! -e "$RUNNER_TEMP/disabled"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "previews"
          expected = {"executable-image", "game-client-private-unix", "runtime-world", "world-state-unit-tests"}
          metadata = sorted(root.glob("*/selection.json.metadata.json"))
          assert {path.parent.name for path in metadata} == expected
          rows = []
          for path in metadata:
              item = json.loads(path.read_text())
              plan = json.loads((path.parent / "selection.json").read_text())
              assert item["authority"] == "diagnostic-only"
              assert item["actual_pr_base_sha"] == os.environ["BASE_SHA"]
              assert item["actual_pr_source_sha"] == os.environ["SOURCE_SHA"]
              assert item["actual_target_sha"] is None
              assert item["source_sha"] == item["tested_sha"] == item["policy_sha"] == os.environ["TESTED_SHA"]
              assert plan["groups"] == item["groups"] and plan["ordinary_partitions"] == item["ordinary_partitions"]
              for group in item["groups"]:
                  parts = item["ordinary_partitions"] if group == "oasis7_required" else ["all"]
                  rows.extend({"sample": item["sample"], "group": group, "partition": part,
                               "synthetic_base_sha": item["synthetic_base_sha"]} for part in parts)
          key = lambda row: (row["sample"], row["group"], row["partition"], row["synthetic_base_sha"])
          assert sorted(rows, key=key) == sorted(json.loads(os.environ["PREVIEW_MATRIX"])["include"], key=key)
          print(f"verified {len(metadata)} samples and {len(rows)} matrix rows")
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.preview.outputs.enabled == 'true'
        with:
          name: pr-fast-preview-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/previews/
          retention-days: 14
          if-no-files-found: error
