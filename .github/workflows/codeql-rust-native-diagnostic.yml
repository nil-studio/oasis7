name: CodeQL Rust Native Diagnostic

on:
  workflow_dispatch:
    inputs:
      execute:
        description: Run one short native preparation diagnostic
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  native:
    name: Native preparation diagnostic
    if: github.event_name == 'workflow_dispatch' && inputs.execute == true && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: oasis7-codeql-scan-slot-1
      queue: max
      cancel-in-progress: false
    steps:
      - name: Bind the deadline to the actual job start
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import datetime,email.utils,json,os,pathlib,time,urllib.request
          url=f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}/attempts/{os.environ['GITHUB_RUN_ATTEMPT']}/jobs?per_page=100"
          req=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          requested_at=time.monotonic()
          with urllib.request.urlopen(req,timeout=20) as response:
              value=json.load(response)
              server_date=response.headers.get('Date')
          request_seconds=time.monotonic()-requested_at
          if not server_date:raise SystemExit('missing GitHub clock')
          server_time=email.utils.parsedate_to_datetime(server_date)
          if server_time.tzinfo is None:raise SystemExit('ambiguous GitHub clock')
          jobs=[j for j in value['jobs'] if j['name']=='Native preparation diagnostic' and j['status']=='in_progress']
          if len(jobs)!=1 or not jobs[0].get('started_at'):raise SystemExit('unknown actual diagnostic job start')
          start=datetime.datetime.fromisoformat(jobs[0]['started_at'].replace('Z','+00:00')).timestamp()
          age=server_time.timestamp()-start+request_seconds+1
          if not 0<=age<120:raise SystemExit('invalid or stale GitHub job clock')
          local_now=time.time()
          deadline=local_now+600-age
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'rust-native-diagnostic'
          out.mkdir()
          (out/'job-clock.json').write_text(json.dumps({'job_id':jobs[0]['id'],'started_at':jobs[0]['started_at'],
              'run_id':os.environ['GITHUB_RUN_ID'],'run_attempt':os.environ['GITHUB_RUN_ATTEMPT'],
              'tool_sha':os.environ['GITHUB_SHA'],'github_date':server_date,'job_age_upper_seconds':age,
              'deadline_wall':deadline,'maximum_job_seconds':600},indent=2)+'\n')
          with open(os.environ['GITHUB_ENV'],'a') as env:env.write(f"NATIVE_DEADLINE={deadline}\n")
          PY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Observe one native preparation
        run: |
          python3 scripts/security/codeql-rust-native-diagnostic.py \
            --source "$GITHUB_WORKSPACE" --output "$RUNNER_TEMP/rust-native-diagnostic" \
            --deadline "$NATIVE_DEADLINE" --tool-sha "$GITHUB_SHA"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        timeout-minutes: 1
        with:
          name: native-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: ${{ runner.temp }}/rust-native-diagnostic
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
