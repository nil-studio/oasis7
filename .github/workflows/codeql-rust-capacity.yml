name: CodeQL Rust Capacity

on:
  workflow_dispatch:
    inputs:
      execute:
        description: Run one full rust-repo/default capacity assessment without uploading security results
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  capacity:
    name: CodeQL Rust capacity
    if: github.event_name == 'workflow_dispatch' && inputs.execute == true
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    concurrency:
      group: oasis7-codeql-scan-slot-1
      queue: max
      cancel-in-progress: false
    env:
      RUSTC_WRAPPER: ''
      RUSTUP_TOOLCHAIN: '1.96.0'
      CODEQL_RAM: ''
      CODEQL_THREADS: ''
      CODEQL_OVERLAY_DATABASE_MODE: none
      CODEQL_ACTION_TEMP: ${{ runner.temp }}/rust-capacity-action
      CODEQL_EXTRACTOR_RUST_OPTION_CARGO_ALL_TARGETS: 'true'
      CODEQL_EXTRACTOR_RUST_OPTION_EXTRA_INCLUDES: '["${{ github.workspace }}/capacity-source/crates/oasis7_builtin_wasm_modules/_templates"]'
    steps:
      - name: Bind fixed deadline to actual hosted job start
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import datetime,json,os,time,urllib.request
          url=f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}/attempts/{os.environ['GITHUB_RUN_ATTEMPT']}/jobs?per_page=100"
          request=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          with urllib.request.urlopen(request,timeout=20) as response: value=json.load(response)
          jobs=[job for job in value['jobs'] if job['name']=='CodeQL Rust capacity' and job['status']=='in_progress']
          if len(jobs)!=1 or not jobs[0].get('started_at'):raise SystemExit('unknown actual capacity job start')
          start=datetime.datetime.fromisoformat(jobs[0]['started_at'].replace('Z','+00:00')).timestamp()
          if not 0<=time.time()-start<120:raise SystemExit('invalid or stale job clock')
          with open(os.environ['GITHUB_ENV'],'a') as out:
              out.write(f"CAPACITY_DEADLINE={start+2700}\nCAPACITY_JOB_ID={jobs[0]['id']}\n")
          PY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 9ab1d76982e8ab58994728d881f3d60398834ade
          path: capacity-source
          persist-credentials: false
      - name: Prepare pinned production tools
        timeout-minutes: 5
        run: |
          mkdir "$RUNNER_TEMP/rust-capacity-tools"
          curl --fail --location --max-time 120 \
            https://github.com/github/codeql-action/releases/download/codeql-bundle-v2.27.3/codeql-bundle-rust-linux64.tar.zst \
            --output "$RUNNER_TEMP/rust-capacity-tools/bundle.tar.zst"
          echo "218a19c49a4e44dee236d2cc55e20cda03ac4f37ddc581b1b0e5fff2e7912237  $RUNNER_TEMP/rust-capacity-tools/bundle.tar.zst" | sha256sum --check
          timeout 120 rustup toolchain install 1.96.0 --profile minimal
      - id: init
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        timeout-minutes: 5
        with:
          languages: rust
          build-mode: none
          source-root: capacity-source
          db-location: ${{ runner.temp }}/rust-capacity-databases
          tools: ${{ runner.temp }}/rust-capacity-tools/bundle.tar.zst
          dependency-caching: false
          trap-caching: false
          config: |
            paths-ignore:
              - third_party/**
              - target/**
              - node_modules/**
              - dist/**
              - .pm/**
      - id: prepare
        name: Freeze suite, whole source, graphs, resources and witness inputs
        timeout-minutes: 8
        env:
          CAPACITY_CLI: ${{ steps.init.outputs.codeql-path }}
        run: |
          python3 scripts/security/codeql-rust-capacity.py prepare \
            --codeql "$CAPACITY_CLI" --source "$GITHUB_WORKSPACE/capacity-source" \
            --database "$RUNNER_TEMP/rust-capacity-databases/rust" \
            --output "$RUNNER_TEMP/rust-capacity-evidence" --work "$RUNNER_TEMP/rust-capacity-data" \
            --sarif "$RUNNER_TEMP/rust-capacity-sarif" --deadline "$CAPACITY_DEADLINE"
      - id: analyze
        name: Production extraction and complete official default queries
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        timeout-minutes: ${{ fromJSON(steps.prepare.outputs.analysis_minutes) }}
        with:
          checkout_path: ${{ github.workspace }}/capacity-source
          category: oasis7/rust-repo/default
          output: ${{ runner.temp }}/rust-capacity-sarif
          upload: never
          upload-database: false
      - name: Verify every default result and complete public semantic witnesses
        if: always() && steps.prepare.outcome == 'success'
        env:
          CAPACITY_CLI: ${{ steps.init.outputs.codeql-path }}
          ANALYZE_OUTCOME: ${{ steps.analyze.outcome }}
        run: |
          python3 scripts/security/codeql-rust-capacity.py finish \
            --analyze-outcome "$ANALYZE_OUTCOME" --codeql "$CAPACITY_CLI" \
            --source "$GITHUB_WORKSPACE/capacity-source" --database "$RUNNER_TEMP/rust-capacity-databases/rust" \
            --output "$RUNNER_TEMP/rust-capacity-evidence" --work "$RUNNER_TEMP/rust-capacity-data" \
            --sarif "$RUNNER_TEMP/rust-capacity-sarif" --deadline "$CAPACITY_DEADLINE"
      - id: evidence
        name: Admit complete bounded capacity evidence
        if: always()
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,time
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'rust-capacity-evidence'
          if not root.is_dir():raise SystemExit('EVIDENCE_INCOMPLETE no helper receipt')
          files=list(root.rglob('*'))
          if any(p.is_symlink() or not (p.is_file() or p.is_dir()) for p in files):raise SystemExit('EVIDENCE_INCOMPLETE unsafe evidence')
          if sum(p.stat().st_size for p in files if p.is_file())>256*1024**2:raise SystemExit('EVIDENCE_INCOMPLETE artifact cap')
          with (root/'hashes.json').open('w') as out:
              json.dump({str(p.relative_to(root)):hashlib.file_digest(p.open('rb'),'sha256').hexdigest() for p in files if p.is_file()},out)
          with (root/'job-clock.json').open('w') as out:
              json.dump({'job_id':os.environ['CAPACITY_JOB_ID'],'fixed_job_deadline':float(os.environ['CAPACITY_DEADLINE']),'remaining_before_upload':float(os.environ['CAPACITY_DEADLINE'])-time.time(),'final_job_duration_requires_terminal_readback':True},out)
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.0
        if: always() && steps.evidence.outcome == 'success'
        timeout-minutes: 2
        with:
          name: rust-capacity-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: ${{ runner.temp }}/rust-capacity-evidence
          retention-days: 14
