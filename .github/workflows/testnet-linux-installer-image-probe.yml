name: Testnet Linux installer runtime evidence
on:
  pull_request:
    types: [opened]
    branches: [codex/testnet-linux-installer-probe-base]
    paths: [.github/workflows/testnet-linux-installer-image-probe.yml, scripts/ci-testnet-linux-installer-probe.py]
permissions:
  actions: read
  contents: read
  packages: read
cache-mode: none

jobs:
  replay:
    if: >-
      github.repository == 'nil-studio/oasis7' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'codex/testnet-linux-installer-probe' &&
      github.base_ref == 'codex/testnet-linux-installer-probe-base'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container:
      image: ghcr.io/nil-studio/oasis7/ci-runtime@sha256:3984caa42d82963f93af752bf79e3a07838f2c94279cfbb2deeb08f715cd62c9
      options: --user 1001:1001 --init
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    defaults:
      run:
        shell: bash
    env:
      CANDIDATE: 55070d6a40cb50a1b57286606aa7276dfbc262ce
      TESTNET_SOURCE: cc84d8a8552bc8f52e80a2fcc064446885420028
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: cc84d8a8552bc8f52e80a2fcc064446885420028
          path: frozen-business-source
          persist-credentials: false
      - name: Verify exact source and isolated controller
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/frozen-business-source"
          test "$(git rev-parse HEAD^1)" = "$CANDIDATE"
          test "$(git diff --name-only "$CANDIDATE" HEAD)" = "$(printf '%s\n' .github/workflows/testnet-linux-installer-image-probe.yml scripts/ci-testnet-linux-installer-probe.py)"
          test "$(git -C frozen-business-source rev-parse HEAD)" = "$TESTNET_SOURCE"
      - name: Download fixed same-run stage Web and expected final package
        env:
          ARTIFACT_READ_TOKEN: ${{ github.token }}
        run: python3 scripts/ci-testnet-linux-installer-probe.py capture
      - name: Replay exact installer shell then install and start on loopback
        run: python3 scripts/ci-testnet-linux-installer-probe.py replay
