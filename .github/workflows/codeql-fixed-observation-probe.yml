name: Fixed Rust CodeQL evidence transport proof
on:
  pull_request:
    types: [synchronize]
    branches: [codex/codeql-fixed-observation-probe-base]
    paths: [.github/workflows/codeql-fixed-observation-probe.yml]
permissions:
  contents: read
  packages: read
cache-mode: none
jobs:
  image:
    if: github.repository == 'nil-studio/oasis7' && github.base_ref == 'codex/codeql-fixed-observation-probe-base' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'codex/codeql-fixed-observation-probe'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    container:
      image: &probe-image ghcr.io/nil-studio/oasis7/ci-codeql-rust@sha256:1c4282cf9627eb59399d739d38f00e14b3a9f4145f40bd8ef03362226adee565
      options: --user 1001:1001 --init
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Write transport-only fixtures for the four accepted paths
        run: |
          for name in codeql-rust-fixed-source-layout codeql-rust-native codeql-rust-production-evidence; do
            mkdir "$RUNNER_TEMP/$name"
            printf '%s\n' "$name" >"$RUNNER_TEMP/$name/probe-only.txt"
          done
          printf '%s\n' 'probe-budget-only' >"$RUNNER_TEMP/codeql-rust-production-budget.json"
          printf '%s\n' 'persistence-must-not-collect-unlisted-paths' >"$RUNNER_TEMP/unlisted.txt"
          printf '%s\n' 'hidden-evidence' >"$RUNNER_TEMP/codeql-rust-production-evidence/.guard-probe"
      - id: observation_evidence
        name: Stage the bounded observation evidence
        if: always()
        run: |
          python3 -I - <<'PY'
          import os, shutil, tempfile
          from itertools import chain
          from pathlib import Path
          runner = Path(os.environ['RUNNER_TEMP']).resolve(strict=True)
          stage = Path(tempfile.mkdtemp(prefix='fixed-observation-upload-', dir=runner))
          for name in ('codeql-rust-fixed-source-layout', 'codeql-rust-native',
                       'codeql-rust-production-evidence', 'codeql-rust-production-budget.json'):
              source = runner / name
              paths = chain((source,), source.rglob('*'))
              if any(path.is_symlink() or (path.exists() and not (path.is_file() or path.is_dir()))
                     for path in paths):
                  raise SystemExit('Unsafe observation evidence path: ' + name)
              if source.is_dir():
                  shutil.copytree(source, stage / name)
              elif source.is_file():
                  shutil.copyfile(source, stage / name)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'path={stage}\n')
          PY
      - name: Persist bounded observation evidence
        if: always() && steps.observation_evidence.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: draft-probe-codeql-fixed-observation-transport-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.observation_evidence.outputs.path }}
          include-hidden-files: true
          if-no-files-found: error
          overwrite: false
          retention-days: 7
