name: Compile Metrics

on:
  workflow_dispatch:
    inputs:
      baseline_ref:
        description: "Optional baseline git ref or SHA to compare against. Empty runs current-only metrics."
        required: false
        default: ""
        type: string
      metric_target:
        description: "Rust package compile surface to measure"
        required: true
        default: launcher
        type: choice
        options:
          - launcher
          - oasis7_node_no_default_features
          - oasis7_node_default_features
          - oasis7_default_features
      max_package_count_regression_pct:
        description: "Allowed package closure regression percentage"
        required: false
        default: "5"
        type: string
      max_cargo_check_regression_pct:
        description: "Allowed cold cargo check regression percentage"
        required: false
        default: "25"
        type: string
      max_cargo_build_release_regression_pct:
        description: "Allowed cold cargo build --release regression percentage"
        required: false
        default: "25"
        type: string
      max_release_binary_bytes_regression_pct:
        description: "Allowed release binary size regression percentage"
        required: false
        default: "3"
        type: string
      measure_warm_check:
        description: "Measure an identical no-op cargo check after the cold check"
        required: false
        default: false
        type: boolean
      max_cargo_check_warm_regression_pct:
        description: "Optional allowed warm cargo check regression percentage"
        required: false
        default: ""
        type: string

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  RUST_TOOLCHAIN: 1.96.0

permissions:
  contents: read

cache-mode: read

jobs:
  compile-metrics:
    name: compile-metrics-${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x64
          - os: macos-14
            platform: macos-arm64
          - os: windows-2022
            platform: windows-x64
    runs-on: ${{ matrix.os }}
    # Bound stalled toolchain/download/compile work so a metrics run cannot
    # consume unbounded CI time without producing evidence.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Current-only measurements never inspect repository history. Fetch a
          # baseline explicitly below when one is requested instead of paying
          # the full-history transfer cost on every run.
          fetch-depth: 1

      - name: Validate compile metrics inputs
        shell: bash
        env:
          MEASURE_WARM_CHECK: ${{ inputs.measure_warm_check }}
          MAX_PACKAGE_COUNT_REGRESSION_PCT: ${{ inputs.max_package_count_regression_pct }}
          MAX_CARGO_CHECK_REGRESSION_PCT: ${{ inputs.max_cargo_check_regression_pct }}
          MAX_CARGO_BUILD_RELEASE_REGRESSION_PCT: ${{ inputs.max_cargo_build_release_regression_pct }}
          MAX_RELEASE_BINARY_BYTES_REGRESSION_PCT: ${{ inputs.max_release_binary_bytes_regression_pct }}
          MAX_CARGO_CHECK_WARM_REGRESSION_PCT: ${{ inputs.max_cargo_check_warm_regression_pct }}
        run: |
          set -euo pipefail
          if [[ "${MEASURE_WARM_CHECK}" != "true" && "${MEASURE_WARM_CHECK}" != "false" ]]; then
            echo "error: measure_warm_check must be a boolean" >&2
            exit 2
          fi
          if [[ "${MEASURE_WARM_CHECK}" != "true" && -n "${MAX_CARGO_CHECK_WARM_REGRESSION_PCT}" ]]; then
            echo "error: max_cargo_check_warm_regression_pct requires measure_warm_check=true" >&2
            exit 2
          fi
          validate_threshold() {
            local name="$1" value="$2"
            [[ -z "${value}" ]] && return 0
            python3 - "${name}" "${value}" <<'PY'
          import math
          import sys

          name, raw = sys.argv[1:]
          try:
              value = float(raw)
          except ValueError as exc:
              raise SystemExit(f"error: {name} must be a finite and non-negative number") from exc
          if not math.isfinite(value) or value < 0:
              raise SystemExit(f"error: {name} must be a finite and non-negative number")
          PY
          }
          validate_threshold max_package_count_regression_pct "${MAX_PACKAGE_COUNT_REGRESSION_PCT}"
          validate_threshold max_cargo_check_regression_pct "${MAX_CARGO_CHECK_REGRESSION_PCT}"
          validate_threshold max_cargo_build_release_regression_pct "${MAX_CARGO_BUILD_RELEASE_REGRESSION_PCT}"
          validate_threshold max_release_binary_bytes_regression_pct "${MAX_RELEASE_BINARY_BYTES_REGRESSION_PCT}"
          validate_threshold max_cargo_check_warm_regression_pct "${MAX_CARGO_CHECK_WARM_REGRESSION_PCT}"

      - name: Fetch baseline ref
        if: ${{ inputs.baseline_ref != '' }}
        shell: bash
        env:
          BASELINE_REF: ${{ inputs.baseline_ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin -- "${BASELINE_REF}"

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          rustup toolchain install "${RUST_TOOLCHAIN}" --profile minimal
          rustup default "${RUST_TOOLCHAIN}"

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libwayland-dev \
            wayland-protocols \
            libxkbcommon-dev \
            libx11-dev \
            libxi-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxinerama-dev \
            libasound2-dev \
            libudev-dev

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: false
          shared-key: compile-metrics-${{ runner.os }}-rust-surface-trusted-v2
          cache-on-failure: true

      - name: Resolve baseline ref
        id: baseline
        shell: bash
        env:
          BASELINE_REF: ${{ inputs.baseline_ref }}
        run: |
          set -euo pipefail
          baseline_ref="${BASELINE_REF}"
          if [[ -n "${baseline_ref}" ]]; then
            # Use FETCH_HEAD so branch, tag, and SHA inputs all resolve to the
            # exact object fetched above, even in the shallow checkout.
            baseline_ref="$(git rev-parse --verify 'FETCH_HEAD^{commit}')"
          fi
          echo "baseline_ref=${baseline_ref}" >> "${GITHUB_OUTPUT}"
          echo "baseline_ref=${baseline_ref}"

      - name: Measure selected Rust compile metrics
        shell: bash
        env:
          METRIC_TARGET: ${{ inputs.metric_target }}
          MEASURE_WARM: ${{ inputs.measure_warm_check }}
          BASELINE_REF: ${{ steps.baseline.outputs.baseline_ref }}
        run: |
          set -euo pipefail
          mkdir -p "output/compile-metrics/${{ matrix.platform }}"
          package=""
          binary=""
          extra_args=()
          case "${METRIC_TARGET}" in
            launcher)
              package="oasis7_client_launcher"
              binary="oasis7_client_launcher"
              ;;
            oasis7_node_no_default_features)
              package="oasis7_node"
              extra_args+=(--check-only --no-default-features)
              ;;
            oasis7_node_default_features)
              package="oasis7_node"
              extra_args+=(--check-only)
              ;;
            oasis7_default_features)
              package="oasis7"
              extra_args+=(--check-only)
              ;;
            *)
              echo "error: unsupported metric target: ${METRIC_TARGET}" >&2
              exit 2
              ;;
          esac
          cmd=(
            ./scripts/ci-compile-metrics.sh
            --package "${package}"
            --out-dir "output/compile-metrics/${{ matrix.platform }}"
          )
          if [[ -n "${binary}" ]]; then
            cmd+=(--binary "${binary}")
          fi
          if [[ "${MEASURE_WARM}" == "true" ]]; then
            cmd+=(--measure-warm-check)
          fi
          cmd+=("${extra_args[@]}")
          if [[ -n "${BASELINE_REF}" ]]; then
            cmd+=(--baseline-ref "${BASELINE_REF}")
          fi
          "${cmd[@]}"

      - name: Append platform summary
        if: always()
        shell: bash
        run: |
          {
            echo "## ${{ matrix.platform }}"
            cat "output/compile-metrics/${{ matrix.platform }}/summary.md"
            echo
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Enforce compile metrics gate
        if: always()
        shell: bash
        env:
          METRIC_TARGET: ${{ inputs.metric_target }}
          MEASURE_WARM: ${{ inputs.measure_warm_check }}
          MAX_PACKAGE_COUNT_REGRESSION_PCT: ${{ inputs.max_package_count_regression_pct }}
          MAX_CARGO_CHECK_REGRESSION_PCT: ${{ inputs.max_cargo_check_regression_pct }}
          MAX_CARGO_BUILD_RELEASE_REGRESSION_PCT: ${{ inputs.max_cargo_build_release_regression_pct }}
          MAX_RELEASE_BINARY_BYTES_REGRESSION_PCT: ${{ inputs.max_release_binary_bytes_regression_pct }}
          MAX_CARGO_CHECK_WARM_REGRESSION_PCT: ${{ inputs.max_cargo_check_warm_regression_pct }}
        run: |
          set -euo pipefail
          cmd=(
            python3 ./scripts/ci-compile-metrics-gate.py
            --comparison "output/compile-metrics/${{ matrix.platform }}/comparison.json"
          )
          if [[ -n "${MAX_PACKAGE_COUNT_REGRESSION_PCT}" ]]; then
            cmd+=(--max-package-count-regression-pct "${MAX_PACKAGE_COUNT_REGRESSION_PCT}")
          fi
          if [[ "${METRIC_TARGET}" == "launcher" ]]; then
            cmd+=(--require-wasmtime-absent)
            if [[ -n "${MAX_RELEASE_BINARY_BYTES_REGRESSION_PCT}" ]]; then
              cmd+=(--max-release-binary-bytes-regression-pct "${MAX_RELEASE_BINARY_BYTES_REGRESSION_PCT}")
            fi
            if [[ -n "${MAX_CARGO_BUILD_RELEASE_REGRESSION_PCT}" ]]; then
              cmd+=(--max-cargo-build-release-regression-pct "${MAX_CARGO_BUILD_RELEASE_REGRESSION_PCT}")
            fi
          fi
          if [[ -n "${MAX_CARGO_CHECK_REGRESSION_PCT}" ]]; then
            cmd+=(--max-cargo-check-regression-pct "${MAX_CARGO_CHECK_REGRESSION_PCT}")
          fi
          if [[ "${MEASURE_WARM}" == "true" && -n "${MAX_CARGO_CHECK_WARM_REGRESSION_PCT}" ]]; then
            cmd+=(--max-cargo-check-warm-regression-pct "${MAX_CARGO_CHECK_WARM_REGRESSION_PCT}")
          fi
          gate_output=""
          gate_status=0
          gate_output=$("${cmd[@]}" 2>&1) || gate_status=$?
          printf '%s\n' "${gate_output}" | tee -a "output/compile-metrics/${{ matrix.platform }}/summary.md" >> "${GITHUB_STEP_SUMMARY}"
          if [[ "${gate_status}" -ne 0 ]]; then
            exit "${gate_status}"
          fi

      - name: Upload compile metrics artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compile-metrics-${{ matrix.platform }}
          path: output/compile-metrics/${{ matrix.platform }}
          if-no-files-found: error

  summarize:
    name: summarize-compile-metrics
    needs: compile-metrics
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Download compile metrics artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: compile-metrics-*
          path: output/compile-metrics

      - name: Write combined summary
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "# Compile Metrics Summary"
            echo
            find output/compile-metrics -name summary.md -print | sort | while read -r summary; do
              echo "## $(basename "$(dirname "$summary")")"
              cat "$summary"
              echo
            done
          } > output/compile-metrics/combined-summary.md
          cat output/compile-metrics/combined-summary.md >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload combined compile metrics summary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compile-metrics-summary
          path: output/compile-metrics/combined-summary.md
          if-no-files-found: error
