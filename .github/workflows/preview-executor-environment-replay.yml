name: Preview executor environment replay
on:
  pull_request:
    types: [opened]
    branches: [task/engineering-preview-executor-replay-base]
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  PYTHONDONTWRITEBYTECODE: "1"
  CARGO_NET_RETRY: 10
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  RUST_TOOLCHAIN: 1.96.0
  OASIS7_WASM_TOOLCHAIN: nightly-2025-12-11
  OASIS7_WASM_TARGET: wasm32-unknown-unknown
  OASIS7_WASM_BUILD_STD: "1"
  OASIS7_WASM_BUILD_STD_COMPONENTS: std,panic_abort

jobs:
  pr-fast-preview-plan:
    if: github.repository == 'nil-studio/oasis7' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'task/engineering-preview-executor-replay'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    cache-mode: none
    outputs:
      matrix: ${{ steps.scope.outputs.representative }}
      tested_sha: ${{ steps.plan.outputs.tested_sha }}
      source_sha: ${{ steps.plan.outputs.source_sha }}
      artifact: preview-executor-replay-input-${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: a1192d47826963592989fc4f66e2428e722c5571
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Run the original planner on the frozen range
        id: plan
        env:
          BASE_SHA: 52e8d8a2382f335d9d6505ef4fe16a82c2c048e2
          TESTED_SHA: a1192d47826963592989fc4f66e2428e722c5571
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$TESTED_SHA"
          git merge-base --is-ancestor "$BASE_SHA" "$TESTED_SHA"
          python3 scripts/ci-fast-preview.py plan-matrix --base-ref "$BASE_SHA" --head-ref "$TESTED_SHA" \
            --source-ref "$TESTED_SHA" --output-dir "$RUNNER_TEMP/previews" --github-output "$GITHUB_OUTPUT"
      - name: Choose two original rows for the replay
        id: scope
        env:
          ORIGINAL_MATRIX: ${{ steps.plan.outputs.matrix }}
        run: |
          python3 - <<'PY_M'
          import json, os
          rows = json.loads(os.environ['ORIGINAL_MATRIX'])['include']
          samples = {row['sample'] for row in rows}
          assert samples == {'runtime-world', 'game-client-private-unix', 'executable-image', 'world-state-unit-tests'}
          chosen = [row for row in rows if row['sample'] == 'executable-image'
                    and row['group'] in ('baseline', 'oasis7_required')]
          assert sorted((row['group'], row['partition']) for row in chosen) == [
              ('baseline', 'all'), ('oasis7_required', 'all')]
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('representative=' + json.dumps({'include': chosen}, separators=(',', ':')) + '\n')
          print('Original matrix rows:', len(rows))
          print('Representative replay:', json.dumps(chosen, sort_keys=True))
          PY_M
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: preview-executor-replay-input-${{ github.run_id }}
          path: ${{ runner.temp }}/previews/
          if-no-files-found: error
          retention-days: 2

  replay-host:
    name: replay-host (${{ matrix.sample }}, ${{ matrix.group }}, ${{ matrix.partition }})
    needs: pr-fast-preview-plan
    if: needs.pr-fast-preview-plan.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    cache-mode: none
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.pr-fast-preview-plan.outputs.matrix) }}
    env:
      PREVIEW_SAMPLE: ${{ matrix.sample }}
      PREVIEW_GROUP: ${{ matrix.group }}
      PREVIEW_PARTITION: ${{ matrix.partition }}
    steps:
      - name: Start cold runner measurement
        run: echo "PREVIEW_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - name: Check out workflow linker setup
        if: matrix.group != 'baseline'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: a1192d47826963592989fc4f66e2428e722c5571
          persist-credentials: false
          sparse-checkout: .github/actions/setup-linux-mold
      - name: Configure mold for Linux host linking
        if: matrix.group != 'baseline'
        uses: ./.github/actions/setup-linux-mold
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.pr-fast-preview-plan.outputs.tested_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.pr-fast-preview-plan.outputs.artifact }}
          path: ${{ runner.temp }}/previews
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Restore diagnostic synthetic baseline
        run: |
          python3 scripts/ci-fast-preview.py restore --sample "$PREVIEW_SAMPLE" \
            --metadata "$RUNNER_TEMP/previews/$PREVIEW_SAMPLE/selection.json.metadata.json" \
            --plan "$RUNNER_TEMP/previews/$PREVIEW_SAMPLE/selection.json" \
            --group "$PREVIEW_GROUP" --partition "$PREVIEW_PARTITION"
      - name: Install Markdown runtime
        if: matrix.group == 'baseline'
        run: python3 -m pip install --disable-pip-version-check --requirement scripts/doc-governance-requirements.txt
      - name: Install pinned Rust toolchains
        if: matrix.group != 'baseline'
        shell: bash
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt --component clippy
          rustup default "$RUST_TOOLCHAIN"
          rustup toolchain install "$OASIS7_WASM_TOOLCHAIN" --profile minimal --component rust-src
          rustup target add "$OASIS7_WASM_TARGET" --toolchain "$OASIS7_WASM_TOOLCHAIN"
          rustup target add wasm32-unknown-unknown
      - name: Stabilize Rust toolchains for ordinary execution
        if: matrix.group != 'baseline'
        run: python3 scripts/ci-rust-cache-toolchains.py "$RUST_TOOLCHAIN" "$OASIS7_WASM_TOOLCHAIN"
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2
        if: matrix.group == 'rust_baseline'
        with:
          tool: cargo-deny@0.19.9
      - name: Install native libraries
        if: matrix.group != 'baseline'
        shell: bash
        timeout-minutes: 11
        run: |
          sudo -n --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT,RUNNER_OS,ImageOS,HTTP_PROXY,HTTPS_PROXY,ALL_PROXY,http_proxy,https_proxy,all_proxy,NO_PROXY,no_proxy,APT_CONFIG,RES_OPTIONS,LOCALDOMAIN,HOSTALIASES /usr/bin/python3 scripts/ci-apt-install.py --budget-seconds 600 --hosted-dns-recovery -- pkg-config libwayland-dev wayland-protocols libxkbcommon-dev libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxinerama-dev libasound2-dev libudev-dev
      - name: Install WASM C compiler
        if: matrix.group == 'net'
        shell: bash
        timeout-minutes: 11
        run: |
          sudo -n --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT,RUNNER_OS,ImageOS,HTTP_PROXY,HTTPS_PROXY,ALL_PROXY,http_proxy,https_proxy,all_proxy,NO_PROXY,no_proxy,APT_CONFIG,RES_OPTIONS,LOCALDOMAIN,HOSTALIASES /usr/bin/python3 scripts/ci-apt-install.py --budget-seconds 600 --hosted-dns-recovery -- clang llvm
          clang --print-targets | grep -w wasm32
          llvm-ar --version
      - name: Execute actual preview group
        id: execute
        shell: bash
        env:
          PREVIEW_GROUP: ${{ matrix.group }}
          SOURCE_SHA: ${{ needs.pr-fast-preview-plan.outputs.source_sha }}
          OASIS7_PRODUCT_DOC_BASE: ${{ matrix.synthetic_base_sha }}
          OASIS7_PRODUCT_DOC_HEAD: ${{ needs.pr-fast-preview-plan.outputs.tested_sha }}
          OASIS7_CI_PROFILE: pr-fast
          CI_VERBOSE: "1"
        run: |
          set -euo pipefail
          selection="$RUNNER_TEMP/previews/$PREVIEW_SAMPLE/selection.json"
          export OASIS7_CI_ARCHITECTURE_PLAN_FILE="$selection"
          plan_args=()
          if [[ "$PREVIEW_GROUP" == rust_baseline || "$PREVIEW_GROUP" == oasis7_required || "$PREVIEW_GROUP" == distfs ]]; then
            plan_args=(--plan "$selection")
          fi
          if [[ "$PREVIEW_GROUP" == oasis7_required ]]; then
            plan_args+=(--ordinary-partition "$PREVIEW_PARTITION")
          fi
          bash scripts/ci-tests.sh required --group "$PREVIEW_GROUP" "${plan_args[@]}" \
            --repo-root "$GITHUB_WORKSPACE" 2>&1 | tee "$RUNNER_TEMP/pr-fast-preview.log"
      - name: Record preview group timing and outcome
        if: always()
        env:
          PREVIEW_GROUP: ${{ matrix.group }}
          PREVIEW_OUTCOME: ${{ steps.execute.outcome }}
          PREVIEW_TESTED_SHA: ${{ needs.pr-fast-preview-plan.outputs.tested_sha }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, time
          ended = int(time.time())
          report = {'diagnostic_only': True, 'cache_restored': False,
                    'sample': os.environ['PREVIEW_SAMPLE'],
                    'partition': os.environ['PREVIEW_PARTITION'],
                    'group': os.environ['PREVIEW_GROUP'], 'outcome': os.environ['PREVIEW_OUTCOME'],
                    'tested_sha': os.environ['PREVIEW_TESTED_SHA'],
                    'runner_started_at': int(os.environ['PREVIEW_STARTED_AT']), 'ended_at': ended}
          report['runner_seconds'] = ended - report['runner_started_at']
          pathlib.Path(os.environ['RUNNER_TEMP'], 'pr-fast-preview-timing.json').write_text(json.dumps(report, indent=2) + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as stream:
              stream.write('Diagnostic cold group: ' + json.dumps(report) + '\n')
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: replay-host-${{ matrix.sample }}-${{ matrix.group }}-${{ matrix.partition }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/pr-fast-preview.log
            ${{ runner.temp }}/pr-fast-preview-timing.json
          retention-days: 2
          if-no-files-found: error

  replay-image:
    name: replay-image (${{ matrix.sample }}, ${{ matrix.group }}, ${{ matrix.partition }})
    needs: pr-fast-preview-plan
    if: needs.pr-fast-preview-plan.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    cache-mode: none
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ matrix.group == 'baseline' && 'ghcr.io/nil-studio/oasis7/ci-runtime@sha256:3984caa42d82963f93af752bf79e3a07838f2c94279cfbb2deeb08f715cd62c9' || matrix.group == 'net' && 'ghcr.io/nil-studio/oasis7/ci-rust-wasm-build@sha256:57c5784d5c038fbd43037bdf2b6c1bdaed3a5e4433354b21a5eee39797da3aa6' || 'ghcr.io/nil-studio/oasis7/ci-rust-build@sha256:f121df903f97527a7097134d39f25822c46a3775152768a9cbd591fe65ee987c' }}
      options: --user 1001:1001 --init
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.pr-fast-preview-plan.outputs.matrix) }}
    env:
      PREVIEW_SAMPLE: ${{ matrix.sample }}
      PREVIEW_GROUP: ${{ matrix.group }}
      PREVIEW_PARTITION: ${{ matrix.partition }}
    steps:
      - name: Start cold group measurement after container initialization
        run: echo "PREVIEW_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - name: Check out workflow linker setup
        if: matrix.group != 'baseline'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: a1192d47826963592989fc4f66e2428e722c5571
          persist-credentials: false
          sparse-checkout: .github/actions/setup-linux-mold
      - name: Configure mold for Linux host linking
        if: matrix.group != 'baseline'
        uses: ./.github/actions/setup-linux-mold
        with:
          install-dir: ${{ runner.temp }}/oasis7-preview-mold
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.pr-fast-preview-plan.outputs.tested_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.pr-fast-preview-plan.outputs.artifact }}
          path: ${{ runner.temp }}/previews
      - name: Verify the executor identity and Python runtime
        run: |
          test "$(id -u):$(id -g)" = 1001:1001
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python3 -I -c 'import sys; assert sys.version_info[:2] == (3, 12)'
      - name: Restore diagnostic synthetic baseline
        run: |
          python3 scripts/ci-fast-preview.py restore --sample "$PREVIEW_SAMPLE" \
            --metadata "$RUNNER_TEMP/previews/$PREVIEW_SAMPLE/selection.json.metadata.json" \
            --plan "$RUNNER_TEMP/previews/$PREVIEW_SAMPLE/selection.json" \
            --group "$PREVIEW_GROUP" --partition "$PREVIEW_PARTITION"
      - name: Install Markdown runtime
        if: matrix.group == 'baseline'
        run: |
          venv="$RUNNER_TEMP/oasis7-preview-venv"
          python3 -m venv "$venv"
          "$venv/bin/python3" -m pip install --disable-pip-version-check --requirement scripts/doc-governance-requirements.txt
          printf '%s\n' "$venv/bin" >> "$GITHUB_PATH"
      - name: Verify the preinstalled Rust and native libraries
        if: matrix.group != 'baseline'
        run: |
          rustc +"$RUST_TOOLCHAIN" -vV
          rustc +"$OASIS7_WASM_TOOLCHAIN" -vV
          cargo +"$RUST_TOOLCHAIN" clippy --version
          cargo +"$RUST_TOOLCHAIN" fmt --version
          rustup target list --installed --toolchain "$RUST_TOOLCHAIN" | grep -Fx wasm32-unknown-unknown
          rustup target list --installed --toolchain "$OASIS7_WASM_TOOLCHAIN" | grep -Fx "$OASIS7_WASM_TARGET"
          pkg-config --exists wayland-client wayland-protocols xkbcommon x11 xi xcursor xrandr alsa libudev
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2
        if: matrix.group == 'rust_baseline'
        with:
          tool: cargo-deny@0.19.9
      - name: Verify the preinstalled WASM C compiler
        if: matrix.group == 'net'
        shell: bash
        run: |
          clang --print-targets | grep -w wasm32
          llvm-ar --version
      - name: Execute actual preview group
        id: execute
        shell: bash
        env:
          PREVIEW_GROUP: ${{ matrix.group }}
          SOURCE_SHA: ${{ needs.pr-fast-preview-plan.outputs.source_sha }}
          OASIS7_PRODUCT_DOC_BASE: ${{ matrix.synthetic_base_sha }}
          OASIS7_PRODUCT_DOC_HEAD: ${{ needs.pr-fast-preview-plan.outputs.tested_sha }}
          OASIS7_CI_PROFILE: pr-fast
          CI_VERBOSE: "1"
        run: |
          set -euo pipefail
          selection="$RUNNER_TEMP/previews/$PREVIEW_SAMPLE/selection.json"
          export OASIS7_CI_ARCHITECTURE_PLAN_FILE="$selection"
          plan_args=()
          if [[ "$PREVIEW_GROUP" == rust_baseline || "$PREVIEW_GROUP" == oasis7_required || "$PREVIEW_GROUP" == distfs ]]; then
            plan_args=(--plan "$selection")
          fi
          if [[ "$PREVIEW_GROUP" == oasis7_required ]]; then
            plan_args+=(--ordinary-partition "$PREVIEW_PARTITION")
          fi
          bash scripts/ci-tests.sh required --group "$PREVIEW_GROUP" "${plan_args[@]}" \
            --repo-root "$GITHUB_WORKSPACE" 2>&1 | tee "$RUNNER_TEMP/pr-fast-preview.log"
      - name: Record preview group timing and outcome
        if: always()
        env:
          PREVIEW_GROUP: ${{ matrix.group }}
          PREVIEW_OUTCOME: ${{ steps.execute.outcome }}
          PREVIEW_TESTED_SHA: ${{ needs.pr-fast-preview-plan.outputs.tested_sha }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, time
          ended = int(time.time())
          report = {'diagnostic_only': True, 'cache_restored': False,
                    'timing_scope': 'first-step-through-outcome',
                    'includes_container_initialization': False,
                    'sample': os.environ['PREVIEW_SAMPLE'],
                    'partition': os.environ['PREVIEW_PARTITION'],
                    'group': os.environ['PREVIEW_GROUP'], 'outcome': os.environ['PREVIEW_OUTCOME'],
                    'tested_sha': os.environ['PREVIEW_TESTED_SHA'],
                    'runner_started_at': int(os.environ['PREVIEW_STARTED_AT']), 'ended_at': ended}
          report['runner_seconds'] = ended - report['runner_started_at']
          pathlib.Path(os.environ['RUNNER_TEMP'], 'pr-fast-preview-timing.json').write_text(json.dumps(report, indent=2) + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as stream:
              stream.write('Diagnostic cold group: ' + json.dumps(report) + '\n')
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: replay-image-${{ matrix.sample }}-${{ matrix.group }}-${{ matrix.partition }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/pr-fast-preview.log
            ${{ runner.temp }}/pr-fast-preview-timing.json
          retention-days: 2
          if-no-files-found: error
