---
name: Release publisher readonly replay
'on':
  pull_request:
    types:
    - opened
permissions:
  contents: read
  actions: read
  packages: read
jobs:
  host:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref
      == 'task/engineering-release-publisher-readonly-probe' && github.base_ref ==
      'task/engineering-release-publisher-image' && github.event.pull_request.draft
      && github.event.pull_request.title == 'Release publisher readonly replay 20261128-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    cache-mode: none
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        ref: dfd5386ce52e43f64ced97f9f62ab01760d557d1
        fetch-depth: 0
        persist-credentials: false
    - name: Verify frozen readonly scope
      env:
        CONTROLLER_SHA: "${{ github.event.pull_request.head.sha }}"
        CONTROLLER_REF: "${{ github.event.pull_request.head.ref }}"
        BASE_REF: "${{ github.base_ref }}"
        TITLE: "${{ github.event.pull_request.title }}"
      run: |
        set -euo pipefail
         test "$CONTROLLER_REF" = task/engineering-release-publisher-readonly-probe
         test "$BASE_REF" = task/engineering-release-publisher-image
         test "$TITLE" = 'Release publisher readonly replay 20261128-v1'
         test "$(git rev-parse HEAD)" = 'dfd5386ce52e43f64ced97f9f62ab01760d557d1'
         git fetch --no-tags origin "$CONTROLLER_SHA"
         test "$(git diff --name-only 'dfd5386ce52e43f64ced97f9f62ab01760d557d1' "$CONTROLLER_SHA")" = '.github/workflows/release-publisher-readonly-probe.yml'
         mkdir -p output/release/assets proof
         test -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}"
         node -e 'require("node:assert/strict").equal(process.versions.node.split(".")[0],"24")'
         gh --version | head -1
    - name: Verify original artifact identities
      env:
        GH_TOKEN: "${{ github.token }}"
      run: |
        set -euo pipefail
        python3 - <<'PYCHECK'
        import json,os,subprocess
        expected={11946541615: {'name': 'release-asset-macos-x64', 'size_in_bytes': 104206039, 'digest': 'sha256:002e60166a015f7b2acc7f776db39e8f9ad08e126c8f15a6a25a7b5c04dc1228'}, 11946256741: {'name': 'release-asset-macos-x64-ops-tools', 'size_in_bytes': 40752464, 'digest': 'sha256:acde1e3dfb6a82891e338c78cc4f69b6c5fcf7ca03028283818403ebf460178a'}, 11944577260: {'name': 'release-asset-windows-x64', 'size_in_bytes': 69783190, 'digest': 'sha256:0582748edd909e645db718b6cb4bc62fb73d2418644f01128073cbb2721d8047'}, 11943877567: {'name': 'release-asset-windows-x64-ops-tools', 'size_in_bytes': 46159561, 'digest': 'sha256:a9a57b1a6f995daaf1d97b847b6cbfabea273702ba94d64f3a8fedc0a35c389b'}, 11942975095: {'name': 'release-asset-linux-x64', 'size_in_bytes': 72808379, 'digest': 'sha256:3bfb4b2f94256922c9ff6f2e0d1ae32dd390f667e5991b23bc2fd5c53348e91a'}, 11942560161: {'name': 'release-asset-linux-x64-ops-tools', 'size_in_bytes': 41881510, 'digest': 'sha256:5fad4b03eb9f00d81ae39b2d7f28ed30cec4322807bc37ec445b316bc5950088'}, 11938932269: {'name': 'release-viewer-web-delivery', 'size_in_bytes': 12513944, 'digest': 'sha256:f9eccd2f129ce6f7d3efbadf4cf4734ae885b06a9f861db9eff678bdfb6bf122'}}
        run=json.loads(subprocess.check_output(['gh','api','repos/nil-studio/oasis7/actions/runs/38659287921'],text=True))
        assert run['run_attempt']==1 and run['conclusion']=='success' and run['head_sha']=='3d8b22af93f214e4cbe945c2880a57c92f52d804'
        rows=[]
        for raw,fields in expected.items():
            aid=int(raw)
            actual=json.loads(subprocess.check_output(['gh','api',f'repos/nil-studio/oasis7/actions/artifacts/{aid}'],text=True))
            assert all(actual[k]==v for k,v in fields.items()),(aid,actual)
            assert actual['expired'] is False
            assert actual['workflow_run']['id']==38659287921
            assert actual['workflow_run']['head_sha']=='3d8b22af93f214e4cbe945c2880a57c92f52d804'
            rows.append({'id':aid,**fields})
        json.dump(rows,open('proof/artifact-identities.json','w'),sort_keys=True)
        PYCHECK
    - name: Download exact original 11946541615
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        artifact-ids: '11946541615'
        run-id: 38659287921
        github-token: "${{ github.token }}"
