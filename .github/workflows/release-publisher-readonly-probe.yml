    - name: Original tag and sidecar script
      env:
        PLANNED_REF: refs/tags/2026-10-15_v1
        PLANNED_SHA: 3d8b22af93f214e4cbe945c2880a57c92f52d804
        GH_TOKEN: "${{ github.token }}"
      run: |
        set -euo pipefail
        tag="${PLANNED_REF#refs/tags/}"
        record="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag")"
        object="$(jq -r '.object.sha' <<< "$record")"
        kind="$(jq -r '.object.type' <<< "$record")"
        while [[ "$kind" == tag ]]; do
          record="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$object")"
          object="$(jq -r '.object.sha' <<< "$record")"
          kind="$(jq -r '.object.type' <<< "$record")"
        done
        test "$kind" = commit
        test "$object" = "$PLANNED_SHA"
        for platform in linux-x64 macos-x64 windows-x64; do
          jq -e --arg sha "$PLANNED_SHA" '.checkoutSha == $sha' "output/release/assets/$platform-SOURCEPLAN.json" >/dev/null
          grep -Fqx "commit=$PLANNED_SHA" "output/release/assets/$platform-BUILDINFO"
        done
        printf 'value=%s\n' "$tag" >> "$GITHUB_OUTPUT"
    - name: Prepare exact negative oracle
      run: |
        set -euo pipefail
        python3 - <<'PYSCRIPT'
        from pathlib import Path
        Path('proof/original-tag.sh').write_text('set -euo pipefail\ntag="${PLANNED_REF#refs/tags/}"\nrecord="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag")"\nobject="$(jq -r \'.object.sha\' <<< "$record")"\nkind="$(jq -r \'.object.type\' <<< "$record")"\nwhile [[ "$kind" == tag ]]; do\n  record="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$object")"\n  object="$(jq -r \'.object.sha\' <<< "$record")"\n  kind="$(jq -r \'.object.type\' <<< "$record")"\ndone\ntest "$kind" = commit\ntest "$object" = "$PLANNED_SHA"\nfor platform in linux-x64 macos-x64 windows-x64; do\n  jq -e --arg sha "$PLANNED_SHA" \'.checkoutSha == $sha\' "output/release/assets/$platform-SOURCEPLAN.json" >/dev/null\n  grep -Fqx "commit=$PLANNED_SHA" "output/release/assets/$platform-BUILDINFO"\ndone\nprintf \'value=%s\\n\' "$tag" >> "$GITHUB_OUTPUT"\n')
        PYSCRIPT
    - name: Reject wrong planned source
      env:
        PLANNED_REF: refs/tags/2026-10-15_v1
        GH_TOKEN: "${{ github.token }}"
      run: |
        set -euo pipefail
        export PLANNED_SHA=0000000000000000000000000000000000000000
        if bash proof/original-tag.sh > proof/wrong-source.log 2>&1; then
          echo 'wrong planned source accepted' >&2
          exit 1
        fi
        rm proof/wrong-source.log
        printf 'wrong source rejected by original tag assertion
        ' > proof/negative.txt
    - name: Verify actual historic files and checksum
      run: |
        set -euo pipefail
        sha256sum output/release/assets/* | sort > proof/files.sha256
