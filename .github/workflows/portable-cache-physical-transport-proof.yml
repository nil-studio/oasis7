name: Portable cache physical host image transport proof
on:
  pull_request:
    branches: [codex/engineering-portable-cache-container-cutover]
    types: [edited]
permissions:
  contents: read
  actions: read
concurrency:
  group: portable-physical-transport-${{ github.event.pull_request.number }}
  cancel-in-progress: false
env:
  CODE_SHA: 39fbf84d9b1ba2c3ba44a261b31be395b50220f5
  CONTROLLER_SHA: ${{ github.event.pull_request.head.sha }}
  RUST_TOOLCHAIN: 1.96.0
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  host-seed:
    if: &proof-admission >-
      github.repository == 'nil-studio/oasis7' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == true &&
      github.head_ref == 'codex/engineering-portable-cache-transport-corrected' &&
      github.base_ref == 'codex/engineering-portable-cache-container-cutover' &&
      github.event.changes.title.from == 'Lock corrected portable cache transport proof scope' &&
      github.event.pull_request.title == 'Verify corrected portable cache transport in both images and host'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    cache-mode: none
    env:
      PROBE_PHASE: seed
      PROBE_KIND: host
    outputs:
      artifact: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - &proof-checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 39fbf84d9b1ba2c3ba44a261b31be395b50220f5
          fetch-depth: 0
          persist-credentials: false
      - &stage-controller
        name: Verify fixed code and stage only the reviewed controller
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          import os, pathlib, re, subprocess
          code=os.environ['CODE_SHA']; controller=os.environ['CONTROLLER_SHA']
          assert re.fullmatch('[a-f0-9]{40}',controller)
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==code
          files=['.github/actions/portable-cache-transport-proof/action.yml','.github/actions/portable-cache-transport-proof/run.mjs']
          expected=files+['.github/workflows/portable-cache-physical-transport-proof.yml']
          changed=subprocess.check_output(['git','diff','--name-only',code,controller],text=True).splitlines()
          assert sorted(changed)==sorted(expected),changed
          for name in files:
              target=pathlib.Path(name)
              assert not target.exists()
              target.parent.mkdir(parents=True,exist_ok=True)
              target.write_bytes(subprocess.check_output(['git','show',controller+':'+name]))
          PYCODE
      - uses: ./.github/actions/portable-cache-transport-proof
      - &upload-proof
        name: Upload only the private typed fixture bundle
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: portable-job-proof-${{ env.PROBE_KIND }}
          path: portable-proof-stage
          if-no-files-found: error
          compression-level: 0
          retention-days: 2
  browser-roundtrip:
    if: *proof-admission
    needs: host-seed
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    cache-mode: none
    permissions:
      contents: read
      actions: read
      packages: read
    container:
      image: ghcr.io/nil-studio/oasis7/ci-runtime@sha256:3984caa42d82963f93af752bf79e3a07838f2c94279cfbb2deeb08f715cd62c9
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
      options: --user 1001:1001 --init
      volumes:
        - ${{ github.workspace }}:/home/runner/work/oasis7/oasis7
        - /home/runner/work/_temp:/home/runner/work/_temp
    env:
      PROBE_PHASE: image
      PROBE_KIND: browser
    outputs:
      artifact: ${{ steps.upload.outputs.artifact-id }}
    steps: &image-steps
      - *proof-checkout
      - *stage-controller
      - name: Download the exact same-run host fixture
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.host-seed.outputs.artifact }}
          path: portable-proof-input-host
      - uses: ./.github/actions/portable-cache-transport-proof
      - name: Verify original SDK and finite before-extract refusal contracts
        shell: bash
        run: |
          python3 scripts/ci-cache-sdk.test.py
          python3 scripts/ci-portable-cache-archive.test.py
          python3 scripts/ci-portable-cache-job.test.py
          python3 scripts/ci-browser-deps.test.py BrowserDownloads
      - *upload-proof
  worker-roundtrip:
    if: *proof-admission
    needs: host-seed
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    cache-mode: none
    permissions:
      contents: read
      actions: read
      packages: read
    container:
      image: ghcr.io/nil-studio/oasis7/ci-rust-build@sha256:068f6982d684c23a39e4b52e56f35f307da388c5893c7837c10b5882ec7dd9fb
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
      options: --user 1001:1001 --init --tmpfs /opt/oasis7-mold:uid=1001,gid=1001,mode=0755,exec
      volumes:
        - ${{ github.workspace }}:/home/runner/work/oasis7/oasis7
        - /home/runner/work/_temp:/home/runner/work/_temp
        - /home/runner/work/_temp:/home/runner/.cache/oasis7/worker-build
    env:
      PROBE_PHASE: image
      PROBE_KIND: worker
      HOME: /home/runner/work/_temp/portable-worker-home
      CARGO_HOME: /home/runner/work/_temp/portable-worker-home/.cargo
    outputs:
      artifact: ${{ steps.upload.outputs.artifact-id }}
    steps: *image-steps
  host-reader:
    if: *proof-admission
    needs: [browser-roundtrip, worker-roundtrip]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    cache-mode: none
    env:
      PROBE_PHASE: read
      PROBE_KIND: host
    steps:
      - *proof-checkout
      - *stage-controller
      - name: Download the exact browser image fixture
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.browser-roundtrip.outputs.artifact }}
          path: portable-proof-input-browser
      - name: Download the exact Worker image fixture
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.worker-roundtrip.outputs.artifact }}
          path: portable-proof-input-worker
      - uses: ./.github/actions/portable-cache-transport-proof
