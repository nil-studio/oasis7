name: "代码任务"
description: "设计完善后的代码实施，或明确实现 bug 修复。"
title: "[代码] "
labels: ["type:code"]
body:
  - type: markdown
    attributes:
      value: |
        先查重；分类与状态分离。依开发流程规范的 Issue 五类与转换合同，建单不等于开发已启动。标签须在采用前配置；写后核对唯一类型，不默认 ready。
        拆出的开发任务须创建或复用本类 Issue，并在 GitHub 建立真实 parent/sub-issue 关系后领取；正文链接或 checkbox 不代替原生关系。见[子任务跟踪规则](https://github.com/nil-studio/oasis7/blob/main/doc/engineering/workflow/source-of-truth.md#code-task-sub-issues)。
        描述与评论遵循[语言与写作要求](https://github.com/nil-studio/oasis7/blob/main/doc/engineering/workflow/source-of-truth.md#language-and-writing)。
  - type: dropdown
    id: issue_type
    attributes:
      label: Issue 类型
      options:
        - "code / 代码"
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: "目标"
      description: "本项交付的可观察结果及影响；父项写完整目标，在项目拆解中组织可用模块增量与当前批次。"
    validations:
      required: true
  - type: textarea
    id: sources_scope
    attributes:
      label: "来源与范围"
      description: "公开来源与固定版本；本次范围、非目标、实际消费者与接口边界。明确影响范围的 profile、入口、版本或预算，或引用能唯一确定它们的来源；未定部分写明补齐动作及影响。子任务核对父 Issue 和原生关系。勿上传凭据或敏感日志。"
    validations:
      required: true
  - type: textarea
    id: type_evidence
    attributes:
      label: "代码准入依据"
      description: "二选一：完善且足以指导本次实现的产品文档和系统设计链接/版本；或正确既有约定、明确实现偏差及复现证据。写明代码语言/模块。"
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: "验收"
      description: "写明可运行的消费/测试入口、输入或夹具、独立预期及权威观察点，覆盖本行为必需的成功、拒绝和恢复；保留主责合同的适用条件与副作用边界。说明已核验与待补准备；本项单元测试及不依赖外部条件的集成测试由开发角色随 PR 完成；复杂测试写明其实际环境/资源依赖及合入后的承接，保留已有合入前必要验证。"
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: "依赖"
      description: "实际依赖的 Issue/PR/提交、接口、环境、测试数据、权限或 owner 决定，区分已具备和待满足条件；缺少的验收入口/夹具写清先行工作及负责人，环境阻塞写明解除条件。没有依赖写“无”。"
    validations:
      required: true
  - type: textarea
    id: delivery
    attributes:
      label: "交付终点"
      description: "本项完整合同及验收成立后的交付终点、下一责任人或待承接。等待后继结果或父项组合时，核对必要性与实际拆分收益，保留本行为必需验收；合入、部署和付费按实际授权。本项所需开发 PR 均实际合入且仍有复杂测试时，才沿用原 Issue 转测试，保留合入版本、开发测试证据、剩余验证与接收状态；无此剩余且全部原义务满足时直接结项。"
    validations:
      required: true
  - type: textarea
    id: parallel_plan
    attributes:
      label: "项目拆解与当前批次（复杂任务适用）"
      description: "先组织可用模块增量和关键依赖，再细化当前/近期批次；后续范围保留目标与前置。独立派发须有解除阻塞、独立容量、风险隔离或提前交付的收益，不能仅因可测试继续细拆。复用原生代码 sub-issue，派发前回读关系；模块分组不强制另建 Issue，内部步骤留清单。引用已有范围与验收，区分待承接、就绪和实际认领；任务与 PR 不要求一一对应。"
      placeholder: |
        父目标及最终集成验收 / 整体负责人：
        可用模块增量 / 当前批次 / 后续范围及关键前置：
        原生子 Issue 与对应结果 / 关系核对 / 实际拆分收益：
        已验证结果 / 待集成或待验收成果 / PR / 下一步：
        共享接口及写入负责人 / 当前验收准备与待承接责任：
