name: 代码开发任务
description: 由 dot 或已授权发布者准备，交给 Codex TPM 会话领取并派发的开发任务。
title: "[Code] "
body:
  - type: markdown
    attributes:
      value: |
        先查重并关联已有任务。此表单不自动添加 `codex:ready`；建单不代表已启动开发或获得新的模型、合入、部署授权。
        公开正文仅放必要且可公开的来源、复现与要求，不粘贴凭据或私有环境信息。
  - type: dropdown
    id: task_type
    attributes:
      label: 任务类型
      description: code-development 供 TPM 筛选代码开发任务；领取与派工由实际会话完成。
      options:
        - code-development / Rust
        - code-development / JavaScript / TypeScript
        - code-development / Rust + JavaScript / TypeScript
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: 目标
      description: 要解决什么问题，完成后应有什么行为？
      placeholder: 当前行为、预期行为及对用户的影响。
    validations:
      required: true
  - type: textarea
    id: sources_scope
    attributes:
      label: 来源与范围
      description: 关联设计、代码、失败记录或受测版本，说明允许修改的范围与明确限制。
      placeholder: 来源链接；可复现步骤及版本；本次包含和不包含的范围。
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 验收
      description: 写清可核对的结果；区分代码验证与适用的部署、真实环境验收。
      placeholder: 最小回归场景、预期结果、适用测试；需要 dot 后续核实的环境行为。
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: 依赖
      description: 列出必须先完成的 Issue、PR、权限或用户决定；没有则写“无”。
      placeholder: 无，或具体依赖及其满足条件。
    validations:
      required: true
  - type: dropdown
    id: delivery
    attributes:
      label: 交付终点
      description: 选择只描述已有授权；不能通过表单自行授予合入或部署权限。
      options:
        - 可评审 PR，等待用户评审，不合入
        - 按已有明确授权合入，再由 dot 完成适用部署与验收
    validations:
      required: true
