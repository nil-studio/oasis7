name: "代码任务"
description: "设计完善后的代码实施，或明确实现 bug 修复。"
title: "[代码] "
labels: ["type:code"]
body:
  - type: markdown
    attributes:
      value: |
        先查重；分类与状态分离。依开发流程规范的 Issue 五类与转换合同，建单不等于开发已启动。标签须在采用前配置；写后核对唯一类型，不默认 ready。
        拆出的开发任务须创建或复用本类 Issue，并在 GitHub 建立真实 parent/sub-issue 关系后领取；正文链接或 checkbox 不代替原生关系。见[子任务跟踪规则](https://github.com/nil-studio/oasis7/blob/main/doc/engineering/workflow/source-of-truth.md#code-task-sub-issues)。
        描述与评论遵循[语言与写作要求](https://github.com/nil-studio/oasis7/blob/main/doc/engineering/workflow/source-of-truth.md#language-and-writing)。
  - type: dropdown
    id: issue_type
    attributes:
      label: Issue 类型
      options:
        - "code / 代码"
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: "目标"
      description: "本项交付的可观察结果及影响；父项写总体目标，并在任务拆分中定位具体执行项。"
    validations:
      required: true
  - type: textarea
    id: sources_scope
    attributes:
      label: "来源与范围"
      description: "公开来源链接与固定版本；本次范围、非目标、实际消费者与接口边界。子任务写明父 Issue，并核对 GitHub parent 关系。勿上传凭据或敏感日志。"
    validations:
      required: true
  - type: textarea
    id: type_evidence
    attributes:
      label: "代码准入依据"
      description: "二选一：完善且足以指导本次实现的产品文档和系统设计链接/版本；或正确既有约定、明确实现偏差及复现证据。写明代码语言/模块。"
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: "验收"
      description: "写明可运行的消费/测试入口、输入或夹具、独立预期结果及观察方式，覆盖本行为必需的成功、拒绝和恢复。说明验收准备现状；局部自测随本项交付，父项保留实际组合、环境或持续观测的验收。CI 不代替部署或实玩。"
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: "依赖"
      description: "实际依赖的 Issue/PR/提交、接口、环境、测试数据、权限或 owner 决定，区分已具备和待满足条件；缺少的验收入口/夹具写清先行工作及负责人，环境阻塞写明解除条件。没有依赖写“无”。"
    validations:
      required: true
  - type: textarea
    id: delivery
    attributes:
      label: "交付终点"
      description: "写明已授权的交付终点、下一责任人或待承接；类型转换不授予合入、部署或付费执行权限。"
    validations:
      required: true
  - type: textarea
    id: parallel_plan
    attributes:
      label: "任务拆分（复杂任务适用）"
      description: "拆出的开发任务逐项创建或复用代码 Issue，并通过 GitHub 原生 sub-issue 关系挂到父项，派发前回读确认。阶段名或模块名不足以直接派工；仍含多个独立结果时继续拆分，必要原子改动说明具体耦合。子项分别维护领取、状态、PR 和验收；指定当前可启动项、依赖及整体集成负责人。未拆分的简单任务由前文表达即可，任务内部步骤可用清单；任务与 PR 不要求一一对应。"
      placeholder: |
        父目标及最终集成验收 / 整体负责人：
        父 Issue / 原生 sub-issue 链接及关系核对 / 一个可观察结果及对应验收：
        本次范围、非目标 / 消费入口与共享接口：
        实际输入版本 / 已具备或尚缺前置 / 负责人：
        可运行的验证入口、输入与结果观察 / 独立预期与验收准备现状：
        本项自测与交付终点 / 剩余组合、环境或观测验收及负责人：
        当前可启动项与依赖顺序 / 需调整或重新拆分的条件：
