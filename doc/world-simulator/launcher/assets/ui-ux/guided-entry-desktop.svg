<text x="24" y="978" font-size="14" fill="#536676">“运行中”与“本次未接受”同时成立。A/B 是方法变量；界面按实际字段和实例绑定表达，不新增命名 profile。More 内的 Stop、Restore 与其他动作沿既有前置；完整状态变化见配对设计与验收方法。</text>
