<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img" aria-labelledby="title desc"><title id="title">同一套语义，不只依赖颜色 · 设计目标 · 非运行截图</title><desc id="desc">08 / 组件与可访问性目标 · 现有 CSS 别名 + 明确标记的 Bevy 常量；不声称两端已共享 token。静态设计参考，不表示当前运行能力；示例实体、位置和结果仅用于说明设计契约。</desc><rect width="100%" height="100%" fill="#0b100f"/><g font-family="Noto Sans CJK SC, Noto Sans, sans-serif"><text x="48" y="42" font-size="16" fill="#9ca89a" font-weight="400">OASIS7  /  VIEWER DESIGN CONTRACT</text><text x="48" y="85" font-size="32" fill="#edf1e6" font-weight="600">同一套语义，不只依赖颜色</text><text x="48" y="119" font-size="18" fill="#9ca89a" font-weight="400">08 / 组件与可访问性目标 · 现有 CSS 别名 + 明确标记的 Bevy 常量；不声称两端已共享 token</text><text x="1240" y="42" font-size="18" fill="#d0a85b" font-weight="400">设计目标 · 非运行截图</text><rect x="64" y="170" width="900" height="660" rx="12" fill="#101412" stroke="#405346" /><rect x="88" y="208" width="48" height="48" rx="8" fill="#d0a85b" stroke="none" /><text x="160" y="234" font-size="23" fill="#edf1e6" font-weight="600">下一步 / 目标</text><text x="160" y="269" font-size="18" fill="#9ca89a" font-weight="400">明确标题 + 唯一主按钮</text><text x="160" y="296" font-size="16" fill="#9ca89a" font-weight="400">--color-objective-accent</text><rect x="88" y="330" width="48" height="48" rx="8" fill="#7ed3a6" stroke="none" /><text x="160" y="356" font-size="23" fill="#edf1e6" font-weight="600">已确认的完成</text><text x="160" y="391" font-size="18" fill="#9ca89a" font-weight="400">“已完成” + 权威结果说明</text><text x="160" y="418" font-size="16" fill="#9ca89a" font-weight="400">--color-receipt-success</text><rect x="88" y="452" width="48" height="48" rx="8" fill="#88cbd0" stroke="none" /><text x="160" y="478" font-size="23" fill="#edf1e6" font-weight="600">来源提示 / 建议</text><text x="160" y="513" font-size="18" fill="#9ca89a" font-weight="400">来源文字 + 轮廓 / 虚线</text><text x="160" y="540" font-size="16" fill="#9ca89a" font-weight="400">建议的来源提示；非已落地 token</text><rect x="88" y="574" width="48" height="48" rx="8" fill="#e58f76" stroke="none" /><text x="160" y="600" font-size="23" fill="#edf1e6" font-weight="600">阻碍 / 拒绝</text><text x="160" y="635" font-size="18" fill="#9ca89a" font-weight="400">原因 + 恢复说明</text><text x="160" y="662" font-size="16" fill="#9ca89a" font-weight="400">--color-blocker-danger</text><rect x="88" y="696" width="48" height="48" rx="8" fill="#9ca89a" stroke="none" /><text x="160" y="722" font-size="23" fill="#edf1e6" font-weight="600">等待 / 无推进</text><text x="160" y="757" font-size="18" fill="#9ca89a" font-weight="400">中性回执标记 + 状态文字</text><text x="160" y="784" font-size="16" fill="#9ca89a" font-weight="400">--color-text-muted</text><rect x="998" y="170" width="538" height="660" rx="12" fill="#101412" stroke="#405346" /><text x="1024" y="216" font-size="24" fill="#edf1e6" font-weight="600">焦点不是选中，也不是控制</text><rect x="1025" y="253" width="290" height="58" rx="16" fill="none" stroke="#d0a85b" stroke-width="3"/><rect x="1030" y="258" width="280" height="48" rx="12" fill="#161d19" stroke="#405346" /><text x="1046" y="289" font-size="18" fill="#edf1e6" font-weight="600">打开 Command</text><text x="1024" y="350" font-size="19" fill="#9ca89a" font-weight="400">键盘焦点：外轮廓 + 间隔</text><rect x="1030" y="390" width="250" height="32" rx="6" fill="#101412" stroke="#d0a85b" /><text x="1042" y="413" font-size="16" fill="#d0a85b" font-weight="400">已选中 · B</text><text x="1024" y="454" font-size="19" fill="#9ca89a" font-weight="400">选择：持续文字标识 + 实体光环</text><text x="1024" y="505" font-size="21" fill="#edf1e6" font-weight="400">当前无有效执行绑定</text><text x="1024" y="542" font-size="18" fill="#9ca89a" font-weight="400">禁用原因必须可阅读；不是只变灰。</text><path d="M1024 582 L1508 582" fill="none" stroke="#405346" stroke-width="2"/><text x="1024" y="624" font-size="20" fill="#edf1e6" font-weight="400">正文 ≥ 16 px；控件 ≥ 44 × 44</text><text x="1024" y="663" font-size="19" fill="#9ca89a" font-weight="400">遵循原 token：间隔 8 / 16 / 18</text><text x="1024" y="702" font-size="18" fill="#9ca89a" font-weight="400">减少动效时保留状态，不靠闪烁提示。</text><text x="1024" y="751" font-size="18" fill="#9ca89a" font-weight="400">不使用表情符号代替稳定语义图形。</text><rect x="64" y="869" width="30" height="30" rx="8" fill="#161d19" stroke="#405346" /><text x="72" y="891" font-size="17" fill="#d0a85b" font-weight="600">1</text><text x="108" y="892" font-size="20" fill="#edf1e6" font-weight="600">深林底色，暖白正文</text><text x="108" y="923" font-size="17" fill="#9ca89a" font-weight="400">现有 CSS：背景 #0b100f；目标 / 焦点 #d0a85b。</text><text x="108" y="951" font-size="17" fill="#9ca89a" font-weight="400">Bevy 选中角标 #fbbf24 是独立 Rust 常量，不等同 CSS。</text><rect x="830" y="869" width="30" height="30" rx="8" fill="#161d19" stroke="#405346" /><text x="838" y="891" font-size="17" fill="#d0a85b" font-weight="600">2</text><text x="874" y="892" font-size="20" fill="#edf1e6" font-weight="600">交付后的验收仍需运行证据</text><text x="874" y="923" font-size="17" fill="#9ca89a" font-weight="400">测对比度、焦点顺序、输入法、触控、文本缩放。</text><text x="874" y="951" font-size="17" fill="#9ca89a" font-weight="400">SVG / PNG 是设计契约，不是截图验收或功能通过证明。</text><path d="M48 1142 L1552 1142" fill="none" stroke="#405346" stroke-width="2"/><text x="48" y="1172" font-size="16" fill="#9ca89a" font-weight="400">基线 main 7a89dbc8d240 · 2026-10-29 · 示例不代表运行事实 / 权限 / 坐标</text><text x="1415" y="1172" font-size="16" fill="#9ca89a" font-weight="400">UIUX / 08</text></g></svg>