<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="1120" viewBox="0 0 1260 1120"><title>窄屏关键表单 / 390px viewport</title><desc>静态设计目标，虚构数据，非运行截图；分栏为互斥阶段，不同时启用。</desc><rect width="1260" height="1120" fill="#0b100f"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="28" y="36" font-size="24" fill="#edf1e6">OASIS7 / 窄屏关键表单 / 390px viewport</text><text x="28" y="66" font-size="14" fill="#9ca89a">设计稿 · 源码约束 · 非运行验收 · 各栏为互斥阶段 / 独立状态</text><g id="narrow-key"><rect x="28" y="95" width="390" height="900" rx="8" fill="#19251f" stroke="#405346"/><text x="46" y="125" font-size="20" fill="#d0a85b">保存模型 Key</text><rect x="46" y="153" width="354" height="130" rx="8" fill="#101412" stroke="#405346"/><text x="58" y="188" font-size="17" fill="#9ca89a">Bevy 世界视口保留区</text><text x="58" y="218" font-size="14" fill="#9ca89a">静态稿不绘制替代世界</text><text x="46" y="313" font-size="15" fill="#edf1e6">DeepSeek / deepseek-flash</text><text x="46" y="340" font-size="15" fill="#edf1e6">Key 存本站 localStorage</text><text x="46" y="367" font-size="15" fill="#edf1e6">同源脚本可读；关页仍保留</text><text x="46" y="394" font-size="15" fill="#edf1e6">不会上传 Oasis7 后端</text><text x="46" y="429" font-size="14" fill="#9ca89a">推理 API Key</text><rect x="46" y="439" width="350" height="44" rx="8" fill="#0b100f" stroke="#405346"/><text x="58" y="467" font-size="15" fill="#edf1e6">••••••••</text><rect x="46" y="494" width="18" height="18" rx="8" fill="#0b100f" stroke="#405346"/><text x="49" y="508" font-size="14" fill="#d0a85b">✓</text><text x="74" y="509" font-size="14" fill="#edf1e6">同意本机保存，仅发 DeepSeek</text><rect x="46" y="539" width="350" height="44" rx="8" fill="#d0a85b" stroke="#405346"/><text x="58" y="567" font-size="15" fill="#0b100f">保存 Key</text><text x="46" y="599" font-size="15" fill="#edf1e6">保存后尚未开始 Agent</text><text x="46" y="626" font-size="15" fill="#edf1e6">检查与开始有各自独立确认</text><text x="46" y="653" font-size="15" fill="#edf1e6">停止保留 Key；忘记才删除</text><rect x="46" y="692" width="350" height="44" rx="8" fill="#0b100f" stroke="#405346"/><text x="58" y="720" font-size="15" fill="#e7a89b">断开并忘记本机 Key</text><text x="46" y="752" font-size="15" fill="#edf1e6">仅删除本站 Key，不撤销供应商 Key</text><text x="46" y="779" font-size="15" fill="#edf1e6">不保证退款，不取消已受理世界作业</text></g><g id="narrow-recovery"><rect x="435" y="95" width="390" height="900" rx="8" fill="#19251f" stroke="#405346"/><text x="453" y="125" font-size="20" fill="#d0a85b">恢复 · 最终验证</text><rect x="453" y="153" width="354" height="130" rx="8" fill="#101412" stroke="#405346"/><text x="465" y="188" font-size="17" fill="#9ca89a">Bevy 世界视口保留区</text><text x="465" y="218" font-size="14" fill="#9ca89a">静态稿不绘制替代世界</text><text x="453" y="313" font-size="15" fill="#edf1e6">固定候选已建立</text><text x="453" y="340" font-size="15" fill="#edf1e6">请求：recovery-example</text><text x="453" y="367" font-size="15" fill="#edf1e6">等待时间以服务端状态为准</text><text x="453" y="402" font-size="14" fill="#9ca89a">最终验证码 · 6位</text><rect x="453" y="412" width="350" height="44" rx="8" fill="#0b100f" stroke="#405346"/><text x="465" y="440" font-size="15" fill="#edf1e6">请输入…</text><rect x="453" y="482" width="350" height="44" rx="8" fill="#d0a85b" stroke="#405346"/><text x="465" y="510" font-size="15" fill="#0b100f">验证邮箱与候选通行密钥</text><text x="453" y="542" font-size="15" fill="#edf1e6">仅本次完成阶段可用</text><text x="453" y="569" font-size="15" fill="#edf1e6">未知结果只查原件，不换候选</text><text x="453" y="596" font-size="15" fill="#edf1e6">取消/完成状态隐藏完成动作</text><rect x="453" y="635" width="350" height="44" rx="8" fill="#0b100f" stroke="#405346"/><text x="465" y="663" font-size="15" fill="#edf1e6">关闭此流程</text></g><g id="narrow-command"><rect x="842" y="95" width="390" height="900" rx="8" fill="#19251f" stroke="#405346"/><text x="860" y="125" font-size="20" fill="#d0a85b">Command · 无控制权限</text><rect x="860" y="153" width="354" height="130" rx="8" fill="#101412" stroke="#405346"/><text x="872" y="188" font-size="17" fill="#9ca89a">Bevy 世界视口保留区</text><text x="872" y="218" font-size="14" fill="#9ca89a">静态稿不绘制替代世界</text><text x="860" y="313" font-size="15" fill="#edf1e6">目标 Agent 示例 B</text><text x="860" y="340" font-size="15" fill="#edf1e6">选中对象不授予控制权</text><text x="860" y="367" font-size="15" fill="#edf1e6">当前不是本账号可控 Agent</text><text x="860" y="402" font-size="14" fill="#9ca89a">消息 · 禁用</text><rect x="860" y="412" width="350" height="44" rx="8" fill="#0b100f" stroke="#405346"/><text x="872" y="440" font-size="15" fill="#edf1e6">先恢复当前 Agent 绑定</text><rect x="860" y="482" width="350" height="44" rx="8" fill="#0b100f" stroke="#405346"/><text x="872" y="510" font-size="15" fill="#9ca89a">发送聊天</text><rect x="860" y="542" width="350" height="44" rx="8" fill="#d0a85b" stroke="#405346"/><text x="872" y="570" font-size="15" fill="#0b100f">刷新权限与 Agent 绑定</text><text x="860" y="602" font-size="15" fill="#edf1e6">多行输入不以 Enter 发送</text><text x="860" y="629" font-size="15" fill="#edf1e6">滚动只在抽屉，避免误触世界</text><text x="860" y="656" font-size="15" fill="#edf1e6">失去控制时先禁用动作</text><text x="860" y="683" font-size="15" fill="#edf1e6">反馈保留，不静默重发</text></g><rect x="28" y="1056" width="1204" height="44" rx="8" fill="#0b100f" stroke="#405346"/><text x="48" y="1085" font-size="17" fill="#d0a85b">World</text><text x="170" y="1085" font-size="17" fill="#d0a85b">Targets</text><text x="310" y="1085" font-size="17" fill="#d0a85b">Command</text></g></svg>