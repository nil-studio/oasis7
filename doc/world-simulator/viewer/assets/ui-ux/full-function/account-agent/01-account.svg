<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1060" viewBox="0 0 1440 1060"><title>账号 / 登录方式 / 世界控制</title><desc>静态设计目标，虚构数据，非运行截图；分栏为互斥阶段，不同时启用。</desc><rect width="1440" height="1060" fill="#0b100f"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="28" y="36" font-size="24" fill="#edf1e6">OASIS7 / 账号 / 登录方式 / 世界控制</text><text x="28" y="66" font-size="14" fill="#9ca89a">设计稿 · 源码约束 · 非运行验收 · 各栏为互斥阶段 / 独立状态</text><g id="entry"><rect x="28" y="95" width="440" height="400" rx="8" fill="#19251f" stroke="#405346"/><text x="46" y="125" font-size="20" fill="#d0a85b">01 未登录 · 能力驱动</text><text x="46" y="153" font-size="15" fill="#edf1e6">账号登录 ≠ 世界准入 ≠ Agent 控制</text><text x="46" y="180" font-size="15" fill="#edf1e6">通行密钥推荐；无需邮箱</text><rect x="46" y="215" width="390" height="44" rx="8" fill="#d0a85b" stroke="#405346"/><text x="58" y="243" font-size="15" fill="#0b100f">免邮箱创建账号</text><rect x="46" y="275" width="390" height="44" rx="8" fill="#0b100f" stroke="#405346"/><text x="58" y="303" font-size="15" fill="#edf1e6">使用通行密钥登录</text><rect x="46" y="335" width="390" height="44" rx="8" fill="#0b100f" stroke="#405346"/><text x="58" y="363" font-size="15" fill="#edf1e6">使用邮箱登录</text><text x="46" y="395" font-size="15" fill="#edf1e6">注册关闭：仅禁用创建，不禁用已有登录</text><text x="46" y="422" font-size="15" fill="#edf1e6">能力检查仅 HTTP 404 可走 legacy</text></g><g id="management"><rect x="494" y="95" width="440" height="400" rx="8" fill="#19251f" stroke="#405346"/><text x="512" y="125" font-size="20" fill="#d0a85b">02 账号与安全 · 已登录</text><text x="512" y="153" font-size="15" fill="#edf1e6">玩家 · 虚构账号</text><text x="512" y="180" font-size="15" fill="#edf1e6">登录方式与已登录会话是两类列表</text><text x="512" y="207" font-size="15" fill="#edf1e6">通行密钥 A（可能同步多设备）</text><rect x="512" y="234" width="390" height="44" rx="8" fill="#0b100f" stroke="#405346"/><text x="524" y="262" font-size="15" fill="#e7a89b">移除（需有效安全确认）</text><rect x="512" y="294" width="390" height="44" rx="8" fill="#d0a85b" stroke="#405346"/><text x="524" y="322" font-size="15" fill="#0b100f">添加备用通行密钥</text><rect x="512" y="354" width="390" height="44" rx="8" fill="#0b100f" stroke="#405346"/><text x="524" y="382" font-size="15" fill="#e7a89b">当前会话 · 退出</text><text x="512" y="414" font-size="15" fill="#edf1e6">保留有效公钥；失败按各列表单独重试</text></g><g id="world"><rect x="960" y="95" width="452" height="400" rx="8" fill="#19251f" stroke="#405346"/><text x="978" y="125" font-size="20" fill="#d0a85b">03 世界已有其他控制会话</text><text x="978" y="153" font-size="15" fill="#edf1e6">账号已登录 · 世界入场待确认</text><text x="978" y="180" font-size="15" fill="#edf1e6">不会因选中 Agent 而取得控制</text><text x="978" y="207" font-size="15" fill="#edf1e6">原页面或设备可能仍在使用</text><rect x="978" y="246" width="400" height="44" rx="8" fill="#d0a85b" stroke="#405346"/><text x="990" y="274" font-size="15" fill="#0b100f">确认在此设备继续，替换原控制</text><rect x="978" y="306" width="400" height="44" rx="8" fill="#0b100f" stroke="#405346"/><text x="990" y="334" font-size="15" fill="#edf1e6">保持原设备控制</text><text x="978" y="366" font-size="15" fill="#edf1e6">明确确认 expected epoch</text><text x="978" y="393" font-size="15" fill="#edf1e6">上下文改变先核对原请求，不自动接管</text></g><g id="import"><rect x="28" y="520" width="670" height="444" rx="8" fill="#19251f" stroke="#405346"/><text x="46" y="550" font-size="20" fill="#d0a85b">04 已绑定 Ed25519 账号密钥 · 展开</text><text x="46" y="578" font-size="15" fill="#edf1e6">仅本页内存签名；退出/关闭后重新导入。</text><text x="46" y="605" font-size="15" fill="#edf1e6">不接受钱包或节点私钥；无 Passkey 抗钓鱼保护。</text><text x="46" y="640" font-size="14" fill="#9ca89a">公钥 · 64 位十六进制</text><rect x="46" y="650" width="625" height="44" rx="8" fill="#0b100f" stroke="#405346"/><text x="58" y="678" font-size="15" fill="#edf1e6">示例占位，不是真实密钥</text><text x="46" y="720" font-size="14" fill="#9ca89a">私钥种子 · password / autocomplete off</text><rect x="46" y="730" width="625" height="44" rx="8" fill="#0b100f" stroke="#405346"/><text x="58" y="758" font-size="15" fill="#edf1e6">••••••••</text><rect x="46" y="800" width="625" height="44" rx="8" fill="#d0a85b" stroke="#405346"/><text x="58" y="828" font-size="15" fill="#0b100f">使用导入密钥登录</text><text x="46" y="860" font-size="15" fill="#edf1e6">登录不会为未绑定密钥创建账号。</text><text x="46" y="887" font-size="15" fill="#edf1e6">已登录变体：绑定这把密钥 / 加载已绑定密钥。</text></g><g id="capability"><rect x="724" y="520" width="688" height="444" rx="8" fill="#19251f" stroke="#405346"/><text x="742" y="550" font-size="20" fill="#d0a85b">能力 / 失败状态</text><text x="742" y="578" font-size="15" fill="#edf1e6">HTTP 404 → 兼容表单（仅兼容部署）</text><text x="742" y="605" font-size="15" fill="#edf1e6">其他能力检查失败 → 明确错误，不降级</text><text x="742" y="632" font-size="15" fill="#edf1e6">Passkey 取消/超时 → 可重新显式点击</text><text x="742" y="659" font-size="15" fill="#edf1e6">不支持 → 使用受支持浏览器/外部密钥/邮箱入口</text><text x="742" y="686" font-size="15" fill="#edf1e6">邮箱不可用 → 不阻断可用 Passkey</text><text x="742" y="713" font-size="15" fill="#edf1e6">登录会话过期/撤销/冻结 → 清除账号控制视图</text><text x="742" y="740" font-size="15" fill="#edf1e6">登录方式加载失败 ≠ 没有凭证</text><text x="742" y="767" font-size="15" fill="#edf1e6">未知原操作 → 核对原件，不重新创建账号</text><rect x="742" y="806" width="620" height="44" rx="8" fill="#d0a85b" stroke="#405346"/><text x="754" y="834" font-size="15" fill="#0b100f">重试加载登录方式</text></g><rect x="28" y="996" width="1384" height="44" rx="8" fill="#0b100f" stroke="#405346"/><text x="48" y="1025" font-size="17" fill="#d0a85b">World</text><text x="170" y="1025" font-size="17" fill="#d0a85b">Targets</text><text x="310" y="1025" font-size="17" fill="#d0a85b">Command</text></g></svg>