<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="800" viewBox="0 0 1440 800"><title>兼容入口 / 玩家会话 · 条件分支</title><desc>静态设计目标，虚构数据，非运行截图；分栏为互斥阶段，不同时启用。</desc><rect width="1440" height="800" fill="#0b100f"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="28" y="36" font-size="24" fill="#edf1e6">OASIS7 / 兼容入口 / 玩家会话 · 条件分支</text><text x="28" y="66" font-size="14" fill="#9ca89a">设计稿 · 源码约束 · 非运行验收 · 各栏为互斥阶段 / 独立状态</text><g id="legacy-address"><rect x="28" y="95" width="440" height="590" rx="8" fill="#19251f" stroke="#405346"/><text x="46" y="125" font-size="20" fill="#d0a85b">A HTTP 404 兼容 · 邮箱</text><text x="46" y="153" font-size="15" fill="#edf1e6">仅兼容合同允许的部署</text><text x="46" y="180" font-size="15" fill="#edf1e6">其他 capability 错误不能降级</text><text x="46" y="217" font-size="14" fill="#9ca89a">邮箱 · autocomplete=email</text><rect x="46" y="227" width="390" height="44" rx="8" fill="#0b100f" stroke="#405346"/><text x="58" y="255" font-size="15" fill="#edf1e6">player@example.invalid</text><rect x="46" y="297" width="390" height="44" rx="8" fill="#d0a85b" stroke="#405346"/><text x="58" y="325" font-size="15" fill="#0b100f">请求登录验证码</text><text x="46" y="357" font-size="15" fill="#edf1e6">startInFlight 时禁用</text><text x="46" y="384" font-size="15" fill="#edf1e6">修改输入清除旧错误与 retry_after</text></g><g id="legacy-code"><rect x="494" y="95" width="440" height="590" rx="8" fill="#19251f" stroke="#405346"/><text x="512" y="125" font-size="20" fill="#d0a85b">B challenge 已取得</text><text x="512" y="153" font-size="15" fill="#edf1e6">challenge / masked target / delivery</text><text x="512" y="180" font-size="15" fill="#edf1e6">account = existing 或 new</text><text x="512" y="207" font-size="15" fill="#edf1e6">显示实际返回，不猜测账号存在</text><text x="512" y="244" font-size="14" fill="#9ca89a">验证码 · legacy autocomplete=off</text><rect x="512" y="254" width="390" height="44" rx="8" fill="#0b100f" stroke="#405346"/><text x="524" y="282" font-size="15" fill="#edf1e6">请输入…</text><rect x="512" y="324" width="390" height="44" rx="8" fill="#d0a85b" stroke="#405346"/><text x="524" y="352" font-size="15" fill="#0b100f">登录并领取玩家会话</text><text x="512" y="384" font-size="15" fill="#edf1e6">completeInFlight 或 issueInFlight 禁用</text><text x="512" y="411" font-size="15" fill="#edf1e6">失败显示真实 error / retry_after 秒</text><text x="512" y="438" font-size="15" fill="#edf1e6">此旧流程不能代签 identity v2 恢复</text></g><g id="player-session"><rect x="960" y="95" width="452" height="590" rx="8" fill="#19251f" stroke="#405346"/><text x="978" y="125" font-size="20" fill="#d0a85b">C 玩家会话 · 需要时出现</text><text x="978" y="153" font-size="15" fill="#edf1e6">auth 状态 / tier / player / boundAgent</text><text x="978" y="180" font-size="15" fill="#edf1e6">会话缺失、重绑或恢复才打断主路径</text><text x="978" y="207" font-size="15" fill="#edf1e6">显示原资格恢复提示 / rebindNotice</text><text x="978" y="234" font-size="15" fill="#edf1e6">缺少有效 auth 时显示能力驱动入口</text><rect x="978" y="273" width="390" height="44" rx="8" fill="#d0a85b" stroke="#405346"/><text x="990" y="301" font-size="15" fill="#0b100f">释放玩家会话</text><text x="978" y="333" font-size="15" fill="#edf1e6">仅 auth.available 且非 legacy bootstrap</text><text x="978" y="360" font-size="15" fill="#edf1e6">释放玩家会话不等于删除账号</text><text x="978" y="387" font-size="15" fill="#edf1e6">账号退出与世界控制释放保持语义分离</text></g><rect x="28" y="736" width="1384" height="44" rx="8" fill="#0b100f" stroke="#405346"/><text x="48" y="765" font-size="17" fill="#d0a85b">World</text><text x="170" y="765" font-size="17" fill="#d0a85b">Targets</text><text x="310" y="765" font-size="17" fill="#d0a85b">Command</text></g></svg>