<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000"><title>浏览器 Agent / 入口与执行身份</title><desc>静态设计目标，虚构数据，非运行截图；分栏为互斥阶段，不同时启用。</desc><rect width="1440" height="1000" fill="#0b100f"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="28" y="36" font-size="24" fill="#edf1e6">OASIS7 / 浏览器 Agent / 入口与执行身份</text><text x="28" y="66" font-size="14" fill="#9ca89a">设计稿 · 源码约束 · 非运行验收 · 各栏为互斥阶段 / 独立状态</text><g id="entry"><rect x="28" y="95" width="440" height="790" rx="8" fill="#19251f" stroke="#405346"/><text x="46" y="125" font-size="20" fill="#d0a85b">A 账号合法入口</text><text x="46" y="153" font-size="15" fill="#edf1e6">先登录并恢复本机玩家身份</text><text x="46" y="180" font-size="15" fill="#edf1e6">只创建缺失入口；复用正式 Agent</text><text x="46" y="217" font-size="14" fill="#9ca89a">任务目标 · UTF-8 &lt;=8192 字节</text><rect x="46" y="227" width="390" height="44" rx="8" fill="#0b100f" stroke="#405346"/><text x="58" y="255" font-size="15" fill="#edf1e6">恢复生产前先检查物资</text><rect x="46" y="282" width="18" height="18" rx="8" fill="#0b100f" stroke="#405346"/><text x="49" y="296" font-size="14" fill="#d0a85b">✓</text><text x="74" y="297" font-size="14" fill="#edf1e6">确认当前身份与既有绑定</text><rect x="46" y="327" width="390" height="44" rx="8" fill="#d0a85b" stroke="#405346"/><text x="58" y="355" font-size="15" fill="#0b100f">准备玩家、Agent 与任务</text><rect x="46" y="387" width="390" height="44" rx="8" fill="#0b100f" stroke="#405346"/><text x="58" y="415" font-size="15" fill="#edf1e6">停止入口准备</text><text x="46" y="447" font-size="15" fill="#edf1e6">needs_participant / needs_task / needs_goal</text><text x="46" y="474" font-size="15" fill="#edf1e6">ready：世界确认正式 Agent/Task</text><text x="46" y="501" font-size="15" fill="#edf1e6">投影同步慢时仍使用正式绑定</text><text x="46" y="528" font-size="15" fill="#edf1e6">模型 Key 不授予游戏权限</text></g><g id="original"><rect x="494" y="95" width="440" height="790" rx="8" fill="#19251f" stroke="#405346"/><text x="512" y="125" font-size="20" fill="#d0a85b">B 原件状态：pending</text><text x="512" y="153" font-size="15" fill="#edf1e6">原件结果尚未确认</text><text x="512" y="180" font-size="15" fill="#edf1e6">仅只读查询，不根据最新快照判未发生</text><text x="512" y="207" font-size="15" fill="#edf1e6">不能替换身份、Agent 或新建原件</text><rect x="512" y="246" width="390" height="44" rx="8" fill="#d0a85b" stroke="#405346"/><text x="524" y="274" font-size="15" fill="#0b100f">只读核对账号入口原件</text><rect x="512" y="306" width="390" height="44" rx="8" fill="#0b100f" stroke="#405346"/><text x="524" y="334" font-size="15" fill="#9ca89a">准备玩家、Agent 与任务</text><text x="512" y="366" font-size="15" fill="#edf1e6">独立 unsent 变体：可靠本机记录</text><text x="512" y="393" font-size="15" fill="#edf1e6">证明尚未进入发送边界，才允许</text><text x="512" y="420" font-size="15" fill="#edf1e6">确认身份和冻结目标后继续同一原件</text><rect x="512" y="455" width="390" height="44" rx="8" fill="#d0a85b" stroke="#405346"/><text x="524" y="483" font-size="15" fill="#0b100f">继续发送保留的原件（仅 unsent）</text><text x="512" y="515" font-size="15" fill="#edf1e6">stopped：已发原件仍可能生效</text><text x="512" y="542" font-size="15" fill="#edf1e6">重开只读，不自动继续准备</text><text x="512" y="569" font-size="15" fill="#edf1e6">owner_mismatch：恢复原身份，不换 Agent</text></g><g id="executor"><rect x="960" y="95" width="452" height="790" rx="8" fill="#19251f" stroke="#405346"/><text x="978" y="125" font-size="20" fill="#d0a85b">C 执行身份登记</text><text x="978" y="153" font-size="15" fill="#edf1e6">world / owner / Agent / Task</text><text x="978" y="180" font-size="15" fill="#edf1e6">goal reference / executor binding</text><text x="978" y="207" font-size="15" fill="#edf1e6">显示实际任务与当前目标</text><rect x="978" y="246" width="390" height="44" rx="8" fill="#0b100f" stroke="#405346"/><text x="990" y="274" font-size="15" fill="#edf1e6">只读核对当前任务</text><rect x="978" y="291" width="18" height="18" rx="8" fill="#0b100f" stroke="#405346"/><text x="981" y="305" font-size="14" fill="#d0a85b">✓</text><text x="1006" y="306" font-size="14" fill="#edf1e6">确认授权此浏览器执行身份</text><text x="978" y="336" font-size="15" fill="#edf1e6">其他执行方存在：明确同意切换</text><text x="978" y="363" font-size="15" fill="#edf1e6">不会因此创建新 Agent</text><rect x="978" y="402" width="390" height="44" rx="8" fill="#d0a85b" stroke="#405346"/><text x="990" y="430" font-size="15" fill="#0b100f">核对任务并登记执行身份</text><text x="978" y="462" font-size="15" fill="#edf1e6">fence 缺失 / preparing / running 禁止登记</text><text x="978" y="489" font-size="15" fill="#edf1e6">目标或身份改变：清除之前确认</text><text x="978" y="516" font-size="15" fill="#edf1e6">旧执行 active/unknown：禁止浏览器开始</text><text x="978" y="543" font-size="15" fill="#edf1e6">完成身份登记后才可保存模型 Key</text></g><rect x="28" y="936" width="1384" height="44" rx="8" fill="#0b100f" stroke="#405346"/><text x="48" y="965" font-size="17" fill="#d0a85b">World</text><text x="170" y="965" font-size="17" fill="#d0a85b">Targets</text><text x="310" y="965" font-size="17" fill="#d0a85b">Command</text></g></svg>