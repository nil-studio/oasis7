<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1100" viewBox="0 0 1440 1100"><title>邮箱与恢复 / 互斥阶段</title><desc>静态设计目标，虚构数据，非运行截图；分栏为互斥阶段，不同时启用。</desc><rect width="1440" height="1100" fill="#0b100f"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="28" y="36" font-size="24" fill="#edf1e6">OASIS7 / 邮箱与恢复 / 互斥阶段</text><text x="28" y="66" font-size="14" fill="#9ca89a">设计稿 · 源码约束 · 非运行验收 · 各栏为互斥阶段 / 独立状态</text><g id="eligibility"><rect x="28" y="95" width="440" height="435" rx="8" fill="#19251f" stroke="#405346"/><text x="46" y="125" font-size="20" fill="#d0a85b">A 资格邮箱</text><text x="46" y="153" font-size="14" fill="#9ca89a">此前绑定邮箱</text><rect x="46" y="163" width="390" height="44" rx="8" fill="#0b100f" stroke="#405346"/><text x="58" y="191" font-size="15" fill="#edf1e6">player@example.invalid</text><text x="46" y="233" font-size="14" fill="#9ca89a">已有申请编号（可选）</text><rect x="46" y="243" width="390" height="44" rx="8" fill="#0b100f" stroke="#405346"/><text x="58" y="271" font-size="15" fill="#edf1e6">请输入…</text><text x="46" y="313" font-size="15" fill="#edf1e6">满足等待条件的已绑定邮箱</text><text x="46" y="340" font-size="15" fill="#edf1e6">恢复不立即解除原 Passkey 保护</text><rect x="46" y="375" width="390" height="44" rx="8" fill="#d0a85b" stroke="#405346"/><text x="58" y="403" font-size="15" fill="#0b100f">发送本次操作验证码</text></g><g id="code"><rect x="494" y="95" width="440" height="435" rx="8" fill="#19251f" stroke="#405346"/><text x="512" y="125" font-size="20" fill="#d0a85b">B 本次操作验证码</text><text x="512" y="153" font-size="14" fill="#9ca89a">验证码 · numeric / 最多6位</text><rect x="512" y="163" width="390" height="44" rx="8" fill="#0b100f" stroke="#405346"/><text x="524" y="191" font-size="15" fill="#edf1e6">请输入…</text><text x="512" y="233" font-size="15" fill="#edf1e6">两分钟内有效；只用于指定操作</text><text x="512" y="260" font-size="15" fill="#edf1e6">登录 / 绑定 / 首个 Passkey / 资格</text><text x="512" y="287" font-size="15" fill="#edf1e6">各自独立状态，不共用提交承诺</text><rect x="512" y="322" width="390" height="44" rx="8" fill="#d0a85b" stroke="#405346"/><text x="524" y="350" font-size="15" fill="#0b100f">确认本次操作</text><rect x="512" y="390" width="390" height="44" rx="8" fill="#0b100f" stroke="#405346"/><text x="524" y="418" font-size="15" fill="#edf1e6">关闭此流程</text></g><g id="candidate"><rect x="960" y="95" width="452" height="435" rx="8" fill="#19251f" stroke="#405346"/><text x="978" y="125" font-size="20" fill="#d0a85b">C 固定恢复候选</text><text x="978" y="153" font-size="15" fill="#edf1e6">先创建固定候选通行密钥</text><text x="978" y="180" font-size="15" fill="#edf1e6">恢复完成前不能登录原账号</text><text x="978" y="207" font-size="15" fill="#edf1e6">完成还需邮箱 + 此候选密钥</text><rect x="978" y="242" width="390" height="44" rx="8" fill="#d0a85b" stroke="#405346"/><text x="990" y="270" font-size="15" fill="#0b100f">创建候选通行密钥并申请恢复</text></g><g id="status"><rect x="28" y="555" width="670" height="445" rx="8" fill="#19251f" stroke="#405346"/><text x="46" y="585" font-size="20" fill="#d0a85b">D 恢复申请 · waiting</text><text x="46" y="613" font-size="15" fill="#edf1e6">申请：recovery-example（虚构）</text><text x="46" y="640" font-size="15" fill="#edf1e6">状态：等待保护期</text><text x="46" y="667" font-size="15" fill="#edf1e6">最早可完成：服务端 not_before</text><text x="46" y="694" font-size="15" fill="#edf1e6">到期时间：服务端 expires_at</text><text x="46" y="721" font-size="15" fill="#edf1e6">固定候选：candidate_digest（脱敏展示）</text><rect x="46" y="748" width="625" height="44" rx="8" fill="#0b100f" stroke="#405346"/><text x="58" y="776" font-size="15" fill="#edf1e6">刷新申请状态</text><rect x="46" y="808" width="625" height="44" rx="8" fill="#0b100f" stroke="#405346"/><text x="58" y="836" font-size="15" fill="#e7a89b">取消此固定候选的恢复申请</text><text x="46" y="868" font-size="15" fill="#edf1e6">已登录分支：用原通行密钥批准此固定候选</text><text x="46" y="895" font-size="15" fill="#edf1e6">cancelled / completed：仅核对，不再显示完成动作</text></g><g id="complete"><rect x="724" y="555" width="688" height="245" rx="8" fill="#19251f" stroke="#405346"/><text x="742" y="585" font-size="20" fill="#d0a85b">E 最终验证 · signed out 分支</text><text x="742" y="613" font-size="14" fill="#9ca89a">最终验证码</text><rect x="742" y="623" width="625" height="44" rx="8" fill="#0b100f" stroke="#405346"/><text x="754" y="651" font-size="15" fill="#edf1e6">请输入…</text><rect x="742" y="693" width="625" height="44" rx="8" fill="#d0a85b" stroke="#405346"/><text x="754" y="721" font-size="15" fill="#0b100f">验证邮箱与候选通行密钥，完成恢复</text></g><g id="original"><rect x="724" y="820" width="688" height="180" rx="8" fill="#19251f" stroke="#405346"/><text x="742" y="850" font-size="20" fill="#d0a85b">原操作未知 · 不换候选 / 不新建账号</text><text x="742" y="878" font-size="15" fill="#edf1e6">保留原 operation ID；过查询窗口仍不等于未发生</text><rect x="742" y="905" width="300" height="44" rx="8" fill="#0b100f" stroke="#405346"/><text x="754" y="933" font-size="15" fill="#edf1e6">核对原操作进度</text><rect x="1062" y="905" width="305" height="44" rx="8" fill="#0b100f" stroke="#405346"/><text x="1074" y="933" font-size="15" fill="#edf1e6">重新确认当前会话</text></g><rect x="28" y="1036" width="1384" height="44" rx="8" fill="#0b100f" stroke="#405346"/><text x="48" y="1065" font-size="17" fill="#d0a85b">World</text><text x="170" y="1065" font-size="17" fill="#d0a85b">Targets</text><text x="310" y="1065" font-size="17" fill="#d0a85b">Command</text></g></svg>