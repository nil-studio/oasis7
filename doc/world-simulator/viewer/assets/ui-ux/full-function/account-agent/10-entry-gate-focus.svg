<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1230" viewBox="0 0 1600 1230"><title>入口菜单与强制登录 / 局部交互收口</title><desc>静态设计目标，虚构数据，非运行截图；分栏为互斥阶段，不同时启用。</desc><rect width="1600" height="1230" fill="#0b100f"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="28" y="36" font-size="24" fill="#edf1e6">OASIS7 / 入口菜单与强制登录 / 局部交互收口</text><text x="28" y="66" font-size="14" fill="#9ca89a">设计稿 · 源码约束 · 非运行验收 · 各栏为互斥阶段 / 独立状态</text><g id="entry-menu"><rect x="28" y="95" width="450" height="740" rx="8" fill="#19251f" stroke="#405346"/><text x="46" y="125" font-size="20" fill="#d0a85b">R-NAV-03 · 语言与账号入口</text><rect x="46" y="153" width="408" height="44" rx="8" fill="#0b100f" stroke="#405346"/><text x="58" y="181" font-size="15" fill="#edf1e6">▾ 入口 · summary / 展开</text><text x="46" y="213" font-size="15" fill="#edf1e6">主玩法继续留在当前页面</text><text x="46" y="240" font-size="15" fill="#edf1e6">切换语言或管理账号安全</text><rect x="46" y="275" width="408" height="44" rx="8" fill="#0b100f" stroke="#405346"/><text x="58" y="303" font-size="15" fill="#9ca89a">中文 · 当前值（disabled）</text><rect x="46" y="335" width="408" height="44" rx="8" fill="#0b100f" stroke="#405346"/><text x="58" y="363" font-size="15" fill="#edf1e6">English · 切换 en</text><text x="46" y="395" font-size="15" fill="#edf1e6">locale=zh · 当前值（localeCode）</text><text x="46" y="422" font-size="15" fill="#edf1e6">当前入口 URL：softwareSafeUrl 动态文本</text><rect x="46" y="459" width="408" height="44" rx="8" fill="#0b100f" stroke="#405346"/><text x="58" y="487" font-size="15" fill="#edf1e6">▾ 账号与安全 · 独立 details</text><rect x="46" y="519" width="408" height="130" rx="8" fill="#0b100f" stroke="#405346"/><text x="58" y="545" font-size="16" fill="#edf1e6">账号与安全 / HostedLoginForm</text><text x="58" y="574" font-size="14" fill="#9ca89a">复用01账号表单，不新建设置中心</text><text x="58" y="602" font-size="14" fill="#9ca89a">max-height:60vh；内部纵向滚动</text><text x="46" y="677" font-size="15" fill="#edf1e6">账号披露仅 hosted_public_join + auth.available</text><text x="46" y="704" font-size="15" fill="#edf1e6">否则不显示账号与安全 details</text></g><g id="gate-signed-out"><rect x="500" y="95" width="522" height="740" rx="8" fill="#19251f" stroke="#405346"/><text x="518" y="125" font-size="20" fill="#d0a85b">R-AUTH-12 · 阶段A 未登录</text><rect x="518" y="153" width="480" height="86" rx="8" fill="#0b100f" stroke="#405346"/><text x="530" y="181" font-size="16" fill="#9ca89a">背景世界 / Dock 仅作位置保留</text><text x="530" y="209" font-size="14" fill="#9ca89a">焦点不应落入；不绘制JS替代世界</text><rect x="518" y="261" width="480" height="418" rx="8" fill="#0b100f" stroke="#405346"/><text x="536" y="295" font-size="16" fill="#9ca89a">欢迎来到 Oasis7</text><text x="536" y="333" font-size="24" fill="#edf1e6">登录后进入游戏</text><text x="536" y="365" font-size="16" fill="#d0a85b">尚未登录</text><text x="536" y="399" font-size="16" fill="#edf1e6">先登录或创建账号，再进入世界。</text><rect x="536" y="485" width="444" height="44" rx="8" fill="#d0a85b" stroke="#405346"/><text x="548" y="513" font-size="15" fill="#0b100f">使用通行密钥登录</text><rect x="532" y="481" width="452" height="52" rx="10" fill="none" stroke="#edf1e6" stroke-width="3"/><text x="536" y="568" font-size="14" fill="#d0a85b">① 当前示例首个可用控件 · 焦点环</text><rect x="536" y="425" width="444" height="44" rx="8" fill="#0b100f" stroke="#405346"/><text x="548" y="453" font-size="15" fill="#9ca89a">免邮箱创建账号 · 注册关闭</text><text x="536" y="605" font-size="14" fill="#9ca89a">没有关闭按钮；Escape 不绕过强制门禁</text><text x="518" y="703" font-size="15" fill="#edf1e6">示例能力：Passkey可用，注册关闭</text><text x="518" y="730" font-size="15" fill="#edf1e6">首焦点按实际可用控件顺序计算</text><text x="518" y="757" font-size="15" fill="#edf1e6">加载期无可用控件：焦点落dialog本身</text></g><g id="gate-world-pending"><rect x="1044" y="95" width="528" height="740" rx="8" fill="#19251f" stroke="#405346"/><text x="1062" y="125" font-size="20" fill="#d0a85b">R-AUTH-12 · 阶段B 账号已登录</text><rect x="1062" y="153" width="486" height="86" rx="8" fill="#0b100f" stroke="#405346"/><text x="1074" y="181" font-size="16" fill="#9ca89a">背景世界 / Dock 仍非认证替代</text><text x="1074" y="209" font-size="14" fill="#9ca89a">账号成功不等于 auth.available</text><rect x="1062" y="261" width="486" height="418" rx="8" fill="#0b100f" stroke="#405346"/><text x="1080" y="295" font-size="16" fill="#9ca89a">欢迎来到 Oasis7</text><text x="1080" y="333" font-size="24" fill="#edf1e6">进入世界开始游戏</text><text x="1080" y="365" font-size="16" fill="#d0a85b">账号已登录，等待入场</text><text x="1080" y="399" font-size="16" fill="#edf1e6">世界控制确认后才能聊天与探索。</text><rect x="1080" y="425" width="450" height="44" rx="8" fill="#d0a85b" stroke="#405346"/><text x="1092" y="453" font-size="15" fill="#0b100f">进入世界</text><text x="1080" y="514" font-size="16" fill="#9ca89a">登录方式 / 已登录会话 · 复用账号区</text><text x="1080" y="573" font-size="14" fill="#9ca89a">此处是同一 gate 的互斥阶段，不是第二弹窗</text><text x="1080" y="603" font-size="14" fill="#9ca89a">不提供“跳过登录”或强行关闭</text><text x="1062" y="703" font-size="15" fill="#edf1e6">gate条件：!auth.available 且 hosted_public_join</text><text x="1062" y="730" font-size="15" fill="#edf1e6">条件消失后不显示gate；不据账号状态推导控制</text><text x="1062" y="757" font-size="15" fill="#edf1e6">cleanup回焦仅当先前元素仍在document中</text></g><g id="entry-focus"><rect x="28" y="860" width="450" height="260" rx="8" fill="#19251f" stroke="#405346"/><text x="46" y="890" font-size="20" fill="#d0a85b">菜单收起路径 · 真实原生 details</text><rect x="46" y="918" width="408" height="44" rx="8" fill="#0b100f" stroke="#405346"/><text x="58" y="946" font-size="15" fill="#edf1e6">▸ 入口 · summary / 收起</text><text x="46" y="978" font-size="15" fill="#edf1e6">Tab回到summary → Enter/Space切换收起</text><text x="46" y="1005" font-size="15" fill="#edf1e6">这一条路径焦点留在summary</text><text x="46" y="1032" font-size="15" fill="#edf1e6">源码无自定义focus-restoration handler</text><text x="46" y="1059" font-size="15" fill="#edf1e6">不宣称外点/Escape关闭自动回焦</text></g><g id="focus-boundary"><rect x="500" y="860" width="1072" height="260" rx="8" fill="#19251f" stroke="#405346"/><text x="518" y="890" font-size="20" fill="#d0a85b">焦点范围与背景隔离 · 实线为源码，缺口不冒充已实现</text><text x="518" y="918" font-size="15" fill="#edf1e6">Tab：最后可聚焦项 → 第一项；Shift+Tab：第一项 → 最后一项</text><text x="518" y="945" font-size="15" fill="#edf1e6">focusin落到外部（含异步canvas抢焦点）→ guard 拉回首个可用控件 / dialog</text><text x="518" y="972" font-size="15" fill="#edf1e6">v2表面到达：仅当当前焦点仍为dialog时，异步聚焦第一个可用input/button</text><text x="518" y="999" font-size="15" fill="#edf1e6">背景 inert：此login条件未绑定；AppShell的inert只随 starterOcGateOpen。</text><text x="518" y="1026" font-size="15" fill="#edf1e6">待验收/实现缺口：登录gate下背景pointer与辅助技术隔离，不能由aria-modal或静态图代签。</text></g><rect x="28" y="1166" width="1544" height="44" rx="8" fill="#0b100f" stroke="#405346"/><text x="48" y="1195" font-size="17" fill="#d0a85b">World</text><text x="170" y="1195" font-size="17" fill="#d0a85b">Targets</text><text x="310" y="1195" font-size="17" fill="#d0a85b">Command</text></g></svg>