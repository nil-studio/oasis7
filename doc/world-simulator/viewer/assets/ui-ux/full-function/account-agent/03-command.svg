<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1110" viewBox="0 0 1440 1110"><title>Command / 当前能力与高级控制</title><desc>静态设计目标，虚构数据，非运行截图；分栏为互斥阶段，不同时启用。</desc><rect width="1440" height="1110" fill="#0b100f"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="28" y="36" font-size="24" fill="#edf1e6">OASIS7 / Command / 当前能力与高级控制</text><text x="28" y="66" font-size="14" fill="#9ca89a">设计稿 · 源码约束 · 非运行验收 · 各栏为互斥阶段 / 独立状态</text><g id="chat"><rect x="28" y="95" width="670" height="530" rx="8" fill="#19251f" stroke="#405346"/><text x="46" y="125" font-size="20" fill="#d0a85b">Agent 示例 A · 当前会话可控</text><text x="46" y="153" font-size="15" fill="#edf1e6">状态 / 新鲜度 / 当前已发布目标</text><text x="46" y="180" font-size="15" fill="#edf1e6">消息草稿不是已接受指令，接受不是世界效果</text><text x="46" y="215" font-size="14" fill="#9ca89a">消息 · 多行 / 中文组合输入</text><rect x="46" y="225" width="625" height="44" rx="8" fill="#0b100f" stroke="#405346"/><text x="58" y="253" font-size="15" fill="#edf1e6">先检查供给，再报告可执行下一步</text><rect x="46" y="295" width="625" height="44" rx="8" fill="#d0a85b" stroke="#405346"/><text x="58" y="323" font-size="15" fill="#0b100f">发送聊天 · 显式动作</text><text x="46" y="355" font-size="15" fill="#edf1e6">Enter / Shift+Enter 仅换行，不提交</text><text x="46" y="382" font-size="15" fill="#edf1e6">无权限 / 非当前 Agent / in-flight：禁用</text><text x="46" y="409" font-size="15" fill="#edf1e6">OC 启动资金与 BYOK 供应商预算不得混为一谈</text><text x="46" y="436" font-size="15" fill="#edf1e6">接收中、blocked、rejected、applied 按真实反馈</text></g><g id="prompt"><rect x="724" y="95" width="688" height="900" rx="8" fill="#19251f" stroke="#405346"/><text x="742" y="125" font-size="20" fill="#d0a85b">高级提示词设置 · 显式展开变体</text><text x="742" y="153" font-size="15" fill="#edf1e6">默认收起；与普通 Chat 分离</text><text x="742" y="180" font-size="15" fill="#edf1e6">当前版本 / 下一回滚目标 / restoredFrom</text><text x="742" y="207" font-size="14" fill="#9ca89a">系统提示词覆盖</text><rect x="742" y="217" width="625" height="44" rx="8" fill="#0b100f" stroke="#405346"/><text x="754" y="245" font-size="15" fill="#edf1e6">草稿 / 条件字段（不是真实凭据）</text><text x="742" y="287" font-size="14" fill="#9ca89a">短期目标覆盖</text><rect x="742" y="297" width="625" height="44" rx="8" fill="#0b100f" stroke="#405346"/><text x="754" y="325" font-size="15" fill="#edf1e6">草稿 / 条件字段（不是真实凭据）</text><text x="742" y="367" font-size="14" fill="#9ca89a">长期目标覆盖</text><rect x="742" y="377" width="625" height="44" rx="8" fill="#0b100f" stroke="#405346"/><text x="754" y="405" font-size="15" fill="#edf1e6">草稿 / 条件字段（不是真实凭据）</text><text x="742" y="447" font-size="14" fill="#9ca89a">后端审批码 · 仅适用 strong_auth 条件</text><rect x="742" y="457" width="625" height="44" rx="8" fill="#0b100f" stroke="#405346"/><text x="754" y="485" font-size="15" fill="#edf1e6">草稿 / 条件字段（不是真实凭据）</text><text x="742" y="527" font-size="14" fill="#9ca89a">回滚目标版本 · 非负整数</text><rect x="742" y="537" width="625" height="44" rx="8" fill="#0b100f" stroke="#405346"/><text x="754" y="565" font-size="15" fill="#edf1e6">草稿 / 条件字段（不是真实凭据）</text><rect x="742" y="607" width="300" height="44" rx="8" fill="#0b100f" stroke="#405346"/><text x="754" y="635" font-size="15" fill="#edf1e6">预览提示词</text><rect x="1062" y="607" width="305" height="44" rx="8" fill="#d0a85b" stroke="#405346"/><text x="1074" y="635" font-size="15" fill="#0b100f">应用提示词</text><text x="742" y="667" font-size="15" fill="#edf1e6">预览：读取评估结果，不应用配置</text><text x="742" y="694" font-size="15" fill="#edf1e6">应用：独立提交 mutation，读自己的反馈</text><text x="742" y="721" font-size="15" fill="#edf1e6">两者均需 promptControlsEnabled；后端重验权限</text><text x="742" y="748" font-size="15" fill="#edf1e6">应用受有效会话与审批条件限制</text><rect x="742" y="783" width="625" height="44" rx="8" fill="#0b100f" stroke="#405346"/><text x="754" y="811" font-size="15" fill="#e7a89b">回滚提示词</text><text x="742" y="843" font-size="15" fill="#edf1e6">preview ≠ apply；accepted ≠ runtime applied</text></g><g id="history"><rect x="28" y="650" width="670" height="350" rx="8" fill="#19251f" stroke="#405346"/><text x="46" y="680" font-size="20" fill="#d0a85b">消息流 · 只显示当前 Agent</text><text x="46" y="708" font-size="15" fill="#edf1e6">最多 12 项；tick 与诊断可展开</text><text x="46" y="735" font-size="15" fill="#edf1e6">空态：这个行动体还没有聊天历史</text><text x="46" y="762" font-size="15" fill="#edf1e6">反馈：真实原因 + 下一步，不静默重放</text><text x="46" y="789" font-size="15" fill="#edf1e6">控制丢失：先阻止动作，再恢复绑定</text><text x="46" y="816" font-size="15" fill="#edf1e6">presets / collaboration / external runtime</text><text x="46" y="843" font-size="15" fill="#edf1e6">属于产品目标；不是当前 Chat 已实现</text><rect x="46" y="870" width="625" height="44" rx="8" fill="#d0a85b" stroke="#405346"/><text x="58" y="898" font-size="15" fill="#0b100f">刷新权限与 Agent 绑定</text></g><rect x="28" y="1046" width="1384" height="44" rx="8" fill="#0b100f" stroke="#405346"/><text x="48" y="1075" font-size="17" fill="#d0a85b">World</text><text x="170" y="1075" font-size="17" fill="#d0a85b">Targets</text><text x="310" y="1075" font-size="17" fill="#d0a85b">Command</text></g></svg>