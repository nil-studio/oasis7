<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080"><title>Command / 目标、事实、决策与意图</title><desc>静态设计目标，虚构数据，非运行截图；分栏为互斥阶段，不同时启用。</desc><rect width="1440" height="1080" fill="#0b100f"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="28" y="36" font-size="24" fill="#edf1e6">OASIS7 / Command / 目标、事实、决策与意图</text><text x="28" y="66" font-size="14" fill="#9ca89a">设计稿 · 源码约束 · 非运行验收 · 各栏为互斥阶段 / 独立状态</text><g id="goal"><rect x="28" y="95" width="670" height="220" rx="8" fill="#19251f" stroke="#405346"/><text x="46" y="125" font-size="20" fill="#d0a85b">当前目标 · 已认证 canonical 回读</text><text x="46" y="153" font-size="15" fill="#edf1e6">当前目标：先核查供给，再恢复生产（虚构）</text><text x="46" y="180" font-size="15" fill="#edf1e6">仅 authenticatedCanonicalGoal 成功才展示正文</text><text x="46" y="207" font-size="15" fill="#edf1e6">独立 pending 状态：目标已提交，等待世界确认</text><text x="46" y="234" font-size="15" fill="#edf1e6">Chat 草稿不是当前权威目标；等待不显示假应用</text></g><g id="context"><rect x="28" y="340" width="670" height="560" rx="8" fill="#19251f" stroke="#405346"/><text x="46" y="370" font-size="20" fill="#d0a85b">Agent 上下文 · 只读分组</text><text x="46" y="398" font-size="14" fill="#9ca89a">身份 / 所在位置</text><rect x="46" y="408" width="625" height="44" rx="8" fill="#0b100f" stroke="#405346"/><text x="58" y="436" font-size="15" fill="#edf1e6">Agent 示例 A · 北侧补给区</text><text x="46" y="478" font-size="14" fill="#9ca89a">事实 / 新鲜度</text><rect x="46" y="488" width="625" height="44" rx="8" fill="#0b100f" stroke="#405346"/><text x="58" y="516" font-size="15" fill="#edf1e6">当前状态 · current（只按权威投影）</text><text x="46" y="558" font-size="14" fill="#9ca89a">目标</text><rect x="46" y="568" width="625" height="44" rx="8" fill="#0b100f" stroke="#405346"/><text x="58" y="596" font-size="15" fill="#edf1e6">恢复生产前先检查供给</text><text x="46" y="638" font-size="14" fill="#9ca89a">下一步</text><rect x="46" y="648" width="625" height="44" rx="8" fill="#0b100f" stroke="#405346"/><text x="58" y="676" font-size="15" fill="#edf1e6">不可用</text><text x="46" y="718" font-size="14" fill="#9ca89a">阻塞</text><rect x="46" y="728" width="625" height="44" rx="8" fill="#0b100f" stroke="#405346"/><text x="58" y="756" font-size="15" fill="#edf1e6">等待权威 Agent 投影</text><text x="46" y="798" font-size="14" fill="#9ca89a">玩家杠杆</text><rect x="46" y="808" width="625" height="44" rx="8" fill="#0b100f" stroke="#405346"/><text x="58" y="836" font-size="15" fill="#edf1e6">不可用</text></g><g id="activity"><rect x="724" y="95" width="688" height="330" rx="8" fill="#19251f" stroke="#405346"/><text x="742" y="125" font-size="20" fill="#d0a85b">当前活动 · blocked 变体</text><text x="742" y="153" font-size="15" fill="#edf1e6">当前活动：受阻</text><text x="742" y="180" font-size="15" fill="#edf1e6">操作：Move（示例）</text><text x="742" y="207" font-size="15" fill="#edf1e6">目标：目标信息暂不可用</text><text x="742" y="234" font-size="15" fill="#edf1e6">原因：Missing Material（示例）</text><text x="742" y="261" font-size="15" fill="#edf1e6">idle / unavailable 不展示残留目标与原因</text><text x="742" y="288" font-size="15" fill="#edf1e6">executing / waiting 显示操作与可用目标</text><text x="742" y="315" font-size="15" fill="#edf1e6">未知状态 → 活动不可用，不臆造世界进度</text></g><g id="intent"><rect x="724" y="450" width="688" height="450" rx="8" fill="#19251f" stroke="#405346"/><text x="742" y="480" font-size="20" fill="#d0a85b">意图 · accepted / receipt missing</text><text x="742" y="508" font-size="15" fill="#edf1e6">状态：已接受 · 不等于行动完成</text><text x="742" y="535" font-size="15" fill="#edf1e6">摘要：Agent 将评估下一步世界行动</text><text x="742" y="562" font-size="15" fill="#edf1e6">原因：仅允许的安全摘要，不输出模型内部推理</text><text x="742" y="589" font-size="15" fill="#edf1e6">缺少 committed receipt：等回执后刷新</text><text x="742" y="616" font-size="15" fill="#edf1e6">stale / reconnecting / conflict：显示真实下一步</text><text x="742" y="643" font-size="15" fill="#edf1e6">control_lost / read_only / unauthorized / unavailable：</text><text x="742" y="670" font-size="15" fill="#edf1e6">隐藏意图正文、原因与生命周期，保留允许的提示</text><text x="742" y="697" font-size="15" fill="#edf1e6">Context Lite 嵌入意图不重复展示 receipt confirmation</text><text x="742" y="724" font-size="15" fill="#edf1e6">完整状态：proposed / submitted / accepted / blocked</text><text x="742" y="751" font-size="15" fill="#edf1e6">completed / rejected / expired / cancelled / superseded</text></g><g id="asset"><rect x="28" y="925" width="1384" height="65" rx="8" fill="#19251f" stroke="#405346"/><text x="46" y="955" font-size="20" fill="#d0a85b">资产 / 治理后置通道：main_token_transfer / required_auth / availability</text><text x="48" y="976" font-size="15" fill="#edf1e6">只读策略与原因；主代币转账（这里暂未开放）始终禁用，不绘制付款表单。</text></g><rect x="28" y="1016" width="1384" height="44" rx="8" fill="#0b100f" stroke="#405346"/><text x="48" y="1045" font-size="17" fill="#d0a85b">World</text><text x="170" y="1045" font-size="17" fill="#d0a85b">Targets</text><text x="310" y="1045" font-size="17" fill="#d0a85b">Command</text></g></svg>