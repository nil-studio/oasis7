<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1150" viewBox="0 0 1440 1150"><title>安全移动替代 / 明确比较、确认、执行</title><desc>静态设计目标，虚构数据，非运行截图；分栏为互斥阶段，不同时启用。</desc><rect width="1440" height="1150" fill="#0b100f"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="28" y="36" font-size="24" fill="#edf1e6">OASIS7 / 安全移动替代 / 明确比较、确认、执行</text><text x="28" y="66" font-size="14" fill="#9ca89a">设计稿 · 源码约束 · 非运行验收 · 各栏为互斥阶段 / 独立状态</text><g id="compare"><rect x="28" y="95" width="440" height="900" rx="8" fill="#19251f" stroke="#405346"/><text x="46" y="125" font-size="20" fill="#d0a85b">A 原请求 · 不支持途经/定时</text><text x="46" y="153" font-size="15" fill="#edf1e6">比较的是一次直接移动替代</text><text x="46" y="180" font-size="15" fill="#edf1e6">预览与确认本身不产生世界效果</text><text x="46" y="217" font-size="14" fill="#9ca89a">原目标</text><rect x="46" y="227" width="390" height="44" rx="8" fill="#0b100f" stroke="#405346"/><text x="58" y="255" font-size="15" fill="#edf1e6">先去补给区检查物资</text><text x="46" y="297" font-size="14" fill="#9ca89a">途经点 JSON · 1–8项</text><rect x="46" y="307" width="390" height="44" rx="8" fill="#0b100f" stroke="#405346"/><text x="58" y="335" font-size="15" fill="#edf1e6">两项完整 cm 坐标 JSON（示例占位）</text><text x="46" y="377" font-size="14" fill="#9ca89a">原到达 tick（可选）</text><rect x="46" y="387" width="390" height="44" rx="8" fill="#0b100f" stroke="#405346"/><text x="58" y="415" font-size="15" fill="#edf1e6">请输入…</text><rect x="46" y="457" width="390" height="44" rx="8" fill="#d0a85b" stroke="#405346"/><text x="58" y="485" font-size="15" fill="#0b100f">比较替代</text><rect x="46" y="517" width="390" height="44" rx="8" fill="#0b100f" stroke="#405346"/><text x="58" y="545" font-size="15" fill="#edf1e6">恢复原命令 · 查询</text><rect x="46" y="577" width="390" height="44" rx="8" fill="#0b100f" stroke="#405346"/><text x="58" y="605" font-size="15" fill="#edf1e6">重发原签名命令 · 精确原件</text><text x="46" y="637" font-size="15" fill="#edf1e6">unknown 禁用新比较；保留原签名命令</text><text x="46" y="664" font-size="15" fill="#edf1e6">显式 retry 不是创建新请求或换候选</text><text x="46" y="691" font-size="15" fill="#edf1e6">原件/身份/Agent校验仍适用</text><text x="46" y="718" font-size="15" fill="#edf1e6">单点且无到达时限：拒绝比较</text><text x="46" y="745" font-size="15" fill="#edf1e6">完整坐标必须为安全整数</text><text x="46" y="772" font-size="15" fill="#edf1e6">输入JSON错误显示，不当作比较成功</text></g><g id="candidate"><rect x="494" y="95" width="440" height="900" rx="8" fill="#19251f" stroke="#405346"/><text x="512" y="125" font-size="20" fill="#d0a85b">B awaiting_confirmation</text><text x="512" y="153" font-size="15" fill="#edf1e6">原目标 / 原途经点 / 原到达时间</text><text x="512" y="180" font-size="15" fill="#edf1e6">状态：等待你确认</text><text x="512" y="207" font-size="15" fill="#edf1e6">候选：直接前往终点（虚构）</text><text x="512" y="234" font-size="15" fill="#edf1e6">目标：(120, 0, 80) cm</text><text x="512" y="261" font-size="15" fill="#edf1e6">范围：当前 Agent 一次直接移动</text><text x="512" y="288" font-size="15" fill="#edf1e6">费用上界：读取 cost_upper_bound</text><text x="512" y="315" font-size="15" fill="#edf1e6">风险：位置改变</text><text x="512" y="342" font-size="15" fill="#edf1e6">后果：读取 consequences</text><text x="512" y="369" font-size="15" fill="#edf1e6">可撤回性：读取 retractability</text><text x="512" y="396" font-size="15" fill="#edf1e6">推荐原因：读取 recommendation</text><text x="512" y="423" font-size="15" fill="#edf1e6">所需权限：当前 Agent owner</text><rect x="512" y="460" width="390" height="44" rx="8" fill="#d0a85b" stroke="#405346"/><text x="524" y="488" font-size="15" fill="#0b100f">确认此固定候选</text><text x="512" y="520" font-size="15" fill="#edf1e6">绑定 request_id / generation</text><text x="512" y="547" font-size="15" fill="#edf1e6">candidate_id / digest / valid_until_tick</text><text x="512" y="574" font-size="15" fill="#edf1e6">unknown 或非 awaiting_confirmation 禁用</text><text x="512" y="601" font-size="15" fill="#edf1e6">普通 Chat 不会隐式确认此候选</text></g><g id="execute"><rect x="960" y="95" width="452" height="900" rx="8" fill="#19251f" stroke="#405346"/><text x="978" y="125" font-size="20" fill="#d0a85b">C confirmed / authorization available</text><text x="978" y="153" font-size="15" fill="#edf1e6">状态：已确认，可执行</text><text x="978" y="180" font-size="15" fill="#edf1e6">确认不等于已移动</text><text x="978" y="207" font-size="15" fill="#edf1e6">执行绑定已有 authorization_id</text><rect x="978" y="244" width="390" height="44" rx="8" fill="#d0a85b" stroke="#405346"/><text x="990" y="272" font-size="15" fill="#0b100f">执行已确认选择</text><rect x="978" y="304" width="390" height="44" rx="8" fill="#0b100f" stroke="#405346"/><text x="990" y="332" font-size="15" fill="#edf1e6">明确重新评估</text><rect x="978" y="364" width="390" height="44" rx="8" fill="#0b100f" stroke="#405346"/><text x="990" y="392" font-size="15" fill="#edf1e6">重读状态</text><rect x="978" y="424" width="390" height="44" rx="8" fill="#0b100f" stroke="#405346"/><text x="990" y="452" font-size="15" fill="#e7a89b">拒绝或取消</text><text x="978" y="484" font-size="15" fill="#edf1e6">仅 authorization.available 才可执行</text><text x="978" y="511" font-size="15" fill="#edf1e6">unknown：新执行/评估/读取/取消禁用</text><text x="978" y="538" font-size="15" fill="#edf1e6">使用恢复原命令查询/精确原件重试</text><text x="978" y="565" font-size="15" fill="#edf1e6">实际结果：status / action_id / event_id</text><text x="978" y="592" font-size="15" fill="#edf1e6">没有 execution result 不显示完成</text><text x="978" y="619" font-size="15" fill="#edf1e6">no_safe_alternative / evaluation_unavailable</text><text x="978" y="646" font-size="15" fill="#edf1e6">拒绝继续；不能悄悄执行替代动作</text><text x="978" y="673" font-size="15" fill="#edf1e6">expired / superseded 要重新核对</text></g><rect x="28" y="1086" width="1384" height="44" rx="8" fill="#0b100f" stroke="#405346"/><text x="48" y="1115" font-size="17" fill="#d0a85b">World</text><text x="170" y="1115" font-size="17" fill="#d0a85b">Targets</text><text x="310" y="1115" font-size="17" fill="#d0a85b">Command</text></g></svg>