<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="760" viewBox="0 0 1180 760"><title>恢复申请查询 / 登录身份分支</title><desc>静态设计目标，虚构数据，非运行截图；分栏为互斥阶段，不同时启用。</desc><rect width="1180" height="760" fill="#0b100f"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="28" y="36" font-size="24" fill="#edf1e6">OASIS7 / 恢复申请查询 / 登录身份分支</text><text x="28" y="66" font-size="14" fill="#9ca89a">设计稿 · 源码约束 · 非运行验收 · 各栏为互斥阶段 / 独立状态</text><g id="lookup"><rect x="28" y="95" width="548" height="560" rx="8" fill="#19251f" stroke="#405346"/><text x="46" y="125" font-size="20" fill="#d0a85b">已登录 · 查看恢复申请 → recovery_lookup</text><text x="46" y="153" font-size="15" fill="#edf1e6">capabilities.email_recovery.available 时出现</text><text x="46" y="180" font-size="15" fill="#edf1e6">输入要查看的申请编号，不创建新候选</text><text x="46" y="217" font-size="14" fill="#9ca89a">恢复申请编号 · recoveryId</text><rect x="46" y="227" width="505" height="44" rx="8" fill="#0b100f" stroke="#405346"/><text x="58" y="255" font-size="15" fill="#edf1e6">recovery-example（虚构占位）</text><rect x="46" y="297" width="505" height="44" rx="8" fill="#d0a85b" stroke="#405346"/><text x="58" y="325" font-size="15" fill="#0b100f">查看此申请</text><text x="46" y="357" font-size="15" fill="#edf1e6">读取 recoveryStatus(recoveryId)</text><text x="46" y="384" font-size="15" fill="#edf1e6">返回后进入 recovery_status 显示此申请</text><text x="46" y="411" font-size="15" fill="#edf1e6">此字段不是状态页的刷新按钮</text><text x="46" y="438" font-size="15" fill="#edf1e6">未知结果保留原件，不换候选或operation ID</text><rect x="46" y="480" width="505" height="44" rx="8" fill="#0b100f" stroke="#405346"/><text x="58" y="508" font-size="15" fill="#edf1e6">关闭此流程</text></g><g id="eligibility-branch"><rect x="602" y="95" width="550" height="560" rx="8" fill="#19251f" stroke="#405346"/><text x="620" y="125" font-size="20" fill="#d0a85b">未登录 · recovery_address（不同流程）</text><text x="620" y="153" font-size="14" fill="#9ca89a">此前绑定邮箱</text><rect x="620" y="163" width="505" height="44" rx="8" fill="#0b100f" stroke="#405346"/><text x="632" y="191" font-size="15" fill="#edf1e6">player@example.invalid</text><text x="620" y="233" font-size="14" fill="#9ca89a">已有恢复申请编号（可选）</text><rect x="620" y="243" width="505" height="44" rx="8" fill="#0b100f" stroke="#405346"/><text x="632" y="271" font-size="15" fill="#edf1e6">请输入…</text><rect x="620" y="313" width="505" height="44" rx="8" fill="#d0a85b" stroke="#405346"/><text x="632" y="341" font-size="15" fill="#0b100f">发送本次操作验证码</text><text x="620" y="373" font-size="15" fill="#edf1e6">先验证邮箱资格，再根据可选编号核对申请</text><text x="620" y="400" font-size="15" fill="#edf1e6">无编号且资格通过才到固定候选创建阶段</text><text x="620" y="427" font-size="15" fill="#edf1e6">不把已登录 lookup 与邮箱资格请求混用</text><text x="620" y="454" font-size="15" fill="#edf1e6">OTP仅用于指定操作，后续见02恢复阶段</text><rect x="620" y="496" width="505" height="44" rx="8" fill="#0b100f" stroke="#405346"/><text x="632" y="524" font-size="15" fill="#edf1e6">关闭此流程</text></g><rect x="28" y="696" width="1124" height="44" rx="8" fill="#0b100f" stroke="#405346"/><text x="48" y="725" font-size="17" fill="#d0a85b">World</text><text x="170" y="725" font-size="17" fill="#d0a85b">Targets</text><text x="310" y="725" font-size="17" fill="#d0a85b">Command</text></g></svg>