<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1320" viewBox="0 0 1440 1320"><title>DeepSeek / 保存、检查、开始、停止</title><desc>静态设计目标，虚构数据，非运行截图；分栏为互斥阶段，不同时启用。</desc><rect width="1440" height="1320" fill="#0b100f"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="28" y="36" font-size="24" fill="#edf1e6">OASIS7 / DeepSeek / 保存、检查、开始、停止</text><text x="28" y="66" font-size="14" fill="#9ca89a">设计稿 · 源码约束 · 非运行验收 · 各栏为互斥阶段 / 独立状态</text><g id="save"><rect x="28" y="95" width="440" height="605" rx="8" fill="#19251f" stroke="#405346"/><text x="46" y="125" font-size="20" fill="#d0a85b">A 保存 Key</text><text x="46" y="153" font-size="15" fill="#edf1e6">DeepSeek 官方 · deepseek-flash</text><text x="46" y="180" font-size="15" fill="#edf1e6">OpenRouter 尚不支持</text><text x="46" y="207" font-size="15" fill="#edf1e6">浏览器直连，Key 不上传 Oasis7</text><text x="46" y="234" font-size="15" fill="#edf1e6">按本站账号保存 localStorage</text><text x="46" y="261" font-size="15" fill="#edf1e6">刷新/关页仍保留；同源脚本可读</text><text x="46" y="298" font-size="14" fill="#9ca89a">推理 API Key · password</text><rect x="46" y="308" width="390" height="44" rx="8" fill="#0b100f" stroke="#405346"/><text x="58" y="336" font-size="15" fill="#edf1e6">••••••••</text><rect x="46" y="363" width="18" height="18" rx="8" fill="#0b100f" stroke="#405346"/><text x="49" y="377" font-size="14" fill="#d0a85b">✓</text><text x="74" y="378" font-size="14" fill="#edf1e6">同意本机保存，仅发 DeepSeek</text><rect x="46" y="408" width="390" height="44" rx="8" fill="#d0a85b" stroke="#405346"/><text x="58" y="436" font-size="15" fill="#0b100f">保存 Key</text><text x="46" y="468" font-size="15" fill="#edf1e6">保存不等于运行授权</text><text x="46" y="495" font-size="15" fill="#edf1e6">共享设备谨慎使用</text><text x="46" y="522" font-size="15" fill="#edf1e6">任务执行未准备：不接收 Key</text></g><g id="probe"><rect x="494" y="95" width="440" height="605" rx="8" fill="#19251f" stroke="#405346"/><text x="512" y="125" font-size="20" fill="#d0a85b">B 付费连接检查</text><text x="512" y="153" font-size="15" fill="#edf1e6">Key 已保存 · 尚未开始 Agent</text><text x="512" y="180" font-size="15" fill="#edf1e6">检查预留 0 / 4 次 · 0 / 2048 token</text><text x="512" y="207" font-size="15" fill="#edf1e6">检查+执行共享 0 / 8 次</text><text x="512" y="234" font-size="15" fill="#edf1e6">总 token 预留 0 / 131072</text><rect x="512" y="256" width="18" height="18" rx="8" fill="#0b100f" stroke="#405346"/><text x="515" y="270" font-size="14" fill="#d0a85b">✓</text><text x="540" y="271" font-size="14" fill="#edf1e6">同意两请求有限付费检查</text><rect x="512" y="301" width="390" height="44" rx="8" fill="#d0a85b" stroke="#405346"/><text x="524" y="329" font-size="15" fill="#0b100f">测试连接</text><text x="512" y="361" font-size="15" fill="#edf1e6">检查不写游戏世界</text><text x="512" y="388" font-size="15" fill="#edf1e6">供应商账户计费，不限制其他应用</text><text x="512" y="415" font-size="15" fill="#edf1e6">用量未知：保留预算，不当作零</text><text x="512" y="442" font-size="15" fill="#edf1e6">auth / CORS / network / protocol 失败</text><text x="512" y="469" font-size="15" fill="#edf1e6">storage/locks 不可用：停止</text></g><g id="run"><rect x="960" y="95" width="452" height="605" rx="8" fill="#19251f" stroke="#405346"/><text x="978" y="125" font-size="20" fill="#d0a85b">C 明确开始 Agent</text><text x="978" y="153" font-size="15" fill="#edf1e6">核对实际 Agent、Task、目标</text><text x="978" y="180" font-size="15" fill="#edf1e6">ready + checked + run consent 才能开始</text><text x="978" y="207" font-size="15" fill="#edf1e6">每次执行输出最多 512 token</text><text x="978" y="234" font-size="15" fill="#edf1e6">本轮最多 120 秒</text><rect x="978" y="256" width="18" height="18" rx="8" fill="#0b100f" stroke="#405346"/><text x="981" y="270" font-size="14" fill="#d0a85b">✓</text><text x="1006" y="271" font-size="14" fill="#edf1e6">确认目标和供应商费用</text><rect x="978" y="301" width="390" height="44" rx="8" fill="#d0a85b" stroke="#405346"/><text x="990" y="329" font-size="15" fill="#0b100f">确认开始 Agent</text><rect x="978" y="361" width="390" height="44" rx="8" fill="#0b100f" stroke="#405346"/><text x="990" y="389" font-size="15" fill="#edf1e6">停止新决策</text><rect x="978" y="421" width="390" height="44" rx="8" fill="#0b100f" stroke="#405346"/><text x="990" y="449" font-size="15" fill="#edf1e6">只读核对原件</text><text x="978" y="481" font-size="15" fill="#edf1e6">运行中不重复启动</text><text x="978" y="508" font-size="15" fill="#edf1e6">预算/期限耗尽不自动增加或重置</text><text x="978" y="535" font-size="15" fill="#edf1e6">同 Agent 其他页面运行不自动接管</text></g><g id="stop"><rect x="28" y="725" width="670" height="470" rx="8" fill="#19251f" stroke="#405346"/><text x="46" y="755" font-size="20" fill="#d0a85b">停止 ≠ 忘记 ≠ 撤销供应商 Key</text><text x="46" y="783" font-size="15" fill="#edf1e6">停止保留 Key；忘记删除对应本站保存 Key</text><text x="46" y="810" font-size="15" fill="#edf1e6">两者均不保证已发请求退款，不取消已受理世界作业</text><text x="46" y="837" font-size="15" fill="#edf1e6">忘记失败：明确存储错误，提示清理本站数据</text><rect x="46" y="876" width="625" height="44" rx="8" fill="#0b100f" stroke="#405346"/><text x="58" y="904" font-size="15" fill="#e7a89b">断开并忘记本机 Key</text></g><g id="legacy"><rect x="724" y="725" width="688" height="470" rx="8" fill="#19251f" stroke="#405346"/><text x="742" y="755" font-size="20" fill="#d0a85b">旧托管连接 · managementOnly</text><text x="742" y="783" font-size="14" fill="#9ca89a">本会话连接 · select / busy时禁用</text><rect x="742" y="793" width="625" height="44" rx="8" fill="#0b100f" stroke="#405346"/><text x="754" y="821" font-size="15" fill="#edf1e6">旧连接示例 · 状态待核对</text><text x="1332" y="821" font-size="18" fill="#edf1e6">▾</text><rect x="742" y="863" width="625" height="44" rx="8" fill="#0b100f" stroke="#405346"/><text x="754" y="891" font-size="15" fill="#edf1e6">刷新连接状态</text><rect x="742" y="923" width="625" height="44" rx="8" fill="#0b100f" stroke="#405346"/><text x="754" y="951" font-size="15" fill="#edf1e6">停止新决策</text><rect x="742" y="983" width="625" height="44" rx="8" fill="#0b100f" stroke="#405346"/><text x="754" y="1011" font-size="15" fill="#e7a89b">断开并忘记旧连接</text><text x="742" y="1043" font-size="15" fill="#edf1e6">停止保留有效连接；忘记停用其凭证（不是本机删除）</text><text x="742" y="1070" font-size="15" fill="#edf1e6">两者不撤销供应商Key、不保证退款、不取消世界作业</text><text x="742" y="1097" font-size="15" fill="#edf1e6">刷新：busy禁用；停止/忘记：busy或revoked禁用</text><text x="742" y="1124" font-size="15" fill="#edf1e6">仅管理；不创建、不检查、不开始、不续期</text></g><rect x="28" y="1256" width="1384" height="44" rx="8" fill="#0b100f" stroke="#405346"/><text x="48" y="1285" font-size="17" fill="#d0a85b">World</text><text x="170" y="1285" font-size="17" fill="#d0a85b">Targets</text><text x="310" y="1285" font-size="17" fill="#d0a85b">Command</text></g></svg>