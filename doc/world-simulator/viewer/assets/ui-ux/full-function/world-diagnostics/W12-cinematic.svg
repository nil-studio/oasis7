<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1120" viewBox="0 0 1440 1120" role="img" aria-labelledby="title"><title id="title">Cinematic view · edge controls and contextual drawers — static design, not live data</title><rect width="100%" height="100%" fill="#0b100f"/><g font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif"><text x="24" y="30" font-size="13" fill="#9ca89a" font-weight="400">OASIS7 / VIEWER • DESIGN REBUILD</text><text x="24" y="65" font-size="26" fill="#edf1e6" font-weight="400">Cinematic view · edge controls and contextual drawers</text><text x="24" y="91" font-size="14" fill="#d0a85b" font-weight="400">Static contract / illustrative values only / not a runtime screenshot</text><g id="hud"><rect x="24" y="120" width="1392" height="156" rx="12" fill="#101412" stroke="#405346"/><text x="44" y="153" font-size="20" fill="#edf1e6" font-weight="600">World Command Board</text><text x="44" y="178" font-size="13" fill="#d0a85b" font-weight="400">Illustrative objective / progress / world tick / blocker values omitted</text></g><rect x="44" y="203" width="245" height="44" rx="8" fill="#1b2922" stroke="#d0a85b"/><text x="56" y="231" font-size="15" fill="#edf1e6" font-weight="500">Command &amp; Target</text><rect x="305" y="203" width="245" height="44" rx="8" fill="#1b2922" stroke="#d0a85b"/><text x="317" y="231" font-size="15" fill="#edf1e6" font-weight="500">Exit Cinematic</text><rect x="566" y="203" width="245" height="44" rx="8" fill="#1b2922" stroke="#d0a85b"/><text x="578" y="231" font-size="15" fill="#edf1e6" font-weight="500">World Status</text><rect x="827" y="203" width="245" height="44" rx="8" fill="#1b2922" stroke="#d0a85b"/><text x="839" y="231" font-size="15" fill="#edf1e6" font-weight="500">Maximize</text><text x="1108" y="231" font-size="14" fill="#9ca89a" font-weight="400">More controls · expanded</text><g id="stage"><rect x="24" y="300" width="930" height="560" rx="12" fill="#101412" stroke="#405346"/><text x="44" y="333" font-size="20" fill="#edf1e6" font-weight="600">Bevy canvas</text><text x="44" y="358" font-size="13" fill="#d0a85b" font-weight="400">Map gestures stay in this region; not over the drawer body</text></g><rect x="120" y="430" width="250" height="110" rx="0" fill="#17251e" stroke="#405346"/><rect x="470" y="550" width="300" height="150" rx="0" fill="#17251e" stroke="#405346"/><path d="M365 490 L475 595" stroke="#d0a85b" stroke-width="2" fill="none" stroke-dasharray=""/><g id="mission-map"><rect x="50" y="670" width="270" height="162" rx="12" fill="#101412" stroke="#405346"/><text x="70" y="703" font-size="20" fill="#edf1e6" font-weight="600">Mission Map</text><text x="70" y="728" font-size="13" fill="#d0a85b" font-weight="400">Only authorized stage context</text></g><rect x="70" y="747" width="88" height="50" rx="0" fill="#284131" stroke="#405346"/><rect x="205" y="763" width="80" height="42" rx="0" fill="#284131" stroke="#405346"/><g id="drawer"><rect x="978" y="300" width="438" height="560" rx="12" fill="#101412" stroke="#405346"/><text x="998" y="333" font-size="20" fill="#edf1e6" font-weight="600">Command &amp; Target</text><text x="998" y="358" font-size="13" fill="#d0a85b" font-weight="400">On-demand drawer; no new world controls</text></g><text x="998" y="404" font-size="16" fill="#9ca89a" font-weight="400">Current selected target is preserved.</text><text x="998" y="440" font-size="16" fill="#9ca89a" font-weight="400">Close drawer → return trigger focus.</text><text x="998" y="476" font-size="16" fill="#9ca89a" font-weight="400">Escape closes drawer before focus exit.</text><text x="998" y="512" font-size="16" fill="#9ca89a" font-weight="400">IME composition does not trigger Escape.</text><rect x="998" y="603" width="390" height="44" rx="8" fill="#1b2922" stroke="#d0a85b"/><text x="1010" y="631" font-size="15" fill="#edf1e6" font-weight="500">Command &amp; Target · collapse</text><g id="focus-state"><rect x="24" y="884" width="1392" height="150" rx="12" fill="#1