<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1060" viewBox="0 0 1440 1060" role="img" aria-labelledby="title"><title id="title">Runtime Diagnostics · factual status, on demand — static design, not live data</title><rect width="100%" height="100%" fill="#0b100f"/><g font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif"><text x="24" y="30" font-size="13" fill="#9ca89a" font-weight="400">OASIS7 / VIEWER • DESIGN REBUILD</text><text x="24" y="65" font-size="26" fill="#edf1e6" font-weight="400">Runtime Diagnostics · factual status, on demand</text><text x="24" y="91" font-size="14" fill="#d0a85b" font-weight="400">Static contract / illustrative values only / not a runtime screenshot</text><g id="metadata"><rect x="24" y="120" width="1392" height="150" rx="12" fill="#101412" stroke="#405346"/><text x="44" y="153" font-size="20" fill="#edf1e6" font-weight="600">Runtime Diagnostics · expanded</text><text x="44" y="178" font-size="13" fill="#d0a85b" font-weight="400">Default remains collapsed; confidential values are redacted in this design</text></g><text x="44" y="214" font-size="15" fill="#9ca89a" font-weight="400">ws = [redacted endpoint]     entryReason = [runtime value]     renderer = [runtime value]     controlProfile = [runtime value]</text><g id="execution"><rect x="24" y="294" width="684" height="330" rx="12" fill="#101412" stroke="#405346"/><text x="44" y="327" font-size="20" fill="#edf1e6" font-weight="600">Execution lanes</text><text x="44" y="352" font-size="13" fill="#d0a85b" font-weight="400">Selected-Agent example; no Agent shows a selection prompt instead</text></g><text x="44" y="389" font-size="16" fill="#9ca89a" font-weight="400">Expected contract: provider / mode / environment</text><text x="44" y="423" font-size="16" fill="#9ca89a" font-weight="400">obs schema / act schema / agentProfile / fallback</text><text x="44" y="457" font-size="16" fill="#9ca89a" font-weight="400">Actual probe: status / source / fallback / error</text><text x="44" y="491" font-size="16" fill="#9ca89a" font-weight="400">actualCaps / actualActions from provider check</text><rect x="44" y="552" width="310" height="44" rx="8" fill="#1b2922" stroke="#d0a85b"/><text x="56" y="580" font-size="15" fill="#edf1e6" font-weight="500">Expand raw diagnostics</text><g id="auth"><rect x="732" y="294" width="684" height="330" rx="12" fill="#101412" stroke="#405346"/><text x="752" y="327" font-size="20" fill="#edf1e6" font-weight="600">Session ladder</text><text x="752" y="352" font-size="13" fill="#d0a85b" font-weight="400">Illustrative status combination; not this user’s session</text></g><text x="752" y="389" font-size="16" fill="#9ca89a" font-weight="400">guest_session                       superseded</text><text x="752" y="423" font-size="16" fill="#9ca89a" font-weight="400">player_session               active_hosted_session</text><text x="752" y="457" font-size="16" fill="#9ca89a" font-weight="400">strong_auth                separate_upgrade_plane</text><text x="752" y="491" font-size="16" fill="#9ca89a" font-weight="400">prompt / chat / mainToken capability + reason</text><rect x="752" y="552" width="310" height="44" rx="8" fill="#1b2922" stroke="#d0a85b"/><text x="764" y="580" font-size="15" fill="#edf1e6" font-weight="500">Release Player Session</text><g id="matrix"><rect x="24" y="648" width="684" height="300" rx="12" fill="#101412" stroke="#405346"/><text x="44" y="681" font-size="20" fill="#edf1e6" font-weight="600">Hosted action matrix</text><text x="44" y="706" font-size="13" fill="#d0a85b" font-weight="400">Display only actual published rows</text></g><text x="44" y="740" font-size="16" fill="#9ca89a" font-weight="400">actionId + enabled or blocked code</text><text x="44" y="772" font-size="16" fill="#9ca89a" font-weight="400">required_auth / availability / reason</text><text x="44" y="804" font-size="16" fill="#9ca89a" font-weight="400">viewer capabilityReason if distinct</text><text x="44" y="836" font-size="16" fill="#9ca89a" font-weight="400">No badge can grant a missing permission.</text><g id="director-entry"><rect x="732" y="648" width="684" height="300" rx="12" fill="#101412" stroke="#405346"/><text x="752" y="681" font-size="20" fill="#edf1e6" font-weight="600">Director visibility</text><text x="752" y="706" font-size="13" fill="#d0a85b" font-weight="400">Production capability_blocked · no issuer available</text></g><text x="752" y="740" font-size="16" fill="#9ca89a" font-weight="400">Server validation required; Player remains active.</text><text x="752" y="772" font-size="16" fill="#9ca89a" font-weight="400">Existing entry button is enabled unless pending.</text><text x="752" y="804" font-size="16" fill="#9ca89a" font-weight="400">It does not mint or self-grant a capability.</text><rect x="752" y="859" width="310" height="44" rx="8" fill="#1b2922" stroke="#d0a85b"/><text x="764" y="887" font-size="15" fill="#edf1e6" font-weight="500">Open Director</text><text x="24" y="1040" font-size="12" fill="#9ca89a" font-weight="400">W07-diagnostics • Fixed source PR 113868200d1f • editable SVG • no runtime verification</text></g></svg>