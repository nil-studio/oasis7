<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" role="img" aria-labelledby="title"><title id="title">Map inspection · hit targets, tooltip and visible legend — static design, not live data</title><rect width="100%" height="100%" fill="#0b100f"/><g font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif"><text x="24" y="30" font-size="13" fill="#9ca89a" font-weight="400">OASIS7 / VIEWER • DESIGN REBUILD</text><text x="24" y="65" font-size="26" fill="#edf1e6" font-weight="400">Map inspection · hit targets, tooltip and visible legend</text><text x="24" y="91" font-size="14" fill="#d0a85b" font-weight="400">Static contract / illustrative values only / not a runtime screenshot</text><g id="stage"><rect x="24" y="120" width="900" height="760" rx="12" fill="#101412" stroke="#405346"/><text x="44" y="153" font-size="20" fill="#edf1e6" font-weight="600">Authorized spatial objects</text><text x="44" y="178" font-size="13" fill="#d0a85b" font-weight="400">Rust-derived hit projection; not independent JS geometry</text></g><rect x="170" y="350" width="280" height="120" rx="0" fill="#293c30" stroke="#405346"/><rect x="570" y="490" width="155" height="100" rx="0" fill="#293c30" stroke="#405346"/><path d="M450 410 L570 540" stroke="#d0a85b" stroke-width="2" fill="none" stroke-dasharray=""/><rect x="320" y="384" width="28" height="28" rx="0" fill="#8dc7aa" stroke="#d0a85b"/><rect x="312" y="376" width="44" height="44" rx="0" fill="none" stroke="#d0a85b"/><g id="tooltip"><rect x="460" y="275" width="400" height="170" rx="12" fill="#101412" stroke="#405346"/><text x="480" y="308" font-size="20" fill="#edf1e6" font-weight="600">Module example</text><text x="480" y="333" font-size="13" fill="#d0a85b" font-weight="400">kind + readable label · read-only inspection</text></g><text x="480" y="371" font-size="15" fill="#9ca89a" font-weight="400">Tooltip stays open for keyboard / touch.</text><text x="480" y="396" font-size="15" fill="#9ca89a" font-weight="400">No submit or deployment command.</text><rect x="480" y="460" width="240" height="44" rx="8" fill="#1b2922" stroke="#d0a85b"/><text x="492" y="488" font-size="15" fill="#edf1e6" font-weight="500">Close tooltip / Escape</text><g id="overlap"><rect x="50" y="635" width="470" height="203" rx="12" fill="#101412" stroke="#405346"/><text x="70" y="668" font-size="20" fill="#edf1e6" font-weight="600">Overlapping candidates</text><text x="70" y="693" font-size="13" fill="#d0a85b" font-weight="400">Select the named object; not nearest guessed owner</text></g><rect x="70" y="710" width="210" height="44" rx="8" fill="#1b2922" stroke="#d0a85b"/><text x="82" y="738" font-size="15" fill="#edf1e6" font-weight="500">Select location</text><rect x="292" y="710" width="206" height="44" rx="8" fill="#1b2922" stroke="#d0a85b"/><text x="304" y="738" font-size="15" fill="#edf1e6" font-weight="500">Select module</text><g id="legend"><rect x="948" y="120" width="468" height="760" rx="12" fill="#101412" stroke="#405346"/><text x="968" y="153" font-size="20" fill="#edf1e6" font-weight="600">Scene legend</text><text x="968" y="178" font-size="13" fill="#d0a85b" font-weight="400">Published visual meaning only</text></g><text x="968" y="226" font-size="16" fill="#9ca89a" font-weight="400">Terrain behind authorized relations.</text><text x="968" y="266" font-size="16" fill="#9ca89a" font-weight="400">Relations behind foreground entities.</text><text x="968" y="306" font-size="16" fill="#9ca89a" font-weight="400">Selected / goal / blocker stay distinct.</text><text x="968" y="346" font-size="16" fill="#9ca89a" font-weight="400">Unknown positions remain unknown.</text><text x="968" y="386" font-size="16" fill="#9ca89a" font-weight="400">No relation inferred from proximity.</text><rect x="973" y="460" width="24" height="24" rx="0" fill="#8dc7aa" stroke="#d0a85b"/><text x="1015" y="480" font-size="15" fill="#edf1e6" font-weight="400">Selected entity (illustrative)</text><path d="M973 533 L1001 533" stroke="#d0a85b" stroke-width="2" fill="none" stroke-dasharray=""/><text x="1015" y="540" font-size="15" fill="#edf1e6" font-weight="400">Authorized relation (illustrative)</text><text x="968" y="638" font-size="16" fill="#9ca89a" font-weight="400">Sparse scene: explain missing detail.</text><text x="968" y="672" font-size="16" fill="#9ca89a" font-weight="400">Do not populate decorative actors.</text><text x="968" y="706" font-size="16" fill="#9ca89a" font-weight="400">Hover is not the only way to inspect.</text><text x="24" y="980" font-size="12" fill="#9ca89a" font-weight="400">W13-hotspots • Fixed source PR 113868200d1f • editable SVG • no runtime verification</text></g></svg>