<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" role="img" aria-labelledby="title"><title id="title">World first · selected target, not ownership — static design, not live data</title><rect width="100%" height="100%" fill="#0b100f"/><g font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif"><text x="24" y="30" font-size="13" fill="#9ca89a" font-weight="400">OASIS7 / VIEWER • DESIGN REBUILD</text><text x="24" y="65" font-size="26" fill="#edf1e6" font-weight="400">World first · selected target, not ownership</text><text x="24" y="91" font-size="14" fill="#d0a85b" font-weight="400">Static contract / illustrative values only / not a runtime screenshot</text><g id="stage"><rect x="24" y="115" width="960" height="780" rx="12" fill="#101412" stroke="#405346"/><text x="44" y="148" font-size="20" fill="#edf1e6" font-weight="600">Authorized world stage</text><text x="44" y="173" font-size="13" fill="#d0a85b" font-weight="400">Bevy / Rust canvas only · scene geometry is illustrative</text></g><rect x="80" y="265" width="220" height="125" rx="0" fill="#25392d" stroke="#405346"/><rect x="490" y="240" width="310" height="150" rx="0" fill="#25392d" stroke="#405346"/><rect x="300" y="520" width="280" height="165" rx="0" fill="#25392d" stroke="#405346"/><path d="M185 390 L440 520" stroke="#7c8665" stroke-width="2" fill="none" stroke-dasharray=""/><path d="M650 390 L440 520" stroke="#7c8665" stroke-width="2" fill="none" stroke-dasharray=""/><rect x="422" y="558" width="30" height="30" rx="3" fill="#8dc7aa" stroke="#d0a85b"/><rect x="414" y="550" width="46" height="46" rx="0" fill="none" stroke="#d0a85b"/><text x="485" y="580" font-size="14" fill="#d0a85b" font-weight="600">Location example · selected</text><text x="65" y="205" font-size="18" fill="#edf1e6" font-weight="400">World → Region → Fragment → Object</text><text x="65" y="233" font-size="14" fill="#9ca89a" font-weight="400">LOD hierarchy: design target, not a new current menu</text><