<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1230" viewBox="0 0 1440 1230" role="img" aria-labelledby="title"><title id="title">Execution contract, capability policy and actual feedback — static design, not live data</title><rect width="100%" height="100%" fill="#0b100f"/><g font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif"><text x="24" y="30" font-size="13" fill="#9ca89a" font-weight="400">OASIS7 / VIEWER • DESIGN REBUILD</text><text x="24" y="65" font-size="26" fill="#edf1e6" font-weight="400">Execution contract, capability policy and actual feedback</text><text x="24" y="91" font-size="14" fill="#d0a85b" font-weight="400">Static contract / illustrative values only / not a runtime screenshot</text><g id="lane"><rect x="24" y="120" width="684" height="400" rx="12" fill="#101412" stroke="#405346"/><text x="44" y="153" font-size="20" fill="#edf1e6" font-weight="600">Execution Lanes</text><text x="44" y="178" font-size="13" fill="#d0a85b" font-weight="400">Selected-Agent debug object exists; values absent in sample</text></g><text x="44" y="214" font-size="14" fill="#d0a85b" font-weight="600">selected agent lane</text><text x="44" y="252" font-size="16" fill="#9ca89a" font-weight="400">provider=-     mode=-     env=-</text><text x="44" y="284" font-size="16" fill="#9ca89a" font-weight="400">obs=-     act=-     agentProfile=-</text><text x="44" y="316" font-size="16" fill="#9ca89a" font-weight="400">providerFallback=-</text><text x="44" y="365" font-size="15" fill="#d0a85b" font-weight="400">Expected phase-1 contract is not the actual probe result.</text><text x="44" y="414" font-size="14" fill="#d0a85b" font-weight="600">provider check</text><text x="44" y="451" font-size="16" fill="#edf1e6" font-weight="400">status=-     source=-     fallback=-</text><text x="44" y="487" font-size="15" fill="#9ca89a" font-weight="400">No error/caps/action list → conditional badges omitted.</text><g id="no-agent"><rect x="732" y="120" width="684" height="166" rx="12" fill="#101412" stroke="#405346"/><text x="752" y="153" font-size="20" fill="#edf1e6" font-weight="600">Execution Lanes</text><text x="752" y="178" font-size="13" fill="#d0a85b" font-weight="400">No selected execution debug context</text></g><text x="752" y="228" font-size="16" fill="#edf1e6" font-weight="400">Select an agent to inspect the current execution-lane metadata.</text><g id="matrix"><rect x="732" y="310" width="684" height="360" rx="12" fill="#101412" stroke="#405346"/><text x="752" y="343" font-size="20" fill="#edf1e6" font-weight="600">Hosted Action Matrix</text><text x="752" y="368" font-size="13" fill="#d0a85b" font-weight="400">Read policy rows; not controls that grant permissions</text></g><text x="752" y="410" font-size="20" fill="#edf1e6" font-weight="400">prompt_control</text><text x="1140" y="410" font-size="14" fill="#d0a85b" font-weight="600">strong_auth_required</text><text x="752" y="453" font-size="16" fill="#9ca89a" font-weight="400">required_auth=strong_auth</text><text x="752" y="488" font-size="16" fill="#9ca89a" font-weight="400">availability=public_player_plane_with_backend_reauth_preview</text><text x="752" y="523" font-size="16" fill="#9ca89a" font-weight="400">Example reason: requires a separate strong-auth plane.</text><text x="752" y="558" font-size="16" fill="#9ca89a" font-weight="400">viewer=example distinct capability reason</text><text x="752" y="626" font-size="15" fill="#d0a85b" font-weight="400">This is an illustrative policy row, not a transport failure.</text><g id="feedback"><rect x="24" y="544" width="684" height="240" rx="12" fill="#101412" stroke="#405346"/><text x="44" y="577" font-size="20" fill="#edf1e6" font-weight="600">Prompt / Chat Feedback</text><text x="44" y="602" font-size="13" fill="#d0a85b" font-weight="400">Distinct semantic feedback states; no inferred subject badges</text></g><text x="44" y="621" font-size="15" fill="#d0a85b" font-weight="400">Prompt Feedback</text><text x="394" y="621" font-size="15" fill="#d0a85b" font-weight="400">Chat Feedback</text><text x="44" y="656" font-size="26" fill="#edf1e6" font-weight="400">idle</text><text x="394" y="656" font-size="26" fill="#edf1e6" font-weight="400">idle</text><text x="44" y="700" font-size="15" fill="#9ca89a" font-weight="400">Absent display feedback → no fabricated status badge.</text><text x="44" y="725" font-size="15" fill="#9ca89a" font-weight="400">Source metric cards show stage/label, not a guaranteed Agent ID.</text><g id="events-empty"><rect x="24" y="808" width="684" height="285" rx="12" fill="#101412" stroke="#405346"/><text x="44" y="841" font-size="20" fill="#edf1e6" font-weight="600">Recent Events</text><text x="44" y="866" font-size="13" fill="#d0a85b" font-weight="400">Current diagnostics event list, not World Feed</text></g><text x="44" y="917" font-size="20" fill="#edf1e6" font-weight="400">Waiting for live events…</text><text x="44" y="1006" font-size="15" fill="#9ca89a" font-weight="400">No event array → empty state, not a successful player action.</text><g id="events-present"><rect x="732" y="694" width="684" height="399" rx="12" fill="#101412" stroke="#405346"/><text x="752" y="727" font-size="20" fill="#edf1e6" font-weight="600">Recent Events · populated example</text><text x="752" y="752" font-size="13" fill="#d0a85b" font-weight="400">Event kind data only; not causal attribution to current selection</text></g><text x="752" y="793" font-size="20" fill="#edf1e6" font-weight="400">Example event title</text><text x="1210" y="793" font-size="14" fill="#d0a85b" font-weight="600">#7</text><text x="752" y="834" font-size="16" fill="#9ca89a" font-weight="400">time=12</text><rect x="752" y="862" width="644" height="94" rx="6" fill="#0b100f" stroke="#405346"/><text x="772" y="899" font-size="15" fill="#9ca89a" font-weight="400">{ &quot;example&quot;: &quot;illustrative event.kind only&quot; }</text><text x="752" y="1004" font-size="15" fill="#9ca89a" font-weight="400">Original operation subject belongs to the Receipt (W17).</text><text x="752" y="1029" font-size="15" fill="#9ca89a" font-weight="400">Do not add an invented Agent identity field to these cards.</text><text x="24" y="1161" font-size="16" fill="#9ca89a" font-weight="400">Raw debug JSON remains diagnostic; missing status is “-”, never presumed healthy or checked.</text><text x="24" y="1210" font-size="12" fill="#9ca89a" font-weight="400">W19-diagnostic-data • Fixed source PR 113868200d1f • editable SVG • no runtime verification</text></g></svg>