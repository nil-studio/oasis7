<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" role="img" aria-labelledby="title"><title id="title">Existing legend and published data coverage — static design, not live data</title><rect width="100%" height="100%" fill="#0b100f"/><g font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif"><text x="24" y="30" font-size="13" fill="#9ca89a" font-weight="400">OASIS7 / VIEWER • DESIGN REBUILD</text><text x="24" y="65" font-size="26" fill="#edf1e6" font-weight="400">Existing legend and published data coverage</text><text x="24" y="91" font-size="14" fill="#d0a85b" font-weight="400">Static contract / illustrative values only / not a runtime screenshot</text><g id="legend"><rect x="24" y="120" width="684" height="290" rx="12" fill="#101412" stroke="#405346"/><text x="44" y="153" font-size="20" fill="#edf1e6" font-weight="600">Legend</text><text x="44" y="178" font-size="13" fill="#d0a85b" font-weight="400">Actual four legend labels; symbols are decorative</text></g><text x="44" y="233" font-size="24" fill="#d0a85b" font-weight="400">—</text><text x="92" y="233" font-size="18" fill="#edf1e6" font-weight="400">Route</text><text x="364" y="233" font-size="24" fill="#d0a85b" font-weight="400">◆</text><text x="412" y="233" font-size="18" fill="#edf1e6" font-weight="400">Goal</text><text x="44" y="328" font-size="24" fill="#d0a85b" font-weight="400">!</text><text x="92" y="328" font-size="18" fill="#edf1e6" font-weight="400">Blocker</text><text x="364" y="328" font-size="24" fill="#d0a85b" font-weight="400">▪</text><text x="412" y="328" font-size="18" fill="#edf1e6" font-weight="400">Resource terrain</text><g id="sparse"><rect x="732" y="120" width="684" height="410" rx="12" fill="#101412" stroke="#405346"/><text x="752" y="153" font-size="20" fill="#edf1e6" font-weight="600">Published data coverage</text><text x="752" y="178" font-size="13" fill="#d0a85b" font-weight="400">Illustrative sparse DTO: routes=0, terrain=0, entities 1 + 1</text></g><text x="752" y="225" font-size="18" fill="#9ca89a" font-weight="400">Published entities: 1 agents · 1 locations</text><text x="752" y="273" font-size="18" fill="#9ca89a" font-weight="400">No published routes in this snapshot</text><text x="752" y="321" font-size="18" fill="#9ca89a" font-weight="400">No published terrain in this snapshot</text><text x="752" y="369" font-size="18" fill="#9ca89a" font-weight="400">Published bounds unavailable</text><text x="752" y="461" font-size="15" fill="#d0a85b" font-weight="400">Shown when routes=0 OR terrain=0.</text><g id="layers"><rect x="24" y="434" width="684" height="430" rx="12" fill="#101412" stroke="#405346"/><text x="44" y="467" font-size="20" fill="#edf1e6" font-weight="600">Layer / authority interaction diagram</text><text x="44" y="492" font-size="13" fill="#d0a85b" font-weight="400">Not a browser renderer implementation</text></g><rect x="44" y="531" width="644" height="65" rx="6" fill="#1b2922" stroke="#405346"/><text x="64" y="571" font-size="17" fill="#edf1e6" font-weight="400">Foreground: authorized selected entity</text><rect x="44" y="631" width="644" height="65" rx="6" fill="#1b2922" stroke="#405346"/><text x="64" y="671" font-size="17" fill="#edf1e6" font-weight="400">Relations: runtime authority, current + active</text><rect x="44" y="731" width="644" height="65" rx="6" fill="#1b2922" stroke="#405346"/><text x="64" y="771" font-size="17" fill="#edf1e6" font-weight="400">Background: published terrain</text><g id="association"><rect x="732" y="554" width="684" height="310" rx="12" fill="#101412" stroke="#405346"/><text x="752" y="587" font-size="20" fill="#edf1e6" font-weight="600">Association gates</text><text x="752" y="612" font-size="13" fill="#d0a85b" font-weight="400">Selection does not manufacture a relation</text></g><text x="752" y="655" font-size="16" fill="#9ca89a" font-weight="400">kind in authoritative allowlist</text><text x="752" y="689" font-size="16" fill="#9ca89a" font-weight="400">status=active; source_class=runtime_projection</text><text x="752" y="723" font-size="16" fill="#9ca89a" font-weight="400">freshness=current; explicit endpoint identity</text><text x="752" y="757" font-size="16" fill="#9ca89a" font-weight="400">No shared location / proximity inference.</text><text x="24" y="924" font-size="16" fill="#9ca89a" font-weight="400">Only Bevy/Rust renders the production world. Semantic/fixture layers do not establish a JS fallback or GPU proof.</text><text x="24" y="980" font-size="12" fill="#9ca89a" font-weight="400">W20-legend-sparse • Fixed source PR 113868200d1f • editable SVG • no runtime verification</text></g></svg>