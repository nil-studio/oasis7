<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1100" viewBox="0 0 1440 1100" role="img" aria-labelledby="title"><title id="title">Six non-Agent surfaces · existing fields vs missing contracts — static design, not live data</title><rect width="100%" height="100%" fill="#0b100f"/><g font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif"><text x="24" y="30" font-size="13" fill="#9ca89a" font-weight="400">OASIS7 / VIEWER • DESIGN REBUILD</text><text x="24" y="65" font-size="26" fill="#edf1e6" font-weight="400">Six non-Agent surfaces · existing fields vs missing contracts</text><text x="24" y="91" font-size="14" fill="#d0a85b" font-weight="400">Static contract / illustrative values only / not a runtime screenshot</text><g id="location"><rect x="24" y="120" width="684" height="281" rx="12" fill="#101412" stroke="#405346"/><text x="44" y="153" font-size="20" fill="#edf1e6" font-weight="600">Location</text></g><text x="44" y="190" font-size="16" fill="#9ca89a" font-weight="400">CURRENT list + raw object disclosure</text><text x="44" y="219" font-size="16" fill="#9ca89a" font-weight="400">name/id; profile.radius_cm; resources</text><text x="44" y="248" font-size="16" fill="#9ca89a" font-weight="400">Spatial inspector: label, geometry source,</text><text x="44" y="277" font-size="16" fill="#9ca89a" font-weight="400">freshness; trusted x/y/z_cm if available.</text><text x="44" y="306" font-size="16" fill="#9ca89a" font-weight="400">Generalized Inspector is a future slice.</text><rect x="44" y="342" width="300" height="44" rx="8" fill="#1b2922" stroke="#d0a85b"/><text x="56" y="370" font-size="15" fill="#edf1e6" font-weight="500">Expand raw object</text><g id="facility"><rect x="732" y="120" width="684" height="281" rx="12" fill="#101412" stroke="#405346"/><text x="752" y="153" font-size="20" fill="#edf1e6" font-weight="600">Facility / factory</text></g><text x="752" y="190" font-size="16" fill="#9ca89a" font-weight="400">CURRENT authorized entity inspector</text><text x="752" y="219" font-size="16" fill="#9ca89a" font-weight="400">label/entity_id; provenance.geometry_source</text><text x="752" y="248" font-size="16" fill="#9ca89a" font-weight="400">provenance.freshness; trusted x/y/z_cm</text><text x="752" y="277" font-size="16" fill="#9ca89a" font-weight="400">No Agent Follow or control capability.</text><text x="752" y="306" font-size="16" fill="#9ca89a" font-weight="400">Recipe/owner/stock not implied by position.</text><rect x="752" y="342" width="300" height="44" rx="8" fill="#151b17" stroke="#344037"/><text x="764" y="370" font-size="15" fill="#829084" font-weight="500">Follow unavailable</text><text x="1036" y="369" font-size="14" fill="#829084" font-weight="400">×</text><g id="territory"><rect x="24" y="425" width="684" height="281" rx="12" fill="#101412" stroke="#405346"/><text x="44" y="458" font-size="20" fill="#edf1e6" font-weight="600">Territory</text></g><text x="44" y="495" font-size="16" fill="#9ca89a" font-weight="400">CONTRACT BLOCKED generalized Inspector</text><text x="44" y="524" font-size="16" fill="#9ca89a" font-weight="400">No published Inspector DTO established here.</text><text x="44" y="553" font-size="16" fill="#9ca89a" font-weight="400">Ownership, borders, tax, actions: unknown.</text><text x="44" y="582" font-size="16" fill="#9ca89a" font-weight="400">Do not infer from map color or nearby Agent.</text><text x="44" y="611" font-size="16" fill="#9ca89a" font-weight="400">Requires domain projection + permission.</text><rect x="44" y="647" width="300" height="44" rx="8" fill="#151b17" stroke="#344037"/><text x="56" y="675" font-size="15" fill="#829084" font-weight="500">Actions unavailable</text><text x="328" y="674" font-size="14" fill="#829084" font-weight="400">×</text><g id="organization"><rect x="732" y="425" width="684" height="281" rx="12" fill="#101412" stroke="#405346"/><text x="752" y="458" font-size="20" fill="#edf1e6" font-weight="600">Organization</text></g><text x="752" y="495" font-size="16" fill="#9ca89a" font-weight="400">CONTRACT BLOCKED generalized Inspector</text><text x="752" y="524" font-size="16" fill="#9ca89a" font-weight="400">No published Inspector DTO established here.</text><text x="752" y="553" font-size="16" fill="#9ca89a" font-weight="400">Members, treasury, trust, authority: unknown.</text><text x="752" y="582" font-size="16" fill="#9ca89a" font-weight="400">Do not invent a join/manage command.</text><text x="752" y="611" font-size="16" fill="#9ca89a" font-weight="400">Requires authoritative domain contract.</text><rect x="752" y="647" width="300" height="44" rx="8" fill="#151b17" stroke="#344037"/><text x="764" y="675" font-size="15" fill="#829084" font-weight="500">Actions unavailable</text><text x="1036" y="674" font-size="14" fill="#829084" font-weight="400">×</text><g id="depot"><rect x="24" y="730" width="684" height="281" rx="12" fill="#101412" stroke="#405346"/><text x="44" y="763" font-size="20" fill="#edf1e6" font-weight="600">Depot</text></g><text x="44" y="800" font-size="16" fill="#9ca89a" font-weight="400">CURRENT MicroDepotFacilitiesPanel</text><text x="44" y="829" font-size="16" fill="#9ca89a" font-weight="400">facilityId/status; claim/location/radius</text><text x="44" y="858" font-size="16" fill="#9ca89a" font-weight="400">Inventory + revision; throughput + epoch</text><text x="44" y="887" font-size="16" fill="#9ca89a" font-weight="400">upkeepPaid; supported resources</text><text x="44" y="916" font-size="16" fill="#9ca89a" font-weight="400">availableActions are badges, not buttons.</text><rect x="44" y="952" width="300" height="44" rx="8" fill="#1b2922" stroke="#d0a85b"/><text x="56" y="980" font-size="15" fill="#edf1e6" font-weight="500">Technical evidence</text><g id="module"><rect x="732" y="730" width="684" height="281" rx="12" fill="#101412" stroke="#405346"/><text x="752" y="763" font-size="20" fill="#edf1e6" font-weight="600">Module</text></g><text x="752" y="800" font-size="16" fill="#9ca89a" font-weight="400">CURRENT Module Details + raw disclosure</text><text x="752" y="829" font-size="16" fill="#9ca89a" font-weight="400">readable label; module_id; kind</text><text x="752" y="858" font-size="16" fill="#9ca89a" font-weight="400">anchor: absolute position or referenced ID</text><text x="752" y="887" font-size="16" fill="#9ca89a" font-weight="400">Missing anchor → Anchor unavailable.</text><text x="752" y="916" font-size="16" fill="#9ca89a" font-weight="400">No deploy/install action from inspection.</text><rect x="752" y="952" width="300" height="44" rx="8" fill="#1b2922" stroke="#d0a85b"/><text x="764" y="980" font-size="15" fill="#edf1e6" font-weight="500">Expand raw object</text><text x="24" y="1080" font-size="12" fill="#9ca89a" font-weight="400">W04-nonagent-inspectors • Fixed source PR 113868200d1f • editable SVG • no runtime verification</text></g></svg>