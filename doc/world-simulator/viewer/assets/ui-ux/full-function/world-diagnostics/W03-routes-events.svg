<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title"><title id="title">Authorized routes, industry areas and event anchors — static design, not live data</title><rect width="100%" height="100%" fill="#0b100f"/><g font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif"><text x="24" y="30" font-size="13" fill="#9ca89a" font-weight="400">OASIS7 / VIEWER • DESIGN REBUILD</text><text x="24" y="65" font-size="26" fill="#edf1e6" font-weight="400">Authorized routes, industry areas and event anchors</text><text x="24" y="91" font-size="14" fill="#d0a85b" font-weight="400">Static contract / illustrative values only / not a runtime screenshot</text><g id="route"><rect x="24" y="120" width="684" height="725" rx="12" fill="#101412" stroke="#405346"/><text x="44" y="153" font-size="20" fill="#edf1e6" font-weight="600">Routes and endpoints</text><text x="44" y="178" font-size="13" fill="#d0a85b" font-weight="400">Read-only; no action submission</text></g><text x="44" y="212" font-size="14" fill="#d0a85b" font-weight="600">Route example · Available · Current</text><text x="44" y="249" font-size="16" fill="#9ca89a" font-weight="400">from label → to label</text><text x="44" y="274" font-size="16" fill="#9ca89a" font-weight="400">relation_id / status / freshness</text><text x="44" y="299" font-size="16" fill="#9ca89a" font-weight="400">Industry-route summaries also show route_count.</text><rect x="44" y="345" width="290" height="44" rx="8" fill="#1b2922" stroke="#d0a85b"/><text x="56" y="373" font-size="15" fill="#edf1e6" font-weight="500">Inspect origin</text><rect x="354" y="345" width="290" height="44" rx="8" fill="#1b2922" stroke="#d0a85b"/><text x="366" y="373" font-size="15" fill="#edf1e6" font-weight="500">Locate origin</text><rect x="44" y="405" width="290" height="44" rx="8" fill="#1b2922" stroke="#d0a85b"/><text x="56" y="433" font-size="15" fill="#edf1e6" font-weight="500">Inspect destination</text><rect x="354" y="405" width="290" height="44" rx="8" fill="#151b17" stroke="#344037"/><text x="366" y="433" font-size="15" fill="#829084" font-weight="500">Locate destination</text><text x="628" y="432" font-size="14" fill="#829084" font-weight="400">×</text><text x="44" y="494" font-size="16" fill="#9ca89a" font-weight="400">Destination has no trusted current position.</text><text x="44" y="519" font-size="16" fill="#9ca89a" font-weight="400">Aggregate endpoints can be inspected, not located.</text><text x="44" y="544" font-size="16" fill="#9ca89a" font-weight="400">The route is not a transport command.</text><path d="M90 620 L600 620" stroke="#d0a85b" stroke-width="2" fill="none" stroke-dasharray=""/><rect x="90" y="600" width="40" height="40" rx="0" fill="#294032" stroke="#d0a85b"/><rect x="560" y="600" width="40" height="40" rx="0" fill="#294032" stroke="#d0a85b"/><text x="44" y="710" font-size="18" fill="#d0a85b" font-weight="400">Relationship layout ≠ physical geography</text><g id="aggregate"><rect x="732" y="120" width="684" height="290" rx="12" fill="#101412" stroke="#405346"/><text x="752" y="153" font-size="20" fill="#edf1e6" font-weight="600">Industrial area</text><text x="752" y="178" font-size="13" fill="#d0a85b" font-weight="400">Current aggregate projection; not full industrial graph</text></g><text x="752" y="212" font-size="16" fill="#9ca89a" font-weight="400">label / member_count / provenance.freshness</text><text x="752" y="237" font-size="16" fill="#9ca89a" font-weight="400">Read-only area summary. No inferred throughput.</text><rect x="752" y="298" width="290" height="44" rx="8" fill="#1b2922" stroke="#d0a85b"/><text x="764" y="326" font-size="15" fill="#edf1e6" font-weight="500">Inspect area</text><rect x="1062" y="298" width="290" height="44" rx="8" fill="#1b2922" stroke="#d0a85b"/><text x="1074" y="326" font-size="15" fill="#edf1e6" font-weight="500">Explore area</text><g id="event"><rect x="732" y="434" width="684" height="411" rx="12" fill="#101412" stroke="#405346"/><text x="752" y="467" font-size="20" fill="#edf1e6" font-weight="600">Spatial event</text><text x="752" y="492" font-size="13" fill="#d0a85b" font-weight="400">Recent authorized anchor, not complete event history</text></g><text x="752" y="526" font-size="16" fill="#9ca89a" font-weight="400">label / freshness / logical_time</text><text x="752" y="551" font-size="16" fill="#9ca89a" font-weight="400">Trusted: journal payload + same cut/world/epoch</text><text x="752" y="576" font-size="16" fill="#9ca89a" font-weight="400">and valid published position; stale blocks location.</text><rect x="752" y="630" width="290" height="44" rx="8" fill="#151b17" stroke="#344037"/><text x="764" y="658" font-size="15" fill="#829084" font-weight="500">Locate event</text><text x="1026" y="657" font-size="14" fill="#829084" font-weight="400">×</text><rect x="1062" y="630" width="290" height="44" rx="8" fill="#1b2922" stroke="#d0a85b"/><text x="1074" y="658" font-size="15" fill="#edf1e6" font-weight="500">View world feed</text><text x="752" y="716" font-size="16" fill="#9ca89a" font-weight="400">Event absent in current Feed → show notice.</text><text x="752" y="741" font-size="16" fill="#9ca89a" font-weight="400">Never navigate to a different event as a substitute.</text><text x="24" y="940" font-size="12" fill="#9ca89a" font-weight="400">W03-routes-events • Fixed source PR 113868200d1f • editable SVG • no runtime verification</text></g></svg>