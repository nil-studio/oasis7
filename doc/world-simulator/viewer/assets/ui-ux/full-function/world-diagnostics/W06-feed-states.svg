<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1050" viewBox="0 0 1440 1050" role="img" aria-labelledby="title"><title id="title">World Feed · ambient context, never a success receipt — static design, not live data</title><rect width="100%" height="100%" fill="#0b100f"/><g font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif"><text x="24" y="30" font-size="13" fill="#9ca89a" font-weight="400">OASIS7 / VIEWER • DESIGN REBUILD</text><text x="24" y="65" font-size="26" fill="#edf1e6" font-weight="400">World Feed · ambient context, never a success receipt</text><text x="24" y="91" font-size="14" fill="#d0a85b" font-weight="400">Static contract / illustrative values only / not a runtime screenshot</text><g id="loading"><rect x="24" y="120" width="684" height="256" rx="12" fill="#101412" stroke="#405346"/><text x="44" y="153" font-size="20" fill="#edf1e6" font-weight="600">World Feed · SYNCING</text><text x="44" y="178" font-size="13" fill="#d0a85b" font-weight="400">Disclosure: collapse / expand</text></g><text x="44" y="212" font-size="16" fill="#9ca89a" font-weight="400">Waiting for world_feed/v1 response…</text><text x="44" y="237" font-size="16" fill="#9ca89a" font-weight="400">No event rows invented.</text><g id="empty"><rect x="732" y="120" width="684" height="256" rx="12" fill="#101412" stroke="#405346"/><text x="752" y="153" font-size="20" fill="#edf1e6" font-weight="600">World Feed · NO EVENTS</text><text x="752" y="178" font-size="13" fill="#d0a85b" font-weight="400">Disclosure: collapse / expand</text></g><text x="752" y="212" font-size="16" fill="#9ca89a" font-weight="400">No authoritative update has events yet.</text><text x="752" y="237" font-size="16" fill="#9ca89a" font-weight="400">Continue the current Player goal.</text><g id="ready"><rect x="24" y="400" width="684" height="256" rx="12" fill="#101412" stroke="#405346"/><text x="44" y="433" font-size="20" fill="#edf1e6" font-weight="600">World Feed · LIVE</text><text x="44" y="458" font-size="13" fill="#d0a85b" font-weight="400">Disclosure: collapse / expand</text></g><text x="44" y="492" font-size="16" fill="#9ca89a" font-weight="400">Example summary · #event_seq</text><text x="44" y="517" font-size="16" fill="#9ca89a" font-weight="400">Event kind; explicit receipt_ref if supplied.</text><rect x="44" y="570" width="345" height="44" rx="8" fill="#1b2922" stroke="#d0a85b"/><text x="56" y="598" font-size="15" fill="#edf1e6" font-weight="500">View explicit receipt</text><rect x="406" y="570" width="280" height="44" rx="8" fill="#1b2922" stroke="#d0a85b"/><text x="418" y="598" font-size="15" fill="#edf1e6" font-weight="500">Locate module</text><g id="replay"><rect x="732" y="400" width="684" height="256" rx="12" fill="#101412" stroke="#405346"/><text x="752" y="433" font-size="20" fill="#edf1e6" font-weight="600">World Feed · REPLAY</text><text x="752" y="458" font-size="13" fill="#d0a85b" font-weight="400">Disclosure: collapse / expand</text></g><text x="752" y="492" font-size="16" fill="#9ca89a" font-weight="400">Cursor replay context.</text><text x="752" y="517" font-size="16" fill="#9ca89a" font-weight="400">Does not prove a new player action succeeded.</text><g id="gap"><rect x="24" y="680" width="684" height="256" rx="12" fill="#101412" stroke="#405346"/><text x="44" y="713" font-size="20" fill="#edf1e6" font-weight="600">World Feed · GAP</text><text x="44" y="738" font-size="13" fill="#d0a85b" font-weight="400">Disclosure: collapse / expand</text></g><text x="44" y="772" font-size="16" fill="#9ca89a" font-weight="400">Cursor/history discontinuity; append stopped.</text><text x="44" y="797" font-size="16" fill="#9ca89a" font-weight="400">Conflicting event identity clears the feed.</text><rect x="44" y="850" width="345" height="44" rx="8" fill="#1b2922" stroke="#d0a85b"/><text x="56" y="878" font-size="15" fill="#edf1e6" font-weight="500">Reload authoritative snapshot</text><g id="unavailable"><rect x="732" y="680" width="684" height="256" rx="12" fill="#101412" stroke="#405346"/><text x="752" y="713" font-size="20" fill="#edf1e6" font-weight="600">World Feed · UNAVAILABLE</text><text x="752" y="738" font-size="13" fill="#d0a85b" font-weight="400">Disclosure: collapse / expand</text></g><text x="752" y="772" font-size="16" fill="#9ca89a" font-weight="400">No verifiable feed from runtime.</text><text x="752" y="797" font-size="16" fill="#9ca89a" font-weight="400">Show unavailableReason, not old live status.</text><rect x="752" y="850" width="345" height="44" rx="8" fill="#1b2922" stroke="#d0a85b"/><text x="764" y="878" font-size="15" fill="#edf1e6" font-weight="500">Retry World Feed</text><text x="24" y="1030" font-size="12" fill="#9ca89a" font-weight="400">W06-feed-states • Fixed source PR 113868200d1f • editable SVG • no runtime verification</text></g></svg>