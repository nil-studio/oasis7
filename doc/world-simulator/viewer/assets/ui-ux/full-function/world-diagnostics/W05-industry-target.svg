<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="970" viewBox="0 0 1440 970" role="img" aria-labelledby="title"><title id="title">Industrial relationship graph · conditional design target — static design, not live data</title><rect width="100%" height="100%" fill="#0b100f"/><g font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif"><text x="24" y="30" font-size="13" fill="#9ca89a" font-weight="400">OASIS7 / VIEWER • DESIGN REBUILD</text><text x="24" y="65" font-size="26" fill="#edf1e6" font-weight="400">Industrial relationship graph · conditional design target</text><text x="24" y="91" font-size="14" fill="#d0a85b" font-weight="400">Static contract / illustrative values only / not a runtime screenshot</text><g id="world"><rect x="24" y="120" width="440" height="650" rx="12" fill="#101412" stroke="#405346"/><text x="44" y="153" font-size="20" fill="#edf1e6" font-weight="600">World</text><text x="44" y="178" font-size="13" fill="#d0a85b" font-weight="400">Future · overview hotspots and trunks</text></g><text x="44" y="215" font-size="16" fill="#9ca89a" font-weight="400">Only authorized published projections.</text><text x="44" y="240" font-size="16" fill="#9ca89a" font-weight="400">No synthetic global stock or ownership.</text><rect x="70" y="350" width="140" height="85" rx="0" fill="#23382b" stroke="#d0a85b"/><text x="80" y="398" font-size="16" fill="#edf1e6" font-weight="400">Region A</text><rect x="280" y="450" width="140" height="85" rx="0" fill="#23382b" stroke="#d0a85b"/><text x="290" y="498" font-size="16" fill="#edf1e6" font-weight="400">Region B</text><path d="M205 390 L280 490" stroke="#d0a85b" stroke-width="2" fill="none" stroke-dasharray="7 7"/><text x="44" y="610" font-size="14" fill="#d0a85b" font-weight="400">Dashed link: conditional, not live flow</text><g id="region"><rect x="488" y="120" width="440" height="650" rx="12" fill="#101412" stroke="#405346"/><text x="508" y="153" font-size="20" fill="#edf1e6" font-weight="600">Region</text><text x="508" y="178" font-size="13" fill="#d0a85b" font-weight="400">Future · relationships and supported flows</text></g><text x="508" y="215" font-size="16" fill="#9ca89a" font-weight="400">Direction / type / throughput / loss</text><text x="508" y="240" font-size="16" fill="#9ca89a" font-weight="400">are unknown until explicitly published.</text><rect x="580" y="340" width="240" height="70" rx="0" fill="#23382b" stroke="#d0a85b"/><text x="600" y="383" font-size="16" fill="#edf1e6" font-weight="400">Node A</text><rect x="580" y="485" width="240" height="70" rx="0" fill="#23382b" stroke="#d0a85b"/><text x="600" y="528" font-size="16" fill="#edf1e6" font-weight="400">Node B</text><path d="M700 410 L700 485" stroke="#d0a85b" stroke-width="2" fill="none" stroke-dasharray="7 7"/><text x="508" y="610" font-size="14" fill="#d0a85b" font-weight="400">No inferred bottleneck or causal claim</text><g id="node"><rect x="952" y="120" width="464" height="650" rx="12" fill="#101412" stroke="#405346"/><text x="972" y="153" font-size="20" fill="#edf1e6" font-weight="600">Node</text><text x="972" y="178" font-size="13" fill="#d0a85b" font-weight="400">Future · recipe / stock / stage, if supported</text></g><text x="972" y="215" font-size="16" fill="#9ca89a" font-weight="400">Recipe: not published</text><text x="972" y="253" font-size="16" fill="#9ca89a" font-weight="400">Inventory: not published</text><text x="972" y="291" font-size="16" fill="#9ca89a" font-weight="400">Flow loss: not published</text><text x="972" y="329" font-size="16" fill="#9ca89a" font-weight="400">Stage: not published</text><rect x="972" y="430" width="410" height="44" rx="8" fill="#151b17" stroke="#344037"/><text x="984" y="458" font-size="15" fill="#829084" font-weight="500">Locate node (trusted position required)</text><text x="1366" y="457" font-size="14" fill="#829084" font-weight="400">×</text><text x="972" y="530" font-size="22" fill="#d0a85b" font-weight="400">R1  R2  R3  R4  R5</text><text x="972" y="568" font-size="15" fill="#9ca89a" font-weight="400">Each tier requires its own source support.</text><text x="972" y="593" font-size="15" fill="#9ca89a" font-weight="400">bootstrap / scale / governance: conditional</text><text x="972" y="618" font-size="15" fill="#9ca89a" font-weight="400">Not five implemented UI views.</text><g id="gate"><rect x="24" y="795" width="1392" height="100" rx="12" fill="#101412" stroke="#405346"/><text x="44" y="828" font-size="20" fill="#edf1e6" font-weight="600">Contract gate: do not implement guessed industrial truth</text><text x="44" y="853" font-size="13" fill="#d0a85b" font-weight="400">Existing aggregates and routes do not establish full graph coverage. No trade, production or governance controls added.</text></g><text x="24" y="950" font-size="12" fill="#9ca89a" font-weight="400">W05-industry-target • Fixed source PR 113868200d1f • editable SVG • no runtime verification</text></g></svg>