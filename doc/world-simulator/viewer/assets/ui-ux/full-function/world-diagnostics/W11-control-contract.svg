<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" role="img" aria-labelledby="title"><title id="title">Control profiles · separate published actions from legacy protocol — static design, not live data</title><rect width="100%" height="100%" fill="#0b100f"/><g font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif"><text x="24" y="30" font-size="13" fill="#9ca89a" font-weight="400">OASIS7 / VIEWER • DESIGN REBUILD</text><text x="24" y="65" font-size="26" fill="#edf1e6" font-weight="400">Control profiles · separate published actions from legacy protocol</text><text x="24" y="91" font-size="14" fill="#d0a85b" font-weight="400">Static contract / illustrative values only / not a runtime screenshot</text><g id="web"><rect x="24" y="120" width="684" height="340" rx="12" fill="#101412" stroke="#405346"/><text x="44" y="153" font-size="20" fill="#edf1e6" font-weight="600">Web published actions</text><text x="44" y="178" font-size="13" fill="#d0a85b" font-weight="400">Availability and disabled reason come from runtime</text></g><text x="44" y="211" font-size="16" fill="#9ca89a" font-weight="400">step / play / request_snapshot</text><text x="44" y="243" font-size="16" fill="#9ca89a" font-weight="400">This is an action contract layout, not a new form.</text><text x="44" y="275" font-size="16" fill="#9ca89a" font-weight="400">Show only availableActions; no Seek command.</text><rect x="44" y="348" width="185" height="44" rx="8" fill="#151b17" stroke="#344037"/><text x="56" y="376" font-size="15" fill="#829084" font-weight="500">Step</text><text x="213" y="375" font-size="14" fill="#829084" font-weight="400">×</text><rect x="247" y="348" width="185" height="44" rx="8" fill="#151b17" stroke="#344037"/><text x="259" y="376" font-size="15" fill="#829084" font-weight="500">Play</text><text x="416" y="375" font-size="14" fill="#829084" font-weight="400">×</text><rect x="450" y="348" width="230" height="44" rx="8" fill="#1b2922" stroke="#d0a85b"/><text x="462" y="376" font-size="15" fill="#edf1e6" font-weight="500">Request snapshot</text><text x="44" y="429" font-size="14" fill="#d0a85b" font-weight="400">Example blocked reason: wait for committed snapshot</text><g id="legacy"><rect x="732" y="120" width="684" height="340" rx="12" fill="#101412" stroke="#405346"/><text x="752" y="153" font-size="20" fill="#edf1e6" font-weight="600">Legacy control API</text><text x="752" y="178" font-size="13" fill="#d0a85b" font-weight="400">Not a promise of exposed Player buttons</text></g><text x="752" y="211" font-size="16" fill="#9ca89a" font-weight="400">play / pause / step(count ≥ 1)</text><text x="752" y="243" font-size="16" fill="#9ca89a" font-weight="400">live → live_control; playback → playback_control</text><text x="752" y="275" font-size="16" fill="#9ca89a" font-weight="400">unknown profile → legacy type: control (CURRENT)</text><rect x="752" y="348" width="185" height="44" rx="8" fill="#1b2922" stroke="#d0a85b"/><text x="764" y="376" font-size="15" fill="#edf1e6" font-weight="500">Play</text><rect x="955" y="348" width="185" height="44" rx="8" fill="#1b2922" stroke="#d0a85b"/><text x="967" y="376" font-size="15" fill="#edf1e6" font-weight="500">Pause</text><rect x="1158" y="348" width="230" height="44" rx="8" fill="#1b2922" stroke="#d0a85b"/><text x="1170" y="376" font-size="15" fill="#edf1e6" font-weight="500">Step · count 1</text><g id="feedback"><rect x="24" y="484" width="684" height="360" rx="12" fill="#101412" stroke="#405346"/><text x="44" y="517" font-size="20" fill="#edf1e6" font-weight="600">Feedback truth</text><text x="44" y="542" font-size="13" fill="#d0a85b" font-weight="400">queued is not world delta / outcome</text></g><text x="44" y="581" font-size="16" fill="#9ca89a" font-weight="400">Invalid step: reject before send.</text><text x="44" y="617" font-size="16" fill="#9ca89a" font-weight="400">Live gameplay disabledReason: blocked.</text><text x="44" y="653" font-size="16" fill="#9ca89a" font-weight="400">Send failure: rejected with reason.</text><text x="44" y="689" font-size="16" fill="#9ca89a" font-weight="400">Queued: track request_id and actual world delta.</text><g id="future"><rect x="732" y="484" width="684" height="360" rx="12" fill="#101412" stroke="#405346"/><text x="752" y="517" font-size="20" fill="#edf1e6" font-weight="600">Proposed future safety change</text><text x="752" y="542" font-size="13" fill="#d0a85b" font-weight="400">Not current behavior; requires separate authorization</text></g><text x="752" y="581" font-size="16" fill="#9ca89a" font-weight="400">Unknown controlProfile → fail closed (PROPOSAL).</text><text x="752" y="617" font-size="16" fill="#9ca89a" font-weight="400">Current fallback does send legacy control.</text><text x="752" y="653" font-size="16" fill="#9ca89a" font-weight="400">Do not implement or claim this change here.</text><text x="752" y="689" font-size="16" fill="#9ca89a" font-weight="400">No generic JSON textbox or Seek form added.</text><text x="24" y="980" font-size="12" fill="#9ca89a" font-weight="400">W11-control-contract • Fixed source PR 113868200d1f • editable SVG • no runtime verification</text></g></svg>