<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="980" viewBox="0 0 1440 980" role="img" aria-labelledby="title"><title id="title">World renderer · preserve context, never fake readiness — static design, not live data</title><rect width="100%" height="100%" fill="#0b100f"/><g font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif"><text x="24" y="30" font-size="13" fill="#9ca89a" font-weight="400">OASIS7 / VIEWER • DESIGN REBUILD</text><text x="24" y="65" font-size="26" fill="#edf1e6" font-weight="400">World renderer · preserve context, never fake readiness</text><text x="24" y="91" font-size="14" fill="#d0a85b" font-weight="400">Static contract / illustrative values only / not a runtime screenshot</text><g id="loading"><rect x="24" y="120" width="440" height="480" rx="12" fill="#101412" stroke="#405346"/><text x="44" y="153" font-size="20" fill="#edf1e6" font-weight="600">Loading</text><text x="44" y="178" font-size="13" fill="#d0a85b" font-weight="400">Rust bridge deriving display state</text></g><text x="44" y="222" font-size="16" fill="#9ca89a" font-weight="400">World canvas not ready.</text><text x="44" y="256" font-size="16" fill="#9ca89a" font-weight="400">Retain legal objective and receipt.</text><text x="44" y="290" font-size="16" fill="#9ca89a" font-weight="400">No browser-generated replacement.</text><g id="ready"><rect x="488" y="120" width="440" height="480" rx="12" fill="#101412" stroke="#405346"/><text x="508" y="153" font-size="20" fill="#edf1e6" font-weight="600">Ready</text><text x="508" y="178" font-size="13" fill="#d0a85b" font-weight="400">Only real Bevy / Rust canvas readiness</text></g><rect x="516" y="240" width="384" height="190" rx="0" fill="#17251e" stroke="#405346"/><text x="540" y="338" font-size="18" fill="#edf1e6" font-weight="400">Illustrative stage region</text><text x="508" y="485" font-size="15" fill="#9ca89a" font-weight="400">Authorized snapshot + input + hit testing</text><text x="508" y="510" font-size="15" fill="#9ca89a" font-weight="400">must be verified, not assumed by probe.</text><g id="unavailable"><rect x="952" y="120" width="464" height="480" rx="12" fill="#101412" stroke="#405346"/><text x="972" y="153" font-size="20" fill="#edf1e6" font-weight="600">Graphics unavailable</text><text x="972" y="178" font-size="13" fill="#d0a85b" font-weight="400">Fatal, scope change or no GPU</text></g><text x="972" y="222" font-size="16" fill="#9ca89a" font-weight="400">Old world hits stop.</text><text x="972" y="256" font-size="16" fill="#9ca89a" font-weight="400">Scope change clears previous content.</text><text x="972" y="290" font-size="16" fill="#9ca89a" font-weight="400">Retain legal text and original receipt.</text><rect x="972" y="399" width="300" height="44" rx="8" fill="#1b2922" stroke="#d0a85b"/><text x="984" y="427" font-size="15" fill="#edf1e6" font-weight="500">Retry Renderer</text><g id="renderer-diagnostic"><rect x="24" y="624" width="1392" height="245" rx="12" fill="#101412" stroke="#405346"/><text x="44" y="657" font-size="20" fill="#edf1e6" font-weight="600">Renderer Diagnostics · expandable</text><text x="44" y="682" font-size="13" fill="#d0a85b" font-weight="400">Current reachable disclosure when !focusMode OR !maximized; not fixture-only</text></g><text x="44" y="720" font-size="16" fill="#9ca89a" font-weight="400">locations / fragments / agents / tick / links / hotspots / derived_positions / world_bounds</text><text x="44" y="745" font-size="16" fill="#9ca89a" font-weight="400">renderer / runtime / zoom / pan / hover; fatal code and message when unavailable</text><rect x="44" y="790" width="380" height="44" rx="8" fill="#1b2922" stroke="#d0a85b"/><text x="56" y="818" font-size="15" fill="#edf1e6" font-weight="500">Reattach Embedded Renderer</text><rect x="446" y="790" width="360" height="44" rx="8" fill="#1b2922" stroke="#d0a85b"/><text x="458" y="818" font-size="15" fill="#edf1e6" font-weight="500">Simulate Renderer Fatal</text><text x="24" y="960" font-size="12" fill="#9ca89a" font-weight="400">W10-renderer-states • Fixed source PR 113868200d1f • editable SVG • no runtime verification</text></g></svg>