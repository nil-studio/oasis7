<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1250" viewBox="0 0 1440 1250" role="img" aria-labelledby="title"><title id="title">Targets sync · existing read-only object inspection — static design, not live data</title><rect width="100%" height="100%" fill="#0b100f"/><g font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif"><text x="24" y="30" font-size="13" fill="#9ca89a" font-weight="400">OASIS7 / VIEWER • DESIGN REBUILD</text><text x="24" y="65" font-size="26" fill="#edf1e6" font-weight="400">Targets sync · existing read-only object inspection</text><text x="24" y="91" font-size="14" fill="#d0a85b" font-weight="400">Static contract / illustrative values only / not a runtime screenshot</text><g id="pending"><rect x="24" y="120" width="684" height="310" rx="12" fill="#101412" stroke="#405346"/><text x="44" y="153" font-size="20" fill="#edf1e6" font-weight="600">Syncing targets…</text><text x="44" y="178" font-size="13" fill="#d0a85b" font-weight="400">aria-live=polite · aria-busy=true</text></g><text x="44" y="216" font-size="16" fill="#9ca89a" font-weight="400">Connection: connected</text><text x="44" y="248" font-size="16" fill="#9ca89a" font-weight="400">Handshake: server ready</text><text x="44" y="280" font-size="16" fill="#9ca89a" font-weight="400">Snapshot: first world snapshot requested, 1 retries</text><text x="44" y="312" font-size="16" fill="#9ca89a" font-weight="400">Player session: syncing player session</text><text x="44" y="344" font-size="16" fill="#9ca89a" font-weight="400">Visibility: snapshot agents 0, visible 0</text><g id="empty"><rect x="732" y="120" width="684" height="310" rx="12" fill="#101412" stroke="#405346"/><text x="752" y="153" font-size="20" fill="#edf1e6" font-weight="600">No agents in current snapshot.</text><text x="752" y="178" font-size="13" fill="#d0a85b" font-weight="400">Snapshot received; not a pending spinner</text></g><text x="752" y="218" font-size="18" fill="#edf1e6" font-weight="400">No locations in current snapshot.</text><text x="752" y="269" font-size="15" fill="#9ca89a" font-weight="400">Illustrative input: snapshot received, counts 0 / 0.</text><text x="752" y="301" font-size="15" fill="#9ca89a" font-weight="400">Empty list has no fabricated retry/claim button.</text><text x="752" y="333" font-size="15" fill="#9ca89a" font-weight="400">Connection/auth progress is not rendered here by this branch.</text><g id="trusted"><rect x="24" y="454" width="684" height="276" rx="12" fill="#101412" stroke="#405346"/><text x="44" y="487" font-size="20" fill="#edf1e6" font-weight="600">Location example</text><text x="44" y="512" font-size="13" fill="#d0a85b" font-weight="400">Object inspection · current component, not future Inspector</text></g><text x="44" y="559" font-size="17" fill="#edf1e6" font-weight="400">Read-only observation · Authoritative position</text><text x="44" y="596" font-size="16" fill="#d0a85b" font-weight="400">Current</text><text x="44" y="649" font-size="16" fill="#9ca89a" font-weight="400">Display coordinates: 120, 240, 0 cm</text><g id="derived"><rect x="732" y="454" width="684" height="276" rx="12" fill="#101412" stroke="#405346"/><text x="752" y="487" font-size="20" fill="#edf1e6" font-weight="600">Facility example</text><text x="752" y="512" font-size="13" fill="#d0a85b" font-weight="400">Object inspection · current component, not future Inspector</text></g><text x="752" y="559" font-size="17" fill="#edf1e6" font-weight="400">Read-only observation · Derived from location</text><text x="752" y="596" font-size="16" fill="#d0a85b" font-weight="400">Current</text><text x="752" y="649" font-size="16" fill="#9ca89a" font-weight="400">Display coordinates: 120, 240, 0 cm</text><g id="unknown"><rect x="24" y="754" width="684" height="276" rx="12" fill="#101412" stroke="#405346"/><text x="44" y="787" font-size="20" fill="#edf1e6" font-weight="600">Object example</text><text x="44" y="812" font-size="13" fill="#d0a85b" font-weight="400">Object inspection · current component, not future Inspector</text></g><text x="44" y="859" font-size="17" fill="#edf1e6" font-weight="400">Read-only observation · Position unknown</text><text x="44" y="896" font-size="16" fill="#d0a85b" font-weight="400">Freshness unknown</text><text x="44" y="949" font-size="16" fill="#9ca89a" font-weight="400">No current trusted position; map location unavailable.</text><g id="help"><rect x="732" y="754" width="684" height="386" rx="12" fill="#101412" stroke="#405346"/><text x="752" y="787" font-size="20" fill="#edf1e6" font-weight="600">Scale Guidance · expanded</text><text x="752" y="812" font-size="13" fill="#d0a85b" font-weight="400">InlineHelpTip; not an action submission</text></g><rect x="752" y="831" width="60" height="44" rx="8" fill="#1b2922" stroke="#d0a85b"/><text x="764" y="859" font-size="15" fill="#edf1e6" font-weight="500">?</text><text x="832" y="859" font-size="15" fill="#edf1e6" font-weight="400">aria-expanded=true · aria-controls=help ID</text><rect x="752" y="902" width="644" height="130" rx="8" fill="#1b2922" stroke="#405346"/><text x="772" y="934" font-size="18" fill="#edf1e6" font-weight="400">Scale Guidance</text><text x="772" y="971" font-size="16" fill="#9ca89a" font-weight="400">Published scale explanation from props.lines.</text><text x="752" y="1067" font-size="15" fill="#9ca89a" font-weight="400">Click trigger toggles; outside pointerdown / Escape closes.</text><text x="752" y="1092" font-size="15" fill="#9ca89a" font-weight="400">No explicit focus-restoration call exists in this component.</text><text x="24" y="1184" font-size="16" fill="#9ca89a" font-weight="400">Coordinate numbers are design examples only. Inspector itself is read-only and has no Locate/Follow buttons.</text><text x="24" y="1230" font-size="12" fill="#9ca89a" font-weight="400">W18-targets-inspection • Fixed source PR 113868200d1f • editable SVG • no runtime verification</text></g></svg>