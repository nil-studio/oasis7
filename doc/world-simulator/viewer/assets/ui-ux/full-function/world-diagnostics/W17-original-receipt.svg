<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1070" viewBox="0 0 1440 1070" role="img" aria-labelledby="title"><title id="title">Observe B · preserve the original Action Receipt for A — static design, not live data</title><rect width="100%" height="100%" fill="#0b100f"/><g font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif"><text x="24" y="30" font-size="13" fill="#9ca89a" font-weight="400">OASIS7 / VIEWER • DESIGN REBUILD</text><text x="24" y="65" font-size="26" fill="#edf1e6" font-weight="400">Observe B · preserve the original Action Receipt for A</text><text x="24" y="91" font-size="14" fill="#d0a85b" font-weight="400">Static contract / illustrative values only / not a runtime screenshot</text><g id="observation"><rect x="24" y="120" width="1392" height="130" rx="12" fill="#101412" stroke="#405346"/><text x="44" y="153" font-size="20" fill="#edf1e6" font-weight="600">Current observation · Agent B</text><text x="44" y="178" font-size="13" fill="#d0a85b" font-weight="400">Selection is B; original action target remains Agent A. All values below are illustrative.</text></g><rect x="1060" y="178" width="320" height="44" rx="8" fill="#1b2922" stroke="#d0a85b"/><text x="1072" y="206" font-size="15" fill="#edf1e6" font-weight="500">Return to target</text><text x="44" y="212" font-size="16" fill="#9ca89a" font-weight="400">Existing explorer navigation, not a new Receipt control.</text><g id="waiting"><rect x="24" y="280" width="448" height="620" rx="12" fill="#101412" stroke="#405346"/><text x="44" y="313" font-size="20" fill="#edf1e6" font-weight="600">Action Receipt</text><text x="44" y="338" font-size="13" fill="#d0a85b" font-weight="400">Exact component fields; illustrative source values</text></g><text x="44" y="390" font-size="21" fill="#edf1e6" font-weight="400">Request submitted</text><text x="44" y="438" font-size="15" fill="#9ca89a" font-weight="400">Original request A is waiting for</text><text x="44" y="463" font-size="15" fill="#9ca89a" font-weight="400">an authoritative outcome.</text><text x="44" y="520" font-size="16" fill="#9ca89a" font-weight="400">Do not attribute this result</text><text x="44" y="545" font-size="16" fill="#9ca89a" font-weight="400">to observed Agent B.</text><text x="44" y="615" font-size="15" fill="#9ca89a" font-weight="400">No published delta fields shown.</text><path d="M44 704 L452 704" stroke="#405346" stroke-width="2" fill="none" stroke-dasharray=""/><text x="44" y="747" font-size="14" fill="#d0a85b" font-weight="600">Waiting for confirmation</text><text x="44" y="785" font-size="18" fill="#edf1e6" font-weight="400">Agent A</text><g id="accepted"><rect x="496" y="280" width="448" height="620" rx="12" fill="#101412" stroke="#405346"/><text x="516" y="313" font-size="20" fill="#edf1e6" font-weight="600">Action Receipt</text><text x="516" y="338" font-size="13" fill="#d0a85b" font-weight="400">Exact component fields; illustrative source values</text></g><text x="516" y="390" font-size="21" fill="#edf1e6" font-weight="400">Intent accepted</text><text x="516" y="438" font-size="15" fill="#9ca89a" font-weight="400">The original intent for A was accepted.</text><text x="516" y="520" font-size="16" fill="#9ca89a" font-weight="400">Accepted intent is not a</text><text x="516" y="545" font-size="16" fill="#9ca89a" font-weight="400">confirmed world effect.</text><text x="516" y="615" font-size="15" fill="#9ca89a" font-weight="400">No published delta fields shown.</text><path d="M516 704 L924 704" stroke="#405346" stroke-width="2" fill="none" stroke-dasharray=""/><text x="516" y="747" font-size="14" fill="#d0a85b" font-weight="600">Action accepted</text><text x="516" y="785" font-size="18" fill="#edf1e6" font-weight="400">Agent A</text><g id="effect"><rect x="968" y="280" width="448" height="620" rx="12" fill="#101412" stroke="#405346"/><text x="988" y="313" font-size="20" fill="#edf1e6" font-weight="600">Action Receipt</text><text x="988" y="338" font-size="13" fill="#d0a85b" font-weight="400">Exact component fields; illustrative source values</text></g><text x="988" y="390" font-size="21" fill="#edf1e6" font-weight="400">World result recorded</text><text x="988" y="438" font-size="15" fill="#9ca89a" font-weight="400">The original result for A has</text><text x="988" y="463" font-size="15" fill="#9ca89a" font-weight="400">a published world delta.</text><text x="988" y="520" font-size="16" fill="#9ca89a" font-weight="400">Read the published result;</text><text x="988" y="545" font-size="16" fill="#9ca89a" font-weight="400">ambient events are separate.</text><text x="988" y="615" font-size="16" fill="#d0a85b" font-weight="400">World tick change 1</text><text x="988" y="640" font-size="16" fill="#d0a85b" font-weight="400">Event sequence change 2</text><path d="M988 704 L1396 704" stroke="#405346" stroke-width="2" fill="none" stroke-dasharray=""/><text x="988" y="747" font-size="14" fill="#d0a85b" font-weight="600">World change confirmed</text><text x="988" y="785" font-size="18" fill="#edf1e6" font-weight="400">Agent A</text><text x="24" y="956" font-size="16" fill="#9ca89a" font-weight="400">Receipt source: title / summary / optional detail / optional deltas / confidence / target_agent_id.</text><text x="24" y="987" font-size="15" fill="#9ca89a" font-weight="400">The component has no independent next-step or return button; next-step copy can only come from published detail.</text><text x="24" y="1050" font-size="12" fill="#9ca89a" font-weight="400">W17-original-receipt • Fixed source PR 113868200d1f • editable SVG • no runtime verification</text></g></svg>