<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="850"><style>text{font-family:"Noto Sans CJK SC",sans-serif;fill:#203e32}</style><rect width="1440" height="850" fill="#f7f3e9"/><text x="36" y="45" font-size="18" font-weight="400">S10 / TARGET STATE FRAGMENT · 合同示例，不是当前世界事实</text><text x="36" y="94" font-size="29" font-weight="600">扩展与预算：准入冻结不抹历史</text><text x="36" y="130" font-size="17" font-weight="400">所有状态值均为设计情境；本图不宣称接口当前可用，也不执行任何写动作。</text><rect x="30" y="160" width="1380" height="61" rx="6" fill="#ded2ad"/><text x="36" y="198" font-size="18" font-weight="600">读面</text><text x="331" y="198" font-size="18" font-weight="600">示意状态</text><text x="671" y="198" font-size="18" font-weight="600">保持边界</text><rect x="30" y="227" width="1380" height="61" rx="6" fill="#fffdf7"/><text x="36" y="265" font-size="18" font-weight="400">FROM artifact tuple</text><text x="331" y="265" font-size="18" font-weight="400">new admission frozen</text><text x="671" y="265" font-size="18" font-weight="400">仅精确 tuple，不猜测其他版本</text><rect x="30" y="294" width="1380" height="61" rx="6" fill="#ebe7dc"/><text x="36" y="332" font-size="18" font-weight="400">既有 profile / instance</text><text x="331" y="332" font-size="18" font-weight="400">历史保留</text><text x="671" y="332" font-size="18" font-weight="400">不是自动停用或资产删除</text><rect x="30" y="361" width="1380" height="61" rx="6" fill="#fffdf7"/><text x="36" y="399" font-size="18" font-weight="400">当前 owner / payer</text><text x="331" y="399" font-size="18" font-weight="400">unknown</text><text x="671" y="399" font-size="18" font-weight="400">不隐式换付款方</text><rect x="30" y="428" width="1380" height="61" rx="6" fill="#ebe7dc"/><text x="36" y="466" font-size="18" font-weight="400">执行预算</text><text x="331" y="466" font-size="18" font-weight="400">degraded</text><text x="671" y="466" font-size="18" font-weight="400">与 Data / Electricity 资源费分开</text><rect x="30" y="495" width="1380" height="61" rx="6" fill="#fffdf7"/><text x="36" y="533" font-size="18" font-weight="400">外部性 profile</text><text x="331" y="533" font-size="18" font-weight="400">authority expired</text><text x="671" y="533" font-size="18" font-weight="400">停止新的未授权 sink</text><rect x="30" y="562" width="1380" height="61" rx="6" fill="#ebe7dc"/><text x="36" y="600" font-size="18" font-weight="400">production / disposition</text><text x="331" y="600" font-size="18" font-weight="400">held_pending_disposition</text><text x="671" y="600" font-size="18" font-weight="400">持有不等于 treatment 完成</text><rect x="36" y="660" width="650" height="52" rx="8" fill="#d6d7ca" stroke="#a3aa9b"/><text x="52" y="694" font-size="19" font-weight="400">新激活 / 不可逆运行：不可用</text><text x="36" y="755" font-size="18" font-weight="400">已确认结果不抹去；原 root/revision/obligation 核对，缺安全路径不发布伪造完成。</text></svg>