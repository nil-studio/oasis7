<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="850"><style>text{font-family:"Noto Sans CJK SC",sans-serif;fill:#203e32}</style><rect width="1440" height="850" fill="#f7f3e9"/><text x="36" y="45" font-size="18" font-weight="400">S02 / TARGET STATE FRAGMENT · 合同示例，不是当前世界事实</text><text x="36" y="94" font-size="29" font-weight="600">事项已通过，但执行结果未知</text><text x="36" y="130" font-size="17" font-weight="400">所有状态值均为设计情境；本图不宣称接口当前可用，也不执行任何写动作。</text><rect x="30" y="160" width="1380" height="61" rx="6" fill="#ded2ad"/><text x="36" y="198" font-size="18" font-weight="600">事实层</text><text x="331" y="198" font-size="18" font-weight="600">示意值</text><text x="671" y="198" font-size="18" font-weight="600">读面含义</text><rect x="30" y="227" width="1380" height="61" rx="6" fill="#fffdf7"/><text x="36" y="265" font-size="18" font-weight="400">普通决策</text><text x="331" y="265" font-size="18" font-weight="400">passed</text><text x="671" y="265" font-size="18" font-weight="400">有限执行资格，不是世界结果</text><rect x="30" y="294" width="1380" height="61" rx="6" fill="#ebe7dc"/><text x="36" y="332" font-size="18" font-weight="400">执行请求</text><text x="331" y="332" font-size="18" font-weight="400">响应丢失</text><text x="671" y="332" font-size="18" font-weight="400">原事项 / 修订 / payload 仍固定</text><rect x="30" y="361" width="1380" height="61" rx="6" fill="#fffdf7"/><text x="36" y="399" font-size="18" font-weight="400">当前 receipt</text><text x="331" y="399" font-size="18" font-weight="400">未查得</text><text x="671" y="399" font-size="18" font-weight="400">不能断言没有生效</text><rect x="30" y="428" width="1380" height="61" rx="6" fill="#ebe7dc"/><text x="36" y="466" font-size="18" font-weight="400">当前授权</text><text x="331" y="466" font-size="18" font-weight="400">需重新读取</text><text x="671" y="466" font-size="18" font-weight="400">不能由旧 passed 续期</text><rect x="30" y="495" width="1380" height="61" rx="6" fill="#fffdf7"/><text x="36" y="533" font-size="18" font-weight="400">业务效果</text><text x="331" y="533" font-size="18" font-weight="400">unknown</text><text x="671" y="533" font-size="18" font-weight="400">禁止再次执行或更换操作身份</text><rect x="30" y="562" width="1380" height="61" rx="6" fill="#ebe7dc"/><text x="36" y="600" font-size="18" font-weight="400">恢复动作</text><text x="331" y="600" font-size="18" font-weight="400">核对原 ExecutionSlot</text><text x="671" y="600" font-size="18" font-weight="400">已有结果只返回原 receipt</text><rect x="36" y="660" width="650" height="52" rx="8" fill="#d6d7ca" stroke="#a3aa9b"/><text x="52" y="694" font-size="19" font-weight="400">再次执行：不可用</text><text x="36" y="755" font-size="18" font-weight="400">查询原提交点；若是后续纠正，必须独立合法决定 + linked receipt，不改历史。</text></svg>