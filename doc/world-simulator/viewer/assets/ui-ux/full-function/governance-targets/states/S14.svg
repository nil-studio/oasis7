<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1260"><style>text{font-family:"Noto Sans CJK SC",sans-serif;fill:#203e32}</style><rect width="1600" height="1260" fill="#f7f3e9"/><text  x="36" y="40" font-size="18" font-weight="400">S14 / TARGET FORM FRAGMENT · 目标表单片段，不是当前已接通功能</text><text  x="36" y="92" font-size="30" font-weight="600">托管返还：选择资产，不可改写受益人</text><rect x="36" y="120" width="1528" height="76" rx="8" fill="#e9ddbd" stroke="none"/><text  x="54" y="151" font-size="19" font-weight="600">设计示例：选择控件只表达用户意图；身份、权限、版本、成本和效果均不由用户自由填写。</text><text  x="54" y="180" font-size="17" font-weight="400">示例值不是当前世界事实。未选 / 未知 / 权限未验证的行显示阻断；本稿不提交任何请求。</text><text  x="36" y="237" font-size="23" font-weight="600">可选择项与系统绑定项（逐字段区分）</text><text  x="1000" y="237" font-size="23" font-weight="600">角色 / 校验 / 结果</text><rect x="36" y="265" width="928" height="138" rx="8" fill="#fffdf7" stroke="none"/><text  x="52" y="293" font-size="19" font-weight="600">case / manifest / expected versions</text><rect x="52" y="306" width="896" height="45" rx="8" fill="#e9ece5" stroke="#adb6a9"/><text id="control-case" x="68" y="335" font-size="18" font-weight="400">系统绑定 / 不可编辑</text><text  x="818" y="335" font-size="16" font-weight="600">只读</text><text  x="52" y="374" font-size="16" font-weight="400">绑定已打开原 case、manifest root 与当前版本；不能通过新 case 重复处分。</text><rect x="36" y="416" width="928" height="138" rx="8" fill="#fffdf7" stroke="none"/><text  x="52" y="444" font-size="19" font-weight="600">完整托管项 · 用户单选</text><rect x="52" y="457" width="896" height="45" rx="8" fill="#fff" stroke="#53745c"/><text id="control-asset" x="68" y="486" font-size="18" font-weight="400">完整托管项 A（设计示例）</text><text  x="915" y="486" font-size="23" font-weight="600">⌄</text><text  x="52" y="525" font-size="16" font-weight="400">选中值来自 canonical DepositOrganizationEstate receipt；未知权属不列入。</text><rect x="36" y="567" width="928" height="138" rx="8" fill="#fffdf7" stroke="none"/><text  x="52" y="595" font-size="19" font-weight="600">返还对象 / 数量</text><rect x="52" y="608" width="896" height="45" rx="8" fill="#e9ece5" stroke="#adb6a9"/><text id="control-recipient" x="68" y="637" font-size="18" font-weight="400">系统绑定：原 contributor / 完整项</text><text  x="818" y="637" font-size="16" font-weight="600">只读</text><text  x="52" y="676" font-size="16" font-weight="400">不可编辑受益人、不可拆分本图首版完整返还项；原记录未知即阻断。</text><rect x="36" y="718" width="928" height="138" rx="8" fill="#fffdf7" stroke="none"/><text  x="52" y="746" font-size="19" font-weight="600">appointment / successor grant / scope</text><rect x="52" y="759" width="896" height="45" rx="8" fill="#e9ece5" stroke="#adb6a9"/><text id="control-grant" x="68" y="788" font-size="18" font-weight="400">系统绑定 / 不可编辑</text><text  x="818" y="788" font-size="16" font-weight="600">只读</text><text  x="52" y="827" font-size="16" font-weight="400">当前 authority、控制绑定、scope 与期限由权威读取；用户不得手填授权。</text><rect x="36" y="869" width="928" height="138" rx="8" fill="#fffdf7" stroke="none"/><text  x="52" y="897" font-size="19" font-weight="600">request identity / plan hash / effect key</text><rect x="52" y="910" width="896" height="45" rx="8" fill="#e9ece5" stroke="#adb6a9"/><text id="control-request" x="68" y="939" font-size="18" font-weight="400">系统绑定 / 不可编辑</text><text  x="818" y="939" font-size="16" font-weight="600">只读</text><text  x="52" y="978" font-size="16" font-weight="400">PrepareDisposition 生成计划；确认绑定原计划与版本，unknown 查原请求。</text><rect x="986" y="265" width="578" height="138" rx="8" fill="#eeeade" stroke="none"/><text  x="1002" y="295" font-size="16" font-weight="600">01 / 权威检查</text><text  x="1002" y="331" font-size="19" font-weight="400">可选对象：仅首版实际支持的完整托管项。</text><rect x="986" y="416" width="578" height="138" rx="8" fill="#eeeade" stroke="none"/><text  x="1002" y="446" font-size="16" font-weight="600">02 / 权威检查</text><text  x="1002" y="482" font-size="19" font-weight="400">当前权利：appointment 或明确 successor scope。</text><rect x="986" y="567" width="578" height="138" rx="8" fill="#eeeade" stroke="none"/><text  x="1002" y="597" font-size="16" font-weight="600">03 / 权威检查</text><text  x="1002" y="633" font-size="19" font-weight="400">执行条件：治理、控制绑定、期限、阶段。</text><rect x="986" y="718" width="578" height="138" rx="8" fill="#eeeade" stroke="none"/><text  x="1002" y="748" font-size="16" font-weight="600">04 / 权威检查</text><text  x="1002" y="784" font-size="19" font-weight="400">阻断：stay / quarantine / 重叠 handoff。</text><rect x="986" y="869" width="578" height="138" rx="8" fill="#eeeade" stroke="none"/><text  x="1002" y="899" font-size="16" font-weight="600">05 / 权威检查</text><text  x="1002" y="935" font-size="19" font-weight="400">未知对象不作为空集合或默认有权。</text><rect x="36" y="1044" width="928" height="55" rx="8" fill="#d6d7ca" stroke="#9ca993"/><text  x="54" y="1079" font-size="20" font-weight="600">读取返还计划 · 目标只读</text><rect x="986" y="1044" width="578" height="55" rx="8" fill="#d6d7ca" stroke="#9ca993"/><text  x="1002" y="1079" font-size="19" font-weight="600">确认返还 · 当前授权未验证</text><text  x="36" y="1140" font-size="18" font-weight="400">启用规则：精确合同、当前 capability、角色、授权、scope、版本和全部前置均有效；只读动作也须当前读取权限。</text><text  x="36" y="1175" font-size="18" font-weight="400">记录 / 选择 / 预览 ≠ 审批 ≠ 执行；执行只以实际 receipt 为准，未知时核对原操作，不自动重发。</text><text  x="36" y="1220" font-size="17" font-weight="400">图中下拉、复选 affordance 为目标交互设计；未验证的候选枚举、数量单位或接口保持 contract_unknown。</text></svg>