<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="850"><style>text{font-family:"Noto Sans CJK SC",sans-serif;fill:#203e32}</style><rect width="1440" height="850" fill="#f7f3e9"/><text x="36" y="45" font-size="18" font-weight="400">S01 / TARGET STATE FRAGMENT · 合同示例，不是当前世界事实</text><text x="36" y="94" font-size="29" font-weight="600">宪制确认未齐：逐条件而非一个 approved</text><text x="36" y="130" font-size="17" font-weight="400">所有状态值均为设计情境；本图不宣称接口当前可用，也不执行任何写动作。</text><rect x="30" y="160" width="1380" height="61" rx="6" fill="#ded2ad"/><text x="36" y="198" font-size="18" font-weight="600">条件</text><text x="331" y="198" font-size="18" font-weight="600">示意值</text><text x="671" y="198" font-size="18" font-weight="600">证据与下一步</text><rect x="30" y="227" width="1380" height="61" rx="6" fill="#fffdf7"/><text x="36" y="265" font-size="18" font-weight="400">审议 / 影响说明</text><text x="331" y="265" font-size="18" font-weight="400">satisfied</text><text x="671" y="265" font-size="18" font-weight="400">精确 payload 与公开记录</text><rect x="30" y="294" width="1380" height="61" rx="6" fill="#ebe7dc"/><text x="36" y="332" font-size="18" font-weight="400">延迟 / 复核</text><text x="331" y="332" font-size="18" font-weight="400">satisfied</text><text x="671" y="332" font-size="18" font-weight="400">权威时间条件已满足</text><rect x="30" y="361" width="1380" height="61" rx="6" fill="#fffdf7"/><text x="36" y="399" font-size="18" font-weight="400">适用超多数</text><text x="331" y="399" font-size="18" font-weight="400">satisfied</text><text x="671" y="399" font-size="18" font-weight="400">独立资格快照，不借普通票局</text><rect x="30" y="428" width="1380" height="61" rx="6" fill="#ebe7dc"/><text x="36" y="466" font-size="18" font-weight="400">独立确认</text><text x="331" y="466" font-size="18" font-weight="400">pending</text><text x="671" y="466" font-size="18" font-weight="400">仍缺必需受影响主体确认</text><rect x="30" y="495" width="1380" height="61" rx="6" fill="#fffdf7"/><text x="36" y="533" font-size="18" font-weight="400">审计 / 申诉 / 当前授权</text><text x="331" y="533" font-size="18" font-weight="400">satisfied</text><text x="671" y="533" font-size="18" font-weight="400">各自原始 producer 和 receipt</text><rect x="36" y="660" width="650" height="52" rx="8" fill="#d6d7ca" stroke="#a3aa9b"/><text x="52" y="694" font-size="19" font-weight="400">执行宪制事项：不可用</text><text x="36" y="755" font-size="18" font-weight="400">缺少一个条件仍无规则 / 资产 / 权限变化；不要借 ready 标签跳过合取。</text></svg>