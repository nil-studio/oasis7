<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="850"><style>text{font-family:"Noto Sans CJK SC",sans-serif;fill:#203e32}</style><rect width="1440" height="850" fill="#f7f3e9"/><text x="36" y="45" font-size="18" font-weight="400">S11 / TARGET STATE FRAGMENT · 合同示例，不是当前世界事实</text><text x="36" y="94" font-size="29" font-weight="600">持续服务与社会事实：关系不是绑定合同</text><text x="36" y="130" font-size="17" font-weight="400">所有状态值均为设计情境；本图不宣称接口当前可用，也不执行任何写动作。</text><rect x="30" y="160" width="1380" height="61" rx="6" fill="#ded2ad"/><text x="36" y="198" font-size="18" font-weight="600">记录</text><text x="331" y="198" font-size="18" font-weight="600">示意状态</text><text x="671" y="198" font-size="18" font-weight="600">保持边界</text><rect x="30" y="227" width="1380" height="61" rx="6" fill="#fffdf7"/><text x="36" y="265" font-size="18" font-weight="400">沟通 / Agent 建议</text><text x="331" y="265" font-size="18" font-weight="400">非绑定</text><text x="671" y="265" font-size="18" font-weight="400">不能用聊天确认按钮建立义务</text><rect x="30" y="294" width="1380" height="61" rx="6" fill="#ebe7dc"/><text x="36" y="332" font-size="18" font-weight="400">合同接受</text><text x="331" y="332" font-size="18" font-weight="400">accepted 但无校验 receipt</text><text x="671" y="332" font-size="18" font-weight="400">不展示 committed</text><rect x="30" y="361" width="1380" height="61" rx="6" fill="#fffdf7"/><text x="36" y="399" font-size="18" font-weight="400">服务 checkpoint</text><text x="331" y="399" font-size="18" font-weight="400">已完成部分保留</text><text x="671" y="399" font-size="18" font-weight="400">修复只处理未履行范围</text><rect x="30" y="428" width="1380" height="61" rx="6" fill="#ebe7dc"/><text x="36" y="466" font-size="18" font-weight="400">社会事实预览</text><text x="331" y="466" font-size="18" font-weight="400">只读风险解释</text><text x="671" y="466" font-size="18" font-weight="400">不裁决、不扣 stake、不保证合作</text><rect x="30" y="495" width="1380" height="61" rx="6" fill="#fffdf7"/><text x="36" y="533" font-size="18" font-weight="400">声誉</text><text x="331" y="533" font-size="18" font-weight="400">主体 + 情境 + 到期</text><text x="671" y="533" font-size="18" font-weight="400">不升级为全局资格</text><rect x="30" y="562" width="1380" height="61" rx="6" fill="#ebe7dc"/><text x="36" y="600" font-size="18" font-weight="400">R&amp;D 份额转移</text><text x="331" y="600" font-size="18" font-weight="400">原 charter / provenance</text><text x="671" y="600" font-size="18" font-weight="400">不转移个人 credential 或一般声誉</text><rect x="36" y="660" width="650" height="52" rx="8" fill="#d6d7ca" stroke="#a3aa9b"/><text x="52" y="694" font-size="19" font-weight="400">接受 / 发布 / 继受：不可用</text><text x="36" y="755" font-size="18" font-weight="400">只读 Simulator 预览是局部合同；完整正式服务与 R&amp;D 写流程仍 contract-blocked。</text></svg>