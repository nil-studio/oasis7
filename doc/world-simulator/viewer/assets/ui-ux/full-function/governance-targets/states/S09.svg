<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="850"><style>text{font-family:"Noto Sans CJK SC",sans-serif;fill:#203e32}</style><rect width="1440" height="850" fill="#f7f3e9"/><text x="36" y="45" font-size="18" font-weight="400">S09 / TARGET STATE FRAGMENT · 合同示例，不是当前世界事实</text><text x="36" y="94" font-size="29" font-weight="600">信息授权失效：不隐藏公共安全、不泄露实时私有值</text><text x="36" y="130" font-size="17" font-weight="400">所有状态值均为设计情境；本图不宣称接口当前可用，也不执行任何写动作。</text><rect x="30" y="160" width="1380" height="61" rx="6" fill="#ded2ad"/><text x="36" y="198" font-size="18" font-weight="600">信息对象</text><text x="331" y="198" font-size="18" font-weight="600">示意状态</text><text x="671" y="198" font-size="18" font-weight="600">允许展示</text><rect x="30" y="227" width="1380" height="61" rx="6" fill="#fffdf7"/><text x="36" y="265" font-size="18" font-weight="400">公共规则 / 已结算事实</text><text x="331" y="265" font-size="18" font-weight="400">可审计</text><text x="671" y="265" font-size="18" font-weight="400">来源与权威范围</text><rect x="30" y="294" width="1380" height="61" rx="6" fill="#ebe7dc"/><text x="36" y="332" font-size="18" font-weight="400">最低安全 / 通行信息</text><text x="331" y="332" font-size="18" font-weight="400">按公共披露边界</text><text x="671" y="332" font-size="18" font-weight="400">不得因争议冻结无关安全信息</text><rect x="30" y="361" width="1380" height="61" rx="6" fill="#fffdf7"/><text x="36" y="399" font-size="18" font-weight="400">实时库存 / 路线</text><text x="331" y="399" font-size="18" font-weight="400">grant revoked</text><text x="671" y="399" font-size="18" font-weight="400">遮蔽私有值，不沿用缓存为实时</text><rect x="30" y="428" width="1380" height="61" rx="6" fill="#ebe7dc"/><text x="36" y="466" font-size="18" font-weight="400">freshness / 观察范围</text><text x="331" y="466" font-size="18" font-weight="400">stale / 局部</text><text x="671" y="466" font-size="18" font-weight="400">显式不确定性，不补成全图真值</text><rect x="30" y="495" width="1380" height="61" rx="6" fill="#fffdf7"/><text x="36" y="533" font-size="18" font-weight="400">历史合法 receipt</text><text x="331" y="533" font-size="18" font-weight="400">仍保留</text><text x="671" y="533" font-size="18" font-weight="400">provenance 不复活当前授权</text><rect x="30" y="562" width="1380" height="61" rx="6" fill="#ebe7dc"/><text x="36" y="600" font-size="18" font-weight="400">结算中请求</text><text x="331" y="600" font-size="18" font-weight="400">pending / unknown</text><text x="671" y="600" font-size="18" font-weight="400">先查原结果，不先消费后补授权</text><rect x="36" y="660" width="650" height="52" rx="8" fill="#d6d7ca" stroke="#a3aa9b"/><text x="52" y="694" font-size="19" font-weight="400">新 Data 使用：不可用</text><text x="36" y="755" font-size="18" font-weight="400">完整跨主体 purpose/scope 合同未核清；刷新、替代、等待、停止只能指向真实可用入口。</text></svg>