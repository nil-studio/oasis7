<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="850"><style>text{font-family:"Noto Sans CJK SC",sans-serif;fill:#203e32}</style><rect width="1440" height="850" fill="#f7f3e9"/><text x="36" y="45" font-size="18" font-weight="400">S07 / TARGET STATE FRAGMENT · 合同示例，不是当前世界事实</text><text x="36" y="94" font-size="29" font-weight="600">占领权利与物品交割：分别核验</text><text x="36" y="130" font-size="17" font-weight="400">所有状态值均为设计情境；本图不宣称接口当前可用，也不执行任何写动作。</text><rect x="30" y="160" width="1380" height="61" rx="6" fill="#ded2ad"/><text x="36" y="198" font-size="18" font-weight="600">结算对象</text><text x="331" y="198" font-size="18" font-weight="600">示意值</text><text x="671" y="198" font-size="18" font-weight="600">禁止推论</text><rect x="30" y="227" width="1380" height="61" rx="6" fill="#fffdf7"/><text x="36" y="265" font-size="18" font-weight="400">冲突授权</text><text x="331" y="265" font-size="18" font-weight="400">需核当前 charter</text><text x="671" y="265" font-size="18" font-weight="400">邻近或物流不是目标授权</text><rect x="30" y="294" width="1380" height="61" rx="6" fill="#ebe7dc"/><text x="36" y="332" font-size="18" font-weight="400">占领</text><text x="331" y="332" font-size="18" font-weight="400">contested</text><text x="671" y="332" font-size="18" font-weight="400">进入或短触不等于成立</text><rect x="30" y="361" width="1380" height="61" rx="6" fill="#fffdf7"/><text x="36" y="399" font-size="18" font-weight="400">持续占有</text><text x="331" y="399" font-size="18" font-weight="400">证据未齐</text><text x="671" y="399" font-size="18" font-weight="400">不能跳到占领完成</text><rect x="30" y="428" width="1380" height="61" rx="6" fill="#ebe7dc"/><text x="36" y="466" font-size="18" font-weight="400">到期冻结</text><text x="331" y="466" font-size="18" font-weight="400">独立事实待读</text><text x="671" y="466" font-size="18" font-weight="400">不推定所有物品归属</text><rect x="30" y="495" width="1380" height="61" rx="6" fill="#fffdf7"/><text x="36" y="533" font-size="18" font-weight="400">物理提取</text><text x="331" y="533" font-size="18" font-weight="400">在途示例</text><text x="671" y="533" font-size="18" font-weight="400">尚未安全交割</text><rect x="30" y="562" width="1380" height="61" rx="6" fill="#ebe7dc"/><text x="36" y="600" font-size="18" font-weight="400">受保护目的地</text><text x="331" y="600" font-size="18" font-weight="400">未确认入库</text><text x="671" y="600" font-size="18" font-weight="400">不显示安全存储完成</text><rect x="36" y="660" width="650" height="52" rx="8" fill="#d6d7ca" stroke="#a3aa9b"/><text x="52" y="694" font-size="19" font-weight="400">占领 / 提取提交：不可用</text><text x="36" y="755" font-size="18" font-weight="400">完整专业写合同未核清；可读分离是目标，不代表已有占领或物流管理入口。</text></svg>