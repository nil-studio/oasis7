<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="850"><style>text{font-family:"Noto Sans CJK SC",sans-serif;fill:#203e32}</style><rect width="1440" height="850" fill="#f7f3e9"/><text x="36" y="45" font-size="18" font-weight="400">S03 / TARGET STATE FRAGMENT · 合同示例，不是当前世界事实</text><text x="36" y="94" font-size="29" font-weight="600">Charter 邻区异议：审查与权力分离</text><text x="36" y="130" font-size="17" font-weight="400">所有状态值均为设计情境；本图不宣称接口当前可用，也不执行任何写动作。</text><rect x="30" y="160" width="1380" height="61" rx="6" fill="#ded2ad"/><text x="36" y="198" font-size="18" font-weight="600">审查 / 资格</text><text x="331" y="198" font-size="18" font-weight="600">示意值</text><text x="671" y="198" font-size="18" font-weight="600">边界</text><rect x="30" y="227" width="1380" height="61" rx="6" fill="#fffdf7"/><text x="36" y="265" font-size="18" font-weight="400">空间与能力证据</text><text x="331" y="265" font-size="18" font-weight="400">已提供</text><text x="671" y="265" font-size="18" font-weight="400">证据元数据不等于已验证</text><rect x="30" y="294" width="1380" height="61" rx="6" fill="#ebe7dc"/><text x="36" y="332" font-size="18" font-weight="400">本地审查</text><text x="331" y="332" font-size="18" font-weight="400">通过示例</text><text x="671" y="332" font-size="18" font-weight="400">只在本地作用范围内有效</text><rect x="30" y="361" width="1380" height="61" rx="6" fill="#fffdf7"/><text x="36" y="399" font-size="18" font-weight="400">邻区审查</text><text x="331" y="399" font-size="18" font-weight="400">scope_objection</text><text x="671" y="399" font-size="18" font-weight="400">显示受影响范围和异议理由</text><rect x="30" y="428" width="1380" height="61" rx="6" fill="#ebe7dc"/><text x="36" y="466" font-size="18" font-weight="400">全局宪制审查</text><text x="331" y="466" font-size="18" font-weight="400">review_pending</text><text x="671" y="466" font-size="18" font-weight="400">不能由本地通过替代</text><rect x="30" y="495" width="1380" height="61" rx="6" fill="#fffdf7"/><text x="36" y="533" font-size="18" font-weight="400">双资格</text><text x="331" y="533" font-size="18" font-weight="400">unknown</text><text x="671" y="533" font-size="18" font-weight="400">OC/委托与本地贡献各查来源</text><rect x="30" y="562" width="1380" height="61" rx="6" fill="#ebe7dc"/><text x="36" y="600" font-size="18" font-weight="400">charter 生效</text><text x="331" y="600" font-size="18" font-weight="400">未确认</text><text x="671" y="600" font-size="18" font-weight="400">不建立临时边界或 bond 占用</text><rect x="36" y="660" width="650" height="52" rx="8" fill="#d6d7ca" stroke="#a3aa9b"/><text x="52" y="694" font-size="19" font-weight="400">成立或调整：不可用</text><text x="36" y="755" font-size="18" font-weight="400">补证后新修订不得搬旧审查；保持原 charter 及每对象 disposition 的独立结果。</text></svg>