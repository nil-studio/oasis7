<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="850"><style>text{font-family:"Noto Sans CJK SC",sans-serif;fill:#203e32}</style><rect width="1440" height="850" fill="#f7f3e9"/><text x="36" y="45" font-size="18" font-weight="400">S12 / TARGET STATE FRAGMENT · 合同示例，不是当前世界事实</text><text x="36" y="94" font-size="29" font-weight="600">Pioneer 到期：机会与 tenure 不互相替代</text><text x="36" y="130" font-size="17" font-weight="400">所有状态值均为设计情境；本图不宣称接口当前可用，也不执行任何写动作。</text><rect x="30" y="160" width="1380" height="61" rx="6" fill="#ded2ad"/><text x="36" y="198" font-size="18" font-weight="600">对象</text><text x="331" y="198" font-size="18" font-weight="600">示意状态</text><text x="671" y="198" font-size="18" font-weight="600">受保护边界</text><rect x="30" y="227" width="1380" height="61" rx="6" fill="#fffdf7"/><text x="36" y="265" font-size="18" font-weight="400">相邻 frontier</text><text x="331" y="265" font-size="18" font-weight="400">组合前置未核齐</text><text x="671" y="265" font-size="18" font-weight="400">探索、物流、charter 不能互相替代</text><rect x="30" y="294" width="1380" height="61" rx="6" fill="#ebe7dc"/><text x="36" y="332" font-size="18" font-weight="400">priority</text><text x="331" y="332" font-size="18" font-weight="400">expired</text><text x="671" y="332" font-size="18" font-weight="400">不重置期限或未完成里程碑</text><rect x="30" y="361" width="1380" height="61" rx="6" fill="#fffdf7"/><text x="36" y="399" font-size="18" font-weight="400">独立 tenure</text><text x="331" y="399" font-size="18" font-weight="400">需读取原成立记录</text><text x="671" y="399" font-size="18" font-weight="400">priority 到期不追溯没收</text><rect x="30" y="428" width="1380" height="61" rx="6" fill="#ebe7dc"/><text x="36" y="466" font-size="18" font-weight="400">转让请求</text><text x="331" y="466" font-size="18" font-weight="400">旧授权待决</text><text x="671" y="466" font-size="18" font-weight="400">不跨 charter 变更自动确认</text><rect x="30" y="495" width="1380" height="61" rx="6" fill="#fffdf7"/><text x="36" y="533" font-size="18" font-weight="400">争议期安全 / 通行</text><text x="331" y="533" font-size="18" font-weight="400">依独立规则继续</text><text x="671" y="533" font-size="18" font-weight="400">不因 priority 争议冻结</text><rect x="30" y="562" width="1380" height="61" rx="6" fill="#ebe7dc"/><text x="36" y="600" font-size="18" font-weight="400">历史 receipt</text><text x="331" y="600" font-size="18" font-weight="400">保留</text><text x="671" y="600" font-size="18" font-weight="400">不重放恢复已撤销机会</text><rect x="36" y="660" width="650" height="52" rx="8" fill="#d6d7ca" stroke="#a3aa9b"/><text x="52" y="694" font-size="19" font-weight="400">转让 / 续期：不可用</text><text x="36" y="755" font-size="18" font-weight="400">无完整专用 producer/写合同，不虚构可进入 frontier 或受让人资格规则。</text></svg>