<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="850"><style>text{font-family:"Noto Sans CJK SC",sans-serif;fill:#203e32}</style><rect width="1440" height="850" fill="#f7f3e9"/><text x="36" y="45" font-size="18" font-weight="400">S05 / TARGET STATE FRAGMENT · 合同示例，不是当前世界事实</text><text x="36" y="94" font-size="29" font-weight="600">组织救济与交接：三层状态不互推</text><text x="36" y="130" font-size="17" font-weight="400">所有状态值均为设计情境；本图不宣称接口当前可用，也不执行任何写动作。</text><rect x="30" y="160" width="1380" height="61" rx="6" fill="#ded2ad"/><text x="36" y="198" font-size="18" font-weight="600">层 / 对象</text><text x="331" y="198" font-size="18" font-weight="600">示意值</text><text x="671" y="198" font-size="18" font-weight="600">范围</text><rect x="30" y="227" width="1380" height="61" rx="6" fill="#fffdf7"/><text x="36" y="265" font-size="18" font-weight="400">base_phase</text><text x="331" y="265" font-size="18" font-weight="400">Protected</text><text x="671" y="265" font-size="18" font-weight="400">保护阶段不代表控制已归还</text><rect x="30" y="294" width="1380" height="61" rx="6" fill="#ebe7dc"/><text x="36" y="332" font-size="18" font-weight="400">disposition phase</text><text x="331" y="332" font-size="18" font-weight="400">CustodyReturn</text><text x="671" y="332" font-size="18" font-weight="400">仅限首版支持的完整托管项返还</text><rect x="30" y="361" width="1380" height="61" rx="6" fill="#fffdf7"/><text x="36" y="399" font-size="18" font-weight="400">reclaim request</text><text x="331" y="399" font-size="18" font-weight="400">UnderReview</text><text x="671" y="399" font-size="18" font-weight="400">登记与待审不自动取回控制</text><rect x="30" y="428" width="1380" height="61" rx="6" fill="#ebe7dc"/><text x="36" y="466" font-size="18" font-weight="400">stay / quarantine</text><text x="331" y="466" font-size="18" font-weight="400">重叠范围需核对</text><text x="671" y="466" font-size="18" font-weight="400">不解除全部原义务</text><rect x="30" y="495" width="1380" height="61" rx="6" fill="#fffdf7"/><text x="36" y="533" font-size="18" font-weight="400">successor handoff</text><text x="331" y="533" font-size="18" font-weight="400">proposed</text><text x="671" y="533" font-size="18" font-weight="400">候选接受不等于 grant active</text><rect x="30" y="562" width="1380" height="61" rx="6" fill="#ebe7dc"/><text x="36" y="600" font-size="18" font-weight="400">旧请求绑定</text><text x="331" y="600" font-size="18" font-weight="400">原 grant / scope version</text><text x="671" y="600" font-size="18" font-weight="400">不能自动迁移或继承顺位</text><rect x="36" y="660" width="650" height="52" rx="8" fill="#d6d7ca" stroke="#a3aa9b"/><text x="52" y="694" font-size="19" font-weight="400">确认交接 / 返还：不可用</text><text x="36" y="755" font-size="18" font-weight="400">当前 controller 绑定、期限、scope 与治理 authority 均须重验；unknown 查原 case/request。</text></svg>