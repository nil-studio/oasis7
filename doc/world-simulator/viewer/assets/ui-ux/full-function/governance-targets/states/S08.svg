<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="850"><style>text{font-family:"Noto Sans CJK SC",sans-serif;fill:#203e32}</style><rect width="1440" height="850" fill="#f7f3e9"/><text x="36" y="45" font-size="18" font-weight="400">S08 / TARGET STATE FRAGMENT · 合同示例，不是当前世界事实</text><text x="36" y="94" font-size="29" font-weight="600">软赛季转换：刷新对象与保留对象</text><text x="36" y="130" font-size="17" font-weight="400">所有状态值均为设计情境；本图不宣称接口当前可用，也不执行任何写动作。</text><rect x="30" y="160" width="1380" height="61" rx="6" fill="#ded2ad"/><text x="36" y="198" font-size="18" font-weight="600">维度</text><text x="331" y="198" font-size="18" font-weight="600">目标读法</text><text x="671" y="198" font-size="18" font-weight="600">不能发生的变化</text><rect x="30" y="227" width="1380" height="61" rx="6" fill="#fffdf7"/><text x="36" y="265" font-size="18" font-weight="400">竞争机会</text><text x="331" y="265" font-size="18" font-weight="400">显示具体刷新范围</text><text x="671" y="265" font-size="18" font-weight="400">不得推定整个世界重置</text><rect x="30" y="294" width="1380" height="61" rx="6" fill="#ebe7dc"/><text x="36" y="332" font-size="18" font-weight="400">区域性资格</text><text x="331" y="332" font-size="18" font-weight="400">按已声明生效边界</text><text x="671" y="332" font-size="18" font-weight="400">不追溯重算旧结果</text><rect x="30" y="361" width="1380" height="61" rx="6" fill="#fffdf7"/><text x="36" y="399" font-size="18" font-weight="400">世界时间线</text><text x="331" y="399" font-size="18" font-weight="400">同一世界持续</text><text x="671" y="399" font-size="18" font-weight="400">不创建第二权威世界</text><rect x="30" y="428" width="1380" height="61" rx="6" fill="#ebe7dc"/><text x="36" y="466" font-size="18" font-weight="400">玩家与 Agent</text><text x="331" y="466" font-size="18" font-weight="400">身份与核心能力保留</text><text x="671" y="466" font-size="18" font-weight="400">不删除身份</text><rect x="30" y="495" width="1380" height="61" rx="6" fill="#fffdf7"/><text x="36" y="533" font-size="18" font-weight="400">可迁移价值 / receipt</text><text x="331" y="533" font-size="18" font-weight="400">保留原来源及已确认因果</text><text x="671" y="533" font-size="18" font-weight="400">不清零全局资产</text><rect x="30" y="562" width="1380" height="61" rx="6" fill="#ebe7dc"/><text x="36" y="600" font-size="18" font-weight="400">恢复 / 申诉</text><text x="331" y="600" font-size="18" font-weight="400">明确受影响范围与原结果</text><text x="671" y="600" font-size="18" font-weight="400">不能只给重新开始按钮</text><rect x="36" y="660" width="650" height="52" rx="8" fill="#d6d7ca" stroke="#a3aa9b"/><text x="52" y="694" font-size="19" font-weight="400">刷新世界：不提供</text><text x="36" y="755" font-size="18" font-weight="400">赛季写合同未核清，当前仅产品义务读面；不虚构周期、清零公式或奖励表。</text></svg>