<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="850"><style>text{font-family:"Noto Sans CJK SC",sans-serif;fill:#203e32}</style><rect width="1440" height="850" fill="#f7f3e9"/><text x="36" y="45" font-size="18" font-weight="400">S06 / TARGET STATE FRAGMENT · 合同示例，不是当前世界事实</text><text x="36" y="94" font-size="29" font-weight="600">恢复项目：贡献接受不等于里程碑生效</text><text x="36" y="130" font-size="17" font-weight="400">所有状态值均为设计情境；本图不宣称接口当前可用，也不执行任何写动作。</text><rect x="30" y="160" width="1380" height="61" rx="6" fill="#ded2ad"/><text x="36" y="198" font-size="18" font-weight="600">对象</text><text x="331" y="198" font-size="18" font-weight="600">示意值</text><text x="671" y="198" font-size="18" font-weight="600">实际语义</text><rect x="30" y="227" width="1380" height="61" rx="6" fill="#fffdf7"/><text x="36" y="265" font-size="18" font-weight="400">项目</text><text x="331" y="265" font-size="18" font-weight="400">recovery_in_progress</text><text x="671" y="265" font-size="18" font-weight="400">同一项目和当前 policy / scope</text><rect x="30" y="294" width="1380" height="61" rx="6" fill="#ebe7dc"/><text x="36" y="332" font-size="18" font-weight="400">贡献</text><text x="331" y="332" font-size="18" font-weight="400">accepted</text><text x="671" y="332" font-size="18" font-weight="400">有限 commitment 明示，不是完成</text><rect x="30" y="361" width="1380" height="61" rx="6" fill="#fffdf7"/><text x="36" y="399" font-size="18" font-weight="400">资源义务</text><text x="331" y="399" font-size="18" font-weight="400">按原 commitment 读取</text><text x="671" y="399" font-size="18" font-weight="400">不能将未知成本显示为零</text><rect x="30" y="428" width="1380" height="61" rx="6" fill="#ebe7dc"/><text x="36" y="466" font-size="18" font-weight="400">证据判定</text><text x="331" y="466" font-size="18" font-weight="400">waiting_evidence</text><text x="671" y="466" font-size="18" font-weight="400">不能以客户端贡献次数发奖励</text><rect x="30" y="495" width="1380" height="61" rx="6" fill="#fffdf7"/><text x="36" y="533" font-size="18" font-weight="400">milestone</text><text x="331" y="533" font-size="18" font-weight="400">尚无 applied receipt</text><text x="671" y="533" font-size="18" font-weight="400">目标尚未确认修复</text><rect x="30" y="562" width="1380" height="61" rx="6" fill="#ebe7dc"/><text x="36" y="600" font-size="18" font-weight="400">退出 / 到期</text><text x="331" y="600" font-size="18" font-weight="400">仅处置未消费部分</text><text x="671" y="600" font-size="18" font-weight="400">已 sink 成本与已结效果保留</text><rect x="36" y="660" width="650" height="52" rx="8" fill="#d6d7ca" stroke="#a3aa9b"/><text x="52" y="694" font-size="19" font-weight="400">再次认领 source：不可用</text><text x="36" y="755" font-size="18" font-weight="400">查询原 contribution / source claim；已终止项目不隐式重开，结算待决不延长效果期限。</text></svg>