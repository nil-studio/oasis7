<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1260"><style>text{font-family:"Noto Sans CJK SC",sans-serif;fill:#203e32}</style><rect width="1600" height="1260" fill="#f7f3e9"/><text  x="36" y="40" font-size="18" font-weight="400">S15 / TARGET FORM FRAGMENT · 目标表单片段，不是当前已接通功能</text><text  x="36" y="92" font-size="30" font-weight="600">恢复贡献：选择来源，承诺与资格由系统给出</text><rect x="36" y="120" width="1528" height="76" rx="8" fill="#e9ddbd" stroke="none"/><text  x="54" y="151" font-size="19" font-weight="600">设计示例：选择控件只表达用户意图；身份、权限、版本、成本和效果均不由用户自由填写。</text><text  x="54" y="180" font-size="17" font-weight="400">示例值不是当前世界事实。未选 / 未知 / 权限未验证的行显示阻断；本稿不提交任何请求。</text><text  x="36" y="237" font-size="23" font-weight="600">可选择项与系统绑定项（逐字段区分）</text><text  x="1000" y="237" font-size="23" font-weight="600">角色 / 校验 / 结果</text><rect x="36" y="265" width="928" height="138" rx="8" fill="#fffdf7" stroke="none"/><text  x="52" y="293" font-size="19" font-weight="600">project · 用户选择 / revision 系统绑定</text><rect x="52" y="306" width="896" height="45" rx="8" fill="#fff" stroke="#53745c"/><text id="control-project" x="68" y="335" font-size="18" font-weight="400">恢复项目 A（设计示例）</text><text  x="915" y="335" font-size="23" font-weight="600">⌄</text><text  x="52" y="374" font-size="16" font-weight="400">从当前可读项目选取；revision、scope、policy、deadline 系统绑定，不可编辑。</text><rect x="36" y="416" width="928" height="138" rx="8" fill="#fffdf7" stroke="none"/><text  x="52" y="444" font-size="19" font-weight="600">source receipt / lot · 用户选择</text><rect x="52" y="457" width="896" height="45" rx="8" fill="#fff" stroke="#53745c"/><rect x="68" y="470" width="19" height="19" rx="3" fill="#d0b474" stroke="#53745c"/><text  x="70" y="486" font-size="17" font-weight="600">✓</text><text id="control-source" x="100" y="486" font-size="18" font-weight="400">来源 lot A（设计示例）</text><text  x="52" y="525" font-size="16" font-weight="400">只能选可验证来源；claim 索引重验不可重复认领。具体数量/单位控件待领域合同。</text><rect x="36" y="567" width="928" height="138" rx="8" fill="#fffdf7" stroke="none"/><text  x="52" y="595" font-size="19" font-weight="600">actor / 代表授权 / 参与资格</text><rect x="52" y="608" width="896" height="45" rx="8" fill="#e9ece5" stroke="#adb6a9"/><text id="control-eligibility" x="68" y="637" font-size="18" font-weight="400">系统绑定 / 不可编辑</text><text  x="818" y="637" font-size="16" font-weight="600">只读</text><text  x="52" y="676" font-size="16" font-weight="400">Participation 与 Eligibility 分开读取；加入项目不能替代资格。</text><rect x="36" y="718" width="928" height="138" rx="8" fill="#fffdf7" stroke="none"/><text  x="52" y="746" font-size="19" font-weight="600">hold / 成本 / 期限 / 退出责任</text><rect x="52" y="759" width="896" height="45" rx="8" fill="#e9ece5" stroke="#adb6a9"/><text id="control-commitment" x="68" y="788" font-size="18" font-weight="400">权威承诺预览 · 待取得</text><text  x="818" y="788" font-size="16" font-weight="600">只读</text><text  x="52" y="827" font-size="16" font-weight="400">不可自由填写 payer、hold、成本或期限。完整预览未取得不能提供贡献。</text><rect x="36" y="869" width="928" height="138" rx="8" fill="#fffdf7" stroke="none"/><text  x="52" y="897" font-size="19" font-weight="600">intent / payload / source claim refs</text><rect x="52" y="910" width="896" height="45" rx="8" fill="#e9ece5" stroke="#adb6a9"/><text id="control-intent" x="68" y="939" font-size="18" font-weight="400">系统绑定 / 不可编辑</text><text  x="818" y="939" font-size="16" font-weight="600">只读</text><text  x="52" y="978" font-size="16" font-weight="400">保留原贡献身份与内容摘要；unknown 先查原 intent，不换身份再次贡献。</text><rect x="986" y="265" width="578" height="138" rx="8" fill="#eeeade" stroke="none"/><text  x="1002" y="295" font-size="16" font-weight="600">01 / 权威检查</text><text  x="1002" y="331" font-size="19" font-weight="400">贡献者：选择项目和合法来源，表达贡献意图。</text><rect x="986" y="416" width="578" height="138" rx="8" fill="#eeeade" stroke="none"/><text  x="1002" y="446" font-size="16" font-weight="600">02 / 权威检查</text><text  x="1002" y="482" font-size="19" font-weight="400">数量 / 单位：按资源领域合同；此片不猜输入范围。</text><rect x="986" y="567" width="578" height="138" rx="8" fill="#eeeade" stroke="none"/><text  x="1002" y="597" font-size="16" font-weight="600">03 / 权威检查</text><text  x="1002" y="633" font-size="19" font-weight="400">accepted：只记录有限 commitment，不修复目标。</text><rect x="986" y="718" width="578" height="138" rx="8" fill="#eeeade" stroke="none"/><text  x="1002" y="748" font-size="16" font-weight="600">04 / 权威检查</text><text  x="1002" y="784" font-size="19" font-weight="400">evaluator：独立判定证据，不产生目标效果。</text><rect x="986" y="869" width="578" height="138" rx="8" fill="#eeeade" stroke="none"/><text  x="1002" y="899" font-size="16" font-weight="600">05 / 权威检查</text><text  x="1002" y="935" font-size="19" font-weight="400">milestone authority：独立执行并生成 receipt。</text><rect x="36" y="1044" width="928" height="55" rx="8" fill="#d6d7ca" stroke="#9ca993"/><text  x="54" y="1079" font-size="20" font-weight="600">提供贡献 · 承诺未取得</text><rect x="986" y="1044" width="578" height="55" rx="8" fill="#d6d7ca" stroke="#9ca993"/><text  x="1002" y="1079" font-size="19" font-weight="600">应用里程碑 · 独立角色不可用</text><text  x="36" y="1140" font-size="18" font-weight="400">启用规则：精确合同、当前 capability、角色、授权、scope、版本和全部前置均有效；只读动作也须当前读取权限。</text><text  x="36" y="1175" font-size="18" font-weight="400">记录 / 选择 / 预览 ≠ 审批 ≠ 执行；执行只以实际 receipt 为准，未知时核对原操作，不自动重发。</text><text  x="36" y="1220" font-size="17" font-weight="400">图中下拉、复选 affordance 为目标交互设计；未验证的候选枚举、数量单位或接口保持 contract_unknown。</text></svg>