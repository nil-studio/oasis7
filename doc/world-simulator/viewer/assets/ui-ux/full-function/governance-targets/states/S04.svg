<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="850"><style>text{font-family:"Noto Sans CJK SC",sans-serif;fill:#203e32}</style><rect width="1440" height="850" fill="#f7f3e9"/><text x="36" y="45" font-size="18" font-weight="400">S04 / TARGET STATE FRAGMENT · 合同示例，不是当前世界事实</text><text x="36" y="94" font-size="29" font-weight="600">公共 levy：授权存在，结算不明</text><text x="36" y="130" font-size="17" font-weight="400">所有状态值均为设计情境；本图不宣称接口当前可用，也不执行任何写动作。</text><rect x="30" y="160" width="1380" height="61" rx="6" fill="#ded2ad"/><text x="36" y="198" font-size="18" font-weight="600">项目</text><text x="331" y="198" font-size="18" font-weight="600">示意值</text><text x="671" y="198" font-size="18" font-weight="600">合法读法</text><rect x="30" y="227" width="1380" height="61" rx="6" fill="#fffdf7"/><text x="36" y="265" font-size="18" font-weight="400">筹资类型</text><text x="331" y="265" font-size="18" font-weight="400">public_levy</text><text x="671" y="265" font-size="18" font-weight="400">不与自愿 service_fee 合并</text><rect x="30" y="294" width="1380" height="61" rx="6" fill="#ebe7dc"/><text x="36" y="332" font-size="18" font-weight="400">专项授权</text><text x="331" y="332" font-size="18" font-weight="400">authorized</text><text x="671" y="332" font-size="18" font-weight="400">仍需当前期限、范围与预算核验</text><rect x="30" y="361" width="1380" height="61" rx="6" fill="#fffdf7"/><text x="36" y="399" font-size="18" font-weight="400">本次 assessment</text><text x="331" y="399" font-size="18" font-weight="400">已读取示例</text><text x="671" y="399" font-size="18" font-weight="400">没有 reservation 或欠费</text><rect x="30" y="428" width="1380" height="61" rx="6" fill="#ebe7dc"/><text x="36" y="466" font-size="18" font-weight="400">原结算请求</text><text x="331" y="466" font-size="18" font-weight="400">outcome_unknown</text><text x="671" y="466" font-size="18" font-weight="400">不显示未扣款或已结算</text><rect x="30" y="495" width="1380" height="61" rx="6" fill="#fffdf7"/><text x="36" y="533" font-size="18" font-weight="400">公开账目</text><text x="331" y="533" font-size="18" font-weight="400">待原 settlement 对账</text><text x="671" y="533" font-size="18" font-weight="400">保留付款与专项入账配对</text><rect x="30" y="562" width="1380" height="61" rx="6" fill="#ebe7dc"/><text x="36" y="600" font-size="18" font-weight="400">通行 / 普通服务</text><text x="331" y="600" font-size="18" font-weight="400">各自规则</text><text x="671" y="600" font-size="18" font-weight="400">levy 拒绝不生成资格或通行处罚</text><rect x="36" y="660" width="650" height="52" rx="8" fill="#d6d7ca" stroke="#a3aa9b"/><text x="52" y="694" font-size="19" font-weight="400">重复征收：不可用</text><text x="36" y="755" font-size="18" font-weight="400">按原征收依据 + 主体 + 期间查唯一义务；续期、换 request ID 不允许再征一次。</text></svg>