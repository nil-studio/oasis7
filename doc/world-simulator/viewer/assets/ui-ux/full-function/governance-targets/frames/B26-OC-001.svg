<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080"><style>text{font-family:"Noto Sans CJK SC",sans-serif}</style><rect x="0" y="0" width="1600" height="1080" rx="0" fill="#102f25" stroke="none"/><text  x="32" y="42" fill="#f8f4e9" font-size="24" font-weight="700">OASIS7</text><text  x="180" y="40" fill="#c9d5c9" font-size="16" font-weight="400">WORLD / 同一世界</text><text  x="1100" y="40" fill="#e1bf75" font-size="17" font-weight="400">TARGET DESIGN · 非当前运行界面</text><rect x="24" y="72" width="410" height="906" rx="12" fill="#173c30" stroke="#345544"/><text  x="48" y="110" fill="#f7f2e7" font-size="24" font-weight="600">World</text><text  x="48" y="140" fill="#c5d2c4" font-size="16" font-weight="400">Bevy 唯一世界渲染表面</text><text  x="48" y="168" fill="#c5d2c4" font-size="15" font-weight="400">背景为设计占位，不是实时地图</text><path d="M 48 290 Q 180 220 410 310" fill="none" stroke="#315645" stroke-width="2"/><path d="M 48 380 Q 180 310 410 400" fill="none" stroke="#315645" stroke-width="2"/><path d="M 48 470 Q 180 400 410 490" fill="none" stroke="#315645" stroke-width="2"/><path d="M 48 560 Q 180 490 410 580" fill="none" stroke="#315645" stroke-width="2"/><path d="M 48 650 Q 180 580 410 670" fill="none" stroke="#315645" stroke-width="2"/><circle cx="224" cy="480" r="54" fill="#214c3b" stroke="#bb9755" stroke-width="2"/><text  x="175" y="487" fill="#f7f2e7" font-size="18" font-weight="400">选中上下文</text><text  x="48" y="800" fill="#dbc898" font-size="16" font-weight="400">观察选择 ≠ 拥有权或执行权</text><text  x="48" y="835" fill="#c5d2c4" font-size="16" font-weight="400">返回 World 保留镜头与选择</text><text  x="48" y="870" fill="#c5d2c4" font-size="15" font-weight="400">敏感证据仅按当前 audience 披露</text><rect x="454" y="72" width="1122" height="906" rx="12" fill="#f7f3e9" stroke="none"/><text  x="484" y="108" fill="#66654f" font-size="16" font-weight="400">B26 / OC-001  ·  Targets / 条件目标</text><text  x="484" y="155" fill="#203e32" font-size="29" font-weight="600">组织解散 · 权利责任先行</text><text  x="484" y="190" fill="#203e32" font-size="17" font-weight="400">示意状态：权威事实尚未接入；空值不是零，也不是有效授权。</text><rect x="484" y="213" width="1062" height="68" rx="12" fill="#e9ddbd" stroke="none"/><text  x="504" y="240" fill="#203e32" font-size="18" font-weight="600">目标操作合同已具备 · 接入/当前事实待验证</text><text  x="504" y="265" fill="#203e32" font-size="16" font-weight="400">此图是未读到当前授权的禁用情境；条件目标 ≠ 当前已接通的操作。</text><text  x="484" y="320" fill="#203e32" font-size="21" font-weight="600">对象与授权读面</text><text  x="1070" y="320" fill="#203e32" font-size="16" font-weight="400">权威值 / 观察状态</text><rect x="484" y="340" width="1062" height="55" rx="4" fill="#fffdf7" stroke="none"/><text id="field-1" x="500" y="365" fill="#203e32" font-size="18" font-weight="400">organization / case / policy / manifest</text><text  x="1110" y="365" fill="#655b42" font-size="16" font-weight="400">未取得 · 不推断</text><text  x="1110" y="386" fill="#655b42" font-size="12" font-weight="400">来自相应 authority</text><rect x="484" y="401" width="1062" height="55" rx="4" fill="#eeeade" stroke="none"/><text id="field-2" x="500" y="426" fill="#203e32" font-size="18" font-weight="400">Inventory → Obligations → CustodyReturn</text><text  x="1110" y="426" fill="#655b42" font-size="16" font-weight="400">未取得 · 不推断</text><text  x="1110" y="447" fill="#655b42" font-size="12" font-weight="400">来自相应 authority</text><rect x="484" y="462" width="1062" height="55" rx="4" fill="#fffdf7" stroke="none"/><text id="field-3" x="500" y="487" fill="#203e32" font-size="18" font-weight="400">Claims → BusinessDisposition → Residual</text><text  x="1110" y="487" fill="#655b42" font-size="16" font-weight="400">未取得 · 不推断</text><text  x="1110" y="508" fill="#655b42" font-size="12" font-weight="400">来自相应 authority</text><rect x="484" y="523" width="1062" height="55" rx="4" fill="#eeeade" stroke="none"/><text id="field-4" x="500" y="548" fill="#203e32" font-size="18" font-weight="400">每项 owner / held-in-trust contributor</text><text  x="1110" y="548" fill="#655b42" font-size="16" font-weight="400">未取得 · 不推断</text><text  x="1110" y="569" fill="#655b42" font-size="12" font-weight="400">来自相应 authority</text><rect x="484" y="584" width="1062" height="55" rx="4" fill="#fffdf7" stroke="none"/><text id="field-5" x="500" y="609" fill="#203e32" font-size="18" font-weight="400">原义务、占用、已返还与剩余</text><text  x="1110" y="609" fill="#655b42" font-size="16" font-weight="400">未取得 · 不推断</text><text  x="1110" y="630" fill="#655b42" font-size="12" font-weight="400">来自相应 authority</text><rect x="484" y="645" width="1062" height="55" rx="4" fill="#eeeade" stroke="none"/><text id="field-6" x="500" y="670" fill="#203e32" font-size="18" font-weight="400">effect key 与子 receipt</text><text  x="1110" y="670" fill="#655b42" font-size="16" font-weight="400">未取得 · 不推断</text><text  x="1110" y="691" fill="#655b42" font-size="12" font-weight="400">来自相应 authority</text><text  x="484" y="742" fill="#203e32" font-size="20" font-weight="600">动作门禁</text><text  x="484" y="771" fill="#203e32" font-size="17" font-weight="400">首版仅 canonical estate receipt 的有限返还；未知对象拒绝</text><rect x="484" y="821" width="330" height="48" rx="8" fill="#d6d7ca" stroke="#a3aa9b"/><text id="action-unavailable" x="500" y="852" fill="#586454" font-size="18" font-weight="400">处置受支持托管返还</text><text  x="836" y="845" fill="#6d5131" font-size="17" font-weight="600">不可用</text><text  x="836" y="870" fill="#203e32" font-size="16" font-weight="400">需正式 capability + 当前授权 + 精确合同</text><text  x="484" y="917" fill="#655b42" font-size="15" font-weight="400">状态边界：AwaitingEvidence / PartiallyApplied</text><rect x="480" y="999" width="640" height="57" rx="18" fill="#254a39" stroke="#53725c"/><text  x="540" y="1035" fill="#f7f3e9" font-size="18" font-weight="600">World</text><rect x="706" y="1007" width="182" height="40" rx="10" fill="#d0b474" stroke="none"/><text  x="745" y="1035" fill="#173c30" font-size="18" font-weight="600">Targets</text><text  x="950" y="1035" fill="#f7f3e9" font-size="18" font-weight="600">Command</text><text  x="24" y="1036" fill="#c5d2c4" font-size="14" font-weight="400">静态设计 · 无运行或测试通过声明</text></svg>