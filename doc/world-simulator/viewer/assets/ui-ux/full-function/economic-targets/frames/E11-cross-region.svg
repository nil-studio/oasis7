ght="700" fill="#203d32">跨区交付与资金各自结算</text><text x="540" y="160" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#203d32">发现 → 双方承诺 → transport → acceptance → settlement</text><rect x="540" y="194" width="1004" height="42" rx="6" fill="#e7dcc1"/><text x="556" y="222" font-family="Noto Sans CJK SC" font-size="15" font-weight="400" fill="#203d32">T-ECO-06 / E11-cross-region  ·  flow  ·  权威数值缺失显示 unknown，不补 0</text><text x="552" y="266" font-family="Noto Sans CJK SC" font-size="18" font-weight="700" fill="#203d32">边界</text><text x="866" y="266" font-family="Noto Sans CJK SC" font-size="18" font-weight="700" fill="#203d32">必要证据</text><text x="1212" y="266" font-family="Noto Sans CJK SC" font-size="18" font-weight="700" fill="#203d32">不等于</text><rect x="540" y="284" width="1004" height="76" rx="4" fill="#ece7da"/><text x="552" y="312" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#203d32">需求发现</text><text x="866" y="312" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#203d32">同目标用途、数量、期限与 recipient</text><text x="1212" y="312" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#203d32">接受订单或取得独占权</text><rect x="540" y="360" width="1004" height="76" rx="4" fill="#f5f1e7"/><text x="552" y="388" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#203d32">运输 / arrival</text><text x="866" y="388" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#203d32">source、route、destination、实际损耗</text><text x="1212" y="388" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#203d32">storage acceptance / 产权结算</text><rect x="540" y="436" width="1004" height="76" rx="4" fill="#ece7da"/><text x="552" y="464" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#203d32">接收验收</text><text x="866" y="464" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#203d32">规格/数量/用途/有权 recipient</text><text x="1212" y="464" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#203d32">escrow 无条件释放</text><rect x="540" y="512" width="1004" height="76" rx="4" fill="#f5f1e7"/><text x="552" y="540" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#203d32">ownership / escrow</text><text x="866" y="540" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#203d32">匹配条件和各方 receipt</text><text x="1212" y="540" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#203d32">production receipt 自动付款</text><rect x="540" y="588" width="1004" height="76" rx="4" fill="#ece7da"/><text x="552" y="616" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#203d32">partial / dispute / unknown</text><text x="866" y="616" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#203d32">保留已交付、待验、未结金额</text><text x="1212" y="616" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#203d32">全额退款或整单完成</text><text x="552" y="694" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" fill="#203d32">R1 物流到达、仓储接纳、质量验收、产权转移、资金结算分别展示。</text><text x="552" y="729" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" fill="#203d32">R2 超时或争议先查原 identity；不重新下单，不自动发奖。</text><text x="552" y="764" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" fill="#203d32">R3 具体费用、单位、撤回/争议权限来自原合同，不在 UI 自定。</text><rect x="540" y="918" width="494" height="52" rx="7" fill="#d4b56e"/><text x="558" y="951" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" fill="#203d32">展开收据链</text><rect x="1050" y="918" width="494" height="52" rx="7" fill="#d6d6cc"/><text x="1068" y="951" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" fill="#203d32">请求结算（禁用：未核发布能力）</text><text x="552" y="996" font-family="Noto Sans CJK SC" font-size="14" font-weight="400" fill="#203d32">只读导航为设计目标；灰色操作禁用，需当前 capability + fresh authority + 明确确认。</text><rect x="32" y="1038" width="140" height="54" 