ght="700" fill="#203d32">转让、有限机会与长期证据</text><text x="540" y="160" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#203d32">经济权利 ≠ Agent 委托 / 自治权 · 局部 green 不代签整体</text><rect x="540" y="194" width="1004" height="42" rx="6" fill="#e7dcc1"/><text x="556" y="222" font-family="Noto Sans CJK SC" font-size="15" font-weight="400" fill="#203d32">T-ECO-08 / E14-transfer-audit  ·  ledger  ·  权威数值缺失显示 unknown，不补 0</text><text x="552" y="266" font-family="Noto Sans CJK SC" font-size="18" font-weight="700" fill="#203d32">对象</text><text x="866" y="266" font-family="Noto Sans CJK SC" font-size="18" font-weight="700" fill="#203d32">准入 / 证据</text><text x="1212" y="266" font-family="Noto Sans CJK SC" font-size="18" font-weight="700" fill="#203d32">结果与恢复</text><rect x="540" y="284" width="1004" height="76" rx="4" fill="#ece7da"/><text x="552" y="312" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#203d32">Agent 经济转让</text><text x="866" y="312" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#203d32">资格、容量、资源、治理、反滥用五门槛</text><text x="1212" y="312" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#203d32">保留来源、身份、历史、未决义务</text><rect x="540" y="360" width="1004" height="76" rx="4" fill="#f5f1e7"/><text x="552" y="388" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#203d32">费用 / levy</text><text x="866" y="388" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#203d32">自愿服务费与有界 levy 分开</text><text x="1212" y="388" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#203d32">用途、受益、上限、到期、复核</text><rect x="540" y="436" width="1004" height="76" rx="4" fill="#ece7da"/><text x="552" y="464" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#203d32">有限机会</text><text x="866" y="464" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#203d32">来源、scope、用途、期限与 receipt</text><text x="1212" y="464" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#203d32">preview / pending 无顺位</text><rect x="540" y="512" width="1004" height="76" rx="4" fill="#f5f1e7"/><text x="552" y="540" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#203d32">长期经济审计</text><text x="866" y="540" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#203d32">同候选 / 窗口 source/sink + 关键变化</text><text x="1212" y="540" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#203d32">含非 levy 资源、治理因果链</text><rect x="540" y="588" width="1004" height="76" rx="4" fill="#ece7da"/><text x="552" y="616" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#203d32">缺失 / 冲突 / 过期</text><text x="866" y="616" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#203d32">blocked / hold；保留原缺口</text><text x="1212" y="616" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#203d32">补证重核不是新结算或 release verdict</text><text x="552" y="694" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" fill="#203d32">R1 release 后再 claim 不是原子转让；旧绑定不确定时不能确认。</text><text x="552" y="729" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" fill="#203d32">R2 generic 机会不可转让、出租、叠加或自动续期；失效保留独立行动路径。</text><text x="552" y="764" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" fill="#203d32">R3 不提供管理预算、改权重、自动处罚、发资产或发奖的按钮。</text><rect x="540" y="918" width="494" height="52" rx="7" fill="#d4b56e"/><text x="558" y="951" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" fill="#203d32">查看责任与历史</text><rect x="1050" y="918" width="494" height="52" rx="7" fill="#d6d6cc"/><text x="1068" y="951" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" fill="#203d32">转让 / 申领（禁用：合同未闭合）</text><text x="552" y="996" font-family="Noto Sans CJK SC" font-size="14" font-weight="400" fill="#203d32">只读导航为设计目标；灰色操作禁用，需当前 capability + fresh authority + 明确确认。</text><rect x="32" y="1038" width="140" height="54" rx="8" fill="#254d3d"/><text x="54" y="1072" font-family="Noto Sans CJK SC" font-size="18" font-weight="400" fill="#f5f1e7">World</text><rect x="172" y="1038" width="140" height="54" rx="8" fill="#254d3d"/><text x="194" y="1072" font-family="Noto Sans CJK SC" font-size="18" font-weight="400" fill="#f5f1e7">Targets</text><rect x="330" y="1038" width="140" height="54" rx="8" fill="#254d3d"/><text x="352" y="1072" font-family="Noto Sans CJK SC" font-size="18" font-weight="400" fill="#f5f1e7">Command</text><text x="540" y="1072" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#e2d9be">Dock 固定 World / Targets / Command · 返回保留对象、筛选与原请求</text></svg>