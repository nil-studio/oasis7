K SC" font-size="17" font-weight="400" fill="#203d32">request / need / snapshot / requested</text><text x="866" y="490" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#203d32">maxima</text><text x="1212" y="464" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#203d32">不靠重复请求插队</text><rect x="540" y="512" width="1004" height="76" rx="4" fill="#f5f1e7"/><text x="552" y="540" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#203d32">数量追踪</text><text x="866" y="540" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#203d32">committed / transit / received /</text><text x="866" y="566" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#203d32">fulfilled</text><text x="1212" y="540" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#203d32">released / lost 单列</text><rect x="540" y="588" width="1004" height="76" rx="4" fill="#ece7da"/><text x="552" y="616" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#203d32">两维结果</text><text x="866" y="616" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#203d32">allocated / partial / denied / expired +</text><text x="866" y="642" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#203d32">stage</text><text x="1212" y="616" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#203d32">allocated 不等于已履行</text><text x="552" y="694" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" fill="#203d32">R1 采购、补偿、escrow、物流/保管费用有真实来源；零价不等于无实物。</text><text x="552" y="729" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" fill="#203d32">R2 到期保留旧在途承诺与履行；授权换代不迁移旧 request。</text><text x="552" y="764" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" fill="#203d32">R3 用途限制 / review / appeal 显示证据与入口；UI 不能授予 authority。</text><rect x="540" y="918" width="494" height="52" rx="7" fill="#d4b56e"/><text x="558" y="951"