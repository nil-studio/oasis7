ght="700" fill="#203d32">额外 Agent：制造订单与责任</text><text x="540" y="160" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#203d32">制造可暂缓；单主 Agent 路线不受影响</text><rect x="540" y="194" width="1004" height="42" rx="6" fill="#e7dcc1"/><text x="556" y="222" font-family="Noto Sans CJK SC" font-size="15" font-weight="400" fill="#203d32">T-ECO-08 / E13-agent-order  ·  flow  ·  权威数值缺失显示 unknown，不补 0</text><text x="552" y="266" font-family="Noto Sans CJK SC" font-size="18" font-weight="700" fill="#203d32">订单边界</text><text x="866" y="266" font-family="Noto Sans CJK SC" font-size="18" font-weight="700" fill="#203d32">成本 / 身份</text><text x="1212" y="266" font-family="Noto Sans CJK SC" font-size="18" font-weight="700" fill="#203d32">结果</text><rect x="540" y="284" width="1004" height="76" rx="4" fill="#ece7da"/><text x="552" y="312" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#203d32">只读 quote</text><text x="866" y="312" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#203d32">world/chain/genesis、buyer、owner</text><text x="866" y="338" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#203d32">、factory</text><text x="1212" y="312" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#203d32">quote id/digest、expires_at</text><rect x="540" y="360" width="1004" height="76" rx="4" fill="#f5f1e7"/><text x="552" y="388" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#203d32">确认 / 预留</text><text x="866" y="388" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#203d32">材料、电力、费用、slot 与工厂容量</text><text x="1212" y="388" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#203d32">接受不是生产</text><rect x="540" y="436" width="1004" height="76" rx="4" fill="#ece7da"/><text x="552" y="464" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#203d32">开工 / 完成</text><text x="866" y="464" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#203d32">consumed / held / refundable / loss</text><text x="1212" y="464" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#203d32">完成不是交付身份安装</text><rect x="540" y="512" width="1004" height="76" rx="4" fill="#f5f1e7"/><text x="552" y="540" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#203d32">交付</text><text x="866" y="540" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#203d32">原地点、upfront、未来 upkeep</text><text x="1212" y="540" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#203d32">身份、claim、控制事实原子安装</text><rect x="540" y="588" width="1004" height="76" rx="4" fill="#ece7da"/><text x="552" y="616" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#203d32">unknown / failure</text><text x="866" y="616" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#203d32">order、commit point、blocker、</text><text x="866" y="642" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#203d32">recheck tick</text><text x="1212" y="616" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#203d32">查原请求，不重复制造</text><text x="552" y="694" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" fill="#203d32">R1 制造政策冻结成本与损失；安全撤销/模板/取得限制仍按当前核验。</text><text x="552" y="729" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" fill="#203d32">R2 owner generation 或世界变化清除旧可执行判断，保留授权可读历史。</text><text x="552" y="764" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" fill="#203d32">R3 外部订单不产生免费 Agent 或普通治理 quota；不重复当前 claim 表单。</text><rect x="540" y="918" width="494" height="52" rx="7" fill="#d4b56e"/><text x="558" y="951" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" fill="#203d32">查看原订单（只读目标）</text><rect x="1050" y="918" width="494" height="52" rx="7" fill="#d6d6cc"/><text x="1068" y="951" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" 