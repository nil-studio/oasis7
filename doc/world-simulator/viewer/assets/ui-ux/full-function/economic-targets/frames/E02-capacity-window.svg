<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120"><rect x="0" y="0" width="1600" height="1120" rx="0" fill="#0d2e25"/><text x="32" y="42" font-family="Noto Sans CJK SC" font-size="24" font-weight="700" fill="#f5f1e7">OASIS7</text><text x="924" y="40" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" fill="#e2d9be">条件目标设计 · 非运行画面 · 全部值为语义占位</text><rect x="24" y="78" width="460" height="936" rx="12" fill="#153e32"/><text x="52" y="122" font-family="Noto Sans CJK SC" font-size="28" font-weight="700" fill="#f5f1e7">World</text><text x="52" y="158" font-family="Noto Sans CJK SC" font-size="19" font-weight="400" fill="#d4b56e">保留 Bevy 世界舞台</text><text x="52" y="190" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" fill="#e2d9be">不新增 JS / Canvas 替代渲染器</text><rect x="90" y="335" width="116" height="72" rx="8" fill="#254d3d"/><text x="120" y="379" font-family="Noto Sans CJK SC" font-size="18" font-weight="400" fill="#f5f1e7">来源</text><rect x="290" y="460" width="116" height="72" rx="8" fill="#254d3d"/><text x="320" y="504" font-family="Noto Sans CJK SC" font-size="18" font-weight="400" fill="#f5f1e7">工厂</text><rect x="110" y="650" width="116" height="72" rx="8" fill="#254d3d"/><text x="140" y="694" font-family="Noto Sans CJK SC" font-size="18" font-weight="400" fill="#f5f1e7">终端</text><path d="M148 407 L348 460 M348 532 L168 650" stroke="#d4b56e" stroke-width="3" fill="none" stroke-dasharray="7 7"/><text x="52" y="814" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#e2d9be">示意关系，不表示真实地理位置、路线可用或已接纳</text><text x="52" y="840" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#e2d9be">容量。</text><text x="52" y="906" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#e2d9be">对象锚点保留；离开面板不撤销已接受的工业承诺。</text><rect x="508" y="78" width="1068" height="936" rx="12" fill="#f5f1e7"/><text x="540" y="124" font-family="Noto Sans CJK SC" font-size="28" font-weight="700" fill="#203d32">容量、窗口与背压</text><text x="540" y="160" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#203d32">同一 snapshot · 只显示自身 contender，不暴露他人顺位</text><rect x="540" y="194" width="1004" height="42" rx="6" fill="#e7dcc1"/><text x="556" y="222" font-family="Noto Sans CJK SC" font-size="15" font-weight="400" fill="#203d32">T-ECO-01 / E02-capacity-window  ·  matrix  ·  权威数值缺失显示 unknown，不补 0</text><text x="552" y="266" font-family="Noto Sans CJK SC" font-size="18" font-weight="700" fill="#203d32">资源</text><text x="866" y="266" font-family="Noto Sans CJK SC" font-size="18" font-weight="700" fill="#203d32">容量 / 占用</text><text x="1212" y="266" font-family="Noto Sans CJK SC" font-size="18" font-weight="700" fill="#203d32">时界与结果</text><rect x="540" y="284" width="1004" height="76" rx="4" fill="#ece7da"/><text x="552" y="312" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#203d32">stage slot</text><text x="866" y="312" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#203d32">available / held / consumed：待权威单</text><text x="866" y="338" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#203d32">位</text><text x="1212" y="312" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#203d32">full / partial / deferred / denied</text><rect x="540" y="360" width="1004" height="76" rx="4" fill="#f5f1e7"/><text x="552" y="388" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#203d32">edge throughput</text><text x="866" y="388" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#203d32">请求 / 合法 / 已分配 / executable 分开</text><text x="1212" y="388" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#203d32">unmet / residual 不计产出</text><rect x="540" y="436" width="1004" height="76" rx="4" fill="#ece7da"/><text x="552" y="464" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#203d32">buffer</text><text x="866" y="464" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#203d32">finite limit / occupied / held / peak</text><text x="1212" y="464" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#203d32">满额：上游 hold 或拒绝</text><rect x="540" y="512" width="1004" height="76" rx="4" fill="#f5f1e7"/><text x="552" y="540" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#203d32">terminal</text><text x="866" y="540" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#203d32">owner / recipient / admission / held</text><text x="1212" y="540" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#203d32">生产及时 ≠ 终端按期</text><rect x="540" y="588" width="1004" height="76" rx="4" fill="#ece7da"/><text x="552" y="616" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#203d32">service window</text><text x="866" y="616" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#203d32">start / target / end：world tick</text><text x="1212" y="616" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#203d32">none / soft / hard；未预留不保证</text><text x="552" y="694" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" fill="#203d32">R1 主因取最早 canonical unsatisfied blocker；派生积压次级展示。</text><text x="552" y="729" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" fill="#203d32">R2 释放、到期按原 trigger 重评；刷新与重试不插队、不续租。</text><text x="552" y="764" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" fill="#203d32">R3 执行量与输出 bundle：零合法 cycle 不扣料；split 必须显式支持。</text><rect x="540" y="918" width="494" height="52" rx="7" fill="#d4b56e"/><text x="558" y="951" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" fill="#203d32">查看 reservation chain</text><rect x="1050" y="918" width="494" height="52" rx="7" fill="#d6d6cc"/><text x="1068" y="951" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" fill="#203d32">续期（权限和能力待核）</text><text x="552" y="996" font-family="Noto Sans CJK SC" font-size="14" font-weight="400" fill="#203d32">只读导航为设计目标；灰色操作禁用，需当前 capability + fresh authority + 明确确认。</text><rect x="32" y="1038" width="140" height="54" rx="8" fill="#254d3d"/><text x="54" y="1072" font-family="Noto Sans CJK SC" font-size="18" font-weight="400" fill="#f5f1e7">World</text><rect x="172" y="1038" width="140" height="54" rx="8" fill="#254d3d"/><text x="194" y="1072" font-family="Noto Sans CJK SC" font-size="18" font-weight="400" fill="#f5f1e7">Targets</text><rect x="330" y="1038" width="140" height="54" rx="8" fill="#254d3d"/><text x="352" y="1072" font-family="Noto Sans CJK SC" font-size="18" font-weight="400" fill="#f5f1e7">Command</text><text x="540" y="1072" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#e2d9be">Dock 固定 World / Targets / Command · 返回保留对象、筛选与原请求</text></svg>