<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img" aria-labelledby="title desc"><title id="title">区块材料更新 · 具体表单设计</title><desc id="desc">源码约束的设计提议。所有世界和报价值为虚构示例。非运行截图、非实际验收。</desc>
<rect width="1600" height="1200" fill="#0b100f"/>
<g font-family="Noto Sans CJK SC, Noto Sans, sans-serif">
<text x="48" y="42" font-size="16" fill="#b4beb1" font-weight="400">OASIS7 / COMMAND / QUOTE</text>
<text x="1190" y="42" font-size="17" fill="#d0a85b" font-weight="400">设计提议 · 非运行截图</text>
<text x="48" y="94" font-size="34" fill="#edf1e6" font-weight="600">区块材料更新</text>
<text x="48" y="133" font-size="20" fill="#b4beb1" font-weight="400">区分补充已禁用、数量未知、到期与未来机会</text>
