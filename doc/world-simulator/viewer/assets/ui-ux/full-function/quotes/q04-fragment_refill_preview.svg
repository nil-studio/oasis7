<text x="730" y="749.0" font-size="18" fill="#edf1e6" font-weight="400">Fe: 200 g</text>
<text x="716" y="946" font-size="17" fill="#b4beb1" font-weight="400">本面板只提供查询。正式结果引用原 Action Receipt。</text>
<rect  x="48" y="1024" width="1504" height="76" rx="8" fill="#101713" stroke="#405346"/>
<text x="72" y="1054" font-size="17" fill="#d0a85b" font-weight="600">版本 / 时效</text>
<text x="228" y="1054" font-size="17" fill="#b4beb1" font-weight="400">没有通用报价版本号或统一 TTL；不虚构“有效至”。具体失效规则按各 family。</text>
<text x="72" y="1082" font-size="16" fill="#b4beb1" font-weight="400">表单排版与信息分组为提议；业务字段、查询按钮与禁用边界来自固定源码。</text>
<rect  x="580" y="1124" width="440" height="52" rx="8" fill="#101713" stroke="#405346"/>
