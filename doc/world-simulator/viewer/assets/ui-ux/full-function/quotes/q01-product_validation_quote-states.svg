<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2180" viewBox="0 0 1600 2180" role="img" aria-labelledby="title desc"><title id="title">产品验证 · 状态片段</title><desc id="desc">源码约束的设计提议。所有世界和报价值为虚构示例。非运行截图、非实际验收。</desc>
<rect width="1600" height="2180" fill="#0b100f"/>
<g font-family="Noto Sans CJK SC, Noto Sans, sans-serif">
<text x="40" y="46" font-size="30" fill="#edf1e6" font-weight="600">产品验证 / 状态与合法操作</text>
<text x="40" y="83" font-size="18" fill="#b4beb1" font-weight="400">每格是局部状态片段，不是完整页面；保留全部参数控件。虚构数据。</text>
<rect id="state-empty" x="40" y="116" width="740" height="648" rx="8" fill="#161f1a" stroke="#405346"/>
<text x="60" y="150" font-size="23" fill="#edf1e6" font-weight="600">尚未查询</text>
<text x="60" y="179" font-size="15" fill="#d0a85b" font-weight="400">当前行为的视觉重排</text>
<text x="60" y="216" font-size="16" fill="#b4beb1" font-weight="400">产品 ID</text>
<rect id="fragment-60-216-field-0" x="60" y="228" width="330" height="44" rx="8" fill="#101713" stroke="#738575"/>
<text x="72" y="257" font-size="16" fill="#edf1e6" font-weight="400">logistics_drone</text>
<text x="412" y="216" font-size="16" fill="#b4beb1" font-weight="400">数量</text>
<rect id="fragment-412-216-field-1" x="412" y="228" width="330" height="44" rx="8" fill="#101713" stroke="#738575"/>
<text x="424" y="257" font-size="16" fill="#edf1e6" font-weight="400">1</text>
<rect id="action-empty" x="60" y="296" width="700" height="48" rx="8" fill="#26382d" stroke="#d0a85b"/>
<text x="76" y="327" font-size="17" fill="#edf1e6" font-weight="600">请求预估</text>
<text x="60" y="372.0" font-size="17" fill="#edbf72" font-weight="400">无报价结果。填写参数后请求只读预估；空结果不是零成本。</text>
<rect id="state-pending" x="820" y="116" width="740" height="648" rx="8" fill="#161f1a" stroke="#405346"/>
<text x="840" y="150" font-size="23" fill="#edf1e6" font-weight="600">请求中</text>
<text x="840" y="179" font-size="15" fill="#d0a85b" font-weight="400">当前行为的视觉重排</text>
<text x="840" y="216" font-size="16" fill="#b4beb1" font-weight="400">产品 ID</text>
<rect id="fragment-840-216-field-0" x="840" y="228" width="330" height="44" rx="8" fill="#101713" stroke="#738575"/>
<text x="852" y="257" font-size="16" fill="#edf1e6" font-weight="400">logistics_drone</text>
<text x="1192" y="216" font-size="16" fill="#b4beb1" font-weight="400">数量</text>
<rect id="fragment-1192-216-field-1" x="1192" y="228" width="330" height="44" rx="8" fill="#101713" stroke="#738575"/>
<text x="1204" y="257" font-size="16" fill="#edf1e6" font-weight="400">1</text>
<rect id="action-pending" x="840" y="296" width="700" height="48" rx="8" fill="#26382d" stroke="#d0a85b"/>
<text x="856" y="327" font-size="17" fill="#edf1e6" font-weight="600">请求预估（请求已发送）</text>
<text x="840" y="372.0" font-size="17" fill="#edbf72" font-weight="400">现行按钮只在本地 await 时禁用；发出后可能可再点。远端 pending 不单独禁用。</text>
<rect id="state-error" x="40" y="796" width="740" height="648" rx="8" fill="#161f1a" stroke="#405346"/>
<text x="60" y="830" font-size="23" fill="#edf1e6" font-weight="600">获取失败</text>
<text x="60" y="859" font-size="15" fill="#d0a85b" font-weight="400">当前行为的视觉重排</text>
<text x="60" y="896" font-size="16" fill="#b4beb1" font-weight="400">产品 ID</text>
