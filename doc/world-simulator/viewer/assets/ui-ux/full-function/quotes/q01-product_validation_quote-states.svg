<text x="60" y="1052.0" font-size="17" fill="#f0aaa1" font-weight="400">无法获取预估。检查连接、玩家会话与输入后重试；未执行玩法动作。</text>
<rect id="state-blocked" x="820" y="796" width="740" height="648" rx="8" fill="#161f1a" stroke="#405346"/>
<text x="840" y="830" font-size="23" fill="#edf1e6" font-weight="600">阶段前提未满足</text>
<text x="840" y="859" font-size="15" fill="#d0a85b" font-weight="400">当前行为的视觉重排</text>
<text x="840" y="896" font-size="16" fill="#b4beb1" font-weight="400">产品 ID</text>
<rect id="fragment-840-896-field-0" x="840" y="908" width="330" height="44" rx="8" fill="#101713" stroke="#738575"/>
<text x="852" y="937" font-size="16" fill="#edf1e6" font-weight="400">logistics_drone</text>
<text x="1192" y="896" font-size="16" fill="#b4beb1" font-weight="400">数量</text>
