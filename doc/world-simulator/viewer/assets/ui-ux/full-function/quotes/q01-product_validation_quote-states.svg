<text x="1204" y="937" font-size="16" fill="#edf1e6" font-weight="400">1</text>
<rect id="action-blocked" x="840" y="976" width="700" height="48" rx="8" fill="#26382d" stroke="#d0a85b"/>
<text x="856" y="1007" font-size="17" fill="#edf1e6" font-weight="600">请求预估</text>
<text x="840" y="1052.0" font-size="17" fill="#edbf72" font-weight="400">已知预估 / 发现阻塞</text>
<rect  x="840" y="1341" width="700" height="72" rx="8" fill="#101713" stroke="#405346"/>
<text x="854" y="1368" font-size="16" fill="#b4beb1" font-weight="400">预估状态：已知阻塞</text>
<text x="854" y="1397" font-size="17" fill="#edf1e6" font-weight="400">查询仍可用；阻塞不变成执行按钮。</text>
<rect id="state-stale" x="40" y="1476" width="740" height="648" rx="8" fill="#161f1a" stroke="#405346"/>
<text x="60" y="1510" font-size="23" fill="#edf1e6" font-weight="600">失效说明（提议）</text>
<text x="60" y="1539" font-size="15" fill="#d0a85b" font-weight="400">设计提议 / 现行没有专用状态控件</text>
<text x="60" y="1576" font-size="16" fill="#b4beb1" font-weight="400">产品 ID</text>
<rect id="fragment-60-1576-field-0" x="60" y="1588" width="330" height="44" rx="8" fill="#101713" stroke="#738575"/>
<text x="72" y="1617" font-size="16" fill="#edf1e6" font-weight="400">logistics_drone</text>
<text x="412" y="1576" font-size="16" fill="#b4beb1" font-weight="400">数量</text>
<rect id="fragment-412-1576-field-1" x="412" y="1588" width="330" height="44" rx="8" fill="#101713" stroke="#738575"/>
<text x="424" y="1617" font-size="16" fill="#edf1e6" font-weight="400">1</text>
<rect id="action-stale" x="60" y="1656" width="700" height="48" rx="8" fill="#26382d" stroke="#d0a85b"/>
<text x="76" y="1687" font-size="17" fill="#edf1e6" font-weight="600">请求预估</text>
<text x="60" y="1732.0" font-size="17" fill="#edbf72" font-weight="400">现行没有本地编辑失效提示。提议补充原因；不可把旧结果当同方案授权。</text>
<rect id="state-unknown" x="820" y="1476" width="740" height="648" rx="8" fill="#161f1a" stroke="#405346"/>
<text x="840" y="1510" font-size="23" fill="#edf1e6" font-weight="600">字段 / 契约未知</text>
<text x="840" y="1539" font-size="15" fill="#d0a85b" font-weight="400">设计提议 / 现行没有专用状态控件</text>
<text x="840" y="1576" font-size="16" fill="#b4beb1" font-weight="400">产品 ID</text>
<rect id="fragment-840-1576-field-0" x="840" y="1588" width="330" height="44" rx="8" fill="#101713" stroke="#738575"/>
<text x="852" y="1617" font-size="16" fill="#edf1e6" font-weight="400">logistics_drone</text>
<text x="1192" y="1576" font-size="16" fill="#b4beb1" font-weight="400">数量</text>
<rect id="fragment-1192-1576-field-1" x="1192" y="1588" width="330" height="44" rx="8" fill="#101713" stroke="#738575"/>
<text x="1204" y="1617" font-size="16" fill="#edf1e6" font-weight="400">1</text>
<rect id="action-unknown" x="840" y="1656" width="700" height="48" rx="8" fill="#26382d" stroke="#d0a85b"/>
<text x="856" y="1687" font-size="17" fill="#edf1e6" font-weight="600">请求预估</text>
<text x="840" y="1732.0" font-size="17" fill="#edbf72" font-weight="400">不可用 / 未确认，不把缺失值解释为 0。现行缺少统一 unknown 状态；这是目标表</text>
<text x="840" y="1758.35" font-size="17" fill="#edbf72" font-weight="400">达。</text>
<text x="40" y="2170" font-size="16" fill="#b4beb1" font-weight="400">状态片段只覆盖此处列明的分支；当前不存在的专用 unknown / stale 展示已标为提议。</text>
</g></svg>