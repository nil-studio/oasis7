<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img" aria-labelledby="title desc"><title id="title">化合物精炼 · 具体表单设计</title><desc id="desc">源码约束的设计提议。所有世界和报价值为虚构示例。非运行截图、非实际验收。</desc>
