<title id="title">原生首局：匹配结算与后继候选</title>
<desc id="desc">1440×900 设计目标，非运行截图。匹配的示例 Agent A / job 17 / tick 102 显示实际投入 iron_ore 12、carbon_fuel 3、产出 iron_ingot 9、配方用电 24。当前摘要不含 byproducts，实际副产物未发布；不得把方案预计 slag 3 代入实际结果。production_only 与 Assembler 候选分开；9/10 仅比较本笔产出和规则需求，不是当前库存。仅画此状态，未知与回访在统一可操作原型中分别走查。</desc>
