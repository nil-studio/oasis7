<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844"><title>替代短期目标</title><rect x="0" y="0" width="390" height="844" rx="0" fill="#0d2e25" stroke="none"/><text x="20" y="34" font-family="Noto Sans CJK SC" font-size="19" font-weight="700" fill="#f5f1e7">OASIS7</text><text x="215" y="32" font-family="Noto Sans CJK SC" font-size="12" font-weight="400" fill="#e2d9be">设计目标 · 示例数据</text><rect x="16" y="65" width="358" height="650" rx="18" fill="#f5f1e7" stroke="none"/><text x="36" y="103" font-family="Noto Sans CJK SC" font-size="22" font-weight="700" fill="#203d32">替代短期目标</text><text x="36" y="138" font-family="Noto Sans CJK SC" font-size="13" font-weight="400" fill="#65501e">输入中 · 键盘安全区</text><rect x="32" y="165" width="326" height="108" rx="10" fill="#fffdf6" stroke="#d4d8c8"/><rect x="40" y="203" width="310" height="62" rx="6" fill="#ffffff" stroke="#486b54"/><path d="M 311 232 v 22" stroke="#203d32" stroke-width="2"/><text x="48" y="194" font-family="Noto Sans CJK SC" font-size="17" font-weight="700" fill="#203d32">替代短期目标 *</text><text x="48" y="222" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" fill="#203d32">先恢复本地供电，</text><text x="48" y="247" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" fill="#203d32">再评估当前产线的材料缺口。</text><rect x="32" y="285" width="326" height="108" rx="10" fill="#fffdf6" stroke="#d4d8c8"/><text x="48" y="314" font-family="Noto Sans CJK SC" font-size="17" font-weight="700" fill="#203d32">不会保证下一步必定执行</text><text x="48" y="342" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" fill="#203d32">空输入时“应用新目标”禁用。</text><text x="48" y="367" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" fill="#203d32">IME 组合输入未完成时不提交。</text><rect x="36.0" y="493" width="153.0" height="48" rx="8" fill="#edf0e6" stroke="#8b977f"/><text x="48.0" y="523" font-family="Noto Sans CJK SC" font-size="14" font-weight="700" fill="#344738">取消</text><rect x="201.0" y="493" width="153.0"