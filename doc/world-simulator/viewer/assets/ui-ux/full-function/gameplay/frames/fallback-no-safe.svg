<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000"><title>没有安全恢复选项</title><rect x="0" y="0" width="1440" height="1000" rx="0" fill="#0d2e25" stroke="none"/><text x="20" y="34" font-family="Noto Sans CJK SC" font-size="19" font-weight="700" fill="#f5f1e7">OASIS7</text><text x="1265" y="32" font-family="Noto Sans CJK SC" font-size="12" font-weight="400" fill="#e2d9be">设计目标 · 示例数据</text><rect x="24" y="64" width="420" height="822" rx="12" fill="#153e32" stroke="none"/><text x="48" y="104" font-family="Noto Sans CJK SC" font-size="24" font-weight="400" fill="#f5f1e7">World</text><text x="48" y="142" font-family="Noto Sans CJK SC" font-size="19" font-weight="400" fill="#d4b56e">Bevy 世界舞台保留区</text><text x="48" y="172" font-family="Noto Sans CJK SC" font-size="15" font-weight="400" fill="#e2d9be">仅示意构图；不是新渲染器</text><path d="M 48 250 L 405 180" stroke="#285447" fill="none"/><path d="M 48 315 L 405 245" stroke="#285447" fill="none"/><path d="M 48 380 L 405 310" stroke="#285447" fill="none"/><path d="M 48 445 L 405 375" stroke="#285447" fill="none"/><path d="M 48 510 L 405 440" stroke="#285447" fill="none"/><path d="M 48 575 L 405 505" stroke="#285447" fill="none"/><path d="M 48 640 L 405 570" stroke="#285447" fill="none"/><rect x="72" y="354" width="150" height="96" rx="10" fill="#315b49" stroke="none"/><text x="91" y="390" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" fill="#f5f1e7">观察焦点</text><text x="91" y="420" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" fill="#f5f1e7">≠ 原操作归属</text><rect x="48" y="698" width="372" height="152" rx="12" fill="#0d2e25" stroke="none"/><text x="68" y="730" font-family="Noto Sans CJK SC" font-size="20" font-weight="400" fill="#d4b56e">Next Move</text><text x="68" y="768" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" fill="#f5f1e7">目标 → 阻塞 → 下一步 → 原结果</text><text x="68" y="800" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" fill="#f5f1e7">未知不补零；失败不静默重放</text><rect x="468" y="65" width="948" height="821" rx="18" fill="#f5f1e7" stroke="none"/><text x="488" y="103" font-family="Noto Sans CJK SC" font-size="28" font-weight="700" fill="#203d32">没有安全恢复选项</text><text x="488" y="138" font-family="Noto Sans CJK SC" font-size="13" font-weight="400" fill="#65501e">需要新的决定</text><rect x="484" y="165" width="916" height="158" rx="10" fill="#fffdf6" stroke="#d4d8c8"/><text x="500" y="194" font-family="Noto Sans CJK SC" font-size="17" font-weight="700" fill="#203d32">无安全方案交接</text><text x="500" y="222" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" fill="#203d32">Reason：已发布阻塞原因</text><text x="500" y="247" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" fill="#203d32">Required next decision：已发布 action ID 的可读名称</text><text x="500" y="272" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" fill="#203d32">若无 action ID，则读取 decision class</text><text x="500" y="297" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" fill="#203d32">两者缺失时不合成决定。</text><rect x="484" y="335" width="916" height="133" rx="10" fill="#fffdf6" stroke="#d4d8c8"/><text x="500" y="364" font-family="Noto Sans CJK SC" font-size="17" font-weight="700" fill="#203d32">停在真实边界</text><text x="500" y="392" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" fill="#203d32">既无选项又无 handoff 时组件不显示。</text><text x="500" y="417" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" fill="#203d32">已有不可用选项仍保留比较信息。</text><text x="500" y="442" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" fill="#203d32">不自动等待、自动重试或伪造执行入口。</text><rect x="470" y="916" width="600" height="60" rx="12" fill="#183e32" stroke="#718c72"/><rect x="476.0" y="922" width="188.0" height="48" rx="8" fill="#183e32" stroke="none"/><text x="488.0" y="953" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" fill="#f5f1e7">World</text><rect x="676.0" y="922" width="188.0" height="48" rx="8" fill="#183e32" stroke="none"/><text x="688.0" y="953" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" fill="#f5f1e7">Targets</text><rect x="876.0" y="922" width="188.0" height="48" rx="8" fill="#315a46" stroke="none"/><text x="888.0" y="953" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" fill="#f5f1e7">Command</text><text x="1100" y="970" font-family="Noto Sans CJK SC" font-size="11" font-weight="400" fill="#e2d9be">安全区 · 正式动作以当前快照为准</text></svg>