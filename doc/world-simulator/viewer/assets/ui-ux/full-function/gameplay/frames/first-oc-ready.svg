<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844"><title>开始你的第一段工业旅程</title><rect x="0" y="0" width="390" height="844" rx="0" fill="#0d2e25" stroke="none"/><text x="20" y="34" font-family="Noto Sans CJK SC" font-size="19" font-weight="700" fill="#f5f1e7">OASIS7</text><text x="215" y="32" font-family="Noto Sans CJK SC" font-size="12" font-weight="400" fill="#e2d9be">设计目标 · 示例数据</text><rect x="16" y="65" width="358" height="650" rx="18" fill="#f5f1e7" stroke="none"/><text x="36" y="103" font-family="Noto Sans CJK SC" font-size="22" font-weight="700" fill="#203d32">开始你的第一段工业旅程</text><text x="36" y="138" font-family="Noto Sans CJK SC" font-size="13" font-weight="400" fill="#65501e">启动资格已满足</text><rect x="32" y="165" width="326" height="133" rx="10" fill="#fffdf6" stroke="#d4d8c8"/><text x="48" y="194" font-family="Noto Sans CJK SC" font-size="17" font-weight="700" fill="#203d32">已入账</text><text x="48" y="222" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" fill="#203d32">第一笔 OC 已在当前 Agent 快照可见。</text><text x="48" y="247" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" fill="#203d32">可以进入第一次 Agent 聊天与早期操作</text><text x="48" y="272" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" fill="#203d32">。</text><rect x="32" y="310" width="326" height="133" rx="10" fill="#fffdf6" stroke="#d4d8c8"/><text x="48" y="339" font-family="Noto Sans CJK SC" font-size="17" font-weight="700" fill="#203d32">下一步</text><text x="48" y="367" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" fill="#203d32">告诉 Agent 当前目标；观察 blocker。</text><text x="48" y="392" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" fill="#203d32">接受意图不等于世界效果完成。</text><text x="48" y="417" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" fill="#203d32">按钮只有正式动作发布后出现。</text><rect x="36.0" y="652" width="318.0" height="48" rx="8" fill="#dcc080" stroke="#8b977f"/><text x="48.0" y="682" font-family="Noto Sans CJK SC" font-size="14" font-weight="700" fill="#344738">开始首次聊天</text><rect x="16" y="754" width="358" height="60" rx="12" fill="#183e32" stroke="#718c72"/><rect x="22.0" y="760" width="107.33333333333333" height="48" rx="8" fill="#183e32" stroke="none"/><text x="34.0" y="791" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" fill="#f5f1e7">World</text><rect x="141.33333333333331" y="760" width="107.33333333333333" height="48" rx="8" fill="#183e32" stroke="none"/><text x="153.33333333333331" y="791" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" fill="#f5f1e7">Targets</text><rect x="260.66666666666663" y="760" width="107.33333333333333" height="48" rx="8" fill="#315a46" stroke="none"/><text x="272.66666666666663" y="791" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" fill="#f5f1e7">Command</text><text x="20" y="834" font-family="Noto Sans CJK SC" font-size="11" font-weight="400" fill="#e2d9be">安全区 · 正式动作以当前快照为准</text></svg>