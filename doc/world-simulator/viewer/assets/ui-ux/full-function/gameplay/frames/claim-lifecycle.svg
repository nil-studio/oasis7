<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000"><title>维护与释放</title><rect x="0" y="0" width="1440" height="1000" rx="0" fill="#0d2e25" stroke="none"/><text x="20" y="34" font-family="Noto Sans CJK SC" font-size="19" font-weight="700" fill="#f5f1e7">OASIS7</text><text x="1265" y="32" font-family="Noto Sans CJK SC" font-size="12" font-weight="400" fill="#e2d9be">设计目标 · 示例数据</text><rect x="24" y="64" width="420" height="822" rx="12" fill="#153e32" stroke="none"/><text x="48" y="104" font-family="Noto Sans CJK SC" font-size="24" font-weight="400" fill="#f5f1e7">World</text><text x="48" y="142" font-family="Noto Sans CJK SC" font-size="19" font-weight="400" fill="#d4b56e">Bevy 世界舞台保留区</text><text x="48" y="172" font-family="Noto Sans CJK SC" font-size="15" font-weight="400" fill="#e2d9be">仅示意构图；不是新渲染器</text><path d="M 48 250 L 405 180" stroke="#285447" fill="none"/><path d="M 48 315 L 405 245" stroke="#285447" fill="none"/><path d="M 48 380 L 405 310" stroke="#285447" fill="none"/><path d="M 48 445 L 405 375" stroke="#285447" fill="none"/><path d="M 48 510 L 405 440" stroke="#285447" fill="none"/><path d="M 48 575 L 405 505" stroke="#285447" fill="none"/><path d="M 48 640 L 405 570" stroke="#285447" fill="none"/><rect x="72" y="354" width="150" height="96" rx="10" fill="#315b49" stroke="none"/><text x="91" y="390" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" fill="#f5f1e7">观察焦点</text><text x="91" y="420" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" fill="#f5f1e7">≠ 原操作归属</text><rect x="48" y="698" width="372" height="152" rx="12" fill="#0d2e25" stroke="none"/><text x="68" y="730" font-family="Noto Sans CJK SC" font-size="20" font-weight="400" fill="#d4b56e">Next Move</text><text x="68" y="768" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" fill="#f5f1e7">目标 → 阻塞 → 下一步 → 原结果</text><text x="68" y="800" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" fill="#f5f1e7">未知不补零；失败不静默重放</text><rect x="468" y="65" width="948" height="821" rx="18" fill="#f5f1e7" stroke="none"/><text x="488" y="103" font-family="Noto Sans CJK SC" font-size="28" font-weight="700" fill="#203d32">维护与释放</text><text x="488" y="138" font-family="Noto Sans CJK SC" font-size="13" font-weight="400" fill="#65501e">只读生命周期</text><rect x="484" y="165" width="916" height="158" rx="10" fill="#fffdf6" stroke="#d4d8c8"/><text x="500" y="194" font-family="Noto Sans CJK SC" font-size="17" font-weight="700" fill="#203d32">费用构成 · OC</text><text x="500" y="222" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" fill="#203d32">Upfront 12 = Activation 4 + Bond 8</text><text x="500" y="247" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" fill="#203d32">Eligible 20 · Liquid 8 · Restricted 12</text><text x="500" y="272" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" fill="#203d32">Auto starter 0</text><text x="500" y="297" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" fill="#203d32">Bond locked：restricted 8 / liquid 0</text><rect x="484" y="335" width="916" height="183" rx="10" fill="#fffdf6" stroke="#d4d8c8"/><text x="500" y="364" font-family="Noto Sans CJK SC" font-size="17" font-weight="700" fill="#203d32">时间与风险</text><text x="500" y="392" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" fill="#203d32">Upkeep 2 OC / epoch · Paid through 20</text><text x="500" y="417" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" fill="#203d32">Release ready in 2 epochs</text><text x="500" y="442" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" fill="#203d32">Grace 3 · Idle warning 5 epochs</text><text x="500" y="467" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" fill="#203d32">Forced reclaim 10 epochs · Penalty 500 bps</text><text x="500" y="492" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" fill="#203d32">Reclaim terms：以已发布条款为准</text><rect x="484" y="530" width="916" height="108" rx="10" fill="#fffdf6" stroke="#d4d8c8"/><text x="500" y="559" font-family="Noto Sans CJK SC" font-size="17" font-weight="700" fill="#203d32">释放动作未发布</text><text x="500" y="587" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" fill="#203d32">当前仅状态指导，不显示释放按钮。</text><text x="500" y="612" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" fill="#203d32">已发布但阻塞时，应从正式动作列表查看原因。</text><rect x="470" y="916" width="600" height="60" rx="12" fill="#183e32" stroke="#718c72"/><rect x="476.0" y="922" width="188.0" height="48" rx="8" fill="#183e32" stroke="none"/><text x="488.0" y="953" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" fill="#f5f1e7">World</text><rect x="676.0" y="922" width="188.0" height="48" rx="8" fill="#183e32" stroke="none"/><text x="688.0" y="953" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" fill="#f5f1e7">Targets</text><rect x="876.0" y="922" width="188.0" height="48" rx="8" fill="#315a46" stroke="none"/><text x="888.0" y="953" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" fill="#f5f1e7">Command</text><text x="1100" y="970" font-family="Noto Sans CJK SC" font-size="11" font-weight="400" fill="#e2d9be">安全区 · 正式动作以当前快照为准</text></svg>