1e7">未知不补零；失败不静默重放</text><rect x="468" y="65" width="948" height="821" rx="18" fill="#f5f1e7" stroke="none"/><text x="488" y="103" font-family="Noto Sans CJK SC" font-size="28" font-weight="700" fill="#203d32">配方替代预览</text><text x="488" y="138" font-family="Noto Sans CJK SC" font-size="13" font-weight="400" fill="#65501e">只读 · 不扣料不加进度</text><rect x="484" y="165" width="916" height="183" rx="10" fill="#fffdf6" stroke="#d4d8c8"/><text x="500" y="194" font-family="Noto Sans CJK SC" font-size="17" font-weight="700" fill="#203d32">同料换来源 / 显式异料替代</text><text x="500" y="222" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" fill="#203d32">Slot input-1 · Legal candidates available</text><text x="500" y="247" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" fill="#203d32">来源 source-A → target-B</text><text x="500" y="272" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" fill="#203d32">投入 3 source units / 产出 2 target units</text><text x="500" y="297" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" fill="#203d32">比例 3 / 2 · Round up</text><text x="500" y="322" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" fill="#203d32">Loss 0 · Residual 0 / 1</text><rect x="484" y="360" width="916" height="183" rx="10" fill="#fffdf6" stroke="#d4d8c8"/><text x="500" y="389" font-family="Noto Sans CJK SC" font-size="17" font-weight="700" fill="#203d32">成本与风险</text><text x="500" y="417" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" fill="#203d32">Conversion power：未发布</text><text x="500" y="442" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" fill="#203d32">Terminal / logistics / buffer：未发布</text><text x="500" y="467" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" fill="#203d32">Held / consumed / expected valuation：未发布</text><text x="500" y="492" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" fill="#203d32">风险：以已发布条款为准</text><text x="500" y="517" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" fill="#203d32">因果保持：决定本身不增加 work</text><rect x="484" y="555" width="916" height="108" rx="10" fill="#fffdf6" stroke="#d4d8c8"/><text x="500" y="584" font-family="Noto Sans CJK SC" font-size="17" font-weight="700" fill="#203d32">下一步</text><text x="500" y="612" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" fill="#203d32">明确确认所选候选：仅发布的说明文本。</text><text x="500" y="637" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" fill="#203d32">此只读面没有确认或转换按钮。</text><rect x="470" y="916" width="600" height="60" rx="12" fill="#183e32" stroke="#718c72"/><rect x="476.0" y="922" width="188.0" height="48" rx="8" fill="#183e32" stroke="none"/><text x="488.0" y="953" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" fill="#f5f1e7">World</text><rect x="676.0" y="922" width="188.0" height="48" rx="8" fill="#183e32" stroke="none"/><text x="688.0" y="953" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" fill="#f5f1e7">Targets</text><rect x="876.0" y="922" width="188.0" height="48" rx="8" fill="#315a46" stroke="none"/><text x="888.0" y="953" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" fill="#f5f1e7">Command</text><text x="1100" y="970" font-family="Noto Sans CJK SC" font-size="11" font-weight="400" fill="#e2d9be">安全区 · 正式动作以当前快照为准</text></svg>