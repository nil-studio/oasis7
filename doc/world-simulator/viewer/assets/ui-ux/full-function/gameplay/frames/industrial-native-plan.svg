<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
<title id="title">原生首局：完整三批生产方案</title>
<desc id="desc">1440×900 设计目标，非运行截图。已有合法 Smelter 的固定 recipe.smelter.iron_ingot 三批可行报价：消费工厂输入账本 iron_ore 12 与 carbon_fuel 3，预计产出 iron_ingot 9 与副产物 slag 3，配方用电 24，未规定物理单位。此设计 quote 的 duration_ticks 为 1；catalog 基准 1 tick 不等于任何实际报价或墙钟 ETA。报价只读，只有确认生产是提交入口。仅画此状态，缺料和明确拒绝在统一原型中分别走查。</desc>
