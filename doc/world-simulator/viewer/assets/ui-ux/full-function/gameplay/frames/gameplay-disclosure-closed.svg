<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" role="img"><title>玩法明细收起：世界主舞台与按需入口；静态设计，不是运行截图</title><rect x="0" y="0" width="1440" height="1000" fill="#0d2e24" stroke="none" rx="0" /><text x="20" y="34" font-family="Noto Sans CJK SC" font-size="19" fill="#f5f1e7" font-weight="700">OASIS7</text><text x="1130" y="32" font-family="Noto Sans CJK SC" font-size="16" fill="#f5f1e7" font-weight="400">设计目标 · 非运行截图</text><rect x="24" y="64" width="1392" height="822" fill="#173d31" stroke="none" rx="12" /><text x="48" y="104" font-family="Noto Sans CJK SC" font-size="24" fill="#f5f1e7" font-weight="400">World · 世界主舞台</text><text x="48" y="142" font-family="Noto Sans CJK SC" font-size="18" fill="#e2d9be" font-weight="400">仅示意构图；不是新渲染器，不补造位置或关系</text><rect x="300" y="330" width="260" height="100" fill="#315a47" stroke="none" rx="12" /><text x="320" y="370" font-family="Noto Sans CJK SC" font-size="20" fill="#f5f1e7" font-weight="400">观察焦点</text><text x="320" y="406" font-family="Noto Sans CJK SC" font-size="18" fill="#f5f1e7" font-weight="400">≠ 原操作归属</text><rect x="900" y="182" width="488" height="390" fill="#f5f1e7" stroke="none" rx="12" /><text x="924" y="220" font-family="Noto Sans CJK SC" font-size="24" fill="#203d32" font-weight="700">世界优先，按需看明细</text><text x="924" y="252" font-family="Noto Sans CJK SC" font-size="16" fill="#65501e" font-weight="400">当前 native details · closed</text><rect x="920" y="276" width="448" height="48" fill="#edf0e6" stroke="#486b54" rx="4" /><text x="936" y="307" font-family="Noto Sans CJK SC" font-size="18" fill="#203d32" font-weight="700">▸ 玩法明细</text><text x="924" y="357" font-family="Noto Sans CJK SC" font-size="16" fill="#203d32" font-weight="400">当前收起：不展示内部状态机/经济卡。</text><text x="924" y="390" font-family="Noto Sans CJK SC" font-size="16" fill="#203d32" font-weight="400">展开后查看完整状态机与经济明细。</text><text x="924" y="423" font-family="Noto Sans CJK SC" font-size="16" fill="#203d32" font-weight="400">展开动作不提交玩法，也不更换 Agent。</text><text x="924" y="470" font-family="Noto Sans CJK SC" font-size="16" fill="#203d32" font-weight="700">摘要之外的世界上下文</text><text x="924" y="503" font-family="Noto Sans CJK SC" font-size="16" fill="#203d32" font-weight="400">目标、下一步、原回执继续在舞台上阅读。</text><text x="924" y="536" font-family="Noto Sans CJK SC" font-size="16" fill="#203d32" font-weight="400">本图仅示意布局；真实结果以授权数据为准。</text><rect x="48" y="698" width="650" height="152" fill="#0d2e24" stroke="none" rx="12" /><text x="68" y="730" font-family="Noto Sans CJK SC" font-size="20" fill="#d4b56e" font-weight="400">Next Move · 保留主决策区</text><text x="68" y="768" font-family="Noto Sans CJK SC" font-size="18" fill="#f5f1e7" font-weight="400">目标 → 阻塞 → 下一步 → 原结果</text><text x="68" y="800" font-family="Noto Sans CJK SC" font-size="18" fill="#f5f1e7" font-weight="400">未知不补零；失败不静默重放</text><rect x="470" y="916" width="600" height="60" fill="#173d31" stroke="#6b8c75" rx="12" /><rect x="876" y="922" width="188" height="48" fill="#315a47" stroke="none" rx="12" /><text x="488" y="953" font-family="Noto Sans CJK SC" font-size="16" fill="#f5f1e7" font-weight="400">World</text><text x="688" y="953" font-family="Noto Sans CJK SC" font-size="16" fill="#f5f1e7" font-weight="400">Targets</text><text x="888" y="953" font-family="Noto Sans CJK SC" font-size="16" fill="#f5f1e7" font-weight="400">Command</text><text x="1090" y="953" font-family="Noto Sans CJK SC" font-size="16" fill="#e2d9be" font-weight="400">静态示意 · 非实际世界结果</text></svg>