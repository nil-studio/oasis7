<text id="t13" x="192" y="312" font-size="16" fill="#88cbd0" font-weight="400">示意状态 · 仅部署启用且所需能力可核验时提供</text>
<text id="t14" x="180" y="354" font-size="19" fill="#edf1e6" font-weight="400">世界 world-示例 · Agent A · Task T-示例</text>
<text id="t15" x="180" y="383" font-size="19" fill="#edf1e6" font-weight="400">目标：恢复北侧补给（虚构） · 执行器授权已核对（示例）</text>
<path d="M180 414 L974 414" fill="none" stroke="#405346" stroke-width="1"/>
<text id="t16" x="180" y="452" font-size="18" fill="#9ca89a" font-weight="400">供应商 / 模型</text>
<text id="t17" x="389" y="452" font-size="20" fill="#edf1e6" font-weight="600">DeepSeek / deepseek-flash（示例）</text>
<text id="t18" x="180" y="490" font-size="18" fill="#9ca89a" font-weight="400">本地凭证 / 检查</text>
<text id="t19" x="389" y="490" font-size="20" fill="#edf1e6" font-weight="400">示例：Key 已保存 · 工具检查通过</text>
<text id="t20" x="180" y="533" font-size="18" fill="#9ca89a" font-weight="400">Key 存在本站 localStorage，同源脚本 / 扩展 / 主机访问者可读取。</text>
<text id="t21" x="180" y="561" font-size="18" fill="#9ca89a" font-weight="400">刷新或关页不删除；仅发送给供应商，不上传 Oasis7。</text>
<rect x="180" y="590" width="794" height="103" rx="10" fill="#161d19" stroke="#405346" stroke-width="1"/>
<text id="t22" x="200" y="622" font-size="20" fill="#d0a85b" font-weight="600">配置预算示例：上限 8 次 · 剩余 6 次 · 金额未知</text>
<text id="t23" x="200" y="653" font-size="17" fill="#9ca89a" font-weight="400">检查与运行共享调用 / token 预算；未知用量保留预留。</text>
<text id="t24" x="200" y="679" font-size="17" fill="#9ca89a" font-weight="400">不是供应商账户费用硬封顶，刷新 / Stop 不重置。</text>
<rect x="180" y="722" width="478" height="44" rx="10" fill="#d0a85b" stroke="#d0a85b" stroke-width="1"/>
<text id="t25" x="196" y="751" font-size="18" fill="#0b100f" font-weight="600">确认 Agent 开始 · 费用与身份已核对</text>
<rect x="678" y="722" width="296" height="44" rx="10" fill="#161d19" stroke="#405346" stroke-width="1"/>
<text id="t26" x="694" y="751" font-size="18" fill="#edf1e6" font-weight="600">返回，不开始运行</text>
<text id="t27" x="180" y="797" font-size="17" fill="#9ca89a" font-weight="400">连接检查需另行确认 2 次请求，可能收费；OpenRouter 未支持。</text>
<rect x="1050" y="165" width="486" height="274" rx="12" fill="#101412" stroke="#405346" stroke-width="1"/>
<text id="t28" x="1074" y="196" font-size="16" fill="#d0a85b" font-weight="600">① 准备 → ② 执行器 → ③ 明确开始</text>
<text id="t29" x="1074" y="235" font-size="23" fill="#edf1e6" font-weight="600">三个确认，不合并授权</text>
<text id="t30" x="1074" y="274" font-size="18" fill="#9ca89a" font-weight="400">准备 Player / Agent / Task：不调用模型。</text>
<text id="t31" x="1074" y="302" font-size="18" fill="#9ca89a" font-weight="400">登记浏览器执行器：不自动运行。</text>
<text id="t32" x="1074" y="330" font-size="18" fill="#9ca89a" font-weight="400">检查连接并核对实际目标、预算后开始。</text>
<text id="t33" x="1074" y="358" font-size="18" fill="#9ca89a" font-weight="400">另一个执行器需明确替换许可；</text>
<text id="t34" x="1074" y="386" font-size="18" fill="#9ca89a" font-weight="400">旧运行结果未知或政策不明时阻止开始。</text>
<rect x="1050" y="460" width="486" height="225" rx="12" fill="#101412" stroke="#405346" stroke-width="1"/>
<text id="t35" x="1074" y="491" font-size="16" fill="#e58f76" font-weight="600">运行中 → 随时可达</text>
<text id="t36" x="1074" y="530" font-size="23" fill="#edf1e6" font-weight="600">Stop 与 Forget 不同</text>
<text id="t37" x="1074" y="569" font-size="18" fill="#9ca89a" font-weight="400">停止：停止新决策，保留本地 Key。</text>
<text id="t38" x="1074" y="597" font-size="18" fill="#9ca89a" font-weight="400">忘记：先停止，再删除本站凭证。</text>
<text id="t39" x="1074" y="625" font-size="18" fill="#9ca89a" font-weight="400">两者不撤销供应商 Key / 游戏委托，</text>
<text id="t40" x="1074" y="653" font-size="18" fill="#9ca89a" font-weight="400">不保证退款，不取消已受理世界作业。</text>
<rect x="1050" y="706" width="486" height="209" rx="12" fill="#101412" stroke="#405346" stroke-width="1"/>
<text id="t41" x="1074" y="737" font-size="16" fill="#d0a85b" font-weight="600">重新进入 → 不自动续跑</text>
<text id="t42" x="1074" y="776" font-size="23" fill="#edf1e6" font-weight="600">核对原件，保留原预算</text>
<text id="t43" x="1074" y="815" font-size="18" fill="#9ca89a" font-weight="400">先只读核对原 operation / nonce。</text>
<text id="t44" x="1074" y="843" font-size="18" fill="#9ca89a" font-weight="400">Unknown / 历史缺失：停止新效果。</text>
<text id="t45" x="1074" y="871" font-size="18" fill="#9ca89a" font-weight="400">不换号重交、不清存储当重试；</text>
<text id="t46" x="1074" y="899" font-size="18" fill="#9ca89a" font-weight="400">无合法查询能力时直接说明限制。</text>
<rect x="64" y="957" width="30" height="30" rx="8" fill="#161d19" stroke="#405346" stroke-width="1"/>
<text id="t47" x="72" y="979" font-size="17" fill="#d0a85b" font-weight="600">1</text>
<text id="t48" x="108" y="980" font-size="21" fill="#edf1e6" font-weight="600">入口先检查能力，再收 Key</text>
<text id="t49" x="108" y="1015" font-size="18" fill="#9ca89a" font-weight="400">未启用、缺 signer / 锁 / 游戏接口 / CSP 等能力时</text>
<text id="t50" x="108" y="1044" font-size="18" fill="#9ca89a" font-weight="400">不先索取凭证。不静默回退托管、代理或公共 Key。</text>
<rect x="830" y="957" width="30" height="30" rx="8" fill="#161d19" stroke="#405346" stroke-width="1"/>
<text id="t51" x="838" y="979" font-size="17" fill="#d0a85b" font-weight="600">2</text>
<text id="t52" x="874" y="980" font-size="21" fill="#edf1e6" font-weight="600">停止可达，费用不误导</text>
<text id="t53" x="874" y="1015" font-size="18" fill="#9ca89a" font-weight="400">Stop / Forget 不被长任务锁住；删除失败应可见。</text>
<text id="t54" x="874" y="1044" font-size="18" fill="#9ca89a" font-weight="400">更换账号先停止旧运行，不把旧账号 Key 自动带入。</text>
<path d="M48 1142 L1552 1142" fill="none" stroke="#405346" stroke-width="2"/>
<text id="t55" x="48" y="1173" font-size="16" fill="#9ca89a" font-weight="400">基线 cd2ba63bf82a · 2026-10-30 · 示例身份 / 数值 / 状态非运行事实</text>
<text id="t56" x="1415" y="1173" font-size="16" fill="#9ca89a" font-weight="400">UIUX / 11</text>
</g></svg>