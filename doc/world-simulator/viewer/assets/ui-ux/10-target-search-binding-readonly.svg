<text id="t11" x="112" y="645" font-size="16" fill="#d0a85b" font-weight="400">B · 地图当前查看</text>
<rect x="100" y="677" width="326" height="126" rx="14" fill="#101412" stroke="#405346" stroke-width="1"/>
<text id="t12" x="120" y="712" font-size="20" fill="#d0a85b" font-weight="600">下一步 · 查看 B 的上下文</text>
<text id="t13" x="120" y="747" font-size="17" fill="#9ca89a" font-weight="400">仅选择与定位，不提交命令。</text>
<text id="t14" x="120" y="773" font-size="17" fill="#9ca89a" font-weight="400">原操作 A 的回执独立保留。</text>
<rect x="458" y="225" width="542" height="601" rx="14" fill="#101412" stroke="#405346" stroke-width="1"/>
<text id="t15" x="482" y="269" font-size="25" fill="#edf1e6" font-weight="600">Targets / 目标</text>
<rect x="826" y="242" width="150" height="44" rx="10" fill="#161d19" stroke="#405346" stroke-width="1"/>
<text id="t16" x="842" y="271" font-size="18" fill="#edf1e6" font-weight="600">返回世界</text>
<rect x="482" y="300" width="494" height="48" rx="8" fill="#161d19" stroke="#d0a85b" stroke-width="2"/>
<text id="t17" x="498" y="332" font-size="19" fill="#edf1e6" font-weight="400">搜索已授权目标：补给</text>
<text id="t18" x="482" y="385" font-size="17" fill="#9ca89a" font-weight="400">示例结果 3 项 · 当前展示 1–3</text>
<text id="t19" x="482" y="411" font-size="17" fill="#9ca89a" font-weight="400">搜索覆盖当前取得的完整授权列表。</text>
<rect x="482" y="447" width="494" height="81" rx="10" fill="#161d19" stroke="#405346" stroke-width="1"/>
<text id="t20" x="502" y="478" font-size="21" fill="#edf1e6" font-weight="600">A · 补给 Agent</text>
<text id="t21" x="502" y="508" font-size="17" fill="#9ca89a" font-weight="400">当前绑定 · 指导仍需当前授权</text>
<rect x="482" y="542" width="494" height="81" rx="10" fill="#161d19" stroke="#d0a85b" stroke-width="2"/>
<text id="t22" x="502" y="573" font-size="21" fill="#d0a85b" font-weight="600">B · 补给协作 Agent</text>
<text id="t23" x="502" y="603" font-size="17" fill="#9ca89a" font-weight="400">当前查看 · 只读；不是当前控制对象</text>
<rect x="482" y="637" width="494" height="81" rx="10" fill="#161d19" stroke="#405346" stroke-width="1"/>
<text id="t24" x="502" y="668" font-size="21" fill="#edf1e6" font-weight="600">C · 补给观察 Agent</text>
<text id="t25" x="502" y="698" font-size="17" fill="#9ca89a" font-weight="400">可查看 · 以当前权限为准</text>
<text id="t26" x="482" y="765" font-size="17" fill="#9ca89a" font-weight="400">每类别最多挂载 50 行；分页不改变选择。</text>
<text id="t27" x="482" y="791" font-size="17" fill="#9ca89a" font-weight="400">清空 / 换关键词回首页，失效授权行立即移除。</text>
<rect x="1050" y="165" width="486" height="257" rx="12" fill="#101412" stroke="#405346" stroke-width="1"/>
<text id="t28" x="1074" y="196" font-size="16" fill="#d0a85b" font-weight="600">① 选中 B → 按需详情</text>
<text id="t29" x="1074" y="235" font-size="23" fill="#edf1e6" font-weight="600">B 的上下文 · 只读</text>
<text id="t30" x="1074" y="274" font-size="18" fill="#9ca89a" font-weight="400">查看：当前状态、允许公开的来源与时效。</text>
<text id="t31" x="1074" y="302" font-size="18" fill="#9ca89a" font-weight="400">控制：未获当前授权，不出现假执行按钮。</text>
<text id="t32" x="1074" y="330" font-size="18" fill="#9ca89a" font-weight="400">可返回 Targets 保留关键词 / 页码；</text>
<text id="t33" x="1074" y="358" font-size="18" fill="#9ca89a" font-weight="400">不自动切回 A，也不把 A 的结果改标为 B。</text>
<rect x="1050" y="443" width="486" height="237" rx="12" fill="#101412" stroke="#405346" stroke-width="1"/>
<text id="t34" x="1074" y="474" font-size="16" fill="#d0a85b" font-weight="600">② 无绑定 / 同步中 → 解释下一步</text>
<text id="t35" x="1074" y="513" font-size="23" fill="#edf1e6" font-weight="600">可阅读，暂不能指导</text>
<text id="t36" x="1074" y="552" font-size="18" fill="#9ca89a" font-weight="400">沿现有合法认领或 binding sync 路径。</text>
<text id="t37" x="1074" y="580" font-size="18" fill="#9ca89a" font-weight="400">认领 pending 不是 committed。</text>
<text id="t38" x="1074" y="608" font-size="18" fill="#9ca89a" font-weight="400">看到世界 Agent 不证明你拥有它；</text>
<text id="t39" x="1074" y="636" font-size="18" fill="#9ca89a" font-weight="400">登录与模型 Key 都不能替代控制绑定。</text>
<rect x="1050" y="701" width="486" height="214" rx="12" fill="#101412" stroke="#405346" stroke-width="1"/>
<text id="t40" x="1074" y="732" font-size="16" fill="#e58f76" font-weight="600">③ 权限变化 → 即刻收缩</text>
<text id="t41" x="1074" y="771" font-size="23" fill="#edf1e6" font-weight="600">撤权后不保留私有内容</text>
<text id="t42" x="1074" y="810" font-size="18" fill="#9ca89a" font-weight="400">删除失效列表行、详情与搜索缓存。</text>
<text id="t43" x="1074" y="838" font-size="18" fill="#9ca89a" font-weight="400">仍有权限的原结果按原身份可回看。</text>
<text id="t44" x="1074" y="866" font-size="18" fill="#9ca89a" font-weight="400">迟到详情不得越过当前身份 / scope。</text>
<rect x="64" y="957" width="30" height="30" rx="8" fill="#161d19" stroke="#405346" stroke-width="1"/>
<text id="t45" x="72" y="979" font-size="17" fill="#d0a85b" font-weight="600">1</text>
<text id="t46" x="108" y="980" font-size="21" fill="#edf1e6" font-weight="600">搜索是导航，不是世界操作</text>
<text id="t47" x="108" y="1015" font-size="18" fill="#9ca89a" font-weight="400">地图点击、列表选择和相机定位均不授予执行权。</text>
<text id="t48" x="108" y="1044" font-size="18" fill="#9ca89a" font-weight="400">一般 snapshot 更新不应无理由清空搜索或抢焦点。</text>
<rect x="830" y="957" width="30" height="30" rx="8" fill="#161d19" stroke="#405346" stroke-width="1"/>
<text id="t49" x="838" y="979" font-size="17" fill="#d0a85b" font-weight="600">2</text>
<text id="t50" x="874" y="980" font-size="21" fill="#edf1e6" font-weight="600">焦点与长中文</text>
<text id="t51" x="874" y="1015" font-size="18" fill="#9ca89a" font-weight="400">打开 Targets 聚焦标题 / 关闭；返回复原触发点。</text>
<text id="t52" x="874" y="1044" font-size="18" fill="#9ca89a" font-weight="400">搜索组合输入不驱动世界快捷键，长名可换行查看。</text>
<path d="M48 1142 L1552 1142" fill="none" stroke="#405346" stroke-width="2"/>
