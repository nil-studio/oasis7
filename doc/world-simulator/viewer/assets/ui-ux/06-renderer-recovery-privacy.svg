<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img" aria-labelledby="title desc"><title id="title">画面不可用，信息仍然诚实 · 设计目标 · 非运行截图</title><desc id="desc">06 / RendererUnavailable · 不以备用地图、旧截图或 DOM 世界替代 Bevy。静态设计参考，不表示当前运行能力；示例实体、位置和结果仅用于说明设计契约。</desc><rect width="100%" height="100%" fill="#0b100f"/><g font-family="Noto Sans CJK SC, Noto Sans, sans-serif"><text x="48" y="42" font-size="16" fill="#9ca89a" font-weight="400">OASIS7  /  VIEWER DESIGN CONTRACT</text><text x="48" y="85" font-size="32" fill="#edf1e6" font-weight="600">画面不可用，信息仍然诚实</text><text x="48" y="119" font-size="18" fill="#9ca89a" font-weight="400">06 / RendererUnavailable · 不以备用地图、旧截图或 DOM 世界替代 Bevy</text><text x="1240" y="42" font-size="18" fill="#d0a85b" font-weight="400">设计目标 · 非运行截图</text><rect x="64" y="170" width="1472" height="390" rx="0" fill="#101713" stroke="#405346" /><text x="112" y="238" font-size="34" fill="#edf1e6" font-weight="600">渲染器不可用</text><text x="112" y="283" font-size="23" fill="#edf1e6" font-weight="400">当前无法显示 Bevy 世界画面。</text><text x="112" y="324" font-size="20" fill="#9ca89a" font-weight="400">世界画面已停止更新与命中检测；此处不显示替代场景。</text><rect x="112" y="370" width="240" height="48" rx="12" fill="#161d19" stroke="#405346" /><text x="128" y="401" font-size="18" fill="#edf1e6" font-weight="600">尝试恢复画面</text><rect x="376" y="370" width="240" height="48" rx="12" fill="#161d19" stroke="#405346" /><text x="392" y="401" font-size="18" fill="#edf1e6" font-weight="600">打开 Targets</text><text x="112" y="474" font-size="19" fill="#9ca89a" font-weight="400">恢复尝试须有边界；只有真正 ready 后，才重新开放世界交互。</text><text x="112" y="512" font-size="19" fill="#9ca89a" font-weight="400">画面故障不自行取消原操作；查询与合法停止按各自授权处理。</text><rect x="64" y="604" width="464" height="300" rx="12" fill="#101412" stroke="#405346" /><text x="88" y="650" font-size="23" fill="#edf1e6" font-weight="600">仍可用 · 授权文字信息</text><text x="88" y="704" font-size="19" fill="#9ca89a" font-weight="400">Targets 与选中对象说明</text><text x="88" y="748" font-size="19" fill="#9ca89a" font-weight="400">原操作回执 / 原结果查询</text><text x="88" y="792" font-size="19" fill="#9ca89a" font-weight="400">不暴露已撤权的对象字段</text><rect x="568" y="604" width="464" height="300" rx="12" fill="#101412" stroke="#405346" /><text x="592" y="650" font-size="23" fill="#edf1e6" font-weight="600">重新连接 · 尚未恢复</text><text x="592" y="704" font-size="19" fill="#9ca89a" font-weight="400">明确区分网络与渲染失败</text><text x="592" y="748" font-size="19" fill="#9ca89a" font-weight="400">重新取得当前授权状态</text><text x="592" y="792" font-size="19" fill="#9ca89a" font-weight="400">不从旧画布恢复私人内容</text><rect x="1072" y="604" width="464" height="300" rx="12" fill="#101412" stroke="#405346" /><text x="1096" y="650" font-size="23" fill="#edf1e6" font-weight="600">隐私撤权 · 立即移除</text><text x="1096" y="704" font-size="19" fill="#9ca89a" font-weight="400">清理详情、标签与缓存显示</text><text x="1096" y="748" font-size="19" fill="#9ca89a" font-weight="400">引用上下文失效并说明原因</text><text x="1096" y="792" font-size="19" fill="#9ca89a" font-weight="400">不以「上次已知」继续保留</text><rect x="600" y="958" width="400" height="64" rx="18" fill="#101412" stroke="#405346" /><text x="628.0" y="997" font-size="18" fill="#edf1e6" font-weight="600">World</text><rect x="737.3333333333334" y="967" width="121.33333333333333" height="46" rx="10" fill="#161d19" stroke="#d0a85b" /><text x="753.3333333333334" y="997" font-size="18" fill="#d0a85b" font-weight="600">Targets</text><text x="878.6666666666666" y="997" font-size="18" fill="#edf1e6" font-weight="600">Command</text><text x="64" y="1070" font-size="20" fill="#d0a85b" font-weight="400">首次启动无 GPU 与 ready 后丢失画面，需要分别验证；本图不声称任一恢复测试已通过。</text><path d="M48 1142 L1552 1142" fill="none" stroke="#405346" stroke-width="2"/><text x="48" y="1172" font-size="16" fill="#9ca89a" font-weight="400">基线 main 7a89dbc8d240 · 2026-10-29 · 示例不代表运行事实 / 权限 / 坐标</text><text x="1415" y="1172" font-size="16" fill="#9ca89a" font-weight="400">UIUX / 06</text></g></svg>