<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img" aria-labelledby="title desc"><title id="title">查看、引用、提交：三个明确边界 · 设计目标 · 非运行截图</title><desc id="desc">03 / 独立面板解剖，非并排页面布局 · 运行时按需打开其中一个。静态设计参考，不表示当前运行能力；示例实体、位置和结果仅用于说明设计契约。</desc><rect width="100%" height="100%" fill="#0b100f"/><g font-family="Noto Sans CJK SC, Noto Sans, sans-serif"><text x="48" y="42" font-size="16" fill="#9ca89a" font-weight="400">OASIS7  /  VIEWER DESIGN CONTRACT</text><text x="48" y="85" font-size="32" fill="#edf1e6" font-weight="600">查看、引用、提交：三个明确边界</text><text x="48" y="119" font-size="18" fill="#9ca89a" font-weight="400">03 / 独立面板解剖，非并排页面布局 · 运行时按需打开其中一个</text><text x="1240" y="42" font-size="18" fill="#d0a85b" font-weight="400">设计目标 · 非运行截图</text><rect x="64" y="170" width="470" height="720" rx="12" fill="#101412" stroke="#405346" /><text x="88" y="216" font-size="28" fill="#edf1e6" font-weight="600">Targets</text><text x="88" y="249" font-size="18" fill="#9ca89a" font-weight="400">搜索属于 Targets，不是第四个 Dock</text><rect x="88" y="280" width="422" height="56" rx="12" fill="#161d19" stroke="#d0a85b" stroke-width="3"/><text x="106" y="316" font-size="20" fill="#edf1e6" font-weight="400">北侧加工站</text><rect x="88" y="360" width="160" height="32" rx="6" fill="#101412" stroke="#d0a85b" /><text x="100" y="383" font-size="16" fill="#d0a85b" font-weight="400">已选中 · B</text><text x="88" y="422" font-size="26" fill="#edf1e6" font-weight="600">加工代理 B</text><text x="88" y="458" font-size="18" fill="#88cbd0" font-weight="400">位置：由 Location 推导</text><text x="88" y="492" font-size="18" fill="#9ca89a" font-weight="400">新鲜度：上次已知 · 当前未确认</text><path d="M88 520 L510 520" fill="none" stroke="#405346" stroke-width="2"/><text x="88" y="558" font-size="20" fill="#edf1e6" font-weight="400">可确认关系</text><text x="88" y="594" font-size="18" fill="#9ca89a" font-weight="400">暂无；不从邻近位置猜测路线。</text><rect x="88" y="638" width="422" height="48" rx="12" fill="#161d19" stroke="#405346" /><text x="104" y="669" font-size="18" fill="#edf1e6" font-weight="600">打开 Command 查看上下文</text><text x="88" y="728" font-size="17" fill="#9ca89a" font-weight="400">只建立可见上下文，不执行世界动作。</text><text x="88" y="760" font-size="18" fill="#d0a85b" font-weight="400">可见对象 ≠ 可控制对象。</text><rect x="578" y="170" width="958" height="720" rx="12" fill="#101412" stroke="#405346" /><text x="610" y="216" font-size="28" fill="#edf1e6" font-weight="600">Command</text><text x="610" y="250" font-size="18" fill="#9ca89a" font-weight="400">输入建议或问题；执行资格由原有服务端契约决定。</text><rect x="610" y="280" width="405" height="32" rx="6" fill="#101412" stroke="#88cbd0" /><text x="622" y="303" font-size="16" fill="#88cbd0" font-weight="400">引用上下文：加工代理 B · 可移除</text><rect x="1036" y="280" width="268" height="32" rx="6" fill="#101412" stroke="#9ca89a" /><text x="1048" y="303" font-size="16" fill="#9ca89a" font-weight="400">未绑定可执行主体</text><rect x="610" y="344" width="894" height="178" rx="12" fill="#161d19" stroke="#d0a85b" stroke-width="3"/><text x="634" y="382" font-size="21" fill="#edf1e6" font-weight="400">请解释北侧补给受阻的原因，</text><text x="634" y="417" font-size="21" fill="#edf1e6" font-weight="400">并说明可以考虑的下一步。</text><path d="M634 425 L843 425" fill="none" stroke="#d0a85b" stroke-width="2"/><text x="634" y="484" font-size="17" fill="#d0a85b" font-weight="400">设计标注：IME 不触发全局快捷键；Enter / Shift+Enter 均不发送</text><rect x="610" y="554" width="224" height="48" rx="12" fill="#161d19" stroke="#405346" /><text x="626" y="585" font-size="18" fill="#edf1e6" font-weight="600">发送聊天 · Send Chat</text><text x="858" y="584" font-size="18" fill="#9ca89a" font-weight="400">仅显式按钮发送；Enter 换行。</text><text x="610" y="641" font-size="18" fill="#edf1e6" font-weight="400">世界执行仍未绑定；聊天权限单独判断，不借用可见代理。</text><path d="M610 671 L1504 671" fill="none" stroke="#405346" stroke-width="2"/><text x="610" y="712" font-size="20" fill="#edf1e6" font-weight="600">查看详情 / 原操作回执</text><text x="610" y="748" font-size="18" fill="#9ca89a" font-weight="400">回执与当前引用分离；原操作结果可按独立授权查询。</text><text x="610" y="811" font-size="17" fill="#9ca89a" font-weight="400">操作员诊断收纳在「更多」；不与 Command 竞争。</text><rect x="64" y="931" width="30" height="30" rx="8" fill="#161d19" stroke="#405346" /><text x="72" y="953" font-size="17" fill="#d0a85b" font-weight="600">1</text><text x="108" y="954" font-size="20" fill="#edf1e6" font-weight="600">键盘路径</text><text x="108" y="985" font-size="17" fill="#9ca89a" font-weight="400">Tab 顺序跟随视觉顺序；可见焦点不被面板边界裁切。</text><text x="108" y="1013" font-size="17" fill="#9ca89a" font-weight="400">输入法组合、弹出候选、内层弹层先于关闭面板。</text><rect x="820" y="931" width="30" height="30" rx="8" fill="#161d19" stroke="#405346" /><text x="828" y="953" font-size="17" fill="#d0a85b" font-weight="600">2</text><text x="864" y="954" font-size="20" fill="#edf1e6" font-weight="600">退出与返回</text><text x="864" y="985" font-size="17" fill="#9ca89a" font-weight="400">Escape 仅关闭当前可关闭层，不撤销已提交操作。</text><text x="864" y="1013" font-size="17" fill="#9ca89a" font-weight="400">关闭面板后，焦点返回打开它的按钮。</text><path d="M48 1142 L1552 1142" fill="none" stroke="#405346" stroke-width="2"/><text x="48" y="1172" font-size="16" fill="#9ca89a" font-weight="400">基线 main 7a89dbc8d240 · 2026-10-29 · 示例不代表运行事实 / 权限 / 坐标</text><text x="1415" y="1172" font-size="16" fill="#9ca89a" font-weight="400">UIUX / 03</text></g></svg>