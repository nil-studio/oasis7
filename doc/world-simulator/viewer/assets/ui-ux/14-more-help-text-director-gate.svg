<text id="t10" x="924" y="879" font-size="18" fill="#edf1e6" font-weight="600">更多</text>
<rect x="100" y="657" width="408" height="148" rx="14" fill="#101412" stroke="#405346" stroke-width="1"/>
<text id="t11" x="124" y="694" font-size="21" fill="#d0a85b" font-weight="600">Next Move · 先了解当前阻碍</text>
<text id="t12" x="124" y="733" font-size="18" fill="#9ca89a" font-weight="400">正文和回执可选择复制。</text>
<text id="t13" x="124" y="761" font-size="18" fill="#9ca89a" font-weight="400">世界不可用时，保留授权文本路径。</text>
<rect x="558" y="225" width="442" height="601" rx="14" fill="#101412" stroke="#405346" stroke-width="1"/>
<text id="t14" x="582" y="268" font-size="25" fill="#edf1e6" font-weight="600">更多 / 阅读与帮助</text>
<rect x="582" y="291" width="394" height="44" rx="10" fill="#161d19" stroke="#405346" stroke-width="1"/>
<text id="t15" x="598" y="320" font-size="18" fill="#edf1e6" font-weight="600">返回世界</text>
<text id="t16" x="582" y="377" font-size="18" fill="#9ca89a" font-weight="400">语言</text>
<rect x="648" y="349" width="148" height="44" rx="10" fill="#161d19" stroke="#405346" stroke-width="1"/>
<text id="t17" x="664" y="378" font-size="18" fill="#edf1e6" font-weight="600">简体中文</text>
<rect x="810" y="349" width="166" height="44" rx="10" fill="#161d19" stroke="#405346" stroke-width="1"/>
<text id="t18" x="826" y="378" font-size="18" fill="#edf1e6" font-weight="600">English</text>
<path d="M582 417 L976 417" fill="none" stroke="#405346" stroke-width="1"/>
<text id="t19" x="582" y="454" font-size="20" fill="#88cbd0" font-weight="600">阅读帮助 · 文案补充提案</text>
<text id="t20" x="582" y="492" font-size="18" fill="#9ca89a" font-weight="400">选择 ≠ 控制；世界动态 ≠ 行动回执。</text>
<text id="t21" x="582" y="520" font-size="18" fill="#9ca89a" font-weight="400">使用浏览器放大；长中文与主要动作</text>
<text id="t22" x="582" y="548" font-size="18" fill="#9ca89a" font-weight="400">重排可读，不假设已有独立字号设置。</text>
<rect x="582" y="590" width="394" height="44" rx="10" fill="#161d19" stroke="#405346" stroke-width="1"/>
<text id="t23" x="598" y="619" font-size="18" fill="#edf1e6" font-weight="600">Diagnostics · 按需展开</text>
<text id="t24" x="582" y="677" font-size="21" fill="#9ca89a" font-weight="600">Director · 当前不可用</text>
<text id="t25" x="582" y="713" font-size="18" fill="#9ca89a" font-weight="400">需要服务端绑定当前会话的有效能力。</text>
<text id="t26" x="582" y="741" font-size="18" fill="#9ca89a" font-weight="400">issuer 缺口保持 capability_blocked；</text>
<text id="t27" x="582" y="769" font-size="18" fill="#9ca89a" font-weight="400">不能用本地开关绕过。</text>
<rect x="1050" y="165" width="486" height="237" rx="12" fill="#101412" stroke="#405346" stroke-width="1"/>
<text id="t28" x="1074" y="196" font-size="16" fill="#d0a85b" font-weight="600">图形不可用 → 仍可阅读</text>
<text id="t29" x="1074" y="235" font-size="23" fill="#edf1e6" font-weight="600">授权文字，不是备用世界</text>
<text id="t30" x="1074" y="274" font-size="18" fill="#9ca89a" font-weight="400">RendererUnavailable 明确说明原因。</text>
<text id="t31" x="1074" y="302" font-size="18" fill="#9ca89a" font-weight="400">保留允许的 Targets、文本、原回执。</text>
<text id="t32" x="1074" y="330" font-size="18" fill="#9ca89a" font-weight="400">不创建 JS / Canvas 世界替身。</text>
<text id="t33" x="1074" y="358" font-size="18" fill="#9ca89a" font-weight="400">复制或诊断不携带隐藏数据与凭据。</text>
<rect x="1050" y="423" width="486" height="268" rx="12" fill="#101412" stroke="#405346" stroke-width="1"/>
<text id="t34" x="1074" y="454" font-size="16" fill="#d0a85b" font-weight="600">拒绝 / 过期 / 撤销 → 安全返回</text>
<text id="t35" x="1074" y="493" font-size="23" fill="#edf1e6" font-weight="600">返回 Player，不开放特权</text>
<text id="t36" x="1074" y="532" font-size="18" fill="#9ca89a" font-weight="400">当前无可信 issuer，入口保持阻断。</text>
<text id="t37" x="1074" y="560" font-size="18" fill="#9ca89a" font-weight="400">保留世界 / 选择，清理特权表面，</text>
<text id="t38" x="1074" y="588" font-size="18" fill="#9ca89a" font-weight="400">解释原因并恢复入口焦点。</text>
<text id="t39" x="1074" y="616" font-size="18" fill="#9ca89a" font-weight="400">仅将来取得有效能力且显式 opt-in 后，</text>
<text id="t40" x="1074" y="644" font-size="18" fill="#9ca89a" font-weight="400">工具视图才提供“退出 Director”。</text>
<rect x="1050" y="712" width="486" height="203" rx="12" fill="#101412" stroke="#405346" stroke-width="1"/>
<text id="t41" x="1074" y="743" font-size="16" fill="#d0a85b" font-weight="600">高级 Prompt · 不与玩家主路竞争</text>
<text id="t42" x="1074" y="782" font-size="23" fill="#edf1e6" font-weight="600">默认收起，授权另行核对</text>
<text id="t43" x="1074" y="821" font-size="18" fill="#9ca89a" font-weight="400">preview、apply、rollback 与反馈分开。</text>
<text id="t44" x="1074" y="849" font-size="18" fill="#9ca89a" font-weight="400">strong_auth 由后端决定；</text>
<text id="t45" x="1074" y="877" font-size="18" fill="#9ca89a" font-weight="400">Prompt rollback 不是世界回滚。</text>
<rect x="64" y="957" width="30" height="30" rx="8" fill="#161d19" stroke="#405346" stroke-width="1"/>
<text id="t46" x="72" y="979" font-size="17" fill="#d0a85b" font-weight="600">1</text>
<text id="t47" x="108" y="980" font-size="21" fill="#edf1e6" font-weight="600">键盘、IME 与文本缩放</text>
<text id="t48" x="108" y="1015" font-size="18" fill="#9ca89a" font-weight="400">关闭最内层面板后才退出 Focus；IME 中 Esc 留给输入法。</text>
<text id="t49" x="108" y="1044" font-size="18" fill="#9ca89a" font-weight="400">触控目标建议 ≥44px；真实 200% 缩放 / 读屏仍待验证。</text>
<rect x="830" y="957" width="30" height="30" rx="8" fill="#161d19" stroke="#405346" stroke-width="1"/>
<text id="t50" x="838" y="979" font-size="17" fill="#d0a85b" font-weight="600">2</text>
<text id="t51" x="874" y="980" font-size="21" fill="#edf1e6" font-weight="600">不添加尚无权威的偏好</text>
<text id="t52" x="874" y="1015" font-size="18" fill="#9ca89a" font-weight="400">没有新音量、账号删除、隐私开关或生产 Director 成功声明。</text>
<text id="t53" x="874" y="1044" font-size="18" fill="#9ca89a" font-weight="400">语言切换不改变能力、原结果身份与正在输入的安全草稿。</text>
<path d="M48 1142 L1552 1142" fill="none" stroke="#405346" stroke-width="2"/>
<text id="t54" x="48" y="1173" font-size="16" fill="#9ca89a" font-weight="400">基线 cd2ba63bf82a · 2026-10-30 · 示例身份 / 数值 / 状态非运行事实</text>
<text id="t55" x="1415" y="1173" font-size="16" fill="#9ca89a" font-weight="400">UIUX / 14</text>
</g></svg>