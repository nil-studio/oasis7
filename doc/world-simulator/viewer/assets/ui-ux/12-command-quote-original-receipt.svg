<text id="t11" x="112" y="643" font-size="16" fill="#d0a85b" font-weight="400">A · 本次预估主体</text>
<rect x="100" y="675" width="326" height="127" rx="14" fill="#101412" stroke="#405346" stroke-width="1"/>
<text id="t12" x="120" y="711" font-size="20" fill="#d0a85b" font-weight="600">Next Move · 核对本方案</text>
<text id="t13" x="120" y="748" font-size="17" fill="#9ca89a" font-weight="400">预览不是执行，也不锁定资源。</text>
<text id="t14" x="120" y="774" font-size="17" fill="#9ca89a" font-weight="400">确认执行只在正式开放的入口。</text>
<rect x="458" y="225" width="542" height="601" rx="14" fill="#101412" stroke="#405346" stroke-width="1"/>
<text id="t15" x="482" y="267" font-size="24" fill="#edf1e6" font-weight="600">Command / 方案预览</text>
<rect x="826" y="284" width="150" height="44" rx="10" fill="#161d19" stroke="#405346" stroke-width="1"/>
<text id="t16" x="842" y="313" font-size="18" fill="#edf1e6" font-weight="600">返回修改</text>
<rect x="482" y="294" width="310" height="32" rx="6" fill="#101412" stroke="#88cbd0" stroke-width="1"/>
<text id="t17" x="494" y="317" font-size="16" fill="#88cbd0" font-weight="400">排产 Quote · 只读预估</text>
<text id="t18" x="482" y="373" font-size="19" fill="#edf1e6" font-weight="400">主体 A · 方案 P-示例-03</text>
<text id="t19" x="482" y="402" font-size="19" fill="#edf1e6" font-weight="400">factory / recipe / batches 仅用于本查询</text>
<path d="M482 423 L976 423" fill="none" stroke="#405346" stroke-width="1"/>
<text id="t20" x="482" y="461" font-size="20" fill="#edf1e6" font-weight="600">本次投入 · 虚构示例</text>
<text id="t21" x="482" y="504" font-size="22" fill="#d0a85b" font-weight="600">电力 12 · 材料 8 · 批次 1</text>
<text id="t22" x="482" y="547" font-size="18" fill="#9ca89a" font-weight="400">来源：同一权威视图与规范方案。</text>
<text id="t23" x="482" y="575" font-size="18" fill="#9ca89a" font-weight="400">缺失费用保留“未确认”，不补前端估值。</text>
<text id="t24" x="482" y="603" font-size="18" fill="#9ca89a" font-weight="400">权限、资源或参数变化后须重新核对。</text>
<rect x="482" y="636" width="494" height="63" rx="10" fill="#161d19" stroke="#405346" stroke-width="1"/>
<text id="t25" x="498" y="674" font-size="18" fill="#edf1e6" font-weight="600">本预估卡不提交、不占资源、不产回执</text>
<rect x="477" y="720" width="504" height="54" rx="14" fill="none" stroke="#d0a85b" stroke-width="2"/>
<rect x="482" y="725" width="494" height="44" rx="10" fill="#d0a85b" stroke="#d0a85b" stroke-width="1"/>
<text id="t26" x="498" y="754" font-size="18" fill="#0b100f" font-weight="600">重新查询本方案预估</text>
<text id="t27" x="482" y="803" font-size="17" fill="#9ca89a" font-weight="400">参数变化标记旧预估失效；不把查询结果当成执行许可。</text>
<rect x="1050" y="165" width="486" height="204" rx="12" fill="#101412" stroke="#405346" stroke-width="1"/>
<text id="t28" x="1074" y="196" font-size="16" fill="#d0a85b" font-weight="600">条件设计 · 仅正式动作入口开放后</text>
<text id="t29" x="1074" y="235" font-size="23" fill="#edf1e6" font-weight="600">单独确认对象与成本</text>
<text id="t30" x="1074" y="274" font-size="18" fill="#9ca89a" font-weight="400">参数、实际方案、成本与权限先核对。</text>
<text id="t31" x="1074" y="302" font-size="18" fill="#9ca89a" font-weight="400">缺失权威报价或执行能力时不能提交。</text>
<text id="t32" x="1074" y="330" font-size="18" fill="#9ca89a" font-weight="400">不能把当前只读 Quote 改成确认按钮。</text>
<rect x="1050" y="390" width="486" height="210" rx="12" fill="#101412" stroke="#405346" stroke-width="1"/>
<text id="t33" x="1074" y="421" font-size="16" fill="#d0a85b" font-weight="600">另一状态 · 已提交 A 的原回执</text>
<text id="t34" x="1074" y="460" font-size="23" fill="#edf1e6" font-weight="600">收到请求 ≠ 完成</text>
<text id="t35" x="1074" y="499" font-size="18" fill="#9ca89a" font-weight="400">原操作：op-示例-017 · 主体 A。</text>
<text id="t36" x="1074" y="527" font-size="18" fill="#9ca89a" font-weight="400">Pending 表示等待，不预填成功。</text>
<text id="t37" x="1074" y="555" font-size="18" fill="#9ca89a" font-weight="400">此回执不由主稿的只读查询生成；</text>
<text id="t38" x="1074" y="583" font-size="18" fill="#9ca89a" font-weight="400">只引用已有操作的权威反馈。</text>
<rect x="1050" y="621" width="486" height="294" rx="12" fill="#101412" stroke="#405346" stroke-width="1"/>
<text id="t39" x="1074" y="652" font-size="16" fill="#e58f76" font-weight="600">③ 查看 B → A 结果仍未知</text>
<text id="t40" x="1074" y="691" font-size="23" fill="#edf1e6" font-weight="600">查询原操作，不换号重交</text>
<text id="t41" x="1074" y="730" font-size="18" fill="#9ca89a" font-weight="400">当前查看：B</text>
<text id="t42" x="1074" y="758" font-size="18" fill="#9ca89a" font-weight="400">原操作：op-示例-017 · 主体 A</text>
<text id="t43" x="1074" y="786" font-size="18" fill="#9ca89a" font-weight="400">若协商查询能力且仍获授权：查询原结果。</text>
<text id="t44" x="1074" y="814" font-size="18" fill="#9ca89a" font-weight="400">无能力 / 历史不可用：保留未知与限制。</text>
<text id="t45" x="1074" y="842" font-size="18" fill="#9ca89a" font-weight="400">查询失败不等于原操作被拒绝。</text>
<rect x="64" y="957" width="30" height="30" rx="8" fill="#161d19" stroke="#405346" stroke-width="1"/>
<text id="t46" x="72" y="979" font-size="17" fill="#d0a85b" font-weight="600">1</text>
<text id="t47" x="108" y="980" font-size="21" fill="#edf1e6" font-weight="600">各 Quote 保留实际能力边界</text>
<text id="t48" x="108" y="1015" font-size="18" fill="#9ca89a" font-weight="400">战争 / 治理卡仍禁用提交；排产 / 转运卡仅预估。</text>
<text id="t49" x="108" y="1044" font-size="18" fill="#9ca89a" font-weight="400">无权威精炼报价时说明不可用，不拿本地估值代替。</text>
<rect x="830" y="957" width="30" height="30" rx="8" fill="#161d19" stroke="#405346" stroke-width="1"/>
<text id="t50" x="838" y="979" font-size="17" fill="#d0a85b" font-weight="600">2</text>
<text id="t51" x="874" y="980" font-size="21" fill="#edf1e6" font-weight="600">恢复预算属于原逻辑操作</text>
<text id="t52" x="874" y="1015" font-size="18" fill="#9ca89a" font-weight="400">结果未知只核对原件，不自动再发世界效果。</text>
<text id="t53" x="874" y="1044" font-size="18" fill="#9ca89a" font-weight="400">现行 session_not_found 自动恢复最多一次，不重置预算。</text>
<path d="M48 1142 L1552 1142" fill="none" stroke="#405346" stroke-width="2"/>
<text id="t54" x="48" y="1173" font-size="16" fill="#9ca89a" font-weight="400">基线 cd2ba63bf82a · 2026-10-30 · 示例身份 / 数值 / 状态非运行事实</text>
<text id="t55" x="1415" y="1173" font-size="16" fill="#9ca89a" font-weight="400">UIUX / 12</text>
