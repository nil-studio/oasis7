<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1900" viewBox="0 0 1600 1900" role="img" aria-labelledby="title desc"><title id="title">平板抽屉与 200% 文字重排设计目标</title><desc id="desc">两幅独立状态稿，均非浏览器截图。平板为1024乘768；文字放大为人工排版目标，不证明真实缩放或触控。</desc><rect width="1600" height="1900" fill="#0b100f" /><g font-family="Noto Sans CJK SC, Noto Sans, sans-serif"><text x="48" y="45" font-size="16" fill="#9ca89a" font-weight="400">OASIS7 / VIEWER DESIGN CONTRACT</text><text x="48" y="88" font-size="32" fill="#edf1e6" font-weight="600">世界、按需详情和原结果仍在同一阅读链</text><text x="48" y="120" font-size="18" fill="#d0a85b" font-weight="400">15 / 两个独立设计目标 · 非运行截图 · 不证明实际断点、文字缩放或触控</text><rect id="tablet" x="64" y="150" width="1024" height="768" rx="0" fill="#17251e" stroke="#405346" /><text x="88" y="190" font-size="24" fill="#edf1e6" font-weight="600">示例世界 · 当前范围：北侧补给区</text><text x="88" y="222" font-size="16" fill="#9ca89a" font-weight="400">场景仅示意；位置、新鲜度仍须权威确认</text><rect x="374" y="330" width="300" height="210" rx="0" fill="#28352e" stroke="#405346" /><rect x="410" y="370" width="220" height="130" rx="0" fill="#344039" stroke="#405346" /><rect x="490" y="442" width="24" height="24" rx="3" fill="#8dc7aa" stroke="#405346" /><path d="M490 432 H480 V442 M514 432 H524 V442 M480 466 V476 H490 M514 476 H524 V466" fill="none" stroke="#d0a85b" stroke-width="3" /><text x="464" y="510" font-size="18" fill="#edf1e6" font-weight="400">B · 当前查看</text><text x="388" y="550" font-size="16" fill="#9ca89a" font-weight="400">示意位置，不推断路线</text><rect x="744" y="246" width="320" height="580" rx="16" fill="#101412" stroke="#405346" /><text x="764" y="282" font-size="22" fill="#edf1e6" font-weight="600">Command · 详情</text><rect x="958" y="298" width="86" height="44" rx="16" fill="#101412" stroke="#405346" /><text x="974" y="327" font-size="18" fill="#edf1e6" font-weight="400">关闭</text><text x="764" y="378" font-size="20" fill="#d0a85b" font-weight="400">替代方案 · 条件目标</text><text x="764" y="416" font-size="18" fill="#edf1e6" font-weight="400">方案是否可执行尚待确认。</text><text x="764" y="448" font-size="18" fill="#edf1e6" font-weight="400">不会自动替换材料或重提。</text><text x="764" y="494" font-size="16" fill="#9ca89a" font-weight="400">原方案与成本：待权威读取</text><text x="764" y="528" font-size="18" fill="#edf1e6" font-weight="400">查看方案依据</text><text x="764" y="562" font-size="16" fill="#9ca89a" font-weight="400">技术字段按需展开。</text><rect x="764" y="616" width="280" height="52" rx="16" fill="#101412" stroke="#405346" /><text x="780" y="649" font-size="18" fill="#9ca89a" font-weight="400">执行替代 · 尚不可用</text><text x="764" y="706" font-size="15" fill="#9ca89a" font-weight="400">执行能力与提交方式尚未确认。</text><text x="764" y="746" font-size="16" fill="#edf1e6" font-weight="400">关闭后焦点返回 Command；</text><text x="764" y="778" font-size="16" fill="#edf1e6" font-weight="400">不取消 A 的原操作。</text><rect x="88" y="616" width="620" height="128" rx="16" fill="#101412" stroke="#405346" /><text x="108" y="648" font-size="18" fill="#d0a85b" font-weight="600">下一步 · Next Move</text><text x="108" y="681" font-size="24" fill="#edf1e6" font-weight="600">先了解当前阻碍</text><text x="108" y="718" font-size="17" fill="#9ca89a" font-weight="400">目标：恢复补给 · 影响：提出建议，不直接操控</text><rect x="88" y="760" width="620" height="66" rx="16" fill="#101412" stroke="#405346" /><text x="108" y="789" font-size="19" fill="#edf1e6" font-weight="400">原操作 A · 等待世界确认</text><text x="108" y="814" font-size="16" fill="#9ca89a" font-weight="400">当前查看 B；详情不是第二份回执。</text><text x="1130" y="210" font-size="22" fill="#edf1e6" font-weight="600">平板 1024 × 768</text><text x="1130" y="255" font-size="18" fill="#edf1e6" font-weight="400">按需抽屉覆盖边缘，</text><text x="1130" y="286" font-size="18" fill="#edf1e6" font-weight="400">不把世界挤成细列。</text><text x="1130" y="340" font-size="18" fill="#edf1e6" font-weight="400">Next Move 是原入口；</text><text x="1130" y="371" font-size="18" fill="#edf1e6" font-weight="400">进入详情后不重复主 CTA。</text><text x="1130" y="425" font-size="18" fill="#edf1e6" font-weight="400">原结果保持独立、可读；</text><text x="1130" y="456" font-size="18" fill="#edf1e6" font-weight="400">世界身份与返回始终可达。</text><text x="1130" y="510" font-size="18" fill="#edf1e6" font-weight="400">本例无已发布关系，故无线。</text><text x="1130" y="564" font-size="18" fill="#9ca89a" font-weight="400">实际触控 / HUD 遮挡 / 焦点</text><text x="1130" y="595" font-size="18" fill="#9ca89a" font-weight="400">仍须同候选设备验证。</text><text x="64" y="984" font-size="26" fill="#edf1e6" font-weight="600">200% 文字重排目标 · 独立视口 1024 × 768</text><rect id="text-reflow" x="64" y="1020" width="1024" height="768" rx="0" fill="#17251e" stroke="#405346" /><text x="88" y="1070" font-size="36" fill="#edf1e6" font-weight="600">示例世界</text><text x="88" y="1114" font-size="30" fill="#9ca89a" font-weight="400">范围：名称很长的北侧补给与加工区域</text><rect x="88" y="1142" width="976" height="216" rx="16" fill="#101412" stroke="#405346" /><text x="112" y="1190" font-size="32" fill="#d0a85b" font-weight="600">下一步 · Next Move</text><text x="112" y="1242" font-size="40" fill="#edf1e6" font-weight="600">先了解当前补给受阻的原因</text><text x="112" y="1290" font-size="30" fill="#9ca89a" font-weight="400">目标：恢复补给；不把建议当作世界执行。</text><rect x="112" y="1304" width="600" height="44" rx="8" fill="#d0a85b" stroke="#d0a85b" /><text x="128" y="1337" font-size="30" fill="#0b100f" font-weight="600">查看阻碍 · Command</text><rect x="88" y="1380" width="976" height="142" rx="16" fill="#101412" stroke="#405346" /><text x="112" y="1428" font-size="34" fill="#edf1e6" font-weight="400">原操作 A · 结果待确认</text><text x="112" y="1473" font-size="28" fill="#9ca89a" font-weight="400">查询原结果，不重新提交；查看 B 不改写 A。</text><text x="1130" y="1090" font-size="22" fill="#edf1e6" font-weight="600">文字重排，不是整图放大</text><text x="1130" y="1140" font-size="18" fill="#edf1e6" font-weight="400">本例原结果查询已获准；</text><text x="1130" y="1172" font-size="18" fill="#edf1e6" font-weight="400">无权限时须显示原因与返回。</text><text x="1130" y="1225" font-size="18" fill="#9ca89a" font-weight="400">下图是详情已关闭的 shell；</text><text x="1130" y="1257" font-size="18" fill="#9ca89a" font-weight="400">原结果查询是 shell 恢复目标，</text><text x="1130" y="1289" font-size="18" fill="#9ca89a" font-weight="400">不是回执组件已有按钮。</text><text x="48" y="1860" font-size="16" fill="#9ca89a" font-weight="400">既有终端 shell 与响应式合同的静态展开 · 示例非权限 / 坐标 / 世界结果事实</text><rect x="288" y="850" width="148" height="48" rx="12" fill="#101412" stroke="#405346" stroke-width="2" /><text x="304" y="882" font-size="18" fill="#edf1e6">World</text><rect x="452" y="850" width="148" height="48" rx="12" fill="#101412" stroke="#405346" stroke-width="2" /><text x="468" y="882" font-size="18" fill="#edf1e6">Targets</text><rect x="616" y="850" width="148" height="48" rx="12" fill="#101412" stroke="#d0a85b" stroke-width="2" /><text x="632" y="882" font-size="18" fill="#d0a85b">Command</text><text x="794" y="882" font-size="16" fill="#9ca89a">已打开</text><rect x="88" y="1538" width="976" height="64" rx="12" fill="#101412" stroke="#405346" stroke-width="2" /><text x="112" y="1583" font-size="32" fill="#edf1e6">查询原操作 A 的结果</text><rect x="88" y="1624" width="316" height="64" rx="12" fill="#101412" stroke="#d0a85b" stroke-width="2" /><text x="112" y="1668" font-size="32" fill="#d0a85b">World</text><rect x="418" y="1624" width="316" height="64" rx="12" fill="#101412" stroke="#405346" stroke-width="2" /><text x="442" y="1668" font-size="32" fill="#edf1e6">Targets</text><rect x="748" y="1624" width="316" height="64" rx="12" fill="#101412" stroke="#405346" stroke-width="2" /><text x="772" y="1668" font-size="32" fill="#edf1e6">Command</text><rect x="88" y="1708" width="300" height="58" rx="12" fill="#101412" stroke="#405346" stroke-width="2" /><text x="112" y="1748" font-size="28" fill="#edf1e6">更多</text><text x="420" y="1748" font-size="24" fill="#9ca89a">详情已关闭 · 可从 Command 再入</text><text x="1130" y="1345" font-size="18" fill="#9ca89a">真实缩放、触控、焦点与</text><text x="1130" y="1377" font-size="18" fill="#9ca89a">软键盘仍待设备验证。</text></g></svg>