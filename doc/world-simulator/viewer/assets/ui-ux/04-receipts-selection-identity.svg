<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img" aria-labelledby="title desc"><title id="title">查看 B，不改写原操作 A 的结果 · 设计目标 · 非运行截图</title><desc id="desc">04 / Action Receipt 独立身份 · 下列四张卡是互斥状态样本，不同时展示。静态设计参考，不表示当前运行能力；示例实体、位置和结果仅用于说明设计契约。</desc><rect width="100%" height="100%" fill="#0b100f"/><g font-family="Noto Sans CJK SC, Noto Sans, sans-serif"><text x="48" y="42" font-size="16" fill="#9ca89a" font-weight="400">OASIS7  /  VIEWER DESIGN CONTRACT</text><text x="48" y="85" font-size="32" fill="#edf1e6" font-weight="600">查看 B，不改写原操作 A 的结果</text><text x="48" y="119" font-size="18" fill="#9ca89a" font-weight="400">04 / Action Receipt 独立身份 · 下列四张卡是互斥状态样本，不同时展示</text><text x="1240" y="42" font-size="18" fill="#d0a85b" font-weight="400">设计目标 · 非运行截图</text><rect x="64" y="168" width="1472" height="98" rx="12" fill="#101412" stroke="#405346" /><rect x="88" y="194" width="210" height="32" rx="6" fill="#101412" stroke="#d0a85b" /><text x="100" y="217" font-size="16" fill="#d0a85b" font-weight="400">当前查看：B</text><text x="336" y="224" font-size="24" fill="#edf1e6" font-weight="400">原操作：op-示例-017 · 主体 A · 提交时上下文固定</text><text x="1100" y="224" font-size="20" fill="#88cbd0" font-weight="400">世界动态 ≠ 行动回执</text><rect x="64" y="310" width="716" height="312" rx="12" fill="#101412" stroke="#405346" /><rect x="88" y="332" width="324" height="32" rx="6" fill="#101412" stroke="#9ca89a" /><text x="100" y="355" font-size="16" fill="#9ca89a" font-weight="400">原操作 A · op-示例-017</text><text x="88" y="406" font-size="27" fill="#9ca89a" font-weight="600">01  等待世界确认</text><text x="88" y="446" font-size="19" fill="#9ca89a" font-weight="400">已接受 / 已排队不是完成。</text><text x="88" y="478" font-size="19" fill="#edf1e6" font-weight="400">结果：尚未确认效果。</text><text x="88" y="510" font-size="19" fill="#9ca89a" font-weight="400">下一步：等待原操作的权威回执。</text><rect x="88" y="550" width="280" height="32" rx="6" fill="#101412" stroke="#9ca89a" /><text x="100" y="573" font-size="16" fill="#9ca89a" font-weight="400">等待确认</text><rect x="820" y="310" width="716" height="312" rx="12" fill="#101412" stroke="#405346" /><rect x="844" y="332" width="324" height="32" rx="6" fill="#101412" stroke="#9ca89a" /><text x="856" y="355" font-size="16" fill="#9ca89a" font-weight="400">原操作 A · op-示例-017</text><text x="844" y="406" font-size="27" fill="#d0a85b" font-weight="600">02  结果待恢复</text><text x="844" y="446" font-size="19" fill="#9ca89a" font-weight="400">连接中断，原操作结果未知。</text><text x="844" y="478" font-size="19" fill="#edf1e6" font-weight="400">结果：未知；不得显示成功或失败。</text><text x="844" y="510" font-size="19" fill="#9ca89a" font-weight="400">下一步：按原操作标识查询结果。</text><rect x="844" y="542" width="280" height="48" rx="12" fill="#161d19" stroke="#405346" /><text x="860" y="573" font-size="18" fill="#edf1e6" font-weight="600">查询原操作结果</text><rect x="64" y="668" width="716" height="312" rx="12" fill="#101412" stroke="#405346" /><rect x="88" y="690" width="324" height="32" rx="6" fill="#101412" stroke="#9ca89a" /><text x="100" y="713" font-size="16" fill="#9ca89a" font-weight="400">原操作 A · op-示例-017</text><text x="88" y="764" font-size="27" fill="#e58f76" font-weight="600">03  请求被拒绝</text><text x="88" y="804" font-size="19" fill="#9ca89a" font-weight="400">原请求未获准执行。</text><text x="88" y="836" font-size="19" fill="#edf1e6" font-weight="400">原因：示例为缺少有效执行授权。</text><text x="88" y="868" font-size="19" fill="#9ca89a" font-weight="400">下一步：查看拒绝原因与授权条件。</text><rect x="88" y="900" width="280" height="48" rx="12" fill="#161d19" stroke="#405346" /><text x="104" y="931" font-size="18" fill="#edf1e6" font-weight="600">查看拒绝原因</text><rect x="820" y="668" width="716" height="312" rx="12" fill="#101412" stroke="#405346" /><rect x="844" y="690" width="324" height="32" rx="6" fill="#101412" stroke="#9ca89a" /><text x="856" y="713" font-size="16" fill="#9ca89a" font-weight="400">原操作 A · op-示例-017</text><text x="844" y="764" font-size="27" fill="#9ca89a" font-weight="600">04  已完成但没有推进</text><text x="844" y="804" font-size="19" fill="#9ca89a" font-weight="400">操作结束，不等于目标推进。</text><text x="844" y="836" font-size="19" fill="#edf1e6" font-weight="400">结果：权威回执明确没有产生推进。</text><text x="844" y="868" font-size="19" fill="#9ca89a" font-weight="400">下一步：查看阻碍，重新评估建议。</text><rect x="844" y="900" width="280" height="48" rx="12" fill="#161d19" stroke="#405346" /><text x="860" y="931" font-size="18" fill="#edf1e6" font-weight="600">查看阻碍</text><text x="64" y="1047" font-size="21" fill="#edf1e6" font-weight="400">不自动跳回 A，不把 B 的变化归因给 A，不用世界动态填补缺失效果。</text><text x="64" y="1084" font-size="20" fill="#d0a85b" font-weight="400">未知结果路径只查询原操作；「再试一次」不得重新提交一个新操作。</text><path d="M48 1142 L1552 1142" fill="none" stroke="#405346" stroke-width="2"/><text x="48" y="1172" font-size="16" fill="#9ca89a" font-weight="400">基线 main 7a89dbc8d240 · 2026-10-29 · 示例不代表运行事实 / 权限 / 坐标</text><text x="1415" y="1172" font-size="16" fill="#9ca89a" font-weight="400">UIUX / 04</text></g></svg>